<script>/* src/art/kirby.js */
// 卡比像素圖（art-kirby）—— 全部原創手繪 / 程序組合，面向右，anchor bottom
// 作法：以「橢圓遮罩聯集 → 1px 深藍輪廓 → 高光/陰影」產生圓滾滾身體，再貼上手繪的眼、嘴、腮紅、腳、武器。
(function () {
  const P = KB.PAL.kirby;
  // 擴充調色盤（武器 / 帽子 / 石頭高光）。基本字元沿用 KB.PAL.kirby。
  const PX = Object.assign({}, P, {
    f: '#ff9028', F: '#e83818',      // 橘 / 深橘（火焰）
    v: '#b8f0c8', V: '#309850',      // 劍身淡綠 / 劍緣綠
    n: '#48c048', N: '#207828',      // 綠 / 深綠（帽）
    u: '#4878f8', U: '#2040a8',      // 藍 / 深藍（帽）
    i: '#b8f0ff', I: '#58a8e0',      // 冰
    s: '#c8c8d0', S: '#70707a',      // 鐵
    t: '#c88850', T: '#805020',      // 木頭
    a: '#fff8c0',                    // 淡黃
    h: '#c8c8d0',                    // 石頭高光
    x: '#303030',
  });

  // ---------- 基本工具 ----------
  const blank = (w, h) => Array.from({ length: h }, () => '.'.repeat(w));
  function paste(base, patch, x, y) {
    const out = base.map(r => r.split(''));
    patch.forEach((row, j) => {
      for (let i = 0; i < row.length; i++) {
        const ch = row[i]; if (ch === '.' || ch === ' ') continue;
        const yy = y + j, xx = x + i;
        if (yy < 0 || yy >= out.length || xx < 0 || xx >= out[0].length) continue;
        out[yy][xx] = ch;
      }
    });
    return out.map(r => r.join(''));
  }
  const flipH = rows => rows.map(r => r.split('').reverse().join(''));
  function rot90(rows) {  // 順時針 90°
    const H = rows.length, W = rows[0].length, out = [];
    for (let y = 0; y < W; y++) { let s = ''; for (let x = 0; x < H; x++) s += rows[H - 1 - x][y]; out.push(s); }
    return out;
  }
  const rot180 = rows => rot90(rot90(rows));
  const rot270 = rows => rot90(rot180(rows));
  const recolor = (rows, map) => rows.map(r => r.split('').map(c => map[c] || c).join(''));
  const shift = (rows, w, h, dx, dy) => paste(blank(w, h), rows, dx, dy);

  // 橢圓：左上 (x,y)、寬 w、高 h
  const ell = (x, y, w, h) => ({ cx: x + w / 2, cy: y + h / 2, rx: w / 2 - 0.01, ry: h / 2 - 0.01 });
  const circ = (x, y, d) => ell(x, y, d, d);
  // 橢圓聯集 → 上色：edge 輪廓、fill 主色、hi 高光、lo 陰影（依第一個橢圓計算光影）
  function blob(w, h, shapes, cols) {
    cols = Object.assign({ fill: 'p', edge: 'k', hi: 'l', lo: 'P', shade: true }, cols || {});
    const inside = (x, y) => x >= 0 && y >= 0 && x < w && y < h && shapes.some(s => { const u = (x + 0.5 - s.cx) / s.rx, v = (y + 0.5 - s.cy) / s.ry; return u * u + v * v <= 1; });
    const m = shapes[0], rows = [];
    for (let y = 0; y < h; y++) {
      let r = '';
      for (let x = 0; x < w; x++) {
        if (!inside(x, y)) { r += '.'; continue; }
        if (!inside(x - 1, y) || !inside(x + 1, y) || !inside(x, y - 1) || !inside(x, y + 1)) { r += cols.edge; continue; }
        let c = cols.fill;
        if (cols.shade) {
          const u = (x + 0.5 - m.cx) / m.rx, v = (y + 0.5 - m.cy) / m.ry, d = Math.sqrt(u * u + v * v), a = Math.atan2(v, u) * 180 / Math.PI;
          if (d > 0.72 && a > 12 && a < 118) c = cols.lo;
          else if (d > 0.88 && ((a >= 118 && a < 150) || (a <= 12 && a > -15))) c = cols.lo;
          else if (d > 0.56 && d < 0.8 && a < -112 && a > -150) c = cols.hi;
        }
        r += c;
      }
      rows.push(r);
    }
    return rows;
  }

  // ---------- 零件（面向右） ----------
  const EYE = ['.k.', 'wkk', 'kkk', 'kkk', 'bbb', '.b.'];          // 3×6 標準眼
  const EYE_HALF = ['kkk', 'kkk', 'bbb', '.b.'];                  // 半閉（含物）
  const EYE_SHUT = ['kkk'];                                        // 閉眼
  const EYE_HAPPY = ['k.k', '.k.'];                                // ^ 開心（倒 v 形）
  const EYE_HAPPY2 = ['.k.', 'k.k'];                               // ^ 形
  const EYE_X = ['k.k', '.k.', 'k.k'];                             // X
  const EYE_GT = ['k..', '.kk', 'k..'];                            // >
  const EYE_LT = ['..k', 'kk.', '..k'];                            // <
  const EYE_SQUINT = ['kkk', 'kkk', 'bb.'];                        // 用力瞇眼
  const MOUTH = ['k..k', '.kk.'];                                  // 微笑
  const MOUTH_O = ['.kk.', 'kmmk', '.kk.'];                        // 小 o
  const MOUTH_LINE = ['kk'];                                       // 抿嘴
  const MOUTH_WIDE = ['k.....k', '.kkkkk.'];                       // 含物閉嘴
  const MOUTH_OPEN = ['.kkk.', 'kmmmk', 'kmmmk', '.kkk.'];         // 張嘴（小）
  const mouthBig = (w, h) => blob(w, h, [ell(0, 0, w, h)], { fill: 'm', edge: 'k', shade: false });
  const CHEEK = ['cc', 'cc'];
  const CHEEK_BIG = ['ccc', 'ccc'];
  const FOOT = [                                                    // 8×5 腳（正面）
    '..kkkk..',
    '.krrrrk.',
    'krrrrrrk',
    'kRRRRRRk',
    '.kkkkkk.',
  ];
  const FOOT_SIDE = rot90(FOOT);                                    // 5×8（腳朝側面 / 游泳）

  // ---------- 組合器 ----------
  // 標準 20×20 卡比：body [x,y,d]、arms [[x,y,d]...]（與身體聯集）、feet [[x,y]]（前景）、feetBack（背景）
  // ox/oy 為整體位移（放進較大幀用）；dy 為身體/臉上下起伏（腳不動）
  function kirby(o) {
    o = Object.assign({
      w: 20, h: 20, ox: 0, oy: 0, dy: 0,
      body: [2, 1, 16], arms: [[15, 8, 5], [0, 8, 5]],
      eyes: EYE, eyeAt: [[7, 5], [12, 5]],
      mouth: MOUTH, mouthAt: [9, 12],
      cheeks: CHEEK, cheekAt: [[4, 10], [15, 10]],
      feet: [[1, 15], [11, 15]], feetBack: [], foot: FOOT,
      back: [], front: [], cols: null,
    }, o);
    const X = o.ox, Y = o.oy + o.dy;
    let f = blank(o.w, o.h);
    for (const [p, x, y] of o.back) f = paste(f, p, x + X, y + Y);
    for (const [x, y, p] of o.feetBack) f = paste(f, p || o.foot, x + o.ox, y + o.oy);
    const shapes = [circ(o.body[0] + X, o.body[1] + Y, o.body[2])];
    for (const [x, y, d] of o.arms) shapes.push(circ(x + X, y + Y, d));
    f = paste(f, blob(o.w, o.h, shapes, o.cols), 0, 0);
    if (o.cheeks) for (const [x, y] of o.cheekAt) f = paste(f, o.cheeks, x + X, y + Y);
    if (o.eyes) {
      const es = Array.isArray(o.eyes[0]) ? o.eyes : [o.eyes, o.eyes];
      o.eyeAt.forEach(([x, y], i) => { f = paste(f, es[i], x + X, y + Y); });
    }
    if (o.mouth) f = paste(f, o.mouth, o.mouthAt[0] + X, o.mouthAt[1] + Y);
    for (const [x, y, p] of o.feet) f = paste(f, p || o.foot, x + o.ox, y + o.oy);
    for (const [p, x, y] of o.front) f = paste(f, p, x + X, y + Y);
    return f;
  }
  const S = (name, frames, opts) => KB.sprite(name, PX, frames, opts);

  // ============================================================
  //  基本動作（20×20）
  // ============================================================
  // 站立：幀1 眨眼
  S('kirby_idle', [
    kirby({}),
    kirby({ eyes: EYE_SHUT, eyeAt: [[7, 9], [12, 9]] }),
  ], { fps: 2 });

  // 走路 4 幀：腳前後交替、身體 1px 起伏
  S('kirby_walk', [
    kirby({ feet: [[12, 15]], feetBack: [[0, 14]] }),
    kirby({ dy: -1, feet: [[2, 15], [10, 15]] }),
    kirby({ feet: [[0, 15]], feetBack: [[12, 14]] }),
    kirby({ dy: -1, feet: [[2, 15], [10, 15]] }),
  ], { fps: 8 });

  // 跑步：身體前傾（臉往右下）、雙手往後、步幅大
  const runBase = { eyeAt: [[8, 6], [13, 6]], mouthAt: [10, 13], cheekAt: [[5, 11], [14, 11]], arms: [[0, 5, 5], [0, 10, 5]] };
  S('kirby_run', [
    kirby(Object.assign({}, runBase, { feet: [[12, 15]], feetBack: [[0, 13]] })),
    kirby(Object.assign({}, runBase, { dy: -1, feet: [[3, 15], [9, 15]] })),
    kirby(Object.assign({}, runBase, { feet: [[0, 15]], feetBack: [[12, 13]] })),
    kirby(Object.assign({}, runBase, { dy: -1, feet: [[2, 15], [10, 15]] })),
  ], { fps: 12 });

  // 跳躍：雙手舉起、腳併攏
  S('kirby_jump', [kirby({ arms: [[16, 3, 4], [0, 3, 4]], feet: [[2, 15], [10, 15]] })]);
  // 下落：手張開、腳張開、嘴微張
  S('kirby_fall', [kirby({ arms: [[15, 6, 5], [0, 6, 5]], feet: [[0, 15], [12, 15]], mouth: MOUTH_O, mouthAt: [9, 12] })]);
  // 翻滾 4 幀：整隻旋轉（球置中，手縮起）
  const flipBase = kirby({ body: [2, 2, 16], arms: [], eyeAt: [[7, 6], [12, 6]], mouthAt: [9, 13], cheekAt: [[4, 11], [15, 11]], feet: [[2, 15], [10, 15]] });
  S('kirby_flip', [flipBase, rot90(flipBase), rot180(flipBase), rot270(flipBase)], { fps: 12 });

  // ============================================================
  //  漂浮 / 吸入 / 含物（24×24）
  // ============================================================
  // 漂浮體：20px 大圓、臉頰鼓起、嘴鼓成小圓
  const floatK = o => kirby(Object.assign({
    w: 24, h: 24, body: [2, 2, 20], arms: [[19, 9, 5], [0, 9, 5]],
    eyeAt: [[9, 7], [14, 7]], cheeks: CHEEK_BIG, cheekAt: [[5, 12], [18, 12]],
    mouth: MOUTH_O, mouthAt: [12, 14], feet: [[4, 19], [13, 19]],
  }, o));
  // 含物體：22px 大圓、眼睛半閉、嘴抿成寬線
  const fullK = o => kirby(Object.assign({
    w: 24, h: 24, body: [1, 1, 22], arms: [[19, 10, 5], [0, 10, 5]],
    eyes: EYE_HALF, eyeAt: [[9, 8], [14, 8]], cheeks: CHEEK_BIG, cheekAt: [[5, 11], [18, 11]],
    mouth: MOUTH_WIDE, mouthAt: [9, 14], feet: [[3, 19], [13, 19]],
  }, o));
  // 標準體放進 24×24 幀（底部對齊、水平置中）
  const stdK = o => kirby(Object.assign({ w: 24, h: 24, ox: 2, oy: 4 }, o));

  // 漂浮 4 幀：一次拍動（手上 → 平 → 下 → 平）
  S('kirby_float', [
    floatK({ arms: [[20, 3, 4], [0, 3, 4]] }),
    floatK({ arms: [[19, 8, 5], [0, 8, 5]] }),
    floatK({ arms: [[18, 14, 5], [1, 14, 5]] }),
    floatK({ arms: [[19, 8, 5], [0, 8, 5]] }),
  ], { fps: 5 });

  // 吸入 2 幀：嘴巴大張成黑色橢圓、眼睛擠上去、腳張開（22×20，身體略前傾）
  const inhaleBase = { w: 22, h: 20, ox: 1, eyeAt: [[7, 4], [11, 4]], cheekAt: [[4, 10]], feet: [[0, 15], [12, 15]], arms: [[0, 8, 5], [15, 8, 5]] };
  S('kirby_inhale', [
    kirby(Object.assign({}, inhaleBase, { mouth: mouthBig(7, 5), mouthAt: [12, 9] })),
    kirby(Object.assign({}, inhaleBase, { mouth: mouthBig(9, 6), mouthAt: [12, 8], eyeAt: [[7, 3], [11, 3]] })),
  ], { fps: 8 });

  // 含物站立 2 幀（幀1 眼睛閉緊）
  S('kirby_full_idle', [
    fullK({}),
    fullK({ eyes: EYE_SHUT, eyeAt: [[9, 10], [14, 10]] }),
  ], { fps: 2 });
  // 含物走路 4 幀
  S('kirby_full_walk', [
    fullK({ feet: [[14, 19]], feetBack: [[2, 18]] }),
    fullK({ dy: -1, feet: [[4, 19], [12, 19]] }),
    fullK({ feet: [[2, 19]], feetBack: [[14, 18]] }),
    fullK({ dy: -1, feet: [[4, 19], [12, 19]] }),
  ], { fps: 8 });
  // 含物跳躍
  S('kirby_full_jump', [fullK({ arms: [[19, 4, 5], [0, 4, 5]], feet: [[4, 19], [12, 19]] })]);

  // 吐出 2 幀：大身體張大嘴 → 恢復原狀張嘴
  S('kirby_spit', [
    fullK({ eyes: EYE_SQUINT, eyeAt: [[8, 7], [12, 7]], cheekAt: [[5, 11]], mouth: mouthBig(9, 7), mouthAt: [13, 11] }),
    stdK({ mouth: MOUTH_OPEN, mouthAt: [10, 11], cheekAt: [[4, 10]] }),
  ], { fps: 10 });
  // 吞下 2 幀：閉眼閉嘴 → 恢復、開心
  S('kirby_swallow', [
    fullK({ eyes: EYE_SHUT, eyeAt: [[9, 10], [14, 10]], mouth: MOUTH_LINE, mouthAt: [12, 15] }),
    stdK({ eyes: EYE_HAPPY2, eyeAt: [[7, 8], [12, 8]] }),
  ], { fps: 10 });
  // 漂浮吐氣 2 幀：大身體張嘴 → 恢復原狀
  S('kirby_exhale', [
    floatK({ mouth: mouthBig(5, 4), mouthAt: [14, 13], arms: [[19, 8, 5], [0, 8, 5]] }),
    stdK({ mouth: MOUTH_O, mouthAt: [9, 12], arms: [[15, 6, 5], [0, 6, 5]] }),
  ], { fps: 10 });

  // ============================================================
  //  滑鏟 / 蹲下 / 受傷 / 死亡 / 游泳 / 爬梯 / 進門 / 跳舞 / 石頭
  // ============================================================
  const EYE_SHORT = ['.k.', 'wkk', 'kkk', 'bbb'];                 // 3×4 壓扁的眼
  // 滑鏟 24×12：壓扁向前伸、腳在後
  (function () {
    let f = blank(24, 12);
    f = paste(f, FOOT, 0, 7); f = paste(f, FOOT, 1, 3);
    f = paste(f, blob(24, 12, [ell(5, 2, 18, 10), circ(20, 3, 4)]), 0, 0);
    f = paste(f, CHEEK, 9, 7); f = paste(f, CHEEK, 20, 7);
    f = paste(f, EYE_SHORT, 12, 4); f = paste(f, EYE_SHORT, 16, 4);
    f = paste(f, MOUTH, 14, 8);
    S('kirby_slide', [f]);
  })();
  // 蹲下 20×13：寬 20 高 11 的橢圓，腳從兩側露出
  (function () {
    let f = blank(20, 13);
    f = paste(f, blob(20, 13, [ell(0, 0, 20, 11)]), 0, 0);
    f = paste(f, CHEEK, 3, 6); f = paste(f, CHEEK, 15, 6);
    f = paste(f, EYE_SHORT, 7, 3); f = paste(f, EYE_SHORT, 12, 3);
    f = paste(f, MOUTH, 9, 8);
    f = paste(f, FOOT, 1, 8); f = paste(f, FOOT, 11, 8);
    S('kirby_crouch', [f]);
  })();
  // 受傷：> < 眼、張嘴、手舉起、腳張開

  S('kirby_door', [

    backK({ dy: -1, feet: [[2, 15], [10, 15]] }),

  // 過關跳舞 6 幀（24×24）：舉手 → 放下 → 跳起 → 轉身 → 跳起 → 落地
  S('kirby_dance', [
    stdK({ arms: [[15, 2, 5], [0, 2, 5]], eyes: EYE_HAPPY2, eyeAt: [[7, 8], [12, 8]], mouth: MOUTH_OPEN, mouthAt: [9, 11], feet: [[0, 15], [12, 15]] }),
    stdK({ arms: [[15, 9, 5], [0, 9, 5]], feet: [[2, 15], [10, 15]] }),
    stdK({ dy: -3, arms: [[15, 2, 5], [0, 2, 5]], eyes: EYE_HAPPY2, eyeAt: [[7, 8], [12, 8]], mouth: MOUTH_OPEN, mouthAt: [9, 11], feet: [[3, 12], [9, 12]] }),
    stdK({ eyes: null, mouth: null, cheeks: null, arms: [[15, 6, 5], [0, 6, 5]], feet: [[1, 15], [11, 15]] }),
    stdK({ dy: -3, arms: [[15, 2, 5], [0, 2, 5]], mouth: MOUTH_OPEN, mouthAt: [9, 11], feet: [[3, 12], [9, 12]] }),
    stdK({ arms: [[15, 10, 5], [0, 10, 5]], eyes: EYE_HAPPY2, eyeAt: [[7, 8], [12, 8]], mouth: MOUTH_OPEN, mouthAt: [9, 11], feet: [[0, 15], [12, 15]] }),
  ], { fps: 6 });
  // 石頭形態：3 種外觀，abilities.js 每次變身隨機把 KB.SPR.kirby_stone 指向其中一個
  // 1. 岩石：灰色石像（保留卡比輪廓，眼睛也是石頭）
  const STONE_ROCK = recolor(kirby({}), { p: 'g', P: 'G', l: 'h', k: 'd', r: 'G', R: 'd', w: 'h', b: 'G', c: 'g', m: 'd' });
  S('kirby_stone', [STONE_ROCK]);
  S('kirby_stone_1', [STONE_ROCK]);
  // 2. 石像：沙岩雕像 + 方形底座（閉眼、抿嘴、無腳）
  const SAND = { '1': '#d8c4a0', '2': '#a08858', '3': '#5a4830' };
  const PEDESTAL = [
    '.3333333333333333.',
    '.3222222222222223.',
    '.3211111111111123.',
    '.3333333333333333.',
  ];
  const STONE_STATUE = paste(

<script>/* src/art/bosses.js */
// 魔王像素圖（art-bosses）
// 規則：全部面向右、anchor = bottom（底部中央 = 實體 cx/bottom）；程式端 dir<0 時自動水平翻轉。
// 本檔在 world.js 之前載入，故自備 grid/disc/ellipse/outline 等程序式畫布工具。
// 調色：以 KB.PAL.enemy 為底再擴充（見下方 P）。'.' 與 ' ' 為透明；未定義字元會在 console 警告並畫成洋紅。
(function () {
  // ---------------------------------------------------------------------------
  // 調色盤
  // ---------------------------------------------------------------------------
  const P = Object.assign({}, KB.PAL.enemy, {
    x: '#000000', n: '#ffe8c8', N: '#e8c090',
    // 樹皮 / 木頭：h 亮、j 中、J 暗、u 最暗
    h: '#c89058', j: '#9a6638', J: '#5c3a1c', u: '#3a2410',
    // 樹葉：v 亮綠、V 最深綠（g / G 來自 enemy）
    v: '#90e858', V: '#164e18',
    // 雲：W 雲陰影、E 雲深陰影、Q 柔和輪廓（深藍灰）
    W: '#d0d4e6', E: '#aeb4cc', Q: '#2c3350',
    // 魅塔騎士：d 身體藍紫、D 身體暗、z 身體亮
    d: '#4050b0', D: '#262c7a', z: '#7484dc',
    // 其他
    a: '#d8f4ff', q: '#1a1e48', X: '#ff8878', A: '#f4c060',
  });
  const pal = ext => (ext ? Object.assign({}, P, ext) : P);

  // ---------------------------------------------------------------------------
  // 畫布工具（字元格）
  // ---------------------------------------------------------------------------
  const grid = (w, h) => Array.from({ length: h }, () => Array(w).fill('.'));
  const rowsOf = g => g.map(r => r.join(''));
  const W = g => g[0].length, H = g => g.length;
  const inb = (g, x, y) => y >= 0 && y < g.length && x >= 0 && x < g[0].length;
  const get = (g, x, y) => (inb(g, x, y) ? g[y][x] : '.');
  const px = (g, x, y, ch) => { if (inb(g, x, y)) g[y][x] = ch; };
  const rect = (g, x, y, w, h, ch) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) px(g, x + i, y + j, ch); };
  const disc = (g, cx, cy, r, ch) => { for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r + r * 0.6) px(g, cx + x, cy + y, ch); };
  const ellipse = (g, cx, cy, rx, ry, ch) => { for (let y = -ry; y <= ry; y++) for (let x = -rx; x <= rx; x++) if ((x * x) / (rx * rx + 0.5) + (y * y) / (ry * ry + 0.5) <= 1) px(g, cx + x, cy + y, ch); };
  const line = (g, x0, y0, x1, y1, ch) => {
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let err = dx + dy;
    for (; ;) { px(g, x0, y0, ch); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 >= dy) { err += dy; x0 += sx; } if (e2 <= dx) { err += dx; y0 += sy; } }
  };
  // 多邊形填色（頂點陣列 [[x,y],...]，掃描線）
  const poly = (g, pts, ch) => {
    const ys = pts.map(p => p[1]); const y0 = Math.min(...ys), y1 = Math.max(...ys);
    for (let y = y0; y <= y1; y++) {
      const xs = [];
      for (let i = 0; i < pts.length; i++) {
        const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length];
        if ((ay <= y && by > y) || (by <= y && ay > y)) xs.push(ax + (y - ay) * (bx - ax) / (by - ay));
      }
      xs.sort((a, b) => a - b);
      for (let i = 0; i + 1 < xs.length; i += 2) for (let x = Math.round(xs[i]); x <= Math.round(xs[i + 1]); x++) px(g, x, y, ch);
    }
    pts.forEach((p, i) => { const q = pts[(i + 1) % pts.length]; line(g, p[0], p[1], q[0], q[1], ch); });
  };
  // 內側輪廓：非透明且四鄰為透明（或超出）的像素改為 ch；only 限制可被改的字元
  const outline = (g, ch, only) => {
    const h = H(g), w = W(g), src = g.map(r => r.slice());
    const tr = (x, y) => x < 0 || y < 0 || x >= w || y >= h || src[y][x] === '.';
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (src[y][x] === '.') continue; if (only && !only.includes(src[y][x])) continue;
      if (tr(x - 1, y) || tr(x + 1, y) || tr(x, y - 1) || tr(x, y + 1)) g[y][x] = ch;
    }
  };
  // 邊緣打光：字元 from 的像素，若朝 (dx,dy) 方向 dist 格內碰到透明/非 from，改為 to（用於亮部/暗部）
  const rim = (g, from, to, dx, dy, dist) => {
    const src = g.map(r => r.slice());
    for (let y = 0; y < H(g); y++) for (let x = 0; x < W(g); x++) {
      if (src[y][x] !== from) continue;
      for (let d = 1; d <= (dist || 1); d++) {
        const c = get(src, x + dx * d, y + dy * d);
        if (c !== from) { g[y][x] = to; break; }
      }
    }
  };
  // 將 rows（字串陣列）貼到 g；'.' / ' ' 不覆蓋
  const blit = (g, rows, x, y) => { rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) if (r[i] !== '.' && r[i] !== ' ') px(g, x + i, y + j, r[i]); }); };
  const blitG = (g, src, x, y) => blit(g, rowsOf(src), x, y);
  const flipH = rows => rows.map(r => r.split('').reverse().join(''));
  const replace = (g, from, to) => { for (const r of g) for (let i = 0; i < r.length; i++) if (r[i] === from) r[i] = to; };
  // 檢查：每幀尺寸一致、所有字元都在調色盤內
  function check(name, frames, p) {
    const w = frames[0][0].length, h = frames[0].length, bad = new Set();
    frames.forEach((f, i) => {
      if (f.length !== h || f.some(r => r.length !== w)) console.warn('[art-bosses] 幀尺寸不一致', name, i);
      for (const r of f) for (const ch of r) if (ch !== '.' && ch !== ' ' && !p[ch]) bad.add(ch);
    });
    if (bad.size) console.warn('[art-bosses] 未定義字元', name, [...bad].join(''));
  }
  // 註冊：frames 為 grid 陣列
  function S(name, grids, opts, ext) {
    const p = pal(ext), frames = grids.map(g => (typeof g[0] === 'string' ? g : rowsOf(g)));
    check(name, frames, p);
    return KB.sprite(name, p, frames, Object.assign({ anchor: 'bottom' }, opts || {}));
  }

  // ===========================================================================
  // W1 大樹威斯比（64×96）：棕色樹幹有臉、多層綠色樹冠、露出的樹根
  // ===========================================================================
  const WW = 64, WH = 96;
  // 樹冠：back 層（深綠、較大、偏下）+ front 層（中綠、偏上）+ 高光；各層各自描邊後疊上，形成葉叢層次
  function crownLayer(discs, fill, hi, lo, k) {
    const g = grid(WW, 60);
    for (const [cx, cy, r] of discs) disc(g, cx, cy, r, fill);
    if (hi) rim(g, fill, hi, -1, -1, 2);
    if (lo) rim(g, fill, lo, 1, 1, 2);
    if (k) outline(g, k);
    return g;
  }
  function crown(sway, droop) {
    const g = grid(WW, 60);
    const s = sway || 0, d = droop || 0;
    // 後層：深綠
    blitG(g, crownLayer([[10, 36 + d, 10], [54, 36 + d, 10], [17, 22 + d, 12], [47, 22 + d, 12], [32 + s, 11, 11], [32, 29 + d, 13]], 'G', null, 'V', 'k'), 0, 0);
    // 中層：主綠
    blitG(g, crownLayer([[14 + s, 30 + d, 9], [50 + s, 30 + d, 9], [23 + s, 17, 10], [41 + s, 17, 10], [32, 26 + d, 11]], 'g', 'v', 'G', 'k'), 0, 0);
    // 前層：小葉叢（亮）
    blitG(g, crownLayer([[32 + s, 8, 7], [20 + s, 27 + d, 6], [44 + s, 27 + d, 6]], 'g', 'v', 'G', 'k'), 0, 0);
    // 蘋果（與掉蘋果攻擊呼應）
    const apple = (x, y) => { disc(g, x, y, 2, 'r'); px(g, x + 1, y + 1, 'R'); px(g, x + 2, y, 'R'); px(g, x, y + 2, 'R'); px(g, x - 1, y - 1, 'X'); px(g, x, y - 3, 'J'); outline(g, 'k', 'rRX'); };
    apple(12 + s, 38 + d); apple(46 + s, 20); apple(55 + s, 36 + d); apple(28 + s, 33 + d);
    return g;
  }
  // 樹幹 + 樹根（整張 64×96）
  function trunk() {
    const g = grid(WW, WH);
    // 主幹（略往下加寬）
    for (let y = 24; y < 84; y++) { const wdn = y >= 66 ? Math.floor((y - 66) / 6) : 0; rect(g, 19 - wdn, y, 26 + wdn * 2, 1, 'j'); }
    // 底部外擴 + 樹根瓣
    for (let y = 84; y < WH; y++) { const e = (y - 84); rect(g, 16 - e, y, 32 + e * 2, 1, 'j'); }
    ellipse(g, 9, 91, 9, 4, 'j'); ellipse(g, 55, 91, 9, 4, 'j');
    ellipse(g, 4, 94, 4, 2, 'j'); ellipse(g, 60, 94, 4, 2, 'j');
    // 打光：左亮右暗
    rim(g, 'j', 'h', -1, 0, 3); rim(g, 'j', 'J', 1, 0, 4);
    for (let y = 84; y < WH; y++) for (let x = 0; x < WW; x++) if (g[y][x] === 'j' && x > 34) g[y][x] = 'J';
    rim(g, 'j', 'J', 0, 1, 1);
    // 樹皮紋理：短直線
    const bark = [[26, 30, 6, 'J'], [33, 36, 5, 'J'], [38, 42, 7, 'u'], [25, 70, 6, 'J'], [31, 76, 5, 'J'], [39, 74, 6, 'u'], [22, 48, 4, 'h'], [22, 60, 5, 'h'], [27, 80, 3, 'J'], [36, 64, 4, 'u']];
    for (const [x, y, l, c] of bark) line(g, x, y, x, y + l, c);
    // 根部溝紋
    line(g, 14, 88, 10, 95, 'u'); line(g, 22, 86, 20, 95, 'u'); line(g, 42, 86, 44, 95, 'u'); line(g, 50, 88, 54, 95, 'u');
    // 樹瘤（左下）
    ellipse(g, 24, 77, 3, 2, 'J'); ellipse(g, 24, 77, 2, 1, 'u'); px(g, 23, 76, 'h');
    outline(g, 'k');
    return g;
  }
  // 臉：貼在樹幹上（局部座標，寬 30 高 34，貼於 x=18, y=44），面向右；鼻子突出樹幹右緣
  const EYE_OPEN = ['.kkk.', 'kkkkk', 'kkwkk', 'kkkkk', '.kkk.'];
  const EYE_BLINK = ['.....', '.....', 'kkkkk', '.....', '.....'];
  const EYE_HURT = ['k...k', '.k.k.', '..k..', '.....', '.....'];      // 皺眉
  function face(mode, opts) {
    opts = opts || {};
    const g = grid(30, 40);
    const eye = mode === 'hurt' ? EYE_HURT : (opts.blink ? EYE_BLINK : EYE_OPEN);

    ddRobe(g, cx, by - 1, squash, flare);

    for (let i = 0; i <= n; i++) {
      const u = i / n, v = 1 - u;
      const x = Math.round(v * v * x0 + 2 * v * u * cx + u * u * x1), y = Math.round(v * v * y0 + 2 * v * u * cy + u * u * y1);
      for (let k = 0; k < (thick || 1); k++) px(g, x, y + k, ch);
    }
  }
  // 圓環（1px）
  function ring(g, cx, cy, r, ch) {
    for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) { const d = x * x + y * y; if (d <= r * r + r * 0.6 && d > (r - 1) * (r - 1) + (r - 1) * 0.6) px(g, cx + x, cy + y, ch); }
  }
  // 清除區域（設為透明）
  function clear(g, x, y, w, h) { rect(g, x, y, w, h, '.'); }

  // ============================================================================
  // cloud 泡泡雲海 —— 白色蓬鬆雲磚（邊緣圓潤、淡藍陰影）；平台為小雲
  // ============================================================================
  (function cloud() {
    const P = PAL.cloud;

      for (const [x, y] of [[10, 1], [1, 7], [14, 9]]) px(g, x, y, 'h');
    });
    const top = [
      '..dddd....dddd..',
      '.dhhhhd..dhhhhd.',
      'dhwwwwhddhwwwwhd',
    ].concat(fill.slice(3));
    ground('cloud', P, top, fill, { lk: 'd', ls: 'W', rk: 'd', rs: 'W', bk: 'd', bs: 'W', topEdgeFrom: 3 });
    tile('tile_cloud_bottom', P, fill.slice(0, 13).concat([
      'dWwwwwWddWwwwwWd',
      '.dWwwwd..dWwwwd.',
      '..dddd....dddd..',

    platform('cloud', P, [
      '....dddd..ddd...',
      '..ddhhhhddhhhd..',
      '.dhwwwwwwwwwwwd.',
      'dhwwwwwwwwwwwwwd',
      'dwwwwwwwwwwwwwwd',
      'dWWwwwwwwwwwwWWd',
      '.ddWWWWWWWWWWdd.',
    ]);
    slopes('cloud', P, fill, ['d', 'h', 'w', 'w', 'e']);

    // ---- 裝飾 ----
    // c 雲朵 32×16
    const puff = (w, h, parts) => mk(w, h, g => {
      for (const [cx, cy, r] of parts) disc(g, cx, cy, r, 'w');
      outline(g, 'd');
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        if (g[y][x] !== 'w') continue;
        if (y >= h - 3 && g[y + 1] && g[y + 1][x] !== '.') g[y][x] = 'e';
        if (g[y + 1] && g[y + 1][x] === 'd') g[y][x] = 'W';
        if (g[y - 1] && g[y - 1][x] === 'd') g[y][x] = 'h';
      }
    });
    deco('deco_cloud_c', P, puff(32, 16, [[6, 11, 5], [12, 8, 7], [20, 7, 7], [26, 11, 5], [16, 12, 4]]));
    // d 小雲 16×8
    deco('deco_cloud_d', P, puff(16, 8, [[4, 5, 3], [8, 4, 4], [12, 5, 3]]));
    // s 星星 12×12（2 幀）
    const star0 = [
      '.....oo.....',
      '.....oo.....',
      '....oyyo....',
      '....oyyo....',
      'ooooylyyoooo',
      '.oyyyllyyyo.',
      '..oyyllyyo..',
      '..oyyyyyyo..',
      '.oyyyooyyyo.',
      '.oyyo..oyyo.',
      'oyo......oyo',
      'oo........oo',
    ];
    const star1 = star0.map(r => r.replace(/y/g, 'l').replace(/l/g, 'l'));

    // r 彩虹 48×24
    deco('deco_cloud_r', P, mk(48, 24, g => {
      const cols = ['r', 'o', 'l', 'g', 'c', 'v'];
      for (let i = 0; i < cols.length; i++) {
        for (let rr = 24 - i * 2; rr > 24 - i * 2 - 2; rr -= 0.5) {
          for (let a = 0; a <= 180; a += 0.6) { const t = a * Math.PI / 180; const x = Math.round(23.5 + Math.cos(t) * rr), y = Math.round(23 - Math.sin(t) * rr); if (y >= 0 && y < 24) px(g, x, y, cols[i]); }
        }
      }
      for (let y = 0; y < 24; y++) for (let x = 0; x < 48; x++) { const dx = x - 23.5, dy = 23 - y; if (dx * dx + dy * dy < 12 * 12) g[y][x] = '.'; }
    }));
    // b 泡泡 12×20（2 幀）
    const bub = list => mk(12, 20, g => { for (const [cx, cy, r] of list) { ring(g, cx, cy, r, 'c'); px(g, cx - Math.floor(r / 2), cy - Math.floor(r / 2), 'h'); if (r > 2) px(g, cx - Math.floor(r / 2) + 1, cy - Math.floor(r / 2), 'h'); } });
    deco('deco_cloud_b', P, [bub([[6, 15, 4], [3, 6, 2], [9, 9, 2]]), bub([[6, 14, 4], [3, 4, 2], [9, 7, 2], [7, 2, 1]])], { fps: 2 });
    // m 月亮 16×16
    deco('deco_cloud_m', P, mk(16, 16, g => {
      disc(g, 7, 8, 7, 'y'); disc(g, 10, 7, 6, '.');

      '...kkyyyyyykk...',

      '.kyhYYYYYYYYhyk.',

      'kyhYDDDDDDDDDYyk',

      'kyhYDDDDDDDDDYyk',

      'kyhYDDDDDDpDDYyk',
      'kyhYDDDDDDDDDYyk',
      'kyhYDDDDDDDDDYyk',
      'kyhYYYYYYYYYYYyk',
      'kyhYDDDDDDDDDYyk',

      'kyhYDDDDDDDDDYyk',
      'kyhYDDDDDDwDDYyk',

      'kyhYDDDDDDDDDYyk',
      'kyhYDDDDDDDDDYyk',

    // t 火炬 8×24（2 幀，金托架）
    const tBase = [

    const tF0 = [

    // s 雕像 24×40（圓滾滾的國王石像 + 基座）

  // ============================================================================
  // green 裝飾
  // ============================================================================
  (function greenDeco() {
    const P = PAL.green;
    // t 大樹 32×48
    deco('deco_green_t', P, mk(32, 48, g => {
      rect(g, 12, 26, 8, 22, 'd'); rect(g, 17, 26, 3, 22, 'D'); rect(g, 13, 27, 1, 20, 'q');

      disc(g, 16, 14, 13, 'G'); disc(g, 8, 21, 7, 'G'); disc(g, 24, 21, 7, 'G'); disc(g, 16, 24, 8, 'G');
      disc(g, 16, 13, 11, 'g'); disc(g, 9, 20, 5, 'g'); disc(g, 23, 20, 5, 'g');
      disc(g, 11, 9, 4, 'l'); disc(g, 8, 18, 2, 'l'); px(g, 18, 5, 'l'); px(g, 19, 5, 'l');
      for (const [x, y] of [[20, 15], [12, 22], [25, 23]]) { px(g, x, y, 'r'); px(g, x + 1, y, 'r'); px(g, x, y + 1, 'r'); px(g, x + 1, y + 1, 'r'); px(g, x, y, 'p'); }
      outline(g, 'E', ['g', 'G', 'l']);
    }));
    // b 灌木 24×14
    deco('deco_green_b', P, mk(24, 14, g => {
      ellipse(g, 11, 9, 11, 4, 'G'); disc(g, 6, 8, 5, 'G'); disc(g, 13, 6, 6, 'G'); disc(g, 18, 8, 5, 'G');

      px(g, 5, 6, 'l'); px(g, 12, 3, 'l'); px(g, 13, 3, 'l'); px(g, 17, 6, 'l');
      px(g, 9, 9, 'r'); px(g, 16, 8, 'r'); px(g, 4, 10, 'r');
      outline(g, 'E');
    }));
    // f 花叢 16×10
    deco('deco_green_f', P, mk(16, 10, g => {
      for (let x = 0; x < 16; x++) { const h = 2 + ((x * 7) % 3); rect(g, x, 10 - h, 1, h, (x % 3) ? 'g' : 'G'); if (h === 4) px(g, x, 10 - h, 'l'); }

    deco('deco_green_w', P, [
      '.kkk.......kkk..',
      'kdddk.....kdddk.',
      'kddDk.....kddDk.',

  // @@CONTINUE@@

  // ============================================================================
  // 預覽：切換目前房間的主題並塞入示範裝飾（tools/theme_shot.py 使用）
  // ============================================================================
  KB.DECO_CHARS = { green: 'tbfsgmrw', castle: 'pwrkacb', island: 'purghsb', cloud: 'csrbdm', dedede: 'pkwtscb' };
  KB.previewTheme = function (theme) {
    const gm = KB.game; if (!gm || !gm.map) return false;
    const chars = KB.DECO_CHARS[theme] || '';
    gm.theme = theme; gm.room.bg = theme;
    const m = gm.map, d = [];
    for (let y = 0; y < m.h; y++) d.push(new Array(m.w).fill('.'));
    let i = 0;
    for (let tx = 1; tx < m.w; tx += 3) {
      let ty = -1;
      for (let y = 0; y < m.h; y++) if (m.rows[y][tx] === '#') { ty = y; break; } else if (KB.TileMap.isGround(m.rows[y][tx])) break;
      if (ty <= 0 || !chars) continue;
      d[ty - 1][tx] = chars[i % chars.length]; i++;
    }
    m.deco = d;
    return true;
  };

<script>/* src/art/items_ui.js */
// 道具 / UI 像素圖（art-items-ui）

  function paste(dst, src, x, y) {

      let out = rows.map(r => r.split(''));
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {

      out = rows.map(r => r.split(''));

  // ---------- 選關地圖 ----------
  const mapK = [
    '................',
    '.....nnnnnn.....',
    '...nnppppppnn...',
    '..nppplppppppn..',
    '.npppwwppwwpppn.',
    '.npppnnppnnpppn.',
    'nphppiippiipphpn',
    'npppppmppmppppPn',
    'nppppppmmppppPPn',
    '.nppppppppppPPn.',
    '.nnppppppppPPnn.',
    'nffnnppppppnnffn',
    'nfffnnppppnnfffn',
    'nFFFFnnnnnnFFFFn',
    '.nnnn......nnnn.',
    '................',
  ];
  const mapK1 = mapK.slice(1).concat(['................']);
  S('ui_map_kirby', [mapK, mapK1], { fps: 4 });
  S('ui_map_node', [[
    '...kkkkkk...',
    '..kssssssk..',
    '.kseesssssk.',
    'ksesssssssSk',
    'kssssssssSSk',
    'kssssssssSSk',
    'kssssssssSSk',
    'kSssssssSSSk',
    'kSSsssSSSSSk',
    '.kSSSSSSSSk.',
    '..kSSSSSSk..',
    '...kkkkkk...',
  ], [
    '.....kk.....',
    '....kyyk....',
    '....kyyk....',
    'kkkkkyykkkkk',
    'kyyyyyaayyyk',
    '.kyyyaayyyk.',
    '..kyyaayyk..',
    '..kyyyyyyk..',
    '.kyyykkyyyk.',
    '.kykk..kkyk.',
    'kk........kk',
    '............',
  ]], { fps: 1 });
  S('ui_map_flag', [[
    'kk..........',
    'ktkkkkkkkk..',
    'ktkrrryrrrk.',
    'ktkrryyyrrrk',
    'ktkryyyyyrrk',
    'ktkrryryrrrk',
    'ktkrrrrrrrk.',
    'ktkkkkkkkk..',
    'ktk.........',
    'ktk.........',
    'ktk.........',
    'ktk.........',
    'ktk.........',
    'kkk.........',
  ]]);

  // ---------- 標題畫面大卡比 32×32（2 幀揮手）----------
  (function () {
    const body = ball(24);
    const eye = ['.n.', 'wnn', 'wnn', 'nnn', 'nnn', 'iii', '.i.'];
    const blush = ['hhh', 'hhh'];
    const mouth = ['m......m', 'mmmmmmmm', '.mrrrrm.', '..mmmm..'];
    const foot = ['..nnnnn..', '.nfffffn.', 'nfffffffn', 'nfffffffn', 'nFFFFFFFn', '.nnnnnnn.'];
    const armL = ['..nnn.', '.npppn', 'npppp.', 'nppp..', '.nn...'];
    // 舉手（斜上）：貼在 (23,0)，下緣深入身體形成接縫
    const armUp = [
      '...nnn.',
      '..nlppn',
      '..npppn',
      '.npppn.',
      '.npppn.',
      'npppn..',
      'npppn..',
      '.nnn...',
    ];
    // 揮手（直上）：貼在 (21,0)
    const armUp2 = [
      '.nnn..',
      'nlppn.',
      'npppn.',
      'npppn.',
      'npppn.',
      '.nppn.',
      '.nppn.',
      '..nn..',
    ];
    function frame(arm, ax, ay, bodyDy) {
      let f = blank(32, 32);
      f = paste(f, foot, 2, 24);
      f = paste(f, foot, 21, 24);
      f = paste(f, body, 4, 2 + bodyDy);
      f = paste(f, eye, 12, 8 + bodyDy);
      f = paste(f, eye, 17, 8 + bodyDy);
      f = paste(f, blush, 7, 15 + bodyDy);
      f = paste(f, blush, 22, 15 + bodyDy);
      f = paste(f, mouth, 12, 16 + bodyDy);
      f = paste(f, armL, 1, 13 + bodyDy);
      f = paste(f, arm, ax, ay + bodyDy);
      return f;
    }
    S('ui_title_kirby', [frame(armUp, 23, 0, 0), frame(armUp2, 21, 0, 1)], { fps: 3 });
  })();

  // ---------- 標題 LOGO 160×48：KIRBY（粉紅圓潤）+ STAR（黃）+ 卡比臉 + 星星 ----------
  (function () {
    let logo = blank(160, 48);
    // KIRBY：3× 圓角字，bevel 上色，深藍描邊 + 右下陰影
    let kMask = roundify(bigText('KIRBY', 3, 3), 1);
    let kCol = bevel(kMask, 'p', 'l', 'P', 2);
    kCol = outline(kCol, 'n');
    const kShadow = recolor(kCol, { p: 'x', l: 'x', P: 'x', n: 'x' });
    // STAR：2× 圓角字，黃色
    let sMask = roundify(bigText('STAR', 2, 2), 1);
    let sCol = bevel(sMask, 'y', 'a', 'Y', 1);
    sCol = outline(sCol, 'n');
    const sShadow = recolor(sCol, { y: 'x', a: 'x', Y: 'x', n: 'x' });
    // 卡比臉 26px
    let face = ball(26);
    const eye = ['.n.', 'wnn', 'wnn', 'nnn', 'nnn', 'iii', '.i.'];
    face = paste(face, eye, 8, 7); face = paste(face, eye, 14, 7);
    face = paste(face, ['hh', 'hh'], 4, 14); face = paste(face, ['hh', 'hh'], 20, 14);
    face = paste(face, ['m....m', '.mmmm.'], 10, 16);
    // 裝飾星
    const star9 = ['....k....', '...kyk...', '...kak...', 'kkkyaykkk', 'kyyyaayyk', '.kyyaayk.', '..kyyyk..', '..kykyk..', '.kk...kk.'];
    const star5 = ['..k..', '.kak.', 'kaaak', '.kak.', '..k..'];
    const star7 = ['...k...', '..kak..', 'kkkyakk', '.kyaak.', '..kyk..', '.kk.kk.', '.......'];
    // 佈局
    logo = paste(logo, kShadow, 33, 5);
    logo = paste(logo, kCol, 31, 3);
    logo = paste(logo, sShadow, 89, 30);
    logo = paste(logo, sCol, 87, 28);
    logo = paste(logo, face, 3, 12);
    logo = paste(logo, star9, 150, 26);
    logo = paste(logo, star7, 40, 32);
    logo = paste(logo, star5, 152, 6);
    logo = paste(logo, star5, 60, 38);
    logo = paste(logo, star5, 22, 4);
    S('ui_title_logo', [logo]);
  })();
})();

<script>/* src/art/backgrounds.js */
// 程序式背景（art-world）
// KB.BG[theme](ctx, camX, camY, t, room)：只畫在 0..256 × 0..192；KB.BG.title / KB.BG.map 為全畫面。
// 遠景以 bg_<theme>_* 精靈條（可平鋪、sheet 可檢視）搭配視差平鋪（camX*0.2 / *0.5），動態元素每幀程序式繪製。
(function () {
  KB.BG = KB.BG || {};
  const W = KB.W, H = KB.H, VH = KB.VIEW_H;
  const X = KB.pix;

  // ---------- 工具 ----------
  // 環繞式畫布（x 超出寬度時回繞 → 水平平鋪無縫）
  function wrapper(g) {
    const w = g[0].length, h = g.length;
    const P = {
      w, h,
      px(x, y, ch) { x = Math.round(x); y = Math.round(y); if (y >= 0 && y < h) g[y][((x % w) + w) % w] = ch; },
      get(x, y) { x = Math.round(x); y = Math.round(y); return (y >= 0 && y < h) ? g[y][((x % w) + w) % w] : '.'; },
      rect(x, y, rw, rh, ch) { for (let j = 0; j < rh; j++) for (let i = 0; i < rw; i++) P.px(x + i, y + j, ch); },
      disc(cx, cy, r, ch) { r = Math.round(r); for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r + r * 0.6) P.px(cx + x, cy + y, ch); },
      ellipse(cx, cy, rx, ry, ch) { for (let y = -ry; y <= ry; y++) for (let x = -rx; x <= rx; x++) if ((x * x) / (rx * rx + 0.5) + (y * y) / (ry * ry + 0.5) <= 1) P.px(cx + x, cy + y, ch); },
      // 山峰：底 (cx, base)、高 hgt、半寬 hw；左稜線受光色 lit
      peak(cx, base, hgt, hw, ch, lit) {
        for (let x = cx - hw; x <= cx + hw; x++) {
          const top = Math.round(base - hgt * (1 - Math.abs(x - cx) / hw));
          for (let y = top; y < base; y++) P.px(x, y, (lit && x < cx && y - top < 3) ? lit : ch);
        }
      },
      // 圓丘：頂點 (cx, top)、半徑 r；高光 hi
      hill(cx, top, r, ch, hi) {
        P.disc(cx, top + r, r, ch);
        if (hi) { const hr = Math.round(r * 0.55); for (let y = -hr; y <= hr; y++) for (let x = -hr; x <= hr; x++) if (x * x + y * y <= hr * hr && P.get(cx - r * 0.3 + x, top + r * 0.65 + y) === ch) P.px(cx - r * 0.3 + x, top + r * 0.65 + y, hi); }
      },
      // 蓬鬆雲（陰影先畫在下方 2px）
      cloud(cx, cy, s, ch, sh) {
        const parts = [[0, 0, s], [-s, s * 0.35, s * 0.7], [s, s * 0.35, s * 0.75], [s * 0.45, -s * 0.3, s * 0.8], [-s * 0.5, -s * 0.15, s * 0.6], [s * 1.7, s * 0.5, s * 0.5], [-s * 1.7, s * 0.5, s * 0.45]];
        if (sh) for (const [dx, dy, r] of parts) P.disc(cx + dx, cy + dy + 2, r, sh);
        for (const [dx, dy, r] of parts) P.disc(cx + dx, cy + dy, r, ch);
      },
      // 只把 ch 內部、下方 n 列改成 sh（底部陰影）
      shadeBottom(ch, sh, n) { for (let x = 0; x < w; x++) for (let y = 0; y < h; y++) if (P.get(x, y) === ch) { let k = 1; while (k <= n && P.get(x, y + k) === ch) k++; if (k <= n) P.px(x, y, sh); } },
    };
    return P;
  }
  function strip(name, pal, w, h, fn) { const g = X.grid(w, h); fn(wrapper(g), g); return KB.sprite(name, pal, X.gRows(g), { anchor: 'topleft' }).frames[0].cv; }
  // 水平無限平鋪；ox 為捲動量（右移為正）
  function tileX(ctx, cv, ox, y, alpha) {
    const w = cv.width; let x = -(((Math.round(ox) % w) + w) % w);
    if (alpha !== undefined) { ctx.save(); ctx.globalAlpha = alpha; }
    for (; x < W; x += w) ctx.drawImage(cv, x, Math.round(y));
    if (alpha !== undefined) ctx.restore();
  }
  // 平鋪條上某點的螢幕 x
  const wrapX = (x, ox, w) => (((x - ox) % w) + w) % w;
  function bands(ctx, y0, y1, cols) { const n = cols.length, h = (y1 - y0) / n; for (let i = 0; i < n; i++) KB.rect(ctx, 0, y0 + i * h, W, Math.ceil(h) + 1, cols[i]); }
  function rng(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
  function mkStars(n, seed, w, h, y0) { const r = rng(seed), a = []; for (let i = 0; i < n; i++) a.push({ x: Math.floor(r() * w), y: (y0 || 0) + Math.floor(r() * h), ph: r() * 6.28, spd: 1.5 + r() * 2.5, big: r() < 0.2 }); return a; }
  function drawStars(ctx, stars, t, ox, col, dim) {
    for (const s of stars) {
      const v = Math.sin(t * s.spd + s.ph), x = wrapX(s.x, ox, W);
      if (v > 0.1) { KB.rect(ctx, x, s.y, 1, 1, col); if (s.big && v > 0.75) { KB.rect(ctx, x - 1, s.y, 3, 1, col); KB.rect(ctx, x, s.y - 1, 1, 3, col); } }
      else if (dim) KB.rect(ctx, x, s.y, 1, 1, dim);
    }
  }
  const spr = (ctx, name, x, y, o) => KB.drawSpr(ctx, name, x, y, o || {});

  // ============================================================================
  // green 翠綠草原：藍天、白雲、遠山（藍綠）、近山丘（綠色圓弧）
  // ============================================================================
  const GP = { a: '#6cb0c0', b: '#90ccd8', d: '#88d478', e: '#a8e498', w: '#ffffff', W: '#d8e8fc' };
  const gClouds = strip('bg_green_clouds', GP, 256, 40, p => {
    p.cloud(34, 16, 6, 'w', 'W'); p.cloud(112, 10, 7, 'w', 'W'); p.cloud(184, 20, 5, 'w', 'W'); p.cloud(236, 8, 4, 'w', 'W');
  });
  const gMts = strip('bg_green_mountains', GP, 256, 64, p => {
    p.peak(24, 64, 40, 34, 'a', 'b'); p.peak(78, 64, 56, 44, 'a', 'b'); p.peak(132, 64, 34, 30, 'a', 'b'); p.peak(186, 64, 60, 48, 'a', 'b'); p.peak(240, 64, 44, 38, 'a', 'b');
  });
  const gHills = strip('bg_green_hills', GP, 256, 56, p => {
    for (const [cx, r, hh] of [[0, 36, 26], [64, 44, 34], [128, 32, 22], [180, 48, 34], [236, 38, 28]]) p.hill(cx, 56 - hh, r, 'd', 'e');
    p.rect(0, 48, 256, 8, 'd');
  });
  KB.BG.green = function (ctx, camX, camY, t) {
    bands(ctx, 0, VH, ['#4890e8', '#5ca4f0', '#70b8f4', '#84ccf8', '#98dcfc', '#a8e8ff']);
    KB.circle(ctx, 218, 30, 13, '#ffe890'); KB.circle(ctx, 218, 30, 10, '#fff8d0');
    tileX(ctx, gClouds, camX * 0.12 + t * 2.5, 12 - camY * 0.05);
    const my = 104 - camY * 0.2; tileX(ctx, gMts, camX * 0.2, my); KB.rect(ctx, 0, my + 64, W, VH - my - 64 + 2, '#6cb0c0');
    const hy = 138 - camY * 0.4; tileX(ctx, gHills, camX * 0.5, hy); KB.rect(ctx, 0, hy + 56, W, VH - hy - 56 + 2, '#88d478');
  };

  // ============================================================================
  // castle 幽靜古堡：夜空、月亮、遠處城牆與塔的剪影、火把微光
  // ============================================================================
  const CP = { a: '#1c1c44', b: '#282854', c: '#303060', d: '#3a3a6c', e: '#24244c' };
  const cWin = [];   // 亮窗（條座標）
  const cTowers = strip('bg_castle_towers', CP, 256, 96, p => {
    p.rect(0, 62, 256, 34, 'a');
    for (let x = 0; x < 256; x += 8) p.rect(x, 58, 4, 4, 'a');
    for (const [cx, w, top] of [[30, 20, 22], [96, 30, 6], [150, 16, 30], [206, 26, 14], [244, 12, 40]]) {
      const l = cx - w / 2;
      p.rect(l, top, w, 96 - top, 'a');
      p.rect(l - 2, top, w + 4, 3, 'a');
      for (let x = l - 2; x < l + w + 2; x += 4) p.rect(x, top - 3, 2, 3, 'a');
      p.peak(cx, top - 3, Math.round(w * 0.8), Math.round(w / 2), 'a');
      p.rect(cx, top - 3 - Math.round(w * 0.8) - 3, 1, 4, 'a');
      for (let y = top + 10; y < 90; y += 14) { p.rect(cx - 1, y, 3, 5, 'b'); if ((y + cx) % 3 === 0) cWin.push([cx - 1, y + 1]); }
    }
    for (let x = 6; x < 256; x += 24) { p.rect(x, 70, 2, 4, 'b'); if (x % 48 === 6) cWin.push([x, 71]); }
  });
  const cWall = strip('bg_castle_wall', CP, 256, 64, p => {
    p.rect(0, 8, 256, 56, 'c');
    for (let x = 0; x < 256; x += 16) p.rect(x, 0, 8, 8, 'c');
    for (let y = 8; y < 64; y += 8) { p.rect(0, y, 256, 1, 'b'); for (let x = (y / 8) & 1 ? 8 : 0; x < 256; x += 16) p.rect(x, y, 1, 8, 'b'); }
    for (const cx of [64, 192]) { p.rect(cx - 8, 28, 16, 36, 'e'); p.disc(cx, 28, 8, 'e'); p.rect(cx - 6, 30, 12, 34, 'a'); p.disc(cx, 30, 6, 'a'); }
    for (let x = 0; x < 256; x += 16) p.rect(x + 2, 2, 4, 1, 'd');
  });
  const cStars = mkStars(46, 11, 256, 110);
  KB.BG.castle = function (ctx, camX, camY, t) {
    bands(ctx, 0, VH, ['#0c1030', '#121840', '#1a2050', '#22285c', '#2a3068', '#323870']);
    drawStars(ctx, cStars, t, camX * 0.05, '#ffffff', '#7880b0');
    const mx = 204 - camX * 0.04, my = 38 - camY * 0.05;
    KB.circle(ctx, mx, my, 14, '#e8e8c0'); KB.circle(ctx, mx - 1, my - 1, 12, '#fcfce8'); KB.circle(ctx, mx + 4, my - 3, 3, '#e0e0b0'); KB.circle(ctx, mx - 5, my + 5, 2, '#e0e0b0'); KB.circle(ctx, mx + 2, my + 6, 1, '#e0e0b0');
    const ty = 86 - camY * 0.15, ox = camX * 0.2;
    tileX(ctx, cTowers, ox, ty); KB.rect(ctx, 0, ty + 96, W, VH - ty - 96 + 2, '#1c1c44');
    for (const [wx, wy] of cWin) { const x = wrapX(wx, ox, 256); KB.rect(ctx, x, ty + wy, 2, 3, Math.sin(t * 6 + wx) > -0.5 ? '#f8d060' : '#d89840'); }
    const wy = 130 - camY * 0.3, ox2 = camX * 0.5;
    tileX(ctx, cWall, ox2, wy); KB.rect(ctx, 0, wy + 64, W, VH - wy - 64 + 2, '#303060');
    for (const tx of [24, 128, 232]) {
      const x = wrapX(tx, ox2, 256), fl = Math.sin(t * 9 + tx) * 0.05;
      ctx.save(); ctx.globalAlpha = 0.16 + fl; KB.circle(ctx, x + 4, wy + 26, 18, '#ffb040'); ctx.globalAlpha = 0.22 + fl; KB.circle(ctx, x + 4, wy + 26, 9, '#ffe080'); ctx.restore();
      spr(ctx, 'deco_castle_r', x + 4, wy + 42, { t: t + tx, alpha: 0.85 });
    }
  };

  // ============================================================================
  // island 漂浮群島：藍天、海（深淺藍帶 + 白浪隨 t 動）、遠處小島、太陽
  // ============================================================================
  const IP = { w: '#ffffff', W: '#dceafc', g: '#58b870', G: '#3c9858', s: '#f0e0a0', t: '#6c5030', l: '#78d088' };
  const iClouds = strip('bg_island_clouds', IP, 256, 40, p => {
    p.cloud(50, 14, 5, 'w', 'W'); p.cloud(140, 8, 7, 'w', 'W'); p.cloud(214, 18, 4, 'w', 'W');
  });
  const iFar = strip('bg_island_far', IP, 256, 32, p => {
    for (const [cx, r, hh] of [[40, 26, 14], [58, 18, 18], [150, 30, 12], [172, 22, 20], [236, 20, 10]]) { p.hill(cx, 32 - hh, r, 'G'); }
    for (const [cx, r, hh] of [[40, 26, 14], [58, 18, 18], [150, 30, 12], [172, 22, 20], [236, 20, 10]]) { p.hill(cx - 3, 32 - hh + 2, Math.round(r * 0.8), 'g', 'l'); }
    p.shadeBottom('g', 'G', 0);
    for (const [cx, base] of [[62, 14], [176, 12], [44, 20]]) { p.rect(cx, base, 1, 8, 't'); p.rect(cx - 3, base - 1, 7, 1, 'G'); p.rect(cx - 2, base - 2, 5, 1, 'G'); p.rect(cx - 1, base, 3, 1, 'G'); }
    for (let x = 0; x < 256; x++) { let y = 31; while (y > 0 && p.get(x, y) === '.') y--; if (y > 0 && y < 31) { p.px(x, y + 1, 's'); p.px(x, y + 2, 's'); } }
    p.rect(0, 30, 256, 2, '.');
  });
  KB.BG.island = function (ctx, camX, camY, t) {
    const hz = 112 - camY * 0.1;
    bands(ctx, 0, hz, ['#3888e8', '#4c9cf0', '#64b4f4', '#80c8f8', '#98d8fc', '#b0e4ff']);
    KB.circle(ctx, 44, 30, 15, '#ffe890'); KB.circle(ctx, 44, 30, 12, '#fff8d0'); KB.circle(ctx, 44, 30, 8, '#ffffff');
    tileX(ctx, iClouds, camX * 0.15 + t * 3, 14 - camY * 0.05);
    tileX(ctx, iFar, camX * 0.2, hz - 30);
    // 海
    const seaCols = ['#2c78d8', '#3888e0', '#4498e8', '#50a8ec', '#5cb4f0', '#68bcf4'];
    for (let i = 0; i < seaCols.length; i++) KB.rect(ctx, 0, hz + i * 14, W, 14, seaCols[i]);
    KB.rect(ctx, 0, hz + 84, W, VH - hz - 84 + 2, '#70c0f4');
    KB.rect(ctx, 0, hz, W, 1, '#d8f0ff');
    for (let i = 0; i < 9; i++) {
      const y = hz + 4 + i * 9, pf = 0.15 + i * 0.05, sp = 64 + i * 8, len = 6 + i * 1.5;
      const off = wrapX(i * 29 + t * (10 + i * 2), camX * pf, sp);
      ctx.fillStyle = i % 2 ? '#ffffff' : '#c8ecff';
      for (let x = off - sp; x < W; x += sp) ctx.fillRect(Math.round(x), Math.round(y), Math.round(len), 1);
    }
  };

  // ============================================================================
  // cloud 泡泡雲海：淡紫藍漸層、大量圓雲、星星閃爍、一道彩虹
  // ============================================================================
  const LP = { w: '#f8f8ff', W: '#d0d4f8', f: '#e4e4ff', F: '#c4c8f0', r: '#f87878', o: '#f8b070', y: '#f8f090', g: '#88d890', c: '#88b8f8', v: '#b898e8' };
  const lRainbow = strip('bg_cloud_rainbow', LP, 176, 88, p => {
    const cols = ['r', 'o', 'y', 'g', 'c', 'v'];
    for (let y = 0; y < 88; y++) for (let x = 0; x < 176; x++) {
      const dx = x - 87.5, dy = 88 - y, d = Math.sqrt(dx * dx + dy * dy);
      if (d <= 86 && d > 62) { const i = Math.floor((86 - d) / 4); if (i < cols.length) p.px(x, y, cols[i]); }
    }
  });
  const lFar = strip('bg_cloud_far', LP, 256, 80, p => {
    p.cloud(30, 30, 9, 'f', 'F'); p.cloud(100, 50, 11, 'f', 'F'); p.cloud(170, 26, 8, 'f', 'F'); p.cloud(232, 52, 10, 'f', 'F'); p.cloud(70, 70, 8, 'f', 'F'); p.cloud(140, 74, 9, 'f', 'F'); p.cloud(210, 76, 7, 'f', 'F');
  });
  const lNear = strip('bg_cloud_near', LP, 256, 64, p => {

    // 山、樹記號（避開節點）

    for (const [x, y] of marks) {
