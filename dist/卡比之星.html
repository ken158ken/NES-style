<script>/* src/const.js */
// 卡比之星（同人版）— 常數與共用調色盤
window.KB = window.KB || {};
(function () {
  KB.W = 256; KB.H = 224; KB.TILE = 16;
  KB.VIEW_H = 192;            // 遊戲畫面高度（HUD 在 192~224）
  KB.HUD_Y = 192;

  // 手感參數（px/frame，60fps）
  KB.PHYS = {
    walk: 1.3, run: 2.2, fullWalk: 1.0,
    jump: -4.4, jumpCut: -1.5, fullJump: -3.6,
    grav: 0.24, maxFall: 4.2,
    floatUp: -1.6, floatGrav: 0.06, floatMaxFall: 0.8,
    slide: 3.0, slideFrames: 22,
    swimGrav: 0.08, swimUp: -2.2, swimMaxFall: 1.2, swimSpeed: 1.0,
    climb: 1.0,
    accel: 0.18, friction: 0.22, airAccel: 0.12,
    knockback: 2.0, hurtFrames: 24, invulnFrames: 90,
    // ---- 手感輔助（不影響上方速度 / 重力數值）----
    coyote: 5,            // 離地後仍可起跳的幀數
    jumpBuffer: 6,        // 落地前按跳的暫存幀數
    landFrames: 8,        // 落地擠壓 / 揚塵的持續幀數
    landSquash: 0.32,     // 落地擠壓最大比例
    exhaleLock: 8,        // 吐氣後不可再漂浮的幀數
    slideCancelKeep: 0.7, // 滑鏟跳取消保留的水平速度比例
    slideBounce: 0.8,     // 滑鏟撞牆回彈速度（px/frame）
    slideBounceFrames: 3, // 回彈幀數
    dropFrames: 7,        // 單向平台下穿的穿透幀數
    dropVy: 1.0,          // 下穿初速
    hurtFreeze: 3,        // 受傷 hit-stop
    hurtShake: 4,         // 受傷震動
    inhaleFreeze: 2,      // 吸到東西 hit-stop
  };
  // 鏡頭手感（game.js updateCamera）
  KB.CAM = {
    lookIdle: 12,       // 靜止時的前瞻量（px）
    lookRun: 40,        // 全速跑時的前瞻量（px）
    lookLerp: 0.05,     // 前瞻量平滑係數（避免轉向時跳動）
    follow: 0.12,       // 鏡頭跟隨係數
    deadTop: 0.40,      // 垂直死區上緣（畫面高度比例）
    deadBottom: 0.70,   // 垂直死區下緣
    restY: 0.62,        // 重置 / 切房時玩家所在的畫面高度比例
    bossMargin: 28,     // 魔王房：玩家距畫面邊緣至少保留的 px
  };

  KB.GRAV = KB.PHYS.grav;
  KB.MAXFALL = KB.PHYS.maxFall;
  KB.MAX_HP = 6;
  KB.START_LIVES = 3;

  KB.DEBUG = /[?&]debug=1/.test(location.search);
  KB.MUTE = /[?&]mute=1/.test(location.search);

  // 共用調色盤 —— 字元 → 顏色。 '.' 與 ' ' 一律透明。
  KB.PAL = {};
  // 卡比：p 主體粉、P 陰影粉、l 亮粉(高光)、r 腳紅、R 腳暗紅、k 輪廓/眼睛深藍、w 白、c 腮紅、m 嘴內、b 眼睛藍高光
  KB.PAL.kirby = {
    p: '#ffb0d0', P: '#e07aa8', l: '#ffd8e8', r: '#e8305c', R: '#a81c48',
    k: '#202848', w: '#ffffff', c: '#f27090', m: '#a02040', b: '#5060c0', o: '#ffffff',
    g: '#a0a0a8', G: '#606068', d: '#404048',           // 石頭形態
    y: '#ffe040', Y: '#e09020', e: '#f8f8f8',            // 星星/其他
  };
  // 敵人通用：o 橘、O 暗橘、t 茶色、T 深茶、y 黃、Y 暗黃、k 輪廓、w 白、r 紅、R 暗紅、b 藍、B 暗藍、g 綠、G 暗綠、s 灰、S 深灰、c 青、p 粉
  KB.PAL.enemy = {
    o: '#f89040', O: '#c05818', t: '#d08048', T: '#8a5020', y: '#f8e040', Y: '#d0a000',
    k: '#202020', w: '#ffffff', r: '#e83030', R: '#a01818', b: '#4878f8', B: '#2040a8',
    g: '#48c048', G: '#207820', s: '#a8a8b0', S: '#585860', c: '#60d8f8', C: '#2090c0',
    p: '#f8a0c8', P: '#d06090', l: '#ffd070', L: '#f0f0f0', m: '#8040c0', M: '#502080',
    e: '#f8f8f8', f: '#ff6020', F: '#ffe060', i: '#b0f0ff', I: '#60a8e0',
  };
  // 世界磁磚：green
  KB.PAL.green = {
    g: '#58d048', G: '#289028', l: '#98f070', d: '#c88850', D: '#905828', k: '#503018',
    b: '#e8d090', B: '#c0a060', w: '#f8f8f8', s: '#a8a8b0', S: '#606068', y: '#f8e040',
    r: '#e83030', p: '#f8a0c8', o: '#f89040', c: '#78d8f8', C: '#2090d0', x: '#303030',
  };
  KB.PAL.castle = {
    s: '#b0b0c0', S: '#707088', d: '#484860', D: '#303048', k: '#181828', w: '#f0f0f8',
    r: '#c03030', R: '#801818', y: '#f8e040', b: '#4060c0', B: '#203080', g: '#60a060', o: '#f89040', x: '#303030',
  };
  KB.PAL.island = {
    s: '#f8e8a0', S: '#d8b868', d: '#b08040', D: '#805020', g: '#58d048', G: '#289028',
    c: '#78d8f8', C: '#2090d0', b: '#4060e0', B: '#2038a0', w: '#f8f8f8', k: '#203040', r: '#e83030', y: '#f8e040', x: '#303030',
  };
  KB.PAL.cloud = {
    w: '#f8f8ff', W: '#c8d0f0', c: '#a0b8f8', C: '#6888d8', b: '#4060c0', B: '#2038a0',
    y: '#f8e040', p: '#f8b0d8', P: '#d080b0', k: '#303050', o: '#f8a060', x: '#303030',
  };
  KB.PAL.dedede = {
    r: '#d04040', R: '#902020', y: '#f8d040', Y: '#c09010', s: '#9090a0', S: '#585868',
    d: '#404050', D: '#282838', k: '#101018', w: '#f0f0f8', b: '#4060c0', B: '#203080', p: '#f0a0e0', x: '#303030',
  };
  // UI
  KB.PAL.ui = {
    w: '#ffffff', k: '#202020', r: '#e83030', R: '#a01818', y: '#f8e040', Y: '#d0a000',
    b: '#4878f8', B: '#2040a8', p: '#ffb0d0', P: '#e07aa8', g: '#48c048', G: '#207820',
    s: '#a8a8b0', S: '#585860', o: '#f89040', c: '#60d8f8', d: '#404048', e: '#f0f0f0', m: '#a02040',
  };

  // 能力鍵與顯示名稱（HUD / 圖示）
  KB.ABILITY_KEYS = ['fire', 'sword', 'beam', 'cutter', 'spark', 'stone', 'ice', 'hammer'];
  KB.ABILITY_NAMES = { fire: '火焰', sword: '劍', beam: '光束', cutter: '刀刃', spark: '電擊', stone: '石頭', ice: '冰凍', hammer: '鐵鎚' };
  KB.ABILITY_HUD = { fire: 'FIRE', sword: 'SWORD', beam: 'BEAM', cutter: 'CUTTER', spark: 'SPARK', stone: 'STONE', ice: 'ICE', hammer: 'HAMMER' };

  KB.THEMES = ['green', 'castle', 'island', 'cloud', 'dedede'];
  KB.THEME_NAMES = { green: '翠綠草原', castle: '幽靜古堡', island: '漂浮群島', cloud: '泡泡雲海', dedede: '迪迪迪城' };
})();

</script>
<script>/* src/gfx.js */
// 精靈註冊、繪製、文字 —— 全部程序式像素圖，不載入外部檔案
(function () {
  KB.SPR = {};            // name -> { frames:[{cv,w,h,ax,ay}], fps, loop, n }
  KB.missing = new Set();
  KB.SPR_ORDER = [];      // 註冊順序（sheet 用）

  function makeCanvas(w, h) {
    const c = document.createElement('canvas'); c.width = Math.max(1, w); c.height = Math.max(1, h);
    return c;
  }
  KB.makeCanvas = makeCanvas;

  function hexToRGBA(hex) {
    let h = hex.replace('#', '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    if (h.length === 4) h = h.split('').map(c => c + c).join('');
    const n = parseInt(h, 16);
    if (h.length === 8) return [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255];
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255, 255];
  }

  // 將字串列陣列轉為 canvas
  function compileFrame(rows, pal) {
    const h = rows.length, w = Math.max(...rows.map(r => r.length));
    const cv = makeCanvas(w, h), ctx = cv.getContext('2d');
    const img = ctx.createImageData(w, h), d = img.data;
    const cache = {};
    for (let y = 0; y < h; y++) {
      const row = rows[y];
      for (let x = 0; x < row.length; x++) {
        const ch = row[x];
        if (ch === '.' || ch === ' ') continue;
        let col = cache[ch];
        if (col === undefined) {
          const hex = pal[ch];
          col = cache[ch] = hex ? hexToRGBA(hex) : [255, 0, 255, 255];
        }
        const i = (y * w + x) * 4;
        d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = col[3];
      }
    }
    ctx.putImageData(img, 0, 0);
    return { cv, w, h };
  }

  /**
   * 註冊精靈。
   * frames: 陣列的陣列（多幀）或字串陣列（單幀）。
   * opts: { fps, loop, anchor:'bottom'|'center'|'topleft'|[ax,ay], pal }
   */
  KB.sprite = function (name, pal, frames, opts) {
    opts = opts || {};
    if (typeof frames[0] === 'string') frames = [frames];
    const fr = frames.map(rows => {
      const f = compileFrame(rows, pal || {});
      const a = opts.anchor || 'bottom';
      if (Array.isArray(a)) { f.ax = a[0]; f.ay = a[1]; }
      else if (a === 'center') { f.ax = Math.floor(f.w / 2); f.ay = Math.floor(f.h / 2); }
      else if (a === 'topleft') { f.ax = 0; f.ay = 0; }
      else { f.ax = Math.floor(f.w / 2); f.ay = f.h; }
      return f;
    });
    if (!KB.SPR[name]) KB.SPR_ORDER.push(name);
    KB.SPR[name] = { frames: fr, fps: opts.fps || 6, loop: opts.loop !== false, n: fr.length, w: fr[0].w, h: fr[0].h };
    return KB.SPR[name];
  };

  // 以既有精靈產生調色後的複本（例如敵人變色）
  KB.spriteRecolor = function (name, newName, map) {
    const s = KB.SPR[name]; if (!s) return null;
    const fr = s.frames.map(f => {
      const cv = makeCanvas(f.w, f.h), ctx = cv.getContext('2d');
      ctx.drawImage(f.cv, 0, 0);
      const img = ctx.getImageData(0, 0, f.w, f.h), d = img.data;
      const pairs = Object.keys(map).map(k => [hexToRGBA(k), hexToRGBA(map[k])]);
      for (let i = 0; i < d.length; i += 4) {
        if (!d[i + 3]) continue;
        for (const [a, b] of pairs) if (d[i] === a[0] && d[i + 1] === a[1] && d[i + 2] === a[2]) { d[i] = b[0]; d[i + 1] = b[1]; d[i + 2] = b[2]; break; }
      }
      ctx.putImageData(img, 0, 0);
      return { cv, w: f.w, h: f.h, ax: f.ax, ay: f.ay };
    });
    if (!KB.SPR[newName]) KB.SPR_ORDER.push(newName);
    KB.SPR[newName] = { frames: fr, fps: s.fps, loop: s.loop, n: fr.length, w: s.w, h: s.h };
    return KB.SPR[newName];
  };

  KB.has = name => !!KB.SPR[name];

  const missingCv = {};
  function missingSprite(name) {
    if (!KB.missing.has(name)) { KB.missing.add(name); if (KB.DEBUG || true) console.warn('[missing sprite]', name); }
    if (!missingCv[name]) {
      const cv = makeCanvas(16, 16), c = cv.getContext('2d');
      c.fillStyle = '#ff00ff'; c.fillRect(0, 0, 16, 16);
      c.fillStyle = '#000'; c.fillRect(2, 2, 12, 12);
      c.fillStyle = '#ff00ff'; c.font = '10px monospace'; c.fillText(name[0].toUpperCase(), 4, 12);
      missingCv[name] = { frames: [{ cv, w: 16, h: 16, ax: 8, ay: 16 }], fps: 1, loop: true, n: 1, w: 16, h: 16 };
    }
    return missingCv[name];
  }

  KB.frameIndex = function (s, opts) {
    if (opts.frame !== undefined) return ((opts.frame % s.n) + s.n) % s.n;
    const t = opts.t || 0;
    const i = Math.floor(t * (opts.fps || s.fps));
    return s.loop ? i % s.n : Math.min(i, s.n - 1);
  };

  // 白色閃爍用暫存
  const tintCache = new Map();
  function tinted(f, color) {
    const key = color;
    let m = tintCache.get(f); if (!m) { m = {}; tintCache.set(f, m); }
    if (m[key]) return m[key];
    const cv = makeCanvas(f.w, f.h), c = cv.getContext('2d');
    c.drawImage(f.cv, 0, 0);
    c.globalCompositeOperation = 'source-atop'; c.fillStyle = color; c.fillRect(0, 0, f.w, f.h);
    return (m[key] = cv);
  }

  /**
   * 在 ctx 以螢幕座標繪製精靈。x,y 為錨點位置。
   * opts: { flip, frame, t, fps, alpha, tint('#fff'), scaleX, scaleY, rot(弧度) , flipY }
   */
  KB.drawSpr = function (ctx, name, x, y, opts) {
    opts = opts || {};
    const s = KB.SPR[name] || missingSprite(name);
    const f = s.frames[KB.frameIndex(s, opts)];
    const img = opts.tint ? tinted(f, opts.tint) : f.cv;
    x = Math.round(x); y = Math.round(y);
    const flip = !!opts.flip, flipY = !!opts.flipY;
    const needT = flip || flipY || opts.alpha !== undefined || opts.rot || opts.scaleX || opts.scaleY;
    if (!needT) { ctx.drawImage(img, x - f.ax, y - f.ay); return; }
    ctx.save();
    if (opts.alpha !== undefined) ctx.globalAlpha = opts.alpha;
    ctx.translate(x, y);
    if (opts.rot) ctx.rotate(opts.rot);
    ctx.scale((flip ? -1 : 1) * (opts.scaleX || 1), (flipY ? -1 : 1) * (opts.scaleY || 1));
    ctx.drawImage(img, -f.ax, -f.ay);
    ctx.restore();
  };

  KB.sprSize = function (name) { const s = KB.SPR[name]; return s ? { w: s.w, h: s.h, n: s.n } : { w: 16, h: 16, n: 1 }; };

  // ---------- 文字 ----------
  // 8×8 點陣字：由 art 註冊 KB.FONT[ch] = ['........', ...]（'#' 或任何非 '.' 為實心）
  KB.FONT = KB.FONT || {};
  const glyphCache = {};
  function glyph(ch, color) {
    const key = ch + color;
    if (glyphCache[key]) return glyphCache[key];
    const rows = KB.FONT[ch]; if (!rows) return null;
    const pal = { '#': color, '1': color, 'x': color, 'w': color, 'k': color };
    // 任意非透明字元皆填色
    const norm = rows.map(r => r.replace(/[^. ]/g, '#'));
    const f = compileFrame(norm, pal);
    return (glyphCache[key] = f);
  }

  // ---------- 中文（系統字型）→ 像素 ----------
  // 舊作法（1 倍字級 + alpha>110 門檻）在沒有細明體內嵌點陣的機器（Linux / Mac）上，
  // 12px 中文的筆畫 alpha 不足而被整條砍掉 → 只剩斷斷續續的細線。
  // 新作法：以 N 倍字級（預設 4 倍＝48px）渲染到離屏畫布，再以「區塊平均覆蓋率」縮回目標字級並二值化
  //（覆蓋率 ≥ 41% 即填滿）—— 筆畫一律至少 1px 實心且粗細一致，不依賴任何字型的內嵌點陣，
  // 因此 Windows / Linux / Mac 結果一致。字型一律用黑體（筆畫等寬，縮小後最清楚）。
  KB.ZH_FONT = '"Noto Sans CJK TC","Noto Sans TC","Microsoft JhengHei","微軟正黑體","PingFang TC","Heiti TC","Hiragino Sans GB","Droid Sans Fallback","WenQuanYi Zen Hei",sans-serif';
  KB.defaultFont = size => size + 'px ' + KB.ZH_FONT;
  // scale：超取樣倍率（字級 ×N 渲染）；cover：區塊覆蓋率門檻 0~255（越低筆畫越粗，105 ≈ 41%）；
  // boldFrom：此字級以上改用粗體（標題）。改參數後呼叫 KB.clearTextCache()。
  KB.TEXT_CFG = { scale: 4, cover: 105, boldFrom: 16 };

  function scaleFont(font, size, S) {
    const big = (size * S) + 'px';
    let done = false;
    let r = font.replace(/(\d*\.?\d+)px/, () => { done = true; return big; });
    if (!done) r = big + ' ' + KB.ZH_FONT;
    if (size >= KB.TEXT_CFG.boldFrom && !/bold|[5-9]00/.test(r)) r = 'bold ' + r;
    return r;
  }

  const maskCache = new Map();
  // 產生白色遮罩（已二值化）；同一串字不同顏色共用，避免重複超取樣
  function textMask(str, font, size) {
    const key = str + '|' + font + '|' + size;
    let m = maskCache.get(key); if (m) return m;
    const cfg = KB.TEXT_CFG, S = Math.max(1, cfg.scale | 0);
    const bigFont = scaleFont(font, size, S);
    const tmp = makeCanvas(4, 4), tc = tmp.getContext('2d');
    tc.font = bigFont;
    const wB = Math.max(S, Math.ceil(tc.measureText(str).width)) + 2 * S, hB = Math.ceil(size * S * 1.45) + 2 * S;
    const big = makeCanvas(wB, hB), bc = big.getContext('2d');
    bc.font = bigFont; bc.textBaseline = 'top'; bc.fillStyle = '#ffffff'; bc.fillText(str, S, S);
    const src = bc.getImageData(0, 0, wB, hB).data;
    const w = Math.ceil(wB / S), h = Math.ceil(hB / S);
    const cv = makeCanvas(w, h), c = cv.getContext('2d');
    const img = c.createImageData(w, h), d = img.data;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        let sum = 0, n = 0;
        for (let j = 0; j < S; j++) {
          const sy = y * S + j; if (sy >= hB) break;
          for (let i = 0; i < S; i++) {
            const sx = x * S + i; if (sx >= wB) break;
            sum += src[(sy * wB + sx) * 4 + 3]; n++;
          }
        }
        if (n && sum / n >= cfg.cover) {
          const k = (y * w + x) * 4; d[k] = 255; d[k + 1] = 255; d[k + 2] = 255; d[k + 3] = 255;
        }
      }
    }
    c.putImageData(img, 0, 0);
    m = { cv, w, h };
    if (maskCache.size > 300) maskCache.clear();
    maskCache.set(key, m);
    return m;
  }

  const textCache = new Map();
  function renderTextCanvas(str, font, color, size) {
    const key = str + '|' + font + '|' + color + '|' + size;
    if (textCache.has(key)) return textCache.get(key);
    const m = textMask(str, font, size);
    const cv = makeCanvas(m.w, m.h), c = cv.getContext('2d');
    c.drawImage(m.cv, 0, 0);
    c.globalCompositeOperation = 'source-in';
    c.fillStyle = color; c.fillRect(0, 0, m.w, m.h);
    const r = { cv, w: m.w, h: m.h };
    if (textCache.size > 400) textCache.clear();
    textCache.set(key, r);
    return r;
  }
  KB.clearTextCache = function () { textCache.clear(); maskCache.clear(); };

  /**
   * 畫文字。ASCII 有點陣字時用點陣，否則（含中文）用系統字轉像素。
   * opts: { color:'#fff', align:'left'|'center'|'right', size:8, outline:'#000', shadow:'#000', font, spacing }
   */
  KB.text = function (ctx, str, x, y, opts) {
    opts = opts || {};
    const color = opts.color || '#ffffff', align = opts.align || 'left', size = opts.size || 8;
    str = String(str);
    x = Math.round(x); y = Math.round(y);
    const spacing = opts.spacing !== undefined ? opts.spacing : 0;
    // 判斷是否全為點陣字可用字元
    const allBitmap = size === 8 && str.split('').every(ch => KB.FONT[ch] || ch === ' ');
    if (allBitmap) {
      const w = str.length * (8 + spacing) - spacing;
      let sx = x; if (align === 'center') sx = x - Math.floor(w / 2); else if (align === 'right') sx = x - w;
      const draw = (dx, dy, col) => {
        let cx = sx + dx;
        for (const ch of str) {
          if (ch !== ' ') { const g = glyph(ch, col); if (g) ctx.drawImage(g.cv, cx, y + dy); }
          cx += 8 + spacing;
        }
      };
      if (opts.outline) { for (const [ox, oy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) draw(ox, oy, opts.outline); }
      if (opts.shadow) draw(1, 1, opts.shadow);
      draw(0, 0, color);
      return w;
    }
    const font = opts.font || KB.defaultFont(size);
    const r = renderTextCanvas(str, font, color, size);
    let sx = x; if (align === 'center') sx = x - Math.floor(r.w / 2); else if (align === 'right') sx = x - r.w;
    if (opts.outline) {
      const o = renderTextCanvas(str, font, opts.outline, size);
      for (const [ox, oy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) ctx.drawImage(o.cv, sx + ox, y + oy);
    }
    if (opts.shadow) { const o = renderTextCanvas(str, font, opts.shadow, size); ctx.drawImage(o.cv, sx + 1, y + 1); }
    ctx.drawImage(r.cv, sx, y);
    return r.w;
  };

  KB.textWidth = function (str, opts) {
    opts = opts || {}; const size = opts.size || 8;
    const allBitmap = size === 8 && String(str).split('').every(ch => KB.FONT[ch] || ch === ' ');
    if (allBitmap) return String(str).length * 8;
    const font = opts.font || KB.defaultFont(size);
    return renderTextCanvas(String(str), font, opts.color || '#fff', size).w;
  };

  // 簡單像素矩形 / 圓
  KB.rect = function (ctx, x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
  KB.circle = function (ctx, cx, cy, r, color) {
    ctx.fillStyle = color; cx = Math.round(cx); cy = Math.round(cy); r = Math.round(r);
    for (let y = -r; y <= r; y++) { const hw = Math.floor(Math.sqrt(r * r - y * y)); ctx.fillRect(cx - hw, cy + y, hw * 2 + 1, 1); }
  };

  // 世界座標繪圖包裝（GameScene 產生）
  KB.G = class G {
    constructor(ctx, cam) { this.ctx = ctx; this.cam = cam; }
    spr(name, x, y, opts) { KB.drawSpr(this.ctx, name, x - this.cam.x, y - this.cam.y, opts); }
    rect(x, y, w, h, color) { KB.rect(this.ctx, x - this.cam.x, y - this.cam.y, w, h, color); }
    circle(cx, cy, r, color) { KB.circle(this.ctx, cx - this.cam.x, cy - this.cam.y, r, color); }
    text(str, x, y, opts) { KB.text(this.ctx, str, x - this.cam.x, y - this.cam.y, opts); }
    line(x1, y1, x2, y2, color, w) {
      const c = this.ctx; c.strokeStyle = color; c.lineWidth = w || 1; c.beginPath();
      c.moveTo(Math.round(x1 - this.cam.x) + 0.5, Math.round(y1 - this.cam.y) + 0.5); c.lineTo(Math.round(x2 - this.cam.x) + 0.5, Math.round(y2 - this.cam.y) + 0.5); c.stroke();
    }
  };
})();

<script>/* src/input.js */
// 鍵盤 / 手把 / 虛擬輸入
(function () {
  const NAMES = ['left', 'right', 'up', 'down', 'jump', 'attack', 'select', 'start'];

  // 按鍵綁定（action → KeyboardEvent.code 陣列）；設定頁可透過 KB.input.rebind 修改
  const BINDINGS = {
    left: ['ArrowLeft', 'KeyA'],
    right: ['ArrowRight', 'KeyD'],
    up: ['ArrowUp', 'KeyW'],
    down: ['ArrowDown', 'KeyS'],
    jump: ['KeyZ', 'KeyK', 'Space'],
    attack: ['KeyX', 'KeyJ'],
    select: ['ShiftLeft', 'ShiftRight', 'KeyL', 'KeyC'],
    start: ['Enter', 'Escape', 'KeyP'],
  };
  // code → 顯示名稱（供設定頁 / 說明頁）
  const CODE_NAMES = {
    ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓',
    Space: '空白鍵', Enter: 'Enter', Escape: 'Esc', Tab: 'Tab', Backspace: 'BkSp',
    ShiftLeft: 'Shift', ShiftRight: 'Shift(右)', ControlLeft: 'Ctrl', ControlRight: 'Ctrl(右)',
    AltLeft: 'Alt', AltRight: 'Alt(右)', NumpadEnter: 'Enter(數字)',
  };
  function codeName(code) {
    if (CODE_NAMES[code]) return CODE_NAMES[code];
    if (/^Key[A-Z]$/.test(code)) return code.slice(3);
    if (/^Digit[0-9]$/.test(code)) return code.slice(5);
    if (/^Numpad[0-9]$/.test(code)) return '數字' + code.slice(6);
    if (/^F[0-9]+$/.test(code)) return code;
    return code;
  }

  // 手把（標準配置）：0=A(下) 1=B(右) 2=X(左) 3=Y(上)
  const GP_BINDINGS = {
    jump: [0, 1],          // A / B
    attack: [2, 3],        // X / Y
    select: [4, 5, 8],     // L / R / Back
    start: [9],            // Start
    left: [14], right: [15], up: [12], down: [13],   // D-pad
  };
  const DEADZONE = 0.35;   // 類比搖桿死區

  let MAP = {};
  function rebuildMap() {
    MAP = {};
    for (const n of NAMES) for (const c of (BINDINGS[n] || [])) MAP[c] = n;
  }
  rebuildMap();

  const cur = {}, prev = {}, raw = {}, virt = {};
  let anyKey = false, virtualOnly = false, gpActive = false;
  NAMES.forEach(n => { cur[n] = false; prev[n] = false; raw[n] = false; });

  window.addEventListener('keydown', e => {
    const n = MAP[e.code]; if (!n) return;
    if (!raw[n]) anyKey = true;
    raw[n] = true; e.preventDefault();
    if (KB.audio && KB.audio.unlock) KB.audio.unlock();
  });
  window.addEventListener('keyup', e => { const n = MAP[e.code]; if (n) { raw[n] = false; e.preventDefault(); } });
  window.addEventListener('blur', () => NAMES.forEach(n => raw[n] = false));

  function pollGamepad() {
    const gps = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const gp of gps) {
      if (!gp || gp.connected === false) continue;
      const b = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
      const btn = arr => (arr || []).some(b);
      // 類比搖桿：套死區（D-pad 與搖桿同時支援）
      const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
      const hx = Math.abs(ax) >= DEADZONE ? ax : 0, hy = Math.abs(ay) >= DEADZONE ? ay : 0;
      const g = {
        left: btn(GP_BINDINGS.left) || hx < 0, right: btn(GP_BINDINGS.right) || hx > 0,
        up: btn(GP_BINDINGS.up) || hy < 0, down: btn(GP_BINDINGS.down) || hy > 0,
        jump: btn(GP_BINDINGS.jump), attack: btn(GP_BINDINGS.attack),
        select: btn(GP_BINDINGS.select), start: btn(GP_BINDINGS.start),
      };
      return g;
    }
    return null;
  }

  KB.input = {
    update() {
      const gp = pollGamepad();
      gpActive = !!gp;
      for (const n of NAMES) {
        prev[n] = cur[n];
        let v = raw[n] || (gp && gp[n]) || false;
        if (virtualOnly) v = false;
        if (virt[n]) v = true;
        cur[n] = !!v;
      }
      if (gp && Object.values(gp).some(Boolean) && KB.audio && KB.audio.unlock) KB.audio.unlock();
      const a = anyKey; anyKey = false; return a;
    },
    down(n) { return cur[n]; },
    pressed(n) { return cur[n] && !prev[n]; },
    released(n) { return !cur[n] && prev[n]; },
    any() { return NAMES.some(n => cur[n] && !prev[n]); },
    anyDown() { return NAMES.some(n => cur[n]); },
    // 虛擬輸入（除錯 / 截圖）
    setVirtual(obj, exclusive) { NAMES.forEach(n => virt[n] = !!(obj && obj[n])); virtualOnly = !!exclusive; },
    clearVirtual() { NAMES.forEach(n => virt[n] = false); virtualOnly = false; },

    // ---------- 按鍵重映射（供設定頁） ----------
    ACTIONS: NAMES.slice(),
    ACTION_NAMES: { left: '左', right: '右', up: '上', down: '下', jump: '跳躍', attack: '攻擊 / 吸入', select: '丟棄能力', start: '暫停' },
    BINDINGS,
    GAMEPAD: GP_BINDINGS,
    deadzone: DEADZONE,
    gamepadActive() { return gpActive; },
    /** 重新綁定：rebind('jump', ['KeyZ','Space'])；回傳是否成功 */
    rebind(action, codes) {
      if (!BINDINGS[action]) return false;
      const list = (Array.isArray(codes) ? codes : [codes]).filter(c => typeof c === 'string' && c);
      if (!list.length) return false;
      // 其他動作若佔用同一鍵，先移除避免衝突
      for (const a of NAMES) {
        if (a === action) continue;
        BINDINGS[a] = BINDINGS[a].filter(c => list.indexOf(c) < 0);
      }
      BINDINGS[action] = list.slice();
      rebuildMap();
      return true;
    },
    /** 取得某動作目前按鍵的顯示名稱陣列，例如 keyNames('jump') → ['Z','K','空白鍵'] */
    keyNames(action) { return (BINDINGS[action] || []).map(codeName); },
    /** 單一 code 的顯示名稱 */
    codeName,
    /** 還原預設綁定 */
    resetBindings() {
      BINDINGS.left = ['ArrowLeft', 'KeyA']; BINDINGS.right = ['ArrowRight', 'KeyD'];
      BINDINGS.up = ['ArrowUp', 'KeyW']; BINDINGS.down = ['ArrowDown', 'KeyS'];
      BINDINGS.jump = ['KeyZ', 'KeyK', 'Space']; BINDINGS.attack = ['KeyX', 'KeyJ'];
      BINDINGS.select = ['ShiftLeft', 'ShiftRight', 'KeyL', 'KeyC']; BINDINGS.start = ['Enter', 'Escape', 'KeyP'];
      rebuildMap(); return true;
    },

    // 供 UI 顯示的按鍵說明
    HELP: [
      ['方向鍵 / WASD', '移動、蹲下、進門、爬梯'],
      ['Z / K / 空白鍵', '跳躍（空中再按＝漂浮）'],
      ['X / J', '吸入 / 吐出 / 使用能力'],
      ['↓', '吞下（獲得能力）'],
      ['↓ + 跳', '滑鏟／平台上穿下'],
      ['Shift / L', '丟棄能力'],
      ['Enter / Esc', '暫停 / 確認'],
      ['手把', 'A·B 跳　X·Y 攻擊'],
    ],
  };
})();

</script>
<script>/* src/audio.js */
// 音訊：全部以 Web Audio API 即時合成，零外部檔案（agent: audio）
//
// - 音效：振盪器（方波 / 25%、12.5% 脈衝波 / 三角波 / 鋸齒波）+ 白噪音 AudioBuffer + Biquad 濾波 + GainNode 包絡
// - 音樂：自製 4 軌 step sequencer —— p1 主旋律(25% 脈衝)、p2 和聲/對位(12.5% 脈衝)、bass 三角波、drum 噪音鼓
//   每小節 16 步（16 分音符）；音符以 'C4' / 'F#4' / 'Bb3' 表示，'-' 延音，'.' 休止；鼓：k 大鼓 s 小鼓 h 閉鈸 o 開鈸 c 鈸
//   以 AudioContext 時間預排（每 25ms 排未來 100ms），切歌時舊曲淡出；同 key 不重啟；unlock 後自動播放 pending 曲目
// - 所有旋律皆為本專案原創
// - 所有對外呼叫皆 try/catch：無 AudioContext / headless / 尚未 unlock 一律靜默不拋錯；?mute=1 靜音；M 鍵切換靜音
//
// 介面：KB.audio.sfx(name) / music(key|null) / unlock() / setMute(bool) / toggleMute() / status()
//       KB.audio.setVolume({music, sfx}) / getVolume() → {music, sfx, muted}（0~1，存 KB.save.settings.audio）
//       KB.audio.duck(on)   暫停時把音樂平滑降到 30%（ui-menu 於暫停 / 恢復呼叫）
//       KB.audio.SFX_NAMES / MUSIC_NAMES / SONGS / compileSong / noteFreq / renderSong / renderSfx（離線渲染，供測試工具）
(function () {
  const W = (typeof window !== 'undefined') ? window : {};
  const AC = W.AudioContext || W.webkitAudioContext || null;
  const OAC = W.OfflineAudioContext || W.webkitOfflineAudioContext || null;
  const VOL = { master: 0.5, sfx: 1.0, music: 0.6 };   // 混音基準：主音量 0.5；音樂比音效小
  const UVOL = { music: 1, sfx: 1 };                    // 使用者音量 0~1（乘在基準上），存檔於 KB.save.settings.audio
  const DUCK_PAUSE = 0.3, DUCK_TMP = 0.35;              // 暫停 / 短暫閃避時的音樂倍率
  const SAVE_KEY = 'kirbystar_save';
  const THROTTLE_MS = 80;                               // 同一音效 80ms 內不重複
  const LOOKAHEAD = 0.1, TICK_MS = 25;                  // 預排參數
  const nowMs = () => (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();

  // ======================================================================
  // 音符工具
  // ======================================================================
  const NOTE_IDX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const NOTE_RE = /^([A-G])([#b]?)(\d)$/;
  function noteNum(n) {
    const m = NOTE_RE.exec(n); if (!m) return null;
    return NOTE_IDX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (parseInt(m[3], 10) + 1) * 12;
  }
  function noteFreq(n) { const k = noteNum(n); return k === null ? null : 440 * Math.pow(2, (k - 69) / 12); }
  const F = noteFreq;

  // ======================================================================
  // AudioContext 與共用資源
  // ======================================================================
  let ctx = null, res = null, master = null, comp = null, sfxBus = null, musicBus = null;
  let unlocked = false, muted = !!(KB.MUTE), pendingMusic = undefined, autoSusp = false;
  const warned = {};
  function warnOnce(msg) { if (!warned[msg]) { warned[msg] = true; try { console.warn('[audio]', msg); } catch (e) { } } }

  // 任意佔空比脈衝波（傅立葉係數）
  function makePulse(c, duty) {
    const N = 48, re = new Float32Array(N), im = new Float32Array(N);
    for (let k = 1; k < N; k++) {
      re[k] = 2 / (k * Math.PI) * Math.sin(2 * Math.PI * k * duty);
      im[k] = 2 / (k * Math.PI) * (1 - Math.cos(2 * Math.PI * k * duty));
    }
    return c.createPeriodicWave(re, im);
  }
  function makeRes(c) {
    const r = {};
    try { r.p25 = makePulse(c, 0.25); r.p12 = makePulse(c, 0.125); } catch (e) { }
    const len = Math.floor(c.sampleRate * 1.0), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    r.noise = buf;
    return r;
  }
  function createCtx() {
    if (ctx || !AC) return;
    ctx = new AC();
    res = makeRes(ctx);
    master = ctx.createGain(); master.gain.value = muted ? 0 : VOL.master;
    try { comp = ctx.createDynamicsCompressor(); comp.threshold.value = -10; comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.15; master.connect(comp); comp.connect(ctx.destination); }
    catch (e) { master.connect(ctx.destination); }
    sfxBus = ctx.createGain(); sfxBus.gain.value = VOL.sfx * UVOL.sfx; sfxBus.connect(master);
    musicBus = ctx.createGain(); musicBus.gain.value = VOL.music * UVOL.music * duckFactor(); musicBus.connect(master);
    if (ctx.addEventListener) ctx.addEventListener('statechange', () => { try { if (ctx.state === 'running') { unlocked = true; startPending(); } } catch (e) { } });
  }
  function setWave(o, w) {
    if (w === 'p25' && res && res.p25) { o.setPeriodicWave(res.p25); return; }
    if (w === 'p12' && res && res.p12) { o.setPeriodicWave(res.p12); return; }
    o.type = (w === 'tri') ? 'triangle' : (w === 'saw') ? 'sawtooth' : (w === 'sine') ? 'sine' : 'square';
  }

  // ======================================================================
  // 音量 / 閃避（duck）
  // ======================================================================
  // 音樂倍率：暫停中 30%；短暫閃避（能力取得 jingle）35%；兩者同時取較低
  let duckHold = false, duckTmp = false, duckTimer = null;
  function duckFactor() { return duckHold ? DUCK_PAUSE : (duckTmp ? DUCK_TMP : 1); }
  const clamp01 = (v) => v < 0 ? 0 : v > 1 ? 1 : v;
  function applyVolume(fast) {
    try {
      if (!ctx) return;
      const t = ctx.currentTime, tc = fast ? 0.008 : 0.04;
      if (sfxBus) sfxBus.gain.setTargetAtTime(VOL.sfx * UVOL.sfx, t, 0.008);
      if (musicBus) musicBus.gain.setTargetAtTime(VOL.music * UVOL.music * duckFactor(), t, tc);
    } catch (e) { }
  }
  // 短暫閃避音樂 sec 秒（重複呼叫會延長）
  function duckFor(sec) {
    try {
      duckTmp = true;
      if (duckTimer) clearTimeout(duckTimer);
      duckTimer = setTimeout(() => { duckTimer = null; duckTmp = false; applyVolume(); }, Math.max(0, sec) * 1000);
      applyVolume();
    } catch (e) { }
  }

  // ---- 音量存檔（KB.save.settings.audio = {music, sfx}）----
  let volFromSave = false;
  function readSavedAudio() {
    try {
      if (KB.save && KB.save.settings && KB.save.settings.audio) { volFromSave = true; return KB.save.settings.audio; }
      const ls = W.localStorage; if (!ls) return null;
      const raw = ls.getItem(SAVE_KEY); if (!raw) return null;
      const o = JSON.parse(raw);
      return (o && o.settings && o.settings.audio) || null;
    } catch (e) { return null; }
  }
  function loadVolume() {
    try {
      const a = readSavedAudio(); if (!a) return;
      if (typeof a.music === 'number' && isFinite(a.music)) UVOL.music = clamp01(a.music);
      if (typeof a.sfx === 'number' && isFinite(a.sfx)) UVOL.sfx = clamp01(a.sfx);
      applyVolume(true);
    } catch (e) { }
  }
  function saveVolume() {
    try {
      const data = { music: UVOL.music, sfx: UVOL.sfx };
      if (KB.save) {
        KB.save.settings = KB.save.settings || {};
        KB.save.settings.audio = data;
        volFromSave = true;
        if (typeof KB.saveGame === 'function') KB.saveGame();
        return;
      }
      const ls = W.localStorage; if (!ls) return;          // KB.save 尚未建立（audio.js 早於 game.js 載入）
      let o = {}; try { o = JSON.parse(ls.getItem(SAVE_KEY) || '{}') || {}; } catch (e) { o = {}; }
      o.settings = o.settings || {}; o.settings.audio = data;
      ls.setItem(SAVE_KEY, JSON.stringify(o));
    } catch (e) { }
  }

  // ======================================================================
  // 合成基元
  // ======================================================================
  // 單音。w 波形、f0 起始頻率、t0 開始秒、dur 長度、vol 音量。
  // o.to 指數滑音目標（o.slideT 滑音時間，預設 dur）；o.seg [[dt,f],...] 折線滑音；o.steps [[dt,f],...] 階梯跳頻
  // o.vib {rate,depth,delay} 顫音；o.attack / o.release；o.decay + o.sustain 起音後衰減到持續音量
  function tone(bus, w, f0, t0, dur, vol, o) {
    o = o || {};
    const osc = ctx.createOscillator(), g = ctx.createGain();
    setWave(osc, w);
    const fp = osc.frequency;
    fp.setValueAtTime(f0, t0);
    if (o.to) fp.exponentialRampToValueAtTime(Math.max(1, o.to), t0 + (o.slideT || dur));
    if (o.seg) for (const s of o.seg) fp.exponentialRampToValueAtTime(Math.max(1, s[1]), t0 + s[0]);
    if (o.steps) for (const s of o.steps) fp.setValueAtTime(s[1], t0 + s[0]);
    const a = o.attack || 0.005, r = o.release || 0.03;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + a);
    if (o.decay) g.gain.setTargetAtTime(vol * (o.sustain || 0.6), t0 + a, o.decay);
    g.gain.setTargetAtTime(0, t0 + Math.max(a, dur - r), r / 3);
    osc.connect(g); g.connect(bus);
    if (o.vib) {
      const l = ctx.createOscillator(), lg = ctx.createGain();
      l.frequency.value = o.vib.rate; lg.gain.value = f0 * o.vib.depth;
      l.connect(lg); lg.connect(fp); l.start(t0 + (o.vib.delay || 0)); l.stop(t0 + dur + 0.1);
    }
    osc.start(t0); osc.stop(t0 + dur + 0.12);
    osc.onended = () => { try { osc.disconnect(); g.disconnect(); } catch (e) { } };
  }
  // 白噪音。o.type 濾波（lowpass/highpass/bandpass），o.f0→o.f1 濾波頻率掃頻，o.q，o.wobble 顫抖頻率(Hz)，o.decay
  function noise(bus, t0, dur, vol, o) {
    o = o || {};
    const src = ctx.createBufferSource(); src.buffer = res.noise; src.loop = true;
    if (o.rate) src.playbackRate.value = o.rate;
    const g = ctx.createGain();
    const a = o.attack || 0.004, r = o.release || 0.03;
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + a);
    if (o.decay) g.gain.setTargetAtTime(vol * 0.3, t0 + a, o.decay);
    g.gain.setTargetAtTime(0, t0 + Math.max(a, dur - r), r / 3);
    let last = src;
    if (o.type) {
      const f = ctx.createBiquadFilter(); f.type = o.type; f.Q.value = o.q || 0.8;
      f.frequency.setValueAtTime(o.f0 || 1000, t0);
      if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t0 + (o.slideT || dur));
      src.connect(f); last = f;
    }
    if (o.wobble) {
      const l = ctx.createOscillator(), lg = ctx.createGain();
      l.type = 'sine'; l.frequency.value = o.wobble; lg.gain.value = vol * 0.45;
      l.connect(lg); lg.connect(g.gain); l.start(t0); l.stop(t0 + dur + 0.1);
    }

    bpm: 80, loop: false, order: ['A'], inst: { p1: 'sq' },
    sec: {
      A: {
        p1: ['E5 - - - C5 - - - A4 - - - - - - -',
          'D5 - - - B4 - - - G#4 - - - - - - -',
          'C5 - B4 - A4 - G#4 - E4 - - - - - - -',
          'A4 - - - - - - - - - - - - - - -'],
        p2: ['C5 - - - A4 - - - E4 - - - - - - -',
          'B4 - - - G#4 - - - E4 - - - - - - -',
          'E4 - D4 - C4 - B3 - . . . . . . . .',
          'C4 - - - - - - - - - - - - - - -'],
        bass: [hold('A2'), hold('E2'), half('E2', 'E2'), hold('A2')],
        drum: [D.none, D.none, D.none, 'k . . . . . . . . . . . . . . .'],
      },
    },
  };

  // ---- ending：C 大調，溫馨緩慢，八分琶音鋪底 ----
  {
    const C = arpE('C4', 'E4', 'G4', 'E4'), G = arpE('B3', 'D4', 'G4', 'D4'), Am = arpE('A3', 'C4', 'E4', 'C4'), Fc = arpE('A3', 'C4', 'F4', 'C4'), Em = arpE('G3', 'B3', 'E4', 'B3');
    SONGS.ending = {
      bpm: 96, loop: true, order: ['A', 'B'], inst: { p1: 'sq' }, vol: { p1: 0.17, p2: 0.1 },
      sec: {
        A: {
          p1: ['E5 - - - G5 - - - C6 - - - B5 - - -',
            'A5 - - - - - - - G5 - - - D5 - - -',
            'E5 - - - A5 - - - C6 - - - B5 - A5 -',
            'G5 - - - - - - - F5 - - - - - . .',
            'E5 - - - G5 - - - C6 - - - D6 - - -',
            'B5 - - - - - - - A5 - - - G5 - - -',
            'A5 - - - - - G5 - F5 - - - D5 - - -',
            'C5 - - - - - - - . . . . . . . .'],
          p2: [C, G, Am, Fc, C, G, Fc, C],
          bass: [half('C3', 'G2'), half('G2', 'D3'), half('A2', 'E3'), half('F2', 'C3'), half('C3', 'G2'), half('G2', 'D3'), half('F2', 'C3'), hold('C3')],
          drum: [D.quiet, D.quiet, D.quiet, D.quiet, D.quiet, D.quiet, D.quiet, D.quiet],
        },
        B: {
          p1: ['F5 - - - A5 - - - C6 - - - - - - -',
            'B5 - - - D6 - - - G5 - - - - - - -',
            'G5 - - - B5 - - - E6 - - - D6 - - -',
            'C6 - - - - - - - A5 - - - - - - -',
            'F5 - - - A5 - - - C6 - - - D6 - - -',
            'B5 - - - - - - - D6 - - - - - - -',
            'E6 - - - - - - - C6 - - - - - - -',
            'C6 - - - - - - - - - - - - - - -'],
          p2: [Fc, G, Em, Am, Fc, G, C, C],
          bass: [half('F2', 'C3'), half('G2', 'D3'), half('E2', 'B2'), half('A2', 'E3'), half('F2', 'C3'), half('G2', 'D3'), half('C3', 'G2'), hold('C3')],
          drum: [D.quiet, D.quiet, D.quiet, D.quiet, D.quiet, D.quiet, D.quiet, D.none],
        },
      },
    };
  }

  // ---- 變奏工具：移調（鼓軌不動），由既有曲目衍生第二階段 / 變奏曲 ----
  const SHARP = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  function shiftTok(tok, semis) {
    if (tok === '.' || tok === '-') return tok;
    const k = noteNum(tok); if (k === null) return tok;
    const n = k + semis;
    return SHARP[((n % 12) + 12) % 12] + (Math.floor(n / 12) - 1);
  }
  const shiftBar = (bar, semis) => bar.trim().split(/\s+/).map(t => shiftTok(t, semis)).join(' ');
  // p1 / p2（預設連 bass）整體移調；bpm 可變；bass / drum 可整段替換（陣列長度需與原段落相同）
  function variation(srcKey, o) {
    const s = SONGS[srcKey];
    const out = { bpm: o.bpm || s.bpm, loop: true, order: (s.order || Object.keys(s.sec)).slice(), sec: {} };
    if (s.inst) out.inst = s.inst;
    if (o.vol || s.vol) out.vol = o.vol || s.vol;
    if (o.gain || s.gain) out.gain = o.gain || s.gain;
    for (const name of Object.keys(s.sec)) {
      const sec = s.sec[name];
      out.sec[name] = {
        p1: sec.p1.map(b => shiftBar(b, o.semis)),
        p2: sec.p2.map(b => shiftBar(b, o.semis)),
        bass: (o.bass && o.bass[name]) || sec.bass.map(b => shiftBar(b, o.semis)),
        drum: (o.drum && o.drum[name]) || sec.drum.slice(),
      };
    }
    return out;
  }
  const dr8 = (r, x) => `${r} - ${r} - ${x} - ${r} - ${r} - ${r} - ${x} - ${r} -`;   // 八分音符驅動貝斯
  D.tight = 'k . h k s . h h k k h . s . s h';      // 短促密集鼓
  D.tightF = 'k h s h k h s s k h s s s s s s';     // 短促鼓 fill

  // ---- boss2：boss 的第二階段變奏（BPM +12、升 2 半音 E 小調→F# 小調、低音 8 分音符、短促鼓）----
  SONGS.boss2 = variation('boss', {
    bpm: 184, semis: 2, vol: { p1: 0.19, p2: 0.11, bass: 0.34 },
    bass: {
      A: [dr8('F#2', 'F#3'), dr8('F#2', 'C#3'), dr8('D2', 'A2'), dr8('C#2', 'G#2'),
        dr8('F#2', 'F#3'), dr8('F#2', 'C#3'), dr8('D2', 'A2'), dr8('C#2', 'G#2')],
      B: [dr8('B2', 'F#3'), dr8('F#2', 'C#3'), dr8('D2', 'A2'), dr8('C#2', 'G#2'),
        dr8('B2', 'F#3'), dr8('F#2', 'C#3'), dr8('D2', 'A2'), dr8('C#2', 'G#2')],
    },
    drum: {
      A: [D.tight, D.tight, D.tight, D.tightF, D.tight, D.tight, D.tight, D.tightF],
      B: [D.tight, D.tight, D.tight, D.tightF, D.tight, D.tight, D.tight, D.tightF],
    },
  });

  // ---- finalboss2：finalboss 的第二階段變奏（BPM +12、升 2 半音 D 小調→E 小調、雙倍鼓）----
  SONGS.finalboss2 = variation('finalboss', {
    bpm: 196, semis: 2, gain: 0.95,
    drum: {
      A: [D.dblH, D.dblH, D.dblH, D.tightF, D.dblH, D.dblH, D.dblH, D.tightF],
      B: [D.dblH, D.dblH, D.dblH, D.tightF, D.dblH, D.dblH, D.dblH, D.tightF],
    },
  });

  // ---- secret：秘密房，A 小調 8 小節神祕短循環（A/B 各 4 小節，order 走兩輪）----
  SONGS.secret = {
    bpm: 100, loop: true, gain: 0.85, order: ['A', 'B', 'A', 'B'],
    inst: { p1: 'p12', p2: 'sine' }, vol: { p1: 0.16, p2: 0.1, bass: 0.24 },
    sec: {
      A: {
        p1: ['A5 - - - . . C6 - B5 - - - - - - -',
          'E5 - - - . . G#5 - A5 - - - - - - -',
          'D6 - - - C6 - B5 - A5 - - - G#5 - - -',
          'A5 - - - - - - - . . . . . . . .'],
        p2: [arpE('A4', 'C5', 'E5', 'C5'), arpE('E4', 'G#4', 'B4', 'G#4'),
          arpE('F4', 'A4', 'D5', 'A4'), arpE('E4', 'G#4', 'B4', 'G#4')],
        bass: [hold('A2'), hold('E2'), hold('F2'), hold('E2')],
        drum: [D.hats, D.none, D.hats, D.sparse],
      },
      B: {
        p1: ['F5 - - - A5 - - - C6 - - - - - - -',
          'E5 - - - G5 - - - B5 - - - - - - -',
          'C6 - B5 - A5 - G#5 - F5 - E5 - D5 - C5 -',
          'B4 - - - - - - - E5 - - - . . . .'],
        p2: [arpE('F4', 'A4', 'C5', 'A4'), arpE('E4', 'G4', 'B4', 'G4'),
          arpE('A4', 'C5', 'E5', 'C5'), arpE('E4', 'G#4', 'B4', 'G#4')],
        bass: [hold('F2'), hold('E2'), hold('A2'), hold('E2')],
        drum: [D.hats, D.none, D.hats, D.sparse2],
      },
    },
  };

  // ---- miniboss：中魔王，A 小調 16 小節緊湊 loop ----
  {
    const A1 = 'A5 A5 - E5 - A5 - C6 - - B5 - A5 - - -';
    const A2 = 'G5 G5 - D5 - G5 - B5 - - A5 - G5 - - -';
    const B1 = 'E6 - - - C6 - E6 - A5 - - - C6 - E6 -';
    const B2 = 'D6 - - - B5 - D6 - G5 - - - B5 - D6 -';
    const END = 'A5 - - - E5 - - - A4 - - - . . . .';
    SONGS.miniboss = {
      bpm: 168, loop: true, order: ['A', 'B'], inst: { p1: 'sq' }, vol: { p1: 0.19, p2: 0.11, bass: 0.3 },
      sec: {
        A: {
          p1: [A1, A2,
            'F5 - A5 - C6 - A5 - E5 - G5 - B5 - G5 -',
            'E5 - - - . . G#5 - B5 - - - E5 - . .',
            A1, A2,
            'F5 - - - E5 - D5 - C6 - - - B5 - A5 -',
            END],
          p2: [stab('C5', 'E5'), stab('B4', 'D5'), stab('A4', 'C5'), stab('G#4', 'B4'),
            stab('C5', 'E5'), stab('B4', 'D5'), stab('A4', 'C5'), stab('G#4', 'B4')],
          bass: [dr8('A2', 'A3'), dr8('G2', 'G3'), dr8('F2', 'C3'), dr8('E2', 'B2'),
            dr8('A2', 'A3'), dr8('G2', 'G3'), dr8('F2', 'C3'), dr8('E2', 'B2')],
          drum: [D.boss, D.boss, D.boss, D.bossF, D.boss, D.boss, D.boss, D.bossF],
        },
        B: {
          p1: [B1, B2,
            'C6 - E6 - A6 - - - G#6 - E6 - C6 - A5 -',
            'B5 - - - E6 - - - B5 - G#5 - E5 - . .',
            B1, B2,
            'F6 - E6 - D6 - C6 - B5 - A5 - G#5 - B5 -',
            END],
          p2: [stab('C5', 'E5'), stab('B4', 'D5'), stab('C5', 'E5'), stab('G#4', 'B4'),
            stab('C5', 'E5'), stab('B4', 'D5'), stab('A4', 'C5'), stab('G#4', 'B4')],
          bass: [dr8('A2', 'E3'), dr8('G2', 'D3'), dr8('A2', 'E3'), dr8('E2', 'B2'),
            dr8('A2', 'E3'), dr8('G2', 'D3'), dr8('F2', 'C3'), dr8('E2', 'B2')],
          drum: [D.tight, D.tight, D.tight, D.tightF, D.tight, D.tight, D.tight, D.tightF],
        },
      },
    };
  }

  // ======================================================================
  // 音序器
  // ======================================================================
  const TRACKS = ['p1', 'p2', 'bass', 'drum'];
  const DEF_INST = { p1: 'p25', p2: 'p12', bass: 'tri' };
  const DEF_VOL = { p1: 0.2, p2: 0.12, bass: 0.28 };
  const STEPS = 16;

  // 展開段落順序 → 每軌 token 陣列（長度 = 小節數 × 16）
  function compileSong(song) {
    const order = song.order || Object.keys(song.sec);
    const tracks = { p1: [], p2: [], bass: [], drum: [] };
    for (const name of order) {
      const sec = song.sec[name] || {};
      const nb = Math.max.apply(null, TRACKS.map(k => (sec[k] || []).length));
      for (const k of TRACKS) {
        const bars = sec[k] || [];
        for (let b = 0; b < nb; b++) {
          const toks = bars[b] ? bars[b].trim().split(/\s+/) : [];
          for (let i = 0; i < STEPS; i++) tracks[k].push(toks[i] || '.');
        }
      }
    }
    return { tracks, len: tracks.p1.length, bars: tracks.p1.length / STEPS, stepDur: 60 / song.bpm / 4 };
  }

  function seqNote(bus, w, f, t0, dur, vol, lead) {
    const o = { attack: 0.004, release: 0.02, decay: 0.12, sustain: 0.75 };
    if (lead && dur > 0.3) o.vib = { rate: 5.5, depth: 0.004, delay: 0.12 };
    tone(bus, w, f, t0, dur, vol, o);
  }
  function drum(bus, k, t) {
    if (k === 'k') tone(bus, 'tri', 170, t, 0.11, 0.6, { to: 45, slideT: 0.07, attack: 0.002, release: 0.05 });
    else if (k === 's') { noise(bus, t, 0.11, 0.28, { type: 'bandpass', f0: 1800, q: 0.6, release: 0.06 }); tone(bus, 'tri', 220, t, 0.06, 0.3, { to: 120, attack: 0.002 }); }
    else if (k === 'h') noise(bus, t, 0.03, 0.13, { type: 'highpass', f0: 8000, release: 0.02 });
    else if (k === 'o') noise(bus, t, 0.12, 0.13, { type: 'highpass', f0: 7000, release: 0.06 });
    else if (k === 'c') noise(bus, t, 0.5, 0.2, { type: 'highpass', f0: 5000, release: 0.3 });
  }
  // 排程第 i 步（時間 t）。p = { bus, song, tracks, stepDur }
  function scheduleStep(p, i, t) {
    const s = p.song, sd = p.stepDur;
    for (let k = 0; k < 3; k++) {
      const name = TRACKS[k], tr = p.tracks[name], tok = tr[i];
      if (!tok || tok === '-' || tok === '.') continue;
      const f = noteFreq(tok); if (!f) continue;
      let n = 1; while (i + n < tr.length && tr[i + n] === '-') n++;
      const inst = (s.inst && s.inst[name]) || DEF_INST[name];
      const vol = (s.vol && s.vol[name]) || DEF_VOL[name];
      seqNote(p.bus, inst, f, t, n * sd - 0.015, vol, name === 'p1');
    }
    const d = p.tracks.drum[i];
    if (d && d !== '.' && d !== '-') drum(p.bus, d, t);
  }

  let cur = null, timer = null;
  function tick() {
    if (!cur || !ctx) return;
    const p = cur, now = ctx.currentTime;
    if (p.nextT < now - 0.05) p.nextT = now + 0.02;      // 分頁被凍結後直接追上，不補播
    while (!p.ended && p.nextT < now + LOOKAHEAD) {
      scheduleStep(p, p.step, p.nextT);
      p.nextT += p.stepDur; p.step++;
      if (p.step >= p.len) { if (p.song.loop === false) p.ended = true; else p.step = 0; }
    }
    if (p.ended && timer) { clearInterval(timer); timer = null; }
  }
  function fadeOutCurrent() {
    if (!cur) return;
    const p = cur; cur = null;
    try {
      const t = ctx.currentTime;
      p.bus.gain.cancelScheduledValues(t); p.bus.gain.setTargetAtTime(0, t, 0.1);
      setTimeout(() => { try { p.bus.disconnect(); } catch (e) { } }, 1500);
    } catch (e) { }
  }
  function startSong(key) {
    const song = SONGS[key]; if (!song) return;
    fadeOutCurrent();
    const g = ctx.createGain(); g.gain.value = 0; g.connect(musicBus);
    const t = ctx.currentTime;
    g.gain.setTargetAtTime(song.gain || 1, t, 0.03);
    const c = compileSong(song);
    cur = { key, song, bus: g, tracks: c.tracks, len: c.len, stepDur: c.stepDur, step: 0, nextT: t + 0.05, ended: false };
    if (!timer) timer = setInterval(() => { try { tick(); } catch (e) { } }, TICK_MS);
    tick();
  }
  function startPending() {
    if (pendingMusic === undefined) return;
    const k = pendingMusic; pendingMusic = undefined;
    KB.audio.music(k);
  }

  // 離線渲染（測試工具用）：回傳 Promise<AudioBuffer>
  function withOffline(seconds, fn) {
    return new Promise((resolve, reject) => {
      if (!OAC) { reject(new Error('no OfflineAudioContext')); return; }
      const sr = 44100, oc = new OAC(1, Math.ceil(sr * seconds), sr);
      const saved = [ctx, res]; ctx = oc; res = makeRes(oc);
      try {
        const bus = oc.createGain(); bus.connect(oc.destination);
        fn(oc, bus);
      } catch (e) { ctx = saved[0]; res = saved[1]; reject(e); return; }
      ctx = saved[0]; res = saved[1];
      oc.startRendering().then(resolve, reject);
    });
  }
  function renderSong(key, seconds) {
    const song = SONGS[key]; if (!song) return Promise.reject(new Error('unknown song ' + key));
    const c = compileSong(song);
    if (seconds === undefined) seconds = (song.loop === false ? c.bars * 16 * c.stepDur + 1.5 : c.bars * 16 * c.stepDur);
    return withOffline(seconds, (oc, bus) => {
      bus.gain.value = VOL.master * VOL.music * (song.gain || 1);
      const p = { bus, song, tracks: c.tracks, stepDur: c.stepDur };
      let t = 0.02, i = 0;
      while (t < seconds) { scheduleStep(p, i, t); t += c.stepDur; i++; if (i >= c.len) { if (song.loop === false) break; i = 0; } }
    });
  }
  function renderSfx(name, seconds) {
    const fn = SFX[name]; if (!fn) return Promise.reject(new Error('unknown sfx ' + name));
    seconds = seconds || 2.5;
    return withOffline(seconds, (oc, bus) => { bus.gain.value = VOL.master * VOL.sfx; fn(bus, 0.02, seconds - 0.3); });
  }

  // ======================================================================
  // 對外介面
  // ======================================================================
  const lastPlay = {};
  KB.audio = {
    get ctx() { return ctx; },
    get unlocked() { return unlocked; },
    get muted() { return muted; },
    musicKey: null,
    SFX_NAMES: Object.keys(SFX),
    MUSIC_NAMES: Object.keys(SONGS),
    SONGS, TRACKS, compileSong, noteFreq, renderSong, renderSfx,

    // 第一次使用者輸入時呼叫（keydown / pointerdown / 手把）
    unlock() {
      try {
        if (!AC) return;
        if (!volFromSave && KB.save) loadVolume();   // game.js 建立 KB.save 之後才讀得到存檔設定
        if (!ctx) createCtx();
        if (ctx.state === 'running') { unlocked = true; startPending(); return; }
        const p = ctx.resume && ctx.resume();
        if (p && p.then) p.then(() => { unlocked = true; startPending(); }).catch(() => { });
      } catch (e) { }
    },
    sfx(name) {
      try {
        const fn = SFX[name];
        if (!fn) { warnOnce('unknown sfx: ' + name); return; }
        if (!ctx || !unlocked || muted || ctx.state !== 'running') return;
        const n = nowMs();
        if (lastPlay[name] && n - lastPlay[name] < THROTTLE_MS) return;
        lastPlay[name] = n;
        if (name === 'ability') duckFor(0.4);        // 能力取得 jingle：音樂短暫閃避
        fn(sfxBus, ctx.currentTime + 0.005);
      } catch (e) { }
    },
    music(key) {
      try {
        if (key === undefined) key = null;
        if (key !== null && !SONGS[key]) { warnOnce('unknown music: ' + key); key = null; }
        this.musicKey = key;
        if (!ctx || !unlocked || ctx.state !== 'running') { pendingMusic = key; if (key === null && cur) fadeOutCurrent(); return; }
        pendingMusic = undefined;
        if (key === null) { fadeOutCurrent(); return; }
        if (cur && cur.key === key && !cur.ended) return;   // 同曲不重啟
        startSong(key);
      } catch (e) { }
    },
    setMute(m) {
      try {
        muted = !!m;
        if (master && ctx) master.gain.setTargetAtTime(muted ? 0 : VOL.master, ctx.currentTime, 0.02);
      } catch (e) { }
    },
    toggleMute() { this.setMute(!muted); return muted; },
    // 音樂 / 音效音量（0~1，任一可省略）。寫入 KB.save.settings.audio 並存檔。
    setVolume(v) {
      try {
        v = v || {};
        let changed = false;
        if (typeof v.music === 'number' && isFinite(v.music)) { UVOL.music = clamp01(v.music); changed = true; }
        if (typeof v.sfx === 'number' && isFinite(v.sfx)) { UVOL.sfx = clamp01(v.sfx); changed = true; }
        if (changed) { applyVolume(true); saveVolume(); }
      } catch (e) { }
      return this.getVolume();
    },
    getVolume() { return { music: UVOL.music, sfx: UVOL.sfx, muted }; },
    // 暫停時呼叫 duck(true) 讓音樂平滑降到 30%，恢復時 duck(false)
    duck(on) {
      try { duckHold = (on === undefined) ? true : !!on; applyVolume(); } catch (e) { }
      return duckHold;
    },
    // 目前播放狀態（除錯 / 測試頁）
    status() {
      return {
        unlocked, muted, ctxState: ctx ? ctx.state : null, playing: cur ? cur.key : null,
        step: cur ? cur.step : 0, bars: cur ? cur.len / STEPS : 0, pending: pendingMusic,
        volume: { music: UVOL.music, sfx: UVOL.sfx }, ducked: duckHold,
        sfxCount: Object.keys(SFX).length, musicCount: Object.keys(SONGS).length,
      };
    },
  };

  loadVolume();   // 啟動時先由 localStorage 讀回音量（KB.save 由 game.js 稍後建立，unlock() 會再讀一次）

  // M 鍵切換靜音；分頁隱藏時暫停 AudioContext（避免背景堆積排程），顯示時恢復
  try {
    if (W.addEventListener) W.addEventListener('keydown', e => { if (e.code === 'KeyM' && !e.repeat) { KB.audio.unlock(); KB.audio.toggleMute(); } });
    if (typeof document !== 'undefined' && document.addEventListener) document.addEventListener('visibilitychange', () => {
      try {
        if (!ctx) return;
        if (document.hidden) { if (ctx.state === 'running') { autoSusp = true; ctx.suspend(); } }
        else if (autoSusp) { autoSusp = false; ctx.resume(); }
      } catch (e) { }
    });
  } catch (e) { }
})();

</script>
<script>/* src/tilemap.js */
// 磁磚地圖 + AABB 物理（含 45° 斜坡、單向平台、水、梯子）
(function () {
  const T = KB.TILE;
  const SOLID = { '#': 1, '*': 1, 'B': 1 };
  const SLOPE = { '/': 1, '\\': 1 };

  class TileMap {
    constructor(rows, deco) {
      const w = Math.max(...rows.map(r => r.length));
      this.w = w; this.h = rows.length;
      this.rows = rows.map(r => r.padEnd(w, '.').split(''));
      this.deco = deco ? deco.map(r => r.padEnd(w, '.').split('')) : null;
      this.pw = w * T; this.ph = this.h * T;
      this.anim = 0;
      this.pending = []; // 炸彈方塊連鎖
    }
    get(tx, ty) {
      if (tx < 0 || tx >= this.w) return '#';
      if (ty < 0) return '.';
      if (ty >= this.h) return '.';
      return this.rows[ty][tx];
    }
    set(tx, ty, ch) { if (tx >= 0 && tx < this.w && ty >= 0 && ty < this.h) this.rows[ty][tx] = ch; }
    at(px, py) { return this.get(Math.floor(px / T), Math.floor(py / T)); }
    static isSolid(ch) { return !!SOLID[ch]; }
    static isSlope(ch) { return !!SLOPE[ch]; }
    static isGround(ch) { return !!SOLID[ch] || !!SLOPE[ch]; }
    isSolidPx(px, py) {
      const ch = this.at(px, py);
      if (SOLID[ch]) return true;
      if (SLOPE[ch]) {
        const lx = ((px % T) + T) % T, ly = ((py % T) + T) % T;
        return ch === '/' ? (lx + ly >= T - 1) : (ly >= lx);
      }
      return false;
    }
    // 斜坡表面 y（世界 px）；非斜坡回傳 null
    slopeSurface(px, ty) {
      const tx = Math.floor(px / T), ch = this.get(tx, ty);
      if (!SLOPE[ch]) return null;
      const lx = Math.floor(((px % T) + T) % T);
      return ch === '/' ? ty * T + (T - 1 - lx) : ty * T + lx;
    }
    inWater(px, py) { return this.at(px, py) === '~'; }
    onLadder(px, py) { return this.at(px, py) === 'H'; }
    isSpike(px, py) { return this.at(px, py) === '^'; }

    // 破壞方塊（星星 / 炸彈），回傳是否有破壞
    breakBlock(tx, ty, byBomb) {
      const ch = this.get(tx, ty);
      if (ch !== '*' && ch !== 'B') return false;
      this.set(tx, ty, '.');
      const cx = tx * T + 8, cy = ty * T + 8;
      if (KB.fx) KB.fx('fx_blockbreak', cx, cy + 8);
      if (KB.particles) KB.particles(cx, cy, ch === 'B' ? '#f8e040' : '#ffd040', 8, { spread: 2.5 });
      if (KB.audio) KB.audio.sfx('block');
      if (ch === 'B') {
        // 連鎖：相鄰炸彈方塊與星星方塊延遲爆破
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const n = this.get(tx + dx, ty + dy);
          if (n === 'B' || n === '*') this.pending.push({ tx: tx + dx, ty: ty + dy, t: 6 });
        }
        if (KB.game) KB.game.shake = Math.max(KB.game.shake || 0, 6);
      }
      if (KB.game && KB.game.onBlockBroken) KB.game.onBlockBroken(tx, ty, ch);
      return true;
    }
    update() {
      this.anim++;
      if (this.pending.length) {
        const left = [];
        for (const p of this.pending) { p.t--; if (p.t <= 0) this.breakBlock(p.tx, p.ty, true); else left.push(p); }
        this.pending = left;
      }
    }

    // 選擇磁磚精靈名稱
    tileSprite(tx, ty, theme) {
      const ch = this.get(tx, ty);
      const g = (x, y) => TileMap.isGround(this.get(x, y));
      const pick = k => KB.has('tile_' + theme + '_' + k) ? 'tile_' + theme + '_' + k : 'tile_green_' + k;
      switch (ch) {
        case '#': {
          const up = g(tx, ty - 1), dn = g(tx, ty + 1), lf = g(tx - 1, ty), rt = g(tx + 1, ty);
          if (!up) { if (!lf && KB.has('tile_' + theme + '_topL')) return pick('topL'); if (!rt && KB.has('tile_' + theme + '_topR')) return pick('topR'); return pick('top'); }
          if (!lf && KB.has('tile_' + theme + '_left')) return pick('left');
          if (!rt && KB.has('tile_' + theme + '_right')) return pick('right');
          if (!dn && KB.has('tile_' + theme + '_bottom')) return pick('bottom');
          return pick('fill');
        }
        case '=': return pick('platform');
        case '/': return pick('slopeL');
        case '\\': return pick('slopeR');
        case '*': return 'tile_star';
        case 'B': return 'tile_bomb';
        case '^': return 'tile_spike';
        case '~': return this.get(tx, ty - 1) === '~' ? 'tile_water' : 'tile_water_top';
        case 'H': return 'tile_ladder';
      }
      return null;
    }

    draw(ctx, cam, theme, t) {
      const x0 = Math.max(0, Math.floor(cam.x / T)), x1 = Math.min(this.w - 1, Math.floor((cam.x + KB.W) / T) + 1);
      const y0 = Math.max(0, Math.floor(cam.y / T)), y1 = Math.min(this.h - 1, Math.floor((cam.y + KB.VIEW_H) / T) + 1);
      // 裝飾層先畫（在磁磚後面）
      if (this.deco) {
        for (let ty = y0 - 3; ty <= y1; ty++) for (let tx = x0 - 2; tx <= x1 + 2; tx++) {
          if (ty < 0 || ty >= this.h || tx < 0 || tx >= this.w) continue;
          const ch = this.deco[ty][tx]; if (ch === '.' || ch === ' ') continue;
          const nm = KB.has('deco_' + theme + '_' + ch) ? 'deco_' + theme + '_' + ch : (KB.has('deco_' + ch) ? 'deco_' + ch : null);
          if (nm) KB.drawSpr(ctx, nm, tx * T + 8 - cam.x, ty * T + T - cam.y, { t });
        }
      }
      for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
        const ch = this.rows[ty][tx];
        if (ch === '.' || ch === ' ') continue;
        if (ch === '~') {
          // 水：半透明疊在最後（見 drawWater）
          continue;
        }
        const nm = this.tileSprite(tx, ty, theme);
        if (nm) KB.drawSpr(ctx, nm, tx * T - cam.x, ty * T - cam.y, { anchor: 'topleft', t, frame: KB.SPR[nm] && KB.SPR[nm].n > 1 ? Math.floor(t * 4) % KB.SPR[nm].n : undefined, _tl: true });
      }
    }
    drawWater(ctx, cam, t) {
      const x0 = Math.max(0, Math.floor(cam.x / T)), x1 = Math.min(this.w - 1, Math.floor((cam.x + KB.W) / T) + 1);
      const y0 = Math.max(0, Math.floor(cam.y / T)), y1 = Math.min(this.h - 1, Math.floor((cam.y + KB.VIEW_H) / T) + 1);
      ctx.save(); ctx.globalAlpha = 0.72;
      for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
        if (this.rows[ty][tx] !== '~') continue;
        const nm = this.tileSprite(tx, ty, 'green');
        KB.drawSpr(ctx, nm, tx * T - cam.x, ty * T - cam.y, { frame: KB.SPR[nm] && KB.SPR[nm].n > 1 ? Math.floor(t * 3) % KB.SPR[nm].n : undefined, _tl: true });
      }
      ctx.restore();
    }
  }
  KB.TileMap = TileMap;

  // 磁磚精靈以左上為錨點：drawSpr 預設錨點是 bottom，所以此處包一層
  const _drawSpr = KB.drawSpr;
  KB.drawSpr = function (ctx, name, x, y, opts) {
    if (opts && opts._tl) {
      const s = KB.SPR[name]; if (s) { const f = s.frames[KB.frameIndex(s, opts)]; x += f.ax; y += f.ay; }
      else { x += 8; y += 16; }
    }
    return _drawSpr(ctx, name, x, y, opts);
  };

  // ---------- 物理 ----------
  KB.physics = {
    /**
     * e: {x,y,w,h,vx,vy,grav,maxFall,onGround,dropThrough}
     * 回傳 e，並設定 e.onGround / e.hitWall / e.hitCeil / e.onSlope
     */
    step(e, map) {
      const wasOnGround = e.onGround;
      e.hitWall = false; e.hitCeil = false; e.onSlope = false;
      if (e.grav) e.vy = Math.min(e.vy + e.grav, e.maxFall !== undefined ? e.maxFall : KB.MAXFALL);
      // ---- 水平 ----
      if (e.vx !== 0) {
        let nx = e.x + e.vx;
        // stepH：忽略身體最下方幾 px 的牆壁判定（讓斜坡旁的實心磚不會卡住腳）
        const stepH = e.stepH !== undefined ? Math.min(e.stepH, Math.floor(e.h / 2)) : 0;
        const top = e.y + 1, bot = e.y + e.h - 1 - stepH;
        if (e.vx > 0) {
          const edge = nx + e.w - 1;
          if (this.columnSolid(map, edge, top, bot)) { nx = Math.floor(edge / T) * T - e.w; e.vx = 0; e.hitWall = true; }
        } else {
          const edge = nx;
          if (this.columnSolid(map, edge, top, bot)) { nx = (Math.floor(edge / T) + 1) * T; e.vx = 0; e.hitWall = true; }
        }
        e.x = nx;
      }
      // ---- 垂直 ----
      const prevBottom = e.y + e.h;
      e.y += e.vy;
      e.onGround = false;
      const cx = e.x + e.w / 2;
      if (e.vy >= 0) {
        const bottom = e.y + e.h;
        // 斜坡（以中心點）
        let sy = this.slopeAt(map, cx, bottom - 1);
        if (sy === null) sy = this.slopeAt(map, cx, bottom);
        if (sy === null && wasOnGround) sy = this.slopeAt(map, cx, bottom + 4);
        if (sy !== null && bottom >= sy - 3 && bottom <= sy + 9) {
          e.y = sy - e.h; e.vy = 0; e.onGround = true; e.onSlope = true;
        } else {
          // 一般地面 / 平台 / 梯子頂端
          const feet = [e.x + 1, e.x + e.w - 2];
          let landed = false;
          for (const fx of feet) {
            const ty = Math.floor(bottom / T), tx = Math.floor(fx / T), ch = map.get(tx, ty);
            if (SOLID[ch] && !SLOPE[map.get(Math.floor(cx / T), ty)]) {
              if (prevBottom <= ty * T + 8) { e.y = ty * T - e.h; landed = true; }
            } else if ((ch === '=' || (ch === 'H' && map.get(tx, ty - 1) !== 'H')) && !e.dropThrough && prevBottom <= ty * T + 1 && e.vy >= 0) {
              e.y = ty * T - e.h; landed = true;
            }
          }
          if (!landed && wasOnGround && e.vy > 0 && e.vy <= 3 && !e.dropThrough) {
            // 走下斜坡 / 小落差時貼地
            const s2 = this.slopeAt(map, cx, bottom + 6);
            if (s2 !== null && s2 >= bottom - 1) { e.y = s2 - e.h; landed = true; e.onSlope = true; }
          }
          if (landed) { e.vy = 0; e.onGround = true; }
        }
      } else {
        // 上升：撞頭
        const topY = e.y;
        for (const hx of [e.x + 1, e.x + e.w - 2]) {
          if (map.isSolidPx(hx, topY) && !SLOPE[map.at(hx, topY)]) { e.y = (Math.floor(topY / T) + 1) * T; e.vy = 0; e.hitCeil = true; break; }
        }
      }
      // 卡進實心磁磚時往上推（安全處理）
      if (e.onGround === false && e.vy >= 0) {
        // nothing
      }
      e.fellOut = e.y > map.ph + 48;
      return e;
    },
    columnSolid(map, px, y0, y1) {
      const tx = Math.floor(px / T);
      for (let ty = Math.floor(y0 / T); ty <= Math.floor(y1 / T); ty++) {
        const ch = map.get(tx, ty);
        if (SOLID[ch]) return true;
      }
      return false;
    },
    slopeAt(map, px, py) {
      const ty = Math.floor(py / T);
      return map.slopeSurface(px, ty);
    },
    // 是否踩在地上（不移動的檢查）
    groundBelow(map, e) {
      const bottom = e.y + e.h, cx = e.x + e.w / 2;
      if (map.slopeSurface(cx, Math.floor(bottom / T)) !== null) return true;
      for (const fx of [e.x + 1, e.x + e.w - 2]) {
        const tx = Math.floor(fx / T), ty = Math.floor(bottom / T), ch = map.get(tx, ty);
        if (SOLID[ch] || ch === '=' || (ch === 'H' && map.get(tx, ty - 1) !== 'H')) return true;
      }
      return false;
    },
    // 往下 dist px 內是否有可落腳的表面（jump buffer 用）；表面必須在腳底或更下方
    groundWithin(map, e, dist) {
      const bottom = e.y + e.h, cx = e.x + e.w / 2, y1 = bottom + dist;
      for (let ty = Math.floor(bottom / T); ty <= Math.floor(y1 / T); ty++) {
        const s = map.slopeSurface(cx, ty);
        if (s !== null && s >= bottom - 1 && s <= y1) return true;
        if (ty * T < bottom - 1) continue;   // 磁磚表面在腳上方 → 不算
        for (const fx of [e.x + 1, e.x + e.w - 2]) {
          const tx = Math.floor(fx / T), ch = map.get(tx, ty);
          if (SOLID[ch] || ch === '=' || (ch === 'H' && map.get(tx, ty - 1) !== 'H')) return true;
        }
      }
      return false;
    },
    // 腳下是否只踩在單向平台 / 梯子頂端（可穿下去），實心磚 / 斜坡則回傳 false
    onPlatformOnly(map, e) {
      const bottom = e.y + e.h, cx = e.x + e.w / 2;
      if (map.slopeSurface(cx, Math.floor(bottom / T)) !== null) return false;
      let plat = false;
      for (const fx of [e.x + 1, e.x + e.w - 2]) {
        const tx = Math.floor(fx / T), ty = Math.floor(bottom / T), ch = map.get(tx, ty);
        if (SOLID[ch] || SLOPE[ch]) return false;
        if (ch === '=' || (ch === 'H' && map.get(tx, ty - 1) !== 'H')) plat = true;
      }
      return plat;
    },
    // 前方是否有懸崖（用於敵人 AI）
    edgeAhead(map, e) {
      const px = e.dir > 0 ? e.x + e.w + 2 : e.x - 2, py = e.y + e.h + 2;
      const ch = map.at(px, py);
      return !(SOLID[ch] || SLOPE[ch] || ch === '=');
    },
    wallAhead(map, e) {
      const px = e.dir > 0 ? e.x + e.w + 1 : e.x - 1;
      return this.columnSolid(map, px, e.y + 2, e.y + e.h - 2);
    },
  };
})();

</script>
<script>/* src/entity.js */
// Entity 基底、敵人基底、攻擊判定框、特效、投射物、粒子
(function () {
  let NEXT_ID = 1;

  class Entity {
    constructor(x, y) {
      this.id = NEXT_ID++;
      this.x = x || 0; this.y = y || 0; this.w = 16; this.h = 16;
      this.vx = 0; this.vy = 0; this.dir = 1;
      this.type = 'enemy';
      this.hp = 1; this.maxHp = 1; this.dead = false; this.t = 0; this.frame = 0;
      this.invuln = 0; this.flash = 0;
      this.grav = KB.GRAV; this.maxFall = KB.MAXFALL; this.solid = true; this.onGround = false;
      this.inhalable = false; this.ability = null; this.hurtsPlayer = false; this.damage = 1;
      this.score = 0; this.z = 0; // z: 繪製順序（大者在上）
      this.persistent = false;   // 房間切換不移除（一般不用）
      this.offscreenKill = false; // 離開畫面很遠時移除（投射物用）
      this.name = '';
    }
    get cx() { return this.x + this.w / 2; }
    get cy() { return this.y + this.h / 2; }
    get top() { return this.y; }
    get bottom() { return this.y + this.h; }
    set cx(v) { this.x = v - this.w / 2; }
    set bottom(v) { this.y = v - this.h; }
    overlaps(o) { return this.x < o.x + o.w && this.x + this.w > o.x && this.y < o.y + o.h && this.y + this.h > o.y; }
    overlapsRect(x, y, w, h) { return this.x < x + w && this.x + this.w > x && this.y < y + h && this.y + this.h > y; }
    distTo(o) { const dx = o.cx - this.cx, dy = o.cy - this.cy; return Math.sqrt(dx * dx + dy * dy); }
    physics() { if (this.solid && KB.game) KB.physics.step(this, KB.game.map); else { this.x += this.vx; this.y += this.vy; } }
    baseUpdate(dt) { this.t += dt; if (this.invuln > 0) this.invuln--; if (this.flash > 0) this.flash--; if (this.invincibleHitT > 0) this.invincibleHitT--; }
    update(dt) { this.baseUpdate(dt); }
    draw(g) { g.rect(this.x, this.y, this.w, this.h, '#f0f'); }
    hurt(amount, src) {
      if (this.dead || this.invuln > 0) return false;
      this.hp -= amount; this.flash = 6; this.invuln = 4;
      if (this.hp <= 0) { this.die(src); return true; }
      if (KB.audio) KB.audio.sfx('enemyhit');
      return true;
    }
    die(reason) {
      if (this.dead) return; this.dead = true;
    }
    onInhaled(player) { this.dead = true; }
    onScreen(margin) {
      margin = margin || 0; const c = KB.game ? KB.game.cam : { x: 0, y: 0 };
      return this.x + this.w > c.x - margin && this.x < c.x + KB.W + margin && this.y + this.h > c.y - margin && this.y < c.y + KB.VIEW_H + margin;
    }
    // 繪製輔助：受傷閃白
    sprOpts(extra) {
      const o = extra || {};
      if (this.flash > 0 && (this.flash & 2)) o.tint = '#ffffff';
      if (o.t === undefined) o.t = this.t;
      if (o.flip === undefined) o.flip = this.dir < 0;
      return o;
    }
  }
  KB.Entity = Entity;

  // ---------- 敵人基底 ----------
  class Enemy extends Entity {
    constructor(x, y) {
      super(x, y);
      this.type = 'enemy'; this.hp = 2; this.maxHp = 2;
      this.inhalable = true; this.hurtsPlayer = true; this.damage = 1; this.score = 200;
      this.spr = 'waddledee_walk'; this.speed = 0.5;
      this.turnAtEdge = true; this.turnAtWall = true;
      this.beingInhaled = false; this.inhaleSrc = null;
      this.freezeT = 0;  // 被冰凍幀數
      this.z = 1; this.walkAnim = true;
      this.dropItem = null; // 死亡掉落道具 key
      this.startX = x; this.startY = y; this.stepH = 8;
      this.active = false;   // 進入畫面後才啟動
    }
    get player() { return KB.player; }
    facePlayer() { if (KB.player) this.dir = KB.player.cx < this.cx ? -1 : 1; }
    playerDist() { return KB.player ? Math.abs(KB.player.cx - this.cx) : 9999; }
    playerDx() { return KB.player ? KB.player.cx - this.cx : 0; }
    playerDy() { return KB.player ? KB.player.cy - this.cy : 0; }
    // 走路 AI：遇牆 / 懸崖轉向
    walk(speed) {
      speed = speed !== undefined ? speed : this.speed;
      if (this.onGround) {
        if (this.turnAtWall && KB.physics.wallAhead(KB.game.map, this)) this.dir *= -1;
        else if (this.turnAtEdge && KB.physics.edgeAhead(KB.game.map, this)) this.dir *= -1;
      }
      this.vx = speed * this.dir;
    }
    // 被吸入中（player 呼叫）：往嘴巴移動
    pullTo(px, py, strength) {
      const dx = px - this.cx, dy = py - this.cy, d = Math.max(1, Math.sqrt(dx * dx + dy * dy));
      this.x += dx / d * strength; this.y += dy / d * strength * 0.6;
    }
    update(dt) {
      this.baseUpdate(dt);
      if (this.freezeT > 0) { this.freezeT--; this.vx = 0; this.physics(); if (this.freezeT === 0) this.vx = 0; return; }
      if (this.beingInhaled) { return; }
      this.ai(dt);
      this.physics();
      if (this.fellOut) this.dead = true;
    }
    ai(dt) { this.walk(); }
    draw(g) {
      if (this.freezeT > 0) { this.drawFrozen(g); return; }
      const wx = KB.inhaleWobble(this);
      g.spr(this.spr, this.cx + wx, this.bottom + (this.wobY || 0), this.sprOpts({ t: this.beingInhaled ? 0 : this.t }));
    }
    drawFrozen(g) {
      g.spr(this.spr, this.cx, this.bottom, { frame: 0, flip: this.dir < 0, tint: '#a0e8ff' });
      g.rect(this.x - 2, this.y - 2, this.w + 4, this.h + 2, 'rgba(160,230,255,0.45)');
    }
    hurt(amount, src) {
      if (this.dead) return false;
      if (this.invuln > 0) return false;
      this.hp -= amount; this.flash = 8; this.invuln = 6;
      if (src && src.freeze) { this.freezeT = 120; }
      if (this.hp <= 0) { this.die(src); return true; }
      if (KB.audio) KB.audio.sfx('enemyhit');
      return true;
    }
    die(src) {
      if (this.dead) return; this.dead = true;
      if (this.freezeT > 0) {
        // 冰塊滑出
        if (KB.IceBlock) KB.spawn(new KB.IceBlock(this.x, this.y, src && src.cx !== undefined ? (this.cx < src.cx ? -1 : 1) : this.dir));
      } else {
        KB.fx('fx_poof', this.cx, this.cy + 8);
        KB.particles(this.cx, this.cy, '#ffe040', 6, { spread: 2 });
      }
      if (KB.audio) KB.audio.sfx('enemydie');
      if (KB.game) KB.game.addScore(this.score, this.cx, this.y);
      if (this.dropItem && KB.ITEMS && KB.ITEMS[this.dropItem]) KB.spawn(new KB.ITEMS[this.dropItem](this.x, this.y));
    }
    onInhaled(player) {
      this.dead = true;
      player.mouth = { ability: this.ability, name: this.name || this.constructor.name, score: this.score };
      if (KB.game) KB.game.addScore(this.score, this.cx, this.y);
    }
  }
  KB.Enemy = Enemy;
  // 被吸入中的掙扎：每 4 幀左右擺動 ±2px（回傳值），並以 e.wobY 做垂直 ±1 隨機抖動。
  // 這是「只影響繪製」的偏移，不會動到 x / y / 碰撞框 —— player.js 不需要再自行位移敵人；
  // 其他 agent 若要加吸力表現，請共用這個函式，不要各自再加一份位移。
  KB.inhaleWobble = function (e) {
    if (!e || !e.beingInhaled) { if (e) e.wobY = 0; return 0; }
    e.wobT = (e.wobT || 0) + 1;
    e.wobY = (e.wobT % 3 === 0) ? (Math.random() < 0.5 ? -1 : 1) : (e.wobY || 0);
    return (Math.floor(e.wobT / 4) % 2 ? 2 : -2);
  };
  KB.ENEMIES = KB.ENEMIES || {};
  KB.BOSSES = KB.BOSSES || {};
  KB.ITEMS = KB.ITEMS || {};

  // ---------- 攻擊判定框 ----------
  // opts: {x,y,w,h,dmg,owner:'player'|'enemy',type,life(幀),pierce,follow:entity,ox,oy,rehit(幀，0=只打一次),freeze,knock,breakBlocks,inhaleStop}
  class Hitbox extends Entity {
    constructor(o) {
      super(o.x, o.y);
      this.type = 'hitbox'; this.solid = false; this.grav = 0;
      this.w = o.w; this.h = o.h; this.dmg = o.dmg !== undefined ? o.dmg : 1;
      this.owner = o.owner || 'player'; this.ownerEnt = o.ownerEnt || null; this.kind = o.type || 'melee';
      this.life = o.life || 1; this.pierce = o.pierce !== false; this.follow = o.follow || null;
      this.ox = o.ox || 0; this.oy = o.oy || 0; this.flipWithOwner = o.flipWithOwner !== false;
      this.rehit = o.rehit || 0; this.hitSet = new Map(); this.freeze = !!o.freeze; this.knock = o.knock || 0;
      this.breakBlocks = o.breakBlocks !== false; this.z = 5;
      this.onHit = o.onHit || null; this.dir = o.dir || 1;
      this.onUpdate = o.onUpdate || null;   // 每幀回呼（判定框在擁有者之後更新，可安全改寫擁有者速度）
      this.stone = !!o.stone;
      // 石頭變身掛勾：player.js 的 startStone 會產生 {stone:true, owner:'player'} 判定框，
      // 以此通知 abilities.js（隨機外觀 / 斜坡滾動），避免動到 player.js
      if (this.stone && this.owner === 'player' && KB.ABILITIES && KB.ABILITIES.stone && KB.ABILITIES.stone.onStoneStart) {
        try { KB.ABILITIES.stone.onStoneStart(this.follow || KB.player, this); } catch (e) { }
      }
    }
    update(dt) {
      this.baseUpdate(dt);
      if (this.follow) {
        const f = this.follow; const d = this.flipWithOwner ? f.dir : 1;
        this.x = f.cx + (d > 0 ? this.ox : -this.ox - this.w); this.y = f.y + this.oy;
        this.dir = d;
        if (f.dead || (f.type === 'enemy' && f.active === false)) this.dead = true;
      }
      if (this.onUpdate) this.onUpdate(this);
      this.life--; if (this.life <= 0) this.dead = true;
    }
    canHit(e) {
      const last = this.hitSet.get(e.id);
      if (last === undefined) return true;
      return this.rehit > 0 && (this.t * 60 - last) >= this.rehit;
    }
    markHit(e) { this.hitSet.set(e.id, this.t * 60); if (!this.pierce) this.dead = true; }
    draw(g) { if (KB.DEBUG && KB.showHitbox) g.rect(this.x, this.y, this.w, this.h, 'rgba(255,0,0,0.3)'); }
  }
  KB.Hitbox = Hitbox;
  KB.hitbox = o => { const h = new Hitbox(o); KB.spawn(h); return h; };

  // ---------- 特效 ----------
  class Fx extends Entity {
    constructor(name, x, y, o) {
      super(x, y); o = o || {};
      this.type = 'fx'; this.solid = false; this.grav = 0; this.spr = name; this.z = o.z !== undefined ? o.z : 6;
      const s = KB.SPR[name]; const n = s ? s.n : 1, fps = o.fps || (s ? s.fps : 8);
      this.fps = fps; this.life = o.life || Math.ceil(n * 60 / fps); this.flip = !!o.flip;
      this.vx = o.vx || 0; this.vy = o.vy || 0; this.w = 1; this.h = 1; this.loop = !!o.loop; this.alpha = o.alpha;
      this.anchorCenter = o.center !== false; this.tint = o.tint;
    }
    update(dt) { this.baseUpdate(dt); this.x += this.vx; this.y += this.vy; this.life--; if (this.life <= 0) this.dead = true; }
    draw(g) { g.spr(this.spr, this.x, this.y, { t: this.t, fps: this.fps, flip: this.flip, alpha: this.alpha, tint: this.tint }); }
  }
  KB.Fx = Fx;
  KB.fx = (name, x, y, o) => { if (!KB.game) return null; const f = new Fx(name, x, y, o); KB.spawn(f); return f; };

  // ---------- 粒子（輕量，不走 Entity） ----------
  KB.particles = function (x, y, color, n, o) {
    if (!KB.game) return; o = o || {};
    const sp = o.spread || 1.5, g = o.grav !== undefined ? o.grav : 0.15, life = o.life || 30;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = Math.random() * sp + 0.3;
      KB.game.parts.push({ x, y, vx: Math.cos(a) * s + (o.vx || 0), vy: Math.sin(a) * s - (o.up || 1) + (o.vy || 0), g, life: life + Math.random() * 10, color: Array.isArray(color) ? color[i % color.length] : color, size: o.size || (Math.random() < 0.5 ? 1 : 2) });
    }
  };

  // ---------- 投射物 ----------
  // o: {spr, x,y, vx,vy, dmg, owner, life, grav, bounce, pierce, w,h, onHit(target), onWall(), freeze, hurtsPlayer, destructible, rot, breakBlocks, flip}
  class Projectile extends Entity {
    constructor(o) {
      super(o.x, o.y);
      this.type = 'proj'; this.spr = o.spr || 'proj_star'; this.vx = o.vx || 0; this.vy = o.vy || 0;
      this.w = o.w || 8; this.h = o.h || 8; this.x = o.x - this.w / 2; this.y = o.y - this.h / 2;
      this.dmg = o.dmg !== undefined ? o.dmg : 1; this.owner = o.owner || 'enemy';
      this.life = o.life || 120; this.grav = o.grav || 0; this.bounce = o.bounce || 0; this.pierce = !!o.pierce;
      this.onHitCb = o.onHit || null; this.onWallCb = o.onWall || null; this.freeze = !!o.freeze;
      this.hurtsPlayer = this.owner === 'enemy'; this.damage = this.dmg; this.destructible = o.destructible !== false;
      this.solid = o.solid !== false; this.maxFall = 6; this.z = 4; this.rot = o.rot || 0; this.rotSpeed = o.rotSpeed || 0;
      this.dir = o.dir || (this.vx < 0 ? -1 : 1); this.flip = o.flip !== undefined ? o.flip : this.dir < 0;
      this.breakBlocks = o.breakBlocks !== false; this.hitSet = new Set(); this.kind = o.type || 'proj'; this.offscreenKill = true;
      this.inhalable = !!o.inhalable; this.ownerEnt = o.ownerEnt || null; this.fxHit = o.fxHit || 'fx_hit'; this.knock = o.knock || 1.5;
      this.trail = o.trail || null; this.fps = o.fps; this.scale = o.scale;
    }
    update(dt) {
      this.baseUpdate(dt);
      if (this.beingInhaled) return;
      this.life--; if (this.life <= 0) { this.dead = true; return; }
      this.rot += this.rotSpeed;
      const pvx = this.vx, pvy = this.vy;
      // 先破壞前方的星星 / 炸彈方塊（否則物理會先把投射物當撞牆殺掉）
      if (this.breakBlocks && this.solid && this.owner === 'player' && KB.game) {
        const map = KB.game.map, T = KB.TILE;
        const leadX = this.vx > 0 ? this.x + this.w + this.vx : (this.vx < 0 ? this.x + this.vx : null);
        const leadY = this.vy > 0 ? this.y + this.h + this.vy : (this.vy < 0 ? this.y + this.vy : null);
        let broke = false;
        if (leadX !== null) for (const py of [this.y + 1, this.cy, this.bottom - 1]) { const tx = Math.floor(leadX / T), ty = Math.floor(py / T), ch = map.get(tx, ty); if (ch === '*' || ch === 'B') { map.breakBlock(tx, ty); broke = true; } }
        if (leadY !== null) for (const px of [this.x + 1, this.cx, this.x + this.w - 1]) { const tx = Math.floor(px / T), ty = Math.floor(leadY / T), ch = map.get(tx, ty); if (ch === '*' || ch === 'B') { map.breakBlock(tx, ty); broke = true; } }
        if (broke && !this.pierce) { this.dead = true; KB.fx(this.fxHit, this.cx, this.cy + 6); return; }
      }
      this.physics();
      if (this.solid) {
        if (this.hitWall || this.hitCeil || (this.onGround && this.bounce === 0)) {
          if (this.bounce > 0 && this.hitWall) { this.vx = -pvx * this.bounce; this.dir *= -1; this.flip = this.dir < 0; }
          else if (this.onWallCb) { this.onWallCb(this); if (!this.dead) this.dead = true; }
          else { this.dead = true; KB.fx(this.fxHit, this.cx, this.cy + 6); }
        } else if (this.onGround && this.bounce > 0) { this.vy = -Math.abs(pvy) * this.bounce; if (Math.abs(this.vy) < 0.8) this.vy = -1.2; }
      }
      if (this.fellOut) this.dead = true;
      if (this.trail && (Math.floor(this.t * 60) % 3 === 0)) KB.particles(this.cx, this.cy, this.trail, 1, { spread: 0.5, grav: 0, life: 12, up: 0 });
    }
    draw(g) { g.spr(this.spr, this.cx, this.bottom, { t: this.t, flip: this.flip, rot: this.rot, fps: this.fps }); }
    hurt(amount, src) { if (this.destructible) { this.dead = true; KB.fx('fx_hit', this.cx, this.cy + 6); return true; } return false; }
    onInhaled(player) { this.dead = true; player.mouth = { ability: null, name: 'proj', score: 10 }; }
  }
  KB.Projectile = Projectile;
  KB.shoot = o => { const p = new Projectile(o); KB.spawn(p); return p; };

  KB.spawn = function (e) { if (KB.game) KB.game.entities.push(e); return e; };
})();

</script>
