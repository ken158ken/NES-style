        case 'tricutter':   // 【二階段新招】劍氣三連（高 / 中 / 低三道）
          this.vx *= 0.7;
          if (this.stateT === 1) this.facePlayer();
          for (let k = 0; k < 3; k++) if (this.stateT === 8 + k * 9) {
            const oy = [-10, 0, 8][k];
            KB.shoot({ spr: 'proj_cutter', x: this.cx + this.dir * 12, y: this.cy + oy, vx: this.dir * 3.4, dmg: 1, owner: 'enemy', life: 100, w: 12, h: 12, solid: false, pierce: false, rotSpeed: 0.4 * this.dir, type: 'cutter', dir: this.dir });
            KB.audio.sfx('cutter');
          }
          if (this.stateT > 44) this.setState('idle');
          break;
        case 'dash':
          if (this.stateT === 1) {
            this.facePlayer();
            this.dashBox = KB.hitbox({ x: 0, y: 0, w: this.w + 8, h: this.h, dmg: 1, owner: 'enemy', type: 'dash', follow: this, ox: -(this.w + 8) / 2, oy: 0, life: 13, pierce: true });
            KB.audio.sfx('slide');
          }
          this.vx = this.dir * 5;
          if (this.stateT % 2 === 0) KB.particles(this.cx - this.dir * 8, this.bottom - 4, '#a0a0ff', 1, { spread: 0.5, grav: 0, life: 10, up: 0 });
          if (this.stateT >= 12 || this.hitWall) { this.vx = 0; if (this.dashBox) this.dashBox.dead = true; this.dashBox = null; this.setState('idle'); }
          break;
        case 'jump':
          if (this.stateT === 1) { this.facePlayer(); this.vy = -4.6; this.vx = this.dir * 1.8; KB.audio.sfx('jump'); }
          if (this.stateT === 14 && this.rng() < 0.5) { KB.shoot({ spr: 'proj_cutter', x: this.cx + this.dir * 12, y: this.cy, vx: this.dir * 3.2, dmg: 1, owner: 'enemy', life: 90, w: 12, h: 12, solid: false, pierce: false, rotSpeed: 0.4 * this.dir, type: 'cutter', dir: this.dir }); KB.audio.sfx('cutter'); }
          if (this.stateT > 6 && this.onGround) { this.vx = 0; this.setState('idle'); }
          break;
        case 'cutter':
          this.vx *= 0.7;
          if (this.stateT === this.iv(8)) {
            this.facePlayer();
            KB.shoot({ spr: 'proj_cutter', x: this.cx + this.dir * 12, y: this.cy - 2, vx: this.dir * 3.2, dmg: 1, owner: 'enemy', life: 90, w: 12, h: 12, solid: false, pierce: false, rotSpeed: 0.4 * this.dir, type: 'cutter', dir: this.dir });
            KB.audio.sfx('cutter');
          }
          if (this.stateT > this.iv(24)) this.setState('idle');
          break;
        case 'vanish': {  // 披風消失 40 幀（無敵）→ 出現在玩家另一側 → 40 幀硬直
          if (this.stateT === 1) {
            this.vanishCD = 180;
            this.hidden = true; this.untouchable = true; this.contactDamage = false; this.invuln = 40; this.vx = 0;
            KB.fx('fx_poof', this.cx, this.cy); KB.particles(this.cx, this.cy, ['#6040c0', '#a080ff'], 10, { spread: 2 });
          }
          if (this.stateT === 40) {
            const map = KB.game.map, side = this.cx > p.cx ? -1 : 1;   // 目前在右側 → 出現在左側
            let nx = clamp(p.cx + side * 52 - this.w / 2, 4, mapW() - this.w - 4);
            if (solidAt(nx + this.w / 2, p.y, p.bottom - 1)) nx = clamp(p.cx - side * 52 - this.w / 2, 4, mapW() - this.w - 4);
            this.x = nx; this.bottom = groundY(nx + this.w / 2, p.bottom - 2); this.vy = 0;
            this.hidden = false; this.untouchable = false; this.contactDamage = true; this.facePlayer();
            KB.fx('fx_poof', this.cx, this.cy); KB.particles(this.cx, this.cy, ['#6040c0', '#a080ff'], 10, { spread: 2 }); KB.audio.sfx('door');
            void map;
          }
          if (this.stateT > 46) this.setState('recover');
          break;
        }
        case 'hurt':
          this.vx *= 0.85;
          if (this.stateT > this.iv(14)) this.setState('idle');
          break;
      }
    }
    onHurt(amount, src) {
      this.evadeLock = 30;   // QA P0-01：剛被打到就不准馬上消失 / 後跳
      if (this.state === 'vanish') return;
      const from = src && src.cx !== undefined ? src.cx : (this.player ? this.player.cx : this.cx);
      this.dir = from < this.cx ? -1 : 1;             // 面向攻擊者
      // 硬直有冷卻、出招中有霸體：被連段時不會一直後仰，會照常出招反擊（否則站著揮劍就能鎖死他）
      if (this.state === 'slash' || this.state === 'dash') return;
      if (this.stunCD > 0) { if (this.state === 'idle' || this.state === 'walk') this.vx = -this.dir * 0.8; return; }
      this.stunCD = 50;
      this.vx = -this.dir * 2.2; this.vy = Math.min(this.vy, -1.2);  // 後退
      if (this.dashBox) { this.dashBox.dead = true; this.dashBox = null; }
      this.setState('hurt');
    }
    draw(g) {
      if (this.hidden) return;
      let spr = 'metaknight_idle', o = {};
      if (this.hurtT > 0 || this.state === 'hurt') spr = 'metaknight_hurt';
      else if (this.state === 'slash' || this.state === 'tricutter') { spr = 'metaknight_attack'; o.frame = this.stateT < 8 ? 0 : this.stateT < 16 ? 1 : 2; }
      else if (this.state === 'dash') spr = 'metaknight_dash';
      else if (this.state === 'tornado') { spr = 'metaknight_attack'; o.frame = (this.stateT >> 2) % 3; }
      this.drawBody(g, spr, o);
    }
  }
  KB.BOSSES.metaknight = MetaKnight;

  // =====================================================================
  // W5 迪迪迪大王：走向玩家、跳躍砸地（震波）、掄鎚（dmg 2）、吸入拉人、超高跳重落。
  // 被打會後退並短暫暈眩（有冷卻）；hp<50% 加速。
  // =====================================================================
  class KingDedede extends Boss {
    constructor(x, y) {
      super(x, y);
      this.displayName = '迪迪迪大王'; this.subtitle = 'KING DEDEDE'; this.name = 'dedede';
      this.hp = this.maxHp = 60; this.score = 10000; this.color = '#d04040';
      this.solid = true; this.grav = KB.GRAV; this.maxFall = 6; this.spr = 'dedede_idle'; this.setSize(40, 52);
      this.actions = 0; this.dizzyCD = 0; this.inhaleFx = null; this.dir = -1; this.jumps = 0;
      this.rageColor = '#ff2020'; this.phase2Msg = '迪迪迪大王怒了！';
      this.setState('idle');
    }
    get enraged() { return this.phase === 2; }
    onPhase2() { this.stopInhaleFx(); this.setState('inhale'); }
    moveSpeed() { return this.enraged ? 1.3 : 0.85; }
    stopInhaleFx() { if (this.inhaleFx) { this.inhaleFx.dead = true; this.inhaleFx = null; } }
    // 衝擊星：落地 / 掄鎚時彈出的可吸入星星（Dream Land 的迪迪迪戰就是靠吸這個吐回去打他）
    impactStar(x, y, vx, vy) {
      KB.spawn(new Ammo({ spr: 'proj_star', x, y, vx, vy, grav: 0.2, maxFall: 3.5, dmg: 0, owner: 'enemy', life: 480, w: 10, h: 10, solid: true, breakOnWall: false, bounceY: 2.4, restBreak: 360, harmless: true, name: 'star', score: 100, fxHit: 'fx_sparkle', type: 'impactstar', color: '#ffe040', rotSpeed: 0.2 * (vx < 0 ? -1 : 1) }));
    }
    land(speed, shake) {
      KB.game.shake = shake; KB.audio.sfx('hammer');
      KB.particles(this.cx, this.bottom, '#c0a060', 10, { spread: 2 });
      KB.spawn(new Shockwave(this.x, this.bottom, -1, { speed })); KB.spawn(new Shockwave(this.x + this.w, this.bottom, 1, { speed }));
      this.impactStar(this.x - 4, this.bottom - 8, -2.4, -4.2); this.impactStar(this.x + this.w + 4, this.bottom - 8, 2.4, -4.2);
    }
    decide(dist) {
      this.actions++; const r = this.rng();
      // 【二階段新招】吸入 → 跳躍震波三連
      if (this.phase === 2 && this.actions % 4 === 0) return this.setState('rampage');
      if (this.actions % 5 === 0) return this.setState('superjump');
      if (dist < 52) return this.setState(r < 0.65 ? 'hammer' : 'inhale');
      if (dist < 130) { if (r < 0.4) return this.setState('walk'); if (r < 0.7) return this.setState('jump'); return this.setState('inhale'); }
      if (r < 0.55) return this.setState('walk'); if (r < 0.8) return this.setState('jump'); return this.setState('superjump');
    }
    ai(dt) {
      const p = this.player; if (!p) return;
      const dist = this.playerDist(), map = KB.game.map;
      if (this.dizzyCD > 0) this.dizzyCD--;
      // 不可以站在玩家身上壓著打（角落會變成每 90 幀一次的碰觸傷害死亡迴圈）：玩家在身體範圍內就往後跳開
      if (this.onGround && (this.state === 'idle' || this.state === 'walk' || this.state === 'inhale') && dist < this.w / 2 + 4 && this.stateT > 4) { this.stopInhaleFx(); this.setState('hop'); }
      // 身體只在「撞過來」的招式（跳躍砸地 / 吸入拉人）有碰觸傷害；站著、走路、掄鎚（有自己的判定框）、暈眩時貼身不會受傷，
      // 否則貼身互砍時光是被他走到就掉劍，簡單玩家打不贏最終魔王。
      // rampage（二階段的吸入起手）只負責把玩家拉過來，本體不帶碰觸傷害：
      // 拳擊台那種兩側有牆的窄場地，若「吸過來 + 碰到就受傷 + 接著三連跳」全開，普通玩家會被鎖死。
      this.contactDamage = this.state === 'jump' || this.state === 'superjump' || this.state === 'triplejump' || (this.state === 'inhale' && this.stateT >= 16);
      switch (this.state) {
        case 'idle':
          this.vx *= 0.7; this.facePlayer();
          if (this.stateT > this.iv(this.enraged ? 20 : 26)) this.decide(dist);
          break;
        case 'hop':   // 往後小跳離開玩家；若背後是牆就跳過玩家頭頂到另一側
          if (this.stateT === 1) {
            this.facePlayer();
            const back = -this.dir, wallBehind = solidAt(back > 0 ? this.x + this.w + 24 : this.x - 24, this.y + 4, this.bottom - 4);
            this.vx = (wallBehind ? this.dir : back) * (wallBehind ? 2.4 : 2.0); this.vy = wallBehind ? -5.6 : -4.2; KB.audio.sfx('jump');
          }
          if (this.stateT > 4 && this.onGround) { this.vx = 0; this.setState('idle'); }
          break;
        case 'walk':
          this.facePlayer(); this.vx = this.dir * this.moveSpeed();
          if (this.stateT % 18 === 9) { KB.audio.sfx('land'); KB.particles(this.cx - this.dir * 10, this.bottom, '#c0a060', 2, { spread: 0.8, life: 12 }); }
          if (dist < 40 || this.hitWall || this.stateT > 90) this.setState('idle');
          break;
        case 'rampage': {  // 【二階段新招】先吸一口氣把玩家拉近（40 幀），接著跳躍震波三連
          this.vx = 0;
          if (this.stateT === 1) { this.facePlayer(); KB.audio.sfx('inhale'); }
          if (!this.inhaleFx || this.inhaleFx.dead) this.inhaleFx = KB.fx('fx_inhale_wind', 0, 0, { loop: true, life: 44, fps: 10 });
          this.inhaleFx.x = this.cx + this.dir * 44; this.inhaleFx.y = this.cy + 14; this.inhaleFx.flip = this.dir < 0;
          if (this.stateT >= 16 && p.overlapsRect(this.dir > 0 ? this.x + this.w : this.x - 88, this.y - 8, 88, this.h + 16) && !NO_PULL[p.state] && p.invincibleT <= 0) {
            const pull = -this.dir * 1.1, nx = p.x + pull, edge = pull > 0 ? nx + p.w - 1 : nx;
            if (!KB.physics.columnSolid(map, edge, p.y + 1, p.bottom - 1)) p.x = nx;
          }
          if (this.stateT >= 40) { this.stopInhaleFx(); this.setState('triplejump'); }
          break;
        }
        case 'triplejump':   // 連跳三次，每次落地都放雙向震波 + 衝擊星（可吸入吐回）
          // 每跳之間留 24 幀的落地硬直：拳擊台那種 14 格寬的窄場地若連續起跳，普通玩家沒有反應空間（會被震波夾死）
          if (this.stateT === 1) { this.facePlayer(); this.jumps = 0; this.hangT = 0; this.vy = -5.2; this.vx = this.dir * 1.3; KB.audio.sfx('jump'); }
          if (this.hangT > 0) {
            this.vx *= 0.8;
            if (--this.hangT === 0) { this.facePlayer(); this.vy = -5.2; this.vx = this.dir * clamp(Math.abs(this.playerDx()) / 60, 0.4, 1.4); KB.audio.sfx('jump'); this.stateT = 1; }
            break;
          }
          if (this.stateT > 4 && this.onGround) {
            this.land(2.6, 6);
            if (++this.jumps >= 3) { this.vx = 0; this.setState('idle'); }
            else this.hangT = 24;
          }
          if (this.stateT > 260) { this.vx = 0; this.setState('idle'); }
          break;
        case 'hammer':
          this.vx *= 0.8;
          if (this.stateT === 1) this.facePlayer();
          if (this.stateT === 16) {   // 掄鎚的預備動作不縮短（16 幀是玩家的反應時間）
            KB.hitbox({ x: 0, y: 0, w: 40, h: 48, dmg: 2, owner: 'enemy', type: 'hammer', follow: this, ox: 6, oy: 4, life: 12, pierce: true });
            KB.audio.sfx('hammer'); KB.game.shake = 4; KB.particles(this.cx + this.dir * 30, this.bottom, '#c0a060', 6, { spread: 1.5 });
            this.impactStar(this.cx + this.dir * 34, this.bottom - 8, this.dir * 2.0, -3.2);
          }
          if (this.stateT > this.iv(44)) this.setState('idle');
          break;
        case 'jump':   // 跳向玩家前方約 36px 落地（威脅是震波與衝擊星，不是直接壓人；站在原地會被震波掃到）
          if (this.stateT === 1) { this.facePlayer(); this.vy = -5.4; this.vx = this.dir * clamp((Math.abs(this.playerDx()) - 36) / 45, 0.3, 2.0); KB.audio.sfx('jump'); }
          if (this.stateT > 4 && this.onGround) { this.vx = 0; this.land(2.5, 6); this.setState('idle'); }
          break;
        case 'superjump':   // 像卡比一樣跳很高再重落：下落的前 24 幀追蹤玩家位置，之後鎖定落點（走開就躲得掉）
          if (this.stateT === 1) { this.facePlayer(); this.vy = -8; this.vx = this.dir * 1.0; this.trackT = 0; KB.audio.sfx('jump'); }
          if (this.stateT > 4 && this.vy > 0) { this.grav = 0.55; this.maxFall = 8; if (this.trackT++ < 24) this.vx = clamp(this.playerDx(), -1.2, 1.2); }
          if (this.stateT > 4 && this.onGround) { this.grav = KB.GRAV; this.maxFall = 6; this.vx = 0; this.land(3.2, 10); this.setState('idle'); }
          break;
        case 'inhale': {  // 張嘴 16 幀預警後，前方吸力把玩家拉過來到 64 幀；碰到本體就受傷彈開（由 game 的碰觸傷害處理）
          this.vx = 0;
          if (this.stateT === 1) { this.facePlayer(); KB.audio.sfx('inhale'); }
          if (!this.inhaleFx || this.inhaleFx.dead) this.inhaleFx = KB.fx('fx_inhale_wind', 0, 0, { loop: true, life: 64, fps: 10 });
          this.inhaleFx.x = this.cx + this.dir * 44; this.inhaleFx.y = this.cy + 14; this.inhaleFx.flip = this.dir < 0;
          // 吸力 1.1 px/f < 走路 1.3：往反方向走就能掙脫；站著不動才會被拉到身上（碰觸傷害）
          const rx = this.dir > 0 ? this.x + this.w : this.x - 88, ry = this.y - 8, rw = 88, rh = this.h + 16;
          if (this.stateT >= 16 && p.overlapsRect(rx, ry, rw, rh) && !NO_PULL[p.state] && p.invincibleT <= 0) {
            const pull = -this.dir * 1.1, nx = p.x + pull, edge = pull > 0 ? nx + p.w - 1 : nx;
            if (!KB.physics.columnSolid(map, edge, p.y + 1, p.bottom - 1)) p.x = nx;
            if (this.stateT % 5 === 0) KB.particles(p.cx - pull * 6, p.cy, '#e0f0ff', 1, { spread: 0.4, vx: pull, grav: 0, life: 10, up: 0 });
          }
          if (this.stateT >= 64) { this.stopInhaleFx(); this.setState('idle'); }
          break;
        }
        case 'dizzy':
          // 暈眩是玩家的攻擊窗，二階段不縮短（縮短等於把最終魔王的唯一空檔拿掉）
          this.vx *= 0.88;
          if (this.stateT % 6 === 0) KB.particles(this.cx + (this.rng() - 0.5) * 24, this.y - 4, '#ffe040', 1, { spread: 0.3, grav: 0, life: 12, up: 0.3 });
          if (this.stateT > 24) this.setState('idle');
          break;
      }
    }
    onHurt(amount, src) {
      const from = src && src.cx !== undefined ? src.cx : (this.player ? this.player.cx : this.cx);
      const away = from < this.cx ? 1 : -1;
      const airborne = this.state === 'jump' || this.state === 'superjump';
      if (airborne) { this.vx += away * 0.6; return; }
      this.stopInhaleFx();
      if (this.dizzyCD === 0) { this.vx = away * 1.6; this.dizzyCD = 90; this.setState('dizzy'); }
      else { this.vx = away * 1.2; this.setState('idle'); }
    }
    onDeath() { this.stopInhaleFx(); for (const e of KB.game.entities) if (e.kind === 'impactstar') e.dead = true; }
    onHurtPhaseGuard() { }
    draw(g) {
      let spr = 'dedede_idle', o = {};
      switch (this.state) {
        case 'walk': spr = 'dedede_walk'; o.fps = this.enraged ? 10 : 7; break;
        case 'jump': case 'superjump': case 'hop': case 'triplejump': spr = 'dedede_jump'; break;
        case 'hammer': spr = 'dedede_hammer'; o.frame = this.stateT < 16 ? 0 : this.stateT < 30 ? 1 : 2; break;
        case 'inhale': case 'rampage': spr = 'dedede_inhale'; break;
        case 'dizzy': spr = 'dedede_hurt'; break;
      }
      if (this.hurtT > 0 && this.state !== 'hammer') spr = 'dedede_hurt';
      this.drawBody(g, spr, o);
    }
  }
  KB.BOSSES.dedede = KingDedede;
})();

</script>
<script>/* src/levels.js */
// 關卡資料 —— 5 個世界（翠綠草原 / 幽靜古堡 / 漂浮群島 / 泡泡雲海 / 迪迪迪城）
// 磁磚字元：# 實心、= 單向平台、* 星星方塊、B 炸彈方塊、^ 尖刺、~ 水、H 梯子、/ \ 45° 斜坡、. 空
// 座標皆為磁磚座標；spawn / door / entity 的 y 為腳所站的那一列（其下 y+1 為地面）。
// deco 層以 D(w, h, [[x, y, ch], ...]) 產生（稀疏表示；字元表見 src/art/world.js 檔頭）。
(function () {
  KB.LEVELS = KB.LEVELS || [];

  // 稀疏裝飾 → 與地圖同尺寸的字串陣列
  function D(w, h, list) {
    const g = []; for (let y = 0; y < h; y++) g.push(new Array(w).fill('.'));
    for (const [x, y, ch] of list) if (x >= 0 && x < w && y >= 0 && y < h) g[y][x] = ch;
    return g.map(r => r.join(''));
  }
  // 點數星連線：由 (x0,y0) 每格放一顆，共 n 顆，方向 (dx,dy)
  function stars(x0, y0, n, dx, dy) {
    const a = []; for (let i = 0; i < n; i++) a.push({ t: 'pointstar', x: x0 + i * (dx || 1), y: y0 + i * (dy || 0) });
    return a;
  }

  // =====================================================================
  // W1 翠綠草原（green）— 教學式、開闊、少量敵人、斜坡與星星方塊、一小段水
  // =====================================================================
  KB.LEVELS.push({
    id: 'w1', name: '翠綠草原', theme: 'green', music: 'green', boss: 'whispywoods', bossName: '大樹威斯比',
    rooms: [
      // ---- 1-1 起點草原（96×12）----
      {
        name: '起點草原',
        map: [
          '................................................................................................',
          '................................................................................................',
          '................................................................................................',
          '.....................................................===........................................',
          '................................................................................................',
          '................................................................................................',
          '...........................................====.................................................',
          '..................................................................**..**........................',
          '.............................../#####\\............................**..**........................',
          '............/####\\............/#######\\...........~~~~~~~~........**..**....../######\\..........',
          '##################################################~~~~~~~~######################################',
          '################################################################################################',
        ],
        deco: D(96, 12, [
          [5, 9, 's'], [7, 9, 't'], [10, 9, 'b'], [20, 9, 'f'], [28, 9, 't'], [40, 9, 'b'], [45, 9, 'f'], [47, 9, 't'],
          [59, 9, 'b'], [61, 9, 't'], [74, 9, 'b'], [76, 9, 'f'], [87, 9, 'f'], [88, 9, 't'], [94, 9, 'b'],
        ]),
        spawn: [3, 9],
        entities: [
          { t: 'waddledee', x: 15, y: 8 },
          { t: 'waddledee', x: 25, y: 9 },
          { t: 'waddledee', x: 34, y: 7 },
          { t: 'brontoburt', x: 41, y: 4 },

<script>/* src/game.js */
// GameScene：關卡 / 房間 / 鏡頭 / 碰撞 / 門 / 魔王 / HUD
(function () {
  const T = KB.TILE;

  class Door extends KB.Entity {
    constructor(d) {
      super(d.x * T, d.y * T); this.type = 'door'; this.w = 16; this.h = 16; this.solid = false; this.grav = 0; this.z = 0;
      this.tx = d.x; this.ty = d.y; this.to = d.to; this.boss = !!d.boss; this.exit = !!d.exit; this.locked = !!d.locked; this.secret = !!d.secret; this.back = !!d.back;
    }
    update(dt) { this.baseUpdate(dt); }
    draw(g) { g.spr(this.boss ? 'tile_door_boss' : 'tile_door', this.cx, this.bottom, { t: this.t }); }
  }
  KB.Door = Door;

  class GameScene {
    constructor(levelId, opts) {
      opts = opts || {};
      this.levelId = levelId; this.opts = opts;
      this.level = KB.LEVELS.find(l => l.id === levelId) || KB.LEVELS[0];
      this.lives = opts.lives !== undefined ? opts.lives : (KB.session ? KB.session.lives : KB.START_LIVES);
      this.score = opts.score !== undefined ? opts.score : (KB.session ? KB.session.score : 0);
      this.entities = []; this.parts = []; this.popups = [];
      this.cam = { x: 0, y: 0 }; this.shake = 0; this.t = 0; this.frame = 0;
      this.fade = 1; this.fadeDir = -1; this.fadeCb = null; this.paused = false; this.pauseSel = 0; this.pauseMenu = null;
      this.boss = null; this.bossIntroT = 0; this.bossName = ''; this.clearT = -1; this.abilityFlash = 0;
      this.toasts = []; this.roomIdx = 0; this.checkpoint = null; this.freezeT = 0;
      this.timeAlive = 0; this.musicKey = null;
    }
    enter() {
      KB.game = this; KB.session = KB.session || {};
      const o = this.opts;
      this.loadRoom(o.room || 0, o.x, o.y, true);
      if (o.ability && KB.ABILITIES[o.ability]) { this.player.ability = o.ability; }
      if (o.hp) this.player.hp = o.hp;
      this.fade = 1; this.fadeDir = -1;
    }
    exit() { KB.audio.music(null); }

    // ---------- 房間 ----------
    loadRoom(idx, sx, sy, first) {
      const room = this.level.rooms[idx]; this.room = room; this.roomIdx = idx;
      this.map = new KB.TileMap(room.map, room.deco);
      this.theme = room.theme || this.level.theme;
      const keep = this.player;
      this.entities = []; this.parts = []; this.popups = []; this.boss = null; this.bossIntroT = 0;
      const spawn = room.spawn || [2, this.map.h - 3];
      const px = (sx !== undefined ? sx : spawn[0]) * T + 1, py = (sy !== undefined ? sy : spawn[1]) * T;
      if (keep && !first) { keep.x = px; keep.bottom = py + T; keep.vx = 0; keep.vy = 0; keep.setState('idle'); keep.solid = true; }
      else { this.player = new KB.Player(px, py); this.player.bottom = py + T; KB.player = this.player; }
      this.player.onGround = true;
      this.checkpoint = { room: idx, x: this.player.x, y: this.player.y };
      this.entities.push(this.player);
      for (const d of (room.doors || [])) this.entities.push(new Door(d));
      this.isBossRoom = !!room.bossRoom || (this.level.boss && idx === this.level.rooms.length - 1 && !room.noBoss);
      const hasBoss = this.isBossRoom && this.level.boss && KB.BOSSES[this.level.boss];
      if (room.exit && !hasBoss) this.entities.push(new Door({ x: room.exit.x, y: room.exit.y, exit: true, boss: true }));
      for (const e of (room.entities || [])) this.spawnDef(e);
      if (hasBoss) {
        const B = KB.BOSSES[this.level.boss];
        const bx = room.bossPos ? room.bossPos[0] * T : (this.map.pw - 64), by = room.bossPos ? room.bossPos[1] * T : (this.map.ph - 32);
        this.boss = new B(bx, by); this.boss.type = 'boss'; this.boss.z = 2;
        this.entities.push(this.boss); this.bossIntroT = 150; this.bossName = this.boss.displayName || this.level.bossName || '';
        this.boss.introducing = true;
      }
      this.updateCamera(true);
      const mk = room.music || (this.isBossRoom && this.boss ? (this.level.id === 'w5' ? 'finalboss' : 'boss') : this.level.music || this.theme);
      this.playMusic(mk);
      if (this.map.w * T < KB.W) { /* 小房間置中 */ }
    }
    spawnDef(e) {
      const C = KB.ENEMIES[e.t] || KB.ITEMS[e.t];
      if (!C) { console.warn('unknown entity', e.t); return null; }
      const ent = new C(e.x * T, e.y * T, e.a, e.b);
      ent.bottom = e.y * T + T; ent.spawnDef = e;
      if (e.dir) ent.dir = e.dir; if (e.drop) ent.dropItem = e.drop;
      this.entities.push(ent); return ent;
    }
    playMusic(k) { this.musicKey = k; KB.audio.music(k); }
    resumeMusic() { KB.audio.music(this.musicKey); }

    doorAt(p) {
      for (const e of this.entities) if (e.type === 'door' && !e.locked && p.overlapsRect(e.x + 2, e.y, e.w - 4, e.h) && Math.abs(p.cx - e.cx) < 8) return e;
      return null;
    }
    useDoor(door) {
      if (door.exit) { this.levelClear(); return; }
      this.fadeTo(() => { const to = door.to; this.loadRoom(to.room, to.x, to.y); });
    }
    fadeTo(cb) { this.fadeDir = 1; this.fadeCb = cb; }

    // ---------- 分數 / 提示 ----------
    addScore(n, x, y) { if (!n) return; this.score += n; if (x !== undefined) this.popups.push({ x, y, n, t: 40 }); }
    toast(msg) { this.toasts.push({ msg, t: 90 }); }

    // ---------- 死亡 / 過關 ----------
    playerDied() {
      this.lives--;
      if (this.lives < 0) { KB.session.score = this.score; KB.setScene(KB.GameOverScene ? new KB.GameOverScene(this) : new GameScene(this.levelId, { lives: KB.START_LIVES })); return; }
      const cp = this.checkpoint;
      this.fade = 1; this.fadeDir = -1;
      this.player = null;
      this.loadRoom(cp.room, undefined, undefined, true);
      this.player.x = cp.x; this.player.y = cp.y;
    }
    levelClear() {
      if (this.clearT >= 0) return;
      this.clearT = 0; KB.audio.music('clear'); KB.audio.sfx('clear');
      this.player.startDance();
      KB.save.cleared[this.levelId] = true; KB.save.score = Math.max(KB.save.score || 0, this.score); KB.saveGame();
    }
    onBossDefeated() {
      // 魔王死亡：星星噴發、跳舞、下一關
      this.shake = 10; this.freezeT = 20;
      for (let i = 0; i < 10; i++) setTimeout(() => { }, 0);
      const bx = this.boss ? this.boss.cx : this.player.cx, by = this.boss ? this.boss.cy : this.player.cy;
      for (let i = 0; i < 12; i++) KB.spawn(new KB.ITEMS.pointstar(bx - 4, by - 4, { pop: true }));
      KB.particles(bx, by, ['#fff', '#ffe040', '#ff8080'], 30, { spread: 4, life: 50 });
      for (const e of this.entities) if (e.type === 'enemy' || (e.type === 'proj' && e.owner === 'enemy')) e.dead = true;
      this.bossDefeatT = 90;
    }
    onBlockBroken(tx, ty, ch) { }

    // ---------- 更新 ----------
    update(dt) {
      this.t += dt; this.frame++;
      if (this.freezeT > 0) { this.freezeT--; return; }
      // 淡入淡出
      if (this.fadeDir !== 0) {
        this.fade += this.fadeDir * 0.08;
        if (this.fade >= 1 && this.fadeDir > 0) { this.fade = 1; this.fadeDir = -1; if (this.fadeCb) { const cb = this.fadeCb; this.fadeCb = null; cb(); } return; }
        if (this.fade <= 0 && this.fadeDir < 0) { this.fade = 0; this.fadeDir = 0; }
        if (this.fadeDir > 0) return;
      }
      // 暫停（選單邏輯在 src/menu.js 的 KB.PauseMenu；此處只負責開啟與轉呼叫）
      if (!this.paused && KB.input.pressed('start') && this.clearT < 0 && this.player.state !== 'dead') {
        this.paused = true; this.pauseSel = 0;
        this.pauseMenu = KB.PauseMenu ? new KB.PauseMenu(this) : null;
        KB.audio.sfx('pause'); if (KB.audio.duck) KB.audio.duck(true); return;
      }
      if (this.paused) {
        if (this.pauseMenu) this.pauseMenu.update(this);
        else if (KB.input.pressed('start')) { this.paused = false; if (KB.audio.duck) KB.audio.duck(false); KB.audio.sfx('unpause'); }
        else this.updatePause();
        return;
      }
      // 魔王登場
      if (this.bossIntroT > 0) {
        this.bossIntroT--;
        if (this.bossIntroT === 0 && this.boss) this.boss.introducing = false;
        this.player.update(dt); this.updateCamera(); this.map.update(); this.updateParts();
        if (this.boss && this.boss.introUpdate) this.boss.introUpdate(dt);
        return;
      }
      if (this.bossDefeatT > 0) {
        this.bossDefeatT--;
        if (this.bossDefeatT === 0) { this.spawnExitDoor(); }
      }
      // 過關演出
      if (this.clearT >= 0) {
        this.clearT++;
        if (this.clearT === 1) this.player.startDance();
        if (this.clearT % 12 === 0 && this.clearT < 120) KB.particles(this.player.cx + (Math.random() - 0.5) * 60, this.player.cy - 20 + (Math.random() - 0.5) * 40, ['#fff', '#ffe040', '#ffb0d0', '#80e0ff'], 4, { spread: 1.5, grav: 0.02, life: 40 });
        if (this.clearT === 220) {
          KB.session.lives = this.lives; KB.session.score = this.score;
          const idx = KB.LEVELS.indexOf(this.level);
          if (idx >= KB.LEVELS.length - 1 && KB.EndingScene) KB.setScene(new KB.EndingScene(this));
          else if (KB.StageSelectScene) KB.setScene(new KB.StageSelectScene(idx + 1));
          else KB.setScene(new GameScene(KB.LEVELS[Math.min(idx + 1, KB.LEVELS.length - 1)].id, { lives: this.lives, score: this.score }));
        }
      }
      // 實體更新
      const p = this.player;
      const camL = this.cam.x - 120, camR = this.cam.x + KB.W + 120, camT = this.cam.y - 120, camB = this.cam.y + KB.VIEW_H + 120;
      for (let i = 0; i < this.entities.length; i++) {
        const e = this.entities[i]; if (e.dead) continue;
        if (e.type === 'enemy' && !e.active) { if (e.x + e.w > camL && e.x < camR && e.y + e.h > camT && e.y < camB) e.active = true; else continue; }
        if (e.type === 'enemy' && (e.x + e.w < camL - 200 || e.x > camR + 200 || e.y > camB + 200)) { if (!e.persistent) { e.active = false; e.x = e.startX; e.y = e.startY; if (e.spawnDef) e.bottom = e.spawnDef.y * T + T; e.vx = 0; e.vy = 0; e.beingInhaled = false; e.freezeT = 0; if (e.onReset) e.onReset(); } continue; }
        e.update(dt);
      }
      this.collisions();
      // 移除死亡實體
      this.entities = this.entities.filter(e => !e.dead || e === p);
      this.map.update();
      this.updateParts();
      for (const pu of this.popups) { pu.t--; pu.y -= 0.5; } this.popups = this.popups.filter(pu => pu.t > 0);
      for (const tt of this.toasts) tt.t--; this.toasts = this.toasts.filter(tt => tt.t > 0);
      if (this.abilityFlash > 0) this.abilityFlash--;
      if (this.shake > 0) this.shake--;
      this.updateCamera();
    }
    spawnExitDoor() {
      // 魔王房出口：以魔王位置或房間 exit 生成過關門
      const r = this.room; const ex = r.exit ? r.exit.x : Math.floor(this.map.w / 2), ey = r.exit ? r.exit.y : this.map.h - 3;
      if (!this.entities.some(e => e.type === 'door' && e.exit)) {
        const d = new Door({ x: ex, y: ey, exit: true, boss: true }); this.entities.push(d);
        KB.fx('fx_sparkle', d.cx, d.cy); KB.audio.sfx('door');
      }
    }
    updateParts() {
      for (const q of this.parts) { q.x += q.vx; q.y += q.vy; q.vy += q.g; q.life--; }
      this.parts = this.parts.filter(q => q.life > 0);
    }
    updatePause() {
      const inp = KB.input;
      if (inp.pressed('up')) { this.pauseSel = (this.pauseSel + 1) % 2; KB.audio.sfx('menu'); }
      if (inp.pressed('down')) { this.pauseSel = (this.pauseSel + 1) % 2; KB.audio.sfx('menu'); }
      if (inp.pressed('jump') || inp.pressed('attack') || inp.pressed('start')) {
        KB.audio.sfx('select');
        if (this.pauseSel === 0) this.paused = false;
        else { KB.session.lives = this.lives; KB.session.score = this.score; KB.setScene(KB.StageSelectScene ? new KB.StageSelectScene(KB.LEVELS.indexOf(this.level)) : new GameScene(this.levelId)); }
      }
    }

    // ---------- 碰撞 ----------
    collisions() {
      const p = this.player, ents = this.entities, map = this.map;
      // 第一階段：玩家攻擊（Hitbox / 投射物）→ 敵人、魔王、敵方投射物、方塊
      for (const a of ents) {
        if (a.dead) continue;
        if ((a.type === 'hitbox' || a.type === 'proj') && a.owner === 'player') {
          if (a.breakBlocks) this.breakBlocksIn(a);
          for (const b of ents) {
            if (b.dead || b === a) continue;
            if (b.type === 'enemy' || b.type === 'boss' || (b.type === 'proj' && b.owner === 'enemy' && b.destructible)) {
              if (!a.overlaps(b)) continue;
              if (a.type === 'hitbox') { if (!a.canHit(b)) continue; }
              else { if (a.hitSet.has(b.id)) continue; }
              if (b.type === 'boss' && b.introducing) continue;
              const ok = b.hurt(a.dmg, a);
              if (ok !== false) {
                if (a.type === 'hitbox') a.markHit(b); else { a.hitSet.add(b.id); if (!a.pierce) { a.dead = true; KB.fx(a.fxHit || 'fx_hit', a.cx, a.cy + 6); } }
                if (b.type !== 'boss' && a.knock && b.solid) { b.vx = (b.cx < a.cx ? -1 : 1) * a.knock; b.vy = Math.min(b.vy, -1); }
                if (a.onHit) a.onHit(b, a); if (a.onHitCb) a.onHitCb(b, a);
                if (b.type === 'boss' && b.dead) this.onBossDefeated();
              }
            }
          }
        }
      }
      // 第二階段：敵方攻擊 / 身體接觸 → 玩家
      for (const a of ents) {
        if (a.dead) continue;
        if ((a.type === 'proj' && a.owner === 'enemy') || (a.type === 'hitbox' && a.owner === 'enemy')) {
          if (p.state !== 'dead' && !a.beingInhaled && a.overlaps(p)) {
            if (p.state === 'stone' || p.invincibleT > 0) { if (a.type === 'proj' && a.destructible) { a.dead = true; KB.fx('fx_hit', a.cx, a.cy + 6); } continue; }
            if (p.hurt(a.dmg, a)) { if (a.type === 'proj' && !a.pierce) a.dead = true; else if (a.type === 'hitbox') a.markHit(p); }
          }
          continue;
        }
        // 敵人身體接觸
        if ((a.type === 'enemy' || a.type === 'boss') && a.hurtsPlayer && !a.beingInhaled && a.freezeT <= 0 && !a.introducing) {
          if (p.state === 'dead') continue;
          if (!a.overlaps(p)) continue;
          if (p.invincibleT > 0 && a.type === 'enemy') { if (a.invincibleHitT > 0) continue; a.invincibleHitT = 20; a.hurt(a.stunned !== undefined ? 4 : 99, { cx: p.cx, cy: p.cy, knock: 2 }); continue; }
          if (p.state === 'stone') { continue; }
          if (a.contactDamage === false) continue;
          p.hurt(a.damage || 1, a);
        }
      }
      // 魔王死亡（非由玩家攻擊直接判定時）
      if (this.boss && this.boss.dead && !this.bossDefeatT && this.bossDefeatT !== 0) { }
      if (this.boss && this.boss.dead && this.bossDefeatT === undefined) this.onBossDefeated();
    }
    breakBlocksIn(a) {
      const x0 = Math.floor(a.x / T), x1 = Math.floor((a.x + a.w - 1) / T), y0 = Math.floor(a.y / T), y1 = Math.floor((a.y + a.h - 1) / T);
      let hit = false;
      for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
        const ch = this.map.get(tx, ty);
        if (ch === '*' || ch === 'B') { this.map.breakBlock(tx, ty); hit = true; }
      }
      if (hit && a.type === 'proj' && !a.pierce) { a.dead = true; KB.fx(a.fxHit || 'fx_hit', a.cx, a.cy + 6); }
    }

    // ---------- 鏡頭 ----------
    updateCamera(snap) {
      const p = this.player, map = this.map, C = KB.CAM;
      const maxX = Math.max(0, map.pw - KB.W), maxY = Math.max(0, map.ph - KB.VIEW_H);
      // ---- 水平前瞻：依速度平滑（靜止 12px、全速跑 40px）----
      const spd = Math.min(1, Math.abs(p.vx) / KB.PHYS.run);
      const wantLook = (C.lookIdle + (C.lookRun - C.lookIdle) * spd) * (p.dir < 0 ? -1 : 1);
      if (snap || this.lookAhead === undefined) this.lookAhead = wantLook;
      else this.lookAhead += (wantLook - this.lookAhead) * C.lookLerp;
      let tx = p.cx - KB.W / 2 + this.lookAhead;
      // ---- 垂直死區：玩家在畫面 40%~70% 高度內時鏡頭不動 ----
      let ty = snap ? p.bottom - KB.VIEW_H * C.restY : this.cam.y;
      if (!snap) {
        const sy = p.bottom - ty, top = KB.VIEW_H * C.deadTop, bot = KB.VIEW_H * C.deadBottom;
        if (sy < top) ty = p.bottom - top;
        else if (sy > bot) ty = p.bottom - bot;
      }
      if (this.boss && !this.boss.dead && this.isBossRoom) {
        const b = this.boss, m = C.bossMargin;
        if (this.bossIntroT > 0 && this.bossIntroT < 140) tx = b.cx - KB.W / 2 + (b.introCamX || 0);   // 登場：鏡頭平移到魔王
        else {
          // 魔王房：以兩者中點取景；若距離超過畫面寬，保證玩家在畫面內並盡量偏向魔王
          const mid = (p.cx + b.cx) / 2 - KB.W / 2;
          const lo = p.cx - (KB.W - m), hi = p.cx - m;   // 玩家距左 / 右邊緣至少 m px
          tx = Math.max(lo, Math.min(hi, mid));
          // 垂直同樣兼顧魔王，但玩家一定看得到
          let bty = (p.bottom + b.bottom) / 2 - KB.VIEW_H * C.restY;
          ty = Math.max(p.bottom - KB.VIEW_H + 32, Math.min(p.bottom - 32, bty));
        }
      }
      tx = Math.max(0, Math.min(maxX, tx)); ty = Math.max(0, Math.min(maxY, ty));
      if (snap) { this.cam.x = tx; this.cam.y = ty; return; }
      this.cam.x += (tx - this.cam.x) * C.follow; this.cam.y += (ty - this.cam.y) * C.follow;
      if (Math.abs(tx - this.cam.x) < 0.3) this.cam.x = tx; if (Math.abs(ty - this.cam.y) < 0.3) this.cam.y = ty;
    }

    // ---------- 繪製 ----------
    draw(ctx) {
      const cam = { x: Math.round(this.cam.x), y: Math.round(this.cam.y) };
      if (this.shake > 0) { cam.x += Math.round((Math.random() - 0.5) * this.shake); cam.y += Math.round((Math.random() - 0.5) * this.shake); }
      ctx.save(); ctx.beginPath(); ctx.rect(0, 0, KB.W, KB.VIEW_H); ctx.clip();
      // 背景
      const bgFn = KB.BG && (KB.BG[this.room.bg || this.theme] || KB.BG[this.theme]);
      if (bgFn) bgFn(ctx, cam.x, cam.y, this.t, this.room); else { ctx.fillStyle = '#78c8f8'; ctx.fillRect(0, 0, KB.W, KB.VIEW_H); }
      const g = new KB.G(ctx, cam);
      this.map.draw(ctx, cam, this.theme, this.t);
      // 實體（依 z 排序）
      const list = this.entities.filter(e => !e.dead || e === this.player).sort((a, b) => a.z - b.z);
      for (const e of list) e.draw(g);
      // 粒子
      for (const q of this.parts) { ctx.fillStyle = q.color; ctx.fillRect(Math.round(q.x - cam.x), Math.round(q.y - cam.y), q.size, q.size); }
      this.map.drawWater(ctx, cam, this.t);
      // 分數彈出
      for (const pu of this.popups) KB.text(ctx, String(pu.n), pu.x - cam.x, pu.y - cam.y - 8, { color: '#fff', align: 'center', outline: '#203040' });
      // 魔王登場字幕
      if (this.bossIntroT > 0 && this.bossName) {
        const a = Math.min(1, this.bossIntroT / 20, (150 - this.bossIntroT) / 20);
        ctx.globalAlpha = Math.max(0, a);
        KB.rect(ctx, 0, 70, KB.W, 34, 'rgba(0,0,0,0.55)');
        (KB.UI && KB.UI.text ? KB.UI.text : KB.text)(ctx, this.bossName, KB.W / 2, 74, { color: '#ffe040', align: 'center', size: 12, outline: '#402000' });
        KB.text(ctx, this.boss && this.boss.subtitle ? this.boss.subtitle : 'BOSS', KB.W / 2, 90, { color: '#fff', align: 'center' });
        ctx.globalAlpha = 1;
      }
      if (this.clearT >= 0 && this.clearT > 20) {
        (KB.UI && KB.UI.text ? KB.UI.text : KB.text)(ctx, '過關！', KB.W / 2, 60, { color: '#ffe040', align: 'center', size: 16, outline: '#603000' });
      }
      ctx.restore();
      // 遊戲內「?」提示（進新關卡 toast / 右上角常駐問號）
      if (KB.UI && KB.UI.drawGameHint) KB.UI.drawGameHint(ctx, this);
      // HUD
      if (KB.drawHUD) KB.drawHUD(ctx, this); else this.drawHUDFallback(ctx);
      // 魔王血條
      if (this.boss && !this.boss.dead && this.bossIntroT === 0 && KB.drawBossBar) KB.drawBossBar(ctx, this.boss);
      else if (this.boss && !this.boss.dead && this.bossIntroT === 0) { KB.rect(ctx, 160, 200, 88, 8, '#000'); KB.rect(ctx, 161, 201, Math.round(86 * this.boss.hp / this.boss.maxHp), 6, '#e83030'); }
      // 提示
      for (const tt of this.toasts) (KB.UI && KB.UI.text ? KB.UI.text : KB.text)(ctx, tt.msg, KB.W / 2, 40, { color: '#fff', align: 'center', outline: '#000' });
      if (this.paused) {
        if (this.pauseMenu) this.pauseMenu.draw(ctx, this);
        else if (KB.drawPause) KB.drawPause(ctx, this);
        else { KB.rect(ctx, 0, 0, KB.W, KB.H, 'rgba(0,0,0,0.5)'); KB.text(ctx, 'PAUSE', KB.W / 2, 90, { color: '#fff', align: 'center', size: 12 }); KB.text(ctx, (this.pauseSel === 0 ? '> ' : '  ') + '繼續', KB.W / 2, 110, { color: '#fff', align: 'center' }); KB.text(ctx, (this.pauseSel === 1 ? '> ' : '  ') + '離開關卡', KB.W / 2, 124, { color: '#fff', align: 'center' }); }
      }
      if (this.fade > 0) { ctx.fillStyle = 'rgba(0,0,0,' + this.fade.toFixed(2) + ')'; ctx.fillRect(0, 0, KB.W, KB.H); }
    }
    drawHUDFallback(ctx) {
      const p = this.player;
      KB.rect(ctx, 0, KB.HUD_Y, KB.W, 32, '#101828');
      KB.text(ctx, p.ability ? (KB.ABILITY_HUD[p.ability] || p.ability.toUpperCase()) : 'NORMAL', 8, 196, { color: '#ffe040' });
      for (let i = 0; i < p.maxHp; i++) KB.rect(ctx, 8 + i * 10, 208, 8, 8, i < p.hp ? '#f8d040' : '#404850');
      KB.text(ctx, 'SCORE ' + String(this.score).padStart(7, '0'), 100, 196, { color: '#fff' });
      KB.text(ctx, 'x' + this.lives, 220, 208, { color: '#fff' });
    }
  }
  KB.GameScene = GameScene;

  // ---------- 存檔 ----------
  KB.save = { cleared: {}, score: 0 };
  try { const s = localStorage.getItem('kirbystar_save'); if (s) KB.save = Object.assign(KB.save, JSON.parse(s)); } catch (e) { }
  KB.saveGame = function () { try { localStorage.setItem('kirbystar_save', JSON.stringify(KB.save)); } catch (e) { } };
})();

</script>
<script>/* src/ui.js */
// UI：標題畫面 / 選關地圖 / HUD / 魔王血條 / 暫停 / Game Over / 結局
// 所有精靈皆先以 KB.has 檢查；缺圖時改用本檔註冊的 uifb_* 備援圖或純繪圖，畫面本身就要完整好看。
// 版面常數集中在 KB.UI.LAYOUT，美術 / game.js 可依此對齊。
// 文字：ASCII 走 8×8 點陣字；中文一律 12px / 16px 黑體（gfx.js 超取樣轉像素；8~10px 中文不可讀）。

  function buildPaths(nodes) {
    const paths = [];
    for (let i = 0; i < nodes.length - 1; i++) {
      const [ax, ay] = nodes[i], [bx, by] = nodes[i + 1];
      const mx = (ax + bx) / 2, my = (ay + by) / 2, dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len, off = (i & 1) ? -18 : 18;
      const cx = mx + nx * off, cy = my + ny * off, pts = [];
      for (let k = 0; k <= 40; k++) { const u = k / 40, v = 1 - u; pts.push([v * v * ax + 2 * v * u * cx + u * u * bx, v * v * ay + 2 * v * u * cy + u * u * by]); }
      paths.push(pts);
    }
    return paths;
  }

    for (const [x, y, r] of land) KB.circle(ctx, x - (r >> 2), y - (r >> 2), r >> 1, '#78d860');
    for (const [x, y] of [[14, 122], [64, 168], [118, 168], [250, 148], [206, 154], [100, 84], [160, 70]]) {
      KB.rect(ctx, x - 1, y - 3, 2, 5, '#805020'); KB.circle(ctx, x, y - 6, 5, '#289028'); KB.circle(ctx, x - 1, y - 7, 3, '#40a840');

  class StageSelectScene {
    constructor(index) {
      this.t = 0; this.frame = 0; this.fade = 1; this.leaving = null;
      this.nodes = UI.LAYOUT.mapNodes; this.paths = buildPaths(this.nodes);
      let i = Math.max(0, Math.min(this.nodes.length - 1, index | 0));
      while (i > 0 && !this.canEnter(i)) i--;
      this.cur = i; this.target = -1; this.moveT = 0; this.bump = 0; this.bumpDir = 0; this.facing = 1;
      this.clouds = mkClouds(4, 7, 6, 44);
    }
    level(i) { return KB.LEVELS[i] || null; }
    exists(i) { return !!KB.LEVELS[i]; }
    unlocked(i) { if (UI.unlockAll || i === 0) return true; const prev = KB.LEVELS[i - 1]; return !!(prev && clearedOf(prev.id)); }
    cleared(i) { const l = KB.LEVELS[i]; return !!(l && clearedOf(l.id)); }
    canEnter(i) { return this.exists(i) && this.unlocked(i); }
    themeOf(i) { const l = this.level(i); return (l && l.theme) || KB.THEMES[i] || 'green'; }
    nameOf(i) { const l = this.level(i); return (l && l.name) || KB.THEME_NAMES[this.themeOf(i)] || ('WORLD ' + (i + 1)); }
    enter() { KB.session = KB.session || { lives: KB.START_LIVES, score: 0 }; music('select'); }
    update(dt) {
      this.t += dt; this.frame++;
      if (stepFade(this)) return;
      if (this.bump > 0) this.bump--;
      const inp = KB.input;
      if (this.target >= 0) {
        this.moveT += 1 / 26;
        if (this.moveT >= 1) { this.cur = this.target; this.target = -1; this.moveT = 0; sfx('menu'); }
        return;
      }
      const dir = inp.pressed('right') ? 1 : inp.pressed('left') ? -1 : 0;
      if (dir) {
        const n = this.cur + dir; this.facing = dir;
        if (n >= 0 && n < this.nodes.length && this.canEnter(n)) { this.target = n; this.moveT = 0; sfx('menu'); }
        else { this.bump = 10; this.bumpDir = dir; }
      }
      if (inp.pressed('jump') || inp.pressed('start')) {
        if (this.canEnter(this.cur)) { sfx('select'); const id = this.level(this.cur).id; leave(this, () => KB.setScene(new KB.GameScene(id))); }
        else { this.bump = 10; this.bumpDir = 0; }

    kirbyPos() {

      const u = (this.cur < this.target ? this.moveT : 1 - this.moveT) * (pts.length - 1);
      const k = Math.min(pts.length - 2, Math.floor(u)), f = u - k;

    drawNode(ctx, i, x, y) {

      const f = this.frame, nodes = this.nodes;
      if (KB.BG && KB.BG.map) KB.BG.map(ctx, 0, 0, this.t); else drawMapBg(ctx, this);
      // 路徑（虛線）
      for (let i = 0; i < this.paths.length; i++) {
        const ok = this.canEnter(i + 1);

      }
      // 節點與標籤（標籤加深色底板，比描邊乾淨，12px 中文才不會糊成一團）
      for (let i = 0; i < nodes.length; i++) {
        const [x, y] = nodes[i], ok = this.canEnter(i);

        const lw = KB.textWidth(label), nw = TW(name, { size: UI.MS }), tw = lw + 4 + nw;
        const sx = Math.max(8, Math.min(W - 8 - tw, Math.round(x - tw / 2)));
        const col = ok ? '#fff' : '#b0b8c8';
        KB.rect(ctx, sx - 2, y - 33, tw + 4, 18, 'rgba(8,14,28,0.7)');
        KB.text(ctx, label, sx, y - 28, { color: ok ? C.yellow : col });
        T(ctx, name, sx + lw + 4, y - 32, { color: col, size: UI.MS });
      }
      // 卡比
      const [kx, ky] = this.kirbyPos();
      let hop = 0, bx = 0;
      if (this.target >= 0) hop = Math.abs(Math.sin(this.moveT * Math.PI * 4)) * 3;
      if (this.bump > 0) { bx = this.bumpDir * (this.bump > 5 ? 2 : 1); hop = this.bump > 5 ? 2 : 0; }
      KB.rect(ctx, kx - 6, ky + 2, 12, 2, 'rgba(0,30,0,0.35)');
      drawKirby(ctx, 'ui_map_kirby', Math.round(kx + bx), Math.round(ky + 3 - hop), { t: this.t, flip: this.facing < 0 });
      // 上方：標題 / 生命 / 分數
      KB.text(ctx, 'STAGE SELECT', 8, 5, { color: '#fff', outline: C.dark, spacing: 1 });
      KB.rect(ctx, 6, 14, TW('選擇關卡', { size: UI.MS }) + 4, 17, 'rgba(8,14,28,0.6)'); T(ctx, '選擇關卡', 8, 15, { color: C.yellow, size: UI.MS });

  KB.drawBossBar = function (ctx, boss) {
    const L = UI.LAYOUT.bossBar, max = Math.max(1, boss.maxHp || 1), hp = Math.max(0, Math.min(max, boss.hp));
    if (boss._barShown === undefined) { boss._barShown = hp; boss._barLastHp = hp; boss._barHold = 0; }
    if (hp < boss._barLastHp) boss._barHold = 20;
    if (hp > boss._barShown) boss._barShown = hp;
    boss._barLastHp = hp;
    if (boss._barShown > hp) { if (boss._barHold > 0) boss._barHold--; else boss._barShown = Math.max(hp, boss._barShown - max / 45); }
    let bw = L.w, bh = L.h, inset = 2;
    const useSpr = has('ui_boss_bar');

      this.game = game || null;
      this.score = game ? game.score : (KB.session ? KB.session.score : 0);
      this.levelIdx = game && game.level ? Math.max(0, KB.LEVELS.indexOf(game.level)) : 0;
      this.t = 0; this.frame = 0; this.fade = 1; this.leaving = null; this.sel = 0;
    }
    enter() { music('gameover'); }
    update(dt) {
      this.t += dt; this.frame++;
      if (stepFade(this)) return;
      if (this.frame < 20) return;
      const inp = KB.input;
      if (inp.pressed('up') || inp.pressed('down')) { this.sel ^= 1; sfx('menu'); }
      if (inp.pressed('jump') || inp.pressed('start')) {
        sfx('select');
        if (this.sel === 0) { const idx = this.levelIdx; leave(this, () => { KB.session = { lives: KB.START_LIVES, score: 0 }; KB.setScene(new StageSelectScene(idx)); }); }
        else leave(this, () => KB.setScene(new TitleScene()));
      }
    }
    draw(ctx) {
      const f = this.frame;
      KB.rect(ctx, 0, 0, W, H, '#000');
      KB.circle(ctx, 128, 110, 40, '#0c0c18'); KB.circle(ctx, 128, 110, 28, '#141424');
      bigText(ctx, 'GAME OVER', 128, 30, 2, { color: '#f04040', outline: '#400000', shadow: '#901818', align: 'center', spacing: 1 });
      // 哭泣的卡比
      const ky = 120 + ((f >> 4) & 1);
      if (has('kirby_hurt')) sprAt(ctx, 'kirby_hurt', 128, ky, 'b', {}); else drawKirby(ctx, null, 128, ky, {});
      for (let k = 0; k < 2; k++) for (let j = 0; j < 3; j++) {
        const y = ky - 12 + ((f * 1.5 + j * 8 + k * 4) % 24), x = 128 + (k ? 4 : -6) + (k ? j : -j);
        KB.rect(ctx, x, y, 2, 3, '#60c0ff');
      }
      KB.text(ctx, 'SCORE ' + pad7(this.score), 128, 134, { color: '#fff', align: 'center' });
      const opts = ['回到地圖', '回到標題'];
      for (let i = 0; i < 2; i++) {
        const y = 154 + i * 18, sel = this.sel === i;
        if (sel) cursor(ctx, 92, y + 2, f);
        T(ctx, opts[i], 106, y, { color: sel ? C.yellow : '#fff', size: UI.MS });
      }
      fit(ctx, '回到地圖：生命與分數重置', 128, 195, 244, { color: '#8890a8', align: 'center', size: UI.MS });
      drawMuteToast(ctx); drawFade(ctx, this);
    }
  }
  KB.GameOverScene = GameOverScene;

  // ---------- 結局 ----------
  class EndingScene {
    constructor(game) {
      this.game = game || null;
      this.score = game ? game.score : (KB.session ? KB.session.score : 0);
      this.t = 0; this.frame = 0; this.fade = 1; this.leaving = null;
      this.lines = [
        { s: '和平回到了普普星！', size: 16, color: C.yellow, y: 12 },
        { s: '感謝遊玩', size: 16, color: '#fff', y: 38 },
        { s: '本作為同人致敬作品', size: 14, color: '#c8d8f0', y: 60 },
        { s: '所有美術與音樂皆為原創', size: 14, color: '#c8d8f0', y: 76 },
        { s: 'FINAL SCORE ' + pad7(this.score), size: 8, color: '#fff', y: 96 },
      ];
      this.gapUnits = 8; this.reveal = 0;
      this.total = this.lines.reduce((a, l) => a + l.s.length + this.gapUnits, 0);
      this.stars = mkStars(48, 21, 0, 0, W, 130); this.sparks = [];
    }
    enter() { music('ending'); try { if (KB.save) { KB.save.ending = true; KB.saveGame && KB.saveGame(); } } catch (e) { } }
    get done() { return this.reveal >= this.total; }
    update(dt) {
      this.t += dt; this.frame++;
      if (stepFade(this)) return;
      if (this.frame > 40 && !this.done) this.reveal += 1 / 3;
      if (this.frame % 6 === 0) this.sparks.push({ x: 128 + (Math.random() - 0.5) * 70, y: 148 - Math.random() * 40, vy: -0.3 - Math.random() * 0.4, life: 40 + Math.random() * 20, c: ['#fff', '#ffe040', '#ffb0d0', '#80e0ff'][Math.floor(Math.random() * 4)] });
      for (const s of this.sparks) { s.y += s.vy; s.life--; }
      this.sparks = this.sparks.filter(s => s.life > 0);
      const inp = KB.input;
      if (inp.pressed('start') || inp.pressed('jump')) {
        if (!this.done) { this.reveal = this.total; sfx('menu'); }
        else if (this.frame > 60) { sfx('select'); leave(this, () => KB.setScene(new TitleScene())); }
      }
    }
    draw(ctx) {
      const t = this.t, f = this.frame;
      bands(ctx, 0, 150, ['#0c1430', '#141c48', '#1c2860', '#243878', '#2c4890']);
      drawStars(ctx, this.stars, t);
      KB.circle(ctx, 214, 30, 11, '#fff8d0'); KB.circle(ctx, 210, 28, 3, '#e8e0b0'); KB.circle(ctx, 218, 34, 2, '#e8e0b0');
      KB.circle(ctx, 30, 160, 44, '#1c4830'); KB.circle(ctx, 120, 166, 56, '#1c4830'); KB.circle(ctx, 220, 162, 46, '#1c4830');
      KB.rect(ctx, 0, 146, W, 4, '#3a8848'); KB.rect(ctx, 0, 150, W, 74, '#2a6838'); KB.rect(ctx, 0, 176, W, 48, '#204c2c');
      for (let x = 4; x < W; x += 17) { const c = (x / 17 | 0) % 3; KB.rect(ctx, x, 142 + (x % 5), 1, 4, '#58a860'); KB.rect(ctx, x - 1, 141 + (x % 5), 3, 2, c === 0 ? '#ffd0e0' : c === 1 ? '#ffe878' : '#a0d8ff'); }
      // 火花
      for (const s of this.sparks) { ctx.globalAlpha = Math.min(1, s.life / 20); KB.rect(ctx, s.x, s.y, 2, 2, s.c); }
      ctx.globalAlpha = 1;
      // 跳舞的卡比
      const gy = 148;
      if (has('kirby_dance')) sprAt(ctx, 'kirby_dance', 128, gy, 'b', { t, fps: 6 });
      else { const hop = Math.abs(Math.sin(f / 10)) * 8; drawKirby(ctx, null, 128, gy - Math.round(hop), { flip: ((f / 20) | 0) & 1, squash: hop < 1 }); }
      // 逐行文字
      let acc = 0;
      for (const l of this.lines) {
        const n = Math.max(0, Math.min(l.s.length, Math.floor(this.reveal - acc)));
        if (n > 0) T(ctx, l.s.slice(0, n), 128, l.y, { color: l.color, align: 'center', size: l.size, outline: '#101830' });
        acc += l.s.length + this.gapUnits;
      }
      if (this.done) {
        bigText(ctx, 'THE END', 128, 108, 2, { color: '#fff', outline: '#101830', align: 'center', spacing: 1 });
        if ((f % 60) < 42) KB.text(ctx, 'PRESS START', 128, 200, { color: '#fff', align: 'center', outline: '#102018', spacing: 1 });
      }
      drawMuteToast(ctx); drawFade(ctx, this);
    }
  }
  KB.EndingScene = EndingScene;
})();

</script>
<script>/* src/menu.js */
// 選單系統（agent: ui-menu）—— 暫停選單 / 標題選單 / 能力圖鑑 / 設定 / 遊戲內「?」提示
// 依賴 ui.js 匯出的繪圖工具（KB.UI.panel / cursor / sprAt / text …），載入順序：ui.js → menu.js。
// 版面依 docs/DESIGN_REFERENCE.md 第 2 章：上半＝能力卡（圖示 + 名稱 + 風味文字 + 招式表），下半＝選單。
// 文字規格：中文一律 ≥ UI.MS（14px），放不下時 UI.fitText 會自動降到 12px 再截斷；所有元素夾在 x = 4~252。
(function () {
  'use strict';
  const W = KB.W, H = KB.H, VH = KB.VIEW_H;
  const UI = KB.UI;
  const T = UI.text, TW = UI.textWidth, fit = UI.fitText, C = UI.C;
  const panel = UI.panel, cursor = UI.cursor, sprAt = UI.sprAt, drawKirby = UI.drawKirby;
  const sfx = UI.sfx, has = UI.has;
  const MS = () => UI.MS;

  // ======================================================================
  // 設定（按鍵提示存 KB.save.settings；音量由 audio.js 自己存 KB.save.settings.audio）
  // ======================================================================
  const DEFAULTS = { hints: true };
  UI.settings = function () {
    if (!KB.save) KB.save = {};
    const cur = KB.save.settings || {};
    for (const k in DEFAULTS) if (typeof cur[k] !== 'boolean') cur[k] = DEFAULTS[k];
    if (!cur.volMemo) cur.volMemo = { music: 0.7, sfx: 1 };
    KB.save.settings = cur;
    return cur;
  };
  UI.saveSettings = function () { try { KB.saveGame && KB.saveGame(); } catch (e) { } };

  // 音量（0~1）：audio.js 提供 setVolume / getVolume，並自動存檔
  const AU = () => KB.audio || null;
  UI.vol = function () { const a = AU(); return (a && a.getVolume) ? a.getVolume() : { music: 1, sfx: 1 }; };
  UI.setVol = function (kind, v) { const a = AU(); if (a && a.setVolume) a.setVolume({ [kind]: Math.max(0, Math.min(1, v)) }); };
  UI.volLevel = function (kind) { return Math.round(UI.vol()[kind] * 10); };          // 0~10 格
  UI.volStep = function (kind, d) {
    const n = Math.max(0, Math.min(10, UI.volLevel(kind) + d));
    UI.setVol(kind, n / 10);
    if (n > 0) { UI.settings().volMemo[kind] = n / 10; UI.saveSettings(); }
    return n;
  };
  // 暫停選單的「開 / 關」：關掉時記住原本音量，打開時還原
  UI.volOn = function (kind) { return UI.volLevel(kind) > 0; };
  UI.toggleVol = function (kind) {
    const st = UI.settings(), cur = UI.vol()[kind];
    if (cur > 0) { st.volMemo[kind] = cur; UI.setVol(kind, 0); }
    else UI.setVol(kind, st.volMemo[kind] || (kind === 'music' ? 0.7 : 1));
    UI.saveSettings();
    return UI.volOn(kind);
  };
  UI.applyAudio = function () { };   // 音量已由 audio.js 自行載入 / 存檔，UI 不需要再套用

  // ======================================================================
  // 能力說明（風味文字為本專案原創，語氣參考 docs/DESIGN_REFERENCE.md 2.2）
  // KB.ABILITIES[key].desc / .flavour / .moves 若存在會優先採用（abilities agent 新增招式即生效）
  // ======================================================================
  UI.ABILITY_HELP = {
    none: {
      name: '普通', en: 'NORMAL', desc: '吸入敵人，按 ↓ 吞下複製能力',
      flavour: ['深呼吸，把敵人吸進嘴裡吧！', '按 ↓ 吞下去就能偷走他的本事。'],
      moves: [['X（按住）', '吸入'], ['X', '吐出星星'], ['↓', '吞下＝獲得能力']],
    },
    fire: {
      desc: '前方噴出火柱，越噴越長', flavour: ['呼——！吐出滾燙的火舌。', '小心別把草原烤焦了。'],
      moves: [['X（按住）', '噴火'], ['跳＋X', '空中噴火'], ['', '噴火時無法移動']],
    },
    sword: {
      desc: '揮劍速度快，可邊走邊揮', flavour: ['握緊了就別鬆手。', '揮下去的瞬間，風都讓路。'],
      moves: [['X', '揮劍'], ['連按 X', '連段'], ['空中 X', '空中斬']],
    },
    beam: {
      desc: '甩出弧形光鞭掃過頭上', flavour: ['甩出一串閃亮的光鞭，', '啪嚓啪嚓地掃過去。'],
      moves: [['X', '光束鞭'], ['連按 X', '連續甩鞭'], ['', '打得到頭上的敵人']],
    },
    cutter: {
      desc: '丟出迴旋刃，會飛回手上', flavour: ['丟出去、繞一圈、再接住。', '丟不準？再練練。'],
      moves: [['X', '丟刀刃'], ['連按 X', '最多 2 片'], ['', '去程回程各命中一次']],
    },
    spark: {
      desc: '全身放電，原地不能動', flavour: ['全身劈哩啪啦。', '靠太近的傢伙自己負責。'],
      moves: [['X（按住）', '放電'], ['', '周圍一圈都有判定'], ['', '放開就停']],
    },
    stone: {
      desc: '變成石頭，無敵可壓敵', flavour: ['碰！變成一塊沉甸甸的石頭。', '這時候誰也推不動。'],
      moves: [['X', '變石頭'], ['再按 X', '解除'], ['空中 X', '重落攻擊']],
    },
    ice: {
      desc: '噴出冰霧，把敵人凍成冰塊', flavour: ['一口冷氣把對手凍成冰塊，', '然後——踢出去！'],
      moves: [['X（按住）', '噴冰'], ['', '冰塊可推可踢'], ['跳＋X', '空中噴冰']],
    },
    hammer: {
      desc: '威力最高，但揮擊較慢', flavour: ['高高舉起、重重落下。', '地板都跟著抖一下。'],
      moves: [['X', '掄鎚'], ['↓＋X', '原地大力敲'], ['空中 X', '空中揮鎚']],
    },
  };

  UI.abilityInfo = function (key) {
    const d = (key && KB.ABILITIES) ? KB.ABILITIES[key] : null;
    const t = UI.ABILITY_HELP[key || 'none'] || {};
    return {
      key: key || null,
      name: t.name || (d && d.name) || (KB.ABILITY_NAMES && KB.ABILITY_NAMES[key]) || '普通',
      en: t.en || (d && d.hudName) || (KB.ABILITY_HUD && KB.ABILITY_HUD[key]) || 'NORMAL',
      desc: (d && d.desc) || t.desc || '',
      flavour: (d && d.flavour) || t.flavour || (t.desc ? [t.desc] : []),
      moves: (d && d.moves) || t.moves || [],
      icon: key ? ((d && d.icon) || ('ui_ability_' + key)) : 'ui_ability_none',
      hat: key ? ((d && d.hat) || ('hat_' + key)) : null,
      color: (d && d.color) || '#f8a0c8',
    };
  };

  // 能力卡片（暫停畫面上半）：需要 w ≥ 200、h ≥ 114（名稱 / 2 行風味文字 / 3 列招式）
  UI.drawAbilityCard = function (ctx, x, y, w, h, key, opts) {
    opts = opts || {};
    const info = UI.abilityInfo(key), ms = MS();
    if (opts.panel !== false) panel(ctx, x, y, w, h);
    if (!sprAt(ctx, info.icon, x + 7, y + 8, 'tl')) {
      KB.rect(ctx, x + 7, y + 8, 24, 16, '#181c28'); KB.rect(ctx, x + 8, y + 9, 22, 14, info.color);
    }
    T(ctx, info.name, x + 38, y + 2, { color: C.yellow, size: 16 });
    KB.text(ctx, info.en, x + w - 8, y + 11, { color: info.key ? info.color : '#98a8c0', align: 'right' });
    // 風味文字（最多 2 行）
    const fl = (info.flavour || []).slice(0, 2);
    for (let i = 0; i < fl.length; i++) fit(ctx, fl[i], x + 8, y + 28 + i * 15, w - 16, { color: '#c8d8f0', size: ms });
    KB.rect(ctx, x + 7, y + 61, w - 14, 1, '#405070');
    // 招式表（最多 3 列）：左欄按鍵、右欄招式名；沒有按鍵的列＝補充說明
    const moves = (info.moves || []).slice(0, 3);
    for (let i = 0; i < moves.length; i++) {
      const my = y + 64 + i * 15, k = moves[i][0], name = moves[i][1];
      if (k) {
        fit(ctx, k, x + 9, my, 76, { color: C.cyan, size: ms, nomix: true });
        fit(ctx, name, x + 92, my, w - 100, { color: '#ffffff', size: ms });
      } else fit(ctx, '・' + name, x + 9, my, w - 18, { color: '#98a8c0', size: ms });
    }
  };

  const onOff = v => (v ? '開' : '關');

  // ======================================================================
  // 暫停選單（KB.PauseMenu）—— game.js 只呼叫 update(game) / draw(ctx, game)
  // ======================================================================
  // 2 列 × 3 欄（row-major）
  const PAUSE_ITEMS = [
    { id: 'resume', label: '繼續' }, { id: 'help', label: '操作說明' }, { id: 'map', label: '回到地圖' },
    { id: 'music', label: '音樂', vol: 'music' }, { id: 'sfx', label: '音效', vol: 'sfx' }, { id: 'title', label: '回到標題' },
  ];
  const COLS = 3, COL_X = [24, 102, 180], ROW_Y = [134, 154];

  function unduck() { const a = AU(); if (a && a.duck) { try { a.duck(false); } catch (e) { } } }

  class PauseMenu {
    constructor(game) { this.sel = 0; this.frame = 0; this.page = 'main'; this.game = game || null; }
    resume(game) { game.paused = false; unduck(); sfx('unpause'); if (game.resumeMusic) game.resumeMusic(); }
    update(game) {
      this.frame++;
      const inp = KB.input;
      if (this.page === 'help') {
        if (inp.pressed('jump') || inp.pressed('attack') || inp.pressed('select') || inp.pressed('start')) { this.page = 'main'; sfx('menu_back'); }
        return;
      }
      if (inp.pressed('start') || inp.pressed('select')) { this.resume(game); return; }
      const n = PAUSE_ITEMS.length;
      if (inp.pressed('down')) { this.sel = (this.sel + COLS) % n; sfx('menu'); }
      if (inp.pressed('up')) { this.sel = (this.sel - COLS + n) % n; sfx('menu'); }
      if (inp.pressed('right')) { const r = (this.sel / COLS) | 0; this.sel = r * COLS + ((this.sel % COLS) + 1) % COLS; sfx('menu'); }
      if (inp.pressed('left')) { const r = (this.sel / COLS) | 0; this.sel = r * COLS + ((this.sel % COLS) + COLS - 1) % COLS; sfx('menu'); }
      if (inp.pressed('jump') || inp.pressed('attack')) this.choose(game);
    }
    choose(game) {
      const it = PAUSE_ITEMS[this.sel];
      if (it.vol) {
        const on = UI.toggleVol(it.vol);
        sfx('menu');   // 先套用再播，音效剛打開時才聽得到回饋
        if (it.vol === 'music' && on && game.resumeMusic) game.resumeMusic();
        return;
      }
      sfx('select');
      if (it.id === 'resume') { this.resume(game); return; }
      if (it.id === 'help') { this.page = 'help'; return; }
      if (it.id === 'map') {
        unduck(); KB.session.lives = game.lives; KB.session.score = game.score;
        KB.setScene(KB.StageSelectScene ? new KB.StageSelectScene(Math.max(0, KB.LEVELS.indexOf(game.level))) : new KB.GameScene(game.levelId));
        return;
      }
      if (it.id === 'title') {
        unduck(); KB.session = { lives: KB.START_LIVES, score: 0 };
        if (KB.TitleScene) KB.setScene(new KB.TitleScene());
        return;
      }
    }
    draw(ctx, game) {
      // 只蓋住遊戲區（y < 192），HUD 仍然看得見
      KB.rect(ctx, 0, 0, W, VH, 'rgba(0,0,0,0.58)');
      if (this.page === 'help') { UI.drawHelp(ctx, { hint: 'Z / SELECT：返回暫停選單' }); return; }
      const f = this.frame, ms = MS();
      UI.drawAbilityCard(ctx, 4, 10, 248, 114, game.player ? game.player.ability : null);
      // PAUSE 標籤（壓在卡片上緣，整塊在畫面內）
      panel(ctx, 100, 2, 56, 14, C.dark, C.border);
      KB.text(ctx, 'PAUSE', 128, 5, { color: C.yellow, align: 'center' });
      // 選單：2 列 × 3 欄
      panel(ctx, 4, 128, 248, 62);
      for (let i = 0; i < PAUSE_ITEMS.length; i++) {
        const it = PAUSE_ITEMS[i], x = COL_X[i % COLS], y = ROW_Y[(i / COLS) | 0], sel = this.sel === i;
        if (sel) cursor(ctx, x - 14, y + 3, f);
        fit(ctx, it.label, x, y, it.vol ? 44 : 72, { color: sel ? C.yellow : '#fff', size: ms });
        if (it.vol) T(ctx, onOff(UI.volOn(it.vol)), x + 70, y, { color: UI.volOn(it.vol) ? '#80e0a0' : C.grey, align: 'right', size: ms });
      }
      fit(ctx, '↑↓←→ 選擇　Z 確認　ENTER 繼續', 128, 173, 240, { color: C.grey, align: 'center', size: ms });
    }
  }
  KB.PauseMenu = PauseMenu;

  // ======================================================================
  // 能力圖鑑（8 能力翻頁）
  // ======================================================================
  class AbilityGallery {
    constructor() { this.i = 0; this.t = 0; this.frame = 0; }
    get keys() { return (KB.ABILITY_KEYS || []).slice(); }
    update() {
      this.frame++; this.t += 1 / 60;
      const inp = KB.input, n = this.keys.length || 1;
      if (inp.pressed('right')) { this.i = (this.i + 1) % n; sfx('menu'); }
      if (inp.pressed('left')) { this.i = (this.i - 1 + n) % n; sfx('menu'); }
      if (inp.pressed('select') || inp.pressed('start') || inp.pressed('jump') || inp.pressed('attack')) { sfx('menu_back'); return 'back'; }
      return null;
    }
    draw(ctx) {
      const ms = MS();
      KB.rect(ctx, 0, 0, W, H, 'rgba(0,0,0,0.72)');
      panel(ctx, 4, 4, 248, 190);
      const keys = this.keys, key = keys[this.i] || null, info = UI.abilityInfo(key);
      T(ctx, '能力圖鑑', 128, 7, { color: C.yellow, align: 'center', size: 16 });
      KB.text(ctx, (this.i + 1) + '/' + Math.max(1, keys.length), 242, 13, { color: C.grey, align: 'right' });
      KB.rect(ctx, 14, 32, 228, 1, '#405070');
      // 左：戴帽子的卡比（kirby_idle + hat_<key>）
      KB.rect(ctx, 14, 38, 68, 70, '#101828'); KB.rect(ctx, 15, 39, 66, 68, '#20304c');
      const gy = 100;
      drawKirby(ctx, 'kirby_idle', 48, gy, { t: this.t, frame: 0 });
      if (info.hat && has(info.hat)) sprAt(ctx, info.hat, 48, gy - 15, 'b', { t: this.t });
      KB.rect(ctx, 34, gy + 1, 28, 2, 'rgba(0,0,0,0.35)');
      // 右：圖示 + 名稱 + 說明（最多 2 行）+ 招式
      if (!sprAt(ctx, info.icon, 90, 40, 'tl')) { KB.rect(ctx, 90, 40, 24, 16, '#181c28'); KB.rect(ctx, 91, 41, 22, 14, info.color); }
      T(ctx, info.name, 120, 36, { color: C.yellow, size: 16 });
      KB.text(ctx, info.en, 242, 42, { color: info.color, align: 'right' });
      const dl = info.desc ? UI.wrapLines(info.desc, 152, { size: ms }, 2) : [];
      for (let i = 0; i < dl.length; i++) T(ctx, dl[i], 90, 58 + i * 15, { color: '#c8d8f0', size: ms });
      KB.rect(ctx, 90, 90, 152, 1, '#405070');
      let y = 94;
      for (const m of (info.moves || []).slice(0, 3)) {
        if (m[0]) {
          fit(ctx, m[0], 90, y, 62, { color: C.cyan, size: ms, nomix: true });
          fit(ctx, m[1], 156, y, 86, { color: '#fff', size: ms });
        } else fit(ctx, '・' + m[1], 90, y, 152, { color: '#98a8c0', size: ms });
        y += 15;
      }
      // 全部能力縮圖列（目前選取者外框）
      KB.rect(ctx, 14, 142, 228, 1, '#405070');
      for (let i = 0; i < keys.length; i++) {
        const x = 16 + i * 29, sel = i === this.i;
        KB.rect(ctx, x, 147, 26, 22, sel ? C.yellow : '#101828');
        KB.rect(ctx, x + 1, 148, 24, 20, '#20304c');
        if (!sprAt(ctx, 'ui_ability_' + keys[i], x + 1, 150, 'tl')) KB.rect(ctx, x + 2, 151, 22, 14, UI.abilityInfo(keys[i]).color);
      }
      fit(ctx, '←→ 換頁　　SELECT / Z：返回', 128, 174, 236, { color: C.grey, align: 'center', size: ms });
    }
  }
  KB.AbilityGallery = AbilityGallery;

  // ======================================================================
  // 設定頁：音樂 / 音效 音量 0~10 格滑桿、按鍵提示開關
  // ======================================================================
  const SET_ITEMS = [
    { id: 'music', label: '音樂音量', vol: 'music' },
    { id: 'sfx', label: '音效音量', vol: 'sfx' },
    { id: 'hints', label: '按鍵提示' },
  ];
  function slider(ctx, x, y, level) {
    for (let i = 0; i < 10; i++) {
      const cx = x + i * 8, on = i < level;
      KB.rect(ctx, cx, y, 7, 10, '#101828');
      KB.rect(ctx, cx + 1, y + 1, 5, 8, on ? (i >= 8 ? '#ffe040' : '#80e0a0') : '#39445c');
    }
  }
  class SettingsMenu {
    constructor() { this.sel = 0; this.frame = 0; }
    update() {
      this.frame++;
      const inp = KB.input, n = SET_ITEMS.length, it = SET_ITEMS[this.sel];
      if (inp.pressed('down')) { this.sel = (this.sel + 1) % n; sfx('menu'); }
      if (inp.pressed('up')) { this.sel = (this.sel - 1 + n) % n; sfx('menu'); }
      const d = inp.pressed('right') ? 1 : inp.pressed('left') ? -1 : 0;
      if (it.vol) {
        if (d) { UI.volStep(it.vol, d); sfx('menu'); }
        if (inp.pressed('jump') || inp.pressed('attack')) { UI.toggleVol(it.vol); sfx('menu'); }
      } else if (d || inp.pressed('jump') || inp.pressed('attack')) {
        const st = UI.settings(); st[it.id] = !st[it.id]; UI.saveSettings(); sfx('menu');
      }
      if (inp.pressed('select') || inp.pressed('start')) { sfx('menu_back'); return 'back'; }
      return null;
    }
    draw(ctx) {
      const ms = MS();
      KB.rect(ctx, 0, 0, W, H, 'rgba(0,0,0,0.7)');
      panel(ctx, 24, 44, 208, 126);
      T(ctx, '設定', 128, 48, { color: C.yellow, align: 'center', size: 16 });
      KB.rect(ctx, 34, 72, 188, 1, '#405070');
      const st = UI.settings();
      for (let i = 0; i < SET_ITEMS.length; i++) {
        const it = SET_ITEMS[i], y = 80 + i * 22, sel = this.sel === i;
        if (sel) cursor(ctx, 34, y + 3, this.frame);
        fit(ctx, it.label, 48, y, 66, { color: sel ? C.yellow : '#fff', size: ms });
        if (it.vol) { slider(ctx, 122, y + 2, UI.volLevel(it.vol)); KB.text(ctx, String(UI.volLevel(it.vol)), 222, y + 3, { color: '#c8d8f0', align: 'right' }); }
        else T(ctx, onOff(st[it.id]), 222, y, { color: st[it.id] ? '#80e0a0' : C.grey, align: 'right', size: ms });
      }
      fit(ctx, '←→ 調整　SELECT 返回', 128, 148, 196, { color: C.grey, align: 'center', size: ms });
    }
  }
  KB.SettingsMenu = SettingsMenu;

  // ======================================================================
  // 標題選單
  // ======================================================================
  const anyCleared = () => !!(KB.save && KB.save.cleared && Object.keys(KB.save.cleared).some(k => KB.save.cleared[k]));

  class TitleMenu {
    constructor() {
      this.items = [];
      if (anyCleared()) this.items.push({ id: 'continue', label: '繼續遊戲' });
      this.items.push({ id: 'new', label: '新遊戲' }, { id: 'help', label: '操作說明' },
        { id: 'gallery', label: '能力圖鑑' }, { id: 'settings', label: '設定' });
      this.sel = 0; this.frame = 0; this.page = 'main'; this.sub = null;
    }
    update(scene) {
      this.frame++;
      const inp = KB.input;
      if (this.page === 'help') {
        if (inp.pressed('jump') || inp.pressed('attack') || inp.pressed('select') || inp.pressed('start')) { this.page = 'main'; sfx('menu_back'); }
        return;
      }
      if (this.sub) { if (this.sub.update() === 'back') { this.sub = null; this.page = 'main'; } return; }
      const n = this.items.length;
      if (inp.pressed('down')) { this.sel = (this.sel + 1) % n; sfx('menu'); }
      if (inp.pressed('up')) { this.sel = (this.sel - 1 + n) % n; sfx('menu'); }
      if (inp.pressed('select')) { scene.menu = null; sfx('menu_back'); return; }
      if (inp.pressed('jump') || inp.pressed('attack') || inp.pressed('start')) {
        const it = this.items[this.sel];
        sfx('select');
        if (it.id === 'continue') scene.startGame(true);
        else if (it.id === 'new') scene.startGame(false);
        else if (it.id === 'help') this.page = 'help';
        else if (it.id === 'gallery') this.sub = new AbilityGallery();
        else if (it.id === 'settings') this.sub = new SettingsMenu();
      }
    }
    draw(ctx, scene) {
      if (this.page === 'help') { UI.drawHelp(ctx, { hint: 'Z / SELECT：返回選單' }); return; }
      if (this.sub) { this.sub.draw(ctx); return; }
      const ms = MS(), n = this.items.length, h = 20 + n * 19, y0 = 180 - h;
      panel(ctx, 112, y0, 136, h);
      for (let i = 0; i < n; i++) {
        const y = y0 + 9 + i * 19, sel = this.sel === i;
        if (sel) cursor(ctx, 124, y + 3, this.frame);
        T(ctx, this.items[i].label, 142, y, { color: sel ? C.yellow : '#fff', size: ms });
      }
      fit(ctx, '↑↓ 選擇　Z 確認　SELECT 返回', 128, 204, 250, { color: '#7c8ca8', align: 'center', size: ms });
    }
  }
  KB.TitleMenu = TitleMenu;

  // ======================================================================
  // 遊戲內「?」提示：進新關卡第一房 toast 3 秒，之後右上角常駐小「?」
  // ======================================================================
  KB.sprite('uifb_qmark', { k: '#101828', y: '#ffe040' }, [[
    'kkkkkkkkk',
    'kkyyyyykk',
    'kkykkkykk',
    'kkkkkkykk',
    'kkkkkykkk',
    'kkkkykkkk',
    'kkkkkkkkk',
    'kkkkykkkk',
    'kkkkkkkkk',
  ]], { anchor: 'topleft' });

  // 計時一律用 game.frame（截圖工具只在最後 render 一次，用畫面次數計時會不準）
  const TOAST = 180, FLASH = 60;
  const hint = { game: null, level: null, at: -1e9, abAt: -1e9, lastAbility: undefined };
  UI.resetGameHint = function () { hint.game = null; hint.level = null; hint.at = -1e9; hint.abAt = -1e9; hint.lastAbility = undefined; };
  UI.drawGameHint = function (ctx, game) {
    if (!UI.settings().hints) return;
    const p = game.player, f = game.frame || 0;
    // 新的 GameScene（＝進入關卡）且在第一房 → 從第 0 幀起算，顯示 3 秒提示
    if (hint.game !== game) {
      hint.game = game; hint.level = game.levelId; hint.lastAbility = p ? p.ability : null;
      hint.at = (game.roomIdx === 0) ? 0 : -1e9; hint.abAt = -1e9;
    }
    // 取得新能力 → 閃 1 秒提醒可以看招式
    const ab = p ? p.ability : null;
    if (ab !== hint.lastAbility) { if (ab) hint.abAt = f; hint.lastAbility = ab; }
    if (game.paused) return;
    const age = f - hint.at, flash = f - hint.abAt;
    if (age >= 0 && age < TOAST) {
      const a = Math.min(1, (TOAST - age) / 20, (age + 1) / 10);
      ctx.globalAlpha = Math.max(0, a);
      const x = 110, y = 5, w = 140, h = 19;    // 右上角，整塊在 4~252 內
      KB.rect(ctx, x, y, w, h, '#101828'); KB.rect(ctx, x + 1, y + 1, w - 2, h - 2, '#182038');
      KB.rect(ctx, x + 1, y, w - 2, 1, '#f0f0f8'); KB.rect(ctx, x + 1, y + h - 1, w - 2, 1, '#f0f0f8');
      KB.rect(ctx, x, y + 1, 1, h - 2, '#f0f0f8'); KB.rect(ctx, x + w - 1, y + 1, 1, h - 2, '#f0f0f8');
      fit(ctx, 'ENTER：暫停／說明', x + w / 2, y + 3, w - 10, { color: '#fff', align: 'center', size: MS() });
      ctx.globalAlpha = 1;
      return;
    }
    // 常駐小「?」（取得新能力後閃爍 1 秒）
    const flashing = flash >= 0 && flash < FLASH;
    if (flashing && ((flash >> 2) & 1)) return;
    ctx.globalAlpha = flashing ? 1 : 0.7;
    sprAt(ctx, 'uifb_qmark', 242, 5, 'tl');
    ctx.globalAlpha = 1;
  };
})();

</script>
<script>/* src/main.js */
// 啟動、主迴圈、縮放、除錯 / 截圖 API
(function () {
  const canvas = document.createElement('canvas');
  canvas.width = KB.W; canvas.height = KB.H; canvas.id = 'game';
  const ctx = canvas.getContext('2d', { alpha: false });
  ctx.imageSmoothingEnabled = false;
  KB.canvas = canvas; KB.ctx = ctx;
  KB.scene = null; KB.frameCount = 0;

  function resize() {
    const ww = window.innerWidth, wh = window.innerHeight;
    let s = Math.max(1, Math.floor(Math.min(ww / KB.W, wh / KB.H)));
    if (KB.DEBUG && window.__forceScale) s = window.__forceScale;
    canvas.style.width = (KB.W * s) + 'px'; canvas.style.height = (KB.H * s) + 'px';
    canvas.style.left = Math.floor((ww - KB.W * s) / 2) + 'px'; canvas.style.top = Math.floor((wh - KB.H * s) / 2) + 'px';
  }
  window.addEventListener('resize', resize);

  KB.setScene = function (s) {
    if (KB.scene && KB.scene.exit) KB.scene.exit();
    KB.scene = s; if (s.enter) s.enter();
  };

  function step() {
    KB.input.update();
    if (KB.scene) KB.scene.update(1 / 60);
    KB.frameCount++;
  }
  function render() {
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, KB.W, KB.H);
    if (KB.scene) KB.scene.draw(ctx);
    if (KB.DEBUG && KB.showFps) KB.text(ctx, KB.fps | 0, 250, 2, { color: '#0f0', align: 'right' });
  }

  let last = 0, acc = 0, running = false, fpsT = 0, fpsN = 0;
  KB.fps = 60;
  function loop(ts) {
    if (!running) return;
    requestAnimationFrame(loop);
    if (!last) last = ts;
    let d = ts - last; last = ts;
    if (d > 100) d = 100;
    acc += d;
    let n = 0;
    while (acc >= 1000 / 60 && n < 4) { step(); acc -= 1000 / 60; n++; }
    if (n === 4) acc = 0;
    render();
    fpsN++; fpsT += d; if (fpsT >= 1000) { KB.fps = fpsN * 1000 / fpsT; fpsN = 0; fpsT = 0; }
  }

  // ---------- 精靈總表場景（除錯用） ----------
  class SheetScene {
    constructor(filter, page) { this.filter = filter || ''; this.page = page || 0; this.t = 0; }
    update(dt) { this.t += dt; if (KB.input.pressed('right')) this.page++; if (KB.input.pressed('left')) this.page = Math.max(0, this.page - 1); }
    draw(ctx) {
      ctx.fillStyle = '#6a8a9a'; ctx.fillRect(0, 0, KB.W, KB.H);
      const names = KB.SPR_ORDER.filter(n => !this.filter || n.includes(this.filter));
      let x = 2, y = 10, rowH = 0; const perPage = [];
      let pageIdx = 0, items = [];
      for (const n of names) {
        const s = KB.SPR[n]; const w = s.w * s.n + s.n * 2 + 4, h = s.h + 10;
        if (x + w > KB.W - 2) { x = 2; y += rowH + 2; rowH = 0; }
        if (y + h > KB.H - 2) { pageIdx++; x = 2; y = 10; rowH = 0; }
        if (pageIdx === this.page) items.push({ n, x, y, s });
        x += w; rowH = Math.max(rowH, h);
      }
      for (const it of items) {
        const s = it.s;
        KB.text(ctx, it.n, it.x, it.y - 8, { color: '#fff', size: 7 });
        for (let f = 0; f < s.n; f++) {
          const fr = s.frames[f];
          ctx.fillStyle = (f & 1) ? '#5a7a8a' : '#4a6a7a'; ctx.fillRect(it.x + f * (s.w + 2), it.y, s.w, s.h);
          ctx.drawImage(fr.cv, it.x + f * (s.w + 2), it.y);
        }
      }
      KB.text(ctx, 'page ' + (this.page + 1) + ' / ' + (pageIdx + 1) + '  filter=' + this.filter, 2, KB.H - 9, { color: '#ff0', size: 7 });
    }
  }
  KB.SheetScene = SheetScene;

  // ---------- 除錯 API ----------
  window.__kb = {
    goto(name, o) {
      o = o || {};
      if (name === 'title') KB.setScene(KB.TitleScene ? new KB.TitleScene() : new KB.GameScene(KB.LEVELS[0].id));
      else if (name === 'select') KB.setScene(KB.StageSelectScene ? new KB.StageSelectScene(o.index || 0) : new KB.GameScene(KB.LEVELS[0].id));
      else if (name === 'game') { KB.session = { lives: KB.START_LIVES, score: 0 }; KB.setScene(new KB.GameScene(o.level || KB.LEVELS[0].id, o)); if (o.nofade) { KB.scene.fade = 0; KB.scene.fadeDir = 0; } }
      else if (name === 'sheet') KB.setScene(new SheetScene(o.filter, o.page));
      else if (name === 'gameover') KB.setScene(KB.GameOverScene ? new KB.GameOverScene(null) : KB.scene);
      else if (name === 'ending') KB.setScene(KB.EndingScene ? new KB.EndingScene(null) : KB.scene);
      return true;
    },
    step(n) { for (let i = 0; i < (n || 1); i++) step(); render(); return KB.frameCount; },
    render() { render(); },
    press(obj, exclusive) { KB.input.setVirtual(obj, exclusive !== false); },
    release() { KB.input.clearVirtual(); },
    tap(name, frames) { KB.input.setVirtual({ [name]: true }, true); for (let i = 0; i < (frames || 1); i++) step(); KB.input.clearVirtual(); render(); },
    state() {
      const p = KB.player, g = KB.game;
      return JSON.stringify({ scene: KB.scene && KB.scene.constructor.name, frame: KB.frameCount, player: p ? { x: +p.x.toFixed(1), y: +p.y.toFixed(1), vx: +p.vx.toFixed(2), vy: +p.vy.toFixed(2), state: p.state, hp: p.hp, ability: p.ability, mouth: p.mouth, onGround: p.onGround, dir: p.dir } : null, game: g ? { level: g.levelId, room: g.roomIdx, ents: g.entities.length, cam: g.cam, score: g.score, lives: g.lives, boss: g.boss ? { hp: g.boss.hp, maxHp: g.boss.maxHp, dead: g.boss.dead, x: g.boss.x, y: g.boss.y, w: g.boss.w, h: g.boss.h, state: g.boss.state, intro: !!g.boss.introducing } : null, clearT: g.clearT, paused: g.paused } : null, missing: [...KB.missing] });
    },
    missing() { return [...KB.missing]; },
    sprites() { return KB.SPR_ORDER.slice(); },
    setScale(s) { window.__forceScale = s; resize(); },
    pause() { running = false; },
    resume() { if (!running) { running = true; last = 0; requestAnimationFrame(loop); } },
    hitbox(v) { KB.showHitbox = !!v; },
    entities() { return KB.game ? KB.game.entities.filter(e => !e.dead).map(e => ({ t: e.name || e.constructor.name || e.type, x: +e.x.toFixed(1), y: +e.y.toFixed(1), type: e.type, hp: e.hp, state: e.state, spr: e.spr })) : []; },
  };

  function boot() {
    document.body.appendChild(canvas);
    resize();
    KB.session = { lives: KB.START_LIVES, score: 0 };
    const q = new URLSearchParams(location.search);
    if (KB.DEBUG && q.get('norun') === '1') { render(); return; }
    if (q.get('level')) { KB.setScene(new KB.GameScene(q.get('level'), { room: +(q.get('room') || 0), ability: q.get('ability') || undefined })); }
    else if (KB.TitleScene) KB.setScene(new KB.TitleScene());
    else KB.setScene(new KB.GameScene(KB.LEVELS[0].id));
    running = true; requestAnimationFrame(loop);
    // 點擊畫布也可解鎖音訊
    canvas.addEventListener('pointerdown', () => { if (KB.audio && KB.audio.unlock) KB.audio.unlock(); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
