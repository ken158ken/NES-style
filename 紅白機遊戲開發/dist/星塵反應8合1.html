    var a = I.pressed(BTN.A), b = I.pressed(BTN.B);
    if (a && (b || I.held(BTN.B))) return 'LR';
    if (b && I.held(BTN.A)) return 'LR';
    return a ? 'L' : (b ? 'R' : '');
  }
  function judge(which) {
    var need = which === 'a' ? 'L' : 'R';
    var ok = g.air && g.h >= 4 * Q && (g.game === 'NORMAL' || g.foot.indexOf(need) >= 0);
    if (ok) {
      var perfect = g.h * 10 >= g.apex * 7;
      g.combo++; g.jumps++;
      if (g.combo > g.bestCombo) g.bestCombo = g.combo;
      var mult = 1 + Math.min(4, (g.combo / 10) | 0);
      g.score += (perfect ? 3 : 1) * mult;
      if (perfect) { g.perfects++; g.judge = 'PERFECT!'; AU.sfx('rope_perfect'); addFx(); } else { g.goods++; g.judge = 'GOOD'; AU.sfx('rope_good'); }
      g.judgeT = 40;
      if (!g.cheated && g.game === 'NORMAL' && g.combo >= GOAL_COMBO) g.goalHit = true;
      var L = Math.min(30, 1 + ((g.jumps / 10) | 0));
      if (L !== g.lvl) { g.lvl = L; g.rope.lvl = L; g.msg = 'LEVEL ' + L + (L === 2 ? '  SPEED SHIFT' : (L === 3 ? '  WATCH FOR FAKES' : '  FASTER!')); g.msgT = 80; AU.sfx('rope_level'); }
      if (g.combo % 25 === 0) { g.msg = g.combo + ' IN A ROW!'; g.msgT = 80; }
      return true;
    }
    // 失誤
    g.misses++; g.lives--; g.combo = 0; g.judge = 'MISS'; g.judgeT = 60;
    g.mode = 'trip'; g.tripT = 70; g.air = false; g.h = 0; g.vh = 0; g.foot = '';
    g.rope.st = 'stop'; g.rope.th = which === 'a' ? 0 : HALF;
    AU.sfx('rope_miss');
    return false;
  }
  function addFx() { g.fx.push({ x: CX - 12, y: GROUND - 10, t: 24 }); g.fx.push({ x: CX + 4, y: GROUND - 14, t: 24 }); if (g.fx.length > 4) g.fx.splice(0, g.fx.length - 4); }
  // P2-2：繩子停在頭頂（雙繩：金繩在前、藍繩在後，都離腳下 90°）倒數 READY_FRAMES 幀，倒數結束才從靜止慢慢轉起
  function restartRope(tag) {
    var r = g.rope;
    r.st = 'ready'; r.stT = READY_FRAMES; r.w = 0; r.lvl = g.lvl;
    r.th = g.game === 'DOUBLE' ? 16384 : HALF;
    planNext(r);
    g.readyTag = tag || 'READY'; g.cdShown = 0;
  }

  /* ============================== 遊玩更新 ============================== */
  function setPause(p) { g.paused = p; if (p) AU.pause(); else AU.resume(); drawHud(); }
  function updatePlay() {
    var I = NES.Input;
    if (I.pressed(BTN.START) && !I.held(BTN.SELECT)) setPause(!g.paused);
    if (g.paused) return;
    g.ft++;
    if (g.msgT > 0) g.msgT--;
    if (g.judgeT > 0) g.judgeT--;
    g.fx = g.fx.filter(function (f) { f.y--; return --f.t > 0; });
    if (g.mode === 'trip') {
      if (--g.tripT <= 0) {
        if (g.lives <= 0) { enterOver(); return; }
        g.mode = 'play'; restartRope('TRY AGAIN!'); g.msgT = 0;
      }
      return;
    }
    g.t++;
    // ① 輸入（落地前 6 幀內按下 = 緩衝，落地立刻跳）
    var want = readJump(I);
    if (want) { if (!g.air) jump(want); else { g.buf = 6; g.bufFoot = want; } }
    else if (g.buf > 0) g.buf--;
    // ② 物理
    if (g.air) {
      g.h += g.vh; g.vh -= grav();
      if (g.h <= 0) {
        g.h = 0; g.vh = 0; g.air = false; g.foot = '';
        if (g.buf > 0) { jump(g.bufFoot); g.buf = 0; }
      }
    }
    // ③ 繩子
    var wasReady = g.rope.st === 'ready';
    var res = stepRope(g.rope);
    if (wasReady) {
      var cd = g.rope.st === 'ready' ? ((g.rope.stT - 1) / 40 | 0) + 1 : 0;
      if (cd !== g.cdShown) { g.cdShown = cd; AU.sfx(cd ? 'rope_move' : 'rope_ok'); }
      if (!cd) { g.msg = 'JUMP!'; g.msgT = 40; }
    }
    if (res.a || res.b) AU.sfx('rope_swish');
    // ④ 判定
    if (res.a) { if (judge('a')) planNext(g.rope); }
    if (res.b && g.game === 'DOUBLE' && g.mode === 'play') judge('b');
  }

  function saveBest() {
    if (!g || g.mode === 'title') return false;
    var nb = false, key = g.game === 'DOUBLE' ? 'bestD' : 'best';
    if (g.bestCombo > CT.load('rope', key, 0)) { CT.save('rope', key, g.bestCombo); nb = true; }
    if (g.score > CT.load('rope', 'score', 0)) CT.save('rope', 'score', g.score);
    return nb;
  }
  function enterOver() {
    g.mode = 'over'; g.overT = 0;
    g.newBest = saveBest();
    var ppu = nes0.ppu;
    CT.blank(nes0, function () {
      ppu.split(null); ppu.scroll(0, 0);
      ppu.fillTiles(0, 0, 0, 32, 30, 0); ppu.fillAttr(0, 0, 0, 16, 15, 0);
      clearSpr();
      ppu.setBackdrop(0x0F);
      ppu.setBgPalette(0, PAL_T0); ppu.setBgPalette(1, PAL_T1); ppu.setBgPalette(2, PAL_T2);
      for (var c = 4; c < 28; c++) { ppu.setTile(0, c, 4, art.t('FR_H')); ppu.setTile(0, c, 25, art.t('FR_H')); }
      text0(11, 6, 'GAME OVER');
      text0(8, 9, g.game + '  ' + VENUES[g.venue].id + (g.newBest ? '  NEW!' : ''));
      text0(8, 11, 'BEST COMBO  ' + pad(g.bestCombo, 3));
      text0(8, 13, 'JUMPS       ' + pad(g.jumps, 3));
      text0(8, 15, 'PERFECT     ' + pad(g.perfects, 3));
      text0(8, 17, 'SCORE    ' + pad(g.score, 6));
      text0(6, 21, 'START  TITLE');
      text0(6, 23, 'C/★    CONTINUE HERE');
      ppu.fillAttr(0, 0, 3, 16, 1, 1);
      ppu.fillAttr(0, 0, 11, 16, 1, 2);
      g.hud = {};
    });
    AU.play('rope_over');
  }
  // §6-1 密技原地續關
  function continueRun() {
    g.mode = 'play'; g.overT = 0; g.tripT = 0; g.paused = false;
    g.lives = LIVES0; g.combo = 0; g.cheated = true; g.continues++;
    g.air = false; g.h = 0; g.vh = 0; g.foot = ''; g.buf = 0;
    restartRope('CONTINUE! LV ' + g.lvl);
    buildStage();
    g.msgT = 0;
    AU.sfx('rope_level');
    AU.play(VENUES[g.venue].song);
  }

  /* ============================== 精靈：逐線配額器 ============================== */
  var lines = new Uint8Array(240);
  function room(y, h, need) { for (var l = Math.max(0, y); l < y + h && l < 240; l++) if (lines[l] + need > 8) return false; return true; }
  function take(y, h, n) { for (var l = Math.max(0, y); l < y + h && l < 240; l++) lines[l] += n; }
  function clearSpr() { nes0.ppu.clearSprites(); if (g) g.sprUsed = 0; }
  function ropeBeads(which) {
    var r = g.rope, th = which === 'a' ? r.th : ((r.th + HALF) & 0xFFFF);
    var amp = (RR * cs(th) + TT * sn(th)) >> 8, B = g.game === 'DOUBLE' ? BEADS2 : BEADS1, out = [];
    for (var k = 0; k < B.length; k++) out.push({ x: B[k].x, y: HANDY + ((B[k].s * amp) >> 8), front: sn(th) > 0, near: Math.abs(th - (th > HALF ? FULL : 0)) < 6000 });
    return out;
  }
  function jumperTiles() {
    var C = CHARS[g.who].id, fr;
    if (g.mode === 'trip') fr = 'TRIP';
    else if (g.mode === 'title') fr = ((g.t >> 4) & 1) ? 'AIR' : 'STAND';
    else if (!g.air) fr = 'STAND';
    else if (g.game === 'DOUBLE' && g.foot !== 'LR') fr = g.foot === 'L' ? 'FOOTL' : 'FOOTR';
    else fr = 'AIR';
    return [0, 1, 2, 3, 4, 5].map(function (i) { return art.s(C + '_' + fr + '_' + i); });
  }
  function drawSprites() {
    var ppu = nes0.ppu, n = 0, i;
    lines.fill(0);
    var list = [];        // 依顯示順序：{x,y,tile,pal}
    if (g.mode === 'title') {
      var ty = 40 - (((g.t >> 4) & 1) ? 6 : 0), jt = jumperTiles();
      for (i = 0; i < 6; i++) list.push({ x: 188 + (i & 1) * 8, y: ty + (i >> 1) * 8, tile: jt[i], pal: 0 });
      take(ty, 24, 2);
    } else if (g.mode === 'play' || g.mode === 'trip') {
      var jy = GROUND - 24 - (g.h >> 8), jtl = jumperTiles();
      take(jy, 24, 2);                                      // ① 跳繩者（最優先）
      var ropes = [['a', ropeBeads('a'), 1]];
      if (g.game === 'DOUBLE') ropes.push(['b', ropeBeads('b'), 2]);
      var front = [], back = [], hidBase = 0;
      ropes.sort(function (p, q2) { return (q2[1][0].front ? 1 : 0) - (p[1][0].front ? 1 : 0); });   // 前方那條先排
      for (var ri = 0; ri < ropes.length; ri++) {
        var bs = ropes[ri][1], base = ropes[ri][0] === 'a' ? 0 : 6;
        // 藏過的繩珠優先
        var ord = bs.map(function (b, k) { return k; }).sort(function (p, q2) { return g.hid[base + q2] - g.hid[base + p]; });
        for (var oi = 0; oi < ord.length; oi++) {
          var k2 = ord[oi], b = bs[k2], by = b.y - 4;
          if (room(by, 8, 1)) {
            take(by, 8, 1); g.hid[base + k2] = 0;
            (b.front ? front : back).push({ x: b.x - 4, y: by, tile: art.s(b.near ? 'BEADF' : 'BEAD'), pal: ropes[ri][2] });
          } else {
            g.hid[base + k2]++; g.hidden++;
            if (g.hid[base + k2] > g.hidMax) g.hidMax = g.hid[base + k2];
          }
        }
        void hidBase;
      }
      list = list.concat(front);
      for (i = 0; i < 6; i++) list.push({ x: CX - 8 + (i & 1) * 8, y: jy + (i >> 1) * 8, tile: jtl[i], pal: 0 });
      list = list.concat(back);
      for (i = 0; i < g.fx.length; i++) {               // ④ 火花（最低）
        var f = g.fx[i];
        if (!room(f.y, 8, 1)) continue;
        take(f.y, 8, 1);
        list.push({ x: f.x, y: f.y, tile: art.s(f.t > 12 ? 'SPARK' : 'TWINK'), pal: 3 });
      }
    }
    for (i = 0; i < list.length && n < 62; i++) ppu.sprite(n++, list[i]);
    for (i = n; i < g.sprUsed; i++) ppu.sprite(i, null);
    g.sprUsed = n;
    var m = 0;
    for (i = 0; i < 240; i++) if (lines[i] > m) m = lines[i];
    if (m > g.maxLine) g.maxLine = m;
  }

  /* ============================== 機器人 ============================== */
  // 用與遊戲相同的繩子控制器預測下一次越過腳下的幀數，讓「繩子到腳下時剛好在頂點」
  function botMask() {
    var B = g.bot;
    B.t++;
    if (g.mode === 'title') {
      if (g.row !== 0) return (B.t % 20 === 10) ? BTN.UP : 0;
      if (g.msel !== 0) return (B.t % 20 === 10) ? BTN.LEFT : 0;
      return (B.t % 40 === 20) ? BTN.START : 0;
    }
    if (g.mode === 'over') return (g.overT > 60 && B.t % 40 === 20) ? BTN.START : 0;
    if (g.paused) return (B.t % 40 === 20) ? BTN.START : 0;
    if (g.mode !== 'play' || g.air) return 0;
    var nx = framesToCross(240);
    if (nx.f < 0) return 0;
    var C = CHARS[g.who], v0 = C.v0, gr = grav();
    if (g.game === 'DOUBLE') v0 = (v0 * 170) >> 8;
    var peak = Math.round(v0 / gr);               // 頂點在第幾幀
    // 按鍵在下一幀生效：跳起後第 f 幀越過腳下 ⇒ 要 f == peak
    if (nx.f === peak || (nx.f < peak && nx.f >= 3)) {
      if (g.game === 'NORMAL') return BTN.A;
      return nx.which === 'a' ? BTN.A : BTN.B;
    }
    return 0;
  }

  /* ============================== 註冊 ============================== */
  var GAME = {
    id: 'rope', order: 4, title: '星塵跳繩', legacy: ['jump-rope.html'],
    init: function (nes, opt) {
      nes0 = nes;
      art = RP.Art.make();
      var ppu = nes.ppu;
      NES.CHR.setPattern(0, 'rope_bg');
      NES.CHR.setPattern(1, 'rope_spr');
      if (ppu.setPatternTables) ppu.setPatternTables(0, 1);
      ppu.spriteMode(8);
      ppu.flickerStep = 0;
      GAME.backTile = { tile: art.s('BACK'), pal: 1 };      // §6-4：實心金星（8×8）
      AU.init(nes);
      g = newState();
      var qm = CT.query ? CT.query('rmode') : null, qw = CT.query ? CT.query('who') : null, qv = CT.query ? CT.query('venue') : null;
      if (qw) g.who = Math.max(0, Math.min(2, parseInt(qw, 10) || 0));
      if (qv) g.venue = Math.max(0, Math.min(2, parseInt(qv, 10) || 0));
      if (qm === 'normal' || qm === 'double') { g.msel = qm === 'double' ? 1 : 0; startRun(); }
      else enterTitle();
    },
    update: function () {
      var I = NES.Input;
      if (g.cheatReq) {
        g.cheatReq = false;
        if (g.mode === 'over' || (g.mode === 'trip' && g.lives <= 0)) continueRun();
        else if (g.mode === 'play' || g.mode === 'trip') {
          g.cheated = true; g.lives = LIVES0; g.rope.slowT = 600; g.msg = 'STAR POWER! SLOW ROPE'; g.msgT = 80; AU.sfx('rope_level');
        }
      }
      if (g.mode === 'title') {
        g.t++;
        var ch = false;
        if (I.pressed(BTN.UP)) { g.row = (g.row + 2) % 3; ch = true; }
        else if (I.pressed(BTN.DOWN)) { g.row = (g.row + 1) % 3; ch = true; }
        else if (I.pressed(BTN.LEFT) || I.pressed(BTN.RIGHT)) {
          var d = I.pressed(BTN.LEFT) ? -1 : 1;
          if (g.row === 0) g.msel ^= 1; else if (g.row === 1) g.who = (g.who + 3 + d) % 3; else g.venue = (g.venue + 3 + d) % 3;
          ch = true;
        }
        if (ch) { titleRows(false); AU.sfx('rope_move'); }
        else if ((I.pressed(BTN.START) || I.pressed(BTN.A)) && !I.held(BTN.SELECT)) { AU.sfx('rope_ok'); startRun(); }
      } else if (g.mode === 'over') {
        g.overT++;
        if (g.overT > 40 && I.pressed(BTN.START) && !I.held(BTN.SELECT)) enterTitle();
      } else updatePlay();
      AU.tick();
    },
    draw: function () {
      if (g.mode === 'title') {
        if ((g.t & 31) === 0) txt(25, 11, (g.t & 32) ? '          ' : 'PUSH START');
      } else if (g.mode === 'play' || g.mode === 'trip') {
        if (!g.paused) drawHud();
        drawCrank();
      }
      drawSprites();
    },
    state: function () {
      var r = g.rope;
      return {
        mode: g.mode, game: g.game, row: g.row, who: CHARS[g.who].id, venue: VENUES[g.venue].id, t: g.t,
        combo: g.combo, bestCombo: g.bestCombo, jumps: g.jumps, score: g.score, lives: g.lives, lvl: g.lvl,
        perfects: g.perfects, goods: g.goods, misses: g.misses, feints: r.nf || 0, paused: g.paused,
        h: g.h >> 8, air: g.air, foot: g.foot, th: r.th, w: r.w, ropeSt: r.st, period: r.tw ? Math.round(FULL / r.tw) : 0,
        hidMax: g.hidMax, hidden: g.hidden, maxLine: g.maxLine, cheated: g.cheated, cheats: g.cheats, continues: g.continues,
        goal: !!(g.goalHit && !g.cheated)
      };
    },
    exit: function () { saveBest(); AU.stop(); },            // §6-3
    cheat: function () { if (!g || g.mode === 'title') return false; g.cheatReq = true; g.cheats++; return true; },
    bot: function () { return botMask(); },
    goal: function () { return !!(g && g.goalHit && !g.cheated); },
    bestText: function () { return bestFmt(CT.load('rope', 'best', 0)); }   // §1-6：6 字元
  };
  RP.CHARS = CHARS; RP.VENUES = VENUES; RP.GOAL_COMBO = GOAL_COMBO;
  RP.dev = {
    g: function () { return g; },
    start: function (mode, who, venue) { g.msel = mode === 'DOUBLE' ? 1 : 0; g.who = who || 0; g.venue = venue || 0; startRun(); },
    newRope: newRope, stepRope: stepRope, planNext: planNext, cloneRope: cloneRope, framesToCross: function (n) { return framesToCross(n || 240); },
    ropeBeads: ropeBeads, bestFmt: bestFmt, READY_FRAMES: READY_FRAMES, jump: jump, grav: grav, over: function () { enterOver(); }, judge: judge, periodOf: periodOf
  };
  if (CT.register) CT.register(GAME);
})();

</script>
<script>/* games/cart2/catch/art.js */
/*
 * games/cart2/catch/art.js — 《星塵接球 STAR CATCH》CHR（全部原創像素；背景 bank `catch_bg`、精靈 bank `catch_spr`）
 * ---------------------------------------------------------------------------
 * 擁有者：C6-3 cart2-pop（R6）｜ 依賴：engine/chr.js（字身沿用原創 NES.CHR.DEMO.FONT）
 *
 * 主角「波羅 BOLO」：圓頂、單眼護目鏡、兩顆小輪子的拾星機器人（16×16，橘身白頂）。
 *   接星模式頭頂扛「星籃」（24×8）、頂球模式扛「托盤」（24×8）、彈跳模式改操作彈跳星球「噗噗 PUFF」（8×8，有臉）。
 * 背景（catch_bg）：
 *   F_*            字型（色 3，透明底）            FR_T / FR_B / FR_L / FR_R / FR_*  邊框（色 1 / 2）
 *   FLOOR / SOIL   地面（接星 / 頂球）             D1 / D2  星點裝飾（色 3）
 *   PL_L / PL_M / PL_R  一般平台（青）  SPRING 彈簧  SPIKE 星刺  CRUMB / CRACK 碎晶（踩過龜裂 → 消失）
 *   ICE 冰晶（滑）  GEM 星晶（收集）  GO0..GO3 星門（2×2，終點）  BLK 標題大字方塊
 * 精靈（catch_spr，全部 8×8）：
 *   BOLO_{A,B}{0..3}（2 個輪子影格 × 4 磚）、BOLO_X{0..3}（暈眩）、BASK_{L,M,R}、TRAY_{L,M,R}、
 *   STAR / GOLD / HEART / CLOCK / URCHIN（壞東西：虛空海膽）、BALL（彗星球）、PUFF0..PUFF2（噗噗：一般 / 壓扁 / 拉長）、
 *   SPARK / POOF / ARROW（風向）
 */
(function () {
  'use strict';
  var NES = window.NES = window.NES || {};
  var CT = window.CT = window.CT || {};
  var CA = CT.Catch = CT.Catch || {};
  var CHR = NES.CHR;

  var FONT = (CHR && CHR.DEMO && CHR.DEMO.FONT) || {};
  var CHARMAP = { ' ': 'SP', '-': 'DASH', '!': 'EXCL', '/': 'SLASH', '+': 'PLUS', 'x': 'MUL', ':': 'COLON', '.': 'DOT',
                  '?': 'QUEST', '=': 'EQ', '>': 'ARROW', '%': 'PCT', '(': 'LPAREN', ')': 'RPAREN', "'": 'APOS', ',': 'COMMA' };
  var i;
  for (i = 0; i <= 9; i++) CHARMAP[String(i)] = 'N' + i;
  for (i = 65; i <= 90; i++) CHARMAP[String.fromCharCode(i)] = String.fromCharCode(i);
  CHARMAP['*'] = 'STAR'; CHARMAP['#'] = 'HEART'; CHARMAP['$'] = 'COIN';

  function E8() { return ['........', '........', '........', '........', '........', '........', '........', '........']; }
  function quad(rows, w) {           // w×16 文字圖 → 8×8 磚（左上、右上、左下、右下 …）
    var out = [], tx, ty, y, cols = w / 8;
    for (ty = 0; ty < rows.length / 8; ty++) for (tx = 0; tx < cols; tx++) {
      var t = [];
      for (y = 0; y < 8; y++) t.push(rows[ty * 8 + y].substring(tx * 8, tx * 8 + 8));
      out.push(t);
    }
    return out;
  }

  /* ================= 背景 ================= */
  var BG = { SP: E8() };
  for (var k in CHARMAP) {
    if (!Object.prototype.hasOwnProperty.call(CHARMAP, k)) continue;
    var n = CHARMAP[k];
    if (FONT[n]) BG['F_' + n] = FONT[n];
  }
  // 邊框（色 1 暗、色 2 亮）：星管框
  BG.FR_T = ['........', '........', '22222222', '11111111', '12121212', '11111111', '........', '........'];
  BG.FR_B = BG.FR_T;
  BG.FR_L = ['..1211..', '..1211..', '..1211..', '..1111..', '..1211..', '..1211..', '..1211..', '..1111..'];
  BG.FR_R = BG.FR_L;
  BG.FR_C = ['........', '........', '..2222..', '..2112..', '..2112..', '..2222..', '........', '........'];
  // 地面：上緣亮線 + 晶砂
  BG.FLOOR = ['33333333', '22222222', '21222212', '22122222', '22222122', '12222222', '22221222', '22222222'];
  BG.SOIL = ['22122222', '22222212', '12222222', '22222122', '22212222', '22222222', '21222221', '22222222'];
  BG.D1 = ['........', '........', '........', '...3....', '........', '........', '........', '........'];

  // 波羅：1 = 深色描邊、2 = 橘身、3 = 白頂 / 護目鏡

  // 星籃 24×8（網狀）
  var BASK = [

  var ART = null;
  function make() {

    }
    ART = {
      bg: bg, spr: spr,
      t: function (name) { return bg.index(name); },

})();

<script>/* games/cart2/catch/song.js */
/*
 * games/cart2/catch/song.js — 《星塵接球》音樂 / 音效（全部原創旋律，只走 2A03）
 * ---------------------------------------------------------------------------
 * 擁有者：C6-3 cart2-pop（R6）｜ 依賴：engine/music.js（R6 起有 pause / resume；沒有就退回 stop + from 小節）
 * 契約：CT.Catch.Audio = { init(nes), play(key), stop(), pause(), resume(), sfx(name), tick(), SONGS, SFX, current }
 *
 * | key          | 曲名       | speed | 小節 | 說明 |
 * |--------------|------------|-------|------|------|
 * | catch_title  | 拾星小調   | 7     | 8    | 標題 + 接星模式；F 大調，p1 三拍跳音旋律 / p2 反拍和弦 / tri 行進低音 |
 * | catch_keep   | 不落地     | 6     | 8    | 頂球 + 彈跳模式；A 小調 → C 大調，p1 上行琶音動機 / p2 回音 / noi 輕快鼓 |
 * | catch_over   | 落地了     | 8     | 1    | GAME OVER / 結算（不 loop） |
 * 音效（只搶 p2 / noi）：catch_get / gold / bad / miss / bounce / hit / level / spring / pop / clear
 */
(function () {
  'use strict';
  var CT = window.CT = window.CT || {};
  var CA = CT.Catch = CT.Catch || {};
  var NES = window.NES = window.NES || {};

  function tok(s) { return String(s).split(/\s+/).filter(function (t) { return t; }); }
  function fit(a) { while (a.length < 16) a.push(null); return a.slice(0, 16); }
  function mel(str, inst, vol, duty) {
    return fit(tok(str).map(function (t) {
      if (t === '-') return null;
      if (t === '=') return { note: '===' };
      return { note: t, inst: inst, vol: vol, duty: duty };
    }));
  }
  var DR = { k: { note: 12, inst: 'kick', vol: 13, duty: 0 }, s: { note: 6, inst: 'snare', vol: 11, duty: 0 },
             h: { note: 1, inst: 'hat', vol: 7, duty: 0 } };
  function drm(str) { return fit(tok(str).map(function (t) { return DR[t] || null; })); }
  function offbeat(root, arp, vol) {        // 反拍和弦：每 4 row 的第 2、4 拍
    var out = [];
    for (var i = 0; i < 16; i++) out.push((i % 4 === 2) ? { note: root, inst: 'stab', vol: vol, duty: 2, arp: [arp[(i >> 2) % arp.length]] } : null);
    return out;
  }
  var INST = {
    lead: { vol: [12, 12, 11, 10, 9, 9, 8, 8, 7], volLoop: 8, duty: [2] },
    hop: { vol: [13, 10, 8, 6, 5, 4, 3, 2, 1, 0], duty: [1] },
    stab: { vol: [8, 6, 4, 2, 1, 0], duty: [2] },
    echo: { vol: [6, 6, 5, 4, 3, 2, 1, 0], duty: [1] },
    bass: {},
    kick: { vol: [15, 11, 7, 3, 0] },
    snare: { vol: [12, 10, 8, 6, 4, 2, 0] },
    hat: { vol: [5, 3, 1, 0] }
  };
  var MAJ = [0, 4, 7], MIN = [0, 3, 7];
  function song(name, speed, bars, loop) {
    var s = { name: name, speed: speed, rows: 16, loop: 0, instruments: INST, patterns: [], order: [], playLoop: loop };
    bars.forEach(function (b) { s.order.push(s.patterns.length); s.patterns.push(b); });
    return s;
  }

  // ---- 拾星小調（F 大調；三連跳音的「撿起來」動機，原創）----
  function buildTitle() {
    var M = [
      'C-5 -   C-5 F-5 -   A-5 -   -   G-5 -   F-5 -   E-5 -   C-5 -',
      'D-5 -   D-5 G-5 -   A#5 -   -   A-5 -   G-5 -   F-5 -   -   -',
      'C-5 -   C-5 F-5 -   A-5 -   -   C-6 -   A-5 -   F-5 -   A-5 -',
      'G-5 -   -   -   E-5 -   F-5 -   G-5 -   -   -   =   -   -   -',
      'A-5 -   A-5 C-6 -   A-5 -   F-5 A#5 -   A-5 -   G-5 -   F-5 -',
      'G-5 -   G-5 A#5 -   G-5 -   E-5 A-5 -   G-5 -   F-5 -   E-5 -',
      'F-5 -   A-5 -   C-6 -   D-6 -   C-6 -   A#5 -   A-5 -   G-5 -',
      'F-5 -   -   -   C-5 -   -   -   F-5 -   -   -   =   -   -   -'
    ];
    var C = [['F-3', MAJ], ['G-3', MIN], ['F-3', MAJ], ['C-3', MAJ], ['F-3', MAJ], ['C-3', MAJ], ['A#2', MAJ], ['F-3', MAJ]];
    var BL = {
      'F-3': 'F-2 -   -   -   C-3 -   -   -   F-2 -   -   -   A-2 -   -   -',
      'G-3': 'G-2 -   -   -   D-3 -   -   -   G-2 -   -   -   A#2 -   -   -',
      'C-3': 'C-2 -   -   -   G-2 -   -   -   C-2 -   -   -   E-2 -   -   -',
      'A#2': 'A#1 -   -   -   F-2 -   -   -   A#1 -   -   -   D-2 -   -   -'
    };
    return song('拾星小調（catch_title）', 7, M.map(function (m, i) {
      return { p1: mel(m, 'hop', 12, 1), p2: offbeat(C[i][0].replace('-3', '-4').replace('-2', '-3'), C[i][1], 8),
               tri: mel(BL[C[i][0]], 'bass', 15, 0), noi: drm('k - h - s - h - k - h - s - h h') };
    }), true);
  }
  // ---- 不落地（A 小調；上行琶音「再頂一次」動機，原創）----
  function buildKeep() {
    var M = [
      'A-4 C-5 E-5 -   A-5 -   G-5 E-5 -   D-5 -   E-5 -   -   -   -',
      'F-4 A-4 C-5 -   F-5 -   E-5 C-5 -   B-4 -   C-5 -   -   -   -',
      'G-4 B-4 D-5 -   G-5 -   F-5 D-5 -   C-5 -   D-5 -   E-5 -   G-5',
      'E-5 -   -   -   -   -   D-5 -   C-5 -   B-4 -   =   -   -   -',
      'C-5 E-5 G-5 -   C-6 -   B-5 G-5 -   A-5 -   G-5 -   -   E-5 -',
      'F-5 -   E-5 -   D-5 -   C-5 -   D-5 -   E-5 -   F-5 -   G-5 -',
      'A-5 -   G-5 -   E-5 -   C-5 -   D-5 -   -   E-5 -   C-5 -   -',
      'A-4 -   -   -   E-5 -   -   -   A-5 -   -   -   =   -   -   -'
    ];
    var BL = ['A-2', 'F-2', 'G-2', 'E-2', 'C-2', 'F-2', 'G-2', 'A-2'];
    return song('不落地（catch_keep）', 6, M.map(function (m, i) {
      var b = BL[i], o = b.replace('-2', '-3');
      return { p1: mel(m, 'lead', 12, 2), p2: [null, null].concat(mel(m, 'echo', 7, 1).slice(0, 14)),
               tri: mel(b + ' -   ' + o + ' -   ' + b + ' -   ' + o + ' -   ' + b + ' -   ' + o + ' -   ' + b + ' -   ' + o + ' -', 'bass', 15, 0),
               noi: drm('k - h h s - h - k h h - s - h s') };
    }), true);
  }
  function buildOver() {
    return song('落地了（catch_over）', 8, [{
      p1: mel('E-5 -   C-5 -   A-4 -   B-4 -   G#4 -   A-4 -   -   =   -', 'lead', 12, 2),
      p2: mel('C-4 -   A-3 -   E-3 -   E-3 -   D-3 -   C-3 -   -   =   -', 'echo', 9, 1),
      tri: mel('A-2 -   -   -   F-2 -   -   -   E-2 -   -   -   A-1 -   =   -', 'bass', 15, 0),
      noi: drm('k - - - - - - - k - - - - - - -')
    }], false);
  }

  function sq(list) {
    var out = [];
    list.forEach(function (e) { for (var j = 0; j < e[1]; j++) out.push(j === 0 ? { note: e[0], vol: e[2], duty: e[3] === undefined ? 1 : e[3], retrigger: true } : {}); });
    out.push({ off: true });
    return out;
  }
  function nz(list) {
    var out = [];
    list.forEach(function (e) { for (var j = 0; j < e[1]; j++) out.push(j === 0 ? { note: e[0], vol: e[2], retrigger: true } : {}); });
    out.push({ off: true });
    return out;
  }
  var SFX = {
    catch_get: { priority: 3, data: { p2: sq([['A-5', 2, 10, 2], ['E-6', 4, 10]]) } },
    catch_gold: { priority: 4, data: { p2: sq([['C-6', 2, 11, 2], ['E-6', 2, 11], ['G-6', 2, 11], ['C-7', 6, 10]]) } },
    catch_bad: { priority: 7, data: { p2: sq([['D-4', 3, 13, 0], ['A-3', 3, 12], ['D-3', 8, 10]]), noi: nz([[4, 4, 12], [8, 6, 8]]) } },
    catch_miss: { priority: 5, data: { p2: sq([['E-5', 3, 10, 1], ['C-5', 3, 9], ['A-4', 6, 8]]) } },
    catch_bounce: { priority: 2, data: { p2: sq([['G-4', 1, 10, 2], ['D-5', 3, 9]]) } },
    catch_hit: { priority: 2, data: { noi: nz([[5, 2, 10], [7, 2, 6]]) } },
    catch_level: { priority: 6, data: { p2: sq([['F-5', 3, 12, 2], ['A-5', 3, 12], ['C-6', 3, 12], ['F-6', 8, 11]]) } },
    catch_spring: { priority: 4, data: { p2: sq([['C-5', 1, 11, 2], ['G-5', 1, 11], ['C-6', 1, 11], ['G-6', 4, 10]]) } },
    catch_pop: { priority: 7, data: { p2: sq([['C-6', 2, 12, 0], ['F#5', 2, 11], ['C-5', 3, 10], ['F#4', 6, 8]]), noi: nz([[2, 4, 12], [5, 8, 8]]) } },
    catch_clear: { priority: 6, data: { p2: sq([['C-6', 4, 12, 2], ['G-5', 4, 12], ['C-6', 4, 12], ['E-6', 4, 12], ['G-6', 10, 11]]) } }
  };
  var SONGS = { catch_title: buildTitle(), catch_keep: buildKeep(), catch_over: buildOver() };

  function drv(nes) { return (nes && nes.music) || (NES.Music && NES.Music._default ? NES.Music : null); }
  var Audio = {
    SONGS: SONGS, SFX: SFX, current: null, _nes: null, _paused: null,
    init: function (nes) {
      Audio._nes = nes; Audio.current = null; Audio._paused = null;
      var d = drv(nes);
      if (!d) return false;
      for (var key in SFX) if (Object.prototype.hasOwnProperty.call(SFX, key)) { try { d.define(key, SFX[key]); } catch (e) { } }
      return true;
    },
    play: function (key) {
      var d = drv(Audio._nes), s = SONGS[key];
      if (!d || !s) return false;
      var st = null; try { st = d.state ? d.state() : null; } catch (e) { st = null; }
      if (Audio.current === key && !Audio._paused && st && st.playing) return true;
      Audio._paused = null;
      try { d.play(s, { loop: s.playLoop }); Audio.current = key; return true; } catch (e) { return false; }
    },
    stop: function () { var d = drv(Audio._nes); if (d) { try { d.stop(); if (d.stopSfx) d.stopSfx(); } catch (e) { } } Audio.current = null; Audio._paused = null; },
    sfx: function (name) {
      var d = drv(Audio._nes);
      if (!d || !SFX[name] || Audio._paused) return false;
      try { d.sfx(name); return true; } catch (e) { return false; }
    },
    // 暫停（§6-2）：engine R6 有 pause/resume 就用（同一 row 接續）；沒有就記小節、stop、resume 時 from 該小節
    pause: function () {
      var d = drv(Audio._nes);
      if (!d || !Audio.current || Audio._paused) return false;
      if (typeof d.pause === 'function' && typeof d.resume === 'function') {
        try { if (d.stopSfx) d.stopSfx(); d.pause(); Audio._paused = { key: Audio.current, engine: true }; return true; } catch (e) { }
      }
      var st = null; try { st = d.state ? d.state() : d; } catch (e) { st = d; }
      Audio._paused = { key: Audio.current, from: st && st.playing ? (st.orderIndex || 0) : -1 };
      try { d.stop(); if (d.stopSfx) d.stopSfx(); } catch (e) { }
      return true;
    },
    resume: function () {
      var d = drv(Audio._nes), p = Audio._paused, s = p && SONGS[p.key];
      Audio._paused = null;
      if (!d || !s) return false;
      if (p.engine) { try { d.resume(); return true; } catch (e) { return false; } }
      if (p.from < 0) return false;
      try { d.play(s, { loop: s.playLoop, from: p.from % s.order.length }); Audio.current = p.key; return true; } catch (e) { return false; }
    },
    tick: function () { var d = drv(Audio._nes); if (d) { try { d.tick(); } catch (e) { } } }
  };
  CA.Audio = Audio;
})();

</script>
<script>/* games/cart2/catch/levels.js */
/*
 * games/cart2/catch/levels.js — 《星塵接球》彈跳模式 6 張原創關卡（純資料）
 * ---------------------------------------------------------------------------
 * 擁有者：C6-3 cart2-pop（R6）
 * 座標 = 名稱表磚（col 1..30、row 3..27；row 27 是最底列，掉出 row 28 = 失誤）。
 *   p: [row, c0, c1, ch]  在 row 列 c0..c1 鋪 ch：'=' 一般平台、'^' 彈簧、'x' 星刺、'~' 碎晶（踩一次龜裂、第二次碎掉）、
 *                         '_' 苔墊（低彈、不能高跳）
 *   S: [col, row]  出生平台上的 x 欄（球從上方落下）；G: [col, row] 星門左上角（col / row 皆偶數，對齊 16×16 屬性）
 *   gems: [[col, row], …]  星晶（收集加分，不影響通關）
 * 每關都由 main.js 的 dev.solve(n) 用與遊戲相同的物理 BFS 驗證可通關（test_catch.py）。
 */
(function () {
  'use strict';
  var CT = window.CT = window.CT || {};
  var CA = CT.Catch = CT.Catch || {};
  CA.LEVELS = [
    { name: 'FIRST HOP', S: [4, 27], G: [8, 4],
      p: [[27, 1, 30, '='], [24, 8, 13, '='], [21, 15, 20, '='], [18, 22, 27, '='], [15, 15, 20, '='], [12, 8, 13, '='], [9, 1, 6, '='], [6, 6, 11, '=']],

 *                60s 第 3 顆、90s 重力增加。掉一顆 = 扣 1 命、連續時間歸零。**goal = 連續 60 秒不掉（未用密技）**。
 *   BOUNCE TOWER 彈跳：操作自動彈跳的星球「噗噗」左右移動、落地時按住 A = 高跳，6 張原創關卡跳上星門；
 *                彈簧 / 星刺 / 碎晶（第二次踩就碎）/ 苔墊（低彈、不能高跳）。

 * 密技（C / ★）：遊玩中 = 接星補 2 命並清除海膽、頂球補滿命數、彈跳補 3 命；GAME OVER = 原地續關（同一級 / 同一關，

      mode: 'title', sel: 1, sub: 'keep', t: 0, paused: false, hud: {}, sprUsed: 0,
      score: 0, lives: 3, cheated: false, cheatReq: false, goalHit: false, overT: 0, msg: '', msgT: 0,
      seed: 7, continues: 0, runs: 0,
      // 接星
      px: 116 * Q, lv: 1, caught: 0, miss: 0, items: [], acc: 0, slow: 0, dizzy: 0, fx: [], combo: 0, lvT: 0,
      // 頂球
      balls: [], streak: 0, bestStreak: 0, hits: 0, phase: 0, wind: 0, windWarn: 0, net: 0, dropT: 0, addCd: 0, lost: 0, pend: null,
      // 彈跳

      bot: { t: 0, plan: null, step: 0, ft: 0, expect: null, replans: 0 }
    };

  function rnd() { g.seed = (g.seed * 1103515245 + 12345) & 0x7fffffff; return g.seed >> 8; }

  /* ---------------- 文字 / HUD ---------------- */
  function text0(col, row, s) {
    var t = art.text(s);
    for (var i = 0; i < t.length && col + i < 32; i++) nes0.ppu.setTile(0, col + i, row, t[i]);
  }

      g.hud[k] = t[i];
      nes0.ppu.setTile(0, col + i, row, t[i]);
    }
  }
  function pad(n, w) { var s = String(Math.max(0, n | 0)); while (s.length < w) s = '0' + s; return s; }
  function padR(s, w) { s = String(s); while (s.length < w) s += ' '; return s.substring(0, w); }
  function secs(f) { var d = Math.floor(f / 6); return Math.floor(d / 10) + '.' + (d % 10); }
  function sec3(f) { var s = secs(f); while (s.length < 4) s = '0' + s; return s; }   // 00.0

  // 標題大字（3×5 方塊字，每格 = 1 磚）
  var BIG = { C: '111,100,100,100,111', A: '010,101,111,101,101', T: '111,010,010,010,010', H: '101,101,111,101,101' };
  function bigWord(word, col, row) {
    for (var i = 0; i < word.length; i++) {
      var rows = BIG[word.charAt(i)].split(',');
      for (var y = 0; y < 5; y++) for (var x = 0; x < 3; x++) {
        if (rows[y].charAt(x) === '1') nes0.ppu.setTile(0, col + i * 4 + x, row + y, art.t('BLK'));
      }
    }
  }
  function frame(full) {
    var ppu = nes0.ppu, c, r;
    for (c = 0; c < 32; c++) ppu.setTile(0, c, 3, art.t('FR_T'));
    for (r = 4; r < (full ? 28 : 26); r++) { ppu.setTile(0, 0, r, art.t('FR_L')); ppu.setTile(0, 31, r, art.t('FR_R')); }
    ppu.setTile(0, 0, 3, art.t('FR_C')); ppu.setTile(0, 31, 3, art.t('FR_C'));
    // 框 + HUD 一律用平台那組（青）：平台貼牆時 16×16 屬性區塊不會把框染成別的顏色
    ppu.fillAttr(0, 0, 0, 16, 2, 1);

  }

      if (nes0.ppu.getTile(0, c, r) === 0) nes0.ppu.setTile(0, c, r, art.t(i % 3 === 0 ? 'D2' : (i % 3 === 1 ? 'D1' : 'D3')));

  }

  /* ---------------- 最高分 ---------------- */
  function bestOf(m) { return CT.load('catch', 'best_' + m, 0); }
  function saveBest() {
    if (!g) return;

    if (g.mode === 'title') return;

  }

  /* ---------------- 標題 ---------------- */

    catch: ['CATCH STARS. DODGE URCHINS', 'LEFT RIGHT MOVE   B DASH'],

      ppu.fillAttr(0, 1, 2, 14, 4, 3);           // 標題字黃色（左右框不吃這組）
      // §6-5 / §6-6：說明段落之間空一列
      text0(3, 25, 'START GO  C/* = CHEAT');   // P3-5：只有 START GO 會閃

  /* ================= 接星 ================= */
  function catchSpawn() {
    var lv = g.lv, r = rnd() % 100, type = 'STAR';

    else if (r < bad + 7) type = 'GOLD';
    else if (r < bad + 9 && g.lives < 5) type = 'HEART';
    else if (r < bad + 12 && lv >= 2) type = 'CLOCK';
    var x = 12 + (rnd() % 28) * 8;
    var zig = lv >= 3 && (rnd() % 100) < Math.min(50, lv * 7) ? ((rnd() & 1) ? 96 : -96) : 0;
    g.items.push({ type: type, x: x * Q, y: (CEIL - 8) * Q, vx: zig });
  }
  function fx(x, y, tile, pal, t) { g.fx.push({ x: x, y: y, tile: tile, pal: pal, t: t || 16 }); if (g.fx.length > 4) g.fx.shift(); }
  function loseLife(why) {
    g.lives--; g.miss = 0; g.combo = 0;

  }
  function updateCatch() {
    var I = NES.Input, sp = I.held(BTN.B) ? C_DASH : C_SPEED;
    if (g.dizzy > 0) g.dizzy--;

      if (I.held(BTN.RIGHT)) g.px += sp;
    }

    var bx = g.px >> 8, i;

      var hitBody = it.type === 'URCHIN' && cx >= bx + 2 && cx <= bx + 22 && y + 6 >= SURF - 2 && y < PY + 14;
      if (inBasket || hitBody) {

        else if (it.type === 'HEART') { g.lives = Math.min(5, g.lives + 1); g.score += 20; AU.sfx('catch_gold'); say('LIFE UP!', 60); }
        else if (it.type === 'CLOCK') { g.slow = 300; g.score += 20; AU.sfx('catch_gold'); say('SLOW TIME!', 60); }
        if (g.combo % 10 === 0) { g.score += 100 * g.lv; say('COMBO ' + g.combo + '  +' + (100 * g.lv), 60); }
        fx(x, SURF - 10, art.s('SPARK'), 1, 12);
        if (g.caught >= C_NEED(g.lv)) {
          g.lv++; g.caught = 0; AU.sfx('catch_level');
          say('LEVEL ' + g.lv + (g.lv >= 3 ? '  ZIGZAG!' : '  FASTER!'), 120);
        }
        continue;
      }

  /* ================= 彈跳 ================= */
  function tileCh(map, c, r) {

  var CH_TILE = { '=': 'PL_M', '^': 'SPRING', 'x': 'SPIKE', '~': 'CRUMB', '_': 'ICE', '*': 'GEM', 'c': 'CRACK' };

  function landable(ch) { return ch === '=' || ch === '^' || ch === '~' || ch === '_' || ch === 'c'; }
  function loadLevel(n) {
    g.level = n; g.cracked = {}; g.bt = 0; g.clearT = 0; g.deadT = 0;
    var L = CA.LEVELS[n], ppu = nes0.ppu;
    g.map = buildMap(L);
    CT.blank(nes0, function () {
      clearScreen(); setPals();

      deco();
      var r, c;
      for (r = 4; r < 28; r++) for (c = 1; c <= 30; c++) {
        if (g.map[r][c] !== '.') { ppu.setTile(0, c, r, chTile(g.map, c, r)); ppu.setAttr(0, c >> 1, r >> 1, 1); }
      }

  function spawnBall() {

  // 純物理一幀：b = {x,y,vx,vy}，mask = 按鍵，map / cracked 依關卡。回傳事件（不改 PPU；遊戲 / 解題器共用）

    });

  /* ---------------- 結束 / 續關 ---------------- */

  /* ---------------- 主迴圈 ---------------- */
  function updatePlay() {
    var I = NES.Input;

  }

  /* ---------------- 精靈 ---------------- */

          }

        }

    spr(x + 4, y, art.s('BOLO_' + k + '0'), 0); spr(x + 12, y, art.s('BOLO_' + k + '1'), 0);

  /* ================= 機器人 ================= */

<script>/* games/cart2/pop/song.js */
/*
 * games/cart2/pop/song.js — 《星塵泡泡》音樂 / 音效（全部原創旋律，只走 2A03）

 * 擁有者：C6-3 cart2-pop（R6）｜ 依賴：engine/music.js（R6 起有 pause / resume；沒有就退回 stop + from 小節）

 *

 * |------------|------------|-------|------|------|
 * | pop_title  | 泡泡華爾滋 | 6     | 8    | 標題 + 戳泡泡；D 大調 3/4 感（每小節 12 row 一句 + 4 row 呼吸），p1 圓滑旋律 / p2 三度和聲 / tri 根音 |
 * | pop_rush   | 槌子進行曲 | 5     | 8    | 氣球射擊 + 打地鼠；G 小調 → B♭ 大調，p1 斷奏 / p2 反拍 / noi 進行鼓 |
 * | pop_over   | 時間到     | 7     | 1    | 結算（不 loop） |

(function () {

  function mel(str, inst, vol, duty) {
    return fit(tok(str).map(function (t) {
      if (t === '-') return null;
      if (t === '=') return { note: '===' };

    lead: { vol: [12, 12, 11, 10, 9, 9, 8, 8, 7], volLoop: 8, duty: [2] },
    hop: { vol: [13, 10, 8, 6, 5, 4, 3, 2, 1, 0], duty: [1] },
    stab: { vol: [8, 6, 4, 2, 1, 0], duty: [2] },

    bass: {},
    kick: { vol: [15, 11, 7, 3, 0] },
    snare: { vol: [12, 10, 8, 6, 4, 2, 0] },
    hat: { vol: [5, 3, 1, 0] }
  };
  var MAJ = [0, 4, 7], MIN = [0, 3, 7];
  function song(name, speed, bars, loop) {
    var s = { name: name, speed: speed, rows: 16, loop: 0, instruments: INST, patterns: [], order: [], playLoop: loop };
    bars.forEach(function (b) { s.order.push(s.patterns.length); s.patterns.push(b); });

  }

  // ---- 泡泡華爾滋（D 大調；「浮起來 → 破掉」的上行 + 跳下動機，原創）----
  function buildTitle() {
    var M = [
      'D-5 -   E-5 -   F#5 -   A-5 -   -   -   D-6 -   -   -   -   -',
      'C#6 -   B-5 -   A-5 -   G-5 -   -   -   E-5 -   -   -   -   -',

  // ---- 槌子進行曲（G 小調；四分音符斷奏「咚 咚 咚 敲」，原創）----
  function buildRush() {
    var M = [
      'G-4 -   G-4 -   A#4 -   D-5 -   C-5 -   A#4 -   A-4 -   -   -',
      'G-4 -   G-4 -   A#4 -   D-5 -   F-5 -   -   -   D-5 -   -   -',
      'D#5 -   D#5 -   D-5 -   C-5 -   A#4 -   C-5 -   D-5 -   -   -',
      'C-5 -   A-4 -   F#4 -   A-4 -   G-4 -   -   -   =   -   -   -',
      'A#4 -   D-5 -   F-5 -   A#5 -   A-5 -   F-5 -   D-5 -   F-5 -',
      'G-5 -   F-5 -   D#5 -   D-5 -   C-5 -   D-5 -   D#5 -   -   -',
      'D-5 -   F#5 -   A-5 -   D-6 -   C-6 -   A-5 -   F#5 -   A-5 -',

               p2: offbeat(o.replace('-3', '-4').replace('#3', '#4').replace('-2', '-3').replace('#2', '#3'), i === 4 || i === 6 ? MAJ : MIN, 7),
               tri: mel(b + ' -   ' + o + ' -   ' + b + ' -   ' + o + ' -   ' + b + ' -   ' + o + ' -   ' + b + ' -   ' + o + ' -', 'bass', 15, 0),
               noi: drm('k - h - s - h - k - k - s - h s') };
    }), true);
  }
  function buildOver() {
    return song('時間到（pop_over）', 7, [{
      p1: mel('A-5 -   F#5 -   D-5 -   E-5 -   C#5 -   D-5 -   -   =   -', 'lead', 12, 2),
      p2: mel('F#4 -   D-4 -   A-3 -   G-3 -   E-3 -   F#3 -   -   =   -', 'echo', 9, 1),
      tri: mel('D-2 -   -   -   G-2 -   -   -   A-2 -   -   -   D-2 -   =   -', 'bass', 15, 0),

  function sq(list) {

  var SFX = {
    pop_pop: { priority: 3, data: { p2: sq([['G-6', 1, 10, 2], ['C-7', 2, 9]]), noi: nz([[1, 2, 7]]) } },

      case 'peek': p.lvl = 1; if (p.t >= 24) { p.ph = 'dip'; p.t = 0; } break;
      case 'dip': p.lvl = 0; if (p.t >= 14) { p.ph = 'rise'; p.t = 0; p.upT = Math.max(24, (p.upT * 0.6) | 0); } break;

  /* ---------------- 精靈 ---------------- */
  function drawSprites() {

    function quad(x, y, name, pal) { for (var q = 0; q < 4; q++) spr(x + (q & 1) * 8, y + (q >> 1) * 8, art.s(name + q), pal); }

            if (b.popT) { quad(x, y, 'BURST', pal); continue; }

  // 密技續關（§6-1）：GAME OVER / 倒下中 ⇒ 回同一關、保留分數與已斬數、心補滿

  /* ============================================================ 拋出物 */
  function pickType(S) {
    var tot = 0, k, r;

    for (i = 0; i < g.objs.length; i++) if (g.objs[i].k === 'BOMB' && g.objs[i].st === 'fly') bombs++;
    if (g.stage >= 2 && g.hearts < MAX_HEARTS && rnd() % 100 < 6) return 'CHARM';
    for (k in S.mix) tot += S.mix[k];
    for (;;) {
      r = rnd() % tot;
      for (k in S.mix) { if (r < S.mix[k]) break; r -= S.mix[k]; }
      if (k === 'BOMB' && bombs >= (S.salvo ? 2 : 1)) continue;

  function launch(k, x, apex, tx) {

    for (var i = 0; i < n && g.objs.length < S.alive; i++) {

  // 物件一幀（update 與機器人預測共用，純函式：輸入 {x,y,vx,vy,gr,k,wob,t} 輸出下一幀）

      o.hp--; o.vy = Math.min(o.vy, -900); o.vx = -o.vx;

  function updateObjs() {

  /* ============================================================ 主角 / 斬擊 */

  /* ============================================================ 魔王 */

      b.hitSw = swId; b.hp--; b.flash = 10;
      addScore(100 * Math.max(1, Math.min(10, ++g.combo))); g.comboT = COMBO_T;
      if (g.combo > g.maxCombo) g.maxCombo = g.combo;
      AU.sfx('slash_cut');
      fx(b.x + 12, b.y + 12, 'SPARK2', 12);
      if (b.hp <= 0) { b.st = 'die'; b.t = 0; addScore(5000); say('THE LANTERN BREAKS!', 120); AU.stop(); AU.sfx('slash_boom'); }
      else if (b.hp % 4 === 0) { b.st = 'rise'; b.t = 0; }      // 被斬幾刀就縮回去
    } else if (b.clangSw !== swId && overlap(hb, bodyBox(b))) {

  function updateBoss() {

    } else if (b.st === 'hover') {

  /* ============================================================ 效果 */
  function fx(x, y, tile, t) { if (g.fx.length < 8) g.fx.push({ x: x, y: y, tile: tile, t: t }); }

    for (var i = 0; i < g.objs.length; i++) if (g.objs[i].st === 'fly') { g.objs[i].st = g.objs[i].k === 'BOMB' ? 'boom' : 'cut'; g.objs[i].t = 0; }

  function updatePlay() {

  /* ============================================================ 繪製（逐線配額器） */
  var lineCnt = new Uint8Array(240), oamN = 0;
  function spr(x, y, tile, pal, o, cosmetic) {
    if (y >= 232 || y <= -8 || x <= -8 || x >= 256) return false;
    var y0 = Math.max(0, y), y1 = Math.min(239, y + 7), yy;
    if (oamN >= 62) { if (cosmetic) g.stat.dropFx++; else g.stat.dropMain++; return false; }
    for (yy = y0; yy <= y1; yy++) if (lineCnt[yy] >= 8) { if (cosmetic) g.stat.dropFx++; else g.stat.dropMain++; return false; }
    for (yy = y0; yy <= y1; yy++) lineCnt[yy]++;
    nes0.ppu.sprite(oamN++, { x: x & 255, y: y, tile: tile, pal: pal, flipH: !!(o && o.h), flipV: !!(o && o.v), behind: !!(o && o.b) });
    return true;
  }
  function quad(x, y, name, pal, fh, opt) {
    var q = art.q(name), b = opt && opt.b;
    if (fh) { spr(x, y, q[1], pal, { h: 1, b: b }); spr(x + 8, y, q[0], pal, { h: 1, b: b }); spr(x, y + 8, q[3], pal, { h: 1, b: b }); spr(x + 8, y + 8, q[2], pal, { h: 1, b: b }); }
    else { spr(x, y, q[0], pal, { b: b }); spr(x + 8, y, q[1], pal, { b: b }); spr(x, y + 8, q[2], pal, { b: b }); spr(x + 8, y + 8, q[3], pal, { b: b }); }
  }
  function ninjaFrame() {
    if (g.mode === 'down' || g.hurtT > 0) return 'NHURT';
    if (g.sw) return g.sw.type === 'H' ? 'NSLASH' : g.sw.type === 'U' ? 'NRISE' : 'NCLEAVE';
    if (!g.ground) return 'NJUMP';
    var I = NES.Input;
    if (g.mode === 'play' && (I.held(BTN.LEFT) || I.held(BTN.RIGHT))) return ((g.walkT >> 3) & 1) ? 'NRUN1' : 'NRUN2';
    return 'NSTAND';
  }
  function drawObj(o) {
    var x = o.x >> 8, y = o.y >> 8, pal = PAL_OF[o.k], name = TILE_OF[o.k], b = y >= 186;
    if (o.k === 'TALI') name = ((o.t >> 4) & 1) ? 'TALI1' : 'TALI0';
    if (o.k === 'SHELL' && o.hp === 1) name = 'CRACK';
    if (o.st === 'boom') { quad(x, y, 'BOOM', 3, (o.t >> 2) & 1); return; }
    if (o.st === 'cut') {
      var q = art.q(name), d = o.cut;
      spr(x - d, y, q[0], pal, { b: b }); spr(x + 8 + d, y - (d >> 1), q[1], pal, { b: b });
      spr(x - d, y + 8, q[2], pal, { b: b }); spr(x + 8 + d, y + 8 - (d >> 1), q[3], pal, { b: b });

  }
  function drawBoss(b) {
    if (!b) return;
    if (b.st === 'die' && (b.t & 4)) return;
    var mid = b.st === 'open' ? 'LO' : 'LS', ty, tx, name, pal;
    for (ty = 0; ty < 4; ty++) {
      var y = b.y + ty * 8;
      if (y < 0) continue;
      for (tx = 0; tx < 4; tx++) {
        if (ty === 0) name = 'LT0' + tx; else if (ty === 3) name = 'LB0' + tx; else name = mid + (ty - 1) + tx;
        pal = (b.flash & 2) ? 1 : (b.st === 'open' && ty >= 1 && ty <= 2 && tx >= 1 && tx <= 2 ? 2 : 3);

    }
  }
  function drawSprites() {
    lineCnt.fill(0); oamN = 0;
    var i, m = g.mode;
    if (m === 'title') {
      quad(40, 58, ((g.t >> 4) & 1) ? 'NSLASH' : 'NSTAND', 0, false);

  function pedal(n) { return n + ' -   -   -   ' + n + ' -   -   -   ' + n + ' -   -   -   ' + n + ' -   -   -'; }

      overlayMode: function () { return OV.mode; },
      overlayLastMode: function () { return OV.lastMode; },
      flashColor: flashColor, backTileOf: backTileOf,
      S: S,
      get SONG() { return menuSong(); }, get SFX() { return SFX; }, get GLYPH() { return glyphTable(); },
      get ICON() { return ICON; }, get CFG() { return cfg(); }
    }
  };
  CT.Shell = Shell;
})();

</script>

<script>
// ---- 啟動：桌機整數放大置中 / 手機小數倍貼齊、鍵盤焦點、F 全螢幕、觸控覆蓋層版面 ----
(function () {
  var W = 256, H = 224;                 // 顯示尺寸（PPU 內部 240 列，裁上下各 8）
  var canvas = document.getElementById('nes');
  var hint = document.getElementById('hint');
  var q = new URLSearchParams(location.search);
  var debug = q.get('debug') === '1';
  var forced = parseInt(q.get('scale') || '0', 10) || 0;   // ?scale=1 供截圖工具用（＝維持桌機整數倍行為）
  // 橫向手機：左右各留 110px 給觸控按鍵；平板（短邊 ≥ 500）各留 170px
  var RESERVE_PHONE = 220, RESERVE_TABLET = 340;

  // ---- safe-area 探針（讀 env(safe-area-inset-*) 的實際 px；不支援就全 0） ----
  var probe = null;
  function safeArea() {
    var z = { t: 0, r: 0, b: 0, l: 0 };
    try {
      if (!probe) {
        if (!document.body) return z;
        probe = document.createElement('div');
        probe.id = 'nes-safe-probe';
        probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;' +
          'padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);' +
          'padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);';
        document.body.appendChild(probe);
      }
      var cs = getComputedStyle(probe);
      z.t = parseFloat(cs.paddingTop) || 0; z.r = parseFloat(cs.paddingRight) || 0;
      z.b = parseFloat(cs.paddingBottom) || 0; z.l = parseFloat(cs.paddingLeft) || 0;
    } catch (e) { }
    return z;
  }
  function isTouch() {
    try { return (navigator.maxTouchPoints | 0) > 0 || ('ontouchstart' in window); } catch (e) { return false; }
  }
  function viewport() {
    var vv = window.visualViewport;
    return { w: (vv && vv.width) || window.innerWidth || 320, h: (vv && vv.height) || window.innerHeight || 480 };
  }

  // fit() → {s 顯示倍率（可小數）, back backing store 倍率（整數）, mobile, portrait, sa, vw, vh}
  function fit() {
    var v = viewport(), sa = safeArea();
    var vw = v.w, vh = v.h;
    var portrait = vh >= vw;
    var mobile = !forced && (isTouch() || Math.min(vw, vh) < 600);
    var full = Math.min(vw / W, vh / H);        // 完整塞進視窗的最大倍率
    var s;
    if (forced) {
      s = forced;                               // ?scale=N：完全照舊（截圖工具可重現）
    } else if (mobile) {
      if (portrait) {
        s = vw / W;                             // 直向：寬度填滿、貼上方（下面整片給按鍵）
        var maxH = Math.max(1, vh - sa.t);
        if (H * s > maxH) s = maxH / H;
      } else {
        // 橫向：高度填滿為主，左右各留出按鍵空間；留不出來（小視窗）就整個塞滿
        var reserve = (Math.min(vw, vh) >= 500 ? RESERVE_TABLET : RESERVE_PHONE) + sa.l + sa.r;
        var side = Math.min(vh / H, (vw - reserve) / W);
        s = (side > 0 && side >= full * 0.6) ? side : full;
      }
    } else {
      s = Math.max(1, Math.floor(full));        // 桌機：維持整數倍
    }
    s = Math.max(0.5, s);
    // backing store 一律整數（nes.setScale 只改 backing store 且只收整數，QA R1 P2-1）；
    // 小數倍時 backing 取 ceil（畫得比顯示大一點），再用 CSS 縮到目標尺寸 + pixelated。
    var back = forced ? forced : Math.max(1, Math.min(4, Math.ceil(s - 0.0001)));
    return { s: s, back: back, mobile: mobile, portrait: portrait, sa: sa, vw: vw, vh: vh };
  }

  function place(f) {
    var cw = W * f.s, ch = H * f.s;
    if (f.mobile) { cw = Math.round(cw * 2) / 2; ch = Math.round(ch * 2) / 2; }
    else { cw = Math.round(cw); ch = Math.round(ch); }
    var x = (f.vw - cw) / 2, y = (f.vh - ch) / 2;
    if (f.mobile && f.portrait) y = f.sa.t;                 // 直向貼上方
    if (f.mobile) { x = Math.round(x * 2) / 2; y = Math.round(y * 2) / 2; }
    else { x = Math.floor(x); y = Math.floor(y); }
    canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
    canvas.style.left = x + 'px'; canvas.style.top = y + 'px';
    // 觸控覆蓋層（engine/touch.js）靠這份版面資訊排版
    window.NES_LAYOUT = {
      x: x, y: y, w: cw, h: ch, scale: f.s, back: f.back,
      portrait: f.portrait, mobile: f.mobile, safe: f.sa, vw: f.vw, vh: f.vh
    };
    try { window.dispatchEvent(new Event('nes-resize')); } catch (e) { }
  }

  if (!window.NES || typeof NES.boot !== 'function') {
    hint.style.display = 'block';
    hint.textContent = 'engine/nes.js 未載入';
    return;
  }

  var f = fit();
  var game = window.GAME || NES.game || null;
  var nes = NES.boot({ canvas: canvas, game: game, scale: f.back });
  place(f);

  function apply() {
    var g = fit();
    if (g.back !== nes.scale) nes.setScale(g.back);
    place(g);
  }
  function applySoon() { apply(); setTimeout(apply, 120); }   // iOS 旋轉 / 工具列收合後尺寸會延遲 ⇒ 二次觸發
  window.addEventListener('resize', apply);
  window.addEventListener('orientationchange', applySoon);
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', applySoon);
  }
  // 切到背景 / 鎖螢幕：一定要把按鍵放掉，不然回來會卡住一個方向
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) return;
    try { if (NES.Touch && NES.Touch.releaseAll) NES.Touch.releaseAll(); } catch (e) { }
    try { if (NES.Input && NES.Input.inject) NES.Input.inject(0, 0); } catch (e) { }
  });

  // 鍵盤焦點：canvas 可聚焦，點畫面或載入完成都聚焦；方向鍵 / 空白鍵不捲頁
  function focus() { try { canvas.focus({ preventScroll: true }); } catch (e) { canvas.focus(); } }
  focus();
  window.addEventListener('pointerdown', focus);
  window.addEventListener('keydown', function (e) {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].indexOf(e.code) >= 0) e.preventDefault();
    // F = 全螢幕切換（不佔用遊戲按鍵；瀏覽器拒絕時安靜失敗）
    if (e.code === 'KeyF' && !e.ctrlKey && !e.altKey && !e.metaKey) {
      e.preventDefault();
      try {
        if (!document.fullscreenElement) {
          var p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
          if (p && p.catch) p.catch(function () { });
        } else {
          var q2 = document.exitFullscreen && document.exitFullscreen();
          if (q2 && q2.catch) q2.catch(function () { });
        }
      } catch (err) { }
    }
  });
  document.addEventListener('fullscreenchange', function () { setTimeout(apply, 60); });

  // ?touch=1 / ?touch=0：強制顯示 / 隱藏觸控按鍵（桌機截圖與測試用）
  try {
    var tq = q.get('touch');
    if (tq === '1' && NES.Touch && NES.Touch.show) NES.Touch.show();
    else if (tq === '0' && NES.Touch && NES.Touch.hide) NES.Touch.hide();
  } catch (e) { }

  // 缺模組 / debug 時在底部列出狀態（正式遊玩畫面不顯示）
  if (debug || (nes.missing && nes.missing.length)) {
    hint.style.display = 'block';
    hint.textContent = 'NES ' + NES.VERSION + ' scale=' + nes.scale
      + (nes.missing && nes.missing.length ? '  缺: ' + nes.missing.join(' ') : '  模組齊全')
      + (game ? '' : '  (無 game，空畫面)')
      + (debug ? '  __nes 可用' : '');
  }
  window.nes = nes;
})();
</script>
