      y = ceilH[col] * 8 + 2;
    } else {
      if (floorH[col] < 1) return null;
      y = (ROWS - floorH[col]) * 8 - 14;
    }
    return CR.Enemies.spawn('turret', col * 8 - stage.camX, y, { wx: col * 8, ceiling: !!ceiling });
  }

  /* ============================================================ 魔王背景寫入 */
  function bgWrite(col, row, name) {
    if (col < 0 || col >= SCREEN_COLS + 2 || row < 0 || row >= ROWS) return;
    var wc = (stage.camX >> 3) + col, ntc = wc & 63;
    ppu0.setTile((ntc >> 5) & 1, ntc & 31, row, TILE[K[name]]);
  }
  function bgRestore(col, row) {
    if (col < 0 || col >= SCREEN_COLS + 2 || row < 0 || row >= ROWS) return;
    var wc = (stage.camX >> 3) + col, ntc = wc & 63;
    ppu0.setTile((ntc >> 5) & 1, ntc & 31, row, tileAt(wc, row));
  }

  /* ============================================================ init */
  function mergeObj(dst) {
    for (var a = 1; a < arguments.length; a++) {
      var src = arguments[a];
      if (!src) continue;
      for (var k in src) if (src.hasOwnProperty(k)) dst[k] = src[k];
    }
    return dst;
  }

  function resolveTiles() {
    var i;
    TILE = new Uint8Array(KIND_NAMES.length);
    for (i = 0; i < KIND_NAMES.length; i++) {
      var n = bankNameOf(i);
      if (!bgBank.has(n)) throw new Error('背景 bank 缺磚 ' + n + '（chr_world.js / main.js 的合併？）');
      TILE[i] = bgBank.index(n);
    }
    var q = CR.CHR_WORLD.quad;
    function pick(list) {
      for (var j = 0; j < list.length; j++) if (sprBank.has(list[j])) return sprBank.index(list[j]);
      throw new Error('精靈 bank 缺磚 ' + list.join(' / '));
    }
    S = {
      BEE0: pick(['W_BEE0']), BEE1: pick(['W_BEE1']),
      SHOT0: pick(['W_SHOT0']), SHOT1: pick(['W_SHOT1']),
      TUR0: q(sprBank, 'W_TUR0'), TUR1: q(sprBank, 'W_TUR1'),
      ZIG0: q(sprBank, 'W_ZIG0'), ZIG1: q(sprBank, 'W_ZIG1'),
      TANK0: q(sprBank, 'W_TANK0'), TANK1: q(sprBank, 'W_TANK1'),
      MROCK0: pick(['W_MROCK0']), MROCK1: pick(['W_MROCK1']),   // fix3：可破壞小隕石
      PLATE: q(sprBank, 'W_PLATE'), PLATEX: q(sprBank, 'W_PLATEX'),
      CORE0: q(sprBank, 'W_CORE0'), CORE1: q(sprBank, 'W_CORE1'),
      MUZZ0: pick(['W_MUZZ0']), MUZZ1: pick(['W_MUZZ1']),
      CAP0: pick(['S_CAP0', 'W_CAP0']), CAP1: pick(['S_CAP1', 'W_CAP1']),
      // 爆炸優先用 ship 的 S_EXPL（契約），缺席才退回自帶的 W_EXPL
      EXPL: [pick(['S_EXPL0', 'W_EXPL0']), pick(['S_EXPL1', 'W_EXPL1']),
        pick(['S_EXPL2', 'W_EXPL2']), pick(['S_EXPL3', 'W_EXPL3'])]
    };
  }

  function makeCtx() {
    return {
      stage: stage, ppu: ppu0, S: S,
      allocEnemy: allocEnemy, allocPart: allocPart, freeEnemy: freeEnemy,
      fire: fire, bigBullet: bigBullet, freeBullet: freeBullet,
      boom: boom, dropCapsule: dropCapsule, addScore: addScore,
      ship: shipRef, shipVel: shipVel,
      bgWrite: bgWrite, bgRestore: bgRestore,
      onCleared: function () { stage.cleared = true; stage.bossActive = false; }
    };
  }

  function queryJump() {
    var q;
    try { q = new URLSearchParams(window.location.search); } catch (e) { return; }
    var camx = parseInt(q.get('camx') || '', 10);
    var bs = parseInt(q.get('boss') || '', 10);
    if (!isNaN(camx)) pendingJump = camx;
    if (!isNaN(bs) && bs >= 1) { pendingJump = CAM_MAX; pendingBoss = bs; }
  }

  function initStage(ppu) {
    ppu0 = ppu;
    // 跨檔約定（ship）：遊戲區 = 名稱表列 0..CR.PLAY_ROWS-1，列 26..29 是 HUD
    if (CR.PLAY_ROWS && CR.PLAY_ROWS !== ROWS) {
      throw new Error('CR.PLAY_ROWS(' + CR.PLAY_ROWS + ') 與 stage 的遊戲區列數(' + ROWS + ') 不一致');
    }
    sprBank = NES.CHR.getBank('cr_spr');
    bgBank = NES.CHR.getBank('cr_bg');
    if (!sprBank) {              // main.js（ship agent）缺席時的保底：自己建 bank
      sprBank = NES.CHR.bank('cr_spr', mergeObj({}, CR.SPR_SHIP, CR.SPR_WORLD));
      NES.CHR.setPattern(1, sprBank);
    }
    if (!bgBank) {
      bgBank = NES.CHR.bank('cr_bg', mergeObj({}, CR.BG_SHIP || CR.BG_HUD, CR.BG_WORLD));
      NES.CHR.setPattern(0, bgBank);
    }
    resolveTiles();
    CR.CHR_WORLD.applyPalettes(ppu, !CR.SPR_SHIP);
    ppu.flickerStep = 0;          // NES.SH.OAM 自己做軟體 sprite cycling（§15.8-1）

    build();

    enemies = SH.Pool(POOL_ENEMY, function (i) { return CR.Enemies.make(i); });
    bullets = SH.Pool(POOL_BULLET, function (i) {
      return { i: i, x: 0, y: 0, w: 4, h: 4, vx: 0, vy: 0, t: 0, big: false, bg: false, xs: FX.Vec(0), ys: FX.Vec(0) };
    });
    capsules = SH.Pool(POOL_CAP, function (i) {
      return { i: i, x: 0, y: 0, w: 8, h: 8, blue: false, seq: 0, t: 0, xs: FX.Vec(0) };
    });
    booms = SH.Pool(POOL_BOOM, function (i) { return { i: i, x: 0, y: 0, t: 0 }; });
    stage.enemies = enemies; stage.bullets = bullets;
    stage.capsules = capsules; stage.explosions = booms;

    var c = makeCtx();
    CR.Enemies.init(c);
    CR.Boss.init(c);

    table = CR.Enemies.buildTable(stage);
    spawner = SH.Spawner(table);
    scroller = SH.Scroller(ppu, {
      nt: 2, cols: COLS, row0: 0, rows: ROWS,     // 列 26..29 是 HUD，絕不寫
      tileAt: tileAt, attrAt: attrAt
    });

    queryJump();
    restart(0);
    return stage;
  }

  /* ============================================================ restart / checkpoint */
  function checkpoint(camX) {
    var best = CHECKPOINTS[0], i;
    for (i = 0; i < CHECKPOINTS.length; i++) if (CHECKPOINTS[i] <= camX) best = CHECKPOINTS[i];
    return best;
  }

  // 相機瞬移 = Pool.freeAll + Scroller.reset + Spawner.seek（NES.SH §15.8-5）
  function restart(camX) {
    camX = SH.clamp(camX | 0, 0, CAM_MAX);
    CR.Boss.despawn();
    enemies.freeAll(); bullets.freeAll(); capsules.freeAll(); booms.freeAll();
    CR.Enemies.reset();
    stage.bossActive = false;
    stage.cleared = false;
    stage.pendingScore = 0;
    stage.camX = camX;
    FX.vsetPx(camVec, camX);
    muteBudget(ppu0, function () { scroller.reset(camX); });
    spawner.seek(camX >> 3);
    return stage;
  }

  /* ============================================================ clearScreen（藍膠囊） */
  function clearScreen() {
    var n = { bullets: 0, enemies: 0, score: 0 }, i, it;
    it = bullets.items;
    for (i = 0; i < it.length; i++) if (it[i].alive) { freeBullet(it[i]); n.bullets++; }
    it = enemies.items;
    for (i = 0; i < it.length; i++) {
      var e = it[i];
      if (e.alive && e.small && !e.boss) { n.score += e.score; e.kill(); n.enemies++; }
    }
    return n;
  }

  /* ============================================================ solidAt */
  // **座標是畫面座標**（x 0..255、y 0..207），與 CR 的其他碰撞框一致
  // （main.js 直接把船的畫面矩形四角丟進來）；世界座標版另有 solidAtWorld()。
  function solidAtWorld(wx, y) {
    if (y < 0 || y >= GAME_H) return true;                  // 遊戲區上下邊界 = 牆
    var c = wx >> 3, r = y >> 3;
    if (c < 0 || c >= COLS) return true;
    return isSolidKind(map[r * COLS + c]);
  }
  function solidAt(x, y) { return solidAtWorld((stage.camX + (x | 0)) | 0, y | 0); }

  /* ============================================================ spawnTest */
  function spawnTest(kind, x, y) {
    x = x | 0; y = y | 0;
    switch (kind) {
      case 'fan': return CR.Enemies.spawnFan(x, y);
      case 'turret': return CR.Enemies.spawn('turret', x, y, { wx: stage.camX + x });
      case 'turret_ceil': return CR.Enemies.spawn('turret', x, y, { wx: stage.camX + x, ceiling: true });
      case 'zig': return CR.Enemies.spawn('zig', x, y, {});
      case 'tank': return CR.Enemies.spawn('tank', x, y, {});
      case 'rock': return CR.Enemies.spawn('rock', x, y, {});
      case 'bullet': return fire(x, y, -CR.Enemies.bulletSpeed(), 0);
      case 'capsule': return dropCapsule(x, y, false);
      case 'capsule_blue': return dropCapsule(x, y, true);
      case 'boom': return boom(x, y);
      case 'boss': stage.bossActive = true; return CR.Boss.spawn();
      default: throw new Error('CR.stage.spawnTest：未知種類 ' + kind);
    }
  }

  /* ============================================================ update */
  function stepShipVel() {
    var sh = CR.ship;
    if (!sh) { shipV.vx = 0; shipV.vy = 0; shipPrev.has = false; return; }
    if (shipPrev.has) { shipV.vx = (sh.x - shipPrev.x) * 16; shipV.vy = (sh.y - shipPrev.y) * 16; }
    shipPrev.x = sh.x; shipPrev.y = sh.y; shipPrev.has = true;
  }

  function stepBullet(b) {
    if (b.big) { b.t++; return; }                           // 雷射：位置固定，生死由 boss 管
    FX.vadd(b.xs, b.vx); FX.vadd(b.ys, b.vy);
    b.x = FX.vpx(b.xs); b.y = FX.vpx(b.ys);
    b.t++;
    if (b.x < -8 || b.x > 264 || b.y < -8 || b.y > GAME_H + 8) b.alive = false;
  }
  function stepCapsule(c) {
    FX.vadd(c.xs, CAP_VX);
    c.x = FX.vpx(c.xs);
    c.t++;                                                   // 無壽命：只有飛出畫面才回收
    if (c.x < -8) c.alive = false;
  }
  function stepBoom(e) { e.t++; if (e.t >= BOOM_FRAMES * 4) e.alive = false; }

  function update(g) {
    frames++; updates++;

    // ?camx= / ?boss= 除錯跳關（等 main 走完 title → play 的初始化再套用）
    if (pendingJump !== null && updates >= 2) {
      var j = pendingJump, bs = pendingBoss;
      pendingJump = null; pendingBoss = 0;
      restart(j);
      if (bs >= 1) { stage.bossActive = true; CR.Boss.spawn(); CR.Boss.force(bs); }
    }

    stepShipVel();

    // ── 相機（魔王區停止捲動）
    if (!stage.bossActive && !stage.cleared && stage.camX < CAM_MAX) {
      FX.vadd(camVec, stage.speed);
      stage.camX = FX.vpx(camVec);
      if (stage.camX >= CAM_MAX) { stage.camX = CAM_MAX; FX.vsetPx(camVec, CAM_MAX); }
    }
    scroller.update(stage.camX);
    spawner.update(stage.camX >> 3, stage);

    enemies.each(CR.Enemies.step);
    bullets.each(stepBullet);
    capsules.each(stepCapsule);
    booms.each(stepBoom);

    if (!stage.bossActive && !stage.cleared && stage.camX >= CAM_MAX) {
      stage.bossActive = true;
      CR.Boss.spawn();
    }
    if (stage.bossActive) {
      CR.Boss.update();
      if (!CR.Boss.active()) stage.bossActive = false;
    }
    return stage;
  }

  /* ============================================================ draw */
  function draw(oam) {
    if (!oam) return;
    var f = frames, put = CR.Enemies.put;

    booms.each(function (e) {                                // 爆炸 prio 4
      var fr = (e.t / BOOM_FRAMES) | 0;
      put(oam, e.x, e.y, S.EXPL[fr > 3 ? 3 : fr], PAL_BOOM, false, PRIO_BOOM);
    });
    enemies.each(function (e) { CR.Enemies.draw(e, oam, f); });   // 敵 / 魔王部位 prio 3
    if (stage.bossActive) CR.Boss.draw(oam, f);
    bullets.each(function (b) {                              // 敵彈 prio 2
      if (b.bg) return;
      var bf = (f >> 2) & 1;
      put(oam, b.x - 2, b.y - 2, bf ? S.SHOT1 : S.SHOT0, bf ? PAL_EBULLET_ALT : PAL_EBULLET, false, PRIO_EBULLET);
    });
    capsules.each(function (c) {                             // 膠囊 prio 2（紅 = 組 2、藍 = 組 3）
      put(oam, c.x, c.y, ((c.t >> 3) & 1) ? S.CAP1 : S.CAP0, c.blue ? PAL_CAP_BLUE : PAL_CAP_RED, false, PRIO_CAP);
    });
  }

  /* ============================================================ 匯出 */
  stage.init = initStage;
  stage.update = update;
  stage.draw = draw;
  stage.checkpoint = checkpoint;
  stage.restart = restart;
  // fix3（暫停 / SECRET 文字用）：只重畫兩張名稱表，**不動物件池、不重置出怪指標**。
  // 與 restart 一樣屬於「關閉 rendering 重建畫面」，所以把 budget mute 起來。
  stage.redraw = function () {
    muteBudget(ppu0, function () { scroller.reset(stage.camX); });
    return stage;
  };
  stage.solidAt = solidAt;
  stage.solidAtWorld = solidAtWorld;
  stage.clearScreen = clearScreen;
  stage.spawnTest = spawnTest;
  stage.spawnTurretAt = spawnTurretAt;
  stage.tileAt = tileAt;
  stage.attrAt = attrAt;
  stage.kindAt = kindAt;
  stage.tileIndex = function (name) { return TILE[K[name]]; };
  stage.ceilAt = function (c) { return ceilH[c] | 0; };
  stage.floorAt = function (c) { return floorH[c] | 0; };
  stage.takeScore = function () { var s = stage.pendingScore; stage.pendingScore = 0; return s; };
  stage.aliveEnemies = aliveSmall;
  stage.aliveBullets = function () { return bullets.count; };
  stage.aliveCapsules = function () { return capsules.count; };
  stage.capsuleSeq = function () { return capsuleSeq; };
  stage.mkOam = function (ppu, opt) { return SH.OAM(ppu, opt); };
  stage.scroller = function () { return scroller; };
  stage.spawner = function () { return spawner; };
  stage.spawnTable = function () { return table; };
  stage.frames = function () { return frames; };
  stage.scrollX = function () { return stage.camX % 512; };
  stage.info = function () {
    return {
      camX: stage.camX, camCol: stage.camX >> 3, speed: stage.speed,
      enemies: aliveSmall(), bullets: bullets.count, capsules: capsules.count,
      booms: booms.count, capsuleSeq: capsuleSeq,
      bossActive: stage.bossActive, cleared: stage.cleared,
      boss: CR.Boss.state(), events: spawner ? spawner.index : 0,
      score: stage.pendingScore, scrollBytes: scroller ? scroller.bytes : 0,
      rank: CR.Enemies.rank()
    };
  };

  CR.stage = stage;
})();

</script>
<script>/* games/cruiser/main.js */
/*
 * games/cruiser/main.js — 《星塵巡航艦》主程式（window.GAME）
 * ---------------------------------------------------------------------------
 * 擁有者：ship agent ｜ 依賴：engine/*、games/cruiser/{chr_ship,ship}.js
 *                     選用（缺席也能跑）：chr_world.js / enemies.js / boss.js / stage1.js（CR.stage）、
 *                                         song.js（CR.Audio）、engine/shmup.js（NES.SH）
 * 契約：docs/TASKS.md「R2 → games/cruiser（ship agent）→ main.js」
 *
 * ── 畫面配置 ──────────────────────────────────────────────────────────────
 *   遊戲區 = 掃描線 0..207（可見 8..207）；HUD = 掃描線 208..239（可見 208..231 = 名稱表列 26..28）
 *   作法：遊戲區用 `ppu.scroll(camX, 0)`（由 CR.stage 的 Scroller 設定），
 *         `ppu.split(208, { x: 0, y: 208, nt: 0 })` 把下半段釘死在名稱表 0 的列 26 起、x 不捲動。
 *         engine/ppu.js 的 split 是「scanline 起改用另一組捲動值」，因此**下方固定 HUD 可行**
 *         （不需要改成上方 HUD）。
 *   ⇒ **跨檔需求（stage）**：名稱表捲動串流只能寫列 0..25（`CR.PLAY_ROWS = 26`），
 *     列 26..29 是 HUD 的地盤；屬性列 16 的 row16 13 / 14 也請留給 HUD（本檔在 init 設成調色盤 0）。
 *
 *   HUD（名稱表 0）：
 *     列 26  `1P <7 位分數>  HI <7 位紀錄>            <船圖示> x <剩餘數>`
 *     列 27  能量表標籤 6 格 × 5 欄：SPEED MISSL DOUBL LASER OPTON  ?
 *     列 28  能量表格框 6 格 × 5 欄（未選 = 灰空框、選中 = 白框填滿）
 *   每幀只重寫「有變的格」⇒ 最壞情況 25 byte，遠低於 VBlank 160 byte 預算。
 *
 * ── 每幀順序（契約）──────────────────────────────────────────────────────
 *   update: 讀輸入 → 船 / 選項 / 自機彈 → CR.stage.update(g) → 碰撞（自機彈×敵 / 敵・敵彈・地形×船）
 *           → 撿膠囊 → HUD → CR.Audio.tick()
 *   draw  : split → OAM begin → 船(prio0) / 選項(0) / 自機彈(1) → CR.stage.draw(oam)（敵彈 2 / 敵 3）
 *           → 爆炸・碎片(4) → OAM end（依 prio 排序 + 同 prio 每幀輪替起點 = 軟體 sprite cycling）
 *
 * ── 跨模組防禦 ───────────────────────────────────────────────────────────
 *   engine/shmup.js（NES.SH）尚未實作時，本檔用 `CR._fallback`（aabb / OAM / Pool 的最小版）頂替，
 *   總控整合時只要 NES.SH 到位就會自動改用 NES.SH（見 resolveSH()）。CR.stage / CR.Audio 全部
 *   以 `x && x.f && x.f()` 形式呼叫，缺席不致命。
 */
(function () {
  'use strict';
  var NES = window.NES = window.NES || {};
  var CR = window.CR = window.CR || {};
  var FX = NES.FX;
  var BTN = (NES.Input && NES.Input.BTN) || { A: 1, B: 2, SELECT: 4, START: 8, UP: 16, DOWN: 32, LEFT: 64, RIGHT: 128 };

  /* ===================================================== 版面常數（公開） */
  var PLAY_ROWS = 26;                       // 名稱表列 0..25 = 遊戲區（stage 只能寫這裡）
  var HUD_ROW = 26;                         // HUD 從名稱表列 26 起
  var SPLIT_LINE = 208;                     // 掃描線 208 起 = HUD
  var GAUGE_COL = [1, 6, 11, 16, 21, 26];   // 6 格能量表，每格 5 欄
  var GAUGE_W = 5;
  CR.PLAY_ROWS = PLAY_ROWS;
  CR.PLAY_H = SPLIT_LINE;                   // 遊戲區高度（線）
  CR.HUD_ROW = HUD_ROW;
  CR.SPLIT_LINE = SPLIT_LINE;

  /* ============================================ NES.SH 缺席時的最小替代品 */
  function fbAabb(a, b) {
    return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
  }

  // 每幀精靈配置：prio 0 最高；同 prio 之間每幀輪替起點（軟體 sprite cycling）
  function fbOAM(ppu, opt) {
    var reserve = (opt && opt.reserve) | 0;
    var items = [], rot = 0;
    var buckets = [[], [], [], [], [], [], [], []];
    var o = {
      dropped: 0, used: 0,
      begin: function () { items.length = 0; o.dropped = 0; o.used = 0; },
      add: function (s) {
        if (!s) return;
        var x = s.x | 0, y = s.y | 0;
        if (y >= 240 || y <= -8 || x <= -8 || x >= 256) return;   // 畫面外直接略過
        items.push(s);
      },
      end: function () {
        var i, b;
        for (i = 0; i < 8; i++) buckets[i].length = 0;
        for (i = 0; i < items.length; i++) {
          var p = items[i].prio | 0;
          if (p < 0) p = 0; else if (p > 7) p = 7;
          buckets[p].push(items[i]);
        }
        var slot = reserve;
        for (b = 0; b < 8; b++) {
          var arr = buckets[b], n = arr.length;
          if (!n) continue;
          var st = rot % n;
          for (i = 0; i < n; i++) {
            if (slot > 63) { o.dropped++; continue; }
            var it = arr[(i + st) % n];
            ppu.sprite(slot++, {
              x: it.x | 0, y: it.y | 0, tile: it.tile | 0, pal: it.pal | 0,
              flipH: !!it.flipH, flipV: !!it.flipV, behind: !!it.behind
            });
          }
        }
        o.used = slot;
        for (; slot < 64; slot++) ppu.sprite(slot, null);
        rot = (rot + 1) & 0xFFFF;
        return o.used;
      },
      rot: function () { return rot; }
    };
    return o;
  }

  function fbPool(n, factory) {
    var items = [], i;
    for (i = 0; i < n; i++) { var o = factory(i); o.alive = false; items.push(o); }
    return {
      items: items, count: 0,
      alloc: function () {
        for (var j = 0; j < items.length; j++) if (!items[j].alive) { items[j].alive = true; return items[j]; }
        return null;
      },
      free: function (o) { o.alive = false; },
      each: function (fn) { for (var j = 0; j < items.length; j++) if (items[j].alive) fn(items[j], j); }
    };
  }

  CR._fallback = { aabb: fbAabb, OAM: fbOAM, Pool: fbPool };

  var SH = null;                       // 實際採用的實作（NES.SH 優先）
  function resolveSH() {
    var sh = NES.SH;
    SH = {
      aabb: (sh && typeof sh.aabb === 'function') ? sh.aabb : fbAabb,
      OAM: (sh && typeof sh.OAM === 'function') ? sh.OAM : fbOAM,
      Pool: (sh && typeof sh.Pool === 'function') ? sh.Pool : fbPool,
      usingEngine: !!(sh && typeof sh.OAM === 'function')

      g.kills++;
      // stage 自己記分 + 自己畫爆炸（`CR.stage.takeScore()` 在場即代表）⇒ 這裡不要重複加
      if (!stageScores()) {
        g.ship.addScore(e.score || 100);
        if (e.fx !== false) CR.Fx.boom((e.x | 0) + ((e.w || 16) >> 1), (e.y | 0) + ((e.h || 16) >> 1));
      }
    }
  }

  function stageScores() { var s2 = st(); return !!(s2 && typeof s2.takeScore === 'function'); }
  function drainScore() {
    var s2 = st();
    if (!s2 || typeof s2.takeScore !== 'function') return;
    var pts = s2.takeScore() | 0;
    if (pts) g.ship.addScore(pts);
  }

  function collide() {
    var s2 = st(), ship = g.ship, i;
    // ① 自機彈 × 敵 / 魔王
    for (i = 0; i < ship.shots.length; i++) {
      var t = ship.shots[i];
      if (!t.alive) continue;
      var box = { x: t.x, y: t.y, w: t.w, h: t.h };
      if (s2) {
        eachOf(s2.enemies, function (e) {
          if (!t.alive || !e.alive) return;
          if (SH.aabb(box, enemyBox(e))) hitEnemy(e, t);
        });
        var boss = s2.boss;
        if (t.alive && boss && boss.alive && SH.aabb(box, enemyBox(boss))) hitEnemy(boss, t);
      }
    }
    if (!ship.alive) return;
    var sb = ship.rect();
    // ② 敵 / 敵彈 / 地形 × 船
    if (s2) {
      eachOf(s2.enemies, function (e) {
        if (ship.alive && e.alive && SH.aabb(sb, enemyBox(e))) { if (ship.hit()) g.hits++; }
      });
      eachOf(s2.bullets, function (b2) {
        if (ship.alive && b2.alive && SH.aabb(sb, { x: b2.x | 0, y: b2.y | 0, w: (b2.w || 4) | 0, h: (b2.h || 4) | 0 })) {
          if (ship.hit()) g.hits++;
        }
      });
      if (ship.alive && s2.boss && s2.boss.alive && SH.aabb(sb, enemyBox(s2.boss))) { if (ship.hit()) g.hits++; }
      if (ship.alive && typeof s2.solidAt === 'function') {
        if (s2.solidAt(sb.x, sb.y) || s2.solidAt(sb.x + sb.w - 1, sb.y) ||
          s2.solidAt(sb.x, sb.y + sb.h - 1) || s2.solidAt(sb.x + sb.w - 1, sb.y + sb.h - 1)) {
          if (ship.hit(true)) g.hits++;             // [源] 護盾不擋地形，撞到必死
        }
      }
      // ③ 撿膠囊
      eachOf(s2.capsules, function (c) {
        if (!ship.alive || !c.alive) return;
        if (!SH.aabb(sb, { x: c.x | 0, y: c.y | 0, w: (c.w || 8) | 0, h: (c.h || 8) | 0 })) return;
        c.alive = false;
        if (typeof c.take === 'function') c.take();
        // stage 沒指定顏色 ⇒ 交給 ship 計數（[源] 每第 16 顆 = 清屏膠囊）
        var blue = (c.blue !== undefined) ? !!c.blue : (c.kind === 'blue' ? true : undefined);
        ship.capsule(blue);
      });
    }
  }

  /* ---------------------------------------------------------- 死亡處理 */
  function respawn() {
    var ship = g.ship;
    ship.lives--;
    if (ship.lives <= 0) {
      ship.lives = 0; ship.reset(true); ship.alive = false;
      // fix3：GAME OVER 的 Konami 續關要「回到剛才的關卡位置」⇒ 先把檢查點記下來
      var s0 = st(), cc = 0;
      if (s0) {
        cc = call(s0, 'checkpoint', camX());
        if (typeof cc !== 'number') cc = ship.checkpointOf(camX());
        if (s0.bossActive && typeof s0.BOSS_RESPAWN === 'number' && s0.BOSS_RESPAWN > cc) cc = s0.BOSS_RESPAWN;
      }
      g.continueCam = cc | 0;
      toGameOver();
      return;
    }
    var s2 = st();
    var cp = 0;
    var wasBoss = !!(s2 && s2.bossActive);
    if (s2) {
      cp = call(s2, 'checkpoint', camX());
      if (typeof cp !== 'number') cp = g.ship.checkpointOf(camX());   // [源] 每 512 px 一個檢查點
      // QA P3-2：死在魔王戰時，一般檢查點（2560）要空捲 440 幀（7.4 秒）才會再遇到魔王
      //          ⇒ 改用 stage 的魔王復活點（2760 ⇒ 112 幀 ≈ 1.9 秒）
      if (wasBoss && typeof s2.BOSS_RESPAWN === 'number' && s2.BOSS_RESPAWN > cp) cp = s2.BOSS_RESPAWN;
      muteBudget(true);
      call(s2, 'restart', cp);
      muteBudget(false);
    }
    ship.reset(true);                        // 失去全部強化
    ship.invul = CR.Ship.INVUL_FRAMES;       // 復活無敵 90 幀（閃爍）
    g.bossOn = false;                        // restart 會把魔王收掉 ⇒ 重新進場時再播 boss 曲
    // QA P1-3：`die` 音效會停掉音樂（song.js 的設計），復活後要自己重播
    if (CR.Audio && CR.Audio.play) {
      call(CR.Audio, 'play', (st() && st().bossActive) ? 'boss' : 'stage1');
    }
  }

  /* ================================================================ draw */
  function drawShip(oam) {
    var s2 = g.ship;
    if (g.mode === 'title' || g.mode === 'gameover') return;   // 標題 / GAME OVER 畫面不畫船
    if (!s2.alive) return;
    if (s2.blink()) return;                  // 無敵閃爍
    var a = s2.anim;
    oam.add({ x: s2.sx, y: s2.sy, tile: a ? T.S_SHIP_L1 : T.S_SHIP_L0, pal: 0, prio: 0 });
    oam.add({ x: s2.sx + 8, y: s2.sy, tile: a ? T.S_SHIP_R1 : T.S_SHIP_R0, pal: 0, prio: 0 });
    if (s2.power.shield > 0) {
      var sh = a ? T.S_SHIELD1 : T.S_SHIELD0;
      oam.add({ x: s2.sx + 15, y: s2.sy - 5, tile: sh, pal: 0, prio: 0 });
      oam.add({ x: s2.sx + 15, y: s2.sy + 5, tile: sh, pal: 0, prio: 0 });
    }
  }

  function drawOptions(oam) {
    var s2 = g.ship, i;
    if (g.mode === 'title' || g.mode === 'gameover') return;
    if (!s2.alive) return;
    for (i = 0; i < s2.options.length; i++) {
      var o = s2.options[i];
      if (!o.on) continue;
      oam.add({ x: o.x + 4, y: o.y, tile: s2.optAnim ? T.S_OPT1 : T.S_OPT0, pal: 0, prio: 0 });
    }
  }

  function drawShots(oam) {
    var s2 = g.ship, i, j;
    for (i = 0; i < s2.shots.length; i++) {
      var t = s2.shots[i];
      if (!t.alive) continue;
      if (t.kind === CR.Ship.K.LASER) {
        for (j = 0; j < t.len; j++) {
          var last = (j === t.len - 1);
          oam.add({ x: t.x + j * 8, y: t.y - 2, tile: last ? T.S_LASER_H : T.S_LASER, pal: 1, prio: 1 });
        }
      } else if (t.kind === CR.Ship.K.DIAG) {
        oam.add({ x: t.x - 2, y: t.y - 2, tile: T.S_BULLET_D, pal: 1, prio: 1 });
      } else if (t.kind === CR.Ship.K.MISSILE) {
        oam.add({ x: t.x - 2, y: t.y - 2, tile: t.anim ? T.S_MISSILE1 : T.S_MISSILE0, pal: 1, prio: 1 });
      } else {
        oam.add({ x: t.x - 2, y: t.y - 2, tile: T.S_BULLET, pal: 1, prio: 1 });
      }
    }
  }

  var EXP_PART = ['TL', 'TR', 'BL', 'BR'];
  function drawFx(oam) {
    var i, j, b2, f;
    for (i = 0; i < CR.Fx.booms.length; i++) {
      b2 = CR.Fx.booms[i];
      if (!b2.alive) continue;
      f = (b2.t / CR.Ship.BOOM_FRAME) | 0;
      if (f > 3) f = 3;
      for (j = 0; j < 4; j++) {
        oam.add({
          x: b2.x - 8 + (j & 1) * 8, y: b2.y - 8 + ((j >> 1) & 1) * 8,
          tile: T['S_EXP' + f + '_' + EXP_PART[j]], pal: 1, prio: 4
        });
      }
    }
    var d;
    for (i = 0; i < g.ship.debris.length; i++) {
      d = g.ship.debris[i];
      if (!d.alive) continue;
      oam.add({ x: d.x, y: d.y, tile: d.tile ? T.S_DEBRIS1 : T.S_DEBRIS0, pal: 0, prio: 4 });
    }
  }

  /* ================================================================ GAME */
  var GAME = {
    init: function (nes) {
      var ppu = nes.ppu;
      g.nes = nes; g.ppu = ppu; g.input = nes.input || NES.Input;
      resolveSH();
      buildBanks();
      T = CR.TILE; B = CR.BGTILE;
      buildRev();

      // 調色盤（契約：底色 $0F；spr0 船 / spr1 自機彈；bg0 HUD。bg1..3 / spr2..3 由 stage 覆蓋）
      var P = CR.PAL, i;
      ppu.setBackdrop(P.backdrop);
      for (i = 0; i < 4; i++) { ppu.setSprPalette(i, P.spr[i]); ppu.setBgPalette(i, P.bg[i]); }

      ppu.mirroring('v');                 // 水平捲動 ⇒ 左右兩張名稱表不同
      ppu.spriteMode(8);                  // 8×8：船 16×8 = 2 顆精靈
      ppu.setPatternTables(0, 1);
      ppu.flicker = 'rotate';
      ppu.flickerStep = 0;                // OAM 輪替由 NES.SH.OAM（或 fallback）自己做 ⇒ 可重現

      g.ship = CR.Ship.create();
      CR.ship = g.ship;                   // 契約：CR.ship
      g.oam = SH.OAM(ppu, { reserve: 0 });

      call(st(), 'init', ppu);            // stage 建地形 / Scroller（缺席則整片底色）
      if (!st()) g.noStageWarn = true;

      hudStatic(ppu);
      hudHide(ppu);                     // P3-1：標題畫面不掛能量表（進遊戲時 toPlay 會重建）
      drawMsg(ppu, TITLE, 0);

      ppu.scroll(0, 0, 0);                // 捲動 / 分割由遊戲設（engine 契約異動①）
      ppu.split(SPLIT_LINE, { x: 0, y: SPLIT_LINE, nt: 0 });

      call(CR.Audio, 'init', nes);
      call(CR.Audio, 'play', 'title');
      g.mode = 'title'; g.frames = 0;
    },

    update: function (nes) {
      var input = nes.input || NES.Input;
      g.input = input;
      g.frames++;

      if (g.mode === 'title') {
        if (input.pressed(BTN.START) || input.pressed(BTN.A)) toPlay();
      } else if (g.mode === 'gameover') {
        // [源] §9-1：GAME OVER 畫面的 Konami 指令 = 3 條命續關（分數保留）；START 才是回標題
        // fix4：**SELECT = 一鍵續關**（同樣效果、不限次數），Konami 序列照舊保留
        konamiPush(input);
        if (input.pressed(BTN.SELECT)) { konamiClear(); g.selectContinues++; continueGame(); }
        else if (konamiHit()) { konamiClear(); continueGame(); }
        else if (input.pressed(BTN.START)) toTitle();
      } else if (g.mode === 'stageclear') {
        if (input.pressed(BTN.START)) toTitle();
      } else if (g.paused) {
        // 暫停中：遊戲完全凍結，只收 SELECT（fix4 一鍵密技）、Konami 指令與 START（研究 §7-3「暫停」）
        if (input.pressed(BTN.SELECT)) trySelectSecret();
        konamiPush(input);
        var code = konamiHit();
        if (code) { konamiClear(); trySecret(code); }
        if (g.secretMsg > 0 && --g.secretMsg === 0) {
          muteBudget(true); drawMsg(g.ppu, PAUSE, 0); muteBudget(false);
        }
        if (input.pressed(BTN.START)) unpauseGame();
      } else if (g.mode === 'play' && input.pressed(BTN.START)) {
        pauseGame();
      } else {
        g.playFrames++;
        var ev = g.ship.update(g);                  // 船 / 選項 / 自機彈
        if (g.mode === 'play') {
          call(st(), 'update', g);                  // 關卡：捲動 / 出怪 / 敵彈 / 膠囊
          // QA P2-2：魔王進場（bossActive false→true）換魔王曲；擊破後由 toStageClear 換 clear
          var bossNow = !!(st() && st().bossActive);
          if (bossNow && !g.bossOn && CR.Audio && CR.Audio.play) call(CR.Audio, 'play', 'boss');
          g.bossOn = bossNow;
          collide();                                // 碰撞 + 撿膠囊
          drainScore();                             // 收 stage 記的分（EXTEND / HI 一併處理）
          if (!g.ship.alive) g.mode = 'dead';
          else if (st() && st().cleared) toStageClear();
        } else if (g.mode === 'dead') {
          if (ev === 'deathdone') { respawn(); if (g.mode === 'dead') g.mode = 'play'; }
        }
      }
      if (CR.Audio && typeof CR.Audio.tick === 'function') call(CR.Audio, 'tick', nes);
      else if (nes.music && nes.music.tick) nes.music.tick();     // song.js 還沒到位時的保底
    },

    draw: function (nes) {
      var ppu = nes.ppu;
      if (hudOn) hudSync(ppu, g.ship);
      // engine 契約異動①：Scroller 不碰 ppu.scroll / split，捲動由遊戲自己設（% 512，不是 & 255）
      ppu.scroll(((camX() % 512) + 512) % 512, 0, 0);
      ppu.split(SPLIT_LINE, { x: 0, y: SPLIT_LINE, nt: 0 });

      var oam = g.oam;
      oam.begin();
      drawShip(oam);                                // prio 0
      drawOptions(oam);                             // prio 0
      drawShots(oam);                               // prio 1
      call(st(), 'draw', oam);                      // 敵彈 prio 2 / 敵 prio 3（stage 自己 add）
      drawFx(oam);                                  // prio 4
      oam.end();
    },

    state: function () {
      var s2 = g.ship.state();
      var stg = st();
      var n = 0;
      eachOf(stg && stg.enemies, function () { n++; });
      return {
        mode: g.mode, frame: g.frames, playFrames: g.playFrames,
        x: s2.x, y: s2.y, bx: s2.bx, by: s2.by,
        alive: s2.alive, speed: s2.speed, speedPx: s2.speedPx,
        gauge: s2.gauge, gaugeName: s2.gaugeName, power: s2.power, rank: s2.rank,
        options: s2.options, shots: s2.shots, shotCount: s2.shotCount, timers: s2.timers,
        capsules: s2.capsules, ringSteps: s2.ringSteps, moved: s2.moved,
        invul: s2.invul, lives: s2.lives, score: s2.score, hi: s2.hi,
        deathTimer: s2.deathTimer, deaths: s2.deaths, booms: s2.booms,
        camX: camX(), enemies: n, kills: g.kills, hits: g.hits,
        stage: stg ? {
          present: true, camX: camX(), cleared: !!stg.cleared, bossActive: !!stg.bossActive,
          length: stg.length || 0
        } : { present: false },
        oam: { dropped: (g.oam && g.oam.dropped) | 0, used: (g.oam && g.oam.used) | 0, engine: SH ? SH.usingEngine : false },
        hud: hudOn && g.ppu ? hudString(g.ppu) : '',
        hudOn: hudOn,
        // 畫面上看得到的訊息文字（列 11 / 15）—— QA P1-2 的驗收欄位
        msg: g.ppu ? (screenText(11).trim() + '|' + screenText(15).trim()) : '',
        // fix4：暫停第二行（列 13）與 GAME OVER 第三行（列 17）
        msg2: g.ppu ? (screenText(13).trim() + '|' + screenText(17).trim()) : '',
        bossSong: !!g.bossOn,
        // fix3：暫停 / 秘技 / 續關
        paused: !!g.paused, secretLeft: g.secretLeft | 0, secrets: g.secrets | 0,
        secretMsg: g.secretMsg | 0, continues: g.continues | 0, continueCam: g.continueCam | 0,
        konami: KONAMI_BUF.join(''), lastCode: g.lastCode,
        selectUsed: !!g.selectUsed, selectSecrets: g.selectSecrets | 0,
        selectContinues: g.selectContinues | 0,
        lastEvent: g.lastEvent
      };
    }
  };

  CR.GAME = GAME;
  CR.hudString = function () { return hudString(g.ppu); };
  CR.screenText = screenText;
  window.GAME = GAME;
})();

</script>

<script>
// ---- 啟動：桌機整數放大置中 / 手機小數倍貼齊、鍵盤焦點、F 全螢幕、觸控覆蓋層版面 ----
(function () {
  var W = 256, H = 224;                 // 顯示尺寸（PPU 內部 240 列，裁上下各 8）
  var canvas = document.getElementById('nes');
  var hint = document.getElementById('hint');
  var q = new URLSearchParams(location.search);
  var debug = q.get('debug') === '1';
  var forced = parseInt(q.get('scale') || '0', 10) || 0;   // ?scale=1 供截圖工具用（＝維持桌機整數倍行為）
  // 橫向手機：左右各留 110px 給觸控按鍵；平板（短邊 ≥ 500）各留 170px
  var RESERVE_PHONE = 220, RESERVE_TABLET = 340;

  // ---- safe-area 探針（讀 env(safe-area-inset-*) 的實際 px；不支援就全 0） ----
  var probe = null;
  function safeArea() {
    var z = { t: 0, r: 0, b: 0, l: 0 };
    try {
      if (!probe) {
        if (!document.body) return z;
        probe = document.createElement('div');
        probe.id = 'nes-safe-probe';
        probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;' +
          'padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);' +
          'padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);';
        document.body.appendChild(probe);
      }
      var cs = getComputedStyle(probe);
      z.t = parseFloat(cs.paddingTop) || 0; z.r = parseFloat(cs.paddingRight) || 0;
      z.b = parseFloat(cs.paddingBottom) || 0; z.l = parseFloat(cs.paddingLeft) || 0;
    } catch (e) { }
    return z;
  }
  function isTouch() {
    try { return (navigator.maxTouchPoints | 0) > 0 || ('ontouchstart' in window); } catch (e) { return false; }
  }
  function viewport() {
    var vv = window.visualViewport;
    return { w: (vv && vv.width) || window.innerWidth || 320, h: (vv && vv.height) || window.innerHeight || 480 };
  }

  // fit() → {s 顯示倍率（可小數）, back backing store 倍率（整數）, mobile, portrait, sa, vw, vh}
  function fit() {
    var v = viewport(), sa = safeArea();
    var vw = v.w, vh = v.h;
    var portrait = vh >= vw;
    var mobile = !forced && (isTouch() || Math.min(vw, vh) < 600);
    var full = Math.min(vw / W, vh / H);        // 完整塞進視窗的最大倍率
    var s;
    if (forced) {
      s = forced;                               // ?scale=N：完全照舊（截圖工具可重現）
    } else if (mobile) {
      if (portrait) {
        s = vw / W;                             // 直向：寬度填滿、貼上方（下面整片給按鍵）
        var maxH = Math.max(1, vh - sa.t);
        if (H * s > maxH) s = maxH / H;
      } else {
        // 橫向：高度填滿為主，左右各留出按鍵空間；留不出來（小視窗）就整個塞滿
        var reserve = (Math.min(vw, vh) >= 500 ? RESERVE_TABLET : RESERVE_PHONE) + sa.l + sa.r;
        var side = Math.min(vh / H, (vw - reserve) / W);
        s = (side > 0 && side >= full * 0.6) ? side : full;
      }
    } else {
      s = Math.max(1, Math.floor(full));        // 桌機：維持整數倍
    }
    s = Math.max(0.5, s);
    // backing store 一律整數（nes.setScale 只改 backing store 且只收整數，QA R1 P2-1）；
    // 小數倍時 backing 取 ceil（畫得比顯示大一點），再用 CSS 縮到目標尺寸 + pixelated。
    var back = forced ? forced : Math.max(1, Math.min(4, Math.ceil(s - 0.0001)));
    return { s: s, back: back, mobile: mobile, portrait: portrait, sa: sa, vw: vw, vh: vh };
  }

  function place(f) {
    var cw = W * f.s, ch = H * f.s;
    if (f.mobile) { cw = Math.round(cw * 2) / 2; ch = Math.round(ch * 2) / 2; }
    else { cw = Math.round(cw); ch = Math.round(ch); }
    var x = (f.vw - cw) / 2, y = (f.vh - ch) / 2;
    if (f.mobile && f.portrait) y = f.sa.t;                 // 直向貼上方
    if (f.mobile) { x = Math.round(x * 2) / 2; y = Math.round(y * 2) / 2; }
    else { x = Math.floor(x); y = Math.floor(y); }
    canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
    canvas.style.left = x + 'px'; canvas.style.top = y + 'px';
    // 觸控覆蓋層（engine/touch.js）靠這份版面資訊排版
    window.NES_LAYOUT = {
      x: x, y: y, w: cw, h: ch, scale: f.s, back: f.back,
      portrait: f.portrait, mobile: f.mobile, safe: f.sa, vw: f.vw, vh: f.vh
    };
    try { window.dispatchEvent(new Event('nes-resize')); } catch (e) { }
  }

  if (!window.NES || typeof NES.boot !== 'function') {
    hint.style.display = 'block';
    hint.textContent = 'engine/nes.js 未載入';
    return;
  }

  var f = fit();
  var game = window.GAME || NES.game || null;
  var nes = NES.boot({ canvas: canvas, game: game, scale: f.back });
  place(f);

  function apply() {
    var g = fit();
    if (g.back !== nes.scale) nes.setScale(g.back);
    place(g);
  }
  function applySoon() { apply(); setTimeout(apply, 120); }   // iOS 旋轉 / 工具列收合後尺寸會延遲 ⇒ 二次觸發
  window.addEventListener('resize', apply);
  window.addEventListener('orientationchange', applySoon);
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', applySoon);
  }
  // 切到背景 / 鎖螢幕：一定要把按鍵放掉，不然回來會卡住一個方向
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) return;
    try { if (NES.Touch && NES.Touch.releaseAll) NES.Touch.releaseAll(); } catch (e) { }
    try { if (NES.Input && NES.Input.inject) NES.Input.inject(0, 0); } catch (e) { }
  });

  // 鍵盤焦點：canvas 可聚焦，點畫面或載入完成都聚焦；方向鍵 / 空白鍵不捲頁
  function focus() { try { canvas.focus({ preventScroll: true }); } catch (e) { canvas.focus(); } }
  focus();
  window.addEventListener('pointerdown', focus);
  window.addEventListener('keydown', function (e) {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].indexOf(e.code) >= 0) e.preventDefault();
    // F = 全螢幕切換（不佔用遊戲按鍵；瀏覽器拒絕時安靜失敗）
    if (e.code === 'KeyF' && !e.ctrlKey && !e.altKey && !e.metaKey) {
      e.preventDefault();
      try {
        if (!document.fullscreenElement) {
          var p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
          if (p && p.catch) p.catch(function () { });
        } else {
          var q2 = document.exitFullscreen && document.exitFullscreen();
          if (q2 && q2.catch) q2.catch(function () { });
        }
      } catch (err) { }
    }
  });
  document.addEventListener('fullscreenchange', function () { setTimeout(apply, 60); });

  // ?touch=1 / ?touch=0：強制顯示 / 隱藏觸控按鍵（桌機截圖與測試用）
  try {
    var tq = q.get('touch');
    if (tq === '1' && NES.Touch && NES.Touch.show) NES.Touch.show();
    else if (tq === '0' && NES.Touch && NES.Touch.hide) NES.Touch.hide();
  } catch (e) { }

  // 缺模組 / debug 時在底部列出狀態（正式遊玩畫面不顯示）
  if (debug || (nes.missing && nes.missing.length)) {
    hint.style.display = 'block';
    hint.textContent = 'NES ' + NES.VERSION + ' scale=' + nes.scale
      + (nes.missing && nes.missing.length ? '  缺: ' + nes.missing.join(' ') : '  模組齊全')
      + (game ? '' : '  (無 game，空畫面)')
      + (debug ? '  __nes 可用' : '');
  }
  window.nes = nes;
})();
</script>
