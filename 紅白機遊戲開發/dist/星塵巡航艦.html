<!-- ===== engine（契約載入順序；缺檔不致命，nes.js 會用 stub 頂替） ===== -->
<script>/* engine/palette.js */
/*!
 * engine/palette.js — NES 系統調色盤（64 色 NTSC RGB 近似表）
 * 專案：紅白機遊戲開發 / R1 核心引擎 ｜ agent: ppu ｜ 版本 1.0.0（2026-09-17）
 *
 * 來源（RGB 值）：
 *   docs/research/01_硬體規格與限制.md §3.4「NES 系統調色盤（常用 RGB 近似值）」
 *   原始出處：ROM Detectives Wiki 的 2C02 調色盤表（即 FCEUX / Nestopia 常見的預設 RGB 近似）。
 *   注意：2C02 輸出的是 NTSC 複合訊號，沒有唯一正解的 RGB；本表僅為工作用近似值。
 *
 * 規格要點（docs/research/01 §3.4、05 §1.1）：
 *   - 索引為 6 bit（$00–$3F），編碼 `VVHHHH`：低 4 bit 色相、高 2 bit 亮度。
 *   - $0F 為標準黑；$0D 是「blacker than black」，官方警告不要用 → FORBIDDEN。
 *   - $0E/$0F/$1D/$1E/$1F/$2E/$2F/$3E/$3F 實質同為黑（去重後約 54 色）。
 *
 * API（docs/TASKS.md「API 契約」）：
 *   NES.PALETTE            → 長度 64 的陣列，每項 [r, g, b]
 *   NES.PALETTE.FORBIDDEN  → [0x0D]
 *   NES.PALETTE.rgb(i)     → [r, g, b]（複本；i 超出 0..63 會 throw）
 *   NES.PALETTE.nearest(r, g, b) → 最接近的調色盤索引（自動跳過 FORBIDDEN）
 *   附加（非契約，便利用）：hex(i)、isForbidden(i)、assert(i)、SIZE、VERSION
 */
(function (global) {
  'use strict';
  var NES = global.NES = global.NES || {};

  // 依 $00..$3F 順序排列的 24-bit RGB。
  var HEX = [
    0x7C7C7C, 0x0000FC, 0x0000BC, 0x4428BC, 0x940084, 0xA80020, 0xA81000, 0x881400,
    0x503000, 0x007800, 0x006800, 0x005800, 0x004058, 0x000000, 0x000000, 0x000000,
    0xBCBCBC, 0x0078F8, 0x0058F8, 0x6844FC, 0xD800CC, 0xE40058, 0xF83800, 0xE45C10,
    0xAC7C00, 0x00B800, 0x00A800, 0x00A844, 0x008888, 0x000000, 0x000000, 0x000000,
    0xF8F8F8, 0x3CBCFC, 0x6888FC, 0x9878F8, 0xF878F8, 0xF85898, 0xF87858, 0xFCA044,
    0xF8B800, 0xB8F818, 0x58D854, 0x58F898, 0x00E8D8, 0x787878, 0x000000, 0x000000,
    0xFCFCFC, 0xA4E4FC, 0xB8B8F8, 0xD8B8F8, 0xF8B8F8, 0xF8A4C0, 0xF0D0B0, 0xFCE0A8,
    0xF8D878, 0xD8F878, 0xB8F8B8, 0xB8F8D8, 0x00FCFC, 0xF8D8F8, 0x000000, 0x000000
  ];

  var PALETTE = [];
  for (var i = 0; i < 64; i++) {
    var h = HEX[i];
    PALETTE.push([(h >> 16) & 0xFF, (h >> 8) & 0xFF, h & 0xFF]);
  }

  PALETTE.VERSION = '1.0.0';
  PALETTE.SIZE = 64;
  PALETTE.SOURCE = 'ROM Detectives Wiki 2C02 palette (via docs/research/01 §3.4)';
  PALETTE.FORBIDDEN = [0x0D]; // $0D = blacker than black，禁用

  PALETTE.isForbidden = function (i) {
    return PALETTE.FORBIDDEN.indexOf(i | 0) >= 0;
  };

  // 驗證色號：非 0..63 整數或禁用色 → throw。ppu.js 設調色盤時會呼叫。
  PALETTE.assert = function (i, where) {
    if (typeof i !== 'number' || (i | 0) !== i || i < 0 || i > 63) {
      throw new Error('NES.PALETTE: 色號必須是 0..63 的整數，收到 ' + i +
        (where ? ' (' + where + ')' : ''));
    }
    if (PALETTE.isForbidden(i)) {
      throw new Error('NES.PALETTE: $' + ('0' + i.toString(16).toUpperCase()).slice(-2) +
        ' 是禁用色（blacker than black）' + (where ? ' (' + where + ')' : ''));
    }
    return i;
  };

  PALETTE.rgb = function (i) {
    if (typeof i !== 'number' || (i | 0) !== i || i < 0 || i > 63) {
      throw new Error('NES.PALETTE.rgb: 索引必須是 0..63 的整數，收到 ' + i);
    }
    var c = PALETTE[i];
    return [c[0], c[1], c[2]];
  };

  PALETTE.hex = function (i) {
    var c = PALETTE.rgb(i);
    return '#' + ('00000' + ((c[0] << 16) | (c[1] << 8) | c[2]).toString(16).toUpperCase()).slice(-6);
  };

  // 最接近色（歐氏距離平方，跳過禁用色）。相同距離取索引小者。
  PALETTE.nearest = function (r, g, b) {
    var best = 0, bestD = Infinity;
    for (var i = 0; i < 64; i++) {
      if (PALETTE.isForbidden(i)) continue;
      var c = PALETTE[i];
      var dr = c[0] - r, dg = c[1] - g, db = c[2] - b;
      var d = dr * dr + dg * dg + db * db;
      if (d < bestD) { bestD = d; best = i; if (d === 0) break; }
    }
    return best;
  };

  NES.PALETTE = PALETTE;
})(typeof window !== 'undefined' ? window : this);

</script>
<script>/* engine/fixed.js */
/* engine/fixed.js — NES.FX：定點數工具（位置 1/16 px、速度 8.8）
 * R1 / agent core。classic script、IIFE、零相依。
 *
 * 單位系統（全部整數；命名與 docs/TASKS.md「API 契約」一致）
 * ┌──────────┬───────────────┬───────────────────────────────────────────┐
 * │ 名稱     │ 1 單位 =      │ 用途                                       │
 * ├──────────┼───────────────┼───────────────────────────────────────────┤
 * │ sub      │ 1/16 px       │ 位置（SUB = 16）                           │
 * │ vel      │ 1/256 px/幀   │ 速度 8.8（v88(hi,lo) = hi 整數 px + lo/256）│
 * │ acc      │ 1/4096 px/幀² │ 加速度（= 1/16 vel，ACC = 16）             │
 * └──────────┴───────────────┴───────────────────────────────────────────┘
 * 兩層換算都是「每 16 個小單位進位 1 個大單位」，所以累加一律用 >>4 / &15，
 * 負數用算術右移自然取 floor，餘數恆為 0..15，不會因正負號漂移。
 *
 * 與 SMB1 反組譯常數的對應（見下方 NES.FX.SMB）：
 *   SMB「速度值」1 單位 = 1/16 px/幀 = 16 vel
 *   SMB「加速度 / 摩擦」1 單位 = 1/256 速度值/幀 = 1/4096 px/幀² = 1 acc  ← 原始位元組可直接用
 *   SMB「重力值」1 單位 = 1/256 px/幀² = 1 vel/幀 = 16 acc
 */
(function (root) {
  'use strict';
  var NES = root.NES = root.NES || {};

  var SUB = 16;    // 位置：1 px = 16 sub
  var VEL = 256;   // 速度：1 px/幀 = 256 vel（8.8 的 .8）
  var ACC = 16;    // 加速度：1 vel/幀 = 16 acc（→ 1 px/幀² = 4096 acc）

  /* ---------- 位置換算 ---------- */
  function toSub(px) { return (px * SUB) | 0; }          // px → sub（截尾取整）
  function toPx(sub) { return (sub | 0) / SUB; }         // sub → px（唯一會回傳非整數的函式，顯示 / 除錯用）
  function floorPx(sub) { return (sub | 0) >> 4; }       // sub → px（向下取整，負數也正確）
  function ceilPx(sub) { return -((-(sub | 0)) >> 4); }
  function roundPx(sub) { return ((sub | 0) + 8) >> 4; }
  function subFrac(sub) { return (sub | 0) & 15; }       // 像素內的 1/16 餘數（0..15）

  /* ---------- 速度換算（8.8） ---------- */
  // v88(2, 128) = 2.5 px/幀 = 640；負速度傳負的 hi：v88(-2, 128) = -640
  function v88(hi, lo) {
    hi = hi | 0; lo = lo | 0;
    if (hi < 0) return -(((-hi) * VEL + (lo < 0 ? -lo : lo)) | 0);
    return (hi * VEL + lo) | 0;
  }
  function velToPx(v) { return (v | 0) / VEL; }                     // vel → px/幀
  function pxToVel(px) { return Math.round(px * VEL) | 0; }         // px/幀 → vel
  function accToPx(a) { return (a | 0) / (VEL * ACC); }             // acc → px/幀²
  function pxToAcc(px) { return Math.round(px * VEL * ACC) | 0; }   // px/幀² → acc
  function smbSpd(b) { return ((b | 0) * 16) | 0; }                 // SMB 速度值($xx) → vel
  function smbGrav(b) { return ((b | 0) * 16) | 0; }                // SMB 重力值($xx) → acc

  /* ---------- Vec：{sub, frac} 小物件，每幀零配置 ---------- */
  function Vec(px, frac) { return { sub: toSub(px || 0), frac: frac | 0 }; }
  function vecSub(sub, frac) { return { sub: sub | 0, frac: frac | 0 }; }
  function vadd(vec, v) {                    // 位置前進一幀，回傳新的 sub
    var f = vec.frac + (v | 0);
    var d = f >> 4;
    vec.frac = f - (d << 4);
    vec.sub = (vec.sub + d) | 0;
    return vec.sub;
  }
  function vsetPx(vec, px) { vec.sub = toSub(px); vec.frac = 0; return vec; }
  function vsetSub(vec, sub) { vec.sub = sub | 0; vec.frac = 0; return vec; }
  function vpx(vec) { return vec.sub >> 4; }
  function vpxf(vec) { return vec.sub / SUB; }

  /* ---------- Acc：{v, frac} 速度小物件（加速度累加用） ---------- */
  function Acc(v) { return { v: v | 0, frac: 0 }; }
  function aadd(av, a) {                     // 速度前進一幀，回傳新的 vel
    var f = av.frac + (a | 0);
    var d = f >> 4;
    av.frac = f - (d << 4);
    av.v = (av.v + d) | 0;
    return av.v;
  }
  function aset(av, v) { av.v = v | 0; av.frac = 0; return av; }
  // 朝 target 以 a（acc 單位）逼近並夾住，不會過衝
  function aapproach(av, target, a) {
    target = target | 0;
    if (av.v < target) { aadd(av, a); if (av.v > target) aset(av, target); }
    else if (av.v > target) { aadd(av, -(a | 0)); if (av.v < target) aset(av, target); }
    return av.v;
  }

  /* ---------- 相容別名（R1 fix1 定案：正式寫法是 Vec / Acc）----------
   * 舊契約 `addVel(posSub, v88) → {pos, frac}` 與舊實作 `addVel(posSub, v, frac) → int`
   * （餘數放在全域 `NES.FX.frac`）**都已作廢**：全域餘數在多實體（主角 + N 個敵人）
   * 之間會互相污染。正式寫法是把餘數放進物件本身：
   *     位置 `Vec{sub, frac}` + `vadd(vec, v)`　／　速度 `Acc{v, frac}` + `aadd(av, a)`
   * `addVel / addAcc` 保留為**明確版本的相容別名**（= vadd / aadd），沒有任何隱藏狀態。
   */
  function addVel(vec, v) {
    if (!vec || typeof vec !== 'object' || typeof vec.sub !== 'number') {
      throw new TypeError('NES.FX.addVel 已改為 addVel(vec, v)（vec = FX.Vec(px)）；' +
        '舊的 addVel(posSub, v, frac) 與全域 NES.FX.frac 已移除，見 docs/ENGINE_API.md §3');
    }
    return vadd(vec, v);
  }
  function addAcc(av, a) {
    if (!av || typeof av !== 'object' || typeof av.v !== 'number') {
      throw new TypeError('NES.FX.addAcc 已改為 addAcc(acc, a)（acc = FX.Acc(vel)）；' +
        '舊的 addAcc(v, a, frac) 已移除，見 docs/ENGINE_API.md §3');
    }
    return aadd(av, a);
  }

  /* ---------- 整數工具 ---------- */
  function clamp(v, lo, hi) { v = v | 0; lo = lo | 0; hi = hi | 0; return v < lo ? lo : (v > hi ? hi : v); }
  function sign(v) { v = v | 0; return v > 0 ? 1 : (v < 0 ? -1 : 0); }
  function abs(v) { v = v | 0; return v < 0 ? -v : v; }
  function absMax(v, m) { v = v | 0; m = m | 0; if (m < 0) m = -m; return v > m ? m : (v < -m ? -m : v); }
  function mulShr(a, b, s) { return ((a | 0) * (b | 0)) >> (s | 0); }  // 定點乘法

  /* ---------- SMB1 常數表 ----------
   * 來源：docs/research/03_經典遊戲深度解析/01_超級瑪利歐兄弟.md ②「速度與加速度」「跳躍」
   *       原始出處 doppelganger《A Comprehensive SMB Disassembly》(SMBDIS.ASM)
   * 每一欄都標原始位元組與換算後的 px 值，方便回頭核對。
   */
  var SMB = {
    src: 'docs/research/03_經典遊戲深度解析/01_超級瑪利歐兄弟.md（SMBDIS.ASM 反組譯）',

    // MaxRightXSpdData / MaxLeftXSpdData（原始為 1/16 px/幀 的速度值）
    maxRun:      smbSpd(0x28),   // $28 = 40 → 2.5  px/幀 = 640 vel
    maxWalk:     smbSpd(0x18),   // $18 = 24 → 1.5  px/幀 = 384 vel
    maxWater:    smbSpd(0x10),   // $10 = 16 → 1.0  px/幀 = 256 vel
    maxCutscene: smbSpd(0x0c),   // $0c = 12 → 0.75 px/幀 = 192 vel

    // FrictionData（原始為 1/256 速度值/幀 = 1 acc，數值可直接用）
    accRun:   0xe4,              // 228 → 0.05566 px/幀²（14.25 vel/幀）
    accWalk:  0x98,              // 152 → 0.03711 px/幀²（ 9.5  vel/幀）
    friction: 0xd0,              // 208 → 0.05078 px/幀²（13.0  vel/幀）
    turnShift: 1,                // 面向 ≠ 移動方向時 `asl` → 加速度 ×2（煞車/轉身快一倍）

    // 空中控制門檻：水平速度 ≥ $19（1.5625 px/幀）才沿用跑步上限與跑步加速度
    airRunSpeed: smbSpd(0x19),   // 400 vel

    /* 跳躍 5 段：依起跳瞬間的水平速度絕對值（vel）選段
     * belowSpeed = 該段的上界（最後一段為 Infinity）
     * vy0 = 起跳初速（vel，負 = 往上）；gHold/gFall = 按住 / 放開 A 的重力（acc）
     * h = 研究文件列的理論最高跳躍高度（px），僅供對照（離散積分會差 1~3 px）
     */
    jump: [
      { belowSpeed: smbSpd(0x09), vy0: -v88(4, 0), gHold: smbGrav(0x20), gFall: smbGrav(0x70), h: 64 },
      { belowSpeed: smbSpd(0x10), vy0: -v88(4, 0), gHold: smbGrav(0x20), gFall: smbGrav(0x70), h: 64 },
      { belowSpeed: smbSpd(0x19), vy0: -v88(4, 0), gHold: smbGrav(0x1e), gFall: smbGrav(0x60), h: 68 },
      { belowSpeed: smbSpd(0x1c), vy0: -v88(5, 0), gHold: smbGrav(0x28), gFall: smbGrav(0x90), h: 80 },
      { belowSpeed: Infinity,     vy0: -v88(5, 0), gHold: smbGrav(0x28), gFall: smbGrav(0x90), h: 80 }
    ],
    swim:      { vy0: -v88(2, 0), gHold: smbGrav(0x0d), gFall: smbGrav(0x0a) },
    whirlpool: { vy0: -v88(1, 0), gHold: smbGrav(0x04), gFall: smbGrav(0x09) },

    // 放開 A 後要離地 ≥ 1 px 才切成大重力（DiffToHaltJump）
    diffToHaltJump: SUB,         // 16 sub = 1 px

    // 敵人：NormalXSpdData（栗寶寶等）
    enemySlow: smbSpd(0x08),     // $f8 → 0.5  px/幀（表中為負方向，這裡存絕對值）
    enemyFast: smbSpd(0x0c),     // $f4 → 0.75 px/幀

    // 計時器節拍（幀）
    intervalTimer: 21,           // IntervalTimerControl：每 21 幀一跳（framerule）
    injuryFrames: 8 * 21,        // 168 幀 ≈ 2.80 秒
    starFrames: 35 * 21,         // 735 幀 ≈ 12.2 秒

    // 依水平速度取跳躍段
    jumpFor: function (absSpeedVel) {
      absSpeedVel = absSpeedVel < 0 ? -absSpeedVel : absSpeedVel;
      for (var i = 0; i < SMB.jump.length; i++) if (absSpeedVel < SMB.jump[i].belowSpeed) return SMB.jump[i];
      return SMB.jump[SMB.jump.length - 1];
    },

    /* ---- 起跳首幀的重力（R1 fix1 總控裁定；QA P1-4 / P1-5）----------------
     * 半隱式 Euler（每幀「先加重力、再位移」）會把跳躍高度系統性地低估半個
     * 重力步：靜止跳 62.00 px（文件 4 格 = 64）、全速跳 77.50 px（文件 5 格 = 80），
     * ⇒「剛好 4 格牆 / 5 格牆」的關卡會跳不過去。
     * 修正：**起跳後的第 1 幀只套用半格重力**（leapfrog / 中點積分），之後照常。
     *   離散積分和 = Σ(v0 − g(k+½)) = v0²/2g ＝ 連續解 ⇒ 靜止跳 64.00 px、全速跳 80.00 px（±0）。
     * skipGravityFirstFrame 三種值：
     *   true / 'half' 首幀半格重力 →  64.00 / 80.00 px（預設，對齊研究文件 03/01）
     *   'full'        首幀完全不加重力 → 66.00 / 82.50 px（超過文件 2 / 2.5 px）
     *   false         舊行為（純半隱式） → 62.00 / 77.50 px（比文件少 2 / 2.5 px）
     */
    skipGravityFirstFrame: true
  };

  /* ---------- 跳躍：core 與 demo 共用的唯一一套規則 ----------
   * 用法（見 games/demo/main.js stepPlayer）：
   *   var js = FX.SMB.jumpState(g.vy);               // 綁定自己的 Acc，零配置
   *   if (onGround && pressedA) FX.SMB.jumpStart(js, FX.abs(vx), py.sub);
   *   if (!onGround) FX.SMB.jumpGravity(js, aHeldNow, py.sub, MAX_FALL);
   *   FX.vadd(py, js.vy.v);                          // 先重力、再位移（半隱式）
   * 規則：① 依起跳瞬間 |vx| 取 5 段之一（jumpFor）
   *       ② 按住 A = gHold；放開 **且已離地 ≥ 1 px**（DiffToHaltJump）才切 gFall
   *       ③ 起跳首幀依 skipGravityFirstFrame 只套半格重力（見上）
   */
  function jumpState(vyAcc) {
    return {
      seg: SMB.jump[0],
      vy: vyAcc || Acc(0),
      fastFall: false,
      startSub: 0,
      first: false,
      skipFirst: SMB.skipGravityFirstFrame
    };
  }
  function jumpStart(js, absVxVel, pySub) {
    js.seg = SMB.jumpFor(absVxVel | 0);
    aset(js.vy, js.seg.vy0);
    js.fastFall = false;
    js.startSub = pySub | 0;
    js.first = true;
    return js;
  }
  // 重新設定垂直速度但不算「新的一次跳躍」（踩敵回彈、被彈飛…）
  function jumpBounce(js, vel, pySub) {
    aset(js.vy, vel | 0);
    js.fastFall = false;
    js.startSub = pySub | 0;
    js.first = false;
    return js;
  }
  function jumpGravity(js, aHeld, pySub, maxFall) {

/* engine/cpu_timing.js — NES.Timing：60.0988 Hz 固定步邏輯迴圈
 * R1 / agent core。classic script、IIFE、零相依。
 *
 * 原則：
 *   - 邏輯步長固定 1/hz，**不做 delta-time 補間**（位置永遠是整數 sub 的累加）。
 *   - rAF 迴圈用累加器；一次 rAF 最多補 3 幀，還有剩就直接丟掉（避免分頁回前景時暴衝）。
 *   - step(n) 同步跑 n 幀（不走 rAF），供 tools/test_*.py 與截圖使用。
 *   - 每幀順序：Input.poll() → update() → draw()（NES.Input 不存在就跳過 poll）。
 *   - budget 模擬 VBlank 的 PPU 寫入頻寬：NTSC VBlank ≈ 2273 cycle ≈ 160~200 bytes。

 *       'ppu'（預設）名稱表 / 屬性表 / 調色盤，limit = 160 byte（NTSC）

    if (res && res.frame) res = res.frame;
    if (!res) return 'lint: (無結果)';
    return 'lint ' + (res.ok ? 'PASS' : 'FAIL') + ' — 色數 ' + res.colors + '/' + res.maxColors +
      '、非法像素 ' + res.badPixels + '、超線 ' + (res.overLine ? res.overLine.length : 0) +
      (res.errors && res.errors.length ? '｜' + res.errors.join('；') : '');
  }

  var Lint = {
    strict: false,
    magenta: false,
    maxColors: 25,
    maxSpritesPerLine: 8,
    MAGENTA: MAGENTA,
    VISIBLE: { y0: 8, y1: 232 },  // 研究 01 §3.1：NTSC 電視只看得到中央 256×224
    frame: frame,
    oam: oam,
    check: check,
    summary: summary
  };
  NES.Lint = Lint;
})();

<script>/* games/cruiser/song.js */
/*
 * games/cruiser/song.js — 《星塵巡航艦》音樂 / 音效層（R2 audio agent）
 * ---------------------------------------------------------------------------
 * 擁有者：audio agent ｜ 依賴：engine/music.js（NES.Music）；沒載到也不會 throw（全部容錯）
 * 全部原創：旋律 / 和聲 / 鼓組 / 音效都是本專案自寫，只借鑑 NES 編曲技法（研究 06 §2 / §4）。
 *
 * ============================ 對外介面（TASKS R2 契約 CR.Audio） ============================
 *   CR.Audio.init(nes)          — 綁 driver、註冊全部音效（冪等）
 *   CR.Audio.play(key)          — key: 'title' | 'stage1' | 'boss' | 'clear' | 'gameover' | 'extend'
 *   CR.Audio.stop()             — 停止音樂（音效不受影響；要一起停用 stopAll()）
 *   CR.Audio.sfx(name, opt)     — name 見 CR.Audio.PRIORITY；opt 轉給 driver.sfx（可覆寫 channels / priority）
 *   CR.Audio.tick(nes)          — **每幀呼叫一次，放在 game.update() 的最後**
 *   （容錯：以上每個函式的第一個參數都可以傳 nes，例如 play(nes,'stage1') 也接受）
 *   CR.Audio.state(nes)         — 測試用快照；CR.SONGS / CR.SFX — 原始資料（tools/apu_render.py 用）
 *
 * ============================ 聲道分配（硬規則） ============================

    map(BAR, { 0: S(12), 4: S(12), 8: S(13), 12: S(14) }),
    map(BAR, { 0: CY(15), 4: S(11), 6: S(12), 8: S(13), 10: S(14), 12: CY(15) })
  ];
  var CLEAR = (function () {

      p1: slice(rows(CL_LEAD, { inst: 'fanfare', vol: 15, duty: 2 }), BAR),

      p2: slice(rows(echo(CL_LEAD, 2, false), { inst: 'echo', vol: 13, duty: 0, detune: 3 }), BAR),

      name: '星塵巡航艦 STAGE CLEAR', speed: 5, rows: BAR, loop: 0,
      instruments: INST, patterns: t.patterns, order: t.order
    };
  })();

  /* =========================================================== ⑤ gameover */
  /* (16 + 14) row × speed 6 = 180 幀 = 3.0 秒，不循環。半音下行 + 最後一個和弦整軌下滑。 */

  var GO_LEAD_A = flat(['E-5 .   .   .   D#5 .   .   .   D-5 .   .   .   C#5 .   .   .  ']);
  var GO_BASS_A = flat(['E-3 .   .   .   D#3 .   .   .   D-3 .   .   .   C#3 .   .   .  ']);
  var GO_LEAD_B = [{ note: 'C-5' }, null, null, null, { note: 'B-4' }, null, null, null,
  { note: 'A-4', slide: 6 }, null, null, null, null, null];                 // 最後一音邊響邊下滑
  var GO_BASS_B = [{ note: 'C-3' }, null, null, null, { note: 'B-2' }, null, null, null,
  { note: 'A-2', slide: 4 }, null, null, null, null, null];
  var GO_ECHO_B = [null, null, { note: 'C-5' }, null, null, null, { note: 'B-4' }, null,
    null, null, { note: 'A-4', slide: 6 }, null, null, null];
  var GAMEOVER = (function () {
    var leadA = rows(GO_LEAD_A, { inst: 'lead', vol: 13, duty: 2 });
    var echoA = rows(echo(GO_LEAD_A, 2, false), { inst: 'echo', vol: 11, duty: 0, detune: 5 });
    var bassA = rows(GO_BASS_A, { inst: 'bass' });
    function deco(arr, opt) {                        // 手寫 row 補上樂器 / 音量欄
      return arr.map(function (r) {
        if (!r) return null;
        var o = { note: r.note };
        for (var k in opt) o[k] = opt[k];
        if (r.slide !== undefined) o.slide = r.slide;
        return o;
      });
    }
    return {
      name: '星塵巡航艦 GAME OVER', speed: 6, rows: BAR, loop: 0, instruments: INST,

        { p1: leadA, p2: echoA, tri: bassA, noi: map(BAR, { 0: CY(11), 8: { note: 14, inst: 'rumble', vol: 7, duty: 0 } }) },

          p1: deco(GO_LEAD_B, { inst: 'lead', vol: 13, duty: 2 }),
          p2: deco(GO_ECHO_B, { inst: 'echo', vol: 11, duty: 0, detune: 5 }),
          tri: deco(GO_BASS_B, { inst: 'bass' }),
          noi: map(14, { 0: { note: 14, inst: 'rumble', vol: 8, duty: 0 }, 8: { note: 15, inst: 'rumble', vol: 6, duty: 0 } })

      order: [0, 1]

  var EX_LEAD = ['C-5', 'E-5', 'G-5', 'C-6', 'E-6', 'G-6', 'C-7', null, null, null,
    'G-6', null, 'C-7', null, null, null, null, null, null, null];
  var EX_BASS = ['C-3', null, null, null, 'C-4', null, null, null, 'G-3', null, null, null,
    'C-4', null, null, null, null, null, null, null];
  var EXTEND = {
    name: '星塵巡航艦 1-UP', speed: 3, rows: 20, loop: 0, instruments: INST,
    patterns: [{
      p1: rows(EX_LEAD, { inst: 'fanfare', vol: 15, duty: 1 }),
      p2: rows(echo(EX_LEAD, 1, false), { inst: 'echo', vol: 13, duty: 0, detune: 4 }),
      tri: rows(EX_BASS, { inst: 'bass' })
    }],
    order: [0]
  };

  var SONGS = { title: TITLE, stage1: STAGE1, boss: BOSS, clear: CLEAR, gameover: GAMEOVER, extend: EXTEND };
  var LOOPED = { title: true, stage1: true, boss: true, clear: false, gameover: false, extend: false };

  /* ================================================================= 音效 */
  /* 優先權（數字大者搶得走小者佔用的聲道）：
       die 15 > explode 8 > powerup 7 = extend 7 > laser 6 > capsule 5 > missile 4 > hit 3 > shot 2
     聲道：除了 die，一律只用 p2 / noi，主旋律 p1 與低音 tri 不受干擾。 */

  var SFX = {
    // 自機彈：短方波下滑（duty 12.5%、6 幀、slide +16/幀）
    shot: {
      priority: 2, channels: ['p2'],
      data: {
        p2: [{ duty: 0, vol: 9, note: 'C-6', slide: 16 }, { vol: 8 }, { vol: 7 }, { vol: 5 }, { vol: 3 }, { vol: 1 }, { off: true }]
      }
    },
    // 雷射：持續高頻，占空比每幀輪替 0/2/1 做出鋸齒感（研究 06 §2.5）
    laser: {
      priority: 6, channels: ['p2'],
      data: {
        p2: [
          { duty: 0, vol: 12, note: 'A-6' }, { duty: 2 }, { duty: 1 }, { duty: 0, vol: 11 },
          { duty: 2 }, { duty: 1 }, { duty: 0, vol: 10 }, { duty: 2, vol: 9 },
          { duty: 1, vol: 8 }, { duty: 0, vol: 7 }, { duty: 2, vol: 6 }, { duty: 1, vol: 5 },
          { duty: 0, vol: 4 }, { duty: 2, vol: 3 }, { vol: 2 }, { vol: 1 }, { off: true }
        ]
      }
    },
    // 飛彈：低頻 50% 方波快速上滑（發射推力感）
    missile: {
      priority: 4, channels: ['p2'],
      data: {
        p2: [{ duty: 2, vol: 10, note: 'E-3', slide: -26 }, { vol: 10 }, { vol: 9 }, { vol: 9 },
        { vol: 8 }, { vol: 7 }, { vol: 6 }, { vol: 4 }, { vol: 2 }, { off: true }]
      }
    },
    // 命中：雜訊短促一擊
    hit: {
      priority: 3, channels: ['noi'],
      data: { noi: [{ duty: 1, vol: 11, note: 5 }, { vol: 8, note: 6 }, { vol: 5, note: 7 }, { vol: 2, note: 8 }, { off: true }] }
    },
    // 爆炸：雜訊長模式由高到低 + p2 低頻下滑（契約寫三角波，改走 p2 以免切斷低音線）
    explode: {
      priority: 8, channels: ['noi', 'p2'],
      data: {
        noi: [{ duty: 0, vol: 15, note: 3 }, { note: 4 }, { vol: 14, note: 5 }, { note: 6 }, { vol: 13, note: 7 },
        { note: 8 }, { vol: 11, note: 9 }, { note: 10 }, { vol: 9, note: 11 }, { note: 11 },
        { vol: 7, note: 12 }, { note: 12 }, { vol: 5, note: 13 }, { note: 13 }, { vol: 3, note: 14 },
        { note: 14 }, { vol: 2, note: 15 }, { vol: 1 }, { off: true }],
        p2: [{ duty: 2, vol: 11, note: 'A-3', slide: 34 }, { vol: 10 }, { vol: 10 }, { vol: 9 }, { vol: 9 },
        { vol: 8 }, { vol: 7 }, { vol: 6 }, { vol: 5 }, { vol: 4 }, { vol: 3 }, { vol: 2 }, { vol: 1 }, { off: true }]
      }
    },
    // 撿膠囊：兩音上行的清脆「叮」
    capsule: {
      priority: 5, channels: ['p2'],
      data: {
        p2: [{ duty: 0, vol: 11, note: 'E-6' }, null, null, { note: 'B-6', vol: 11, retrigger: true },
          null, null, null, { vol: 9 }, { vol: 7 }, { vol: 5 }, { vol: 3 }, { vol: 1 }, { off: true }]
      }
    },
    // 強化啟動：上行大三和弦琶音（研究 06 §4「1-Up / 完成 jingle = 上行琶音」）
    powerup: {
      priority: 7, channels: ['p2'],
      data: {
        p2: [{ duty: 1, vol: 12, note: 'C-5' }, { note: 'E-5', retrigger: true }, { note: 'G-5', retrigger: true },
        { note: 'C-6', retrigger: true }, { note: 'E-6', retrigger: true }, { note: 'G-6', retrigger: true },
        { note: 'C-7', retrigger: true }, { vol: 11 }, { vol: 10 }, { vol: 8 }, { vol: 6 }, { vol: 4 },
        { vol: 2 }, { off: true }]
      }
    },
    // 1-UP 音效版（不想中斷音樂時用；完整 jingle 用 play('extend')）
    extend: {
      priority: 7, channels: ['p2'],
      data: {
        p2: [{ duty: 1, vol: 12, note: 'C-6' }, null, { note: 'E-6', retrigger: true }, null,
        { note: 'G-6', retrigger: true }, null, { note: 'C-7', retrigger: true }, null, null,
        { note: 'G-6', retrigger: true }, null, { note: 'C-7', retrigger: true }, null, null,
        { vol: 9 }, { vol: 6 }, { vol: 3 }, { off: true }]
      }
    },
    // 自機被擊墜：唯一會搶下 p1 / tri 的音效（研究 06 §4「death：通常停止音樂再播」）
    die: {
      priority: 15, channels: ['p1', 'p2', 'tri', 'noi'],
      data: {
        p1: [{ duty: 2, vol: 14, note: 'A-5', slide: 9 }].concat(fade(14, 34)).concat([{ off: true }]),
        p2: [{ duty: 1, vol: 12, note: 'A-4', slide: 5, detune: 4 }].concat(fade(12, 34)).concat([{ off: true }]),
        tri: [{ note: 'A-3', slide: 7 }].concat(hold(34)).concat([{ off: true }]),
        noi: [{ duty: 0, vol: 13, note: 4 }, { note: 5 }, { vol: 12, note: 6 }, { note: 7 }, { vol: 10, note: 8 },
        { note: 9 }, { vol: 8, note: 10 }, { note: 11 }, { vol: 6, note: 12 }, { note: 13 },
        { vol: 4, note: 14 }, { vol: 2, note: 15 }, { off: true }]
      }
    }
  };

  function fade(from, n) {                 // n 幀內由 from 線性衰減到 0
    var a = [];
    for (var i = 1; i <= n; i++) a.push({ vol: Math.max(0, Math.round(from * (1 - i / n))) });
    return a;
  }
  function hold(n) { var a = []; for (var i = 0; i < n; i++) a.push(null); return a; }

  var PRIORITY = {};
  for (var _n in SFX) if (Object.prototype.hasOwnProperty.call(SFX, _n)) PRIORITY[_n] = SFX[_n].priority;

  /* ================================================================== API */

  function driverOf(nes) {
    if (nes && nes.music) return nes.music;
    if (NES.Music && NES.Music._default) return NES.Music;
    return null;
  }

  // 容錯：init/play/stop/sfx/tick 的第一個參數可以是 nes、也可以直接是真正的參數
  function split(a, b) {
    if (a && typeof a === 'object' && (a.music || a.apu || a.ppu)) return { nes: a, arg: b };
    return { nes: null, arg: a };
  }

    ready: !!(M && M.create),
    SONGS: SONGS,
    SFX: SFX,
    PRIORITY: PRIORITY,
    ECHO_DELAY: ST1_ECHO_DELAY,
    current: null,
    playing: false,
    _d: null,

    init: function (nes) {
      var d = driverOf(nes);
      if (!d) return false;

      for (var n in SFX) {

      }
      return true;
    },

    driver: function (nes) { return driverOf(nes) || Audio._d; },

    // play('stage1') 或 play(nes, 'stage1')
    play: function (a, b) {
      var s = split(a, b), d = Audio.driver(s.nes), key = s.arg;
      var song = SONGS[key];
      if (!d || !song) return false;
      try {
        d.play(song, { loop: !!LOOPED[key] });
        Audio.current = key; Audio.playing = true;
        return true;
      } catch (e) { return false; }
    },

    stop: function (a) {
      var d = Audio.driver(split(a, null).nes);
      if (!d) return false;
      try { d.stop(); Audio.playing = false; Audio.current = null; return true; } catch (e) { return false; }
    },

    stopAll: function (a) {
      var d = Audio.driver(split(a, null).nes);
      if (!d) return false;

      return Audio.stop(a);
    },

    // sfx('shot') 或 sfx(nes, 'shot')；opt 直接轉給 driver.sfx
    sfx: function (a, b, c) {
      var s = split(a, b), d = Audio.driver(s.nes), name = s.arg;
      var opt = (s.nes ? c : b) || undefined;
      if (!d || !SFX[name]) return false;
      // 'die' 依 NES 慣例先停音樂（它會搶走全部五軌，留著音樂只會在音效結束後亂跳）
      if (name === 'die') { try { d.stop(); Audio.playing = false; } catch (e) { /* ignore */ } }
      try { d.sfx(name, opt); return true; } catch (e) { return false; }
    },

    // ★ 放在 game.update() 的最後一行
    tick: function (a) {
      var d = Audio.driver(split(a, null).nes);
      if (!d) return;
      try { d.tick(); } catch (e) { /* 音樂出錯不能拖垮遊戲迴圈 */ }
    },

    state: function (a) {
      var d = Audio.driver(split(a, null).nes);
      if (!d || !d.state) return null;
      try {
        var st = d.state();
        var owners = {};
        for (var i = 0; i < st.channels.length; i++) owners[st.channels[i].name] = st.channels[i].owner || null;
        return {
          song: Audio.current, playing: st.playing, orderIndex: st.orderIndex, row: st.row,
          sfx: st.sfx.map(function (x) { return x.name; }), owners: owners
        };
      } catch (e) { return null; }
    }
  };

  CR.Audio = Audio;
  CR.SONGS = SONGS;
  CR.SFX = SFX;
})();

  var GAUGE_NAME = ['', 'SPEED', 'MISSILE', 'DOUBLE', 'LASER', 'OPTION', '?'];
  // QA R2 P2-1：5 字標籤 6 格相連會擠成 `SPEEDMISSLDOUBL…`；改成 4 欄一格（3 字 + 1 空欄），
  // 每格對齊下一列的格框 `[---]`，整列讀作 ` SPD MSL DBL LSR OPT  ?`
  var GAUGE_LABEL = ['SPD ', 'MSL ', 'DBL ', 'LSR ', 'OPT ', ' ?  '];

  /* --------------------------------------------------------- 小工具 / 防禦 */
  function stage() { return CR.stage || null; }
  // 契約補充：CR.stage.solidAt(x, y) 以「螢幕座標」為準（x 0..255、y 0..207）
  function solidAt(x, y) {
    var st = stage();
    if (st && typeof st.solidAt === 'function') { try { return !!st.solidAt(x | 0, y | 0); } catch (e) { return false; } }
    return false;
  }
  function sfx(name) { try { if (CR.Audio && CR.Audio.sfx) CR.Audio.sfx(name); } catch (e) { } }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function loadHi() {
    try { var v = parseInt(window.localStorage.getItem(HI_KEY) || '0', 10); return (v > 0 && v < 10000000) ? v : 0; }
    catch (e) { return 0; }
  }
  function saveHi(v) { try { window.localStorage.setItem(HI_KEY, String(v)); } catch (e) { } }

  /* ==================================================== 爆炸特效池（共用） */
  var BOOM_FRAME = 6;                                   // [源] 4 張 × 6 幀 = 24 幀（雜魚）
  var booms = [];
  (function () { for (var i = 0; i < BOOMS; i++) booms.push({ alive: false, x: 0, y: 0, t: 0 }); })();
  function boom(x, y) {
    for (var i = 0; i < booms.length; i++) {
      var b = booms[i];
      if (!b.alive) { b.alive = true; b.x = x | 0; b.y = y | 0; b.t = 0; return b; }
    }
    return null;                                        // 沒槽就不生成（NES 風）
  }
  function boomUpdate() {
    for (var i = 0; i < booms.length; i++) { var b = booms[i]; if (b.alive && ++b.t >= BOOM_FRAME * 4) b.alive = false; }
  }
  function boomCount() { var n = 0, i; for (i = 0; i < booms.length; i++) if (booms[i].alive) n++; return n; }
  CR.Fx = { boom: boom, booms: booms, count: boomCount, FRAME: BOOM_FRAME,
    reset: function () { for (var i = 0; i < booms.length; i++) booms[i].alive = false; } };

  /* ================================================================== 自機 */
  function newShot() {
    return { alive: false, kind: 0, src: 0, id: 0,
      px: FX.Vec(0), py: FX.Vec(0), vx: 0, vy: 0,
      x: 0, y: 0, w: 4, h: 4, dmg: 1, len: 1, crawl: false, anim: 0 };
  }

  function create() {
    var i;
    var s = {
      // ---- 契約欄位 ----
      x: 0, y: 0, w: BOX_W, h: BOX_H,
      alive: true, speed: 1,
      power: { missile: false, double: false, laser: false, option: 0, shield: 0 },
      gauge: 0, shots: [], options: [],
      invul: 0, lives: START_LIVES, score: 0, hi: loadHi(),
      // ---- 內部 ----
      sx: SPAWN_X, sy: SPAWN_Y,
      px: FX.Vec(SPAWN_X), py: FX.Vec(SPAWN_Y),
      ring: new Int16Array(RING * 2), head: 0, ringSteps: 0,
      emit: [], moved: false,
      deathTimer: 0, deathDone: false, debris: [],
      frames: 0, anim: 0, optAnim: 0,
      extendAt: EXTEND_EVERY, shotId: 1,
      capsules: 0, deaths: 0, fired: 0
    };
    for (i = 0; i < SHOTS + MISSILES; i++) s.shots.push(newShot());
    for (i = 0; i < DEBRIS; i++) s.debris.push({ alive: false, px: FX.Vec(0), py: FX.Vec(0), vx: 0, vy: 0, t: 0, tile: 0, x: 0, y: 0 });
    for (i = 0; i < MAX_OPTION; i++) s.options.push({ x: SPAWN_X, y: SPAWN_Y, on: false });
    for (i = 0; i < EMITTERS; i++) s.emit.push({ timer: 0 });

    /* ---------------------------------------------------------- 重置 */
    s.place = function (x, y) {
      s.sx = clamp(x | 0, PLAY.X0, PLAY.X1); s.sy = clamp(y | 0, PLAY.Y0, PLAY.Y1);
      FX.vsetPx(s.px, s.sx); FX.vsetPx(s.py, s.sy);
      s.x = s.sx + BOX_DX; s.y = s.sy + BOX_DY;
      for (var j = 0; j < RING; j++) { s.ring[j * 2] = s.sx; s.ring[j * 2 + 1] = s.sy; }  // [源] 復活時環全填重生座標
      s.head = 0;
      s.syncOptions();
    };
    s.reset = function (hard) {
      s.alive = true; s.deathTimer = 0; s.deathDone = false;
      s.clearShots(); CR.Fx.reset();
      for (var j = 0; j < DEBRIS; j++) s.debris[j].alive = false;
      for (j = 0; j < EMITTERS; j++) s.emit[j].timer = 0;
      if (hard) {
        s.speed = 1; s.gauge = 0;
        s.power.missile = false; s.power.double = false; s.power.laser = false;
        s.power.option = 0; s.power.shield = 0;
      }
      s.place(SPAWN_X, SPAWN_Y);
    };
    s.newGame = function () {
      s.lives = START_LIVES; s.score = 0; s.deaths = 0; s.fired = 0; s.capsules = 0;
      s.extendAt = EXTEND_EVERY; s.invul = 0;
      s.reset(true);
    };
    s.clearShots = function () { for (var j = 0; j < s.shots.length; j++) s.shots[j].alive = false; };

    /* ------------------------------------------------------ Option 位置 */
    // [源] 沒有 Option 時兩個槽仍每幀更新座標（撿到當下就位）
    s.syncOptions = function () {
      for (var j = 0; j < MAX_OPTION; j++) {
        var o = s.options[j];
        o.on = j < s.power.option;
        var h = (s.head - OPT_LAG[j]) % RING; if (h < 0) h += RING;
        o.x = s.ring[h * 2]; o.y = s.ring[h * 2 + 1];
      }
    };

    /* ------------------------------------------------------------ 移動 */
    // [源] 無加速度、斜向不正規化、左右同按淨 0、上下同按下優先、邊界先檢查
    s.move = function (input) {
      var v = SPEED_V[clamp(s.speed, 1, MAX_SPEED) - 1];
      var right = input.held(BTN.RIGHT), left = input.held(BTN.LEFT);
      var down = input.held(BTN.DOWN), up = input.held(BTN.UP);
      var dx = (right ? 1 : 0) - (left ? 1 : 0);
      var dy = down ? 1 : (up ? -1 : 0);                 // 下優先
      s.moved = (dx !== 0 || dy !== 0);
      if (dx) {
        FX.vadd(s.px, dx * v);
        var nx = FX.floorPx(s.px.sub);
        if (nx < PLAY.X0) FX.vsetPx(s.px, PLAY.X0);
        else if (nx > PLAY.X1) FX.vsetPx(s.px, PLAY.X1);
      } else { s.px.frac = 0; }
      if (dy) {
        FX.vadd(s.py, dy * v);
        var ny = FX.floorPx(s.py.sub);
        if (ny < PLAY.Y0) FX.vsetPx(s.py, PLAY.Y0);
        else if (ny > PLAY.Y1) FX.vsetPx(s.py, PLAY.Y1);
      } else { s.py.frac = 0; }
      s.sx = FX.floorPx(s.px.sub); s.sy = FX.floorPx(s.py.sub);
      s.x = s.sx + BOX_DX; s.y = s.sy + BOX_DY;
    };

    /* ------------------------------------------------------------ 射擊 */
    // 主武器槽（標準彈 / 斜彈 / 雷射）每個發射體 2 個；飛彈另外 1 個
    function mainUsed(src) {
      var n = 0;
      for (var j = 0; j < s.shots.length; j++) {
        var t = s.shots[j];
        if (t.alive && t.src === src && t.kind !== K.MISSILE) n++;
      }
      return n;
    }
    function missileUsed(src) {
      for (var j = 0; j < s.shots.length; j++) {
        var t = s.shots[j];
        if (t.alive && t.src === src && t.kind === K.MISSILE) return 1;
      }
      return 0;
    }
    s.mainUsed = mainUsed; s.missileUsed = missileUsed;
    s.countAlive = function (kind) {
      var n = 0;
      for (var j = 0; j < s.shots.length; j++) {
        var t = s.shots[j];
        if (t.alive && (kind === undefined || t.kind === kind)) n++;
      }
      return n;
    };
    function alloc() { for (var j = 0; j < s.shots.length; j++) if (!s.shots[j].alive) return s.shots[j]; return null; }
    function spawn(kind, src, x, y, vx, vy) {
      var t = alloc();
      if (!t) return null;
      t.alive = true; t.kind = kind; t.src = src; t.id = s.shotId++;
      FX.vsetPx(t.px, x); FX.vsetPx(t.py, y);
      t.vx = vx; t.vy = vy; t.x = x | 0; t.y = y | 0;
      t.w = 4; t.h = 4; t.dmg = DMG_SHOT; t.len = 1; t.crawl = false; t.anim = 0;
      if (kind === K.LASER) { t.w = LASER_STEP; t.h = 4; }
      if (kind === K.MISSILE) { t.dmg = DMG_MISSILE; }
      return t;
    }

    function fireFrom(src, ox, oy) {
      var e = s.emit[src], made = 0, free;
      if (e.timer <= 0) {
        free = SLOTS_PER_EMITTER - mainUsed(src);
        if (free > 0) {
          if (s.power.laser) {
            spawn(K.LASER, src, ox + 16, oy + 2, LASER_V, 0); made++;
            if (src === 0) sfx('laser');
          } else {
            spawn(K.SHOT, src, ox + 14, oy + 2, SHOT_V, 0); made++;
            if (src === 0) sfx('shot');
            if (s.power.double && free > 1) spawn(K.DIAG, src, ox + 12, oy, DIAG_VX, DIAG_VY);
          }
          e.timer = FIRE_DELAY;
        }
      }
      if (s.power.missile && missileUsed(src) === 0) {
        spawn(K.MISSILE, src, ox + 6, oy + 5, MIS_FLY_VX, MIS_FLY_VY); made++;
        if (src === 0) sfx('missile');
      }
      return made;
    }

    s.fire = function () {
      if (!s.alive) return 0;
      var n = fireFrom(0, s.sx, s.sy), j;
      for (j = 0; j < MAX_OPTION; j++) {
        if (!s.options[j].on) continue;
        n += fireFrom(j + 1, s.options[j].x + 4, s.options[j].y);
      }
      if (n) s.fired++;
      return n;
    };

    /* -------------------------------------------------------- 能量表 / B */
    // [源] 每第 16 顆膠囊 = 清屏。stage 可在膠囊物件上指定 blue 覆寫。
    s.capsule = function (blue) {
      s.capsules++;
      if (blue === undefined || blue === null) blue = (s.capsules % CLEAR_CAPSULE_EVERY) === 0;
      if (blue) {
        var st = stage();
        if (st && typeof st.clearScreen === 'function') { try { st.clearScreen(); } catch (e) { } }
        sfx('capsule');
        return 'clear';
      }
      s.gauge = (s.gauge >= GAUGE_MAX) ? 1 : s.gauge + 1;   // [源] 第 7 顆回捲到格 1
      sfx('capsule');
      return s.gauge;
    };

    // [源] 已經擁有的能力 → **不消耗膠囊**（gauge 不歸零），回傳 ''
    s.activate = function () {
      var sel = s.gauge;
      if (sel <= 0) return '';
      var got = '';
      switch (sel) {
        case 1: if (s.speed < MAX_SPEED) { s.speed++; got = 'SPEED'; } break;
        case 2: if (!s.power.missile) { s.power.missile = true; got = 'MISSILE'; } break;
        case 3: if (!s.power.double) { s.power.double = true; s.power.laser = false; got = 'DOUBLE'; } break;
        case 4: if (!s.power.laser) { s.power.laser = true; s.power.double = false; got = 'LASER'; } break;
        case 5: if (s.power.option < MAX_OPTION) { s.power.option++; got = 'OPTION'; } break;
        case 6: if (s.power.shield <= 0) { s.power.shield = SHIELD_HP; got = 'SHIELD'; } break;
      }
      if (!got) return '';                 // 已擁有 → 膠囊保留
      s.gauge = 0;
      s.syncOptions();
      sfx('powerup');
      return got;
    };

    /* ------------------------------------------------------------ 受擊 */
    // terrain = true 時護盾無效（[源] 護盾不擋地形）。回傳 true = 這次真的死了
    s.hit = function (terrain) {
      if (!s.alive || s.invul > 0) return false;
      if (!terrain && s.power.shield > 0) { s.power.shield--; sfx('hit'); return false; }
      s.die();
      return true;
    };

    s.die = function () {
      if (!s.alive) return;
      s.alive = false; s.deathTimer = DEATH_FRAMES; s.deathDone = false; s.deaths++;
      boom(s.sx + 8, s.sy + 4);
      var dirs = [[-3, -2], [-1, -3], [2, -3], [3, 1], [-2, 3], [1, 3]], j;
      for (j = 0; j < DEBRIS; j++) {
        var d = s.debris[j];
        d.alive = true; d.t = 0; d.tile = j & 1;
        FX.vsetPx(d.px, s.sx + 4); FX.vsetPx(d.py, s.sy);
        d.vx = FX.v88(dirs[j][0], 0) >> 1; d.vy = FX.v88(dirs[j][1], 0) >> 1;
        d.x = s.sx + 4; d.y = s.sy;
      }
      sfx('die');
    };

    s.addScore = function (n) {
      if (!n) return;
      s.score += n | 0;
      if (s.score > 9999999) s.score = 9999999;
      while (s.score >= s.extendAt) { s.extendAt += EXTEND_EVERY; s.lives++; sfx('extend'); }
      if (s.score > s.hi) { s.hi = s.score; saveHi(s.hi); }
    };

    // [源] rank = (主武器) + Option 數 + (護盾)，0..4；死亡自動歸 0（強化清空）
    s.rank = function () {
      return ((s.power.laser || s.power.double) ? 1 : 0) + s.power.option + (s.power.shield > 0 ? 1 : 0);
    };

    /* ----------------------------------------------------- 每幀：子彈 */
    function stepShots() {
      for (var j = 0; j < s.shots.length; j++) {
        var t = s.shots[j];
        if (!t.alive) continue;
        if (t.kind === K.LASER) {
          if (t.len < LASER_MAX_SEG) t.len++;
          FX.vadd(t.px, t.vx);
          var head = FX.floorPx(t.px.sub);
          t.x = head - t.len * LASER_STEP;               // 碰撞框 = 整條光束（貫通）
          t.y = FX.floorPx(t.py.sub);
          t.w = t.len * LASER_STEP; t.h = 4;
          if (t.x > KILL_X) t.alive = false;
          continue;
        }
        if (t.kind === K.MISSILE) {
          t.anim ^= 1;
          if (!t.crawl) {
            FX.vadd(t.px, t.vx); FX.vadd(t.py, t.vy);
            t.x = FX.floorPx(t.px.sub); t.y = FX.floorPx(t.py.sub);
            if (solidAt(t.x + 2, t.y + 5)) {             // 落地 → 爬行
              t.crawl = true; t.vx = MIS_CRAWL_VX; t.vy = 0;
              var guard = 0;
              while (solidAt(t.x + 2, t.y + 5) && t.y > 0 && guard++ < 16) t.y--;
              FX.vsetPx(t.py, t.y);
            }
          } else {
            FX.vadd(t.px, t.vx);
            t.x = FX.floorPx(t.px.sub);
            var climbed = 0;
            while (solidAt(t.x + 2, t.y + 3) && climbed < 8) { t.y--; climbed++; }
            if (climbed >= 8) { t.alive = false; boom(t.x + 2, t.y + 2); continue; }   // 撞牆
            var drop = 0;
            while (!solidAt(t.x + 2, t.y + 6) && drop < 4) { t.y++; drop++; }          // 跟著地面下坡
            FX.vsetPx(t.py, t.y);
          }
          if (t.x > KILL_X || t.y > 208) t.alive = false;
          continue;
        }
        FX.vadd(t.px, t.vx);
        if (t.vy) FX.vadd(t.py, t.vy);
        t.x = FX.floorPx(t.px.sub); t.y = FX.floorPx(t.py.sub);
        if (t.x > KILL_X || t.x < -8 || t.y < -8 || t.y > 208) t.alive = false;
      }
    }

    function stepDebris() {
      for (var j = 0; j < DEBRIS; j++) {
        var d = s.debris[j];
        if (!d.alive) continue;
        FX.vadd(d.px, d.vx); FX.vadd(d.py, d.vy);
        d.x = FX.floorPx(d.px.sub); d.y = FX.floorPx(d.py.sub);
        if (++d.t >= 60) d.alive = false;
      }
    }

    // [源] 計時器只在「還有空槽」時前進；兩槽都被占用就凍結 ⇒ 實測 21 / 23 交替節奏
    function stepTimers() {
      for (var j = 0; j < EMITTERS; j++) {
        var e = s.emit[j];
        if (e.timer > 0 && mainUsed(j) < SLOTS_PER_EMITTER) e.timer--;
      }
    }

    /* ------------------------------------------------------------ update */
    // 回傳 '' 或 'deathdone'（停頓播完，等 main 決定復活或 GAME OVER）
    s.update = function (g) {
      var input = (g && g.input) || NES.Input;
      s.frames++;
      s.anim = (s.frames >> 2) & 1;
      s.optAnim = ((s.frames / OPT_ANIM) | 0) & 1;       // [源] 2 張、每 8 幀、自由跑
      var ev = '';

      if (s.alive) {
        s.move(input);
        if (s.moved) {                                   // [源] 只有按方向鍵那一幀環才前進
          s.head = (s.head + 1) % RING;
          s.ring[s.head * 2] = s.sx; s.ring[s.head * 2 + 1] = s.sy;
          s.ringSteps++;
        }
        s.syncOptions();
        stepTimers();                                    // 先冷卻遞減，再判斷能不能射（間隔剛好 20 幀）
        // [源] §5-3：A 鍵「邊緣（$05）」**或**「計時器歸零 + 按住（$07）」都能發射 ⇒ 按住 = 自動連射。
        //      發射閘門仍在 fireFrom（`e.timer <= 0` + 該發射體還有空槽），所以連射間隔維持 20 幀，
        //      且子彈還在畫面上時 stepTimers 會凍結計時器 ⇒ 實際節奏 = 子彈壽命 + 20（21 / 23 交替）。
        if (input.pressed(BTN.A) || input.held(BTN.A)) s.fire();
        if (input.pressed(BTN.B)) s.activate();          // [推論] edge 觸發
        if (s.invul > 0) s.invul--;
      } else if (s.deathTimer > 0) {
        stepTimers();
        if (--s.deathTimer === 0) { s.deathDone = true; ev = 'deathdone'; }
      }
      stepShots();
      stepDebris();
      boomUpdate();
      return ev;
    };

    /* -------------------------------------------------------------- 查詢 */
    s.blink = function () { return s.invul > 0 && (((s.invul / BLINK) | 0) & 1) === 1; };
    s.rect = function () { return { x: s.x, y: s.y, w: BOX_W, h: BOX_H }; };
    s.gaugeName = function () { return GAUGE_NAME[s.gauge] || ''; };
    s.speedPx = function () { return SPEED_PX[clamp(s.speed, 1, MAX_SPEED) - 1]; };
    s.checkpointOf = function (camX) { return Math.floor((camX | 0) / CHECKPOINT_PX) * CHECKPOINT_PX; };
    s.state = function () {
      var list = [], j;
      for (j = 0; j < s.shots.length; j++) {
        var t = s.shots[j];
        if (t.alive) list.push({ k: t.kind, x: t.x, y: t.y, w: t.w, h: t.h, src: t.src, len: t.len, crawl: t.crawl });
      }
      var opts = [];
      for (j = 0; j < MAX_OPTION; j++) if (s.options[j].on) opts.push({ x: s.options[j].x, y: s.options[j].y });
      return {
        x: s.sx, y: s.sy, bx: s.x, by: s.y, w: BOX_W, h: BOX_H,
        alive: s.alive, speed: s.speed, speedPx: s.speedPx(),
        gauge: s.gauge, gaugeName: s.gaugeName(),
        power: { missile: s.power.missile, double: s.power.double, laser: s.power.laser,
          option: s.power.option, shield: s.power.shield },
        rank: s.rank(), options: opts, shots: list, shotCount: list.length,
        timers: [s.emit[0].timer, s.emit[1].timer, s.emit[2].timer],
        invul: s.invul, lives: s.lives, score: s.score, hi: s.hi,
        deathTimer: s.deathTimer, deaths: s.deaths, booms: boomCount(),
        capsules: s.capsules, ringSteps: s.ringSteps, moved: s.moved
      };
    };

    s.place(SPAWN_X, SPAWN_Y);
    return s;
  }

  CR.Ship = {
    create: create, K: K, KIND: K,
    SPEED_PX: SPEED_PX, SPEED_V: SPEED_V, MAX_SPEED: MAX_SPEED,
    SHIP_W: SHIP_W, SHIP_H: SHIP_H, BOX_DX: BOX_DX, BOX_DY: BOX_DY, BOX_W: BOX_W, BOX_H: BOX_H,
    PLAY: PLAY, SPAWN_X: SPAWN_X, SPAWN_Y: SPAWN_Y,
    SHOT_V: SHOT_V, LASER_V: LASER_V, KILL_X: KILL_X,
    SLOTS_PER_EMITTER: SLOTS_PER_EMITTER, FIRE_DELAY: FIRE_DELAY,
    LASER_MAX_SEG: LASER_MAX_SEG, LASER_STEP: LASER_STEP,
    MAX_OPTION: MAX_OPTION, RING: RING, OPT_LAG: OPT_LAG, OPT_ANIM: OPT_ANIM,
    DEATH_FRAMES: DEATH_FRAMES, INVUL_FRAMES: INVUL_FRAMES, BLINK: BLINK,
    SHIELD_HP: SHIELD_HP, CHECKPOINT_PX: CHECKPOINT_PX,
    START_LIVES: START_LIVES, EXTEND_EVERY: EXTEND_EVERY, HI_KEY: HI_KEY,
    CLEAR_CAPSULE_EVERY: CLEAR_CAPSULE_EVERY,
    GAUGE_MAX: GAUGE_MAX, GAUGE_NAME: GAUGE_NAME, GAUGE_LABEL: GAUGE_LABEL,

<script>/* games/cruiser/enemies.js */
/*
 * games/cruiser/enemies.js — 《星塵巡航艦》敵人原型 + 出怪表
 * ---------------------------------------------------------------------------
 * 擁有者：stage agent ｜ 依賴：engine/fixed.js（NES.FX）、engine/shmup.js（NES.SH）
 *                      、games/cruiser/chr_world.js（CR.SPR_WORLD）

 *
 * 座標慣例（契約）：敵人的 `x, y, w, h` 是**畫面座標整數碰撞框**（與船同一套，
 * main.js 直接拿去 `NES.SH.aabb`）。世界座標只有「貼地形」的砲台需要（`wx`），

 * 角度依 `NES.SH` 契約：**0 = 右、64 = 下、128 = 左、192 = 上**（一圈 256）。

 *   ① fan    蛇行小蜂（8×8）：編隊 5 隻、正弦上下、**全滅掉紅膠囊**（第 3 隻是標記個體）

 *   ③ zig    之字型飛行體（16×16 兩幀）：每 32 幀換垂直方向
 *   ④ tank   直衝硬殼（16×16）：hp 3、鎖定船的高度直衝、撞船
 *
 * 手感數字來源：docs/research/03_經典遊戲深度解析/16_宇宙巡航艦_沙羅曼蛇.md §10
 *   捲動 0.5 px/幀、敵彈基礎 2.0 px/幀（rank ≥ 2 時 ×1.25 = 2.5）。
 * rank（0..3）由 ship 提供：`CR.ship.rank && CR.ship.rank()`；
 *   rank ≥ 2 → 敵彈速度 ×1.25；rank ≥ 3 → 砲台改「預判射擊」（用船的位移補償）。
 *   **rank 不影響出怪表**（同一關的敵人配置永遠一樣，只有彈速 / 瞄準法改變）。
 *
 * 碰撞框：16×16 的敵人用契約的 12×12（置中），8×8 的小蜂用 8×8；敵彈 4×4（精靈 8×8）。

(function () {

  var CR = window.CR = window.CR || {};
  var FX = NES.FX, SH = NES.SH;
  if (!FX) throw new Error('games/cruiser/enemies.js 需要 engine/fixed.js');
  if (!SH || !SH.aim) throw new Error('games/cruiser/enemies.js 需要 engine/shmup.js（NES.SH）');

  /* ---------------------------------------------------------- 規格表 */
  var SPEC = {
    fan:    { w: 8,  h: 8,  hp: 1, score: 100, small: true,  size: 8,  pal: 2 },
    turret: { w: 12, h: 12, hp: 2, score: 200, small: true,  size: 16, pal: 3 },
    zig:    { w: 12, h: 12, hp: 1, score: 150, small: true,  size: 16, pal: 2 },
    tank:   { w: 12, h: 12, hp: 3, score: 400, small: false, size: 16, pal: 3 },
    // fix3（使用者回饋「一開始還沒吃到強化就一堆撞了會死的礁石」）：
    // 小行星帶的小碎塊改成**可破壞的敵人**（hp 2、100 分），只有 16×16 大隕石維持地形。

  };
  var KINDS = ['fan', 'turret', 'zig', 'tank', 'rock'];
  // 研究 §3-3 [源]「**紅色單體**：一般敵人多是灰 / 藍配色，紅色版本必掉膠囊」。
  // R2 原本只實作「編隊全滅掉膠囊」⇒ qa2 的機器人 2400 幀 0 顆膠囊、全程速度 1（`capsuleSeq()` 恆 0），
  // 等於沒有強化管道。改用 spr1（ship 的 紅 $16 / 橘 $28 / 白 $30，已在場上）畫紅色版本，0 新顏色、0 新磚。
  var PAL_DROP = 1;

  var FAN_VX = -FX.v88(1, 128);        // -1.5 px/幀
  var FAN_AMP = 20;                    // 正弦振幅（px）
  var FAN_STEP = 3;                    // 每幀相位（256 = 一圈 ⇒ 約 85 幀一圈）

  var TANK_VX = -FX.v88(2, 128);       // -2.5 px/幀
  var ROCK_VX = -FX.v88(1, 0);         // 小隕石 -1.0 px/幀（比捲動 0.5 快一倍，會「迎面飄來」）
  var TURRET_PERIOD = 90;              // 每 90 幀射 1 彈
  // QA R2 P2-3：連滿強化都過不去 ⇒ **砲台射擊週期 90 → 130 幀（敵彈密度 −30%）**。
  // fix3 三段式改版後**砲台只存在於要塞（世界欄 248 起）**，所以放寬區直接涵蓋 248..383；
  // 空戰段 / 小行星帶完全沒有砲台（＝沒有敵彈），`spawnTest` 生在別處的砲台維持 90（研究 §10 原值）。
  var EASY_PERIOD = 130;
  var EASY_COL0 = 248, EASY_COL1 = 383;          // 世界欄（含）；砲台站在這段裡就放寬（＝整個要塞）
  function turretPeriod(wx) {
    var c = (wx | 0) >> 3;
    return (c >= EASY_COL0 && c <= EASY_COL1) ? EASY_PERIOD : TURRET_PERIOD;
  }
  var BULLET_BASE = FX.v88(2, 0);      // 敵彈基礎 2.0 px/幀（研究 16 §10）
  var LEAD_FRAMES = 20;                // rank ≥ 3 預判：往船的位移方向外推 20 幀

  var GAME_H = 208;                    // 遊戲區高（HUD 在下方 32 線）

  var ctx = null;          // stage 注入的介面
  var tmpV = { vx: 0, vy: 0, a: 0 };   // aim 的重複使用物件（每幀零配置）

  function rank() {
    var s = CR.ship;
    if (s && typeof s.rank === 'function') { var r = s.rank() | 0; return r < 0 ? 0 : (r > 3 ? 3 : r); }
    return 0;
  }
  function bulletSpeed() { return (rank() >= 2) ? ((BULLET_BASE * 5) >> 2) : BULLET_BASE; }   // ×1.25

  /* ---------------------------------------------------------- 編隊記帳 */
  // fan 編隊：5 隻同一個 grp；全滅（left === 0）→ 在標記個體（第 3 隻）的死亡位置掉紅膠囊。
  var groups = {};
  var nextGrp = 1;
  function resetGroups() { groups = {}; nextGrp = 1; }

  /* ---------------------------------------------------------- 物件 */
  function make(i) {
    var e = {
      i: i, kind: 'fan', alive: false,
      x: 0, y: 0, w: 8, h: 8, hp: 1, score: 0, small: true,
      size: 8, pal: 2, flipV: false,
      xs: FX.Vec(0), ys: FX.Vec(0), vx: 0, vy: 0,
      wx: 0, anchored: false, slot: 0,
      t: 0, phase: 0, y0: 0, grp: 0, marked: false, drop: 0, fireT: 0, period: TURRET_PERIOD, flash: 0,
      boss: false, onHit: null, onKill: null, customStep: null, customDraw: null,
      hit: null, kill: null
    };
    e.hit = function (dmg) {
      if (!e.alive) return false;
      dmg = (dmg === undefined ? 1 : dmg) | 0;
      if (e.onHit) return e.onHit(dmg);                    // 魔王部位自己算傷害
      e.hp -= dmg;
      e.flash = 4;
      if (e.hp <= 0) { e.kill(); return true; }
      return false;
    };
    e.kill = function () {
      if (!e.alive) return;
      if (e.onKill) { e.onKill(); return; }                // 魔王部位自己處理死亡
      e.alive = false;
      ctx.boom(e.x + (e.size >> 1), e.y + (e.size >> 1));
      ctx.addScore(e.score);
      if (e.drop) ctx.dropCapsule(e.x, e.y);
      var g = groups[e.grp];
      if (g) {
        g.left--;
        if (e.marked) { g.dropX = e.x; g.dropY = e.y; }
        if (g.left <= 0 && !g.dropped) {
          g.dropped = true;
          ctx.dropCapsule(g.dropX, g.dropY);               // 編隊全滅 → 掉膠囊
        }
      }
      ctx.freeEnemy(e);
    };

  }

  /* ---------------------------------------------------------- 生成 */
  function clampY(y) { return SH.clamp(y | 0, 0, GAME_H - 16); }

  // spawn(kind, x, y, opt) → enemy | null（池滿 / 同屏上限 → null，NES 風：沒槽就不生成）
  function spawn(kind, x, y, opt) {
    if (!ctx) return null;
    var sp = SPEC[kind];
    if (!sp) throw new Error('CR.Enemies.spawn：未知敵人種類 ' + kind);
    var e = ctx.allocEnemy();
    if (!e) return null;
    opt = opt || {};
    e.kind = kind;
    e.size = sp.size; e.pal = sp.pal; e.small = sp.small;
    e.hp = (opt.hp === undefined ? sp.hp : opt.hp) | 0;
    e.score = sp.score;
    e.w = sp.w; e.h = sp.h;
    e.x = x | 0; e.y = y | 0;
    FX.vsetPx(e.xs, x | 0); FX.vsetPx(e.ys, y | 0);
    e.t = 0; e.flash = 0; e.flipV = false; e.anchored = false;
    e.grp = opt.grp || 0; e.marked = !!opt.marked; e.drop = opt.drop || 0;
    if (e.drop) e.pal = PAL_DROP;                          // [源] 紅色單體 = 必掉膠囊的視覺訊號
    e.phase = (opt.phase || 0) & 255;
    e.y0 = y | 0;
    e.vx = 0; e.vy = 0; e.fireT = 0;
    e.boss = false; e.onHit = null; e.onKill = null; e.customStep = null; e.customDraw = null;

    if (kind === 'fan') {
      e.vx = FAN_VX;
    } else if (kind === 'turret') {
      e.anchored = true;
      e.wx = (opt.wx === undefined ? (ctx.stage.camX + x) : opt.wx) | 0;
      e.flipV = !!opt.ceiling;                             // 貼天花板：上下翻轉
      e.period = turretPeriod(e.wx);
      e.fireT = (opt.fireT === undefined ? e.period : opt.fireT) | 0;
    } else if (kind === 'zig') {
      e.vx = ZIG_VX;
      e.vy = (opt.dir === -1 ? -ZIG_VY : ZIG_VY);
    } else if (kind === 'tank') {
      e.vx = TANK_VX;
      var sh = ctx.ship();
      if (sh && sh.alive !== false) { e.y = e.y0 = clampY(sh.y - 6); FX.vsetPx(e.ys, e.y); }
    } else if (kind === 'rock') {
      e.vx = ROCK_VX;                                      // 直線飄，不追人、不開火
    }

  }

  // 編隊：n 隻蛇行小蜂，相位錯開；第 3 隻（index 2）是標記個體，全滅時在它的死亡位置掉膠囊
  function spawnFan(x, y, opt) {
    opt = opt || {};
    var n = opt.n || 5, made = [], i, grp = nextGrp++;
    groups[grp] = { left: 0, dropped: false, dropX: x, dropY: y, total: n, id: grp };
    for (i = 0; i < n; i++) {
      var e = spawn('fan', x + i * 12, y, { grp: grp, marked: (i === 2), phase: (i * 20) & 255 });
      if (!e) break;
      groups[grp].left++;
      made.push(e);
    }
    groups[grp].total = made.length;
    if (!made.length) delete groups[grp];
    made.grp = grp;
    return made;
  }

  /* ---------------------------------------------------------- 每幀 */
  function turretFire(e) {
    var sh = ctx.ship();
    if (!sh || sh.alive === false) return null;
    if (e.x < -16 || e.x > 272) return null;
    var tx = sh.x + (sh.w >> 1), ty = sh.y + (sh.h >> 1);
    if (rank() >= 3) {                                     // rank 3：預判射擊
      var v = ctx.shipVel();
      tx += (v.vx * LEAD_FRAMES) >> 4;                     // shipVel 以 1/16 px/幀 回報
      ty += (v.vy * LEAD_FRAMES) >> 4;

    return ctx.fire(e.x + 6, e.y + 6, tmpV.vx, tmpV.vy);
  }

  function step(e) {
    if (e.customStep) { e.customStep(e); return; }         // 魔王部位（boss.js）自己走
    e.t++;
    if (e.flash > 0) e.flash--;

    if (e.kind === 'fan') {
      FX.vadd(e.xs, e.vx);
      e.x = FX.vpx(e.xs);
      e.phase = (e.phase + FAN_STEP) & 255;
      e.y = e.y0 + ((SH.sin(e.phase) * FAN_AMP) >> 8);

    } else if (e.kind === 'turret') {
      e.x = e.wx - ctx.stage.camX;                         // 貼地形：隨捲動往左
      if (--e.fireT <= 0) { e.fireT = e.period || TURRET_PERIOD; turretFire(e); }

    } else if (e.kind === 'zig') {
      FX.vadd(e.xs, e.vx);
      FX.vadd(e.ys, e.vy);
      e.x = FX.vpx(e.xs); e.y = FX.vpx(e.ys);
      if (e.t % ZIG_PERIOD === 0) e.vy = -e.vy;            // 每 32 幀換向
      if (e.y < 0) { e.y = 0; FX.vsetPx(e.ys, 0); e.vy = ZIG_VY; }
      if (e.y > GAME_H - 16) { e.y = GAME_H - 16; FX.vsetPx(e.ys, e.y); e.vy = -ZIG_VY; }

    } else if (e.kind === 'tank' || e.kind === 'rock') {
      FX.vadd(e.xs, e.vx);
      e.x = FX.vpx(e.xs);
    }

    // 離開畫面（或砲台被捲走）→ 回收，不計分、不算「編隊全滅」
    if (e.x < -24 || e.x > 320) {
      e.alive = false;
      var g = groups[e.grp];
      if (g) g.left--;
      ctx.freeEnemy(e);
    }
  }

  /* ---------------------------------------------------------- 繪製 */
  var sp = { x: 0, y: 0, tile: 0, pal: 0, flipH: false, flipV: false, behind: false, prio: 3 };
  function put(oam, x, y, tile, pal, flipV, prio) {
    sp.x = x; sp.y = y; sp.tile = tile; sp.pal = pal;
    sp.flipH = false; sp.flipV = !!flipV; sp.behind = false; sp.prio = prio;
    oam.add(sp);
  }
  // 16×16 = 4 顆 8×8 精靈；flipV 時上下對調並各自翻轉（砲台貼天花板用）
  function draw16(oam, t, x, y, pal, flipV, prio) {
    if (!flipV) {
      put(oam, x, y, t[0], pal, false, prio);
      put(oam, x + 8, y, t[1], pal, false, prio);
      put(oam, x, y + 8, t[2], pal, false, prio);
      put(oam, x + 8, y + 8, t[3], pal, false, prio);
    } else {
      put(oam, x, y, t[2], pal, true, prio);
      put(oam, x + 8, y, t[3], pal, true, prio);
      put(oam, x, y + 8, t[0], pal, true, prio);
      put(oam, x + 8, y + 8, t[1], pal, true, prio);
    }
  }

  var PRIO_ENEMY = 3;

  function draw(e, oam, frame) {
    if (e.customDraw) { e.customDraw(e, oam, frame); return; }
    var S = ctx.S, f = ((frame >> 3) & 1);
    var pal = e.pal;
    if (e.flash > 0 && (e.flash & 1)) pal = (pal === 2) ? 3 : 2;   // 受擊換色組＝反白
    if (e.kind === 'fan') {
      put(oam, e.x, e.y, f ? S.BEE1 : S.BEE0, pal, false, PRIO_ENEMY);
    } else if (e.kind === 'turret') {
      var open = (e.fireT <= 20);                          // 射擊前 20 幀砲管伸出
      draw16(oam, open ? S.TUR1 : S.TUR0, e.x - 2, e.y - 2, pal, e.flipV, PRIO_ENEMY);
    } else if (e.kind === 'zig') {
      draw16(oam, f ? S.ZIG1 : S.ZIG0, e.x - 2, e.y - 2, pal, false, PRIO_ENEMY);
    } else if (e.kind === 'tank') {
      draw16(oam, (e.flash > 0) ? S.TANK1 : S.TANK0, e.x - 2, e.y - 2, pal, false, PRIO_ENEMY);
    } else if (e.kind === 'rock') {
      // hp 2 → 1 換成「裂開」那一張（研究 §10-6：每吃一點傷害換一張圖 = 最便宜的命中回饋）
      put(oam, e.x, e.y, (e.hp <= 1) ? S.MROCK1 : S.MROCK0, pal, false, PRIO_ENEMY);
    }
  }

  /* ---------------------------------------------------------- 出怪表 */
  // `NES.SH.Spawner` 的格式 `[{col, fn}]`，`fn(ctx, col, entry)`，camCol 走到 col 時單次觸發。
  // 捲動 0.5 px/幀 ⇒ **1 欄 = 16 幀**；事件欄 c 生成的敵人在畫面右緣外（＝世界欄 c + 34）。
  //
  // ── fix3：關卡 1 依研究 §7-1 改成「三段式」 ──────────────────────────────────
  // 使用者真機回饋：「一開始還沒吃到任何武器加強就一堆礁石（撞了會死）…宇宙巡航艦前半段是
  // 空曠的宇宙，會有小怪物打出來吃加強道具，最後才進到比較多怪物的地方。」
  //
  //   ① 空戰段  camX    0..1280（欄   0..160）：純星空。**無地形 / 無隕石 / 無砲台 ⇒ 敵彈 0 發**。
  //      只有 fan 編隊（全滅掉膠囊）11 波 + 紅色單體（必掉）3 隻 + 少量 zig；事件間隔 8~10 欄
  //      （128~160 幀）⇒ 玩家在進本關段前就能湊齊 SPEED / MISSILE / OPTION。
  //   ② 本關段  camX 1280..2560（欄 160..320）：先小行星帶（可破壞的 `rock` + 大隕石通道），
  //      再進要塞（天花板 / 地板凸起 + 砲台 7 座 + tank 硬殼）；強度逐段爬升（研究 11 §⑯）。
  //   ③ 魔王段  camX 2560..3072（欄 320..384）：核心室。欄 300..323 是魔王前的「呼吸區」。
  //
  // 硬規則（fix2 已驗收，本輪維持）：檢查點（欄 0 / 64 / 128 / 192 / 256 / 320）之後
  //   22 欄內不放砲台事件、14 欄內至少一隻紅色單體（死亡後的回血路徑）。
  function buildTable(stage) {
    var T = [];
    function at(col, fn) { T.push({ col: col, fn: fn }); }
    function fan(y) { return function () { spawnFan(272, y); }; }
    // zig(y, dir, red) / zigs(list, redIdx)：`red` 的那一隻 = **紅色單體**（hp 1，打掉必掉膠囊）
    function zig(y, dir, red) { return function () { spawn('zig', 268, y, { dir: dir, drop: red ? 1 : 0 }); }; }
    function redzig(y) { return zig(y, 1, true); }        // ★ 紅色單體
    function zigs(list, redIdx) {
      if (redIdx === undefined) redIdx = -1;
      return function () {
        for (var i = 0; i < list.length; i++) {
          spawn('zig', 268 + i * 10, list[i], { dir: (i & 1) ? -1 : 1, drop: (i === redIdx) ? 1 : 0 });
        }
      };
    }
    // tank(y) 一般硬殼（藍白）；tank(y, true) = **紅色單體**，打掉必掉膠囊（研究 §3-3 [源]）
    function tank(y, red) { return function () { spawn('tank', 268, y, red ? { drop: 1 } : {}); }; }
    // rocks([y…])：可破壞小隕石（hp 2 / 100 分）—— 只出現在小行星帶
    function rocks(list) {
      return function () {
        for (var i = 0; i < list.length; i++) spawn('rock', 268 + i * 12, list[i], {});
      };
    }
    // 砲台貼在「畫面右緣再往右 2 欄」的地形上（stage 依該欄的天花板 / 地板算 y）
    function turret(ceiling) {
      return function (c, col) { stage.spawnTurretAt(col + 34, ceiling); };
    }

    // ── ① 空戰段（欄 0..160 ＝ camX 0..1280）：純星空、零敵彈、膠囊提款機 ──────
    // 膠囊管道：fan 編隊 11 波（全滅各 1 顆）+ **紅色單體 7 隻**（1 發即掉）= 最多 18 顆。
    // 紅色單體是「保底」管道（hp 1、必掉），編隊全滅是「獎勵」管道 ⇒ 一般玩家自然可拿 7~10 顆，
    // 足夠買 SPEED(1) + MISSILE(2) + OPTION(5)（能量表格位越後面越貴，見研究 §3）。
    // 波距 14 欄 = 224 幀（一波 fan 在畫面上存活 ≈ 229 幀 ⇒ 同屏幾乎不會超過一波，不會撞到 10 隻上限）。
    // fan 的 y0 一律落在 56..128：正弦振幅 ±20 ⇒ 實際佔 36..148，上下各留 20 px 以上的逃生空間
    // （實測 y0 = 144 的那一波會把玩家壓在畫面底緣 y 169 附近，機器人連死 3 次）。
    at(12, fan(88));
    at(19, redzig(128));                  // ★ 紅色單體（1 發打掉、必掉膠囊）
    at(26, fan(56));
    at(33, redzig(112));                  // ★
    at(40, fan(128));
    at(47, zig(40, 1));
    at(54, fan(72));
    at(61, redzig(136));                  // ★
    at(68, fan(96));
    at(75, redzig(64));                   // ★（檢查點 欄 64 + 11）
    at(82, fan(120));
    at(89, zigs([48, 144]));
    at(96, fan(64));
    at(103, redzig(120));                 // ★
    at(110, fan(104));
    at(117, redzig(80));                  // ★
    at(124, fan(112));
    at(131, redzig(96));                  // ★（檢查點 欄 128 + 3）
    at(138, fan(72));
    at(145, zigs([56, 124]));
    at(152, fan(100));

    // ── ②A 本關段・小行星帶（欄 160..213 ＝ 世界欄 194..247）──────────────────
    // 大隕石是地形（stage1.js 的 BIG_ROCKS，永遠留 ≥ 18 列的中央通道）；
    // 這裡生的是**可打破的**小隕石，第一次出現時單獨出場（研究 11 §⑯「新元素只有它」）。
    at(162, rocks([64, 120]));
    at(170, fan(96));
    at(177, rocks([48, 104, 152]));
    at(184, zigs([72, 136]));
    at(191, rocks([56, 96, 144]));
    at(198, redzig(112));                 // ★（檢查點 欄 192 + 6）
    at(205, fan(72));
    at(211, rocks([40, 88, 128]));

    // ── ②B 本關段・星際要塞（欄 214..293 ＝ 世界欄 248..327）──────────────────
    // 砲台 7 座：世界欄 250 / 258 / 266 / 274 / 282 / 313 / 318（全部避開檢查點後 22 欄）。
    at(216, turret(false));               // 世界欄 250（地板）
    at(220, fan(128));
    at(224, turret(true));                // 世界欄 258（天花板）
    at(230, zigs([64, 104, 144], 1));
    at(232, turret(false));               // 世界欄 266
    at(238, tank(96));                    // 硬殼第一次登場（此前完全沒有）
    at(240, turret(true));                // 世界欄 274
    at(244, fan(112));
    at(248, turret(false));               // 世界欄 282
    at(252, zigs([56, 120]));
    at(258, redzig(80));                  // ★（檢查點 欄 256 + 2）
    at(264, fan(96));
    at(268, tank(72, true));              // ★ 紅色硬殼
    at(274, zigs([48, 96, 140], 2));
    at(279, turret(false));               // 世界欄 313
    at(281, fan(120));
    at(284, turret(true));                // 世界欄 318（上下對射 = 本關高潮）
    at(288, tank(120));
    at(293, zigs([72, 112, 148], 0));     // ★ 紅色單體（進呼吸區前最後一個）

    // ── ③ 呼吸區 + 魔王段（欄 300..352 ＝ camX 2400..2816）────────────────────
    // 研究 11 §⑯-2 第 ⑤ 段：魔王前要有一段幾乎沒有敵人的開闊區。
    at(300, fan(88));                     // 呼吸前最後一波補給
    at(324, redzig(96));                  // ★（檢查點 欄 320 + 4）＝ 魔王前回血點
    at(332, fan(120));                    // 最後補給（必掉）
    // 欄 333..352 完全淨空 ⇒ 玩家有 320 幀調整位置、看能量表，然後魔王進場
    return T;
  }

  /* ---------------------------------------------------------- 匯出 */
  CR.Enemies = {
    KINDS: KINDS,
    SPEC: SPEC,
    TURRET_PERIOD: TURRET_PERIOD, EASY_PERIOD: EASY_PERIOD, turretPeriod: turretPeriod, PAL_DROP: PAL_DROP,
    ZIG_PERIOD: ZIG_PERIOD,
    BULLET_BASE: BULLET_BASE,
    ROCK_VX: ROCK_VX,
    FAN_AMP: FAN_AMP,
    bulletSpeed: bulletSpeed,
    rank: rank,
    make: make,
    init: function (c) { ctx = c; resetGroups(); },
    reset: resetGroups,
    groups: function () { return groups; },
    groupOf: function (id) { return groups[id] || null; },
    spawn: spawn,
    spawnFan: spawnFan,
    step: step,
    draw: draw,
    draw16: draw16,
    put: put,
    buildTable: buildTable
  };
})();

</script>
<script>/* games/cruiser/boss.js */
/*
 * games/cruiser/boss.js — 《星塵巡航艦》關卡 1 魔王「核心要塞」（CORE FORTRESS）
 * ---------------------------------------------------------------------------
 * 擁有者：stage agent ｜ 依賴：engine/{fixed,shmup}.js、games/cruiser/{chr_world,enemies}.js
 * 由 stage1.js 驅動（stage 提供物件池、敵彈、爆炸、背景寫入）。
 *
 * 48×48 的艦體用「**背景磚 6×6**（核心室捲動停止 ⇒ 名稱表就是畫布）」畫，
 * 只有可打擊 / 會動的部位用精靈：外殼板 4 片（各 4 顆 8×8）、核心（4 顆）、雷射砲口（3 顆）。
 * ⇒ 每條掃描線最多 4 顆魔王精靈（上排兩片板 / 中排核心 / 下排兩片板），
 *   留足空間給船、自機彈、敵彈，不會一進魔王戰就整片閃爍。
 *
 * 血量（總控依研究 16 §10 調整）：**總血量 24** = 外殼板 4 片 × 4 + 核心 8。
 * 三階段 + **每掉一階段換一張艦體形變圖**（HULL_MAPS[1] → [2] → [3]，同一組背景磚重排）：
 *   進場   從畫面右緣滑入 60 幀（只有精靈會動；落位那一幀一次寫入 36 byte 艦體）
 *   階段 1 外殼板 4 片各 hp 4；**只有板子可被打中**（核心尚未配置）
 *   階段 2 核心露出 hp 8；週期開合：開 60 幀（可打）/ 合 90 幀（無敵）；開啟瞬間放環形 8 彈
 *   階段 3 核心 hp ≤ 3：三連雷射（3 條橫線用背景磚拼、預告 30 幀 → 射 60 幀 → 冷卻 60 幀）
 *          + 每輪環形 8 彈
 *   死亡   大爆炸 90 幀 → `CR.stage.cleared = true`
 *
 * 雷射的碰撞：3 條線各是 `CR.stage.bullets` 裡的一顆「大子彈」（w = 砲口到畫面左緣、h = 6），
 * main.js 既有的「敵彈 × 船」判定直接生效，不必為魔王加特例；畫面則走背景磚，不吃精靈。
 * 角度依 `NES.SH`：0 = 右、64 = 下、128 = 左、192 = 上。
 */
(function () {
  'use strict';
  var NES = window.NES = window.NES || {};
  var CR = window.CR = window.CR || {};
  var FX = NES.FX, SH = NES.SH;
  if (!FX) throw new Error('games/cruiser/boss.js 需要 engine/fixed.js');
  if (!SH || !SH.vel) throw new Error('games/cruiser/boss.js 需要 engine/shmup.js（NES.SH）');

  var W = 48, H = 48;
  var HOME_X = 176, HOME_Y = 72;          // 落位座標（8 對齊：col 22、row 9）
  var START_X = 256;
  var ENTER_FRAMES = 60;
  var ENTER_V = -FX.v88(1, 85);           // (256-176)/60 ≈ 1.333 px/幀

  var PLATE_HP = 4, CORE_HP = 8, PHASE3_HP = 3;     // 總血量 4×4 + 8 = 24
  var PLATE_SCORE = 500, CORE_SCORE = 5000;
  var OPEN_FRAMES = 60, SHUT_FRAMES = 90;
  var WARN_FRAMES = 30, BEAM_FRAMES = 60, COOL_FRAMES = 60;
  var DEATH_FRAMES = 90;
  var RING_N = 8;
  var RING_SPEED = FX.v88(1, 32);         // 1.125 px/幀
  var AIM_SPEED = FX.v88(2, 0);           // 2.0 px/幀（研究 16 §10 敵彈基礎速度）
  var P1_FIRE = 100;

  var PLATE_OFF = [[0, 0], [32, 0], [0, 32], [32, 32]];   // 四角
  var CORE_OFF = [16, 16];                                 // 正中
  var LASER_OFF = [8, 24, 40];                             // 三條雷射的相對 y（對齊磚列）

  // 艦體 6×6 背景磚配置：每個階段一張（形變）。名稱由 stage 解析成磚索引。
  var HULL_MAPS = {
    1: [                                     // 階段 1：完整裝甲
      ['HULLC', 'HULL', 'HULLR', 'HULLR', 'HULL', 'HULLC'],
      ['HULL', 'HULL', 'VENT', 'VENT', 'HULL', 'HULL'],
      ['HULLR', 'VENT', 'HULL', 'HULL', 'VENT', 'HULLR'],
      ['HULLR', 'VENT', 'HULL', 'HULL', 'VENT', 'HULLR'],
      ['HULL', 'HULL', 'VENT', 'VENT', 'HULL', 'HULL'],
      ['HULLC', 'HULL', 'HULLR', 'HULLR', 'HULL', 'HULLC']
    ],
    2: [                                     // 階段 2：外殼脫落、散熱柵大開
      ['GRID', 'VENT', 'HULLC', 'HULLC', 'VENT', 'GRID'],
      ['VENT', 'HULLR', 'VENT', 'VENT', 'HULLR', 'VENT'],
      ['HULLC', 'VENT', 'HULL', 'HULL', 'VENT', 'HULLC'],
      ['HULLC', 'VENT', 'HULL', 'HULL', 'VENT', 'HULLC'],
      ['VENT', 'HULLR', 'VENT', 'VENT', 'HULLR', 'VENT'],
      ['GRID', 'VENT', 'HULLC', 'HULLC', 'VENT', 'GRID']
    ],
    3: [                                     // 階段 3：結構崩壞、只剩骨架與核心座
      ['GRID', 'GRID', 'VENT', 'VENT', 'GRID', 'GRID'],
      ['GRID', 'HULLC', 'HULLR', 'HULLR', 'HULLC', 'GRID'],
      ['VENT', 'HULLR', 'HULL', 'HULL', 'HULLR', 'VENT'],
      ['VENT', 'HULLR', 'HULL', 'HULL', 'HULLR', 'VENT'],
      ['GRID', 'HULLC', 'HULLR', 'HULLR', 'HULLC', 'GRID'],
      ['GRID', 'GRID', 'VENT', 'VENT', 'GRID', 'GRID']
    ]
  };

  var ctx = null;
  var B = null;

  function fresh() {
    return {
      active: false, dead: false,
      phase: 0,                        // 0 進場 / 1 外殼 / 2 核心 / 3 三連雷射 / 4 死亡
      t: 0, x: START_X, y: HOME_Y, xs: FX.Vec(START_X),
      hullPhase: 0,
      plates: [null, null, null, null], platesLeft: 0,
      core: null, coreHp: CORE_HP, coreOpen: false, coreT: SHUT_FRAMES,
      fireT: P1_FIRE,
      laserState: 'idle', laserT: 0, laserRows: [-1, -1, -1], laserBullets: [null, null, null],
      deathT: 0
    };
  }

  function totalHp() {
    var s = 0, i;
    for (i = 0; i < 4; i++) if (B.plates[i]) s += B.plates[i].hp;
    if (B.phase >= 2) s += (B.coreHp > 0 ? B.coreHp : 0);
    else s += CORE_HP;
    return s;
  }

  /* ---------------------------------------------------------- 部位 */
  function makePlate(i) {
    var e = ctx.allocPart();
    if (!e) return null;
    e.kind = 'bplate'; e.boss = true; e.small = false;
    e.size = 16; e.pal = 3;
    e.hp = PLATE_HP; e.score = PLATE_SCORE;
    e.w = 16; e.h = 16;
    e.x = B.x + PLATE_OFF[i][0]; e.y = B.y + PLATE_OFF[i][1];
    e.slot = i; e.flash = 0;
    e.onHit = function (dmg) {
      e.hp -= dmg; e.flash = 4;
      if (e.hp <= 0) { e.kill(); return true; }
      return false;
    };
    e.onKill = function () {
      if (!e.alive) return;
      e.alive = false;
      ctx.boom(e.x + 8, e.y + 8);
      ctx.addScore(PLATE_SCORE);
      B.plates[e.slot] = null;
      B.platesLeft--;
      ctx.freeEnemy(e);
      if (B.platesLeft <= 0) toPhase2();
    };
    e.customStep = function () {
      e.x = B.x + PLATE_OFF[e.slot][0]; e.y = B.y + PLATE_OFF[e.slot][1];
      if (e.flash > 0) e.flash--;
    };
    e.customDraw = function (o, oam) { drawPlate(o, oam); };
    e.alive = true;
    return e;
  }

  function makeCore() {
    var e = ctx.allocPart();
    if (!e) return null;
    e.kind = 'bcore'; e.boss = true; e.small = false;
    e.size = 16; e.pal = 2;
    e.hp = CORE_HP; e.score = CORE_SCORE;
    e.w = 16; e.h = 16;
    e.x = B.x + CORE_OFF[0]; e.y = B.y + CORE_OFF[1];
    e.flash = 0;
    e.onHit = function (dmg) {
      if (!B.coreOpen) return false;                       // 合上 = 無敵
      B.coreHp -= dmg; e.hp = B.coreHp; e.flash = 4;
      if (B.coreHp <= PHASE3_HP && B.phase === 2) toPhase3();
      if (B.coreHp <= 0) { e.kill(); return true; }
      return false;
    };
    e.onKill = function () {
      if (!e.alive) return;
      e.alive = false;
      ctx.freeEnemy(e);
      ctx.addScore(CORE_SCORE);
      toDeath();
    };
    e.customStep = function () {
      e.x = B.x + CORE_OFF[0]; e.y = B.y + CORE_OFF[1];
      if (e.flash > 0) e.flash--;
    };
    e.customDraw = function (o, oam, frame) { drawCore(o, oam, frame); };
    e.alive = true;
    return e;
  }

  /* ---------------------------------------------------------- 階段切換 */
  function toPhase2() {
    B.phase = 2; B.t = 0;
    B.coreHp = CORE_HP;
    B.coreOpen = false; B.coreT = SHUT_FRAMES;
    B.core = makeCore();
    drawHull(2);                                           // 形變圖 ②
  }
  function toPhase3() {
    B.phase = 3;
    B.laserState = 'warn'; B.laserT = WARN_FRAMES;
    B.coreOpen = true; B.coreT = OPEN_FRAMES;
    drawHull(3);                                           // 形變圖 ③
    ring();
  }
  function toDeath() {
    B.phase = 4;
    B.deathT = DEATH_FRAMES;
    clearLaser();
    // fix3（使用者回饋「設計太難了」）：核心爆掉的瞬間**清空殘留敵彈**。
    // 原本 90 幀的爆炸演出期間，先前放出的環形彈還在飛 ⇒ 打贏了卻在勝利動畫裡被殘彈打死
    // （機器人實測：boss phase 4、被 (−1.1, 0) 的環形彈打中 ⇒ 魔王又滿血重來）。
    var pool = ctx.stage && ctx.stage.bullets;
    if (pool && pool.items) {
      for (var j = 0; j < pool.items.length; j++) if (pool.items[j].alive) ctx.freeBullet(pool.items[j]);
    }
    for (var i = 0; i < 4; i++) {
      var p = B.plates[i];
      if (p && p.alive) { p.alive = false; ctx.freeEnemy(p); }
      B.plates[i] = null;
    }
    B.platesLeft = 0;
  }

  /* ---------------------------------------------------------- 攻擊 */
  var tv = { vx: 0, vy: 0, a: 0 };
  function ring() {
    var cx = B.x + 24, cy = B.y + 24, i;
    for (i = 0; i < RING_N; i++) {
      SH.vel(((i * 256 / RING_N) | 0) & 255, RING_SPEED, tv);
      ctx.fire(cx, cy, tv.vx, tv.vy);
    }
  }
  function aimedShot() {
    var sh = ctx.ship();
    if (!sh || sh.alive === false) return;
    var mx = B.x - 4, my = B.y + 24;
    SH.aim(mx, my, sh.x + (sh.w >> 1), sh.y + (sh.h >> 1), AIM_SPEED, tv);
    ctx.fire(mx, my, tv.vx, tv.vy);
  }

  /* ---------------------------------------------------------- 雷射（背景磚） */
  function laserCols() { return B.x >> 3; }               // 螢幕欄 0 .. bossCol-1

  function paintLaser(tileName) {
    var cols = laserCols(), i, c;
    for (i = 0; i < 3; i++) {
      var r = (B.y + LASER_OFF[i]) >> 3;
      B.laserRows[i] = r;
      for (c = 0; c < cols; c++) ctx.bgWrite(c, r, tileName);
    }
  }
  function clearLaser() {
    var cols = laserCols(), i, c;
    for (i = 0; i < 3; i++) {
      var r = B.laserRows[i];
      if (r >= 0) { for (c = 0; c < cols; c++) ctx.bgRestore(c, r); B.laserRows[i] = -1; }
      var b = B.laserBullets[i];
      if (b) { ctx.freeBullet(b); B.laserBullets[i] = null; }
    }
  }
  function armLaser() {
    for (var i = 0; i < 3; i++) {
      B.laserBullets[i] = ctx.bigBullet(0, B.y + LASER_OFF[i] + 1, B.x, 6);
    }
  }

  /* ---------------------------------------------------------- 艦體背景（形變） */
  function drawHull(phase) {
    var m = HULL_MAPS[phase] || HULL_MAPS[1];
    var c0 = B.x >> 3, r0 = B.y >> 3, r, c;
    for (r = 0; r < 6; r++) for (c = 0; c < 6; c++) ctx.bgWrite(c0 + c, r0 + r, m[r][c]);
    B.hullPhase = phase;
  }
  function eraseHull() {
    if (!B.hullPhase) return;
    var c0 = B.x >> 3, r0 = B.y >> 3, r, c;
    for (r = 0; r < 6; r++) for (c = 0; c < 6; c++) ctx.bgRestore(c0 + c, r0 + r);
    B.hullPhase = 0;
  }

  /* ---------------------------------------------------------- 精靈繪製 */
  var PRIO_BOSS = 3;
  function drawPlate(e, oam) {
    var S = ctx.S;
    var tiles = (e.hp <= (PLATE_HP >> 1)) ? S.PLATEX : S.PLATE;      // 半血 → 龜裂形變
    var pal = (e.flash > 0 && (e.flash & 1)) ? 2 : 3;
    CR.Enemies.draw16(oam, tiles, e.x, e.y, pal, false, PRIO_BOSS);
  }
  function drawCore(e, oam, frame) {
    var S = ctx.S;
    var open = B.coreOpen;
    var tiles = open ? S.CORE0 : S.CORE1;
    var pal = open ? 2 : 3;
    if (e.flash > 0 && (e.flash & 1)) pal = (pal === 2) ? 3 : 2;
    CR.Enemies.draw16(oam, tiles, e.x, e.y, pal, false, PRIO_BOSS);
  }

  /* ---------------------------------------------------------- 主迴圈 */
  function spawn() {
    B = fresh();
    B.active = true; B.phase = 0;
    B.x = START_X; FX.vsetPx(B.xs, START_X); B.y = HOME_Y;
    var i;
    for (i = 0; i < 4; i++) B.plates[i] = makePlate(i);
    B.platesLeft = 0;
    for (i = 0; i < 4; i++) if (B.plates[i]) B.platesLeft++;
    return B;
  }

  function update() {
    if (!B || !B.active) return;
    B.t++;

    if (B.phase === 0) {                                     // ── 進場
      FX.vadd(B.xs, ENTER_V);
      B.x = FX.vpx(B.xs);
      if (B.t >= ENTER_FRAMES || B.x <= HOME_X) {
        B.x = HOME_X; FX.vsetPx(B.xs, HOME_X);
        B.phase = 1; B.t = 0; B.fireT = P1_FIRE;
        drawHull(1);
      }
      return;
    }
    if (B.phase === 1) {                                     // ── 階段 1：外殼板
      if (--B.fireT <= 0) { B.fireT = P1_FIRE; aimedShot(); }
      return;
    }
    if (B.phase === 2) {                                     // ── 階段 2：核心開合
      if (--B.coreT <= 0) {
        B.coreOpen = !B.coreOpen;
        B.coreT = B.coreOpen ? OPEN_FRAMES : SHUT_FRAMES;
        if (B.coreOpen) ring();
      }
      if (--B.fireT <= 0) { B.fireT = P1_FIRE + 40; aimedShot(); }
      return;
    }
    if (B.phase === 3) {                                     // ── 階段 3：三連雷射 + 環形彈
      if (--B.coreT <= 0) {
        B.coreOpen = !B.coreOpen;
        B.coreT = B.coreOpen ? OPEN_FRAMES : SHUT_FRAMES;
      }
      if (--B.laserT <= 0) {
        if (B.laserState === 'warn') {
          B.laserState = 'beam'; B.laserT = BEAM_FRAMES;
          paintLaser('LBEAM'); armLaser();
        } else if (B.laserState === 'beam') {
          B.laserState = 'cool'; B.laserT = COOL_FRAMES;
          clearLaser(); ring();
        } else {
