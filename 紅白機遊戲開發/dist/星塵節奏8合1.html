    return {
      mode: 'title', t: 0, sel: 1, paused: false, cheatReq: false, run: null, sub: null,
      msg: '', msgT: 0, howLv: 0, overT: 0, newBest: false, runsTotal: 0,
      goal: false, flash: 0, bot: { t: 0, hist: [], mem: {}, lag: 15 }
    };
  }

  /* ---------------- 存檔 ---------------- */
  function gradeOf(key) { var v = CT.load('brain', 'grade_' + key, 5); return v === null ? 5 : v | 0; }
  function reachOf(key) { return CT.load('brain', 'reach_' + key, 0) | 0; }
  function saveBest() {
    if (!g || !g.run) return false;
    var best = CT.load('brain', 'best', 0) | 0;
    if (g.run.score > best) { CT.save('brain', 'best', g.run.score); return true; }
    return false;
  }
  function saveReach() {
    var R = g.run, M = modes()[R.m];
    if (!M.levelSelect) return;
    if (R.lv > reachOf(M.key)) CT.save('brain', 'reach_' + M.key, Math.min(R.lv, M.levels - 1));
  }

  /* ---------------- 共用 API（給模式用） ---------------- */
  C.say = function (s, t) { g.msg = s; g.msgT = t || 90; };
  C.addScore = function (n) { if (g.run) g.run.score = Math.min(999999, g.run.score + (n | 0)); };
  C.hurt = function (why) {
    var R = g.run;
    if (!R || R.hearts <= 0) return;
    R.hearts--; R.hurts++;
    g.flash = 12;
    AU.sfx('brain_hit');
    if (why) C.say(why, 80);
  };
  C.heal = function (n) { var R = g.run, M = modes()[R.m]; R.hearts = Math.min(M.hearts, R.hearts + (n || 1)); };
  C.run = function () { return g.run; };
  C.goalNow = function () {   // 由 multi.js 呼叫：撐過 90 秒
    if (g.run && !g.run.cheated) g.goal = true;
  };
  C.GOAL_FRAMES = GOAL_FRAMES;

  /* ---------------- 標題 ---------------- */
  function titleRow(i) { return 10 + i * 3; }
  function modeLine(i) {
    var M = modes()[i];
    return (i + 1) + ' ' + C.padR(M.name, 11) + 'BEST ' + (gradeOf(M.key) < 5 ? GRADES[gradeOf(M.key)] : '-');
  }
  function enterTitle() {
    g.mode = 'title'; g.t = 0; g.run = null; g.sub = null; g.paused = false;
    C.redraw(function () {
      C.frame(1, 1, 30, 27);
      C.big(6, 3, 'STAR BRAIN');
      C.center(6, 'SPLIT MIND TRAINING LAB');
      C.center(8, 'BEST SCORE ' + C.pad(CT.load('brain', 'best', 0) | 0, 6));
      for (var i = 0; i < modes().length; i++) {
        C.text(6, titleRow(i), modeLine(i));
        C.text(8, titleRow(i) + 1, modes()[i].sub);
      }
      C.text(4, 22, 'UP/DOWN MODE  A/START GO');
      C.text(4, 24, 'HOLD START+SELECT: MENU');
      C.text(4, 26, 'C/$ = CHEAT');
      // 標題大字紫、模式清單青；選到的那一列橘
      C.fillA(1, 1, 14, 3, 1);
      C.fillA(1, 5, 14, 6, 2);
      selAttr(g.sel, 3);
    }, TITLE_PAL);
    AU.play('brain_title');
  }
  function selAttr(i, p) { var r = titleRow(i); for (var c = 2; c < 15; c++) { C.putA(c, r >> 1, p); C.putA(c, (r + 1) >> 1, p); } }

  /* ---------------- 說明頁：規則 + 手把圖 + 起始等級 ---------------- */
  function enterHowto(m) {
    var M = modes()[m];
    g.mode = 'howto'; g.t = 0; g.sel = m;
    g.howLv = M.levelSelect ? reachOf(M.key) : 0;
    C.redraw(function () {
      C.frame(1, 1, 30, 27);
      C.center(3, M.name);
      C.center(4, M.sub);
      for (var i = 0; i < M.rules.length; i++) C.text(3, 6 + i, M.rules[i]);
      // 手把圖（按鍵對照）：十字鍵 + SELECT/START + B A，下方寫各鍵的用途
      var py = 14;
      C.frame(3, py, 26, 6);
      C.put4(5, py + 1, 'PAD_');
      C.put(19, py + 2, C.t('BTN')); C.put(25, py + 2, C.t('BTN'));
      C.text(19, py + 1, 'B'); C.text(25, py + 1, 'A');
      C.text(10, py + 2, 'SEL STA');
      for (i = 0; i < M.pad.d.length; i++) C.text(4, py + 3 + i, M.pad.d[i]);
      C.text(19 - (M.pad.b.length >> 1), py + 3, M.pad.b);
      C.text(25 - (M.pad.a.length >> 1), py + 3, M.pad.a);
      C.text(3, 22, M.goalLine);
      C.text(3, 24, M.levelSelect ? 'A GO  B BACK  L/R LEVEL' : 'A GO  B BACK');
      C.text(3, 26, 'HOLD START+SELECT: MENU');
      C.fillA(1, 1, 14, 2, 3);
      C.fillA(2, 7, 12, 3, 2);
    }, TITLE_PAL);
    drawHowLv();
  }
  function drawHowLv() {
    var M = modes()[g.sel];
    if (M.levelSelect) C.text(3, 21, 'START LEVEL ' + (g.howLv + 1) + ' OF ' + M.levels + '   ');
    else C.text(3, 21, M.levelNote || '');
  }

  /* ---------------- 一局 / 一級 ---------------- */
  function startRun(m, lv) {
    var M = modes()[m];
    g.runsTotal++;
    var qs = CT.query ? parseInt(CT.query('seed') || '', 10) : NaN;
    C.seed(isNaN(qs) ? (0x1357 + g.runsTotal * 7919 + m * 131) : qs);
    g.run = { m: m, key: M.key, lv: lv || 0, startLv: lv || 0, score: 0, hearts: M.hearts, hurts: 0, cheated: false, continues: 0, lvScores: [], stat: {} };
    startLevel();
  }
  function startLevel() {
    var R = g.run, M = modes()[R.m];
    g.mode = 'ready'; g.t = 0; g.paused = false; g.msg = ''; g.msgT = 0; g.flash = 0;
    g.sub = null;
    M.enter(R.lv);          // 模式自己 redraw 場地（含 HUD 列底與調色盤）
    g.bdNow = M.pal.bd;
    g.sub = C.g.sub;
    drawHud();
    AU.play(M.song);
  }
  function beginPlay() { g.mode = 'play'; g.t = 0; var M = modes()[g.run.m]; if (M.begin) M.begin(); }
  function levelPassed() {
    var R = g.run, M = modes()[R.m];
    g.mode = 'lvlend'; g.t = 0;
    R.lvScores[R.lv] = (R.lvScores[R.lv] || 0) + 1;
    AU.play('brain_clear');
    if (R.lv + 1 >= M.levels) { g.sub.last = true; C.say(M.finalMsg || 'ALL LEVELS CLEAR!', 120); }
    else C.say('LEVEL ' + (R.lv + 1) + ' CLEAR!', 120);
    if (M.onPass) M.onPass(R.lv);
  }
  function afterLevel() {
    var R = g.run, M = modes()[R.m];
    if (R.lv + 1 >= M.levels) { enterResult(); return; }
    R.lv++;
    saveReach();
    if (M.heartPerLevel) C.heal(M.heartPerLevel);
    startLevel();
  }
  function gradeNow() {
    var R = g.run, M = modes()[R.m];
    var gi = C.clamp(M.grade(R) | 0, 0, 4);
    if (R.startLv > 0 && gi < 2) gi = 2;          // 不是從第 1 級開始：評價最高 B
    return gi;
  }
  function enterOver(why) {
    var R = g.run, M = modes()[R.m];
    g.mode = 'over'; g.overT = 0; g.newBest = saveBest(); saveReach();
    AU.play('brain_over');
    C.redraw(function () {
      C.frame(3, 4, 26, 21);
      C.center(7, 'GAME OVER');
      C.center(9, why || '');
      C.text(6, 11, 'MODE   ' + M.name);
      C.text(6, 13, 'LEVEL  ' + (R.lv + 1) + ' OF ' + M.levels);
      C.text(6, 15, 'SCORE  ' + C.pad(R.score, 6) + (g.newBest ? ' NEW!' : ''));
      if (M.overLine) C.text(6, 17, M.overLine(R));
      C.text(5, 20, 'C/$ = CONTINUE HERE');
      C.text(5, 22, 'START = TITLE');
      C.fillA(2, 3, 12, 2, 3);
    }, TITLE_PAL);
  }
  function enterResult() {
    var R = g.run, M = modes()[R.m], gi = gradeNow();
    g.mode = 'result'; g.overT = 0; g.newBest = saveBest();
    R.grade = GRADES[gi];
    if (!R.cheated) {
      var old = gradeOf(M.key);
      if (gi < old) CT.save('brain', 'grade_' + M.key, gi);
      CT.save('brain', 'reach_' + M.key, M.levelSelect ? M.levels - 1 : 0);
    }
    AU.play('brain_clear');
    C.redraw(function () {
      C.frame(3, 3, 26, 23);
      C.center(5, M.name + ' COMPLETE');
      C.text(7, 8, 'GRADE');
      C.put4(14, 7, 'BIG_' + GRADES[gi]);
      C.center(10, M.titleOf ? M.titleOf(gi) : '');
      C.text(6, 12, 'SCORE  ' + C.pad(R.score, 6) + (g.newBest ? ' NEW!' : ''));
      var ls = M.resultLines ? M.resultLines(R) : [];
      for (var i = 0; i < ls.length; i++) C.text(6, 14 + i * 2, ls[i]);
      C.text(6, 22, R.cheated ? 'CHEAT USED: NOT SAVED' : 'GRADE SAVED');
      C.text(6, 24, 'START = TITLE');
      C.fillA(7, 3, 2, 2, 3);
    }, TITLE_PAL);
  }

  /* ---------------- HUD（第 1~3 列，固定不捲） ---------------- */
  function drawHud() {
    var R = g.run, M = R ? modes()[R.m] : null;
    if (!R) return;
    var HR = M.hudRows || [1, 2, 3];
    HUD1 = HR[0]; HUD2 = HR[1]; HUD3 = HR[2];
    C.text(1, HUD1, C.padR(M.short, 7) + 'LV' + (R.lv + 1) + ' SC' + C.pad(R.score, 6) + (R.cheated ? '$' : ' '));
    for (var i = 0; i < 5; i++) C.put(26 + i, HUD1, i < M.hearts ? C.t(i < R.hearts ? 'HT1' : 'HT0') : 0);
    var line2;
    if (g.mode === 'ready') line2 = M.levelTip ? M.levelTip(R.lv) : '';
    else line2 = M.hud2 ? M.hud2() : null;
    if (line2 !== null) C.text(1, HUD2, C.padR(line2, 30));
    var line;
    if (g.paused) line = 'PAUSE  HOLD START+SELECT: MENU';
    else if (g.msgT > 0) line = g.msg;
    else if (g.mode === 'ready') {
      var n = 3 - Math.floor(g.t / READY_T);
      line = n > 0 ? 'READY ' + n + '   A = GO NOW' : 'GO!';
    } else line = M.hint ? M.hint() : '';
    C.text(1, HUD3, C.padR(line, 30));
  }

  /* ---------------- 主迴圈 ---------------- */
  function updateRun() {
    var I = NES.Input, M = modes()[g.run.m];
    if (I.pressed(BTN.START) && !I.held(BTN.SELECT)) {
      g.paused = !g.paused;
      if (g.paused) AU.pause(); else AU.resume();
    }
    if (g.paused) return;
    g.t++;
    if (g.msgT > 0) g.msgT--;
    if (g.flash > 0) g.flash--;
    if (g.mode === 'ready') {
      if (M.idle) M.idle();
      if (g.t >= READY_T * 3 + 10 || (g.t > 15 && I.pressed(BTN.A))) beginPlay();
      return;
    }
    if (g.mode === 'lvlend') { if (M.idle) M.idle(); if (g.t > 110) afterLevel(); return; }
    var r = M.tick(I);
    if (g.run.hearts <= 0) { enterOver(M.overWhy || 'OUT OF HEARTS'); return; }
    if (r === 1) levelPassed();
    else if (r === -1) enterOver(M.failWhy ? M.failWhy() : 'NORM FAILED');
  }
  function doCheat() {
    var m = g.mode, R = g.run, M = R && modes()[R.m];
    if (!R) return;
    if (m === 'over') {
      R.cheated = true; R.continues++;
      R.hearts = M.hearts;
      startLevel();
      C.say('CONTINUE! LEVEL ' + (R.lv + 1), 90);
      return;
    }
    if (m === 'play' || m === 'ready' || m === 'lvlend') {
      R.cheated = true;
      R.hearts = M.hearts;
      if (M.cheat) M.cheat();
      C.say('STAR MIND! HEARTS FULL', 80);
      AU.sfx('brain_ok');
    }
  }

  /* ---------------- 機器人（反應延遲 L 幀；外界只讀 L 幀前的觀察） ---------------- */
  function botMask() {
    var B = g.bot, I = 0;
    B.t++;
    var want = parseInt(CT.query ? (CT.query('botmode') || '2') : '2', 10) - 1;
    if (!(want >= 0 && want < modes().length)) want = 1;
    if (g.mode === 'title') {
      B.hist = []; B.mem = {};
      if (g.sel !== want) return (B.t % 10 === 0) ? BTN.DOWN : 0;
      return (B.t % 30 === 15) ? BTN.A : 0;
    }
    if (g.mode === 'howto') return (B.t % 30 === 15) ? BTN.A : 0;
    if (g.mode === 'over' || g.mode === 'result') { B.hist = []; B.mem = {}; return (g.overT > 90 && B.t % 40 === 20) ? BTN.START : 0; }
    if (g.paused) return (B.t % 40 === 20) ? BTN.START : 0;
    var M = modes()[g.run.m];
    // 觀察（每幀一份，畫面上看得到的東西）
    var obs = (g.mode === 'play' && M.observe) ? M.observe() : null;
    B.hist.push(obs);
    var L = B.lag;
    while (B.hist.length > L + 1) B.hist.shift();
    if (g.mode !== 'play') return 0;
    var seen = B.hist.length > L ? B.hist[0] : null;
    if (!seen) return 0;
    I = M.bot(seen, B.mem, B.t) || 0;
    return I & ~(BTN.START | BTN.SELECT);
  }

  /* ---------------- 註冊 ---------------- */
  var GAME = {
    id: 'brain', order: 7, title: '星塵腦力',
    legacy: ['dual-hand-sync.html', 'multitask-challenge.html', 'time-space-tracker.html', 'gravity-sense.html'],
    init: function (nes) {
      C.nes = nes;
      C.art = BR.Art.make();
      var ppu = nes.ppu;
      NES.CHR.setPattern(0, 'brain_bg');
      NES.CHR.setPattern(1, 'brain_spr');
      if (ppu.setPatternTables) ppu.setPatternTables(0, 1);
      ppu.spriteMode(8);
      ppu.flickerStep = 0;
      GAME.backTile = { tile: C.s('STARS'), pal: 0 };
      AU.init(nes);
      g = newState();
      C.g = g;
      var lag = CT.query ? parseInt(CT.query('lag') || '', 10) : NaN;
      if (lag >= 0 && lag <= 60) g.bot.lag = lag;
      enterTitle();
      var qm = CT.query ? parseInt(CT.query('gmode') || '', 10) : NaN;
      if (qm >= 1 && qm <= modes().length) {
        g.sel = qm - 1;
        startRun(qm - 1, C.clamp((parseInt(CT.query('lv') || '1', 10) || 1) - 1, 0, modes()[qm - 1].levels - 1));
      }
    },
    update: function () {
      var I = NES.Input;
      if (g.cheatReq) { g.cheatReq = false; doCheat(); }
      if (g.mode === 'title') {
        g.t++;
        var d = (I.pressed(BTN.DOWN) || (I.pressed(BTN.SELECT) && !I.held(BTN.START))) ? 1 : (I.pressed(BTN.UP) ? -1 : 0);
        if (d) { selAttr(g.sel, 2); g.sel = (g.sel + d + modes().length) % modes().length; selAttr(g.sel, 3); AU.sfx('brain_move'); }
        if ((I.pressed(BTN.START) && !I.held(BTN.SELECT)) || I.pressed(BTN.A)) { AU.sfx('brain_ok'); enterHowto(g.sel); }
      } else if (g.mode === 'howto') {
        g.t++;
        var M = modes()[g.sel];
        if (M.levelSelect) {
          var mx = reachOf(M.key);
          if (I.pressed(BTN.LEFT) && g.howLv > 0) { g.howLv--; drawHowLv(); AU.sfx('brain_move'); }
          if (I.pressed(BTN.RIGHT) && g.howLv < mx) { g.howLv++; drawHowLv(); AU.sfx('brain_move'); }
        }
        if (g.t > 8 && I.pressed(BTN.B)) { enterTitle(); }
        else if (g.t > 8 && ((I.pressed(BTN.START) && !I.held(BTN.SELECT)) || I.pressed(BTN.A))) { AU.sfx('brain_ok'); startRun(g.sel, g.howLv); }
      } else if (g.mode === 'over' || g.mode === 'result') {
        g.overT++;
        if (g.overT > 40 && I.pressed(BTN.START) && !I.held(BTN.SELECT)) enterTitle();
      } else updateRun();
      AU.tick();
    },
    draw: function () {
      C.sprBegin();
      if (g.mode === 'title') {
        if ((g.t & 15) < 12) C.spr(36, titleRow(g.sel) * 8, C.s('PTR'), 0);
      } else if (g.mode === 'ready' || g.mode === 'play' || g.mode === 'lvlend') {
        var M = modes()[g.run.m];
        drawHud();
        M.draw(g.mode, g.paused);
        var bd = (g.flash > 0 && (g.flash & 4)) ? 0x06 : M.pal.bd;
        if (bd !== g.bdNow) { C.nes.ppu.setBackdrop(bd); g.bdNow = bd; }
      }
      C.sprEnd();
      C.flush();
    },
    state: function () {
      var R = g.run, M = R ? modes()[R.m] : null;
      return {
        mode: g.mode, sel: g.sel, t: g.t, paused: g.paused, howLv: g.howLv, msg: g.msgT > 0 ? g.msg : '',
        run: R ? { m: R.m, key: R.key, lv: R.lv, score: R.score, hearts: R.hearts, hurts: R.hurts, cheated: R.cheated, continues: R.continues, grade: R.grade || null } : null,
        sub: (M && M.stateOf) ? M.stateOf() : null,
        goal: !!g.goal, queue: C.q.length + C.qa.length, peakQ: C.peakQ, sprUsed: C.sprUsed, lag: g.bot.lag
      };
    },
    exit: function () { saveBest(); AU.stop(); },
    cheat: function () {
      if (!g || g.mode === 'title' || g.mode === 'howto' || g.mode === 'result') return false;
      g.cheatReq = true; return true;
    },
    bot: function () { return botMask(); },
    goal: function () { return !!(g && g.goal); },
    bestText: function () { return C.pad(Math.min(999999, CT.load('brain', 'best', 0) | 0), 6); }
  };
  BR.GRADES = GRADES;
  BR.GOAL_FRAMES = GOAL_FRAMES;
  BR.dev = {
    g: function () { return g; },
    start: function (m, lv) { startRun(m, lv || 0); }, begin: function () { beginPlay(); },
    title: function () { enterTitle(); }, howto: function (m) { enterHowto(m); },
    over: function () { enterOver('TEST'); }, result: function () { enterResult(); }, pass: function () { levelPassed(); },
    afterLevel: function () { afterLevel(); }
  };
  if (CT.register) CT.register(GAME);
})();

</script>

<script>/* games/cart4/cart.js */
/*
 * games/cart4/cart.js — 卡帶四《星塵節奏 8 合 1》的卡帶設定（`CT.CART_CFG`，給共用的 games/cart1/shell.js 讀）
 * ---------------------------------------------------------------------------
 * 擁有者：C8-0 cart4-shell+color（R8）。欄位說明見 games/cart1/cart.js 檔頭 / docs/TASKS.md「R6 多卡帶契約」。
 * 載入順序（cart4.html）：window.CART_ID = 'cart4' → registry.js → 各遊戲（cart4:games 標記內）→ **本檔** → shell.js。
 *
 * 全部原創：
 *   logo「星塵節奏 8 合 1」= Noto Sans CJK TC Bold 15px 點陣（SIL OFL）+ 立體描邊，**霓虹粉紅**
 *     （卡帶一火色 / 卡帶二冰藍 / 卡帶三萊姆綠 / 本卡粉紅：陰影 $04 / 本體 $24 / 高光 $34）；
 *   邊框玫瑰紅 $15（卡帶一藍 $11、卡帶二紫 $13、卡帶三青綠 $1B）；
 *   8 槽圖示 16×16 手繪（R8_BRIEF §2；LEGACY_MAP 卡帶四順序）：
 *     cards 靛藍牌背 + 翻開的星牌、simon 十字排列的四顆星標（星 / 月 / 環行星 / 彗星，不是圓形四色扇形）、
 *     flash 3×3 格子閃現、tune 星軌垂下的星鐘管、rhythm 星十字（星核 + 四條星軌 + 星籽）、
 *     reflex 信號燈 + 閃電、brain 左右兩半（齒輪 / 波紋）的腦、color 三色三形狀（圓 / 三角 / 方）；
 *   選單曲「節拍星港」：A 小調、speed 5（≈ 180 BPM）、切分舞曲低音 + 跳音主旋律、A B A' C 四段。
 */
(function () {
  'use strict';
  var CT = window.CT = window.CT || {};

  /* 槽名 16×16 點陣（PIL ImageFont NotoSansCJK-Regular.ttc index 3 = TC, 16px, 門檻 90；超出 16 列時整字上移不裁切；星 / 塵 與前三卡相同） */
  var GLYPH = {
    '星': '1ffc100c1ffc100c100c1ff8198019803ffc61801ff8018001807ffe00000000',
    '塵': '008000803ffe22603ffe22663ffe2c602ffe2c622fbe60806ffc40807ffe4000',
    '翻': '02007efe2a222a327fba1cea3e6e6b22c9267f6e6bfa7fb26b226b227f22406e',
    '牌': '2c602c602dfe2d262d263dfe2126216661fe7cd86d986fff6c184c184c184c18',
    '跟': '7ffe6786678667fe7f86198619fe79a07fb6799c79987b887fac71e601020000',
    '我': '03403f587c4c0c460c607ffe0c600c640d6c1f287c384c300c730cd20f9a380e',
    '做': '01101b10131033303fff73267376f37437d434dc34dc34c834dc37fc34663042',
    '閃': '7e7e62467e7e624662467e7e61066106618663c662666e3678166006601c0000',

    if (S.slots.length <= 8) {
      text(ppu, 4, 25, 'A/START PLAY  SELECT NEXT');
      text(ppu, 3, 26, 'HOLD START+SELECT = MENU');
    }
    rowPal(ppu, S.sel, 1);
  }

  /* ============================================================ 進度提示 overlay（回選單） */
  // R5 fix（P3-9 / brief §6-4）：
  //   遊戲註冊物件有 backTile: {tile, pal} ⇒ OAM 62 / 63 用「遊戲自己指定」的磁磚收攏（8×16 模式 tile 原樣傳給
  //     ppu.sprite = 上下兩塊那組），進度 > 2/3 改成顯示 / 隱藏快閃；
  //   沒填 backTile ⇒ 不借任何精靈（不再猜「最實心的磁磚」，避免畫成半台車 / 半片翅膀），改成閃 backdrop：
  //     亮色 = 原 backdrop 提亮一階（黑底 → $01 深藍），閃爍間隔隨進度變快；放開即還原（遊戲中途自己改 backdrop 也跟著更新備份）。
  var OV = { key: null, tile: 0, saved: [null, null], wrote: [null, null], on: false,
    mode: null, bdOn: false, bdSaved: 0, bdWrote: -1, lastMode: null };
  function backTileOf(g) {
    var bt = g && g.backTile;
    if (typeof bt === 'function') { try { bt = bt.call(g); } catch (e) { bt = null; } }
    if (!bt || typeof bt !== 'object') return null;
    var t = bt.tile, pl = bt.pal === undefined ? 0 : bt.pal;
    if (typeof t !== 'number' || t !== (t | 0) || t < 0 || t > 255) return null;
    if (typeof pl !== 'number' || pl !== (pl | 0) || pl < 0 || pl > 3) return null;
    return { tile: t, pal: pl };
  }
  function flashColor(c) {
    c = c | 0;
    if ((c & 0x0F) >= 0x0E || c === 0x0D) return 0x01;         // 各種黑 → 深藍
    if (c < 0x30) return c + 0x10;                             // 提亮一階（0x1D → 0x2D 灰，不會碰到 $0D）
    return (c & 0x0F) === 0x00 ? 0x10 : (c - 0x20);             // 已是最亮列 → 壓暗兩階
  }
  function same(a, b) {
    return a && b && a.x === b.x && a.y === b.y && a.tile === b.tile && a.pal === b.pal && a.on === b.on &&
      a.flipH === b.flipH && a.flipV === b.flipV && a.behind === b.behind;
  }
  function restoreSprites(ppu) {
    for (var k = 0; k < 2; k++) {
      var slot = 62 + k, now = ppu.getSprite(slot), sv = OV.saved[k];
      if (same(now, OV.wrote[k]) && sv) {
        if (sv.on) ppu.sprite(slot, { x: sv.x, y: sv.y, tile: sv.tile, pal: sv.pal, flipH: sv.flipH, flipV: sv.flipV, behind: sv.behind });
        else ppu.sprite(slot, null);
      }
      OV.saved[k] = null; OV.wrote[k] = null;
    }
    OV.on = false;
  }
  function restoreBackdrop(ppu) {
    if (OV.bdOn && (ppu.backdrop | 0) === OV.bdWrote && (ppu.backdrop | 0) !== OV.bdSaved) ppu.setBackdrop(OV.bdSaved);
    OV.bdOn = false; OV.bdWrote = -1;
  }
  function overlay(nes) {
    var ppu = nes && nes.ppu;
    if (!ppu) return;
    var p = (CT.current && CT.backProgress) ? CT.backProgress() : 0, k;
    var f = (nes.timing && nes.timing.frame) | 0;
    if (p > 0) {
      var bt = backTileOf(CT.current);
      if (bt && ppu.sprite && ppu.getSprite) {
        if (OV.bdOn) restoreBackdrop(ppu);
        OV.mode = OV.lastMode = 'tile'; OV.tile = bt.tile;
        var gap = Math.round(28 * (1 - p));            // 兩顆從 ±28 px 往中間收攏
        var show = p <= 0.66 || ((f >> 1) & 1);
        var pos = [{ x: 124 - 4 - gap, y: 16 }, { x: 124 + 4 + gap, y: 16 }];
        for (k = 0; k < 2; k++) {
          var slot = 62 + k, cur = ppu.getSprite(slot);
          if (!OV.on || !same(cur, OV.wrote[k])) OV.saved[k] = cur;   // 遊戲這幀自己寫過 ⇒ 更新備份
          if (show) ppu.sprite(slot, { x: pos[k].x, y: pos[k].y, tile: bt.tile, pal: bt.pal, flipH: k === 1 });
          else ppu.sprite(slot, null);
          OV.wrote[k] = ppu.getSprite(slot);
        }

      } else if (ppu.setBackdrop) {

      }

      if (OV.bdOn) restoreBackdrop(ppu);

    }
  }
  (function wrapDraw() {
    var G = window.GAME;
    if (!G || G.__cart1Overlay) return;
    var orig = G.draw;
    G.draw = function (nes) {
      if (orig) orig.call(G, nes);
      if (CT.current) overlay(nes);
      else { OV.on = false; OV.bdOn = false; OV.mode = null; }
    };
    G.__cart1Overlay = true;
  })();

  /* ============================================================ 輸入 */
  function inp(nes) { return (nes && nes.input) || NES.Input; }
  function pressed(nes, b) { var I = inp(nes); return !!(I && I.pressed && I.pressed(b)); }
  function held(nes, b) { var I = inp(nes); return !!(I && I.held && I.held(b)); }
  function moveDir(nes) {
    var d = 0;
    if (pressed(nes, BTN.DOWN) || pressed(nes, BTN.SELECT)) { S.hold = 0; return 1; }
    if (pressed(nes, BTN.UP)) { S.hold = 0; return -1; }
    if (held(nes, BTN.DOWN)) d = 1;
    else if (held(nes, BTN.UP)) d = -1;
    if (!d) { S.hold = 0; return 0; }
    S.hold++;
    if (S.hold >= REPEAT_DELAY && (S.hold - REPEAT_DELAY) % REPEAT_RATE === 0) return d;
    return 0;
  }

  /* ============================================================ 模式切換 */
  function enterMenu(nes) {
    var ppu = nes.ppu;
    S.mode = 'menu'; S.t = 0; S.hold = 0;
    CT.blank(nes, function () { drawMenu(ppu); });
    playMenuSong(nes);
  }
  function select(nes, i) {
    var n = S.slots.length;
    if (!n) return;
    i = ((i % n) + n) % n;
    if (i === S.sel) return;
    rowPal(nes.ppu, S.sel, 0);
    S.sel = i;
    rowPal(nes.ppu, S.sel, 1);
  }

  /* ============================================================ CT.Shell */
  var Shell = {
    VERSION: 'cart-shell r6',
    get DEFAULT_SLOTS() { return defaultSlots(); },
    cart: function () { return cfg(); },
    init: function (nes, opt) {
      // registry 的「第一次開機」路徑沒有包 CT.blank ⇒ 自己包（巢狀呼叫安全：會還原外層的 mute）
      if (CT.blank) CT.blank(nes, function () { Shell._init(nes, opt); });
      else Shell._init(nes, opt);
    },
    _init: function (nes, opt) {
      opt = opt || {};
      nes0 = nes;
      var ppu = nes.ppu;
      S.inited++;
      S.slots = buildSlots();
      S.from = opt.from || null;
      S.launchId = null; S.launchT = 0; S.hold = 0; S.t = 0;
      OV.on = false; OV.key = null; OV.bdOn = false; OV.mode = null;
      buildBanks();
      NES.CHR.setPattern(0, S.bank);
      NES.CHR.setPattern(1, S.spr);
      if (ppu.setPatternTables) ppu.setPatternTables(0, 1);
      if (ppu.spriteMode) ppu.spriteMode(8);
      ppu.flicker = 'rotate'; ppu.flickerStep = 8;
      if (ppu.mirroring) ppu.mirroring('v');
      buildSfx();
      defineSfx(nes);
      setPalettes(ppu);
      // 游標：回選單 → 停在剛玩的那款；第一次開機 → 0
      var want = 0, i;
      if (S.from) for (i = 0; i < S.slots.length; i++) if (S.slots[i].id === S.from) want = i;
      S.sel = want;
      var skip = S.from || opt.skipBoot || (CT.query && (CT.query('boot') === '0'));
      if (skip) {
        S.mode = 'menu';
        drawMenu(ppu);                                     // init 已在 CT.blank 內
        playMenuSong(nes);
      } else {
        S.mode = 'boot';
        drawBoot(ppu);
        var m = music(nes);
        if (m && m.stop) { try { m.stop(); } catch (e) { } }
      }
    },
    update: function (nes) {
      var m = music(nes);
      if (m && m.tick) { try { m.tick(); } catch (e) { } }
      S.t++;
      var ppu = nes.ppu;
      if (S.mode === 'boot') {
        if (S.t === 48) { drawBootText(ppu); sfx(nes, prefix() + '_boot'); }
        if (S.t >= BOOT_FRAMES || (S.t > 8 && (pressed(nes, BTN.START) || pressed(nes, BTN.A)))) enterMenu(nes);
        return;
      }
      if (S.mode === 'launch') {
        S.launchT++;
        rowPal(ppu, S.sel, ((S.launchT >> 2) & 1) ? 0 : 1);
        if (S.launchT >= LAUNCH_FRAMES) {
          var id = S.launchId;
          S.mode = 'menu'; S.launchId = null;
          if (!CT.launch(id, { from: 'shell' })) { CT.blank(nes, function () { drawMenu(ppu); }); }
        }
        return;
      }
      // menu（START+SELECT 一起按 = 回選單熱鍵的手勢 ⇒ 在選單裡兩顆都不算，避免誤進遊戲）
      if (held(nes, BTN.START) && held(nes, BTN.SELECT)) { S.hold = 0; return; }
      var d = moveDir(nes);
      if (d) { select(nes, S.sel + d); sfx(nes, prefix() + '_move'); }
      if (pressed(nes, BTN.A) || pressed(nes, BTN.START)) {
        var sl = S.slots[S.sel];
        if (sl && sl.game) {
          S.mode = 'launch'; S.launchT = 0; S.launchId = sl.id;
          if (m && m.stop) { try { m.stop(); } catch (e) { } }
          sfx(nes, prefix() + '_ok');
        } else sfx(nes, prefix() + '_ng');
      }
    },
    draw: function (nes) {
      var ppu = nes.ppu, t = S.t, k;
      if (S.mode === 'boot') {
        // 大星從上方落到中央（整數緩動），之後左右兩顆閃光交替
        var y = t >= 40 ? 88 : (-16 + ((104 * (t * (80 - t))) / 1600 | 0));
        var x = 120;
        ppu.sprite(0, { x: x, y: y, tile: P('BIG_TL'), pal: 0 });
        ppu.sprite(1, { x: x + 8, y: y, tile: P('BIG_TR'), pal: 0 });
        ppu.sprite(2, { x: x, y: y + 8, tile: P('BIG_BL'), pal: 0 });
        ppu.sprite(3, { x: x + 8, y: y + 8, tile: P('BIG_BR'), pal: 0 });
        if (t >= 48) {
          var on = (t >> 3) & 1;
          ppu.sprite(4, { x: 104, y: 84, tile: P(on ? 'SPK0' : 'SPK1'), pal: 1 });
          ppu.sprite(5, { x: 144, y: 100, tile: P(on ? 'SPK1' : 'SPK0'), pal: 1 });
        } else { ppu.sprite(4, null); ppu.sprite(5, null); }
        return;
      }
      // 選單：游標（左右輕晃）+ logo 旁兩顆閃光
      var bob = (t >> 3) & 1;
      var cy = slotRow(S.sel) * 8 + 4;
      var hide = S.mode === 'launch' && ((S.launchT >> 2) & 1);
      if (hide) ppu.sprite(0, null);
      else ppu.sprite(0, { x: 16 + bob, y: cy, tile: P('CUR'), pal: 0 });

      var SPK = cfg().sparkles || [[60, 22], [188, 34]];
      ppu.sprite(1, { x: SPK[0][0], y: SPK[0][1], tile: P(ph & 1 ? 'SPK0' : 'SPK1'), pal: 1 });
      ppu.sprite(2, { x: SPK[1][0], y: SPK[1][1], tile: P(ph & 2 ? 'SPK0' : 'SPK1'), pal: 1 });
      for (k = 3; k < 6; k++) ppu.sprite(k, null);
    },
    state: function () {
      return {
        mode: S.mode, t: S.t, sel: S.sel, from: S.from, launchId: S.launchId, lastSfx: S.lastSfx, song: S.song,
        inited: S.inited, tiles: S.tileCount || 0, missingGlyph: S.missingGlyph.slice(),
        slots: S.slots.map(function (s) {
          return { id: s.id, title: s.title, registered: !!s.game, best: s.game ? bestOf(s) : null, name: s.nameMode };
        })
      };
    },
    // ---- 測試 / 工具用 ----
    dev: {
      select: function (i) { if (nes0) select(nes0, i); return S.sel; },
      slotRow: slotRow,
      overlayTile: function () { return OV.tile; },
      overlayMode: function () { return OV.mode; },
      overlayLastMode: function () { return OV.lastMode; },
      flashColor: flashColor, backTileOf: backTileOf,
      S: S,
      get SONG() { return menuSong(); }, get SFX() { return SFX; }, get GLYPH() { return glyphTable(); },
      get ICON() { return ICON; }, get CFG() { return cfg(); }
    }
  };
  CT.Shell = Shell;
})();

</script>

<script>
// ---- 啟動：桌機整數放大置中 / 手機小數倍貼齊、鍵盤焦點、F 全螢幕、觸控覆蓋層版面 ----
(function () {
  var W = 256, H = 224;                 // 顯示尺寸（PPU 內部 240 列，裁上下各 8）
  var canvas = document.getElementById('nes');
  var hint = document.getElementById('hint');
  var q = new URLSearchParams(location.search);
  var debug = q.get('debug') === '1';
  var forced = parseInt(q.get('scale') || '0', 10) || 0;   // ?scale=1 供截圖工具用（＝維持桌機整數倍行為）
  // 橫向手機：左右各留 110px 給觸控按鍵；平板（短邊 ≥ 500）各留 170px
  var RESERVE_PHONE = 220, RESERVE_TABLET = 340;

  // ---- safe-area 探針（讀 env(safe-area-inset-*) 的實際 px；不支援就全 0） ----
  var probe = null;
  function safeArea() {
    var z = { t: 0, r: 0, b: 0, l: 0 };
    try {
      if (!probe) {
        if (!document.body) return z;
        probe = document.createElement('div');
        probe.id = 'nes-safe-probe';
        probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;' +
          'padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);' +
          'padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);';
        document.body.appendChild(probe);
      }
      var cs = getComputedStyle(probe);
      z.t = parseFloat(cs.paddingTop) || 0; z.r = parseFloat(cs.paddingRight) || 0;
      z.b = parseFloat(cs.paddingBottom) || 0; z.l = parseFloat(cs.paddingLeft) || 0;
    } catch (e) { }
    return z;
  }
  function isTouch() {
    try { return (navigator.maxTouchPoints | 0) > 0 || ('ontouchstart' in window); } catch (e) { return false; }
  }
  function viewport() {
    var vv = window.visualViewport;
    return { w: (vv && vv.width) || window.innerWidth || 320, h: (vv && vv.height) || window.innerHeight || 480 };
  }

  // fit() → {s 顯示倍率（可小數）, back backing store 倍率（整數）, mobile, portrait, sa, vw, vh}
  function fit() {
    var v = viewport(), sa = safeArea();
    var vw = v.w, vh = v.h;
    var portrait = vh >= vw;
    var mobile = !forced && (isTouch() || Math.min(vw, vh) < 600);
    var full = Math.min(vw / W, vh / H);        // 完整塞進視窗的最大倍率
    var s;
    if (forced) {
      s = forced;                               // ?scale=N：完全照舊（截圖工具可重現）
    } else if (mobile) {
      if (portrait) {
        s = vw / W;                             // 直向：寬度填滿、貼上方（下面整片給按鍵）
        var maxH = Math.max(1, vh - sa.t);
        if (H * s > maxH) s = maxH / H;
      } else {
        // 橫向：高度填滿為主，左右各留出按鍵空間；留不出來（小視窗）就整個塞滿
        var reserve = (Math.min(vw, vh) >= 500 ? RESERVE_TABLET : RESERVE_PHONE) + sa.l + sa.r;
        var side = Math.min(vh / H, (vw - reserve) / W);
        s = (side > 0 && side >= full * 0.6) ? side : full;
      }

      s = Math.max(1, Math.floor(full));        // 桌機：維持整數倍
    }

    // 小數倍時 backing 取 ceil（畫得比顯示大一點），再用 CSS 縮到目標尺寸 + pixelated。
    var back = forced ? forced : Math.max(1, Math.min(4, Math.ceil(s - 0.0001)));

  }

    if (f.mobile && f.portrait) y = f.sa.t;                 // 直向貼上方
    if (f.mobile) { x = Math.round(x * 2) / 2; y = Math.round(y * 2) / 2; }
    else { x = Math.floor(x); y = Math.floor(y); }
    canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
    canvas.style.left = x + 'px'; canvas.style.top = y + 'px';

      x: x, y: y, w: cw, h: ch, scale: f.s, back: f.back,
      portrait: f.portrait, mobile: f.mobile, safe: f.sa, vw: f.vw, vh: f.vh
    };

  }

  if (!window.NES || typeof NES.boot !== 'function') {
    hint.style.display = 'block';
    hint.textContent = 'engine/nes.js 未載入';
    return;
  }

  var f = fit();
  var game = window.GAME || NES.game || null;
  var nes = NES.boot({ canvas: canvas, game: game, scale: f.back });
  place(f);

  function apply() {
    var g = fit();
    if (g.back !== nes.scale) nes.setScale(g.back);

  }

  window.addEventListener('resize', apply);

    window.visualViewport.addEventListener('resize', applySoon);
  }

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) return;
    try { if (NES.Touch && NES.Touch.releaseAll) NES.Touch.releaseAll(); } catch (e) { }
    try { if (NES.Input && NES.Input.inject) NES.Input.inject(0, 0); } catch (e) { }
  });

  function focus() { try { canvas.focus({ preventScroll: true }); } catch (e) { canvas.focus(); } }
  focus();
  window.addEventListener('pointerdown', focus);
  window.addEventListener('keydown', function (e) {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].indexOf(e.code) >= 0) e.preventDefault();
    // F = 全螢幕切換（不佔用遊戲按鍵；瀏覽器拒絕時安靜失敗）
    if (e.code === 'KeyF' && !e.ctrlKey && !e.altKey && !e.metaKey) {
      e.preventDefault();
      try {
        if (!document.fullscreenElement) {
          var p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
          if (p && p.catch) p.catch(function () { });
        } else {
          var q2 = document.exitFullscreen && document.exitFullscreen();
          if (q2 && q2.catch) q2.catch(function () { });
        }
      } catch (err) { }
    }
  });
  document.addEventListener('fullscreenchange', function () { setTimeout(apply, 60); });

  // ?touch=1 / ?touch=0：強制顯示 / 隱藏觸控按鍵（桌機截圖與測試用）
  try {
    var tq = q.get('touch');
    if (tq === '1' && NES.Touch && NES.Touch.show) NES.Touch.show();
    else if (tq === '0' && NES.Touch && NES.Touch.hide) NES.Touch.hide();
  } catch (e) { }

  // 缺模組 / debug 時在底部列出狀態（正式遊玩畫面不顯示）
  if (debug || (nes.missing && nes.missing.length)) {
    hint.style.display = 'block';
    hint.textContent = 'NES ' + NES.VERSION + ' scale=' + nes.scale
      + (nes.missing && nes.missing.length ? '  缺: ' + nes.missing.join(' ') : '  模組齊全')
      + (game ? '' : '  (無 game，空畫面)')
      + (debug ? '  __nes 可用' : '');
  }
  window.nes = nes;
