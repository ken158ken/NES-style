    var R = g.run, nb = false, lines, st;
    if (R.kind === 'classic') {
      R.score += Math.max(0, R.limit - R.moves) * 50;
      st = R.moves <= Math.ceil(R.n * 1.5) ? 3 : (R.moves <= R.n * 2 ? 2 : 1);
      if (!R.cheated) {
        var mv = load('mv' + R.sz); if (!mv || R.moves < mv) { save('mv' + R.sz, R.moves); nb = true; }
        if (R.sz === 1 && R.moves <= LIMIT[1] && !g.goalRun) g.goalRun = R;
      }
      lines = ['ALL PAIRS FOUND!', 'MOVES ' + pad(R.moves, 2) + ' / ' + R.limit + '   BEST COMBO ' + R.maxCombo, '', 'SCORE ' + pad(R.score, 6)];
    } else if (R.kind === 'time') {
      var left = secs(R.timeF);
      R.score += left * 20;
      st = R.timeF * 2 >= R.timeMax ? 3 : (R.timeF * 4 >= R.timeMax ? 2 : 1);
      if (!R.cheated) { if (left > load('tm' + R.sz)) { save('tm' + R.sz, left); nb = true; } }
      lines = ['BEAT THE CLOCK!', 'TIME LEFT ' + pad(left, 3) + 'S   BEST COMBO ' + R.maxCombo, '', 'SCORE ' + pad(R.score, 6)];
    } else {
      if (R.pp < R.cp) { enterOver('PIPPO WINS ' + R.cp + ' TO ' + R.pp); return; }
      st = R.pp - R.cp >= 5 ? 3 : (R.pp - R.cp >= 3 ? 2 : 1);
      if (!R.cheated) { save('vs' + R.lvl, load('vs' + R.lvl) + 1); }
      R.result = 'win';
      lines = ['YOU BEAT PIPPO!', 'PAIRS  YOU ' + pad(R.pp, 2) + ' - ' + pad(R.cp, 2) + ' PIPPO', '', 'MEMORY ' + MEM[R.lvl].name + '   SCORE ' + pad(R.score, 4)];
    }
    if (!R.cheated && saveBest(R.score)) nb = true;
    R.saved = true; R.cleared = true;
    enterResult(lines, st, nb);
  }
  function enterResult(lines, st, nb) {
    var R = g.run;
    g.mode = 'result'; g.overT = 0; g.spark = [];
    redraw(function () {
      for (var c = 2; c < 30; c++) { put(c, 4, art.t('BH')); put(c, 25, art.t('BHB')); }
      for (var i = 0; i < lines.length; i++) if (lines[i]) center(7 + i * 2, lines[i]);
      center(16, 'RATING ' + stars(st));
      if (R.cheated) center(19, 'CHEAT USED - NOT SAVED');
      else if (nb) center(19, 'NEW RECORD!');
      center(22, R.kind !== 'vs' && R.sz < 4 ? 'A NEXT SIZE  START TITLE' : 'PUSH START');
    });
    AU.play('cards_win');
  }
  function enterOver(why) {
    var R = g.run;
    if (!R.cheated) saveBest(R.score);
    g.mode = 'over'; g.overT = 0; R.why = why; g.spark = [];
    redraw(function () {
      for (var c = 4; c < 28; c++) { put(c, 5, art.t('BH')); put(c, 24, art.t('BHB')); }
      center(8, 'GAME OVER');
      center(11, why);
      center(14, 'SCORE ' + pad(R.score, 6));
      center(17, 'C/$ = CONTINUE HERE');
      center(19, 'START = TITLE');
    });
    AU.play('cards_lose');
  }
  function resumeBoard(msg) {
    var R = g.run;
    g.mode = 'play'; R.phase = 'pick'; R.pt = 0; R.anims = []; R.open = [];
    for (var i = 0; i < R.cards.length; i++) if (R.cards[i].st === 'up') R.cards[i].st = 'down';
    redraw(function () { drawField(); drawBoard(); hud(); });
    AU.play(R.kind === 'vs' ? 'cards_vs' : 'cards_play');
    say(msg, 70);
  }

  /* ================================================================ 密技 */
  function doCheat() {
    var R = g.run;
    if (!R) return;
    R.cheated = true;
    if (g.mode === 'over') {
      R.continues++;
      if (R.kind === 'classic') { R.limit = R.moves + 10; resumeBoard('CONTINUE! +10 MOVES'); }
      else if (R.kind === 'time') { R.timeF = 30 * 60; resumeBoard('CONTINUE! +30 SECONDS'); }
      else {
        var keep = R.continues, sc = R.score;
        startGame(2, R.lvl);
        g.run.cheated = true; g.run.continues = keep; g.run.score = sc;
        say('CONTINUE! REMATCH PIPPO', 70);
      }
      return;
    }
    if (R.kind === 'classic') { R.limit += 5; say('STAR BOOST! +5 MOVES', 60); }
    else if (R.kind === 'time') { R.timeF += 20 * 60; say('STAR BOOST! +20 SECONDS', 60); }
    else { R.mem = []; say('STAR BOOST! PIPPO FORGOT ALL', 60); }
    AU.sfx('cards_peek');
  }

  /* ================================================================ 精靈 / HUD */
  function drawSprites() {
    var ppu = nes0.ppu, n = 0, R = g.run, q;
    function spr(x, y, tile, pal, fh, fv) { if (y > 231 || y < -7) return; ppu.sprite(n++, { x: x, y: y, tile: tile, pal: pal, flipH: !!fh, flipV: !!fv }); }
    function box(c0, r0, pal) {
      var x = c0 * 8, y = r0 * 8, c = art.s('CUR');
      spr(x - 1, y - 1, c, pal); spr(x + 25, y - 1, c, pal, true);
      spr(x - 1, y + 25, c, pal, false, true); spr(x + 25, y + 25, c, pal, true, true);
    }
    var blink = (g.t & 8) === 0;
    if (g.mode === 'title') spr(10, titleRow(g.sel) * 8, art.s('ARW'), 0);
    if (R && g.mode === 'play' && !g.paused && R.phase !== 'deal') {
      var p;
      if (R.kind === 'vs' && R.turn === 'c' && (R.phase === 'cpu' || R.phase === 'look')) { p = cardRC(R.ky * R.W + R.kx); box(p[0], p[1], 1); }
      else if (R.phase !== 'ready' || blink) { p = cardRC(R.cy * R.W + R.cx); box(p[0], p[1], 0); }
      for (var s = 0; s < g.spark.length; s++) {
        var sp = cardRC(g.spark[s].i), w = (g.spark[s].t >> 2) & 1;
        spr(sp[0] * 8 + 4 + w * 16, sp[1] * 8 + 4, art.s('SPK'), 2);
      }
    }
    for (q = n; q < g.sprUsed; q++) ppu.sprite(q, null);
    g.sprUsed = n;
  }
  function hud() {
    var R = g.run;
    if (!R) return;
    var top, sub, cs = R.cheated ? '$' : ' ';
    if (R.kind === 'classic') { top = padR('CLASSIC ' + SIZE_NAMES[R.sz], 16) + 'MOVES ' + pad(R.moves, 2) + '/' + pad(R.limit, 2); }
    else if (R.kind === 'time') { var sl = secs(R.timeF); top = padR('TIME ATTACK ' + SIZE_NAMES[R.sz], 20) + 'TIME ' + pad(sl, 3); }
    else { top = padR('YOU ' + pad(R.pp, 2) + '  PIPPO ' + pad(R.cp, 2), 21) + padL(MEM[R.lvl].name, 8); }
    sub = 'SCORE ' + pad(R.score, 6) + '  COMBO X' + pad(R.combo, 1) + '  ' + 'PAIR ' + pad(R.matched, 2);
    text(1, 1, padR(top, 29) + cs);
    text(1, 2, padR(sub, 30));
    var line;
    if (g.paused) line = 'PAUSE  HOLD START+SELECT: MENU';
    else if (R.phase === 'deal') line = 'DEALING...';
    else if (R.phase === 'ready') line = 'READY  ' + (3 - Math.floor(R.pt / 30)) + '...';
    else if (g.msgT > 0) line = g.msg;
    else if (R.kind === 'vs' && R.turn === 'c') line = 'PIPPO IS THINKING...';
    else if (R.kind === 'time' && R.timeF < 600 && (g.t & 16)) line = 'HURRY!';
    else line = R.kind === 'vs' ? 'YOUR TURN  DPAD + A FLIP' : 'DPAD + A FLIP  B PEEK' + (R.peekUsed ? ' USED' : ' X1');
    text(1, MSG_ROW, padR(line, 30));
  }

  /* ================================================================ 主迴圈 */
  function updatePlay() {
    var R = g.run;
    if (startPressed() && R.phase !== 'deal') {
      g.paused = !g.paused;
      if (g.paused) AU.pause(); else AU.resume();
      g.hold = {};
    }
    if (g.paused) return;
    g.t++;
    if (g.msgT > 0) g.msgT--;
    updateRun();
  }

  /* ================================================================ 機器人：只讀畫面（名稱表）+ 記住看過的 */
  function botLag() { var v = parseInt((CT.query && CT.query('lag')) || '', 10); return isNaN(v) ? 12 : clamp(v, 0, 120); }
  function botEye(B) {
    // 從 PPU 名稱表讀每張牌「牌面圖左上那格」與「框左上那格」：認得圖 = 記住；框是配對成功框 = 已完成
    var R = g.run, ppu = nes0.ppu, mf = art.t('MF0'), fr = art.t('FR0');
    B.up = [];
    for (var i = 0; i < R.W * R.H; i++) {
      var p = cardRC(i), tf = ppu.getTile(0, p[0] + 1, p[1] + 1), tb = ppu.getTile(0, p[0], p[1]);
      var f = art.faceOf[tf];
      if (f !== undefined) B.mem[i] = f;
      if (tb === mf) B.done[i] = true;
      else if (tb === fr && f !== undefined) B.up.push(i);
    }
  }
  function botTarget(B) {
    var R = g.run, N = R.W * R.H, i, j, here = R.cy * R.W + R.cx;
    var free = function (k) { return !B.done[k] && B.up.indexOf(k) < 0; };
    function nearestUnknown(except) {
      var best = -1, bd = 1e9;
      for (var k = 0; k < N; k++) {
        if (!free(k) || B.mem[k] !== undefined || k === except) continue;
        var d = Math.abs((k % R.W) - R.cx) + Math.abs(((k / R.W) | 0) - R.cy);
        if (d < bd) { bd = d; best = k; }
      }
      if (best < 0) for (k = 0; k < N; k++) if (free(k) && k !== except) return k;
      return best;
    }
    if (B.up.length === 1) {
      var f = B.mem[B.up[0]];
      for (i = 0; i < N; i++) if (i !== B.up[0] && free(i) && B.mem[i] === f) return i;
      return nearestUnknown(B.up[0]);
    }
    for (i = 0; i < N; i++) if (free(i) && B.mem[i] !== undefined)
      for (j = i + 1; j < N; j++) if (free(j) && B.mem[j] === B.mem[i]) return i;
    void here;
    return nearestUnknown(-1);
  }
  function botMask() {
    var B = g.bot;
    if (!B) B = g.bot = { t: 0, prev: 0, last: 0, react: 0, key: '', mem: {}, done: {}, up: [], lag: botLag() };
    B.t++;
    var m = inner();
    if (m && B.prev) m = 0;
    B.prev = m;
    if (m) B.last = B.t;
    return m;
    function inner() {
      var R = g.run;
      if (g.mode === 'title') {
        var wm = clamp((parseInt((CT.query && CT.query('pmode')) || '1', 10) || 1) - 1, 0, 2);
        var wl = clamp((parseInt((CT.query && CT.query('plvl')) || '2', 10) || 2) - 1, 0, GAMES[wm].lv.length - 1);
        B.mem = {}; B.done = {};
        if (g.t < 30) return 0;
        if (g.sel !== wm) return (B.t % 8 === 0) ? BTN.DOWN : 0;
        if (g.lvl[wm] !== wl) return (B.t % 8 === 0) ? BTN.RIGHT : 0;
        return (B.t % 20 === 0) ? BTN.START : 0;
      }
      if (g.mode === 'over' || g.mode === 'result') { B.mem = {}; B.done = {}; return (g.overT > 60 && B.t % 30 === 0) ? BTN.START : 0; }
      if (g.paused) return (B.t % 30 === 0) ? BTN.START : 0;
      if (!R) return 0;
      if (R.phase === 'deal') { B.mem = {}; B.done = {}; }
      botEye(B);
      var k = R.phase + ':' + (R.turn || '') + ':' + B.up.length;
      if (k !== B.key) { B.key = k; B.react = B.lag; }       // 畫面狀態一變 ⇒ 重新反應
      if (R.phase !== 'pick' || !myTurn()) return 0;
      if (B.up.length === 1 && B.mem[B.up[0]] === undefined) return 0;
      if (B.react > 0) { B.react--; return 0; }
      var tgt = botTarget(B);
      if (tgt < 0) return 0;
      var tx = tgt % R.W, ty = (tgt / R.W) | 0;
      if (B.t - B.last < 6) return 0;
      if (R.cy !== ty) return R.cy < ty ? BTN.DOWN : BTN.UP;
      if (R.cx !== tx) return R.cx < tx ? BTN.RIGHT : BTN.LEFT;
      return BTN.A;
    }
  }
  function goalOk() { return !!(g && g.goalRun && !g.goalRun.cheated); }

  /* ================================================================ 註冊 */
  var GAME = {
    id: 'cards', order: 1, title: '星塵翻牌', legacy: ['memory-card.html', 'card-memory.html', 'memory-match.html', 'memory-matching.html'],
    init: function (nes) {
      nes0 = nes;
      art = CA.Art.make();
      var ppu = nes.ppu, i;
      NES.CHR.setPattern(0, 'cards_bg');
      NES.CHR.setPattern(1, 'cards_spr');
      if (ppu.setPatternTables) ppu.setPatternTables(0, 1);
      ppu.spriteMode(8);
      ppu.flickerStep = 0;
      ppu.setBackdrop(PAL.bd);
      for (i = 0; i < 4; i++) { ppu.setBgPalette(i, PAL.bg[i]); ppu.setSprPalette(i, PAL.spr[i]); }
      GAME.backTile = { tile: art.s('DOT'), pal: 3 };
      AU.init(nes);
      g = newState();
      enterTitle();
      var qm = CT.query ? parseInt(CT.query('pmode') || '', 10) : NaN;
      if (qm >= 1 && qm <= 3 && CT.query('direct') === '1') {
        var ql = clamp((parseInt(CT.query('plvl') || '2', 10) || 2) - 1, 0, GAMES[qm - 1].lv.length - 1);
        g.sel = qm - 1; g.lvl[qm - 1] = ql; startGame(qm - 1, ql);
      }
    },
    update: function () {
      var I = NES.Input;
      if (g.cheatReq) { g.cheatReq = false; doCheat(); }
      if (g.mode === 'title') updateTitle();
      else if (g.mode === 'over' || g.mode === 'result') {
        g.overT++;
        if (g.overT > 40) {
          var R = g.run;
          if (g.mode === 'result' && I.pressed(BTN.A) && R && R.kind !== 'vs' && R.sz < 4) { g.lvl[R.m] = R.sz + 1; startGame(R.m, R.sz + 1); }
          else if (startPressed()) enterTitle();
        }
      } else updatePlay();
      AU.tick();
    },
    draw: function () {
      if (g.mode === 'title') { if ((g.t & 31) === 0) text(11, 26, (g.t & 32) ? '          ' : 'PUSH START'); }
      else if (g.mode === 'play') hud();
      flush();
      drawSprites();
    },
    state: function () {
      var R = g.run, r = null;
      if (R) {
        r = { kind: R.kind, lvl: R.lvl, sz: R.sz, W: R.W, H: R.H, n: R.n, phase: R.phase, pt: R.pt, cx: R.cx, cy: R.cy, kx: R.kx, ky: R.ky,
          moves: R.moves, limit: R.limit, timeF: R.timeF, score: R.score, combo: R.combo, maxCombo: R.maxCombo, matched: R.matched,
          turn: R.turn, pp: R.pp, cp: R.cp, open: R.open.slice(), anims: R.anims.length, mem: R.mem.length, peekUsed: R.peekUsed,
          cheated: R.cheated, continues: R.continues, cleared: !!R.cleared, misses: R.misses,
          st: R.cards.map(function (c) { return c.st; }), vis: R.cards.map(function (c) { return c.vis; }) };
      }
      return { mode: g.mode, sel: g.sel, lvl: g.lvl.slice(), paused: g.paused, t: g.t, queue: g.q.length + g.qa.length, run: r, goal: goalOk(), music: AU.current };
    },
    exit: function () { if (g && g.run && !g.run.cheated && (g.mode === 'play' || g.mode === 'over')) saveBest(g.run.score); AU.stop(); },
    cheat: function () { if (!g || g.mode === 'title' || g.mode === 'result' || !g.run) return false; g.cheatReq = true; return true; },
    bot: function () { return botMask(); },
    goal: function () { return goalOk(); },
    bestText: function () { return pad(Math.min(999999, load('best')), 6); }
  };
  CA.GAMES = GAMES; CA.SIZES = SIZES; CA.LIMIT = LIMIT; CA.TIME_S = TIME_S; CA.MEM = MEM;
  CA.K = { FLIP_STEP: FLIP_STEP, DEAL_EVERY: DEAL_EVERY, READY_F: READY_F, PEEK_F: PEEK_F, REP: [REP_DELAY, REP_EVERY] };
  CA.dev = {
    g: function () { return g; },
    start: function (m, lv) { g.sel = m; g.lvl[m] = lv; return startGame(m, lv); },
    title: function () { enterTitle(); },
    // 測試用：跳過發牌 + READY
    skipIntro: function () { var R = g.run; while (R.dealt < R.cards.length) { drawCard(R.dealt, 'back'); R.dealt++; } R.phase = 'pick'; R.pt = 0; },
    faces: function () { return g.run.cards.map(function (c) { return c.f; }); },
    cardRC: function (i) { return cardRC(i); },
    cpuChoose: function () { return cpuChoose(); },
    tryFlip: function (i) { return tryFlip(i); }
  };
  if (CT.register) CT.register(GAME);
})();

</script>
<script>/* games/cart4/color/art.js */
/*
 * games/cart4/color/art.js — 《星塵色感 HUE SENSE》CHR（全部原創；程式化 + 手繪）
 * ---------------------------------------------------------------------------
 * 擁有者：C8-0 cart4-shell+color（R8）｜ 依賴：engine/chr.js（字身沿用原創 DEMO.FONT）
 *
 * 背景磚（color_bg）：
 *   F_*            字型（色 3）
 *   BIG_<字>0..3   16×16 大字（色 1 描邊陰影 / 色 2 本體 / 色 3 上緣高光）：色字題目與標題共用；
 *                  色字題目時第 3 組 BG 調色盤 = [$00 灰陰影, 墨色, 墨色] ⇒ 整個字只有一種墨色
 *   SH_<k>_0..3    6 種色鍵的形狀標記（16×16）：k = 0 紅● / 1 藍■ / 2 綠▲ / 3 黃★ / 4 粉◆ / 5 白✚，
 *                  各自畫在固定的調色盤色號（紅藍綠 = BG1 的 1/2/3、黃粉白 = BG2 的 1/2/3）⇒ 色弱也能靠形狀分
 *   SOL1..3        實心磚（色塊衝刺 / 調色的色塊）；QM_0..3 大問號（記憶回合蓋住目標色）
 *   TB0..8         計時條（0~8 px 填滿，色 3）
 *   BH/BHB/BV/BVR  外框；ST1/ST2 背景星點；PADC 十字鍵中心
 * 精靈（color_spr）：MK_<k>_0..3 形狀標記（色 3 = 墨色、色 1 = 白描邊；SHAPE ASSIST 用）、
 *   ARW 箭頭、CUR 游標角、DOT（backTile）、SPK 閃光、TICK 調色刻度指針
 */
(function () {
  'use strict';
  var NES = window.NES = window.NES || {};
  var CT = window.CT = window.CT || {};
  var CO = CT.Color = CT.Color || {};
  var CHR = NES.CHR;
  var FONT = (CHR && CHR.DEMO && CHR.DEMO.FONT) || {};
  var CHARMAP = (CHR && CHR.DEMO && CHR.DEMO.CHARMAP) || {};

  function canvas(w, h) { var a = []; for (var y = 0; y < h; y++) { a.push([]); for (var x = 0; x < w; x++) a[y].push(0); } return a; }
  function slice(px) {
    var h = px.length, w = px[0].length, out = [];

      var t = new Uint8Array(64);
      for (var y = 0; y < 8; y++) for (var x = 0; x < 8; x++) t[y * 8 + x] = px[ty * 8 + y][tx * 8 + x];
      out.push(t);
    }
    return out;
  }
  function E8() { return ['........', '........', '........', '........', '........', '........', '........', '........']; }
  function fill8(c) { var r = ''; for (var i = 0; i < 8; i++) r += c; return [r, r, r, r, r, r, r, r]; }
  function outline(px, v) {
    var h = px.length, w = px[0].length, src = px.map(function (r) { return r.slice(); });
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
      if (src[y][x]) continue;
      if ((x > 0 && src[y][x - 1]) || (x < w - 1 && src[y][x + 1]) || (y > 0 && src[y - 1][x]) || (y < h - 1 && src[y + 1][x])) px[y][x] = v;
    }
  }
  // 8×8 字身放大 2×：本體色 2、上 3 列高光 3、右下陰影 1
  function bigGlyph(g) {
    var px = canvas(16, 16), i, j, dx, dy, X, Y;
    for (j = 0; j < 8; j++) for (i = 0; i < 8; i++) {
      if (!g || g[j].charAt(i) === '.') continue;
      for (dy = 0; dy < 2; dy++) for (dx = 0; dx < 2; dx++) {
        X = i * 2 + dx - 1; Y = j * 2 + dy;
        if (Y + 1 < 16 && X + 1 < 16 && X + 1 >= 0 && px[Y + 1][X + 1] === 0) px[Y + 1][X + 1] = 1;
        if (X >= 0) px[Y][X] = j < 3 ? 3 : 2;
      }
    }
    return px;
  }

  /* ---------------- 形狀 16×16（on = 形狀內）：0 圓 / 1 方 / 2 三角 / 3 星 / 4 菱 / 5 十字 ---------------- */
  function inShape(k, x, y) {
    var dx = x - 7.5, dy = y - 7.5, r, a;
    if (k === 0) return dx * dx + dy * dy <= 6.6 * 6.6;
    if (k === 1) return x >= 2 && x <= 13 && y >= 2 && y <= 13;
    if (k === 2) return y >= 2 && y <= 14 && Math.abs(dx) <= (y - 1) * 0.55;
    if (k === 3) { r = Math.sqrt(dx * dx + dy * dy); a = Math.atan2(dy, dx); return r <= 3.4 + 4.0 * Math.max(0, Math.cos((a + Math.PI / 2) * 5)) * 0.95; }
    if (k === 4) return Math.abs(dx) + Math.abs(dy) <= 7.2;
    return (Math.abs(dx) <= 2.6 && Math.abs(dy) <= 7) || (Math.abs(dy) <= 2.6 && Math.abs(dx) <= 7);
  }

/*
 * games/cart4/color/main.js — 《星塵色感 HUE SENSE》（合輯卡帶四 槽 8，id = color）
 * ---------------------------------------------------------------------------
 * 擁有者：C8-0 cart4-shell+color（R8）｜ 依賴：color/art.js、color/song.js、games/cart1/registry.js

 *
 * 色鍵（固定對應，說明頁與遊玩畫面都畫成手把對照圖；每色另有形狀 ⇒ 色弱可靠形狀分）：
 *   ↑ 紅● $16 / → 藍■ $12 / ↓ 綠▲ $2A / ← 黃★ $28 / B 粉◆ $24 / A 白✚ $30
 * 三個模式（標題 ↑↓ 選、A / START 開始；SHAPE ASSIST 列 ←→ 切換；B = 說明頁）：
 *   1 INK OR WORD 色字干擾：畫面中央大字寫著色名（RED…），字本身用另一種墨色。按「墨色」對應的鍵。
 *       5 級 × 8 題 = 40 題：LV1 4 色 180 幀 / LV2 4 色 150 幀 / LV3 6 色（加 B / A）150 幀 / LV4 6 色 120 幀 + 字位置跳動 /

 *       得分 = 50 + 速度分 ⌊50 × 剩餘幀 / 限時⌋ + 連對 min(combo,10) × 5；評價 S ≥ 5000 / A ≥ 4000 / B ≥ 3000。
 *       字是先「藏起來」寫進名稱表（第 3 組 BG 調色盤全黑），寫完那一幀才換上墨色並開始計時 ⇒ 反應時間從看得到那幀起算。
 *   2 COLOR RUSH 色塊衝刺：60.0 秒（3606 幀）內連答兩題型——SAME?（A 相同 / B 不同）與 BRIGHTER?（← / → 哪邊比較亮，

 *       得分 = max(0, 1000 − 250 × 色相差 − 300 × 亮度差) + 時間分（≤ 100）。

 * 時間一律以幀計（60.0988 Hz），反應時間顯示換算成 ms（幀 × 1000 / 60.0988）。

 * 機器人：預設反應延遲 18 幀（`&lag=N` 可調），從「畫面上的」BG 調色盤讀墨色 / 色塊顏色，題目字與規則讀畫面上顯示的那一份。

    { key: 'rush', name: 'COLOR RUSH', sub: 'SAME? BRIGHTER? 60 SECONDS' },
    { key: 'mix', name: 'HUE MIXER', sub: 'DIAL IN THE TARGET COLOR' }

      var pts = 100 + Math.min(R.combo, 20) * 10;
      R.score += pts; R.combo++; R.ok++; if (R.combo > R.maxCombo) R.maxCombo = R.combo;
      R.rts.push(Q.t); if (!R.bestRt || Q.t < R.bestRt) R.bestRt = Q.t;
      Q.res = 'ok'; AU.sfx('color_ok'); say('OK! ' + ms(Q.t) + 'MS  +' + pts, 30);
      R.phase = 'fb'; R.pt = 0; R.fbLen = 16;
    } else {
      R.combo = 0; R.miss++; R.time = Math.max(0, R.time - RUSH_PENALTY);
      Q.res = 'miss'; AU.sfx('color_ng'); say('MISS! -3.0 SEC', 40);
      R.phase = 'fb'; R.pt = 0; R.fbLen = 36;
    }
  }
  function updateRush() {
    var R = g.run, I = NES.Input;
    R.pt++;
    if (R.phase === 'ready') {
      if (R.pt === 1) { clearRow(5, 1, 30); center(5, 'COLOR RUSH  READY'); }
      if (R.pt % 40 === 1 && R.pt < 160) { clearRow(20, 1, 30); center(20, R.pt < 121 ? String(3 - Math.floor(R.pt / 40)) : 'GO!'); AU.sfx(R.pt < 121 ? 'color_tick' : 'color_go'); }
      if (R.pt >= 160) rushNewQ();
      return;
    }
    R.time--;
    if (R.time <= 0) { R.time = 0; finish(); return; }
    if (R.phase === 'ask') {
      var Q = R.cur;
      Q.t++;
      if (Q.type === 'same') { if (I.pressed(BTN.A)) rushAnswer('same'); else if (I.pressed(BTN.B)) rushAnswer('diff'); }
      else { if (I.pressed(BTN.LEFT)) rushAnswer('left'); else if (I.pressed(BTN.RIGHT)) rushAnswer('right'); }
      return;
    }
    if (R.phase === 'fb' && R.pt >= R.fbLen) rushNewQ();
  }

  /* ================================================================ 3 調色 */
  function mixNewRound() {
    var R = g.run, th = 1 + rnd() % 12, tl = rnd() % 4;
    R.qid++;
    R.cur = { id: R.qid, th: th, tl: tl, h: mkColor(th + 6, 0) & 15, l: (tl + 2) % 4, t: 0, mem: R.round >= MIX_MEM_FROM, covered: false, peeked: false, peekT: 0, reveal: false };
    mixPal();
    clearRow(5, 1, 30); center(5, 'ROUND ' + (R.round + 1) + '/' + MIX_ROUNDS + (R.cur.mem ? '  MEMORIZE!' : ''));
    clearRow(20, 1, 30); center(20, 'L/R HUE  U/D LIGHT  A SET');
    assistCodes();
    R.phase = 'ask'; R.pt = 0;
  }
  function targetColor(Q) { return mkColor(Q.th, Q.tl); }
  function mixPal() {
    var Q = g.run.cur, tc = targetColor(Q), yc = mkColor(Q.h, Q.l);
    var cover = Q.covered && Q.peekT <= 0 && g.run.phase === 'ask';
    setPal(2, cover ? [0x00, 0x00, 0x10] : [tc, tc, tc]);
    setPal(3, [yc, yc, yc]);
  }
  function setCover(on) {
    for (var a = 0; a < 2; a++) for (var b = 0; b < 2; b++) put(7 + a, 11 + b, on ? art.t('QM_' + (b * 2 + a)) : art.t('SOL3'));
  }
  function mixScore(Q) {
    var hd = hueDist(Q.h, Q.th), ld = Math.abs(Q.l - Q.tl), base = Math.max(0, 1000 - 250 * hd - 300 * ld);
    return { hd: hd, ld: ld, base: base, bonus: base > 0 ? Math.min(100, Math.floor(Math.max(0, MIX_TIME - Q.t) / 6)) : 0 };
  }
  function mixSubmit() {
    var R = g.run, Q = R.cur, s = mixScore(Q), pts = s.base + s.bonus - (Q.peeked ? MIX_PEEK_COST : 0);
    pts = Math.max(0, pts);
    R.score += pts; Q.pts = pts; Q.res = s.base >= 1000 ? 'perfect' : (s.base > 0 ? 'ok' : 'miss');
    if (s.base >= 1000) { R.ok++; R.combo++; } else { R.combo = 0; if (!s.base) R.miss++; }
    if (R.combo > R.maxCombo) R.maxCombo = R.combo;
    R.phase = 'fb'; R.pt = 0; R.fbLen = 90;
    Q.covered = false; setCover(false); Q.reveal = true; mixPal(); assistCodes();
    AU.sfx(s.base >= 1000 ? 'color_level' : (s.base > 0 ? 'color_ok' : 'color_ng'));
    say((s.base >= 1000 ? 'PERFECT! ' : (s.hd ? 'HUE OFF ' + s.hd + ' ' : 'HUE OK ') + (s.ld ? 'LIGHT OFF ' + s.ld : 'LIGHT OK ')) + ' +' + pts, 90);
  }
  function updateMix() {
    var R = g.run, I = NES.Input;
    R.pt++;
    if (R.phase === 'ready') {
      if (R.pt === 1) { clearRow(5, 1, 30); center(5, 'HUE MIXER  READY'); }
      if (R.pt % 40 === 1 && R.pt < 160) { clearRow(20, 1, 30); center(20, R.pt < 121 ? String(3 - Math.floor(R.pt / 40)) : 'GO!'); AU.sfx(R.pt < 121 ? 'color_tick' : 'color_go'); }
      if (R.pt >= 160) mixNewRound();
      return;
    }
    if (R.phase === 'ask') {
      var Q = R.cur, ch = false;
      Q.t++;
      if (Q.mem && !Q.covered && Q.t >= MIX_SHOW) { Q.covered = true; setCover(true); mixPal(); clearRow(5, 1, 30); center(5, 'ROUND ' + (R.round + 1) + '/' + MIX_ROUNDS + '  B = PEEK'); }
      if (Q.peekT > 0 && --Q.peekT === 0) mixPal();
      if (Q.covered && !Q.peeked && I.pressed(BTN.B)) { Q.peeked = true; Q.peekT = MIX_PEEK; mixPal(); AU.sfx('color_peek'); say('PEEK -' + MIX_PEEK_COST, 40); }
      if (rep(BTN.LEFT)) { Q.h = Q.h === 1 ? 12 : Q.h - 1; ch = true; }
      if (rep(BTN.RIGHT)) { Q.h = Q.h === 12 ? 1 : Q.h + 1; ch = true; }
      if (rep(BTN.UP) && Q.l < 3) { Q.l++; ch = true; }
      if (rep(BTN.DOWN) && Q.l > 0) { Q.l--; ch = true; }
      if (ch) { mixPal(); assistCodes(); AU.sfx('color_move'); }
      if (I.pressed(BTN.A) || Q.t >= MIX_TIME) mixSubmit();
      return;
    }
    if (R.phase === 'fb' && R.pt >= R.fbLen) {
      R.round++;
      if (R.round >= MIX_ROUNDS) { finish(); return; }
      mixNewRound();
    }
  }

  /* ================================================================ HUD */
  function hud() {
    var R = g.run;
    if (!R) return;
    var star = R.cheated ? '$' : ' ';
    if (R.kind === 'ink') {
      var h = '';
      for (var i = 0; i < INK_LIVES; i++) h += i < R.lives ? '^' : ' ';
      text(1, 1, padR('INK OR WORD LV' + (R.lv + 1), 18) + star + 'SC ' + pad(R.score, 6) + ' ');
      text(1, 2, padR('Q ' + pad(Math.min(R.qi + 1, 40), 2) + '/40  ' + h + '  COMBO ' + pad(R.combo, 2), 30));
      var Q = R.cur;
      if (Q && R.phase === 'ask') drawBar(Q.limit - Q.t, Q.limit);
      else if (R.phase !== 'fb') drawBar(0, 1);
    } else if (R.kind === 'rush') {
      text(1, 1, padR('COLOR RUSH', 18) + star + 'SC ' + pad(R.score, 6) + ' ');
      text(1, 2, padR('TIME ' + secText(R.time) + '  OK ' + pad(R.ok, 3) + '  COMBO ' + pad(R.combo, 2), 30));
    } else {
      text(1, 1, padR('HUE MIXER', 18) + star + 'SC ' + pad(R.score, 6) + ' ');
      var Qm = R.cur;
      text(1, 2, padR('ROUND ' + pad(Math.min(R.round + 1, MIX_ROUNDS), 2) + '/' + MIX_ROUNDS + '  TIME ' + (Qm && R.phase === 'ask' ? secText(MIX_TIME - Qm.t) : secText(MIX_TIME)), 30));
    }
    var line;
    if (g.paused) line = 'PAUSE  HOLD START+SELECT: MENU';
    else if (g.msgT > 0) line = g.msg;
    else if (R.kind === 'ink') line = R.cur && R.cur.rule === 'WORD' ? 'RULE: WORD  (WHAT IT SAYS)' : 'RULE: INK  (THE COLOR)';
    else if (R.kind === 'rush') line = 'START PAUSE  WRONG = -3 SEC';
    else line = R.cur && R.cur.covered && !R.cur.peeked ? 'B PEEK AGAIN (-' + MIX_PEEK_COST + ')' : 'MATCH THE TARGET COLOR';
    text(1, MSG_ROW, padR(line, 30));
  }

  /* ================================================================ 結算 / GAME OVER */
  function avgRt(R) { if (!R.rts.length) return 0; var s = 0; for (var i = 0; i < R.rts.length; i++) s += R.rts[i]; return s / R.rts.length; }
  function checkGoal(R) { if (R.kind === 'ink' && !R.cheated && R.score >= GOAL_SCORE && !g.goalRun) g.goalRun = R; }
  function finish() {
    var R = g.run, nb = saveBest(R), lines;
    checkGoal(R);
    if (R.kind === 'ink') lines = ['40 QUESTIONS CLEAR!', 'SCORE ' + pad(R.score, 6), 'CORRECT ' + pad(R.ok, 2) + '/40  MAX COMBO ' + pad(R.maxCombo, 2), 'AVG ' + ms(avgRt(R)) + 'MS  BEST ' + ms(R.bestRt) + 'MS'];
    else if (R.kind === 'rush') lines = ['TIME UP!', 'SCORE ' + pad(R.score, 6), 'CORRECT ' + pad(R.ok, 3) + '  MISS ' + pad(R.miss, 2), 'AVG ' + ms(avgRt(R)) + 'MS  MAX COMBO ' + pad(R.maxCombo, 2)];
    else lines = ['MIXER COMPLETE!', 'SCORE ' + pad(R.score, 6), 'PERFECT ' + pad(R.ok, 2) + '/' + MIX_ROUNDS, ''];
    enterResult(lines, rating(R.kind, R.score), nb);
  }
  function enterResult(lines, rk, nb) {
    var R = g.run;
    g.mode = 'result'; g.overT = 0; R.phase = 'done';
    redraw(function () {
      for (var c = 2; c < 30; c++) { put(c, 4, art.t('BH')); put(c, 25, art.t('BHB')); }
      for (var i = 0; i < lines.length; i++) if (lines[i]) center(7 + i * 2, lines[i]);
      center(16, 'RATING ' + rk);
      if (R.cheated) center(19, 'CHEAT USED - NOT SAVED');
      else if (nb) center(19, 'NEW RECORD!');
      center(22, 'PUSH START');
    });
    AU.play('color_win');
  }
  function enterOver(why) {
    var R = g.run;
    saveBest(R); checkGoal(R);
    g.mode = 'over'; g.overT = 0; R.why = why; R.phase = 'over';
    redraw(function () {
      for (var c = 4; c < 28; c++) { put(c, 5, art.t('BH')); put(c, 24, art.t('BHB')); }
      center(8, 'GAME OVER');
      center(11, why);
      center(14, 'REACHED Q ' + pad(R.qi, 2) + '/40');
      center(17, 'C/$ = CONTINUE HERE');
      center(19, 'START = TITLE');
    });
    AU.play('color_over');
  }

  /* ================================================================ 密技 */
  function doCheat() {
    var R = g.run;
    if (!R) return;
    R.cheated = true;
    if (g.mode === 'over') {      // 原地續關：同一題、命補滿、分數保留
      R.continues++; R.lives = INK_LIVES; R.saved = false; R.qi = Math.max(0, R.qi - 1);
      g.mode = 'ink'; R.phase = 'ready'; R.pt = 0;
      layout(); AU.play('color_play'); say('CONTINUE! LIVES REFILLED', 60);
      return;
    }
    if (R.kind === 'ink') {
      R.lives = Math.min(INK_LIVES, R.lives + 2);
      if (R.cur && R.phase === 'ask') R.cur.t = 0;
      say('STAR BOOST! +2 LIVES', 60);
    } else if (R.kind === 'rush') { R.time += RUSH_BONUS_CHEAT; say('STAR BOOST! +10 SEC', 60); }
    else if (R.cur) { R.cur.reveal = true; R.cur.t = 0; assistCodes(); say('STAR HINT: H' + pad(R.cur.th, 2) + ' L' + R.cur.tl, 90); }
    AU.sfx('color_ok');
  }

  /* ================================================================ 精靈 */
  function drawSprites() {
    var ppu = nes0.ppu, n = 0, R = g.run;
    function spr(x, y, tile, pal, fh, fv) { if (y > 231 || y < -7) return; ppu.sprite(n++, { x: x, y: y, tile: tile, pal: pal, flipH: !!fh, flipV: !!fv }); }
    function mark(x, y, k) { for (var i = 0; i < 4; i++) spr(x + (i & 1) * 8, y + (i >> 1) * 8, art.s('MK_' + k + '_' + i), 1); }
    if (g.mode === 'title') spr(28, titleRow(g.sel) * 8, art.s('ARW'), 0);
    if (R && g.mode === 'ink' && !g.paused && R.cur) {
      var Q = R.cur;
      if (g.assist && (R.phase === 'ask' || R.phase === 'fb')) {
        mark(Q.col * 8 - 20, WORD_ROW * 8, Q.ink);
        mark((Q.col + Q.len * 2) * 8 + 4, WORD_ROW * 8, Q.ink);
      }
      if (R.phase === 'fb') {
        var sw = COLORS[Q.ans].sw;
        if (Q.res === 'miss') { if ((R.pt & 8) === 0) spr(sw[0] * 8 - 10, sw[1] * 8 + 4, art.s('ARW'), 0); }
        else { spr(sw[0] * 8 + 4, sw[1] * 8 - 6, art.s('SPK'), 2); spr(sw[0] * 8 + 12, sw[1] * 8 + 12, art.s('SPK'), 2); }
      }
    }
    if (R && g.mode === 'rush' && !g.paused && R.cur && R.phase === 'fb' && R.cur.res === 'ok') {
      var side = R.cur.ans === 'right' ? 20 : (R.cur.ans === 'left' ? 4 : 12);
      spr(side * 8 + 28, 56, art.s('SPK'), 2);
    }
    if (R && g.mode === 'mix' && !g.paused && R.cur && R.phase === 'ask') {
      // 刻度指針：色相 12 格（第 18 列刻度 19~30 欄），指針在第 19 列
      spr((19 + R.cur.h - 1) * 8, 19 * 8, art.s('TICK'), 0);
    }
    for (var q = n; q < g.sprUsed; q++) ppu.sprite(q, null);
    g.sprUsed = n;
  }

  /* ================================================================ 主迴圈 */
  function playing() { return g.mode === 'ink' || g.mode === 'rush' || g.mode === 'mix'; }
  function setPaused(p) {
    var R = g.run;
    g.paused = p;
    if (p) {
      AU.pause();
      g.savedPal = [nes0.ppu.getBgPalette(2).slice(1), nes0.ppu.getBgPalette(3).slice(1)];
      if (R.kind === 'ink') setPal(3, HIDE); else { setPal(2, HIDE); setPal(3, HIDE); }   // 暫停時藏題目（不能偷看）
    } else {
      AU.resume();
      if (g.savedPal) { if (R.kind !== 'ink') setPal(2, g.savedPal[0]); setPal(3, g.savedPal[1]); }
    }
    g.hold = {};
  }
  function updatePlay() {
    if (startPressed()) setPaused(!g.paused);
    if (g.paused) return;
    g.t++;
    if (g.msgT > 0) g.msgT--;
    if (g.mode === 'ink') updateInk();
    else if (g.mode === 'rush') updateRush();
    else updateMix();
  }

  /* ================================================================ 機器人（反應延遲 lag 幀；只讀畫面上的東西） */
  function botLag() { var v = CT.query ? parseInt(CT.query('lag') || '', 10) : NaN; return isNaN(v) ? 18 : clamp(v, 0, 600); }
  function botMask() {
    var B = g.bot;
    B.t++;
    if (B.hold > 0) { B.hold--; return B.mask; }
    var m = inner();
    if (m) { B.mask = m; B.hold = 2; }        // 人類按鍵約 3 幀
    return m;
    function tap(k) { return (B.t % 6 === 0) ? k : 0; }
    function inner() {
      var R = g.run, ppu = nes0.ppu;
      if (g.mode === 'title') {
        var wm = clamp((parseInt((CT.query && CT.query('pmode')) || '1', 10) || 1) - 1, 0, 2);
        if (g.t < 30) return 0;
        if (g.sel !== wm) return (B.t % 10 === 0) ? BTN.DOWN : 0;
        return (B.t % 20 === 0) ? BTN.START : 0;
      }
      if (g.mode === 'help') return (g.t > 30 && B.t % 20 === 0) ? BTN.B : 0;
      if (g.mode === 'over' || g.mode === 'result') return (g.overT > 90 && B.t % 30 === 0) ? BTN.START : 0;
      if (g.paused) return (B.t % 30 === 0) ? BTN.START : 0;
      if (!R || !R.cur || R.phase !== 'ask') return 0;
      var Q = R.cur;
      if (B.seen !== Q.id) { B.seen = Q.id; B.at = B.t + botLag(); }
      if (R.kind === 'ink') {
        if (B.t < B.at) return 0;
        var ink = colorIndex(ppu.getBgPalette(3)[3]);          // 畫面上的墨色
        if (ink < 0) return 0;
        var ans = Q.rule === 'INK' ? ink : Q.word;             // 規則 / 字 = 畫面上寫的那一份
        return COLORS[ans].key;
      }
      if (R.kind === 'rush') {
        if (B.t < B.at) return 0;
        var L = ppu.getBgPalette(2)[3], Rc = ppu.getBgPalette(3)[3];
        if (Q.type === 'same') return L === Rc ? BTN.A : BTN.B;
        return rowOf(L) > rowOf(Rc) ? BTN.LEFT : BTN.RIGHT;
      }
      // 調色：目標亮著的時候記住（記憶回合也只在展示的 120 幀內讀），再一格一格轉過去
      var tp = ppu.getBgPalette(2)[3];
      if (!(Q.covered && Q.peekT <= 0) && tp !== 0x10) { B.mem = tp; B.memRound = Q.id; }
      if (B.memRound !== Q.id || B.t < B.at) return 0;
      var th = hueOf(B.mem), tl = rowOf(B.mem);
      if (Q.h !== th) { var fw = (th - Q.h + 12) % 12; return tap(fw <= 6 ? BTN.RIGHT : BTN.LEFT); }
      if (Q.l !== tl) return tap(Q.l < tl ? BTN.UP : BTN.DOWN);
      return (B.t % 12 === 0) ? BTN.A : 0;
    }
  }
  function goalOk() { return !!(g && g.goalRun && !g.goalRun.cheated); }

  /* ================================================================ 註冊 */
  var GAME = {
    id: 'color', order: 8, title: '星塵色感', legacy: ['color-match.html', 'color-rush.html'],
    init: function (nes) {
      nes0 = nes;
      art = CO.Art.make();
      var ppu = nes.ppu, i;
      NES.CHR.setPattern(0, 'color_bg');
      NES.CHR.setPattern(1, 'color_spr');
      if (ppu.setPatternTables) ppu.setPatternTables(0, 1);
      ppu.spriteMode(8);
      ppu.flickerStep = 0;
      ppu.setBackdrop(PAL.bd);
      for (i = 0; i < 4; i++) { ppu.setBgPalette(i, PAL.bg[i]); ppu.setSprPalette(i, PAL.spr[i]); }
      GAME.backTile = { tile: art.s('DOT'), pal: 3 };
      AU.init(nes);
      g = newState();
      enterTitle();
      var qm = CT.query ? parseInt(CT.query('pmode') || '', 10) : NaN;
      if (qm >= 1 && qm <= 3 && CT.query('direct') === '1') { g.sel = qm - 1; startGame(qm - 1); }
    },
    update: function () {
      if (g.cheatReq) { g.cheatReq = false; doCheat(); }
      if (g.mode === 'title') updateTitle();
      else if (g.mode === 'help') updateHelp();
      else if (g.mode === 'over' || g.mode === 'result') {
        g.overT++;
        if (g.overT > 40 && startPressed()) enterTitle();
      } else updatePlay();
      AU.tick();
    },
    draw: function () {
      if (playing()) hud();
      flush();
      drawSprites();
    },
    state: function () {
      var R = g.run, r = null;
      if (R) {
        r = { kind: R.kind, phase: R.phase, pt: R.pt, score: R.score, combo: R.combo, maxCombo: R.maxCombo, ok: R.ok, miss: R.miss,
              cheated: R.cheated, continues: R.continues, qid: R.qid, avgRt: avgRt(R), bestRt: R.bestRt, rts: R.rts.slice() };
        if (R.kind === 'ink') { r.qi = R.qi; r.lv = R.lv; r.lives = R.lives; }
        if (R.kind === 'rush') r.time = R.time;
        if (R.kind === 'mix') r.round = R.round;
        if (R.cur) { r.cur = {}; for (var k in R.cur) if (Object.prototype.hasOwnProperty.call(R.cur, k)) r.cur[k] = R.cur[k]; }
      }
      return { mode: g.mode, sel: g.sel, assist: g.assist, paused: g.paused, t: g.t, queue: g.q.length + g.qa.length, run: r, goal: goalOk(), music: AU.current };
    },
    exit: function () { if (g && g.run && (playing() || g.mode === 'over')) saveBest(g.run); AU.stop(); },
    cheat: function () { if (!g || !g.run || !(playing() || g.mode === 'over')) return false; g.cheatReq = true; return true; },
    bot: function () { return botMask(); },
    goal: function () { return goalOk(); },
    bestText: function () { return pad(Math.min(999999, CT.load('color', 'ink', 0) | 0), 6); }
  };
  CO.COLORS = COLORS;
  CO.MODES = MODES;
  CO.INK_LV = INK_LV;
  CO.K = { HZ: HZ, GOAL_SCORE: GOAL_SCORE, INK_PER_LV: INK_PER_LV, INK_LIVES: INK_LIVES, RUSH_TIME: RUSH_TIME, RUSH_PENALTY: RUSH_PENALTY,
    MIX_ROUNDS: MIX_ROUNDS, MIX_TIME: MIX_TIME, MIX_SHOW: MIX_SHOW, MIX_PEEK_COST: MIX_PEEK_COST, MIX_MEM_FROM: MIX_MEM_FROM, RATE: RATE };
  CO.dev = {
    g: function () { return g; },
    start: function (m) { g.sel = m; return startGame(m); },
    title: function () { enterTitle(); },
    help: function () { enterHelp(); },
    newInk: function () { inkNewQ(); }, newRush: function () { rushNewQ(); },
    ms: ms, hueDist: hueDist, mkColor: mkColor, rating: rating, mixScore: mixScore,
    // 測試用：把下一題換成指定的字 / 墨色 / 規則（只在 draw 階段之前呼叫）
    forceInk: function (word, ink, rule) {
      var R = g.run, Q = R.cur, name = COLORS[word].name;
      Q.word = word; Q.ink = ink; Q.rule = rule || 'INK'; Q.ans = Q.rule === 'INK' ? ink : word; Q.len = name.length;
      big(Q.col, WORD_ROW, padR(name, 6));
      if (R.phase === 'ask') inkReveal();
    }
  };
  if (CT.register) CT.register(GAME);
})();

</script>
<script>/* games/cart4/flash/art.js */
/*
 * games/cart4/flash/art.js — 《星塵閃記 STAR FLASH》CHR（全部原創；程式化幾何）
 * ---------------------------------------------------------------------------
 * 擁有者：C8-1 cart4-memory（R8）｜ 依賴：engine/chr.js（字身沿用原創 DEMO.FONT）
 *
 * PPU 規劃：
 *   大格 = 4×4 磁磚（32×32，= 2×2 屬性區塊，擺在偶數欄列）：CF0..15 共用框（色 1 框 / 色 2 底），中間 2×2 換圖。
 *   小格 = 2×2 磁磚（16×16，= 1 個屬性區塊）：SC_<狀態>_0..3（競速模式左右兩盤）。

 *     EMP 空格（暗、中心小點）／LIT 亮起（實心星）／MRK 你點的（菱形）／BAD 點錯（叉）／MIS 漏掉的（空心星）。
 *   找差異模式的 8 種符號 SY_<k>（色 3，靠調色盤上 4 種顏色：白 / 粉紅 / 綠 / 黃）：
 *     0 圓 / 1 三角 / 2 方 / 3 星 / 4 十字 / 5 新月 / 6 心 / 7 環
 * 背景磚（flash_bg）：F_* 字型、BH / BHB / BV / BVR 外框、ST1 / ST2 星點、BIG_<字> 標題大字、上述格子磚。
 * 精靈（flash_spr）：CUR 游標角、CHK 找到的勾、XX 點錯的叉、RING 提示圈、DOT（backTile）、ARW 選單箭頭

(function () {
  'use strict';
  var NES = window.NES = window.NES || {};
  var CT = window.CT = window.CT || {};
  var FL = CT.Flash = CT.Flash || {};

  var FONT = (CHR && CHR.DEMO && CHR.DEMO.FONT) || {};
  var CHARMAP = (CHR && CHR.DEMO && CHR.DEMO.CHARMAP) || {};

  function canvas(w, h, v) { var a = []; for (var y = 0; y < h; y++) { a.push([]); for (var x = 0; x < w; x++) a[y].push(v || 0); } return a; }
  function slice(px) {
    var h = px.length, w = px[0].length, out = [];

  }
  function E8() { return ['........', '........', '........', '........', '........', '........', '........', '........']; }
  function set(px, x, y, v) { x = Math.round(x); y = Math.round(y); if (px[y] && x >= 0 && x < px[y].length) px[y][x] = v; }
  function rect(px, x0, y0, x1, y1, v) { for (var y = y0; y <= y1; y++) for (var x = x0; x <= x1; x++) set(px, x, y, v); }
  function disc(px, cx, cy, r, v) {

      var dx = x + 0.5 - cx, dy = y + 0.5 - cy;

  function poly(px, pts, v) {

    for (var i = 0; i <= n; i++) set(px, x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, v);
  }
  // 只描在「底色 = bgv」的格子上（符號畫在色 2 底上，描邊 = 色 1）
  function outlineOn(px, v, bgv, src) {
    var h = px.length, w = px[0].length;
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
      if (src[y][x] || px[y][x] !== bgv) continue;

  }
  function bigGlyph(g) {
    var px = canvas(16, 16), i, j, dx, dy, X, Y;
    for (j = 0; j < 8; j++) for (i = 0; i < 8; i++) {
      if (!g || g[j].charAt(i) === '.') continue;
      for (dy = 0; dy < 2; dy++) for (dx = 0; dx < 2; dx++) {

  /* ---------------- 圖形（size×size，畫在 v=3 的 mask 上） ---------------- */
  function shapeMask(kind, S) {

    if (S === 10 && (kind === 'star' || kind === 'hstar')) {   // 小格的星手繪（程式化在 10 px 下太糊）
      var ROWS = kind === 'star'
        ? ['....33....', '...3333...', '...3333...', '3333333333', '.33333333.', '..333333..', '..333333..', '.33333333.', '.333..333.', '.3......3.']
        : ['....33....', '...3..3...', '...3..3...', '3333..3333', '.3......3.', '..3....3..', '..3....3..', '.3..33..3.', '.3.3..3.3.', '.33....33.'];
      for (var yy = 0; yy < 10; yy++) for (var xx = 0; xx < 10; xx++) if (ROWS[yy].charAt(xx) === '3') m[yy][xx] = 3;

    }
    switch (kind) {
      case 'star': poly(m, star5(c, c + 0.6, r + 0.6, r * 0.45), 3); break;
      case 'hstar': poly(m, star5(c, c + 0.6, r + 0.6, r * 0.45), 3); poly(m, star5(c, c + 0.6, (r + 0.6) * 0.5, r * 0.22), 0); break;
      case 'diamond': poly(m, [[c, c - r], [c + r, c], [c, c + r], [c - r, c]], 3); disc(m, c, c, r * 0.28, 0); break;
      case 'x': line(m, c - r + 1, c - r + 1, c + r - 1, c + r - 1, 3); line(m, c - r + 1, c + r - 1, c + r - 1, c - r + 1, 3);
        line(m, c - r + 2, c - r + 1, c + r - 1, c + r - 2, 3); line(m, c - r + 1, c + r - 2, c + r - 2, c - r + 1, 3); break;
      case 'dot': disc(m, c, c, Math.max(1, S / 10), 3); break;
      // 找差異符號
      case 's0': disc(m, c, c, r, 3); break;
      case 's1': poly(m, [[c, c - r], [c + r, c + r * 0.8], [c - r, c + r * 0.8]], 3); break;
      case 's2': rect(m, Math.round(c - r * 0.8), Math.round(c - r * 0.8), Math.round(c + r * 0.8) - 1, Math.round(c + r * 0.8) - 1, 3); break;
      case 's3': poly(m, star5(c, c + 0.6, r + 0.6, r * 0.45), 3); break;
      case 's4': rect(m, Math.round(c - r * 0.3), Math.round(c - r), Math.round(c + r * 0.3) - 1, Math.round(c + r) - 1, 3); rect(m, Math.round(c - r), Math.round(c - r * 0.3), Math.round(c + r) - 1, Math.round(c + r * 0.3) - 1, 3); break;
      case 's5': disc(m, c, c, r, 3); disc(m, c + r * 0.55, c - r * 0.35, r * 0.85, 0); break;
      case 's6': disc(m, c - r * 0.45, c - r * 0.25, r * 0.55, 3); disc(m, c + r * 0.45, c - r * 0.25, r * 0.55, 3); poly(m, [[c - r * 0.98, c - r * 0.1], [c + r * 0.98, c - r * 0.1], [c, c + r]], 3); break;

  function cellFrame() {
    var px = canvas(32, 32), x, y;
    rect(px, 1, 1, 30, 30, 1);
    rect(px, 3, 3, 28, 28, 2);

    px[1][1] = 0; px[1][30] = 0; px[30][1] = 0; px[30][30] = 0;
    return px;
  }
  // 小格 16×16：外 1 px 縫、色 1 框、色 2 底、中央 10×10 圖形
  function smallCell(kind) {

  (function () {

  BG.BH = ['........', '11111111', '........', '22222222', '........', '........', '........', '........'];
  BG.BHB = ['........', '........', '........', '........', '22222222', '........', '11111111', '........'];
  BG.BV = ['.1.2....', '.1.2....', '.1.2....', '.1.2....', '.1.2....', '.1.2....', '.1.2....', '.1.2....'];
  BG.BVR = ['....2.1.', '....2.1.', '....2.1.', '....2.1.', '....2.1.', '....2.1.', '....2.1.', '....2.1.'];
  BG.ST1 = ['........', '........', '........', '....3...', '........', '........', '........', '........'];
  BG.ST2 = ['........', '.1......', '........', '........', '........', '........', '......1.', '........'];
  function add(prefix, tiles) { tiles.forEach(function (t, i) { BG[prefix + i] = t; }); }
  add('CF', slice(cellFrame()));
  var STATES = { EMP: 'dot', LIT: 'star', MRK: 'diamond', BAD: 'x', MIS: 'hstar' };
  Object.keys(STATES).forEach(function (k) { add('C_' + k + '_', slice(centerArt(STATES[k]))); add('SC_' + k + '_', slice(smallCell(STATES[k]))); });
  for (var s = 0; s < 8; s++) add('SY_' + s + '_', slice(centerArt('s' + s)));

  /* ---------------- 精靈 ---------------- */
  var SPR = { SP: E8() };
  SPR.CUR = ['3333....', '3222....', '32......', '32......', '........', '........', '........', '........'];
  SPR.CHK = ['......33', '.....332', '3...332.', '33.332..', '23332...', '.232....', '..2.....', '........'];
  SPR.XX = ['33....33', '332..332', '.332332.', '..3332..', '..2333..', '.233.33.', '332..233', '33....33'];
  SPR.RING = ['..3333..', '.3....3.', '3......3', '3......3', '3......3', '3......3', '.3....3.', '..3333..'];
  SPR.DOT = ['........', '..33....', '.3223...', '.3223...', '..33....', '........', '........', '........'];
  SPR.ARW = ['........', '.33.....', '.3233...', '.322233.', '.3233...', '.33.....', '........', '........'];

  var made = null;
  FL.Art = {
    STATES: Object.keys(STATES),
    make: function () {
      if (made) return made;
      var bg = CHR.bank('flash_bg', BG), spr = CHR.bank('flash_spr', SPR);
      made = {
        bg: bg, spr: spr,
        t: function (n) { return bg.index(n); },
        s: function (n) { return spr.index(n); },
        ch: function (c) {
          if (c === '★') c = '$';
          if (c === ' ') return 0;
          var n = CHARMAP[c];
          if (n === undefined && c >= 'a' && c <= 'z') n = CHARMAP[c.toUpperCase()];
          return (n && bg.has('F_' + n)) ? bg.index('F_' + n) : 0;
        },
        text: function (s) { var o = []; for (var i = 0; i < s.length; i++) o.push(made.ch(s.charAt(i))); return o; }
      };
      return made;
    }
  };
})();

<script>/* games/cart4/flash/song.js */
/*
 * games/cart4/flash/song.js — 《星塵閃記》音樂 / 音效（全部原創，只走 2A03）
 * ---------------------------------------------------------------------------
 * 擁有者：C8-1 cart4-memory（R8）｜ 依賴：engine/music.js
 * 契約：CT.Flash.Audio = { init(nes), play(key), stop(), pause(), resume(), sfx(name), tick(), SONGS, SFX, current }
 *
 * | key          | 曲名       | speed | 小節 | 說明 |
 * |--------------|------------|-------|------|------|
 * | flash_title  | 閃光序曲   | 6     | 4    | 標題；A 大調、上行琶音 + 頂端長音 |
 * | flash_play   | 腦內星圖   | 8     | 4    | 圖案 / 找差異；C 利底安（#F）、稀疏鐘聲 |
 * | flash_seq    | 心跳節拍   | 8     | 2    | 序列模式：**只用三角波 + 雜訊**，把方波讓給格子音高 |
 * | flash_race   | 追星賽     | 4     | 4    | 與 CPU 競速；G 小調十六分音符 |
 * | flash_win    | 記住了！   | 6     | 1    | 通關（不 loop） |
 * | flash_lose   | 忘光光     | 8     | 1    | GAME OVER（不 loop） |
 * 音效：flash_move / mark / ok / bad / level / ready / go / replay / win，
 *   格子音 flash_t0..15（大調五聲音階 C D E G A 往上排兩個半八度，每格一個音高；序列模式的「聽」提示，畫面同時亮格）

(function () {
  'use strict';
  var CT = window.CT = window.CT || {};
  var FL = CT.Flash = CT.Flash || {};

  function tok(s) { return String(s).split(/\s+/).filter(function (t) { return t; }); }
  function fit(a) { while (a.length < 16) a.push(null); return a.slice(0, 16); }

    lead: { vol: [12, 11, 10, 9, 8, 7, 7, 6, 6, 5], volLoop: 9, duty: [2, 1] },
    bell: { vol: [11, 8, 6, 5, 4, 3, 2, 2, 1, 1, 0], duty: [1] },
    pluck: { vol: [10, 7, 5, 3, 2, 1, 0], duty: [2] },

    bass: {},
    kick: { vol: [14, 10, 6, 3, 0] },
    snare: { vol: [11, 9, 6, 4, 2, 0] },
    hat: { vol: [5, 2, 0] }
  };
  function song(name, speed, bars, loop) {
    var s = { name: name, speed: speed, rows: 16, loop: 0, instruments: INST, patterns: [], order: [], playLoop: loop };
    bars.forEach(function (b) { s.order.push(s.patterns.length); s.patterns.push(b); });
    return s;
  }
  var EMPTY = function () { return fit([]); };

  function buildTitle() {
    var M = [
      'A-4 C#5 E-5 A-5 -   -   G#5 -   F#5 -   E-5 -   -   -   C#5 -',
      'D-5 F#5 A-5 D-6 -   -   C#6 -   B-5 -   A-5 -   -   -   F#5 -',
      'E-5 G#5 B-5 E-6 -   -   D-6 -   C#6 -   B-5 -   A-5 -   G#5 -',

               tri: mel([r, '-', '-', '-', '-', '-', r, '-', '-', '-', '-', '-', r, '-', '-', '-'].join(' '), 'bass', 15, 0),

  }
  function buildSeq() {
    var T = [['A-2', 'E-2'], ['F-2', 'G-2']];
    return song('心跳節拍（flash_seq）', 8, T.map(function (t) {
      return { p1: EMPTY(), p2: EMPTY(),
               tri: mel([t[0], '-', '-', '-', '-', '-', '-', '-', t[1], '-', '-', '-', '-', '-', '-', '-'].join(' '), 'bass', 15, 0),

  }
  function buildRace() {
    var M = [
      'G-5 A#5 D-6 A#5 G-5 A#5 D-6 F-6 D#6 D-6 C-6 A#5 A-5 C-6 D-6 -',
      'D#5 G-5 A#5 G-5 D#5 G-5 C-6 D#6 D-6 C-6 A#5 A-5 G-5 A-5 A#5 -',

      'D-5 F#5 A-5 C-6 A-5 F#5 D-5 F#5 A-5 -   D-6 -   F#6 -   =   -'

  }

    return song('記住了！（flash_win）', 6, [{

    R.marks = []; for (var i = 0; i < N; i++) R.marks.push(false);
    redraw(function () {

    AU.sfx('flash_ready');
  }
  function makeChallenge() {
    var R = g.run, N = R.n * R.n, i;
    if (R.kind === 'pattern' || R.kind === 'race') {
      R.lit = []; for (i = 0; i < N; i++) R.lit.push(false);

    } else if (R.kind === 'seq') {

    } else {
      R.before = []; for (i = 0; i < N; i++) R.before.push(null);

  /* ================================================================ 展示 */
  function showBoard() {
    var R = g.run, N = cells(), i;
    if (R.kind === 'pattern') for (i = 0; i < N; i++) drawBig(i, R.lit[i] ? 'LIT' : 'EMP');
    else if (R.kind === 'race') for (i = 0; i < N; i++) { drawSmall(0, i, R.lit[i] ? 'LIT' : 'EMP'); drawSmall(1, i, R.lit[i] ? 'LIT' : 'EMP'); }
    else if (R.kind === 'spot') for (i = 0; i < N; i++) drawBig(i, R.before[i] || 'EMP');
    else drawAll('EMP');
  }
  function inputBoard() {
    var R = g.run, N = cells(), i;
    if (R.kind === 'pattern') for (i = 0; i < N; i++) drawBig(i, R.marks[i] ? 'MRK' : 'EMP');
    else if (R.kind === 'race') {
      for (i = 0; i < N; i++) { drawSmall(0, i, R.pm[i] ? 'MRK' : 'EMP'); drawSmall(1, i, R.cm[i] ? 'MRK' : 'EMP'); }
    } else if (R.kind === 'spot') for (i = 0; i < N; i++) drawBig(i, R.after[i] || 'EMP');
    else drawAll('EMP');
  }
  function enterShow(replay) {
    var R = g.run;
    if (!replay) makeChallenge();
    R.phase = 'show'; R.pt = 0; R.seqLit = -1;
    showBoard();
    if (!replay) AU.sfx('flash_go');
  }
  function updateShow() {
    var R = g.run;
    if (R.kind === 'seq') {
      var step = R.on + R.gap, j = Math.floor(R.pt / step), inOn = (R.pt % step) < R.on, lit = (j < R.k && inOn) ? R.seq[j] : -1;
      if (lit !== R.seqLit) {
        if (R.seqLit >= 0) drawBig(R.seqLit, 'EMP');
        if (lit >= 0) { drawBig(lit, 'LIT'); AU.sfx('flash_t' + lit); }
        R.seqLit = lit;
      }
    }
    if (++R.pt < R.showT) return;
    if (R.kind === 'seq' && R.seqLit >= 0) { drawBig(R.seqLit, 'EMP'); R.seqLit = -1; }
    if (R.kind === 'spot') { R.phase = 'mask'; R.pt = 0; drawAll('EMP'); return; }
    enterInput();
  }
  function enterInput() {
    var R = g.run;
    R.phase = 'input'; R.pt = 0;
    if (R.kind === 'race' && !R.pm) raceStart();
    inputBoard();
  }

  /* ================================================================ 輸入 */
  function cursorMove(D) {
    var R = g.run, moved = false;
    if (D.u && R.cy > 0) { R.cy--; moved = true; }
    if (D.d && R.cy < R.n - 1) { R.cy++; moved = true; }
    if (D.l && R.cx > 0) { R.cx--; moved = true; }
    if (D.r && R.cx < R.n - 1) { R.cx++; moved = true; }
    if (moved) AU.sfx('flash_move');
  }
  function replay() {
    var R = g.run;
    if (R.replayUsed) { say('REPLAY USED THIS LEVEL', 50); return; }
    if (R.kind === 'race') { say('NO REPLAY IN A RACE!', 50); return; }
    if (R.kind === 'seq' && R.press) return;
    R.replayUsed = true;
    if (R.kind === 'seq') R.pos = 0;
    AU.sfx('flash_replay');
    say('REPLAY!  LEVEL SCORE HALVED', 60);
    enterShow(true);
  }
  function updateInput() {
    var R = g.run, I = NES.Input;
    R.pt++;
    if (R.kind === 'race') { updateRace(); }
    if (R.phase !== 'input') return;
    if (R.kind === 'seq' && R.press) {
      if (--R.press.t <= 0) {
        drawBig(R.press.i, 'EMP');
        var pr = R.press; R.press = null;
        if (pr.bad) fail(pr.i);
        else if (R.pos >= R.k) success();
      }
      return;
    }
    if (R.kind === 'race' && R.pOut) return;
    cursorMove(dirs());
    var i = R.cy * R.n + R.cx;
    if (I.pressed(BTN.B)) { replay(); return; }
    if (!I.pressed(BTN.A)) return;
    if (R.kind === 'pattern') {
      if (R.marks[i]) return;
      if (!R.lit[i]) { fail(i); return; }
      R.marks[i] = true; drawBig(i, 'MRK'); AU.sfx('flash_mark');
      if (R.marks.filter(Boolean).length >= R.k) success();
    } else if (R.kind === 'seq') {
      var good = R.seq[R.pos] === i;
      drawBig(i, good ? 'LIT' : 'BAD');
      AU.sfx(good ? 'flash_t' + i : 'flash_bad');
      R.press = { i: i, t: PRESS_F, bad: !good };
      if (good) R.pos++;

      if (R.found.indexOf(i) >= 0) return;
      if (R.changes.indexOf(i) < 0) { fail(i); return; }
      R.found.push(i); AU.sfx('flash_mark');
      if (R.found.length >= R.changes.length) success();
    } else {
      if (R.pm[i]) return;
      if (!R.lit[i]) { R.pOut = true; drawSmall(0, i, 'BAD'); AU.sfx('flash_bad'); say('OOPS! WRONG CELL', 60); return; }
      R.pm[i] = true; drawSmall(0, i, 'MRK'); AU.sfx('flash_mark');

  }
  function say(s, t) { g.msg = s; g.msgT = t || 60; }
  function levelScore() {
    var R = g.run, s;

    if (R.opt === 2) s *= 2;
    if (R.replayUsed) s = s >> 1;
    return s;
  }
  function success() {
    var R = g.run, s = levelScore();
    R.score += s; R.cleared = Math.max(R.cleared, R.level); R.ok = true;
    R.phase = 'judge'; R.pt = 0;
    AU.sfx('flash_level');
    say('LEVEL ' + R.level + ' CLEAR!  +' + s, JUDGE_OK);
    if (R.kind === 'pattern' && R.opt >= 1 && R.level >= 8 && !R.cheated && !g.goalRun) g.goalRun = R;
  }
  function fail(i) {
    var R = g.run, N = cells(), k;
    R.lives--; R.ok = false; R.wrong = i;
    R.phase = 'judge'; R.pt = 0;
    if (R.kind === 'pattern') { for (k = 0; k < N; k++) if (R.lit[k] && !R.marks[k]) drawBig(k, 'MIS'); drawBig(i, 'BAD'); }
    else if (R.kind === 'seq') { drawBig(R.seq[R.pos], 'MIS'); if (i !== R.seq[R.pos]) drawBig(i, 'BAD'); }
    AU.sfx('flash_bad');
    say(R.lives > 0 ? 'MISS!  LIVES LEFT ' + R.lives : 'MISS!', JUDGE_NG);
  }
  function updateJudge() {
    var R = g.run;
    if (++R.pt < (R.ok ? JUDGE_OK : JUDGE_NG)) return;
    R.first = false;
    if (R.kind === 'race') { raceNext(); return; }
    if (!R.ok) { if (R.lives <= 0) { enterOver('OUT OF LIVES ON LEVEL ' + R.level); return; } beginLevel(); return; }
    if (R.level >= MAX_LV) { allClear(); return; }
    R.level++;
    beginLevel();
  }

  /* ================================================================ 競速（吱比 ZIPPY） */
  function raceStart() {
    var R = g.run, N = cells(), C = CPUS[R.opt], i;
    R.pm = []; R.cm = []; for (i = 0; i < N; i++) { R.pm.push(false); R.cm.push(false); }
    R.pOut = false; R.cOut = false; R.pDone = false; R.cDone = false; R.winner = '';
    // 吱比「記住」：每個亮格以 acc/256 機率記對；記不得的換成一個錯格（之後會點錯出局）
    var good = [], bad = [], used = {};
    for (i = 0; i < N; i++) if (R.lit[i]) { if ((rnd() & 255) < C.acc) good.push(i); else bad.push(i); }
    var wrong = [];
    bad.forEach(function () { var c; do { c = rnd() % N; } while (R.lit[c] || used[c]); used[c] = true; wrong.push(c); });
    // 走訪順序：從中央出發，每次走最近的
    var order = [], pos = [R.n >> 1, R.n >> 1], left = good.slice();
    while (left.length) {
      var bi = 0, bd = 1e9;
      for (var k = 0; k < left.length; k++) { var d = Math.abs(left[k] % R.n - pos[0]) + Math.abs(((left[k] / R.n) | 0) - pos[1]); if (d < bd) { bd = d; bi = k; } }
      var c2 = left.splice(bi, 1)[0]; order.push(c2); pos = [c2 % R.n, (c2 / R.n) | 0];
    }
    R.cpu = { q: order.concat(wrong), t: 0, kx: R.n >> 1, ky: R.n >> 1, stage: 0 };
  }
  function updateRace() {
    var R = g.run, C = CPUS[R.opt], P = R.cpu;
    if (!R.cOut && !R.cDone && P.q.length) {
      P.t++;
      if (P.stage === 0) { if (P.t >= C.think) { P.stage = 1; P.t = 0; } }
      else if (P.t >= C.step) {
        P.t = 0;
        var tg = P.q[0], tx = tg % R.n, ty = (tg / R.n) | 0;
        if (P.ky !== ty) P.ky += P.ky < ty ? 1 : -1;
        else if (P.kx !== tx) P.kx += P.kx < tx ? 1 : -1;
        else {
          P.q.shift();
          if (!R.lit[tg]) { R.cOut = true; drawSmall(1, tg, 'BAD'); AU.sfx('flash_bad'); say('ZIPPY MISSED!', 50); }
          else { R.cm[tg] = true; drawSmall(1, tg, 'MRK'); if (R.cm.filter(Boolean).length >= R.k && !R.pDone) R.cDone = true; }
        }
      }
    }
    if (R.pDone || R.cDone || (R.pOut && R.cOut)) {
      R.winner = R.pDone ? 'p' : (R.cDone ? 'c' : '');
      if (R.winner === 'p') { R.ps++; R.score += 100 * R.k; AU.sfx('flash_level'); say('YOU TAKE ROUND ' + R.round + '!', JUDGE_NG); }
      else if (R.winner === 'c') { R.cs++; AU.sfx('flash_bad'); say('ZIPPY TAKES ROUND ' + R.round, JUDGE_NG); }
      else say('NOBODY SCORES', JUDGE_NG);
      for (var i = 0; i < cells(); i++) if (R.lit[i]) { if (!R.pm[i]) drawSmall(0, i, 'MIS'); if (!R.cm[i]) drawSmall(1, i, 'MIS'); }
      R.phase = 'judge'; R.pt = 0; R.ok = true;
    }
  }
  function raceNext() {
    var R = g.run;
    R.pm = null;
    if (R.ps >= RACE_WIN) { raceWin(); return; }
    if (R.cs >= RACE_WIN) { enterOver('ZIPPY WINS ' + R.cs + ' TO ' + R.ps); return; }
    R.round++;
    beginLevel();
  }
  function raceWin() {
    var R = g.run, nb = saveRun(R);
    if (!R.cheated) save('race' + R.opt, load('race' + R.opt) + 1);
    R.saved = true;
    enterResult(['YOU OUTRAN ZIPPY!', 'ROUNDS  YOU ' + R.ps + ' - ' + R.cs + ' ZIPPY', '', 'ZIPPY ' + CPUS[R.opt].name + '   SCORE ' + pad(R.score, 6)], R.cs === 0 ? 3 : (R.cs <= 2 ? 2 : 1), nb);
  }

  /* ================================================================ 結算 / GAME OVER */
  function allClear() {
    var R = g.run, nb = saveRun(R);
    R.saved = true;
    enterResult(['ALL 12 LEVELS CLEAR!', MODES[R.m].name + '  ' + SPEEDS[R.opt], '', 'LIVES LEFT ' + R.lives + '   SCORE ' + pad(R.score, 6)], R.lives >= 3 ? 3 : (R.lives >= 2 ? 2 : 1), nb);
  }
  function enterResult(lines, st, nb) {
    var R = g.run;
    g.mode = 'result'; g.overT = 0;
    redraw(function () {
      for (var c = 2; c < 30; c++) { put(c, 4, art.t('BH')); put(c, 25, art.t('BHB')); }
      for (var i = 0; i < lines.length; i++) if (lines[i]) center(7 + i * 2, lines[i]);
      center(16, 'RATING ' + stars(st));
      if (R.cheated) center(19, 'CHEAT USED - NOT SAVED');
      else if (nb) center(19, 'NEW RECORD!');
      center(22, 'PUSH START');
    });
    AU.play('flash_win');
  }
  function enterOver(why) {
    var R = g.run;
    saveRun(R);
    g.mode = 'over'; g.overT = 0; R.why = why;
    redraw(function () {
      for (var c = 4; c < 28; c++) { put(c, 5, art.t('BH')); put(c, 24, art.t('BHB')); }
      center(8, 'GAME OVER');
      center(11, why);
      center(14, R.kind === 'race' ? 'SCORE ' + pad(R.score, 6) : 'CLEARED ' + pad(R.cleared, 2) + '  SCORE ' + pad(R.score, 6));
      center(17, 'C/$ = CONTINUE HERE');
      center(19, 'START = TITLE');
    });
    AU.play('flash_lose');
  }

  /* ================================================================ 密技 */
  function doCheat() {
    var R = g.run;
    if (!R) return;
    R.cheated = true;
    if (g.mode === 'over') {
      R.continues++;
      g.mode = 'play';
      AU.play(R.kind === 'seq' ? 'flash_seq' : (R.kind === 'race' ? 'flash_race' : 'flash_play'));
      if (R.kind === 'race') { R.cs = 0; R.round++; R.pm = null; beginLevel(); say('CONTINUE! ZIPPY BACK TO 0', 70); }
      else { R.lives = LIVES; beginLevel(); say('CONTINUE! LEVEL ' + R.level, 70); }
      return;
    }
    if (R.kind === 'race') { R.ps = Math.min(RACE_WIN - 1, R.ps + 1); say('STAR BOOST! +1 POINT', 60); }
    else { R.lives = Math.min(5, R.lives + 1); say('STAR BOOST! +1 LIFE', 60); }
    AU.sfx('flash_win');
  }

  /* ================================================================ 精靈 / HUD */
  function drawSprites() {
    var ppu = nes0.ppu, n = 0, R = g.run, q, i;
    function spr(x, y, tile, pal, fh, fv) { if (y > 231 || y < -7) return; ppu.sprite(n++, { x: x, y: y, tile: tile, pal: pal, flipH: !!fh, flipV: !!fv }); }
    function box(x, y, w, pal) {
      var c = art.s('CUR');
      spr(x - 1, y - 1, c, pal); spr(x + w - 7, y - 1, c, pal, true);
      spr(x - 1, y + w - 7, c, pal, false, true); spr(x + w - 7, y + w - 7, c, pal, true, true);
    }
    var blink = (g.t & 8) === 0;
    if (g.mode === 'title') spr(10, titleRow(g.sel) * 8, art.s('ARW'), 0);
    if (R && g.mode === 'play' && !g.paused) {
      var p;
      if (R.kind === 'race') {
        if (R.phase === 'input' || R.phase === 'judge') {
          if (!R.pOut || blink) { p = smallRC(0, R.cy * R.n + R.cx); box(p[0] * 8, p[1] * 8, 16, 0); }
          if (R.cpu && (!R.cOut || blink)) { p = smallRC(1, R.cpu.ky * R.n + R.cpu.kx); box(p[0] * 8, p[1] * 8, 16, 1); }
        }
      } else if (R.phase === 'input' || (R.phase === 'judge' && R.kind !== 'spot')) {
        p = bigRC(R.cy * R.n + R.cx); box(p[0] * 8, p[1] * 8, 32, 0);
      }
      if (R.kind === 'spot' && (R.phase === 'input' || R.phase === 'judge')) {
        for (i = 0; i < R.found.length; i++) { p = bigRC(R.found[i]); spr(p[0] * 8 + 20, p[1] * 8 + 4, art.s('CHK'), 2); }
        if (R.phase === 'judge' && !R.ok) {
          p = bigRC(R.wrong); spr(p[0] * 8 + 12, p[1] * 8 + 12, art.s('XX'), 3);
          if (blink) for (i = 0; i < R.changes.length; i++) if (R.found.indexOf(R.changes[i]) < 0) { p = bigRC(R.changes[i]); spr(p[0] * 8 + 20, p[1] * 8 + 20, art.s('RING'), 0); }
        }

    g.sprUsed = n;
  }
  function hud() {
    var R = g.run;
    if (!R) return;
    var hearts = '', i, cs = R.cheated ? '$' : ' ';
    for (i = 0; i < 5; i++) hearts += i < R.lives ? '^' : ' ';
    if (R.kind === 'race') text(1, 1, padR('RACE R' + pad(R.round, 2) + '   YOU ' + R.ps + ' - ' + R.cs + ' ZIPPY', 29) + cs);
    else text(1, 1, padR(SHORT[R.m] + ' LV' + pad(R.level, 2) + ' ' + SPEEDS[R.opt], 23) + hearts + ' ' + cs);
    var sub = 'SCORE ' + pad(R.score, 6);
    if (R.kind === 'pattern') sub += '  CELLS ' + R.k;
    else if (R.kind === 'seq') sub += '  LENGTH ' + pad(R.k, 2) + (R.phase === 'input' ? ' ' + pad(R.pos, 2) + '/' + pad(R.k, 2) : '      ');
    else if (R.kind === 'spot') sub += '  CHANGES ' + R.c + (R.found && R.phase === 'input' ? ' FOUND ' + R.found.length : '        ');
    else sub += '  ZIPPY ' + CPUS[R.opt].name;
    text(1, 2, padR(sub, 30));
    var line;
    if (g.paused) line = 'PAUSE  HOLD START+SELECT: MENU';
    else if (R.phase === 'ready') line = R.first ? 'READY  ' + (3 - Math.floor(R.pt / 30)) + '...' : (R.kind === 'race' ? 'ROUND ' + R.round : 'LEVEL ' + R.level) + '  GET READY';
    else if (g.msgT > 0) line = g.msg;
    else if (R.phase === 'show') line = R.kind === 'seq' ? 'WATCH THE ORDER...' : (R.kind === 'spot' ? 'REMEMBER EVERY SYMBOL' : 'REMEMBER THE STARS!');
    else if (R.phase === 'mask') line = '... WHAT CHANGED?';
    else if (R.phase === 'input') {
      if (R.kind === 'race') line = R.pOut ? 'WAIT FOR ZIPPY...' : 'MARK ALL ' + R.k + ' STARS FAST!';
      else line = (R.kind === 'spot' ? 'A = IT CHANGED' : 'A MARK') + '  B REPLAY' + (R.replayUsed ? ' USED' : ' X1');
    } else line = '';
    text(1, MSG_ROW, padR(line, 30));
  }

  /* ================================================================ 主迴圈 */
  function updatePlay() {
    var R = g.run;
    if (startPressed()) {
      g.paused = !g.paused;
      if (g.paused) AU.pause(); else AU.resume();
      g.hold = {};
    }
    if (g.paused) return;
    g.t++;
    if (g.msgT > 0) g.msgT--;
    if (R.phase === 'ready') { R.pt++; if (R.first && (R.pt === 30 || R.pt === 60)) AU.sfx('flash_ready'); if (R.pt >= R.readyT) enterShow(false); }
    else if (R.phase === 'show') updateShow();
    else if (R.phase === 'mask') { if (++R.pt >= MASK_F) enterInput(); }
    else if (R.phase === 'input') updateInput();
    else if (R.phase === 'judge') updateJudge();
  }

  /* ================================================================ 機器人：只讀畫面 */
  function botLag() { var v = parseInt((CT.query && CT.query('lag')) || '', 10); return isNaN(v) ? 12 : clamp(v, 0, 120); }
  function readCell(i) {        // 回傳 [中央磁磚, 屬性]（競速 = 左盤小格）
    var R = g.run, ppu = nes0.ppu, p;
    if (R.kind === 'race') { p = smallRC(0, i); return [ppu.getTile(0, p[0], p[1]), ppu.getAttr(0, p[0] >> 1, p[1] >> 1)]; }
    p = bigRC(i);
    return [ppu.getTile(0, p[0] + 1, p[1] + 1), ppu.getAttr(0, p[0] >> 1, p[1] >> 1)];
  }
  function botMask() {
    var B = g.bot;
    if (!B) B = g.bot = { t: 0, prev: 0, last: 0, react: 0, key: '', lag: botLag(), seen: {}, seq: [], prevLit: -1, before: [], done: {}, pos: 0, sig: '', stable: 0 };
    B.t++;
    var m = inner();
    if (m && B.prev) m = 0;
    B.prev = m;
    if (m) B.last = B.t;
    return m;
    function inner() {
      var R = g.run;
      if (g.mode === 'title') {
        var wm = clamp((parseInt((CT.query && CT.query('pmode')) || '1', 10) || 1) - 1, 0, 3);
        var wl = clamp((parseInt((CT.query && CT.query('plvl')) || '2', 10) || 2) - 1, 0, MODES[wm].lv.length - 1);
        if (g.t < 30) return 0;
        if (g.sel !== wm) return (B.t % 8 === 0) ? BTN.DOWN : 0;
        if (g.lvl[wm] !== wl) return (B.t % 8 === 0) ? BTN.RIGHT : 0;
        return (B.t % 20 === 0) ? BTN.START : 0;
      }
      if (g.mode === 'over' || g.mode === 'result') return (g.overT > 60 && B.t % 30 === 0) ? BTN.START : 0;

        B: ['A5 - C6 - F6 - E6 -', 'D6 - B5 - G5 - D6 -', 'C6 - E6 - A6 - G6 -', 'E6 - - - A5 - - -'],
        C: ['D6 - F6 - A6 - F6 - D6 - A5 - F5 - A5 -', 'E6 - G#6 - B6 - G#6 - E6 - B5 - G#5 - B5 -', 'A6 - E6 - C6 - A5 - E6 - C6 - A5 - E5 -', 'E5 - - - G#5 - - - B5 - - - E6 - - -']
      }, end: 'Am' }
  ];
  var FORM = ['A', 'B', 'A', 'C'];
  var COUNT_IN = 2;

  function sectionBar(def, sec, i) {
    var st = def.style, sym = def.chords[sec][i];
    return {
      p1: mel(def.mel[sec][i], st.lead, 12, st.duty),
      p2: harm(sym, st.harm),
      tri: bass(sym, st.bass, def.speed),
      noi: drm(sec === 'C' ? st.drumC : st.drum)
    };
  }
  function endBar(def) {
    var c = chord(def.end), R = 60 + c.root;
    if (R > 66) R -= 12;
    var p1 = empty(), p2 = empty(), tri = empty();
    p1[0] = { note: R + 12, inst: def.style.lead, vol: 11, duty: def.style.duty, cut: def.speed * 12 };
    p2[0] = { note: R + c.tones[1], inst: 'pad', vol: 6, duty: 1, cut: def.speed * 12 };
    tri[0] = { note: 36 + c.root, inst: 'bass', cut: def.speed * 12 };
    return { p1: p1, p2: p2, tri: tri, noi: drm('end') };
  }
  function buildTrack(def) {
    var s = { name: def.title + '（' + def.key + '）', speed: def.speed, rows: 16, loop: 0, instruments: INST, patterns: [], order: [], playLoop: false };
    for (var c = 0; c < COUNT_IN; c++) { s.order.push(s.patterns.length); s.patterns.push(countBar(c, def.speed)); }
    FORM.forEach(function (sec) { for (var i = 0; i < 4; i++) { s.order.push(s.patterns.length); s.patterns.push(sectionBar(def, sec, i)); } });
    s.order.push(s.patterns.length); s.patterns.push(endBar(def));
    return s;
  }
  function buildTitle() {
    var def = { speed: 7, style: { bass: 'walk', harm: 'arp3', drum: 'soft', drumC: 'basic', lead: 'soft', duty: 2 },
      chords: { A: ['C', 'Am', 'F', 'G'], B: ['F', 'G', 'Em', 'Am'] },
      mel: { A: ['G5 - E5 - C6 - - -', 'A5 - C6 - E6 - D6 C6', 'A5 - - - F5 - A5 -', 'G5 - B5 - D6 - - -'],
             B: ['C6 - A5 - F5 - A5 C6', 'D6 - B5 - G5 - B5 D6', 'E6 - - - B5 - G5 -', 'A5 - - - - - . -'] } };
    var s = { name: '星圖序曲（rhythm_title）', speed: 7, rows: 16, loop: 0, instruments: INST, patterns: [], order: [], playLoop: true };
    ['A', 'B'].forEach(function (sec) { for (var i = 0; i < 4; i++) { s.order.push(s.patterns.length); s.patterns.push(sectionBar(def, sec, i)); } });
    return s;
  }
  function jingle(name, speed, p1s, p2s, tris, drum) {
    return { name: name, speed: speed, rows: 16, loop: 0, instruments: INST, playLoop: false, order: [0],
      patterns: [{ p1: mel(p1s, 'lead', 12, 2), p2: mel(p2s, 'pad', 7, 1), tri: mel(tris, 'bass', 15, 0), noi: drm(drum) }] };
  }

  function sq(list) {
    var out = [];
    list.forEach(function (e) { for (var j = 0; j < e[1]; j++) out.push(j === 0 ? { note: e[0], vol: e[2], duty: e[3] === undefined ? 1 : e[3], retrigger: true } : {}); });
    out.push({ off: true });
    return out;
  }
  function nz(list) {
    var out = [];
    list.forEach(function (e) { for (var j = 0; j < e[1]; j++) out.push(j === 0 ? { note: e[0], vol: e[2], retrigger: true } : {}); });
    out.push({ off: true });
    return out;
  }
  // 四軌音高（↑ C6 / ↓ E6 / ← G6 / → C7）：彼此相差三度以上，聽得出是哪一軌
  var LANE_NOTE = ['C-6', 'E-6', 'G-6', 'C-7'];
  var SFX = {
    rhythm_miss: { priority: 3, data: { noi: nz([[13, 3, 9], [14, 4, 5]]) } },
    rhythm_slash: { priority: 2, data: { noi: nz([[1, 2, 8], [3, 2, 6], [5, 2, 3]]) } },
    rhythm_move: { priority: 2, data: { p2: sq([['A-5', 3, 8, 2]]) } },
    rhythm_ok: { priority: 4, data: { p2: sq([['E-6', 3, 10, 2], ['A-6', 6, 10]]) } },
    rhythm_ready: { priority: 4, data: { p2: sq([['C-6', 4, 9, 2]]) } },
    rhythm_go: { priority: 4, data: { p2: sq([['C-6', 2, 10, 2], ['G-6', 2, 10], ['C-7', 5, 10]]) } },
    rhythm_fail: { priority: 6, data: { p2: sq([['E-5', 5, 11, 0], ['C-5', 5, 10], ['A-4', 10, 9]]) } }
  };
  LANE_NOTE.forEach(function (n, i) {
    SFX['rhythm_hit' + i] = { priority: 2, data: { p2: sq([[n, 2, 7, 2], [n, 2, 4, 2]]) } };
    SFX['rhythm_cue' + i] = { priority: 2, data: { p2: sq([[n, 3, 6, 0]]) } };
  });

  var SONGS = {}, TRACKS = [];
  DEFS.forEach(function (d) {
    SONGS[d.key] = buildTrack(d);
    TRACKS.push({ key: d.key, title: d.title, zh: d.zh, speed: d.speed, bpm: Math.round(36000 / (d.speed * 4)) / 10, bars: SONGS[d.key].order.length, countIn: COUNT_IN });
  });
  SONGS.rhythm_title = buildTitle();
  SONGS.rhythm_clear = jingle('過關（rhythm_clear）', 7, 'C6 E6 G6 C7 - - . -', 'E5 G5 C6 E6 - - . -', 'C3 - G2 - C2 - . -', 'k - h - s - h - x - - - - - - -');
  SONGS.rhythm_fail = jingle('能量耗盡（rhythm_fail）', 8, 'G5 - E5 - C5 - . -', 'E4 - C4 - G3 - . -', 'C2 - - - G1 - . -', 'k - - - - - - - k - - - - - - -');

  function drv(nes) { return (nes && nes.music) || null; }
  var Audio = {
    SONGS: SONGS, SFX: SFX, current: null, _nes: null, _paused: null,
    init: function (nes) {
      Audio._nes = nes; Audio.current = null; Audio._paused = null;
      var d = drv(nes);
      if (!d) return false;
      for (var k in SFX) if (Object.prototype.hasOwnProperty.call(SFX, k)) { try { d.define(k, SFX[k]); } catch (e) { } }
      return true;
    },
    play: function (key) {
      var d = drv(Audio._nes), s = SONGS[key];
      if (!d || !s) return false;
      Audio._paused = null;
      try { d.play(s, { loop: s.playLoop }); Audio.current = key; return true; } catch (e) { return false; }
    },
    stop: function () { var d = drv(Audio._nes); if (d) { try { d.stop(); if (d.stopSfx) d.stopSfx(); } catch (e) { } } Audio.current = null; Audio._paused = null; },
    sfx: function (name) {
      var d = drv(Audio._nes);
      if (!d || !SFX[name]) return false;
      try { d.sfx(name); return true; } catch (e) { return false; }
    },
    // §6-2 暫停：engine pause()（記住 row / rowFrame）⇒ 譜面時間（= driver row）也一起凍結
    pause: function () {
      var d = drv(Audio._nes);
      if (!d || Audio._paused || !d.pause) return false;
      var st = d.state();
      if (!st.playing) return false;
      d.pause(); if (d.stopSfx) d.stopSfx();
      Audio._paused = { key: Audio.current };
      return true;
    },
    resume: function () {
      var d = drv(Audio._nes), p = Audio._paused;
      Audio._paused = null;
      if (!d || !p || !d.resume) return false;
      var r = d.resume(); Audio.current = p.key;
      return r;
    },
    isPaused: function () { var d = drv(Audio._nes); return !!(d && d.isPaused && d.isPaused()); },
    state: function () { var d = drv(Audio._nes); return d ? d.state() : null; },
    tick: function () { var d = drv(Audio._nes); if (d) { try { d.tick(); } catch (e) { } } }
  };
  RH.Audio = Audio;
  RH.TRACKS = TRACKS;
  RH.COUNT_IN = COUNT_IN;
  RH.LANE_NOTE = LANE_NOTE;
})();

</script>
<script>/* games/cart4/rhythm/chart.js */
/*
 * games/cart4/rhythm/chart.js — 《星塵節奏》譜面產生器 + 驗證器（純資料，不碰 PPU / APU）
 * ---------------------------------------------------------------------------
 * 擁有者：C8-3 cart4-beat（R8）｜ 依賴：rhythm/song.js（CT.Rhythm.Audio.SONGS / TRACKS）
 *
 * 同步原則：音符的時間 = 「全曲第幾個 row」× speed（幀）。row 直接取自曲子 pattern 裡 p1 旋律的
 *   note-on 與 noi 的大鼓 / 小鼓，所以每顆音符一定對到一個聽得到的音；遊玩時的「現在幾幀」也只從
 *   driver 的 rowsPlayed / rowFrame 算（main.js songFrame），不讀任何實際時鐘。
 *
 * 模式（lane：0 ↑ / 1 ↓ / 2 ← / 3 →）：
 *   CROSS 星十字：四軌。旋律往上跳 ≥ 3 半音 → ↑、往下 ≥ 3 → ↓、其他 ← / → 交替。
 *   DUO   雙星：只用 ← / →（B / A）。往上 → A、往下 → B、同音附近交替。
 *   ORBIT 繞行：單鍵，全部 lane 0。
 *   BLADE 節拍武士：lane 2 = 左來、3 = 右來；h = 0 低 / 1 高（兩條高度各自限 3 隻同時在畫面上）。
 * 難度：grid（音符只放在幾 row 一格的位置：4 = 每拍、2 = 八分、1 = 十六分）、gap（相鄰音符最少幀數）、T（音符飛行幀數）。
 * 精靈配額（每線 ≤ 8 的保證來源）：CROSS / DUO 左右兩臂共用同一條水平帶，任何時刻同時在畫面上的 ← / → 音符 ≤ 6
 *   （每顆 8×16 = 每線 1 個，留 2 個給命中火花）；BLADE 每條高度 ≤ 3 隻（每隻 16 寬 = 2 個 + 主角 2 個）。
 */
(function () {
  'use strict';
  var CT = window.CT = window.CT || {};
  var RH = CT.Rhythm = CT.Rhythm || {};

  var MODES = ['CROSS', 'DUO', 'ORBIT', 'BLADE'];
  var DIFFS = [
    { id: 'EASY', grid: 4, gap: 26, T: 96, bladeT: 96, drain: 3 },
    { id: 'NORMAL', grid: 2, gap: 11, T: 72, bladeT: 76, drain: 5 },
    { id: 'HARD', grid: 1, gap: 7, T: 56, bladeT: 60, drain: 7 }
  ];
  var LATE = 8;                 // GOOD 窗口（幀）＝ 音符過了判定點還留在畫面上的幀數
  var WIN = { PERFECT: 2, GREAT: 5, GOOD: 8 };
  var LR_MAX = 6, BLADE_ROW_MAX = 3;

  var SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function midiOf(n) {
    if (typeof n === 'number') return n;
    if (typeof n !== 'string') return null;
    var s = n.toUpperCase(), b = SEMI[s.charAt(0)];
    if (b === undefined) return null;
    var i = 1, acc = 0;
    if (s.charAt(1) === '#') { acc = 1; i = 2; } else if (s.charAt(1) === 'B') { acc = -1; i = 2; } else if (s.charAt(1) === '-') i = 2;
    var o = parseInt(s.substring(i), 10);
    return isNaN(o) ? null : (o + 1) * 12 + b + acc;
  }

  // 曲子 → onset 表 [{row, midi|null, drum:'kick'|'snare'|null, harm: p2 和聲有 note-on}]（row = 全曲 row 索引 = rowsPlayed）
  function onsets(song) {
    var out = [], oi, r;
    for (oi = 0; oi < song.order.length; oi++) {
      var pat = song.patterns[song.order[oi]];
      for (r = 0; r < 16; r++) {
        var p = pat.p1 && pat.p1[r], d = pat.noi && pat.noi[r], q = pat.p2 && pat.p2[r], m = null, dr = null, h2 = false;
        if (p && p.note !== undefined && p.note !== '---' && p.note !== '===') m = midiOf(p.note);
        if (d && (d.inst === 'kick' || d.inst === 'snare')) dr = d.inst;
        if (q && q.note !== undefined && q.note !== '---' && q.inst !== 'click') h2 = true;
        if (m !== null || dr || h2) out.push({ row: oi * 16 + r, midi: m, drum: dr, harm: h2 });
      }
    }
    return out;
  }

  function build(trackIdx, mode, diff) {
    var tr = RH.TRACKS[trackIdx], song = RH.Audio.SONGS[tr.key], D = DIFFS[diff], sp = tr.speed;
    var T = mode === 'BLADE' ? D.bladeT : D.T, first = tr.countIn * 16;
    var on = onsets(song), notes = [], lastT = -999, pm = null, tog = 0, side = 0, hTog = [0, 0];
    function lrCount(t) { var n = 0; for (var i = notes.length - 1; i >= 0 && notes[i].t > t - (T + LATE); i--) if (notes[i].lane >= 2) n++; return n; }
    function laneOk(lane, t, minF) { for (var i = notes.length - 1; i >= 0 && notes[i].t > t - minF; i--) if (notes[i].lane === lane) return false; return true; }
    function rowCount(h, t) { var n = 0; for (var i = notes.length - 1; i >= 0 && notes[i].t > t - (T + LATE + 12); i--) if (notes[i].h === h) n++; return n; }
    var sameLaneF = Math.ceil(10 * T / 72);
    for (var k = 0; k < on.length; k++) {
      var o = on[k];
      if (o.row < first) continue;
      if (o.row % D.grid) continue;
      if (o.midi === null && !o.drum && diff < 2) continue;     // 和聲（p2）onset 只有 HARD 採用
      var t = o.row * sp;
      if (t - lastT < D.gap) { if (o.midi !== null) pm = o.midi; continue; }
      var dir = 0;
      if (o.midi !== null && pm !== null) dir = o.midi - pm >= 3 ? 1 : (o.midi - pm <= -3 ? -1 : 0);
      if (o.midi !== null) pm = o.midi;
      var n = { t: t, row: o.row, lane: 0, h: 0, midi: o.midi, drum: o.drum };
      if (mode === 'CROSS') {
        var want = dir > 0 ? 0 : (dir < 0 ? 1 : (2 + (tog ^= 1)));
        var nl = notes.length;
        if (want < 2 && nl >= 2 && notes[nl - 1].lane === want && notes[nl - 2].lane === want) want = 2 + (tog ^= 1);   // 同一軌連 3 顆 ⇒ 改左右
        var cand = want >= 2 ? [want, want ^ 1, 0, 1] : [want, 2 + (tog ^ 1), 3 - (tog ^ 1), want ^ 1];
        var got = -1;
        for (var c = 0; c < cand.length; c++) {
          var L = cand[c];
          if (L >= 2 && lrCount(t) >= LR_MAX) continue;
          if (!laneOk(L, t, sameLaneF)) continue;
          got = L; break;
        }
        if (got < 0) continue;
        n.lane = got;
      } else if (mode === 'DUO') {
        if (lrCount(t) >= LR_MAX) continue;
        var w2 = dir > 0 ? 3 : (dir < 0 ? 2 : (2 + (tog ^= 1)));
        if (!laneOk(w2, t, sameLaneF)) w2 ^= 1;
        if (!laneOk(w2, t, sameLaneF)) continue;
        n.lane = w2;
      } else if (mode === 'ORBIT') {
        n.lane = 0;
      } else {   // BLADE
        side = dir > 0 ? 1 : (dir < 0 ? 0 : side ^ 1);
        n.lane = 2 + side;
        var h = hTog[side]; hTog[side] ^= 1;
        if (rowCount(h, t) >= BLADE_ROW_MAX) h ^= 1;
        if (rowCount(h, t) >= BLADE_ROW_MAX) continue;
        n.h = h;
      }
      notes.push(n); lastT = t;
    }
    notes.forEach(function (x, i) { x.id = i; });
    return { track: trackIdx, mode: mode, diff: diff, speed: sp, T: T, notes: notes, endRow: song.order.length * 16 };
  }

  var cache = {};
  function get(trackIdx, mode, diff) {
    var k = trackIdx + '_' + mode + '_' + diff;
    if (!cache[k]) cache[k] = build(trackIdx, mode, diff);
    return cache[k];
  }

  // 驗證：全部 onset 對得上、間距、配額。回傳 {ok, problems[], n, maxLR, maxRow}
  function validate(ch) {
    var tr = RH.TRACKS[ch.track], song = RH.Audio.SONGS[tr.key], on = onsets(song), rows = {}, probs = [], D = DIFFS[ch.diff];
    on.forEach(function (o) { rows[o.row] = 1; });
    var maxLR = 0, maxRow = 0;
    ch.notes.forEach(function (n, i) {
      if (!rows[n.row]) probs.push('row ' + n.row + ' 沒有對應的音');
      if (n.t !== n.row * ch.speed) probs.push('t != row*speed @' + i);
      if (n.row < tr.countIn * 16) probs.push('數拍小節有音符 @' + i);
      if (i && n.t - ch.notes[i - 1].t < D.gap) probs.push('間距 < gap @' + i);
      var lr = 0, r = 0;
      for (var j = i; j >= 0 && ch.notes[j].t > n.t - (ch.T + LATE); j--) {
        if (ch.notes[j].lane >= 2) lr++;
        if (ch.mode === 'BLADE' && ch.notes[j].h === n.h) r++;
      }
      if (ch.mode === 'CROSS' || ch.mode === 'DUO') maxLR = Math.max(maxLR, lr);
      if (ch.mode === 'BLADE') maxRow = Math.max(maxRow, r);
    });
    if (maxLR > LR_MAX) probs.push('左右臂同時 ' + maxLR + ' > ' + LR_MAX);
    if (maxRow > BLADE_ROW_MAX) probs.push('同高度同時 ' + maxRow + ' > ' + BLADE_ROW_MAX);
    return { ok: !probs.length, problems: probs.slice(0, 5), n: ch.notes.length, maxLR: maxLR, maxRow: maxRow };
  }

  RH.Chart = { MODES: MODES, DIFFS: DIFFS, WIN: WIN, LATE: LATE, LR_MAX: LR_MAX, BLADE_ROW_MAX: BLADE_ROW_MAX,
    onsets: onsets, build: build, get: get, validate: validate, midiOf: midiOf };
})();

</script>
<script>/* games/cart4/rhythm/art.js */
/*
 * games/cart4/rhythm/art.js — 《星塵節奏 STAR BEAT》CHR（全部原創；程式化點陣 + 手繪）
 * ---------------------------------------------------------------------------
 * 擁有者：C8-3 cart4-beat（R8）｜ 依賴：engine/chr.js（字身沿用原創 DEMO.FONT）
 *
 * 外觀（刻意避開 DDR 箭頭板 / Guitar Hero 透視指板 / Piano Tiles 黑白磚）：
 *   CROSS / DUO：「星十字」——畫面中央一顆脈動星核，四條星軌從上下左右匯入；音符是發光的「星籽」（透鏡形），
 *     從畫面四邊往中心飛，落進星核外圍的四個環形「星門」；四個角落是資訊面板。
 *   ORBIT：「繞行」——衛星沿著星核外的圓軌每小節繞一圈，軌道上預先亮起星標，衛星碰到星標時按鍵。
 *   BLADE：「節拍武士」——側視月面平台，原創角色「斬丸 ZAN」（圓頭機器浪人 + 光刃），
 *     左右飛來「刺刺隕 IMP」（低空）與「星翼蝠 WISP」（高空）。
 * 背景 bank rhythm_bg：F_* 字、BIG_*0..3 標題大字、ST1/ST2 星、RV_L/RV_R/RH_T/RH_B 星軌、GATE_0..3 星門、CORE_0..3 星核、
 *   FR_H/FR_V/FR_C 面板框、GA0/GA1/GA2 能量條、K_U/K_D/K_L/K_R/K_A/K_B 按鍵圖、ORB_* 圓軌（程式化去重）、
 *   GR_T/GR_A/GR_B 地面、PLN_0..15 環狀行星（32×32）。
 * 精靈 bank rhythm_spr：NV_0/1（上下軌星籽 16×8）、NH_0/1（左右軌星籽 8×16）、SPARK/TWINK、SAT_0..3 衛星、MK_S/MK_B 星標、
 *   ZAN_<影格>_0..7（16×32：IDLE / CUT / CUTH）、BLADE_0/1（光刃 8×16）、IMP_0..3、WISP_0..3、BACK。
 */
(function () {
  'use strict';
  var NES = window.NES = window.NES || {};
  var CT = window.CT = window.CT || {};
  var RH = CT.Rhythm = CT.Rhythm || {};
  var CHR = NES.CHR;
  var FONT = (CHR && CHR.DEMO && CHR.DEMO.FONT) || {};
  var CHARMAP = { ' ': 'SP', '-': 'DASH', '!': 'EXCL', '/': 'SLASH', '+': 'PLUS', 'x': 'MUL', ':': 'COLON', '%': 'PCT',
                  '$': 'STAR', '★': 'STAR', '.': 'DOT', '=': 'EQ', '?': 'QUEST', '>': 'ARROW', '♥': 'HEART', ',': 'COMMA', '(': 'LPAREN', ')': 'RPAREN', "'": 'APOS' };
  (function () {
    var i;
    for (i = 0; i <= 9; i++) CHARMAP[String(i)] = 'N' + i;
    for (i = 65; i <= 90; i++) CHARMAP[String.fromCharCode(i)] = String.fromCharCode(i);
  })();
  var KEYCH = { '↑': 'K_U', '↓': 'K_D', '←': 'K_L', '→': 'K_R', 'Ⓐ': 'K_A', 'Ⓑ': 'K_B' };

  /* ---------- 點陣工具 ---------- */

  /* ============================== 開局 / 舞台 ============================== */

  function buildStage() {
