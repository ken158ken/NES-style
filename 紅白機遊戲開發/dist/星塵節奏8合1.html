<!-- ===== engine（契約載入順序；缺檔不致命，nes.js 會用 stub 頂替） ===== -->
<script>/* engine/palette.js */
/*!
 * engine/palette.js — NES 系統調色盤（64 色 NTSC RGB 近似表）
 * 專案：紅白機遊戲開發 / R1 核心引擎 ｜ agent: ppu ｜ 版本 1.0.0（2026-09-17）
 *
 * 來源（RGB 值）：
 *   docs/research/01_硬體規格與限制.md §3.4「NES 系統調色盤（常用 RGB 近似值）」
 *   原始出處：ROM Detectives Wiki 的 2C02 調色盤表（即 FCEUX / Nestopia 常見的預設 RGB 近似）。
 *   注意：2C02 輸出的是 NTSC 複合訊號，沒有唯一正解的 RGB；本表僅為工作用近似值。
 *
 * 規格要點（docs/research/01 §3.4、05 §1.1）：
 *   - 索引為 6 bit（$00–$3F），編碼 `VVHHHH`：低 4 bit 色相、高 2 bit 亮度。
 *   - $0F 為標準黑；$0D 是「blacker than black」，官方警告不要用 → FORBIDDEN。
 *   - $0E/$0F/$1D/$1E/$1F/$2E/$2F/$3E/$3F 實質同為黑（去重後約 54 色）。
 *
 * API（docs/TASKS.md「API 契約」）：
 *   NES.PALETTE            → 長度 64 的陣列，每項 [r, g, b]
 *   NES.PALETTE.FORBIDDEN  → [0x0D]
 *   NES.PALETTE.rgb(i)     → [r, g, b]（複本；i 超出 0..63 會 throw）
 *   NES.PALETTE.nearest(r, g, b) → 最接近的調色盤索引（自動跳過 FORBIDDEN）
 *   附加（非契約，便利用）：hex(i)、isForbidden(i)、assert(i)、SIZE、VERSION
 */
(function (global) {
  'use strict';
  var NES = global.NES = global.NES || {};

  // 依 $00..$3F 順序排列的 24-bit RGB。
  var HEX = [
    0x7C7C7C, 0x0000FC, 0x0000BC, 0x4428BC, 0x940084, 0xA80020, 0xA81000, 0x881400,
    0x503000, 0x007800, 0x006800, 0x005800, 0x004058, 0x000000, 0x000000, 0x000000,
    0xBCBCBC, 0x0078F8, 0x0058F8, 0x6844FC, 0xD800CC, 0xE40058, 0xF83800, 0xE45C10,
    0xAC7C00, 0x00B800, 0x00A800, 0x00A844, 0x008888, 0x000000, 0x000000, 0x000000,
    0xF8F8F8, 0x3CBCFC, 0x6888FC, 0x9878F8, 0xF878F8, 0xF85898, 0xF87858, 0xFCA044,
    0xF8B800, 0xB8F818, 0x58D854, 0x58F898, 0x00E8D8, 0x787878, 0x000000, 0x000000,
    0xFCFCFC, 0xA4E4FC, 0xB8B8F8, 0xD8B8F8, 0xF8B8F8, 0xF8A4C0, 0xF0D0B0, 0xFCE0A8,
    0xF8D878, 0xD8F878, 0xB8F8B8, 0xB8F8D8, 0x00FCFC, 0xF8D8F8, 0x000000, 0x000000
  ];

  var PALETTE = [];
  for (var i = 0; i < 64; i++) {
    var h = HEX[i];
    PALETTE.push([(h >> 16) & 0xFF, (h >> 8) & 0xFF, h & 0xFF]);
  }

  PALETTE.VERSION = '1.0.0';
  PALETTE.SIZE = 64;
  PALETTE.SOURCE = 'ROM Detectives Wiki 2C02 palette (via docs/research/01 §3.4)';
  PALETTE.FORBIDDEN = [0x0D]; // $0D = blacker than black，禁用

  PALETTE.isForbidden = function (i) {
    return PALETTE.FORBIDDEN.indexOf(i | 0) >= 0;
  };

  // 驗證色號：非 0..63 整數或禁用色 → throw。ppu.js 設調色盤時會呼叫。
  PALETTE.assert = function (i, where) {
    if (typeof i !== 'number' || (i | 0) !== i || i < 0 || i > 63) {
      throw new Error('NES.PALETTE: 色號必須是 0..63 的整數，收到 ' + i +
        (where ? ' (' + where + ')' : ''));
    }
    if (PALETTE.isForbidden(i)) {
      throw new Error('NES.PALETTE: $' + ('0' + i.toString(16).toUpperCase()).slice(-2) +
        ' 是禁用色（blacker than black）' + (where ? ' (' + where + ')' : ''));
    }
    return i;
  };

  PALETTE.rgb = function (i) {
    if (typeof i !== 'number' || (i | 0) !== i || i < 0 || i > 63) {
      throw new Error('NES.PALETTE.rgb: 索引必須是 0..63 的整數，收到 ' + i);
    }
    var c = PALETTE[i];
    return [c[0], c[1], c[2]];
  };

  PALETTE.hex = function (i) {
    var c = PALETTE.rgb(i);
    return '#' + ('00000' + ((c[0] << 16) | (c[1] << 8) | c[2]).toString(16).toUpperCase()).slice(-6);
  };

  // 最接近色（歐氏距離平方，跳過禁用色）。相同距離取索引小者。
  PALETTE.nearest = function (r, g, b) {
    var best = 0, bestD = Infinity;
    for (var i = 0; i < 64; i++) {
      if (PALETTE.isForbidden(i)) continue;
      var c = PALETTE[i];
      var dr = c[0] - r, dg = c[1] - g, db = c[2] - b;
      var d = dr * dr + dg * dg + db * db;
      if (d < bestD) { bestD = d; best = i; if (d === 0) break; }
    }
    return best;
  };

  NES.PALETTE = PALETTE;
})(typeof window !== 'undefined' ? window : this);

</script>
<script>/* engine/fixed.js */
/* engine/fixed.js — NES.FX：定點數工具（位置 1/16 px、速度 8.8）
 * R1 / agent core。classic script、IIFE、零相依。
 *
 * 單位系統（全部整數；命名與 docs/TASKS.md「API 契約」一致）
 * ┌──────────┬───────────────┬───────────────────────────────────────────┐
 * │ 名稱     │ 1 單位 =      │ 用途                                       │
 * ├──────────┼───────────────┼───────────────────────────────────────────┤
 * │ sub      │ 1/16 px       │ 位置（SUB = 16）                           │
 * │ vel      │ 1/256 px/幀   │ 速度 8.8（v88(hi,lo) = hi 整數 px + lo/256）│
 * │ acc      │ 1/4096 px/幀² │ 加速度（= 1/16 vel，ACC = 16）             │
 * └──────────┴───────────────┴───────────────────────────────────────────┘
 * 兩層換算都是「每 16 個小單位進位 1 個大單位」，所以累加一律用 >>4 / &15，
 * 負數用算術右移自然取 floor，餘數恆為 0..15，不會因正負號漂移。
 *
 * 與 SMB1 反組譯常數的對應（見下方 NES.FX.SMB）：
 *   SMB「速度值」1 單位 = 1/16 px/幀 = 16 vel
 *   SMB「加速度 / 摩擦」1 單位 = 1/256 速度值/幀 = 1/4096 px/幀² = 1 acc  ← 原始位元組可直接用
 *   SMB「重力值」1 單位 = 1/256 px/幀² = 1 vel/幀 = 16 acc
 */
(function (root) {
  'use strict';
  var NES = root.NES = root.NES || {};

  var SUB = 16;    // 位置：1 px = 16 sub
  var VEL = 256;   // 速度：1 px/幀 = 256 vel（8.8 的 .8）
  var ACC = 16;    // 加速度：1 vel/幀 = 16 acc（→ 1 px/幀² = 4096 acc）

  /* ---------- 位置換算 ---------- */
  function toSub(px) { return (px * SUB) | 0; }          // px → sub（截尾取整）
  function toPx(sub) { return (sub | 0) / SUB; }         // sub → px（唯一會回傳非整數的函式，顯示 / 除錯用）
  function floorPx(sub) { return (sub | 0) >> 4; }       // sub → px（向下取整，負數也正確）
  function ceilPx(sub) { return -((-(sub | 0)) >> 4); }
  function roundPx(sub) { return ((sub | 0) + 8) >> 4; }
  function subFrac(sub) { return (sub | 0) & 15; }       // 像素內的 1/16 餘數（0..15）

  /* ---------- 速度換算（8.8） ---------- */
  // v88(2, 128) = 2.5 px/幀 = 640；負速度傳負的 hi：v88(-2, 128) = -640
  function v88(hi, lo) {
    hi = hi | 0; lo = lo | 0;
    if (hi < 0) return -(((-hi) * VEL + (lo < 0 ? -lo : lo)) | 0);
    return (hi * VEL + lo) | 0;
  }
  function velToPx(v) { return (v | 0) / VEL; }                     // vel → px/幀
  function pxToVel(px) { return Math.round(px * VEL) | 0; }         // px/幀 → vel
  function accToPx(a) { return (a | 0) / (VEL * ACC); }             // acc → px/幀²
  function pxToAcc(px) { return Math.round(px * VEL * ACC) | 0; }   // px/幀² → acc
  function smbSpd(b) { return ((b | 0) * 16) | 0; }                 // SMB 速度值($xx) → vel
  function smbGrav(b) { return ((b | 0) * 16) | 0; }                // SMB 重力值($xx) → acc

  /* ---------- Vec：{sub, frac} 小物件，每幀零配置 ---------- */
  function Vec(px, frac) { return { sub: toSub(px || 0), frac: frac | 0 }; }
  function vecSub(sub, frac) { return { sub: sub | 0, frac: frac | 0 }; }
  function vadd(vec, v) {                    // 位置前進一幀，回傳新的 sub
    var f = vec.frac + (v | 0);
    var d = f >> 4;
    vec.frac = f - (d << 4);
    vec.sub = (vec.sub + d) | 0;
    return vec.sub;
  }
  function vsetPx(vec, px) { vec.sub = toSub(px); vec.frac = 0; return vec; }
  function vsetSub(vec, sub) { vec.sub = sub | 0; vec.frac = 0; return vec; }
  function vpx(vec) { return vec.sub >> 4; }
  function vpxf(vec) { return vec.sub / SUB; }

  /* ---------- Acc：{v, frac} 速度小物件（加速度累加用） ---------- */
  function Acc(v) { return { v: v | 0, frac: 0 }; }
  function aadd(av, a) {                     // 速度前進一幀，回傳新的 vel
    var f = av.frac + (a | 0);
    var d = f >> 4;
    av.frac = f - (d << 4);
    av.v = (av.v + d) | 0;
    return av.v;
  }
  function aset(av, v) { av.v = v | 0; av.frac = 0; return av; }
  // 朝 target 以 a（acc 單位）逼近並夾住，不會過衝
  function aapproach(av, target, a) {
    target = target | 0;
    if (av.v < target) { aadd(av, a); if (av.v > target) aset(av, target); }
    else if (av.v > target) { aadd(av, -(a | 0)); if (av.v < target) aset(av, target); }
    return av.v;
  }

  /* ---------- 相容別名（R1 fix1 定案：正式寫法是 Vec / Acc）----------
   * 舊契約 `addVel(posSub, v88) → {pos, frac}` 與舊實作 `addVel(posSub, v, frac) → int`
   * （餘數放在全域 `NES.FX.frac`）**都已作廢**：全域餘數在多實體（主角 + N 個敵人）
   * 之間會互相污染。正式寫法是把餘數放進物件本身：
   *     位置 `Vec{sub, frac}` + `vadd(vec, v)`　／　速度 `Acc{v, frac}` + `aadd(av, a)`
   * `addVel / addAcc` 保留為**明確版本的相容別名**（= vadd / aadd），沒有任何隱藏狀態。
   */
  function addVel(vec, v) {
    if (!vec || typeof vec !== 'object' || typeof vec.sub !== 'number') {
      throw new TypeError('NES.FX.addVel 已改為 addVel(vec, v)（vec = FX.Vec(px)）；' +
        '舊的 addVel(posSub, v, frac) 與全域 NES.FX.frac 已移除，見 docs/ENGINE_API.md §3');
    }
    return vadd(vec, v);
  }
  function addAcc(av, a) {
    if (!av || typeof av !== 'object' || typeof av.v !== 'number') {
      throw new TypeError('NES.FX.addAcc 已改為 addAcc(acc, a)（acc = FX.Acc(vel)）；' +
        '舊的 addAcc(v, a, frac) 已移除，見 docs/ENGINE_API.md §3');
    }
    return aadd(av, a);
  }

  /* ---------- 整數工具 ---------- */
  function clamp(v, lo, hi) { v = v | 0; lo = lo | 0; hi = hi | 0; return v < lo ? lo : (v > hi ? hi : v); }
  function sign(v) { v = v | 0; return v > 0 ? 1 : (v < 0 ? -1 : 0); }
  function abs(v) { v = v | 0; return v < 0 ? -v : v; }
  function absMax(v, m) { v = v | 0; m = m | 0; if (m < 0) m = -m; return v > m ? m : (v < -m ? -m : v); }
  function mulShr(a, b, s) { return ((a | 0) * (b | 0)) >> (s | 0); }  // 定點乘法

  /* ---------- SMB1 常數表 ----------
   * 來源：docs/research/03_經典遊戲深度解析/01_超級瑪利歐兄弟.md ②「速度與加速度」「跳躍」
   *       原始出處 doppelganger《A Comprehensive SMB Disassembly》(SMBDIS.ASM)
   * 每一欄都標原始位元組與換算後的 px 值，方便回頭核對。
   */
  var SMB = {
    src: 'docs/research/03_經典遊戲深度解析/01_超級瑪利歐兄弟.md（SMBDIS.ASM 反組譯）',

    // MaxRightXSpdData / MaxLeftXSpdData（原始為 1/16 px/幀 的速度值）
    maxRun:      smbSpd(0x28),   // $28 = 40 → 2.5  px/幀 = 640 vel
    maxWalk:     smbSpd(0x18),   // $18 = 24 → 1.5  px/幀 = 384 vel
    maxWater:    smbSpd(0x10),   // $10 = 16 → 1.0  px/幀 = 256 vel
    maxCutscene: smbSpd(0x0c),   // $0c = 12 → 0.75 px/幀 = 192 vel

    // FrictionData（原始為 1/256 速度值/幀 = 1 acc，數值可直接用）
    accRun:   0xe4,              // 228 → 0.05566 px/幀²（14.25 vel/幀）
    accWalk:  0x98,              // 152 → 0.03711 px/幀²（ 9.5  vel/幀）
    friction: 0xd0,              // 208 → 0.05078 px/幀²（13.0  vel/幀）
    turnShift: 1,                // 面向 ≠ 移動方向時 `asl` → 加速度 ×2（煞車/轉身快一倍）

    // 空中控制門檻：水平速度 ≥ $19（1.5625 px/幀）才沿用跑步上限與跑步加速度
    airRunSpeed: smbSpd(0x19),   // 400 vel

    /* 跳躍 5 段：依起跳瞬間的水平速度絕對值（vel）選段
     * belowSpeed = 該段的上界（最後一段為 Infinity）
     * vy0 = 起跳初速（vel，負 = 往上）；gHold/gFall = 按住 / 放開 A 的重力（acc）
     * h = 研究文件列的理論最高跳躍高度（px），僅供對照（離散積分會差 1~3 px）
     */
    jump: [
      { belowSpeed: smbSpd(0x09), vy0: -v88(4, 0), gHold: smbGrav(0x20), gFall: smbGrav(0x70), h: 64 },
      { belowSpeed: smbSpd(0x10), vy0: -v88(4, 0), gHold: smbGrav(0x20), gFall: smbGrav(0x70), h: 64 },
      { belowSpeed: smbSpd(0x19), vy0: -v88(4, 0), gHold: smbGrav(0x1e), gFall: smbGrav(0x60), h: 68 },
      { belowSpeed: smbSpd(0x1c), vy0: -v88(5, 0), gHold: smbGrav(0x28), gFall: smbGrav(0x90), h: 80 },
      { belowSpeed: Infinity,     vy0: -v88(5, 0), gHold: smbGrav(0x28), gFall: smbGrav(0x90), h: 80 }
    ],
    swim:      { vy0: -v88(2, 0), gHold: smbGrav(0x0d), gFall: smbGrav(0x0a) },
    whirlpool: { vy0: -v88(1, 0), gHold: smbGrav(0x04), gFall: smbGrav(0x09) },

    // 放開 A 後要離地 ≥ 1 px 才切成大重力（DiffToHaltJump）
    diffToHaltJump: SUB,         // 16 sub = 1 px

    // 敵人：NormalXSpdData（栗寶寶等）
    enemySlow: smbSpd(0x08),     // $f8 → 0.5  px/幀（表中為負方向，這裡存絕對值）
    enemyFast: smbSpd(0x0c),     // $f4 → 0.75 px/幀

    // 計時器節拍（幀）
    intervalTimer: 21,           // IntervalTimerControl：每 21 幀一跳（framerule）
    injuryFrames: 8 * 21,        // 168 幀 ≈ 2.80 秒
    starFrames: 35 * 21,         // 735 幀 ≈ 12.2 秒

    // 依水平速度取跳躍段
    jumpFor: function (absSpeedVel) {
      absSpeedVel = absSpeedVel < 0 ? -absSpeedVel : absSpeedVel;
      for (var i = 0; i < SMB.jump.length; i++) if (absSpeedVel < SMB.jump[i].belowSpeed) return SMB.jump[i];
      return SMB.jump[SMB.jump.length - 1];
    },

    /* ---- 起跳首幀的重力（R1 fix1 總控裁定；QA P1-4 / P1-5）----------------
     * 半隱式 Euler（每幀「先加重力、再位移」）會把跳躍高度系統性地低估半個
     * 重力步：靜止跳 62.00 px（文件 4 格 = 64）、全速跳 77.50 px（文件 5 格 = 80），
     * ⇒「剛好 4 格牆 / 5 格牆」的關卡會跳不過去。
     * 修正：**起跳後的第 1 幀只套用半格重力**（leapfrog / 中點積分），之後照常。
     *   離散積分和 = Σ(v0 − g(k+½)) = v0²/2g ＝ 連續解 ⇒ 靜止跳 64.00 px、全速跳 80.00 px（±0）。
     * skipGravityFirstFrame 三種值：
     *   true / 'half' 首幀半格重力 →  64.00 / 80.00 px（預設，對齊研究文件 03/01）
     *   'full'        首幀完全不加重力 → 66.00 / 82.50 px（超過文件 2 / 2.5 px）
     *   false         舊行為（純半隱式） → 62.00 / 77.50 px（比文件少 2 / 2.5 px）
     */
    skipGravityFirstFrame: true
  };

  /* ---------- 跳躍：core 與 demo 共用的唯一一套規則 ----------
   * 用法（見 games/demo/main.js stepPlayer）：
   *   var js = FX.SMB.jumpState(g.vy);               // 綁定自己的 Acc，零配置
   *   if (onGround && pressedA) FX.SMB.jumpStart(js, FX.abs(vx), py.sub);
   *   if (!onGround) FX.SMB.jumpGravity(js, aHeldNow, py.sub, MAX_FALL);
   *   FX.vadd(py, js.vy.v);                          // 先重力、再位移（半隱式）
   * 規則：① 依起跳瞬間 |vx| 取 5 段之一（jumpFor）
   *       ② 按住 A = gHold；放開 **且已離地 ≥ 1 px**（DiffToHaltJump）才切 gFall
   *       ③ 起跳首幀依 skipGravityFirstFrame 只套半格重力（見上）
   */
  function jumpState(vyAcc) {
    return {
      seg: SMB.jump[0],
      vy: vyAcc || Acc(0),
      fastFall: false,
      startSub: 0,
      first: false,
      skipFirst: SMB.skipGravityFirstFrame
    };
  }
  function jumpStart(js, absVxVel, pySub) {
    js.seg = SMB.jumpFor(absVxVel | 0);
    aset(js.vy, js.seg.vy0);
    js.fastFall = false;
    js.startSub = pySub | 0;
    js.first = true;
    return js;
  }
  // 重新設定垂直速度但不算「新的一次跳躍」（踩敵回彈、被彈飛…）
  function jumpBounce(js, vel, pySub) {
    aset(js.vy, vel | 0);
    js.fastFall = false;
    js.startSub = pySub | 0;
    js.first = false;
    return js;
  }
  function jumpGravity(js, aHeld, pySub, maxFall) {

/* engine/cpu_timing.js — NES.Timing：60.0988 Hz 固定步邏輯迴圈
 * R1 / agent core。classic script、IIFE、零相依。
 *
 * 原則：
 *   - 邏輯步長固定 1/hz，**不做 delta-time 補間**（位置永遠是整數 sub 的累加）。
 *   - rAF 迴圈用累加器；一次 rAF 最多補 3 幀，還有剩就直接丟掉（避免分頁回前景時暴衝）。
 *   - step(n) 同步跑 n 幀（不走 rAF），供 tools/test_*.py 與截圖使用。
 *   - 每幀順序：Input.poll() → update() → draw()（NES.Input 不存在就跳過 poll）。
 *   - budget 模擬 VBlank 的 PPU 寫入頻寬：NTSC VBlank ≈ 2273 cycle ≈ 160~200 bytes。

 *       'ppu'（預設）名稱表 / 屬性表 / 調色盤，limit = 160 byte（NTSC）

    if (res && res.frame) res = res.frame;
    if (!res) return 'lint: (無結果)';
    return 'lint ' + (res.ok ? 'PASS' : 'FAIL') + ' — 色數 ' + res.colors + '/' + res.maxColors +
      '、非法像素 ' + res.badPixels + '、超線 ' + (res.overLine ? res.overLine.length : 0) +
      (res.errors && res.errors.length ? '｜' + res.errors.join('；') : '');
  }

  var Lint = {
    strict: false,
    magenta: false,
    maxColors: 25,
    maxSpritesPerLine: 8,
    MAGENTA: MAGENTA,
    VISIBLE: { y0: 8, y1: 232 },  // 研究 01 §3.1：NTSC 電視只看得到中央 256×224
    frame: frame,
    oam: oam,
    check: check,
    summary: summary
  };
  NES.Lint = Lint;
})();

          while (acc >= step && n < 4) { t.one(); acc -= step; n++; }
          if (n === 4) acc = 0;
        });
      },
      stop: function () { running = false; if (raf) cancelAnimationFrame(raf); raf = 0; }
    };
    return t;
  }

  // ---------------------------------------------------------------- 按鍵名 → mask
  var BTN_ALIAS = {
    a: 'A', b: 'B', select: 'SELECT', start: 'START',
    up: 'UP', down: 'DOWN', left: 'LEFT', right: 'RIGHT'
  };
  // toMask(129) / toMask('a') / toMask('a,right') / toMask(['a','right'])
  NES.toMask = function (spec) {
    var BTN = (NES.Input && NES.Input.BTN) || { A: 1, B: 2, SELECT: 4, START: 8, UP: 16, DOWN: 32, LEFT: 64, RIGHT: 128 };
    if (spec == null) return 0;
    if (typeof spec === 'number') return spec | 0;
    var list = Array.isArray(spec) ? spec : String(spec).split(/[,\s+|]+/);
    var m = 0;
    for (var i = 0; i < list.length; i++) {
      var k = String(list[i]).trim(); if (!k) continue;
      var key = BTN_ALIAS[k.toLowerCase()] || k.toUpperCase();
      if (BTN[key] == null) { warn('未知按鍵：' + k); continue; }
      m |= BTN[key];
    }
    return m;
  };

  // ---------------------------------------------------------------- boot
  // NES.boot({canvas, game, scale, debug, hz, mute})
  //  canvas : HTMLCanvasElement 或 CSS 選擇器；省略則自動建立並 append 到 body
  //  game   : {init(nes), update(nes), draw(nes), state()}；可為 function(nes) 工廠；可省略（黑畫面）
  //  scale  : 整數放大倍率（預設 1；game.html 會依視窗算好再傳進來）
  //  debug  : 預設看網址 ?debug=1
  //  budgetBytes / strictBudget : VBlank 寫入預算（預設 160 byte/幀；strict 時超支 throw）
  NES.boot = function (opt) {
    opt = opt || {};
    var q = {};
    try { new URLSearchParams(location.search).forEach(function (v, k) { q[k] = v; }); } catch (e) { }
    var debug = (opt.debug != null) ? !!opt.debug : (q.debug === '1');
    var scale = opt.scale || (q.scale ? parseInt(q.scale, 10) : 0) || 1;
    var mute = (opt.mute != null) ? !!opt.mute : (q.mute === '1');

    // --- canvas ---
    var canvas = opt.canvas;
    if (typeof canvas === 'string') canvas = document.querySelector(canvas);
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.id = 'nes';
      document.body.appendChild(canvas);
    }
    canvas.style.imageRendering = 'pixelated';

    NES.missing.length = 0;

    // --- PPU ---
    var ppu;
    if (need('ppu.js', NES.PPU && typeof NES.PPU.create === 'function')) {
      ppu = NES.PPU.create(canvas, { scale: scale });
    } else {
      ppu = stubPPU(canvas, { scale: scale });
    }

    // --- Input ---
    var input = NES.Input;
    if (!need('input.js', input && typeof input.poll === 'function')) input = stubInput();

    // --- APU / Music ---
    // mute 只代表「不接上喇叭」：APU 照樣建立與 tick，音樂邏輯 / 離線渲染在測試中才會一致
    var apu = null, music = null;
    if (need('apu.js', NES.APU && typeof NES.APU.create === 'function')) {
      try { apu = NES.APU.create({ sampleRate: 44100 }); } catch (e) { warn('APU.create 失敗：' + e.message); }
    }
    if (need('music.js', !!NES.Music)) {
      if (has(NES.Music, 'attach') && has(NES.Music, 'play')) {
        // music.js 的建議用法：attach(apu) 之後 NES.Music.play/stop/sfx/tick 直接可用。
        // 用單例（而不是 create 出來的第二個 driver），遊戲照契約呼叫 NES.Music.* 才會生效。
        if (apu) call(NES.Music, 'attach', apu);
        music = NES.Music;
      } else if (has(NES.Music, 'create')) {
        music = NES.Music.create(apu);
      } else {
        music = NES.Music;
        if (apu) { call(music, 'setAPU', apu); call(music, 'init', apu); }
      }
    }

    // --- 其他葉節點只做存在性檢查（模組本身自掛在 NES 上）---
    need('palette.js', !!NES.PALETTE);
    need('fixed.js', !!NES.FX);
    need('chr.js', !!NES.CHR);
    need('nes_lint.js', !!NES.Lint);

    // --- 遊戲物件 ---
    var game = opt.game;
    var nes = {
      VERSION: NES.VERSION, canvas: canvas, ctx: canvas.getContext('2d'),
      ppu: ppu, apu: apu, music: music, input: input,
      scale: scale, debug: debug, mute: mute, game: null, timing: null,
      missing: NES.missing.slice()
    };
    if (typeof game === 'function') { try { game = game(nes); } catch (e) { warn('game 工廠失敗：' + e.message); game = null; } }
    nes.game = game || { update: function () { }, draw: function () { } };

    // --- 主迴圈：update = Input.poll(由 Timing 負責) → game.update(nes) → apu.tick()
    //            draw   = game.draw(nes) → ppu.render() → ppu.endFrame()
    // draw()      純重畫：不推進任何邏輯（含 PPU 的 OAM 閃爍輪替）⇒ 截圖可重現（QA P1-2）
    // drawFrame() 一個完整幀的 draw 階段：重畫 + endFrame（推進閃爍輪替）
    function update() {
      call(nes.game, 'update', nes);
      if (apu) call(apu, 'tick');     // music.tick() 依契約由遊戲 update 自行呼叫
    }
    function draw() {
      call(nes.game, 'draw', nes);
      call(ppu, 'render');
    }
    function drawFrame() {
      draw();
      call(ppu, 'endFrame');
    }
    // nes.render()：只重畫、不推進；重畫期間暫停 VBlank 預算計帳（不然同一幀會被算兩次）
    nes.render = function () {
      var b = nes.timing && nes.timing.budget;
      if (b) b.mute = true;
      try { draw(); } finally { if (b) b.mute = false; }
    };

    // --- Timing ---
    var timing;
    if (need('cpu_timing.js', NES.Timing && typeof NES.Timing.create === 'function')) {
      timing = NES.Timing.create({
        update: update, draw: drawFrame, hz: opt.hz || NES.HZ,
        budgetBytes: opt.budgetBytes || 0, strictBudget: !!opt.strictBudget
      });
    } else {
      timing = stubTiming({ update: update, draw: drawFrame, hz: opt.hz || NES.HZ });
    }
    nes.timing = timing;
    // VBlank 寫入預算：綁到 PPU，之後 setTile/sprite/... 都會自動計帳（QA P1-6）
    if (ppu && timing.budget) ppu.budget = timing.budget;
    if (opt.strictBudget && timing.budget) timing.budget.strict = true;
    nes.missing = NES.missing.slice();   // Timing 的檢查在建立 nes 之後，重新同步一次
    nes.step = function (n) { return call(timing, 'step', n || 1); };
    nes.start = function () { call(timing, 'start'); };
    nes.stop = function () { call(timing, 'stop'); };
    nes.setScale = function (s) {
      s = Math.max(1, s | 0); nes.scale = s;
      if (has(ppu, 'setScale')) ppu.setScale(s);
      else { canvas.width = NES.W * s; canvas.height = NES.VISIBLE_H * s; call(ppu, 'render'); }
    };

    // --- 音訊解鎖：非 debug 時，使用者第一次按鍵 / 點擊才 apu.connect（瀏覽器自動播放政策）---
    var audioCtx = null, connected = false;
    nes.connectAudio = function () {
      if (connected || !apu || mute) return false;   // mute：建立了 APU 但不接喇叭
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        audioCtx = audioCtx || new AC();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        call(apu, 'connect', audioCtx);
        connected = true; nes.audioCtx = audioCtx;
        return true;
      } catch (e) { warn('connect 失敗：' + e.message); return false; }
    };
    function unlock() { nes.connectAudio(); }
    if (!debug && !mute) {
      window.addEventListener('keydown', unlock, { once: true });
      window.addEventListener('pointerdown', unlock, { once: true });
    }

    // --- 空白 CHR 保底 ---
    // chr.js 在場但沒人 setPattern 時，ppu.render() 會丟「尚未 setPattern」。
    // 在 game.init 之前塞一個全空白 bank，遊戲之後自己 setPattern 會覆蓋掉它。
    if (NES.CHR && has(NES.CHR, 'bank') && has(NES.CHR, 'setPattern')) {
      try {
        var p0 = has(NES.CHR, 'pattern') ? NES.CHR.pattern(0) : null;
        var p1 = has(NES.CHR, 'pattern') ? NES.CHR.pattern(1) : null;
        if (!p0 || !p1) {
          var blankRows = ['........', '........', '........', '........', '........', '........', '........', '........'];
          var bk = (has(NES.CHR, 'getBank') && NES.CHR.getBank('__nes_blank')) || NES.CHR.bank('__nes_blank', { BLANK: blankRows });
          if (!p0) NES.CHR.setPattern(0, bk.name || '__nes_blank');
          if (!p1) NES.CHR.setPattern(1, bk.name || '__nes_blank');
        }
      } catch (e) { warn('空白 CHR 保底失敗：' + e.message); }
    }

    // --- 啟動 ---
    call(nes.game, 'init', nes);
    // game.init() 等同真機「rendering 關閉時的初始化」：想寫多少 PPU 就寫多少，不算 VBlank 預算
    if (timing.budget) call(timing.budget, 'clear');
    if (debug) {
      drawFrame();                  // debug：不自動跑，先畫一幀，之後由 __nes.step() 推進
    } else {
      nes.start();
    }

    NES.instance = nes;
    NES.canvas = canvas;

    // ------------------------------------------------------------ 除錯 API
    if (debug) {
      window.__nes = {
        // 推進 n 幀（同步，不走 rAF）
        step: function (n) { nes.step(n || 1); return timing.frame; },
        // press(mask | 'a' | ['a','right'], n)：按住 n 幀並推進 n 幀
        press: function (spec, n) {
          n = n || 1;
          var m = NES.toMask(spec);
          call(input, 'inject', m, n);
          nes.step(n);
          return timing.frame;
        },
        // tap(spec, n)：按 n 幀後放開（預設 1 幀）
        tap: function (spec, n) {
          n = n || 1;
          var m = NES.toMask(spec);
          call(input, 'inject', m, n);
          nes.step(n);
          call(input, 'inject', 0, 0);
          return timing.frame;
        },
        release: function () { call(input, 'inject', 0, 0); return true; },
        // 重畫一幀但不推進任何邏輯（截圖前用）；PPU 的閃爍輪替指標也不動 ⇒ 可重現
        render: function () { nes.render(); return true; },
        // state()：遊戲自己的 state() 併上 frame / stats
        state: function () {
          var s = {};
          try { var gs = call(nes.game, 'state'); if (gs) s = (typeof gs === 'string') ? JSON.parse(gs) : gs; } catch (e) { }
          s.frame = timing.frame;
          s.hz = timing.hz;
          s.stats = this.stats();
          return s;
        },
        // frame()：base64 PNG（data URL）；canvas 取不到時退回 ppu.frame 摘要
        // ⚠️ 與 state().frame / stats().frame（幀號）同名不同義 ⇒ 另給別名 snapshot()（QA P2-2）
        frame: function () {
          try { return canvas.toDataURL('image/png'); }
          catch (e) {
            var f = ppu.frame;
            if (!f) return null;
            var n = 0, sum = 0;
            for (var i = 0; i < f.length; i += 4) { if (f[i] | f[i + 1] | f[i + 2]) n++; sum += f[i] + f[i + 1] + f[i + 2]; }
            return { w: NES.W, h: NES.H, nonBlack: n, avg: Math.round(sum / (f.length / 4 * 3)) };
          }
        },
        // snapshot()：frame() 的別名，語意更清楚（回傳 PNG，不是幀號）
        snapshot: function () { return this.frame(); },
        // lint()：交給 nes_lint.js；未載入時回報 skipped
        lint: function () {
          if (NES.Lint && typeof NES.Lint.frame === 'function') {
            var r = NES.Lint.frame(ppu);
            if (r && NES.Lint.oam) { try { r.oam = NES.Lint.oam(ppu); } catch (e) { r.oamError = e.message; } }
            // 便利：把 PPU 自己統計的超線資訊一併帶出（lint 讀不到時仍看得見）
            if (r && ppu.stats) {
              var ol = ppu.stats.overLines || ppu.stats.overLine;
              if (ol && ol.length && !(r.overLine && r.overLine.length)) r.ppuOverLines = ol;
              if (ppu.stats.maxSpritesLine != null) r.maxSpritesLine = ppu.stats.maxSpritesLine;
            }
            return r;
          }
          return { ok: true, skipped: true, reason: 'nes_lint.js 未載入' };
        },
        stats: function () {
          var st = (ppu && ppu.stats) || {};
          var bg = timing.budget;
          return {
            frame: timing.frame, hz: timing.hz,
            colors: st.colors, maxSpritesLine: st.maxSpritesLine, flickered: st.flickered,
            budgetOver: !!(bg && bg.over),
            // VBlank 寫入預算明細（QA P1-6）：ppu 通道 160 byte + OAM DMA 256 byte
            budget: (bg && typeof bg.report === 'function') ? bg.report() : null,
            scale: nes.scale,
            missing: nes.missing.slice(),
            stub: { ppu: !!ppu.stub, input: !!input.stub, timing: !!timing.stub, apu: !apu, music: !music }
          };
        },
        // 額外便利：給 tools/shot.py 與手寫 playwright 腳本用
        nes: function () { return nes; },
        setScale: function (s) { nes.setScale(s); return nes.scale; },
        missing: function () { return nes.missing.slice(); },
        version: NES.VERSION
      };
    }
    return nes;
  };
})();

</script>

<!-- ===== 遊戲：games/cart4「星塵節奏 8 合 1」合輯卡帶四（R8）=====
     共用 games/cart1/registry.js（window.CART_ID 決定存檔前綴）與 games/cart1/shell.js（讀 CT.CART_CFG 畫選單）；
     本卡設定 games/cart4/cart.js。新遊戲檔一律插在標記之間。 -->
<script>window.CART_ID = 'cart4';</script>
<script>/* games/cart1/registry.js */
/*
 * games/cart1/registry.js — 合輯卡帶共用的遊戲註冊表與工具（全域 `CT`；R5《星塵 8 合 1》起，R6 起各卡帶共用，靠 window.CART_ID 區分）
 * ---------------------------------------------------------------------------
 * 擁有者：總控（R5 開工骨架）。**只准 Edit 插入**，契約見 docs/R5_BRIEF.md §2。
 * 載入順序：engine/* → games/cart1/registry.js → 各遊戲檔（CT.register）→ shell.js（選單，可缺）→ boot.js
 *
 * 每款遊戲 = 一個與 window.GAME 同介面的物件，加上合輯要的幾個欄位：
 *   CT.register({
 *     id: 'maze', order: 1, title: '星塵迷宮', legacy: ['pacman.html'],
 *     init(nes, opt), update(nes), draw(nes), state(),   // 同 ENGINE_API §12
 *     exit(nes),          // 可省略：離開前停音樂 / 收拾自己的監聽
 *     cheat(),            // 一鍵密技（C 鍵 / ★ / nes-cheat 事件），回傳 true = 有生效
 *     bot(nes) → mask,    // ?bot=1 自動駕駛：回傳「下一幀」要按的鍵；null = 不按
 *     goal() → bool       // 機器人驗收條件已達成（例如過 3 關 / 分數 ≥ N）
 *   });
 *
 * 沒有 shell.js 時（R5 平行開發期間），boot 直接跑 `?game=<id>`（或第一款）。
 * shell.js 在場時由它接管：設 `CT.Shell = { init, update, draw, state }`，透過 CT.launch / CT.back 切換。
 */
(function () {
  'use strict';
  var NES = window.NES = window.NES || {};
  var CT = window.CT = window.CT || {};

  CT.games = CT.games || [];
  CT.current = null;          // 目前執行中的遊戲物件（選單時 = null）
  // R6 起多卡帶共用本檔：入口頁在載入本檔前設 `window.CART_ID = 'cart2'`（缺省 = 'cart1'，行為與 R5 相同）
  CT.CART = String(window.CART_ID || 'cart1');
  CT.KEY = 'nes.' + CT.CART + '.';      // localStorage 前綴（cart1 = 'nes.cart1.'，舊存檔不變）

  CT.register = function (g) {
    if (!g || !g.id) throw new Error('CT.register: 缺 id');
    for (var i = 0; i < CT.games.length; i++) {
      if (CT.games[i].id === g.id) { CT.games[i] = g; sort(); return g; }
    }
    CT.games.push(g); sort();
    return g;
  };
  function sort() { CT.games.sort(function (a, b) { return (a.order || 99) - (b.order || 99); }); }
  CT.get = function (id) {
    for (var i = 0; i < CT.games.length; i++) if (CT.games[i].id === id) return CT.games[i];
    return null;
  };

  /* ---------------- 換遊戲時的 PPU / APU 歸零（= 關 rendering 重寫，不計 VBlank 預算） ---------------- */
  CT.blank = function (nes, fn) {
    var bud = nes && nes.timing && nes.timing.budget;
    var muted = bud ? bud.mute : false;
    if (bud) bud.mute = true;
    try { fn(); } finally { if (bud) bud.mute = muted; }
  };
  CT.resetHW = function (nes) {
    var ppu = nes.ppu;
    CT.blank(nes, function () {
      try { if (nes.music && nes.music.stop) nes.music.stop(); } catch (e) { }
      try { if (nes.music && nes.music.stopSfx) nes.music.stopSfx(); } catch (e) { }
      if (!ppu) return;
      if (ppu.split) ppu.split(null);
      if (ppu.scroll) ppu.scroll(0, 0);
      if (ppu.spriteMode) ppu.spriteMode(8);
      ppu.flicker = 'rotate'; ppu.flickerStep = 8;
      if (ppu.clearSprites) ppu.clearSprites();
      // 先切回垂直鏡像再清兩張表：前一款若是水平鏡像，先清後切會露出另一張表的殘影（shell 實測屬性表殘 240 格）
      if (ppu.mirroring) ppu.mirroring('v');
      if (ppu.fillTiles) { ppu.fillTiles(0, 0, 0, 32, 30, 0); ppu.fillTiles(1, 0, 0, 32, 30, 0); }
      if (ppu.fillAttr) { ppu.fillAttr(0, 0, 0, 16, 15, 0); ppu.fillAttr(1, 0, 0, 16, 15, 0); }
      if (ppu.setBackdrop) ppu.setBackdrop(0x0F);
    });
  };

  /* ---------------- 存檔（每款自己的 key；排行 / 最高分 / 解鎖） ---------------- */
  CT.load = function (id, key, dflt) {
    try {
      var s = window.localStorage.getItem(CT.KEY + id + '.' + key);
      return s == null ? dflt : JSON.parse(s);
    } catch (e) { return dflt; }
  };
  CT.save = function (id, key, val) {
    try { window.localStorage.setItem(CT.KEY + id + '.' + key, JSON.stringify(val)); return true; }
    catch (e) { return false; }
  };

  /* ---------------- 切換 ---------------- */
  var nes0 = null;
  CT.nes = function () { return nes0; };
  CT.launch = function (id, opt) {
    var g = CT.get(id);
    if (!g || !nes0) return false;
    if (CT.current && CT.current.exit) { try { CT.current.exit(nes0); } catch (e) { } }
    CT.resetHW(nes0);
    CT.current = g;
    CT.blank(nes0, function () { g.init(nes0, opt || {}); });
    return true;
  };
  // 回選單（shell 不在 = 重新開始同一款）
  CT.back = function () {
    if (!nes0) return;
    var g = CT.current;
    if (g && g.exit) { try { g.exit(nes0); } catch (e) { } }
    CT.current = null;
    CT.resetHW(nes0);
    if (CT.Shell) CT.blank(nes0, function () { CT.Shell.init(nes0, { from: g && g.id }); });
    else if (g) CT.launch(g.id);
  };

  /* ---------------- 共用熱鍵：START+SELECT 一起按住 60 幀 = 回選單（遊戲內不得佔用此組合） ---------------- */
  var BTN = (NES.Input && NES.Input.BTN) || { SELECT: 4, START: 8 };
  var backHold = 0;
  CT.BACK_FRAMES = 60;
  function checkBack() {
    var I = NES.Input;
    if (!I || !I.held || !CT.current) { backHold = 0; return false; }
    if (I.held(BTN.START) && I.held(BTN.SELECT)) {
      if (++backHold >= CT.BACK_FRAMES) { backHold = 0; CT.back(); return true; }
    } else backHold = 0;
    return false;
  }
  CT.backProgress = function () { return backHold / CT.BACK_FRAMES; };

  /* ---------------- 一鍵密技：C 鍵 / 觸控 ★ / nes-cheat 事件 → 目前遊戲的 cheat() ---------------- */
  CT.cheat = function () {
    var g = CT.current;
    return !!(g && g.cheat && g.cheat());
  };
  if (window.addEventListener) {
    window.addEventListener('nes-cheat', function () { CT.cheat(); }, false);
    window.addEventListener('keydown', function (e) {
      if (!e || e.repeat || e.ctrlKey || e.altKey || e.metaKey) return;
      if ((e.code || '') !== 'KeyC') return;
      var ev = null;
      try { ev = new window.CustomEvent('nes-cheat', { detail: { source: 'key' } }); } catch (e2) { ev = null; }
      if (ev) window.dispatchEvent(ev); else CT.cheat();
    }, false);
  }

  /* ---------------- 自動駕駛 ?bot=1（tools/playthrough_cart.py 用） ---------------- */
  var q = null;
  try { q = new URLSearchParams(location.search); } catch (e) { q = null; }
  CT.query = function (k) { return q ? q.get(k) : null; };
  CT.botOn = CT.query('bot') === '1';
  function botTick() {
    var g = CT.current;

/*
 * games/cart4/simon/art.js — 《星塵跟我做 STAR ECHO》CHR（全部原創，程式化點陣）
 * ---------------------------------------------------------------------------
 * 擁有者：C8-2 cart4-sound（R8）｜ 依賴：engine/chr.js（字身沿用原創 DEMO.FONT）

 *   ↑ STAR 五角星（青）   → MOON 新月（金）   ↓ PLANET 環行星（洋紅）   ← COMET 彗星（綠）
 * 每顆 48×48（6×6 磚，背景名稱表），色 1 = 輪廓、色 2 = 本體、色 3 = 白色高光；亮燈 = 換那一組 BG 調色盤
 * （每幀 3 byte），文字一律用色 3（四組調色盤的色 3 都是白）⇒ 亮燈不影響文字。
 * 背景磚（simon_bg）：字型 F_*、P{0..3}_{0..35} 四顆星標、M{0..3}_{0..3} 16×16 迷你圖示（標題對照圖）、
 *   箭頭 AU/AD/AL/AR 各 2×2、核心框角 CR_*、星點 ST1/ST2、大字 BIG_*、愛心 HP1/HP0、計時條 BAR0..8、十字鍵 DP_*。
 * 精靈（simon_spr）：SPK0/SPK1 亮燈星芒、BADGE 「B」徽章（第二組）、ORB 繞行小星（第二組）、DOT 回選單提示。

  var CHARMAP = (CHR && CHR.DEMO && CHR.DEMO.CHARMAP) || {};

    { key: 'STAR', dir: 'UP' }, { key: 'MOON', dir: 'RIGHT' }, { key: 'PLANET', dir: 'DOWN' }, { key: 'COMET', dir: 'LEFT' }
  ];

<script>/* games/cart4/simon/song.js */
/*
 * games/cart4/simon/song.js — 《星塵跟我做 STAR ECHO》音樂 / 音效（全部原創，只走 2A03）
 * ---------------------------------------------------------------------------
 * 擁有者：C8-2 cart4-sound（R8）｜ 依賴：engine/music.js
 * 契約：CT.Simon.Audio = { init(nes), play(key), stop(), pause(), resume(), isPaused(), sfx(name), tone(k, len), tick(),
 *                          SONGS, SFX, KEYS, current, lastSfx, lastTone }
 *
 * **聲道分工（鍵音和 BGM 共存的作法）**：
 *   - 遊玩中的 BGM（simon_play）**只用三角波 + 雜訊**（低音 + 輕刷），p1 / p2 完全空著；
 *   - 8 個鍵音一律走 **p1**（priority 6），系統音效（GOOD / MISS / 選單）走 **p2**（MISS 另帶一下雜訊）；
 *   ⇒ 鍵音永遠不會被 BGM 蓋掉，也不會去搶 BGM 的聲道（BGM 在展示 / 輸入期間持續不斷）。
 *   - 標題曲 / 過關小號（simon_clear）/ 結束曲才用到 p1 / p2，那些時段沒有鍵音。
 *
 * | key          | 曲名     | speed | 小節 | 說明 |
 * |--------------|----------|-------|------|------|
 * | simon_title  | 星語呼喚 | 7     | 4    | 標題；A 大調，p1 旋律 / p2 分解和弦 / tri / noi |
 * | simon_play   | 靜夜脈動 | 8     | 4    | 遊玩；**只有 tri + noi**（A–F#m–D–E 低音 + 輕刷） |
 * | simon_clear  | 迴響成就 | 5     | 1    | 經典到 15 步的小號（不 loop） |
 * | simon_over   | 星光散去 | 9     | 1    | GAME OVER（不 loop） |
 *
 * 8 個鍵音（音高 + 音色都不同；音高順序 下 < 左 < 右 < 上，第二組 = 按住 B）：
 *   k0 ↑ 星   A5  占空比 12.5%、撥弦式衰減（亮、細）
 *   k1 → 月   E5  占空比 25%、延遲顫音（柔）
 *   k2 ↓ 行星 A4  占空比 50%、平穩（空心、低）
 *   k3 ← 彗星 C#5 25% / 50% 交替（嗡嗡聲）+ 尾端下滑（彗尾）
 *   k4..k7 = B + ↑→↓←：G#5 / F#5 / B4 / D5，音色同方向那一組，再疊 **八度快速琶音**（閃爍感）

(function () {
  'use strict';
  var NES = window.NES = window.NES || {};
  var CT = window.CT = window.CT || {};

    pluck: { vol: [8, 6, 4, 3, 2, 1, 0], duty: [1] },
    soft: { vol: [7, 8, 8, 7, 7, 6, 6, 5], volLoop: 7, duty: [2] },
    bass: {},

  }

  function buildTitle() {

    var M = [
      'E-5 -   A-5 -   C#6 -   B-5 -   A-5 -   -   -   E-5 -   F#5 -   -   -',
      'G#5 -   F#5 -   E-5 -   F#5 -   A-5 -   -   -   -   -   -   -   -   -',

      'C#6 -   B-5 -   G#5 -   B-5 -   A-5 -   -   -   =   -   -   -   -   -'

    return song('星語呼喚（simon_title）', 7, M.map(function (m, i) {
      return { p1: mel(m, 'lead', 11, 2), p2: arpeg(C[i][0], C[i][1], 6),
               tri: mel([C[i][2], '-', '-', '-', C[i][3], '-', '-', '-', C[i][2], '-', '-', '-', C[i][3], '-', '-', '-'].join(' '), 'bass', 15, 0),

  function buildClear() {

    g.blink++;

    if (pressed(BTN.DOWN)) { g.menu = (g.menu + 1) % MODES.length; sfx('simon_menu'); }
    if ((pressed(BTN.START) && !held(BTN.SELECT)) || pressed(BTN.A)) { sfx('simon_ok'); startGame(); }
  }
  function updatePlay() {
    if (pressed(BTN.START) && !held(BTN.SELECT) && g.phase !== 'over') {
      g.paused = !g.paused;
      if (g.paused) Au.pause(); else if (!Au.resume()) Au.play('simon_play');
      sfx('simon_menu');
    }
    if (g.paused) return;
    if (g.msgT > 0) g.msgT--;
    if (g.musicBack > 0 && --g.musicBack === 0 && g.phase !== 'over') { Au.stop(); Au.play('simon_play'); }
    if (g.litT > 0 && --g.litT === 0) g.lit = -1;
    g.bheld = g.m.keys === 8 && held(BTN.B);
    g.pt++;
    switch (g.phase) {
      case 'ready': updateReady(); break;
      case 'intro': updateIntro(); break;
      case 'show': updateShow(); break;
      case 'input':
        if (g.goodWait > 0) { if (--g.goodWait === 0) roundClear(); break; }
        if (pressed(BTN.SELECT) || (g.m.keys === 4 && pressed(BTN.B))) { replay(); break; }
        var d = -1;
        for (var i = 0; i < 4; i++) if (pressed(DIR_BTN[i])) { d = i; break; }
        if (d >= 0) { press(d + (g.m.keys === 8 && held(BTN.B) ? 4 : 0)); break; }
        if (++g.idle >= INPUT_TIMEOUT) miss(expectKey());
        break;
      case 'good':
        if (g.pt >= GOOD_F) {
          if (g.len >= MAX_LEN) { gameOver(); break; }
          g.len++; g.replayUsed = false; setPhase('intro');
        }
        break;
      case 'miss':
        // 正確那顆閃 3 下（每 16 幀）
        if (g.pt % 32 === 4 && g.pt < 100) light(g.missKey, 14, true);
        if (g.pt >= MISS_F) {
          if (g.lives <= 0) gameOver();
          else { g.replayUsed = false; setPhase('intro'); }
        }
        break;
      case 'over':
        if (pressed(BTN.A) || (pressed(BTN.START) && !held(BTN.SELECT))) toTitle();
        break;
    }
  }

  /* ============================== 畫面 ============================== */
  function padPal(i) {
    if (g.mode !== 'play') return LIT[i];
    if (g.lit >= 0 && g.litVis && (g.lit & 3) === i && !g.paused) return g.lit >= 4 ? LIT2[i] : LIT[i];
    return DIM[i];
  }
  function setPalettes(force) {
    for (var i = 0; i < 4; i++) {
      var p = padPal(i), code = p[0] * 4096 + p[1] * 64 + p[2];
      if (force || g.palNow[i] !== code) { ppu0.setBgPalette(i, p); g.palNow[i] = code; }
    }
  }
  function initPalettes() {
    ppu0.setBackdrop(0x0F);
    g.palNow = [-1, -1, -1, -1];
    setPalettes(true);
    for (var i = 0; i < 4; i++) ppu0.setSprPalette(i, PAL_SPR[i]);
  }
  function stars(seed, count, avoid) {
    var s = seed, i;
    for (i = 0; i < count; i++) {
      s = (Math.imul(s, 1103515245) + 12345) & 0x7FFFFFFF;
      var c = (s >> 10) & 31, r = 1 + ((s >> 16) % 28);
      if (avoid && avoid(c, r)) continue;
      put(c, r, A.t((s >> 4) & 1 ? 'ST1' : 'ST2'));
    }
  }
  function block(c, r, w, h, prefix, pal) {
    for (var j = 0; j < w * h; j++) put(c + (j % w), r + ((j / w) | 0), A.t(prefix + j));
    if (pal !== undefined) for (var y = 0; y < h; y += 2) for (var x = 0; x < w; x += 2) putA((c + x) >> 1, (r + y) >> 1, pal);
  }
  function bigText(c, r, s) {
    for (var i = 0; i < s.length; i++) {
      var ch = s.charAt(i);
      if (ch === ' ') continue;
      for (var j = 0; j < 4; j++) put(c + i * 2 + (j & 1), r + (j >> 1), A.t('BIG_' + ch + j));
    }
  }
  function blankAll() { ntReset(); ppu0.fillTiles(0, 0, 0, 32, 30, 0); ppu0.fillAttr(0, 0, 0, 16, 15, 0); initPalettes(); }

  function drawTitleScreen() {
    blankAll();
    stars(23, 70, function (c, r) { return (r >= 1 && r <= 5) || (r >= 6 && r <= 28 && c >= 1 && c <= 30); });
    text(4, 2, 'STARDUST');
    bigText(13, 1, 'ECHO');
    text(4, 4, 'FOLLOW THE STARS');
    // 對照圖：迷你十字（各自的調色盤）+ 方向 / 名稱 / 音高
    block(4, 16, 2, 2, 'M0_', 0); block(6, 18, 2, 2, 'M1_', 1); block(4, 20, 2, 2, 'M2_', 2); block(2, 18, 2, 2, 'M3_', 3);
    text(10, 16, 'UP    STAR    HIGH');
    text(10, 17, 'RIGHT MOON');
    text(10, 18, 'LEFT  COMET');
    text(10, 19, 'DOWN  PLANET  LOW');
    text(10, 21, 'OCTET: B+DIR = 4 MORE');
    text(2, 23, 'SELECT/B: WATCH AGAIN (-PTS)');
    text(2, 25, 'START PAUSE  C/$ = CHEAT');
    text(2, 26, 'HOLD START+SELECT: MENU');
    flush(ppu0, true);
    drawTitleValues();
    flush(ppu0, true);
  }
  function drawTitleValues() {
    for (var i = 0; i < MODES.length; i++) {
      var m = MODES[i];
      text(6, 6 + i, pad(m.name, 8));
      text(15, 6 + i, 'BEST ' + num(CT.load('simon', m.key, 0), 2));
    }
    var m0 = MODES[g.menu];
    text(4, 11, pad(m0.desc[0], 26)); text(4, 12, pad(m0.desc[1], 26));
    text(11, 28, (g.blink >> 5) & 1 ? '          ' : 'PUSH START');
  }

  function drawPlayScreen() {
    blankAll();
    stars(5, 70, function (c, r) { return (c <= 24 && r >= 3 && r <= 27) || c >= HUDC - 1 || r <= 2; });
    for (var i = 0; i < 4; i++) {
      block(PAD[i].c, PAD[i].r, 6, 6, 'P' + i + '_', i);
      block(ARW[i].c, ARW[i].r, 2, 2, 'AW' + i + '_', 0);
    }
    put(CORE.c, CORE.r, A.t('CR_TL')); put(CORE.c + 5, CORE.r, A.t('CR_TR'));
    put(CORE.c, CORE.r + 5, A.t('CR_BL')); put(CORE.c + 5, CORE.r + 5, A.t('CR_BR'));
    text(2, 2, 'STAR ECHO');
    text(HUDC, 4, 'MODE'); text(HUDC, 7, 'STEP'); text(HUDC, 10, 'SCORE'); text(HUDC, 13, 'BEST'); text(HUDC, 16, 'LIFE'); text(HUDC, 19, 'AGAIN');
    renderPlay();
    flush(ppu0, true);
  }
  function coreText() {
    if (g.paused) return ['PAUSE', ''];
    var cnt = num(Math.min(g.len, 99), 2);
    switch (g.phase) {
      case 'ready': return ['READY', g.pt < 30 ? '' : String(3 - Math.floor((g.pt - 30) / 30)).replace(/^0$|^-.*/, 'GO')];
      case 'intro': return [g.m.light ? 'WATCH' : 'LISTEN', cnt];
      case 'show': return [g.m.light ? 'WATCH' : 'LISTEN', num(g.showI + 1, 2) + '/' + cnt];
      case 'input': return [g.m.rev ? 'BACK' : 'PLAY', num(g.pos, 2) + '/' + cnt];
      case 'good': return ['GOOD', cnt];
      case 'miss': return ['MISS', g.lives > 0 ? 'LIFE-1' : ''];
      case 'over': return ['OVER', num(g.maxDone, 2)];
    }
    return ['', ''];
  }
  function statusLines() {
    if (g.paused) return ['', 'HOLD START+SELECT: MENU'];
    if (g.msgT > 0 && g.msg) return ['', g.msg];
    switch (g.phase) {
      case 'ready': return ['', 'GET READY'];
      case 'intro': case 'show':
        return ['', g.m.id === 'ear' ? 'LISTEN - NO LIGHTS' : (g.m.id === 'eye' ? 'WATCH - SILENT' : (g.m.rev ? 'WATCH, THEN BACKWARDS' : 'WATCH AND LISTEN'))];
      case 'input': return [null, g.replayUsed ? 'YOUR TURN' : (g.m.keys === 8 ? 'YOUR TURN  SEL=AGAIN' : 'YOUR TURN  B=AGAIN')];
      case 'miss': return ['', 'THAT STAR WAS ' + SM.PADS[g.missKey & 3].key + (g.missKey >= 4 ? '+B' : '')];
      case 'over': return ['RANK ' + rankOf(g.maxDone), 'A TITLE   $ CONTINUE'];
    }
    return ['', ''];
  }
  function renderPlay() {
    var ct = coreText();
    text(CORE.c, CORE.r + 2, ctr(ct[0], 6));
    text(CORE.c, CORE.r + 3, ctr(ct[1], 6));
    text(HUDC, 5, pad(g.m.name, 7));
    text(HUDC, 8, num(Math.min(g.len, 99), 2) + (g.m.id === 'classic' ? '/' + GOAL_LEN : '   '));
    text(HUDC, 11, num(g.score, 6));
    text(HUDC, 14, num(Math.max(g.best, g.maxDone), 2));
    for (var i = 0; i < MAX_LIVES; i++) put(HUDC + i, 17, i < g.lives ? A.t('F_HEART') : 0);
    text(HUDC, 20, g.replayUsed ? 'USED ' : 'READY');
    var st = statusLines();
    if (st[0] === null) {        // 輸入中：計時條
      text(2, 26, 'TIME ');
      var left = Math.max(0, INPUT_TIMEOUT - g.idle), px = Math.ceil(left * 64 / INPUT_TIMEOUT);
      for (i = 0; i < 8; i++) put(7 + i, 26, A.t('BAR' + Math.max(0, Math.min(8, px - i * 8))));
      text(15, 26, ' ' + (left / 60).toFixed(1) + 'S  ');
    } else text(2, 26, pad(st[0], 22));
    text(2, 27, pad(st[1], 22));
  }

  function drawSprites() {
    var slot = 0, i;
    if (g.mode === 'play' && !g.paused && g.lit >= 0 && g.litVis) {
      var p = PAD[g.lit & 3], x0 = p.c * 8, y0 = p.r * 8, ph = (g.frames >> 2) & 1;
      var sp = A.s(ph ? 'SPK1' : 'SPK0');
      ppu0.sprite(slot++, { x: x0 - 4, y: y0 - 4, tile: sp, pal: 0 });
      ppu0.sprite(slot++, { x: x0 + 44, y: y0 - 4, tile: sp, pal: 0 });
      ppu0.sprite(slot++, { x: x0 - 4, y: y0 + 44, tile: sp, pal: 0 });
      ppu0.sprite(slot++, { x: x0 + 44, y: y0 + 44, tile: sp, pal: 0 });
      if (g.lit >= 4) {
        ppu0.sprite(slot++, { x: x0 + 20, y: y0 + 20, tile: A.s('BADGE'), pal: 1 });
        for (i = 0; i < 2; i++) {
          var a = (g.frames * 0.12) + i * Math.PI;
          ppu0.sprite(slot++, { x: x0 + 20 + Math.round(Math.cos(a) * 26), y: y0 + 20 + Math.round(Math.sin(a) * 26), tile: A.s('ORB'), pal: 2 });
        }
      }
    }
    if (g.mode === 'play' && g.bheld && !g.paused && g.phase === 'input') {
      ppu0.sprite(slot++, { x: CORE.c * 8 + 20, y: CORE.r * 8 + 4, tile: A.s('BADGE'), pal: 1 });
    }
    if (g.mode === 'title') ppu0.sprite(slot++, { x: 3 * 8, y: (6 + g.menu) * 8, tile: A.s('CUR'), pal: 3 });
    for (i = slot; i < 48; i++) ppu0.sprite(i, null);
  }

  /* ============================== 機器人（?bot=1）==============================
   * 只從「展示當下的畫面 / 聲音」讀序列：
   *   看 = 讀 PPU 目前四組 BG 調色盤（哪顆星標正在亮、是 LIT 還是 LIT2）——就是螢幕上看得到的東西；
   *   聽 = EAR 模式改讀 APU 驅動 p1 聲道目前的音高（midi → 哪顆星標），等於「聽音辨位」。
   * 從不讀 g.seq。輸入時有人類延遲：進入輸入後等 lag 幀（預設 14，?lag=N），每按一下之間也隔 lag 幀（最少 1 幀放開）。 */
  // 測試用防偷看：dev.guard(true) 之後開局的 g.seq 包成 Proxy，bot() 執行期間任何讀取都計數（應為 0）
  var guardOn = false, inBot = false, guardReads = 0;
  function guardWrap(arr) {
    return new Proxy(arr, { get: function (t, k) { if (inBot) guardReads++; return t[k]; } });
  }
  var bm = null;
  function botReset() { bm = { t: 0, mem: [], prev: -1, prevSnd: false, inPhase: '', q: [], wait: 0, idx: 0, lag: 14 }; var l = parseInt((CT.query && CT.query('lag')) || '', 10); if (isFinite(l) && l >= 0) bm.lag = l; }
  var MIDI2K = null;
  function seeLit() {
    for (var i = 0; i < 4; i++) {
      var p = ppu0.getBgPalette(i);
      if (p[2] === LIT[i][1] && p[1] === LIT[i][0]) return i;
      if (p[2] === LIT2[i][1] && p[1] === LIT2[i][0]) return i + 4;
    }
    return -1;
  }
  // 「聽」：讀 APU 方波 1 的實際輸出（timer 週期 → 頻率 → 最近的半音）。遊玩 BGM 不用 p1，所以 p1 有聲 = 鍵音。
  function hearTone() {
    if (!MIDI2K) { MIDI2K = {}; Au.KEYS.forEach(function (K, k) { MIDI2K[K.midi] = k; if (K.shimmer) MIDI2K[K.midi + 12] = k; }); }
    var apu = nes0.apu, st = apu && apu.state && apu.state();
    if (!st) return -1;
    var p = st.pulse1;
    if (!p.enabled || p.muted || !(p.volume > 0) || !(p.length > 0)) return -1;
    var f = 1789773 / (16 * (p.timer + 1)), m = Math.round(69 + 12 * Math.log(f / 440) / Math.LN2);
    var k = MIDI2K[m];
    return k === undefined ? -1 : k;
  }
  function bot() {
    if (!bm) botReset();
    bm.t++;
    if (g.mode === 'title') {
      var want0 = parseInt((CT.query && CT.query('mode')) || '0', 10) || 0;
      if (g.menu !== want0) return (bm.t & 7) === 0 ? BTN.DOWN : 0;
      return (bm.t & 15) === 0 ? BTN.START : 0;
    }
    if (g.paused) return (bm.t & 15) === 0 ? BTN.START : 0;
    if (g.phase === 'over') return (!g.goal && (bm.t & 31) === 0) ? BTN.A : 0;
    var ph = g.phase;      // 畫面核心字（WATCH / LISTEN / PLAY …）
    if (ph !== bm.inPhase) {
      if (ph === 'intro') { bm.mem = []; bm.prev = -1; bm.prevSnd = -1; }
      if (ph === 'input') { bm.wait = bm.lag; bm.idx = 0; bm.q = []; }
      bm.inPhase = ph;
    }
    if (ph === 'show' || ph === 'intro') {
      var k = MODES[g.menu].light ? seeLit() : hearTone();
      if (k >= 0 && bm.prev < 0) bm.mem.push(k);      // 亮起 / 響起的那一刻（上升緣）記一顆
      bm.prev = k;
      return 0;
    }
    if (ph === 'input') {
      if (bm.q.length) return bm.q.shift();
      if (bm.wait > 0) { bm.wait--; return 0; }
      var order = g.m.rev ? bm.mem.slice().reverse() : bm.mem;
      if (bm.idx >= order.length) return 0;
      var kk = order[bm.idx++], d = DIR_BTN[kk & 3];
      if (kk >= 4) bm.q = [BTN.B, BTN.B | d, 0];
      else bm.q = [d, 0];
      bm.wait = Math.max(0, bm.lag - 1);
      return bm.q.shift();
    }
    return 0;
  }

  /* ============================== 密技 ============================== */
  // 遊玩中：命 +1（上限 5）；GAME OVER：原地續關（同一步數、命補回 3）。標題無效；用過密技 goal() 一律 false。
  function cheat() {
    if (!g || g.mode !== 'play') return false;
    g.cheats++; g.goal = false;
    if (g.phase === 'over') {
      g.lives = LIVES; g.continues++; g.replayUsed = false;
      g.msg = 'CONTINUE'; g.msgT = 60;
      Au.stop(); Au.play('simon_play');
      setPhase('intro');
    } else {
      g.lives = Math.min(MAX_LIVES, g.lives + 1);
      g.msg = 'EXTRA LIFE'; g.msgT = 60;
    }
    sfx('simon_good');
    return true;
  }

  /* ============================== 註冊 ============================== */
  var GAME = {
    id: 'simon', order: 2, title: '星塵跟我做', legacy: ['memory-simon.html', 'sound-simon.html', 'color-sequence-memory.html', 'tap-sequence.html'],
    init: function (nes, opt) {
      nes0 = nes; ppu0 = nes.ppu;
      A = SM.Art.make(); Au = SM.Audio;
      NES.CHR.setPattern(0, 'simon_bg');
      NES.CHR.setPattern(1, 'simon_spr');
      ppu0.setPatternTables(0, 1);
      ppu0.spriteMode(8);
      ppu0.flicker = 'none';
      g = newState(); bm = null;
      Au.init(nes);
      var q = CT.query || function () { return null; };
      var mq = parseInt(q('mode') || '', 10);
      if (mq >= 0 && mq < MODES.length) g.menu = mq;
      drawTitleScreen();
      Au.play('simon_title');
      if (q('autostart') === '1') startGame();
    },
    update: function (nes) {
      g.frames++;
      if (g.mode === 'title') updateTitle();
      else updatePlay();
      Au.tick();
    },
    draw: function (nes) {
      if (g.mode === 'title') drawTitleValues();
      else renderPlay();
      setPalettes(false);
      flush(ppu0, false);
      drawSprites();
    },
    exit: function (nes) { saveBest(); Au.stop(); },
    get backTile() { if (!A) A = SM.Art.make(); return { tile: A.s('DOT'), pal: 0 }; },
    state: function () {
      if (!g) return null;
      return {
        mode: g.mode, gameMode: g.m.id, menu: g.menu, phase: g.phase, pt: g.pt, len: g.len, pos: g.pos, showI: g.showI,
        lit: g.lit, litVis: g.litVis, lives: g.lives, score: g.score, best: g.best, maxDone: g.maxDone,
        replayUsed: g.replayUsed, replays: g.replays, misses: g.misses, idle: g.idle, goal: g.goal, cleared15: g.cleared15,
        cheats: g.cheats, continues: g.continues, paused: g.paused, msg: g.msgT > 0 ? g.msg : '', bheld: g.bheld,
        music: Au.current, lastSfx: Au.lastSfx, lastTone: Au.lastTone, toneCount: Au.toneCount,
        queue: pending(), ntWrites: ntWrites, ntPeak: ntPeak, frames: g.frames, seed: g.seed
      };
    },
    cheat: cheat,
    bot: function () { if (!g) return 0; inBot = true; try { return bot(); } finally { inBot = false; } },
    goal: function () { return !!(g && g.goal && g.cheats === 0); },
    bestText: function () { return num(Math.min(99, CT.load('simon', 'best', 0)), 2) + 'STEP'; }
  };

  // 測試鉤子（只讀寫本遊戲狀態；機器人不用）
  SM.dev = {
    start: function (mode, seed) { g.menu = mode || 0; var s0 = CT.query; CT.query = function (k) { return k === 'seed' ? String(seed || 77) : (s0 ? s0(k) : null); }; startGame(); CT.query = s0; },
    seq: function () { return g.seq.slice(0, g.len); },
    setLen: function (n) { g.len = n; g.maxDone = n - 1; },
    phase: function (p) { setPhase(p); },
    press: function (k) { press(k); },
    timing: showTiming, expect: function () { return expectKey(); },
    consts: { GOAL_LEN: GOAL_LEN, INPUT_TIMEOUT: INPUT_TIMEOUT, LIVES: LIVES, READY_F: READY_F, INTRO_F: INTRO_F, NT_LIMIT: NT_LIMIT },
    guard: function (on) { guardOn = !!on; guardReads = 0; }, guardReads: function () { return guardReads; },
    pending: pending, rank: rankOf, seeLit: function () { return seeLit(); }, hear: function () { return hearTone(); },
    flushAll: function () { CT.blank(nes0, function () { flush(ppu0, true); }); }
  };

  if (CT.register) CT.register(GAME);
  SM.GAME = GAME;
})();

</script>
<script>/* games/cart4/tune/art.js */
/*
 * games/cart4/tune/art.js — 《星塵旋律 STAR MELODY》CHR（全部原創，程式化點陣）
 * ---------------------------------------------------------------------------
 * 擁有者：C8-2 cart4-sound（R8）｜ 依賴：engine/chr.js（字身沿用原創 DEMO.FONT）
 *
 * 鍵盤不是鋼琴黑白鍵：是一排從星軌上垂下的 8 根「星鐘管」（風鈴 / 鐘琴管，越低音越長），管底掛一顆小星；
 * 每根 16 px 寬 = 1 個屬性區塊寬 ⇒ 亮燈 = 把那根管子的屬性區塊改成「亮」調色盤（每次 5 byte）。
 * 背景磚（tune_bg）：字型 F_*、管子 KT_L/R（頂）KB_L/R（身）KE_L/R（底 + 星）、星軌 RAIL、
 *   時間軸 NH（音頭）NL（延音線）NX（錯）NQ（?）DOT8（節奏點）、小箭頭 AU/AD/AL/AR、大字 BIG_*、星點 ST1/ST2、愛心用字型 ^。
 * 精靈（tune_spr）：NOTE ♪（亮鍵上方飄起）、MK1/MK2 聽音辨高低的兩顆音標、CUR 游標、DOT 回選單提示。
 */
(function () {
  'use strict';
  var NES = window.NES = window.NES || {};
  var CT = window.CT = window.CT || {};
  var TN = CT.Tune = CT.Tune || {};
  var CHR = NES.CHR;
  var FONT = (CHR && CHR.DEMO && CHR.DEMO.FONT) || {};
  var CHARMAP = (CHR && CHR.DEMO && CHR.DEMO.CHARMAP) || {};

  function canvas(w, h) { var a = []; for (var y = 0; y < h; y++) { a.push([]); for (var x = 0; x < w; x++) a[y].push(0); } return a; }
  function slice(px) {
    var h = px.length, w = px[0].length, out = [];
    for (var ty = 0; ty < h / 8; ty++) for (var tx = 0; tx < w / 8; tx++) {
      var t = new Uint8Array(64);

    add('NH', ['........', '..222...', '.23332..', '.23332..', '.23332..', '..222...', '........', '........']);
    add('NL', ['........', '........', '........', '22222222', '22222222', '........', '........', '........']);
    add('NX', ['........', '.3...3..', '..3.3...', '...3....', '..3.3...', '.3...3..', '........', '........']);
    add('NQ', ['........', '..111...', '.1...1..', '....1...', '...1....', '........', '...1....', '........']);
    add('DOT8', ['........', '........', '...3....', '..333...', '...3....', '........', '........', '........']);
    add('GRID', ['........', '........', '........', '........', '1.......', '........', '........', '........']);
    add('AU', ['...3....', '..333...', '.33333..', '...3....', '...3....', '...3....', '........', '........']);
    add('AD', ['...3....', '...3....', '...3....', '.33333..', '..333...', '...3....', '........', '........']);
    add('AL', ['........', '..3.....', '.33.....', '3333333.', '.33.....', '..3.....', '........', '........']);
    add('AR', ['........', '....3...', '....33..', '3333333.', '....33..', '....3...', '........', '........']);
    add('ST1', ['........', '........', '........', '....1...', '........', '........', '........', '........']);
    add('ST2', ['........', '.3......', '........', '........', '........', '........', '......1.', '........']);
    add('BAR', ['........', '........', '33333333', '3......3', '3......3', '33333333', '........', '........']);
    add('BARF', ['........', '........', '33333333', '33333333', '33333333', '33333333', '........', '........']);
    'MELODYSTAR'.split('').forEach(function (ch) { slice(bigGlyph(FONT[CHARMAP[ch]])).forEach(function (t, jj) { add('BIG_' + ch + jj, t); }); });

    SPR.MK1 = rowsToTile(['........', '.3333...', '322223..', '321123..', '322223..', '.3333...', '........', '........']);
    SPR.MK2 = rowsToTile(['...3....', '..323...', '.32123..', '3211123.', '.32123..', '..323...', '...3....', '........']);
    SPR.CUR = rowsToTile(['...3....', '..333...', '.33333..', '3333333.', '........', '........', '........', '........']);
    SPR.DOT = rowsToTile(['...3....', '..333...', '3333333.', '.33333..', '..333...', '.33.33..', '.3...3..', '........']);
    SPR.LINE = rowsToTile(['........', '........', '........', '22222222', '........', '........', '........', '........']);

    function T(nmm) { var a = alias[nmm] || nmm; return bg.index(a); }

      bg: bg, spr: spr, alias: alias, t: T,
      s: function (nmm) { return spr.index(nmm); },
      ch: function (c) {

    return made;
  }
  TN.Art = { make: function () { return made || build(); } };
})();

<script>/* games/cart4/tune/song.js */
/*
 * games/cart4/tune/song.js — 《星塵旋律 STAR MELODY》音樂 / 音效（全部原創，只走 2A03）

 * | tune_beat  | 節拍星   | 12    | 輸入時的節拍器（只有 tri + noi；main.js 依關卡改 speed 另建） |

 * | tune_over  | 餘音     | 9     | GAME OVER（不 loop） |
 * | tune_demo  | 示範句   | 12    | `phrase()` 產生的範例題（給 apu_render 離線驗證題目格式） |

      'E-6 -   D-6 -   C-6 -   A-5 -   F-5 -   -   -   A-5 -   G-5 -   -   -',

      p2: mel('C-6 -   B-5 -   G-5 -   F-5 -   E-5 -   -   -   =   -   -   -', 'soft', 6, 1),

      if (g.m.id === 'replay' && g.lv >= GOAL_LV && g.cheats === 0) g.goal = true;
      setPhase('lvup');
      Au.playSong(Au.SONGS.tune_clear, 'tune_clear');
    } else setPhase('good');
  }
  function failQ(msg) {
    g.misses++; g.lives--;
    g.msg = msg; g.msgT = MISS_F;
    Au.stop();
    sfx('tune_miss');
    g.litKey = -1;
    setPhase('miss');
    // 答案揭曉（時間軸上畫出正解）
    if (g.m.id === 'replay') { tlClear(); g.cur.events.forEach(function (e) { tlNote(e.row - 8, e.k, e.dur, true); }); }
    if (g.m.id === 'highlow') { g.mk = [{ midi: g.cur.m1, show: true }, { midi: g.cur.m2, show: true }]; }
  }
  function gameOver() {
    setPhase('over');
    saveBest();
    Au.stop(); Au.play('tune_over');
  }
  function saveBest() {
    if (!g || g.mode !== 'play') return;
    if (g.lvDone > CT.load('tune', g.m.key, 0)) CT.save('tune', g.m.key, g.lvDone);
    if (g.score > CT.load('tune', g.m.key + '_sc', 0)) CT.save('tune', g.m.key + '_sc', g.score);
  }

  function held(b) { return NES.Input.held(b); }
  function pressed(b) { return NES.Input.pressed(b); }
  function dirPressed() {
    if (pressed(BTN.LEFT)) return 'L';
    if (pressed(BTN.DOWN)) return 'D';
    if (pressed(BTN.UP)) return 'U';
    if (pressed(BTN.RIGHT)) return 'R';
    return null;
  }
  function keyFromDir(d) { return KEY_DIR.indexOf(d) + (held(BTN.B) ? 4 : 0); }

  function updateTitle() {
    g.blink++;
    if (pressed(BTN.UP)) { g.menu = (g.menu + MODES.length - 1) % MODES.length; sfx('tune_menu'); }
    if (pressed(BTN.DOWN)) { g.menu = (g.menu + 1) % MODES.length; sfx('tune_menu'); }
    if (pressed(BTN.LEFT) || pressed(BTN.RIGHT)) { g.hint = !g.hint; sfx('tune_menu'); }
    if ((pressed(BTN.START) && !held(BTN.SELECT)) || pressed(BTN.A)) { sfx('tune_ok'); startGame(); }
  }
  function updatePlay() {
    if (pressed(BTN.START) && !held(BTN.SELECT) && g.phase !== 'over') {
      g.paused = !g.paused;
      if (g.paused) Au.pause(); else Au.resume();
      sfx('tune_menu');
    }
    if (g.paused) return;
    if (g.msgT > 0) g.msgT--;
    if (g.keyLitT > 0 && --g.keyLitT === 0 && g.phase !== 'listen') g.litKey = -1;
    g.pt++;
    var d;
    switch (g.phase) {
      case 'ready':
        if (g.pt === 1 || g.pt === 30 || g.pt === 60 || g.pt === 90) sfx('tune_tick');
        if (g.pt >= READY_F) newQuestion();
        break;
      case 'prep': updatePrep(); break;
      case 'listen': updateListen(); break;
      case 'input':
        if (g.judgeWait > 0) { if (--g.judgeWait === 0) finishReplay(); break; }
        if (pressed(BTN.SELECT)) { again(); break; }
        d = dirPressed();
        if (d) { inputKey(keyFromDir(d)); break; }
        if (++g.idle >= INPUT_TIMEOUT) failQ('TIME UP');
        break;
      case 'answer':
        if (pressed(BTN.SELECT)) { again(); break; }
        d = dirPressed();
        if (d === 'U' || d === 'D' || (d === 'R' && g.cur.same)) {
          g.answer = d;
          g.mk = [{ midi: g.cur.m1, show: true }, { midi: g.cur.m2, show: true }];
          if (d === g.cur.ans) passQ(10 * g.lv * (g.hint ? 1 : 2), d === 'R' ? 'SAME - RIGHT!' : (d === 'U' ? 'HIGHER - RIGHT!' : 'LOWER - RIGHT!'), false);
          else failQ('NO - IT WAS ' + (g.cur.ans === 'U' ? 'HIGHER' : (g.cur.ans === 'D' ? 'LOWER' : 'THE SAME')));
          break;
        }
        if (++g.idle >= INPUT_TIMEOUT) failQ('TIME UP');
        break;
      case 'pick':
        if (pressed(BTN.SELECT)) { again(); break; }
        if (pressed(BTN.LEFT)) { g.cursor = (g.cursor + g.cur.notes.length - 1) % g.cur.notes.length; sfx('tune_move'); }
        if (pressed(BTN.RIGHT)) { g.cursor = (g.cursor + 1) % g.cur.notes.length; sfx('tune_move'); }
        if (pressed(BTN.A)) {
          g.answer = g.cursor;
          if (g.cursor === g.cur.odd) passQ(20 * g.lv * (g.hint ? 1 : 2), 'NOTE ' + (g.cur.odd + 1) + ' - RIGHT!', false);
          else failQ('IT WAS NOTE ' + (g.cur.odd + 1));
          break;
        }
        if (++g.idle >= INPUT_TIMEOUT) failQ('TIME UP');
        break;
      case 'good':
        if (g.pt >= GOOD_F) newQuestion();
        break;
      case 'lvup':
        if (g.pt >= LVUP_F) {
          if (g.lv >= MAX_LV) { g.msg = 'ALL 8 LEVELS CLEAR!'; g.msgT = 9999; gameOver(); break; }
          g.lv++; g.q = 0; newQuestion();
        }
        break;
      case 'miss':
        if (g.pt >= MISS_F) {
          if (g.lives <= 0) gameOver();
          else if (g.m.id === 'replay') { g.againUsed = false; beginListen(); }   // 同一題重聽
          else newQuestion();
        }
        break;
      case 'over':
        if (pressed(BTN.A) || (pressed(BTN.START) && !held(BTN.SELECT))) toTitle();
        break;
    }
  }

  /* ============================== 畫面 ============================== */
  function setPalettes() {
    ppu0.setBackdrop(0x0F);
    for (var i = 0; i < 4; i++) { ppu0.setBgPalette(i, PAL_BG[i]); ppu0.setSprPalette(i, PAL_SPR[i]); }
  }
  function stars(seed, count, avoid) {
    var s = seed, i;
    for (i = 0; i < count; i++) {
      s = (Math.imul(s, 1103515245) + 12345) & 0x7FFFFFFF;
      var c = (s >> 10) & 31, r = 1 + ((s >> 16) % 28);
      if (avoid && avoid(c, r)) continue;
      put(c, r, A.t((s >> 4) & 1 ? 'ST1' : 'ST2'));
    }
  }
  function bigText(c, r, s) {
    for (var i = 0; i < s.length; i++) {
      var ch = s.charAt(i);
      if (ch === ' ') continue;
      for (var j = 0; j < 4; j++) put(c + i * 2 + (j & 1), r + (j >> 1), A.t('BIG_' + ch + j));
    }
  }
  function blankAll() { ntReset(); ppu0.fillTiles(0, 0, 0, 32, 30, 0); ppu0.fillAttr(0, 0, 0, 16, 15, 0); setPalettes(); }
  // 星鐘管 + 唱名 + 方向 / B 標示（r0 = 管頂列）
  function drawKeyboard(r0) {
    for (var c = KEY_C0 - 2; c < KEY_C0 + 18; c++) put(c, r0 - 1, A.t('RAIL'));
    for (var k = 0; k < 8; k++) {
      var c0 = KEY_C0 + 2 * k, h = TUBE_H[k];
      for (var y = 0; y < h; y++) {
        var nm = y === 0 ? 'KT' : (y === h - 1 ? 'KE' : 'KB');
        put(c0, r0 + y, A.t(nm + '_L')); put(c0 + 1, r0 + y, A.t(nm + '_R'));
      }
      text(c0, r0 + 10 + (k & 1), SOLFA[k]);              // 唱名上下交錯兩列（兩字一組才不會黏在一起）
      put(c0, r0 + 12, A.t(ARROW[KEY_DIR[k & 3]]));
      put(c0 + 1, r0 + 12, k >= 4 ? A.ch('B') : 0);
    }
    keyAttrs(r0, -1);
  }
  function keyAttrs(r0, lit) {
    for (var k = 0; k < 8; k++) for (var by = r0 >> 1; by < (r0 >> 1) + 5; by++) putA((KEY_C0 >> 1) + k, by, k === lit ? 3 : (k < 4 ? 1 : 2));
  }
  function tlClear() { for (var r = TL_R0; r < TL_R0 + 8; r++) for (var c = TL_C0; c < TL_C0 + TL_W; c++) put(c, r, 0); }
  function tlNote(col, k, dur, pitched) {
    if (col < 0 || col >= TL_W) return;
    var row = (pitched && k >= 0) ? TL_R0 + 7 - k : TL_R0 + 4;
    put(TL_C0 + col, row, A.t(pitched && k >= 0 ? 'NH' : 'DOT8'));
    for (var i = 1; i < dur && col + i < TL_W; i++) put(TL_C0 + col + i, row, A.t('NL'));
  }

  function drawTitleScreen() {
    blankAll();
    stars(41, 60, function (c, r) { return r >= 3 && r <= 28; });
    bigText(5, 1, 'STAR');
    bigText(15, 1, 'MELODY');
    text(4, 11, 'START PAUSE  C/$ = CHEAT');
    text(4, 12, 'HOLD START+SELECT: MENU');
    drawKeyboard(TUBE_R0);
    text(1, 24, 'NOTE'); text(1, 26, 'KEY');
    text(26, 26, 'B=HOLD');
    flush(ppu0, true);
    drawTitleValues();
    flush(ppu0, true);
  }
  function drawTitleValues() {
    for (var i = 0; i < MODES.length; i++) {
      var m = MODES[i];
      text(6, 4 + i, pad(m.name, 9));
      text(17, 4 + i, 'BEST LV' + num(CT.load('tune', m.key, 0), 2));
    }
    text(6, 8, pad(MODES[g.menu].desc[0], 24));
    text(6, 9, pad(MODES[g.menu].desc[1], 24));
    text(2, 27, (g.blink >> 5) & 1 ? pad('', 10) : 'PUSH START');
    text(14, 27, (g.hint ? 'HINT ON ' : 'HINT OFF') + ' (L/R)');
  }

  function drawPlayScreen() {
    blankAll();
    text(2, 1, 'STAR MELODY');
    text(2, TL_R0, 'HI'); text(2, TL_R0 + 7, 'LO');
    drawKeyboard(TUBE_R0);
    renderPlay();
    flush(ppu0, true);
  }
  function statusText() {
    if (g.paused) return ['PAUSED', 'HOLD START+SELECT: MENU'];
    if (g.msgT > 0 && g.msg && (g.phase === 'good' || g.phase === 'miss' || g.phase === 'lvup' || g.phase === 'over' || g.msgT < 9999)) {
      var second = g.phase === 'lvup' ? 'LEVEL ' + g.lv + ' CLEAR!' : (g.phase === 'over' ? 'A TITLE  $ CONTINUE' : '');
      return [g.msg, second];
    }
    var hintW = g.hint ? '' : ' (EAR)';
    switch (g.phase) {
      case 'ready': return ['GET READY ' + (g.pt < 30 ? '' : Math.max(1, 3 - Math.floor((g.pt - 30) / 30))), g.hint ? 'WATCH THE CHIMES GLOW' : 'NO LIGHTS - EARS ONLY'];
      case 'prep': return ['LISTEN...' + hintW, ''];
      case 'listen':
        if (g.m.id === 'odd') return [g.part === 'B' ? 'SECOND - WITH ONE CHANGE' : 'FIRST - THE ORIGINAL', ''];
        if (g.m.id === 'highlow') return ['NOTE ' + (g.mk[1] ? 2 : 1) + hintW, ''];
        return ['LISTEN...' + hintW, ''];
      case 'input': return ['YOUR TURN  ' + g.inp.keys.length + '/' + g.cur.notes.length + (g.cur.rh ? '  KEEP RHYTHM' : ''), g.againUsed ? '' : 'SELECT = HEAR AGAIN'];
      case 'answer': return ['UP HIGHER  DOWN LOWER' + (g.cur.same ? '' : ''), g.cur.same ? 'RIGHT = SAME  SEL AGAIN' : 'SELECT = HEAR AGAIN'];
      case 'pick': return ['WHICH NOTE CHANGED?', '<> MOVE  A PICK  SEL AGAIN'];
      case 'over': return ['GAME OVER  LV ' + g.lvDone + ' CLEAR', 'A TITLE  $ CONTINUE'];
    }
    return ['', ''];
  }
  function renderPlay() {
    text(14, 1, pad(g.m.name, 9));
    text(24, 1, g.hint ? '    ' : ' EAR');
    text(2, 2, 'LV' + num(g.lv, 1) + ' Q' + Math.min(g.q + 1, 9) + '/' + (g.m.id === 'replay' ? PER_LV : (g.m.id === 'highlow' ? HL_PER : ODD_PER)));
    text(12, 2, 'SC' + num(g.score, 6));
    for (var i = 0; i < MAX_LIVES; i++) put(24 + i, 2, i < g.lives ? A.t('F_HEART') : 0);
    var st = statusText();
    text(2, 27, pad(st[0], 28)); text(2, 28, pad(st[1], 28));
    keyAttrs(TUBE_R0, g.paused ? -1 : g.litKey);
  }

  function drawSprites() {
    var slot = 0, i;
    if (g.mode === 'play' && !g.paused) {
      if (g.litKey >= 0) {
        var x = (KEY_C0 + 2 * g.litKey) * 8 + 4, y = TUBE_R0 * 8 - 12 - ((g.frames >> 2) & 3);
        ppu0.sprite(slot++, { x: x, y: y, tile: A.s('NOTE'), pal: 0 });
      }
      if (g.m.id === 'highlow') {
        for (i = 0; i < 2; i++) {
          var mk = g.mk[i];
          if (!mk) continue;
          var yy = (g.hint || mk.show) ? 92 - (((mk.midi - 58) * 5) >> 1) : 60;
          ppu0.sprite(slot++, { x: i ? 168 : 80, y: Math.max(28, Math.min(92, yy)), tile: A.s(i ? 'MK2' : 'MK1'), pal: i ? 2 : 1 });
        }
      }
      if (g.phase === 'pick') {
        var ev = g.cur.events[g.cur.notes.length + g.cursor];
        ppu0.sprite(slot++, { x: (TL_C0 + ev.row - g.cur.bStart) * 8, y: (TL_R0 + 8) * 8, tile: A.s('CUR'), pal: 3 });
      }
    }
    if (g.mode === 'title') ppu0.sprite(slot++, { x: 4 * 8, y: (4 + g.menu) * 8, tile: A.s('NOTE'), pal: 0 });
    for (i = slot; i < 48; i++) ppu0.sprite(i, null);
  }

  /* ============================== 機器人（?bot=1）==============================
   * 只從「播放當下的畫面 / 聲音」讀題：
   *   HINT ON：讀 PPU 屬性表——哪根星鐘管是「亮」調色盤（= 螢幕上看得到的那根）；
   *   HINT OFF / 聽音辨高低 / 找錯音：讀 APU 方波 1 的實際週期 → 頻率 → 最近的半音（= 用耳朵聽音高）。
   * 記下每個音「亮起 / 響起」的那一幀，彈回去時照著同樣的音距（加 ±2 幀人手誤差）；進入輸入後先等 lag 幀（預設 14）。 */
  // 測試用防偷看：dev.guard(true) 之後的題目物件（音符 / 答案 / 事件表）包成 Proxy，bot() 執行期間讀取次數應為 0
  var guardOn = false, inBot = false, guardReads = 0;
  function guardWrap(obj) {
    return new Proxy(obj, { get: function (t, k) { if (inBot) guardReads++; return t[k]; } });
  }
  var bm = null;
  function botReset() {
    bm = { t: 0, rec: [], prev: -1, inPhase: '', plan: null, wait: 0, lag: 14, part: '' };
    var l = parseInt((CT.query && CT.query('lag')) || '', 10); if (isFinite(l) && l >= 0) bm.lag = l;
  }
  function seeKey() {
    for (var k = 0; k < 8; k++) if (ppu0.getAttr(0, (KEY_C0 >> 1) + k, TUBE_R0 >> 1) === 3) return k;
    return -1;
  }
  function hearMidi() {
    var st = nes0.apu && nes0.apu.state && nes0.apu.state();
    if (!st) return -1;
    var p = st.pulse1;
    if (!p.enabled || p.muted || !(p.volume > 0) || !(p.length > 0)) return -1;
    var f = 1789773 / (16 * (p.timer + 1));
    return Math.round(69 + 12 * Math.log(f / 440) / Math.LN2);
  }
  function bot() {
    if (!bm) botReset();
    bm.t++;
    if (g.mode === 'title') {
      var want0 = parseInt((CT.query && CT.query('mode')) || '0', 10) || 0;
      if (g.menu !== want0) return (bm.t & 7) === 0 ? BTN.DOWN : 0;
      var wantHint = (CT.query && CT.query('hint')) !== '0';
      if (g.hint !== wantHint) return (bm.t & 7) === 0 ? BTN.RIGHT : 0;
      return (bm.t & 15) === 0 ? BTN.START : 0;
    }
    if (g.paused) return (bm.t & 15) === 0 ? BTN.START : 0;
    if (g.phase === 'over') return (!g.goal && (bm.t & 31) === 0) ? BTN.A : 0;
    var ph = g.phase;
    if (ph !== bm.inPhase) {
      if (ph === 'prep') { bm.rec = []; bm.prev = -1; }
      if (ph === 'input' || ph === 'answer' || ph === 'pick') { bm.wait = bm.lag; bm.plan = null; }
      bm.inPhase = ph;
    }
    if (ph === 'listen' || ph === 'prep') {
      var midi = hearMidi(), seen = (g.hint && g.m.id !== 'highlow') ? seeKey() : -2;
      var on = seen === -2 ? midi >= 0 : seen >= 0;
      if (on && bm.prev < 0) {
        var k = seen >= 0 ? seen : Au.SCALE.indexOf(midi);
        bm.rec.push({ k: k, midi: midi, f: bm.t, part: g.part });
      }
      bm.prev = on ? 1 : -1;
      return 0;
    }
    if (ph === 'input') {
      if (!bm.plan) {
        if (bm.wait > 0) { bm.wait--; return 0; }
        bm.plan = []; var t0 = bm.t;
        bm.rec.forEach(function (r, i) {
          var at = t0 + 1 + (r.f - bm.rec[0].f) + (i ? ((i * 7) % 5) - 2 : 0), d = DIR_BTN[KEY_DIR[r.k & 3]];
          if (r.k >= 4) { bm.plan.push([at - 1, BTN.B]); bm.plan.push([at, BTN.B | d]); }
          else bm.plan.push([at, d]);
        });
      }
      while (bm.plan.length && bm.plan[0][0] < bm.t) bm.plan.shift();
      if (bm.plan.length && bm.plan[0][0] === bm.t) return bm.plan.shift()[1];
      return 0;
    }
    if (ph === 'answer') {
      if (bm.wait > 0) { bm.wait--; return 0; }
      if (bm.rec.length < 2) return 0;
      bm.wait = 999;
      var m1 = bm.rec[0].midi, m2 = bm.rec[1].midi;
      return m2 > m1 ? BTN.UP : (m2 < m1 ? BTN.DOWN : BTN.RIGHT);
    }
    if (ph === 'pick') {
      if (bm.wait > 0) { bm.wait--; return 0; }
      var a = bm.rec.filter(function (r) { return r.part === 'A'; }), b = bm.rec.filter(function (r) { return r.part === 'B'; });
      var tgt = 0;
      for (var i = 0; i < Math.min(a.length, b.length); i++) if (a[i].midi !== b[i].midi) { tgt = i; break; }
      bm.wait = Math.max(1, bm.lag >> 1);
      if (g.cursor < tgt) return BTN.RIGHT;
      if (g.cursor > tgt) return BTN.LEFT;
      bm.wait = 999;
      return BTN.A;
    }
    return 0;
  }

  /* ============================== 密技 ============================== */
  // 遊玩中：命 +1（上限 5）；GAME OVER：原地續關（同一級同一題、命補回 3）。標題無效；用過密技 goal() 一律 false。
  function cheat() {
    if (!g || g.mode !== 'play') return false;
    g.cheats++; g.goal = false;
    if (g.phase === 'over') {
      g.lives = LIVES; g.continues++;
      if (g.lv > MAX_LV) g.lv = MAX_LV;
      g.msg = 'CONTINUE'; g.msgT = 50;
      Au.stop();
      if (g.cur && g.m.id === 'replay') { g.againUsed = false; beginListen(); } else newQuestion();
    } else {
      g.lives = Math.min(MAX_LIVES, g.lives + 1);
      g.msg = 'EXTRA LIFE'; g.msgT = 50;
    }
    sfx('tune_good');
    return true;
  }

  /* ============================== 註冊 ============================== */
  var GAME = {
    id: 'tune', order: 4, title: '星塵旋律', legacy: ['music-memory.html', 'music-memory-enhanced.html'],
    init: function (nes, opt) {
      nes0 = nes; ppu0 = nes.ppu;
      A = TN.Art.make(); Au = TN.Audio;
      NES.CHR.setPattern(0, 'tune_bg');
      NES.CHR.setPattern(1, 'tune_spr');
      ppu0.setPatternTables(0, 1);
      ppu0.spriteMode(8);
      ppu0.flicker = 'none';
      g = newState(); bm = null;
      Au.init(nes);
      var q = CT.query || function () { return null; };
      var mq = parseInt(q('mode') || '', 10);
      if (mq >= 0 && mq < MODES.length) g.menu = mq;
      if (q('hint') === '0') g.hint = false;
      drawTitleScreen();
      Au.play('tune_title');
      if (q('autostart') === '1') startGame();
    },
    update: function (nes) {
      g.frames++;
      if (g.mode === 'title') updateTitle();
      else updatePlay();
      Au.tick();
    },
    draw: function (nes) {
      if (g.mode === 'title') drawTitleValues();
      else { if (g.phase === 'listen' && !g.paused) updateListenLit(); renderPlay(); }
      flush(ppu0, false);
      drawSprites();
    },
    exit: function (nes) { saveBest(); Au.stop(); },
    get backTile() { if (!A) A = TN.Art.make(); return { tile: A.s('DOT'), pal: 0 }; },
    state: function () {
      if (!g) return null;
      return {
        mode: g.mode, gameMode: g.m.id, menu: g.menu, hint: g.hint, phase: g.phase, pt: g.pt, lv: g.lv, q: g.q,
        lives: g.lives, score: g.score, best: g.best, lvDone: g.lvDone, misses: g.misses, agains: g.agains, againUsed: g.againUsed,
        perfects: g.perfects, idle: g.idle, goal: g.goal, cheats: g.cheats, continues: g.continues, paused: g.paused,
        msg: g.msgT > 0 ? g.msg : '', litKey: g.litKey, part: g.part, cursor: g.cursor, onsets: g.onsets,
        entered: g.inp ? g.inp.keys.length : 0, judge: g.lastJudge, music: Au.current, lastSfx: Au.lastSfx, lastKey: Au.lastKey,
        keyCount: Au.keyCount, queue: pending(), ntWrites: ntWrites, ntPeak: ntPeak, frames: g.frames, seed: g.seed
      };
    },
    cheat: cheat,
    bot: function () { if (!g) return 0; inBot = true; try { return bot(); } finally { inBot = false; } },
    goal: function () { return !!(g && g.goal && g.cheats === 0); },
    bestText: function () { return '  LV' + num(Math.min(99, CT.load('tune', 'best', 0)), 2); }
  };
  // 亮鍵在 draw 前依 driver 位置重算一次（update 末尾才 tick ⇒ draw 時的 row 就是這一幀正在響的音）
  function updateListenLit() {
    var si = sounding();

    disc(px, 16, 16, 2.2, 3);
    [[7, 7], [24, 7], [7, 24], [24, 24]].forEach(function (p) { rect(px, p[0], p[1], p[0] + 1, p[1] + 1, 3); });

  BG.ST1 = ['........', '........', '........', '....3...', '........', '........', '........', '........'];
  BG.ST2 = ['........', '.2......', '........', '........', '........', '........', '......2.', '........'];
  function add(prefix, tiles) { tiles.forEach(function (t, i) { BG[prefix + i] = t; }); }
  add('BK', slice(back()));
  add('HB', slice(half('back')));
  add('HF', slice(half('face')));
  add('ED', slice(edge()));
  add('FR', slice(frame(false)));

  var SPR = { SP: E8() };
  SPR.CUR = ['3333....', '3222....', '32......', '32......', '........', '........', '........', '........'];
  SPR.SPK = ['...3....', '...2....', '.32123..', '...2....', '...3....', '........', '........', '........'];
  SPR.DOT = ['........', '..33....', '.3223...', '.3223...', '..33....', '........', '........', '........'];
  SPR.ARW = ['........', '.33.....', '.3233...', '.322233.', '.3233...', '.33.....', '........', '........'];

  var made = null;
  CA.Art = {
    FACE_NAMES: FACE_NAMES, facePx: face,
    make: function () {

    }
  };
})();

<script>/* games/cart4/cards/main.js */
/*
 * games/cart4/cards/main.js — 《星塵翻牌 STAR CARDS》（合輯卡帶四 槽 1，id = cards）
 * ---------------------------------------------------------------------------
 * 擁有者：C8-1 cart4-memory（R8）｜ 依賴：cards/art.js、cards/song.js、games/cart1/registry.js

 *

 *   2 TIME ATTACK 限時：40 / 60 / 80 / 100 / 130 秒，配對成功 +2 秒，剩餘時間換分。
 *   3 VS PIPPO 對 CPU：6×5 盤（15 對 ⇒ 不會平手），你先翻；配對成功可以再翻、失敗換人。
 *       CPU「噗波 PIPPO」只記得**畫面上翻開過的牌**，記憶力 4 級可調：
 *       DOZY 記 2 張 / 每次想起 60%、NORMAL 5 張 / 80%、SHARP 10 張 / 94%、PERFECT 全記 / 100%。
 * 開局：發牌動畫（每 3 幀一張）+ READY 3·2·1（90 幀）才可以操作。翻牌動畫 5 格（牌背 → 半寬 → 側邊 → 半寬白面 → 牌面，每格 3 幀）。

 * 密技（C / ★）：遊玩中 = 經典 +5 步 / 限時 +20 秒 / VS 讓 PIPPO 全部忘光；GAME OVER = 原地續關（經典步數上限 = 已用 +10、
