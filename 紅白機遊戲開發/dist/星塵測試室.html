<!-- ===== engine（契約載入順序；缺檔不致命，nes.js 會用 stub 頂替） ===== -->
<script>/* engine/palette.js */
/*!
 * engine/palette.js — NES 系統調色盤（64 色 NTSC RGB 近似表）
 * 專案：紅白機遊戲開發 / R1 核心引擎 ｜ agent: ppu ｜ 版本 1.0.0（2026-09-17）
 *
 * 來源（RGB 值）：
 *   docs/research/01_硬體規格與限制.md §3.4「NES 系統調色盤（常用 RGB 近似值）」
 *   原始出處：ROM Detectives Wiki 的 2C02 調色盤表（即 FCEUX / Nestopia 常見的預設 RGB 近似）。
 *   注意：2C02 輸出的是 NTSC 複合訊號，沒有唯一正解的 RGB；本表僅為工作用近似值。
 *
 * 規格要點（docs/research/01 §3.4、05 §1.1）：
 *   - 索引為 6 bit（$00–$3F），編碼 `VVHHHH`：低 4 bit 色相、高 2 bit 亮度。
 *   - $0F 為標準黑；$0D 是「blacker than black」，官方警告不要用 → FORBIDDEN。
 *   - $0E/$0F/$1D/$1E/$1F/$2E/$2F/$3E/$3F 實質同為黑（去重後約 54 色）。
 *
 * API（docs/TASKS.md「API 契約」）：
 *   NES.PALETTE            → 長度 64 的陣列，每項 [r, g, b]
 *   NES.PALETTE.FORBIDDEN  → [0x0D]
 *   NES.PALETTE.rgb(i)     → [r, g, b]（複本；i 超出 0..63 會 throw）
 *   NES.PALETTE.nearest(r, g, b) → 最接近的調色盤索引（自動跳過 FORBIDDEN）
 *   附加（非契約，便利用）：hex(i)、isForbidden(i)、assert(i)、SIZE、VERSION
 */
(function (global) {
  'use strict';
  var NES = global.NES = global.NES || {};

  // 依 $00..$3F 順序排列的 24-bit RGB。
  var HEX = [
    0x7C7C7C, 0x0000FC, 0x0000BC, 0x4428BC, 0x940084, 0xA80020, 0xA81000, 0x881400,
    0x503000, 0x007800, 0x006800, 0x005800, 0x004058, 0x000000, 0x000000, 0x000000,
    0xBCBCBC, 0x0078F8, 0x0058F8, 0x6844FC, 0xD800CC, 0xE40058, 0xF83800, 0xE45C10,
    0xAC7C00, 0x00B800, 0x00A800, 0x00A844, 0x008888, 0x000000, 0x000000, 0x000000,
    0xF8F8F8, 0x3CBCFC, 0x6888FC, 0x9878F8, 0xF878F8, 0xF85898, 0xF87858, 0xFCA044,
    0xF8B800, 0xB8F818, 0x58D854, 0x58F898, 0x00E8D8, 0x787878, 0x000000, 0x000000,
    0xFCFCFC, 0xA4E4FC, 0xB8B8F8, 0xD8B8F8, 0xF8B8F8, 0xF8A4C0, 0xF0D0B0, 0xFCE0A8,
    0xF8D878, 0xD8F878, 0xB8F8B8, 0xB8F8D8, 0x00FCFC, 0xF8D8F8, 0x000000, 0x000000
  ];

  var PALETTE = [];
  for (var i = 0; i < 64; i++) {
    var h = HEX[i];
    PALETTE.push([(h >> 16) & 0xFF, (h >> 8) & 0xFF, h & 0xFF]);
  }

  PALETTE.VERSION = '1.0.0';
  PALETTE.SIZE = 64;
  PALETTE.SOURCE = 'ROM Detectives Wiki 2C02 palette (via docs/research/01 §3.4)';
  PALETTE.FORBIDDEN = [0x0D]; // $0D = blacker than black，禁用

  PALETTE.isForbidden = function (i) {
    return PALETTE.FORBIDDEN.indexOf(i | 0) >= 0;
  };

  // 驗證色號：非 0..63 整數或禁用色 → throw。ppu.js 設調色盤時會呼叫。
  PALETTE.assert = function (i, where) {
    if (typeof i !== 'number' || (i | 0) !== i || i < 0 || i > 63) {
      throw new Error('NES.PALETTE: 色號必須是 0..63 的整數，收到 ' + i +
        (where ? ' (' + where + ')' : ''));
    }
    if (PALETTE.isForbidden(i)) {
      throw new Error('NES.PALETTE: $' + ('0' + i.toString(16).toUpperCase()).slice(-2) +
        ' 是禁用色（blacker than black）' + (where ? ' (' + where + ')' : ''));
    }
    return i;
  };

  PALETTE.rgb = function (i) {
    if (typeof i !== 'number' || (i | 0) !== i || i < 0 || i > 63) {
      throw new Error('NES.PALETTE.rgb: 索引必須是 0..63 的整數，收到 ' + i);
    }
    var c = PALETTE[i];
    return [c[0], c[1], c[2]];
  };

  PALETTE.hex = function (i) {
    var c = PALETTE.rgb(i);
    return '#' + ('00000' + ((c[0] << 16) | (c[1] << 8) | c[2]).toString(16).toUpperCase()).slice(-6);
  };

  // 最接近色（歐氏距離平方，跳過禁用色）。相同距離取索引小者。
  PALETTE.nearest = function (r, g, b) {
    var best = 0, bestD = Infinity;
    for (var i = 0; i < 64; i++) {
      if (PALETTE.isForbidden(i)) continue;
      var c = PALETTE[i];
      var dr = c[0] - r, dg = c[1] - g, db = c[2] - b;
      var d = dr * dr + dg * dg + db * db;
      if (d < bestD) { bestD = d; best = i; if (d === 0) break; }
    }
    return best;
  };

  NES.PALETTE = PALETTE;
})(typeof window !== 'undefined' ? window : this);

</script>
<script>/* engine/fixed.js */
/* engine/fixed.js — NES.FX：定點數工具（位置 1/16 px、速度 8.8）
 * R1 / agent core。classic script、IIFE、零相依。
 *
 * 單位系統（全部整數；命名與 docs/TASKS.md「API 契約」一致）
 * ┌──────────┬───────────────┬───────────────────────────────────────────┐
 * │ 名稱     │ 1 單位 =      │ 用途                                       │
 * ├──────────┼───────────────┼───────────────────────────────────────────┤
 * │ sub      │ 1/16 px       │ 位置（SUB = 16）                           │
 * │ vel      │ 1/256 px/幀   │ 速度 8.8（v88(hi,lo) = hi 整數 px + lo/256）│
 * │ acc      │ 1/4096 px/幀² │ 加速度（= 1/16 vel，ACC = 16）             │
 * └──────────┴───────────────┴───────────────────────────────────────────┘
 * 兩層換算都是「每 16 個小單位進位 1 個大單位」，所以累加一律用 >>4 / &15，
 * 負數用算術右移自然取 floor，餘數恆為 0..15，不會因正負號漂移。
 *
 * 與 SMB1 反組譯常數的對應（見下方 NES.FX.SMB）：
 *   SMB「速度值」1 單位 = 1/16 px/幀 = 16 vel
 *   SMB「加速度 / 摩擦」1 單位 = 1/256 速度值/幀 = 1/4096 px/幀² = 1 acc  ← 原始位元組可直接用
 *   SMB「重力值」1 單位 = 1/256 px/幀² = 1 vel/幀 = 16 acc
 */
(function (root) {
  'use strict';
  var NES = root.NES = root.NES || {};

  var SUB = 16;    // 位置：1 px = 16 sub
  var VEL = 256;   // 速度：1 px/幀 = 256 vel（8.8 的 .8）
  var ACC = 16;    // 加速度：1 vel/幀 = 16 acc（→ 1 px/幀² = 4096 acc）

  /* ---------- 位置換算 ---------- */
  function toSub(px) { return (px * SUB) | 0; }          // px → sub（截尾取整）
  function toPx(sub) { return (sub | 0) / SUB; }         // sub → px（唯一會回傳非整數的函式，顯示 / 除錯用）
  function floorPx(sub) { return (sub | 0) >> 4; }       // sub → px（向下取整，負數也正確）
  function ceilPx(sub) { return -((-(sub | 0)) >> 4); }
  function roundPx(sub) { return ((sub | 0) + 8) >> 4; }
  function subFrac(sub) { return (sub | 0) & 15; }       // 像素內的 1/16 餘數（0..15）

  /* ---------- 速度換算（8.8） ---------- */
  // v88(2, 128) = 2.5 px/幀 = 640；負速度傳負的 hi：v88(-2, 128) = -640
  function v88(hi, lo) {
    hi = hi | 0; lo = lo | 0;
    if (hi < 0) return -(((-hi) * VEL + (lo < 0 ? -lo : lo)) | 0);
    return (hi * VEL + lo) | 0;
  }
  function velToPx(v) { return (v | 0) / VEL; }                     // vel → px/幀
  function pxToVel(px) { return Math.round(px * VEL) | 0; }         // px/幀 → vel
  function accToPx(a) { return (a | 0) / (VEL * ACC); }             // acc → px/幀²
  function pxToAcc(px) { return Math.round(px * VEL * ACC) | 0; }   // px/幀² → acc
  function smbSpd(b) { return ((b | 0) * 16) | 0; }                 // SMB 速度值($xx) → vel
  function smbGrav(b) { return ((b | 0) * 16) | 0; }                // SMB 重力值($xx) → acc

  /* ---------- Vec：{sub, frac} 小物件，每幀零配置 ---------- */
  function Vec(px, frac) { return { sub: toSub(px || 0), frac: frac | 0 }; }
  function vecSub(sub, frac) { return { sub: sub | 0, frac: frac | 0 }; }
  function vadd(vec, v) {                    // 位置前進一幀，回傳新的 sub
    var f = vec.frac + (v | 0);
    var d = f >> 4;
    vec.frac = f - (d << 4);
    vec.sub = (vec.sub + d) | 0;
    return vec.sub;
  }
  function vsetPx(vec, px) { vec.sub = toSub(px); vec.frac = 0; return vec; }
  function vsetSub(vec, sub) { vec.sub = sub | 0; vec.frac = 0; return vec; }
  function vpx(vec) { return vec.sub >> 4; }
  function vpxf(vec) { return vec.sub / SUB; }

  /* ---------- Acc：{v, frac} 速度小物件（加速度累加用） ---------- */
  function Acc(v) { return { v: v | 0, frac: 0 }; }
  function aadd(av, a) {                     // 速度前進一幀，回傳新的 vel
    var f = av.frac + (a | 0);
    var d = f >> 4;
    av.frac = f - (d << 4);
    av.v = (av.v + d) | 0;
    return av.v;
  }
  function aset(av, v) { av.v = v | 0; av.frac = 0; return av; }
  // 朝 target 以 a（acc 單位）逼近並夾住，不會過衝
  function aapproach(av, target, a) {
    target = target | 0;
    if (av.v < target) { aadd(av, a); if (av.v > target) aset(av, target); }
    else if (av.v > target) { aadd(av, -(a | 0)); if (av.v < target) aset(av, target); }
    return av.v;
  }

  /* ---------- 相容別名（R1 fix1 定案：正式寫法是 Vec / Acc）----------
   * 舊契約 `addVel(posSub, v88) → {pos, frac}` 與舊實作 `addVel(posSub, v, frac) → int`
   * （餘數放在全域 `NES.FX.frac`）**都已作廢**：全域餘數在多實體（主角 + N 個敵人）
   * 之間會互相污染。正式寫法是把餘數放進物件本身：
   *     位置 `Vec{sub, frac}` + `vadd(vec, v)`　／　速度 `Acc{v, frac}` + `aadd(av, a)`
   * `addVel / addAcc` 保留為**明確版本的相容別名**（= vadd / aadd），沒有任何隱藏狀態。
   */
  function addVel(vec, v) {
    if (!vec || typeof vec !== 'object' || typeof vec.sub !== 'number') {
      throw new TypeError('NES.FX.addVel 已改為 addVel(vec, v)（vec = FX.Vec(px)）；' +
        '舊的 addVel(posSub, v, frac) 與全域 NES.FX.frac 已移除，見 docs/ENGINE_API.md §3');
    }
    return vadd(vec, v);
  }
  function addAcc(av, a) {
    if (!av || typeof av !== 'object' || typeof av.v !== 'number') {
      throw new TypeError('NES.FX.addAcc 已改為 addAcc(acc, a)（acc = FX.Acc(vel)）；' +
        '舊的 addAcc(v, a, frac) 已移除，見 docs/ENGINE_API.md §3');
    }
    return aadd(av, a);
  }

  /* ---------- 整數工具 ---------- */
  function clamp(v, lo, hi) { v = v | 0; lo = lo | 0; hi = hi | 0; return v < lo ? lo : (v > hi ? hi : v); }
  function sign(v) { v = v | 0; return v > 0 ? 1 : (v < 0 ? -1 : 0); }
  function abs(v) { v = v | 0; return v < 0 ? -v : v; }
  function absMax(v, m) { v = v | 0; m = m | 0; if (m < 0) m = -m; return v > m ? m : (v < -m ? -m : v); }
  function mulShr(a, b, s) { return ((a | 0) * (b | 0)) >> (s | 0); }  // 定點乘法

  /* ---------- SMB1 常數表 ----------
   * 來源：docs/research/03_經典遊戲深度解析/01_超級瑪利歐兄弟.md ②「速度與加速度」「跳躍」
   *       原始出處 doppelganger《A Comprehensive SMB Disassembly》(SMBDIS.ASM)
   * 每一欄都標原始位元組與換算後的 px 值，方便回頭核對。
   */
  var SMB = {
    src: 'docs/research/03_經典遊戲深度解析/01_超級瑪利歐兄弟.md（SMBDIS.ASM 反組譯）',

    // MaxRightXSpdData / MaxLeftXSpdData（原始為 1/16 px/幀 的速度值）
    maxRun:      smbSpd(0x28),   // $28 = 40 → 2.5  px/幀 = 640 vel
    maxWalk:     smbSpd(0x18),   // $18 = 24 → 1.5  px/幀 = 384 vel
    maxWater:    smbSpd(0x10),   // $10 = 16 → 1.0  px/幀 = 256 vel
    maxCutscene: smbSpd(0x0c),   // $0c = 12 → 0.75 px/幀 = 192 vel

    // FrictionData（原始為 1/256 速度值/幀 = 1 acc，數值可直接用）
    accRun:   0xe4,              // 228 → 0.05566 px/幀²（14.25 vel/幀）
    accWalk:  0x98,              // 152 → 0.03711 px/幀²（ 9.5  vel/幀）
    friction: 0xd0,              // 208 → 0.05078 px/幀²（13.0  vel/幀）
    turnShift: 1,                // 面向 ≠ 移動方向時 `asl` → 加速度 ×2（煞車/轉身快一倍）

    // 空中控制門檻：水平速度 ≥ $19（1.5625 px/幀）才沿用跑步上限與跑步加速度
    airRunSpeed: smbSpd(0x19),   // 400 vel

    /* 跳躍 5 段：依起跳瞬間的水平速度絕對值（vel）選段
     * belowSpeed = 該段的上界（最後一段為 Infinity）
     * vy0 = 起跳初速（vel，負 = 往上）；gHold/gFall = 按住 / 放開 A 的重力（acc）
     * h = 研究文件列的理論最高跳躍高度（px），僅供對照（離散積分會差 1~3 px）
     */
    jump: [
      { belowSpeed: smbSpd(0x09), vy0: -v88(4, 0), gHold: smbGrav(0x20), gFall: smbGrav(0x70), h: 64 },
      { belowSpeed: smbSpd(0x10), vy0: -v88(4, 0), gHold: smbGrav(0x20), gFall: smbGrav(0x70), h: 64 },
      { belowSpeed: smbSpd(0x19), vy0: -v88(4, 0), gHold: smbGrav(0x1e), gFall: smbGrav(0x60), h: 68 },
      { belowSpeed: smbSpd(0x1c), vy0: -v88(5, 0), gHold: smbGrav(0x28), gFall: smbGrav(0x90), h: 80 },
      { belowSpeed: Infinity,     vy0: -v88(5, 0), gHold: smbGrav(0x28), gFall: smbGrav(0x90), h: 80 }
    ],
    swim:      { vy0: -v88(2, 0), gHold: smbGrav(0x0d), gFall: smbGrav(0x0a) },
    whirlpool: { vy0: -v88(1, 0), gHold: smbGrav(0x04), gFall: smbGrav(0x09) },

    // 放開 A 後要離地 ≥ 1 px 才切成大重力（DiffToHaltJump）
    diffToHaltJump: SUB,         // 16 sub = 1 px

    // 敵人：NormalXSpdData（栗寶寶等）
    enemySlow: smbSpd(0x08),     // $f8 → 0.5  px/幀（表中為負方向，這裡存絕對值）
    enemyFast: smbSpd(0x0c),     // $f4 → 0.75 px/幀

    // 計時器節拍（幀）
    intervalTimer: 21,           // IntervalTimerControl：每 21 幀一跳（framerule）
    injuryFrames: 8 * 21,        // 168 幀 ≈ 2.80 秒
    starFrames: 35 * 21,         // 735 幀 ≈ 12.2 秒

    // 依水平速度取跳躍段
    jumpFor: function (absSpeedVel) {
      absSpeedVel = absSpeedVel < 0 ? -absSpeedVel : absSpeedVel;
      for (var i = 0; i < SMB.jump.length; i++) if (absSpeedVel < SMB.jump[i].belowSpeed) return SMB.jump[i];
      return SMB.jump[SMB.jump.length - 1];
    },

    /* ---- 起跳首幀的重力（R1 fix1 總控裁定；QA P1-4 / P1-5）----------------
     * 半隱式 Euler（每幀「先加重力、再位移」）會把跳躍高度系統性地低估半個
     * 重力步：靜止跳 62.00 px（文件 4 格 = 64）、全速跳 77.50 px（文件 5 格 = 80），
     * ⇒「剛好 4 格牆 / 5 格牆」的關卡會跳不過去。
     * 修正：**起跳後的第 1 幀只套用半格重力**（leapfrog / 中點積分），之後照常。
     *   離散積分和 = Σ(v0 − g(k+½)) = v0²/2g ＝ 連續解 ⇒ 靜止跳 64.00 px、全速跳 80.00 px（±0）。
     * skipGravityFirstFrame 三種值：
     *   true / 'half' 首幀半格重力 →  64.00 / 80.00 px（預設，對齊研究文件 03/01）
     *   'full'        首幀完全不加重力 → 66.00 / 82.50 px（超過文件 2 / 2.5 px）
     *   false         舊行為（純半隱式） → 62.00 / 77.50 px（比文件少 2 / 2.5 px）
     */
    skipGravityFirstFrame: true
  };

  /* ---------- 跳躍：core 與 demo 共用的唯一一套規則 ----------
   * 用法（見 games/demo/main.js stepPlayer）：
   *   var js = FX.SMB.jumpState(g.vy);               // 綁定自己的 Acc，零配置
   *   if (onGround && pressedA) FX.SMB.jumpStart(js, FX.abs(vx), py.sub);
   *   if (!onGround) FX.SMB.jumpGravity(js, aHeldNow, py.sub, MAX_FALL);
   *   FX.vadd(py, js.vy.v);                          // 先重力、再位移（半隱式）
   * 規則：① 依起跳瞬間 |vx| 取 5 段之一（jumpFor）
   *       ② 按住 A = gHold；放開 **且已離地 ≥ 1 px**（DiffToHaltJump）才切 gFall
   *       ③ 起跳首幀依 skipGravityFirstFrame 只套半格重力（見上）
   */
  function jumpState(vyAcc) {
    return {
      seg: SMB.jump[0],
      vy: vyAcc || Acc(0),
      fastFall: false,
      startSub: 0,
      first: false,
      skipFirst: SMB.skipGravityFirstFrame
    };
  }
  function jumpStart(js, absVxVel, pySub) {
    js.seg = SMB.jumpFor(absVxVel | 0);
    aset(js.vy, js.seg.vy0);
    js.fastFall = false;
    js.startSub = pySub | 0;
    js.first = true;
    return js;
  }
  // 重新設定垂直速度但不算「新的一次跳躍」（踩敵回彈、被彈飛…）
  function jumpBounce(js, vel, pySub) {
    aset(js.vy, vel | 0);
    js.fastFall = false;
    js.startSub = pySub | 0;
    js.first = false;
    return js;
  }
  function jumpGravity(js, aHeld, pySub, maxFall) {

/* engine/cpu_timing.js — NES.Timing：60.0988 Hz 固定步邏輯迴圈
 * R1 / agent core。classic script、IIFE、零相依。
 *
 * 原則：
 *   - 邏輯步長固定 1/hz，**不做 delta-time 補間**（位置永遠是整數 sub 的累加）。
 *   - rAF 迴圈用累加器；一次 rAF 最多補 3 幀，還有剩就直接丟掉（避免分頁回前景時暴衝）。
 *   - step(n) 同步跑 n 幀（不走 rAF），供 tools/test_*.py 與截圖使用。
 *   - 每幀順序：Input.poll() → update() → draw()（NES.Input 不存在就跳過 poll）。
 *   - budget 模擬 VBlank 的 PPU 寫入頻寬：NTSC VBlank ≈ 2273 cycle ≈ 160~200 bytes。

 *       'ppu'（預設）名稱表 / 屬性表 / 調色盤，limit = 160 byte（NTSC）

    if (res && res.frame) res = res.frame;
    if (!res) return 'lint: (無結果)';
    return 'lint ' + (res.ok ? 'PASS' : 'FAIL') + ' — 色數 ' + res.colors + '/' + res.maxColors +
      '、非法像素 ' + res.badPixels + '、超線 ' + (res.overLine ? res.overLine.length : 0) +
      (res.errors && res.errors.length ? '｜' + res.errors.join('；') : '');
  }

  var Lint = {
    strict: false,
    magenta: false,
    maxColors: 25,
    maxSpritesPerLine: 8,
    MAGENTA: MAGENTA,
    VISIBLE: { y0: 8, y1: 232 },  // 研究 01 §3.1：NTSC 電視只看得到中央 256×224
    frame: frame,
    oam: oam,
    check: check,
    summary: summary
  };
  NES.Lint = Lint;
})();

        // 推進 n 幀（同步，不走 rAF）
        step: function (n) { nes.step(n || 1); return timing.frame; },
        // press(mask | 'a' | ['a','right'], n)：按住 n 幀並推進 n 幀
        press: function (spec, n) {
          n = n || 1;
          var m = NES.toMask(spec);
          call(input, 'inject', m, n);
          nes.step(n);
          return timing.frame;
        },
        // tap(spec, n)：按 n 幀後放開（預設 1 幀）
        tap: function (spec, n) {
          n = n || 1;
          var m = NES.toMask(spec);
          call(input, 'inject', m, n);
          nes.step(n);
          call(input, 'inject', 0, 0);
          return timing.frame;
        },
        release: function () { call(input, 'inject', 0, 0); return true; },
        // 重畫一幀但不推進任何邏輯（截圖前用）；PPU 的閃爍輪替指標也不動 ⇒ 可重現
        render: function () { nes.render(); return true; },
        // state()：遊戲自己的 state() 併上 frame / stats
        state: function () {
          var s = {};
          try { var gs = call(nes.game, 'state'); if (gs) s = (typeof gs === 'string') ? JSON.parse(gs) : gs; } catch (e) { }
          s.frame = timing.frame;
          s.hz = timing.hz;
          s.stats = this.stats();
          return s;
        },
        // frame()：base64 PNG（data URL）；canvas 取不到時退回 ppu.frame 摘要
        // ⚠️ 與 state().frame / stats().frame（幀號）同名不同義 ⇒ 另給別名 snapshot()（QA P2-2）
        frame: function () {
          try { return canvas.toDataURL('image/png'); }
          catch (e) {
            var f = ppu.frame;
            if (!f) return null;
            var n = 0, sum = 0;
            for (var i = 0; i < f.length; i += 4) { if (f[i] | f[i + 1] | f[i + 2]) n++; sum += f[i] + f[i + 1] + f[i + 2]; }
            return { w: NES.W, h: NES.H, nonBlack: n, avg: Math.round(sum / (f.length / 4 * 3)) };
          }
        },
        // snapshot()：frame() 的別名，語意更清楚（回傳 PNG，不是幀號）
        snapshot: function () { return this.frame(); },
        // lint()：交給 nes_lint.js；未載入時回報 skipped
        lint: function () {
          if (NES.Lint && typeof NES.Lint.frame === 'function') {
            var r = NES.Lint.frame(ppu);
            if (r && NES.Lint.oam) { try { r.oam = NES.Lint.oam(ppu); } catch (e) { r.oamError = e.message; } }
            // 便利：把 PPU 自己統計的超線資訊一併帶出（lint 讀不到時仍看得見）
            if (r && ppu.stats) {
              var ol = ppu.stats.overLines || ppu.stats.overLine;
              if (ol && ol.length && !(r.overLine && r.overLine.length)) r.ppuOverLines = ol;
              if (ppu.stats.maxSpritesLine != null) r.maxSpritesLine = ppu.stats.maxSpritesLine;
            }
            return r;
          }
          return { ok: true, skipped: true, reason: 'nes_lint.js 未載入' };
        },
        stats: function () {
          var st = (ppu && ppu.stats) || {};
          var bg = timing.budget;
          return {
            frame: timing.frame, hz: timing.hz,
            colors: st.colors, maxSpritesLine: st.maxSpritesLine, flickered: st.flickered,
            budgetOver: !!(bg && bg.over),
            // VBlank 寫入預算明細（QA P1-6）：ppu 通道 160 byte + OAM DMA 256 byte
            budget: (bg && typeof bg.report === 'function') ? bg.report() : null,
            scale: nes.scale,
            missing: nes.missing.slice(),
            stub: { ppu: !!ppu.stub, input: !!input.stub, timing: !!timing.stub, apu: !apu, music: !music }
          };
        },
        // 額外便利：給 tools/shot.py 與手寫 playwright 腳本用
        nes: function () { return nes; },
        setScale: function (s) { nes.setScale(s); return nes.scale; },
        missing: function () { return nes.missing.slice(); },
        version: NES.VERSION
      };
    }
    return nes;
  };
})();

</script>

<script>/* games/demo/chr.js */
/*
 * games/demo/chr.js — 測試房「星塵測試室」的 CHR / 調色盤層
 * ---------------------------------------------------------------------------
 * 擁有者：demo agent ｜ 依賴：engine/chr.js（NES.CHR、NES.CHR.DEMO 原創美術）
 *
 * 做兩件事：
 *   ① 背景圖樣表直接用 `NES.CHR.DEMO.bg`（67 磚：8×8 字型 + 地形磚，SKY 固定在索引 0）。
 *   ② 精靈圖樣表用 **`NES.CHR.DEMO.spr16`**（engine/chr.js 附的 8×16 配對版；QA P2-4 / X12
 *      修掉後每個 8×16 遊戲不必再自己 tile16() 重建一次）。`DEMO.spr` 是 8×8 切片，
 *      在 8×16 模式下 PPU 會把「偶數索引 + 下一格」當成上下半塊（engine/ppu.js `_sprLine`），
 *      直接用會取到隔壁磁磚。主角 16×24 = 上半塊 16×16 + 腳 16×8（下半塊留白）。
 *
 * 8×16 模式的 OAM tile 欄語意（engine/ppu.js）：`table = tile & 1`、`tidx = tile & 0xFE`。
 * 本 bank 綁在圖樣表 1，所以 OAM 要填 `index | 1`（`NES.CHR.DEMO.oam16(name)` 已經算好）。
 *
 * 調色盤（全部原創配色，色號皆為 NES 64 色索引，$0D 未使用）：
 *   backdrop $22 天空藍｜bg0 雲 / HUD 白字｜bg1 泥土｜bg2 磚 / 問號磚｜bg3 草地 / 草叢
 *   spr0 主角（黑描邊 / 紅衣 / 膚色）｜spr1 敵人「石頭蟲」（黑 / 深褐 / 米黃 $38 ← 測試用辨識色）
 */
(function () {
  'use strict';
  var NES = window.NES = window.NES || {};
  var DEMO = window.DEMO = window.DEMO || {};
  var CHR = NES.CHR;
  if (!CHR || !CHR.DEMO) throw new Error('games/demo/chr.js 需要 engine/chr.js（含 NES.CHR.DEMO）');
  var ART = CHR.DEMO;

  // ---- 8×16 精靈 bank（engine/chr.js 直接附，不再自己重建）-----------------
  var sprBank = ART.spr16;
  var oamTile = ART.oam16;                           // index(name) | 1（圖樣表 1 + 偶數上半塊）

  // ---- 背景磁磚索引（demo_bg bank）---------------------------------------
  var bg = ART.bg;
  var T = {
    SKY: bg.index('SKY'),
    GROUND_TOP: bg.index('GROUND_TOP'),
    GROUND: bg.index('GROUND'),
    BRICK: bg.index('BRICK'),
    QBLOCK: bg.index('QBLOCK'),
    BLOCK: bg.index('BLOCK'),
    CLOUD_L: bg.index('CLOUD_L'),
    CLOUD_R: bg.index('CLOUD_R'),
    BUSH: bg.index('BUSH')
  };

  // ---- 精靈 OAM tile 值 ---------------------------------------------------
  var S = {
    HERO_TOP_L: oamTile('HERO_TOP_L'),
    HERO_TOP_R: oamTile('HERO_TOP_R'),
    HERO_LEG_L: [oamTile('HERO_L0_L'), oamTile('HERO_L1_L'), oamTile('HERO_L2_L')],
    HERO_LEG_R: [oamTile('HERO_L0_R'), oamTile('HERO_L1_R'), oamTile('HERO_L2_R')],
    ENEMY_L: oamTile('ENEMY_L'),
    ENEMY_R: oamTile('ENEMY_R')
  };

  // ---- 調色盤 -------------------------------------------------------------
  var PAL = {
    backdrop: 0x22,                       // 天空藍
    bg: [
      [0x21, 0x11, 0x30],                 // 0：雲（描邊 / 深藍 / 白）+ HUD 白字（色 3）
      [0x07, 0x17, 0x27],                 // 1：泥土（深褐 / 橘褐 / 淺褐）
      [0x0F, 0x17, 0x28],                 // 2：磚 / 問號磚（黑 / 橘褐 / 金）
      [0x09, 0x1A, 0x2A]                  // 3：草地 / 草叢（深綠 / 綠 / 淺綠）
    ],
    spr: [
      [0x0F, 0x16, 0x27],                 // 0：主角（黑描邊 / 紅衣 / 膚色）
      [0x0F, 0x08, 0x38],                 // 1：敵人（黑 / 深褐 / 米黃 $38＝測試辨識色）
      [0x0F, 0x16, 0x30],                 // 2：備用（主角受傷閃白）
      [0x0F, 0x28, 0x30]                  // 3：備用
    ],
    ENEMY_MARK: 0x38                      // 測試用：畫面上只有敵人會出現這個色號
  };

  function applyPalettes(ppu) {
    ppu.setBackdrop(PAL.backdrop);
    for (var i = 0; i < 4; i++) {
      ppu.setBgPalette(i, PAL.bg[i]);
      ppu.setSprPalette(i, PAL.spr[i]);
    }
  }

  DEMO.CHR = {
    bgBank: bg,
    sprBank: sprBank,
    T: T,
    S: S,
    PAL: PAL,
    applyPalettes: applyPalettes,
    hero: { w: 16, h: 24 },
    enemy: { w: 16, h: 16 },
    walk: ART.hero.walk.slice(),          // [0,1,0,2]（研究 05 §4：NES 走路慣例 1→2→1→3）
    text: ART.text,                       // 字串 → demo_bg 磁磚索引
    setPatterns: function () {
      CHR.setPattern(0, bg);              // 背景：字型 + 地形
      CHR.setPattern(1, sprBank);         // 精靈：8×16 配對
    }
  };
})();

</script>
<script>/* games/demo/song.js */
/*
 * games/demo/song.js — 測試房的音樂 / 音效層（薄包裝，容錯）
 * ---------------------------------------------------------------------------
 * 擁有者：demo agent ｜ 依賴：engine/music.js（NES.Music.DEMO 原創短曲 + jump / coin 音效）
 *
 * 契約重點（docs/ENGINE_API.md §10、D5）：
 *   - `NES.boot` 已經幫忙 `NES.Music.attach(apu)`，且 `nes.music === NES.Music`（同一個 driver），
 *     attach 時也已經 define 了 'jump' 與 'coin'。這裡再 define 一次是冪等的保險。
 *   - `music.tick()` 必須由遊戲的 update() 每幀呼叫一次（apu.tick() 則由 nes.js 自己呼叫）。
 *   - 音效搶聲道：jump priority 5（p2）、coin priority 6（p2）→ coin 可以搶下 jump，
 *     音效結束後 p2 自動還給音樂（driver 內部 _restore）。
 */
(function () {
  'use strict';
  var NES = window.NES = window.NES || {};
  var DEMO = window.DEMO = window.DEMO || {};

  var M = NES.Music || null;
  var SONG = (M && M.DEMO && M.DEMO.song) || null;

  function driver(nes) {
    return (nes && nes.music) || (NES.Music && NES.Music._default ? NES.Music : null);
  }

  var Audio = {
    ready: !!(M && SONG),
    songName: SONG ? (SONG.name || 'DEMO') : null,
    playing: false,

    init: function (nes) {
      var d = driver(nes);
      if (!d || !M || !M.DEMO) return false;
      try {
        d.define('jump', M.DEMO.sfx.jump);
        d.define('coin', M.DEMO.sfx.coin);
      } catch (e) { /* attach 已經 define 過，或 driver 不支援 → 忽略 */ }
      return true;
    },

    // 開場曲：NES.Music.DEMO 短曲循環
    play: function (nes) {
      var d = driver(nes);
      if (!d || !SONG) return false;
      try { d.play(SONG, { loop: true }); Audio.playing = true; return true; }
      catch (e) { return false; }
    },

    stop: function (nes) {
      var d = driver(nes);
      if (!d) return false;
      try { d.stop(); Audio.playing = false; return true; } catch (e) { return false; }
    },

    sfx: function (nes, name) {
      var d = driver(nes);
      if (!d) return false;
      try { d.sfx(name); return true; } catch (e) { return false; }
    },

    jump: function (nes) { return Audio.sfx(nes, 'jump'); },
    coin: function (nes) { return Audio.sfx(nes, 'coin'); },

    tick: function (nes) {
      var d = driver(nes);
      if (!d) return;
      try { d.tick(); } catch (e) { /* 音樂出錯不能拖垮遊戲迴圈 */ }
    },

    // 測試用：目前有哪些音效佔著哪些聲道
    state: function (nes) {
      var d = driver(nes);
      if (!d || !d.state) return null;
      try {
        var s = d.state();
        var owners = {};
        for (var i = 0; i < s.channels.length; i++) owners[s.channels[i].name] = s.channels[i].owner || null;
        return {
          playing: s.playing, row: s.row, orderIndex: s.orderIndex,
          sfx: s.sfx.map(function (x) { return x.name; }),
          sfxChannels: s.sfx.map(function (x) { return x.channels.join(','); }),
          owners: owners
        };
      } catch (e) { return null; }
    }
  };

  DEMO.Audio = Audio;
})();

</script>
<script>/* games/demo/room.js */
/*
 * games/demo/room.js — 測試房的關卡資料 / 名稱表寫入 / 狀態列 / 標題畫面
 * ---------------------------------------------------------------------------
 * 擁有者：demo agent ｜ 依賴：games/demo/chr.js、engine/ppu.js
 *
 * 關卡：256 磁磚欄 × 30 列 = 2048×240 px ＝ **8 個畫面寬**（任務要求 ≥ 4）。
 * 名稱表只有 2 張（512 px）→ 用 **垂直鏡像 'v'**（左右兩張不同），
 * 相機前進時把「畫面右緣再往右 2 欄」的那一欄寫進 `欄 & 63` 的位置
 * （＝真機的「邊捲邊補欄」，每幀只寫 1 欄 26 byte + 屬性，遠低於 VBlank 160 byte 預算）。
 *
 * 版面（列 = 8 px）：
 *   列 0–3   狀態列（`ppu.split(32, ...)` 之前的區段，捲動固定 x=0）
 *   列 4–25  天空 / 雲 / 草叢 / 浮空磚
 *   列 24–25 敵人房的高台（比地面高 16 px，讓敵人分成兩條掃描線帶）
 *   列 26–29 地面
 *
 * 屬性表以 16×16 為單位（`setAttr`）：0 天空 / 雲 / 字、1 泥土、2 磚 / 問號磚、3 草。
 */
(function () {
  'use strict';
  var DEMO = window.DEMO = window.DEMO || {};
  var C = DEMO.CHR;

  var COLS = 256, ROWS = 30;
  var W_PX = COLS * 8;                 // 2048
  var STATUS_ROWS = 4;                 // 列 0–3 給狀態列
  var TOP_ROW = STATUS_ROWS;           // 關卡從列 4 開始
  var GROUND_ROW = 26;                 // 地面頂端（y = 208）
  var GROUND_Y = GROUND_ROW * 8;       // 208
  var LEDGE_ROW = 24;                  // 高台頂端（y = 192）
  var LEDGE_C0 = 241, LEDGE_C1 = 255;  // 高台欄範圍（x 1928–2047）
  var BLOCK_ROW = 20;                  // 浮空磚列（y = 160）

  // 磁磚種類代碼
  var K = { SKY: 0, GTOP: 1, GND: 2, BRICK: 3, QBLOCK: 4, BLOCK: 5, CLOUD_L: 6, CLOUD_R: 7, BUSH: 8 };
  var SOLID = [false, true, true, true, true, true, false, false, false];
  var TILE_OF = null;                  // 種類 → demo_bg 磁磚索引（init 時填）

  var map = new Uint8Array(ROWS * COLS);
  var attr = new Uint8Array(16 * (COLS / 2));   // [row16 * (COLS/2) + col16]，row16 0..14

  function set(c, r, k) { if (c >= 0 && c < COLS && r >= 0 && r < ROWS) map[r * COLS + c] = k; }
  function kindAt(c, r) {
    if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return K.SKY;
    return map[r * COLS + c];
  }

  function inLedge(c) { return c >= LEDGE_C0 && c <= LEDGE_C1; }

  // ---- 產生關卡（決定性，沒有亂數）---------------------------------------
  function build() {
    map.fill(K.SKY);
    var c, r;
    for (c = 0; c < COLS; c++) {
      // 地面（沒有坑，讓自動測試可重現）
      set(c, GROUND_ROW, K.GTOP);
      for (r = GROUND_ROW + 1; r < ROWS; r++) set(c, r, K.GND);

      // 敵人房高台（列 24–25）
      if (inLedge(c)) { set(c, LEDGE_ROW, K.GTOP); set(c, LEDGE_ROW + 1, K.GND); }

      // 雲（只放列 6–7，避開標題文字區）
      if (c % 16 === 3) { set(c, 6, K.CLOUD_L); set(c + 1, 6, K.CLOUD_R); }
      if (c % 16 === 11) { set(c, 7, K.CLOUD_L); set(c + 1, 7, K.CLOUD_R); }

      // 草叢（貼著地面，不擋路）
      if (c % 13 === 6 && !inLedge(c)) set(c, GROUND_ROW - 1, K.BUSH);
    }

    // 浮空磚組（x ≥ 720，避開手感測試用的空曠起跑區）
    var groups = [90, 104, 118, 150, 168];
    for (var g = 0; g < groups.length; g++) {
      var c0 = groups[g];
      set(c0, BLOCK_ROW, K.QBLOCK);
      set(c0 + 1, BLOCK_ROW, K.BRICK);
      set(c0 + 2, BLOCK_ROW, K.QBLOCK);
      set(c0 + 3, BLOCK_ROW, K.BRICK);
      if (g % 2 === 1) { set(c0 + 1, BLOCK_ROW - 4, K.BLOCK); set(c0 + 2, BLOCK_ROW - 4, K.BLOCK); }
    }

    buildAttr();
    return map;
  }

  // 16×16 屬性區塊：掃 2×2 磁磚決定調色盤組
  function buildAttr() {
    attr.fill(0);
    var cols16 = COLS / 2;
    for (var r16 = 0; r16 < 15; r16++) {
      for (var c16 = 0; c16 < cols16; c16++) {
        var pal = 0, hasBlock = false, hasBush = false, hasGround = false;
        for (var dy = 0; dy < 2; dy++) {
          for (var dx = 0; dx < 2; dx++) {
            var k = kindAt(c16 * 2 + dx, r16 * 2 + dy);
            if (k === K.BRICK || k === K.QBLOCK || k === K.BLOCK) hasBlock = true;
            else if (k === K.BUSH) hasBush = true;
            else if (k === K.GTOP || k === K.GND) hasGround = true;
          }
        }
        if (hasBlock) pal = 2;
        else if (hasBush) pal = 3;
        else if (hasGround) pal = (r16 >= 13) ? 1 : 3;   // 列 26 以下＝泥土，其餘（高台）＝草地
        attr[r16 * cols16 + c16] = pal;
      }
    }
  }

  // ---- 名稱表寫入 ---------------------------------------------------------
  function tileIndex(k) { return TILE_OF[k]; }

  // 把世界第 c 欄寫進名稱表（欄 & 63 → nt 0/1 的第 col 欄；'v' 鏡像＝左右兩張不同）
  function writeColumn(ppu, c) {
    var ntc = c & 63, nt = (ntc >> 5) & 1, col = ntc & 31, r;
    for (r = TOP_ROW; r < ROWS; r++) ppu.setTile(nt, col, r, tileIndex(kindAt(c, r)));
    if ((col & 1) === 0) {
      var c16 = col >> 1, w16 = COLS / 2, src = (c >> 1) % w16;
      for (var r16 = 2; r16 <= 14; r16++) ppu.setAttr(nt, c16, r16, attr[r16 * w16 + src]);
    }
  }

  // ---- 狀態列（列 0–3，只在 nt0；split 之前的區段永遠 x=0）----------------
  function writeText(ppu, nt, col, row, str) {
    var t = C.text(str);
    for (var i = 0; i < t.length && col + i < 32; i++) ppu.setTile(nt, col + i, row, t[i]);
  }

  function drawHudStatic(ppu) {
    var r;
    for (r = 0; r < STATUS_ROWS; r++) {
      ppu.fillTiles(0, 0, r, 32, 1, C.T.SKY);
      ppu.fillTiles(1, 0, r, 32, 1, C.T.SKY);
    }
    ppu.setAttr(0, 0, 0, 0); ppu.fillAttr(0, 0, 0, 16, 2, 0);   // 列 0–3 用調色盤 0（白字）
    ppu.fillAttr(1, 0, 0, 16, 2, 0);
    writeText(ppu, 0, 2, 1, 'SCORE');
    writeText(ppu, 0, 12, 1, 'WORLD');
    writeText(ppu, 0, 22, 1, 'TIME');
  }

  function pad(n, w) {
    var s = String(n);
    while (s.length < w) s = '0' + s;
    return s;
  }

  function drawHudValues(ppu, score, time, world) {
    writeText(ppu, 0, 2, 2, pad(score, 6));
    writeText(ppu, 0, 13, 2, world);
    writeText(ppu, 0, 23, 2, pad(time, 3));
  }

  // ---- 標題畫面（寫在關卡區的列 10–18，開始遊戲後把欄重畫回來）------------
  var TITLE = [
    { row: 10, col: 9, text: 'STARDUST HERO' },
    { row: 12, col: 9, text: 'DEMO ROOM  R1' },
    { row: 15, col: 10, text: 'PRESS START' },
    { row: 18, col: 8, text: '$ 2026 ORIGINAL' }
  ];

  function drawTitle(ppu) {
    for (var i = 0; i < TITLE.length; i++) writeText(ppu, 0, TITLE[i].col, TITLE[i].row, TITLE[i].text);
  }

  // 清標題：只把標題那幾行的字改回天空磚（列 10/12/15/18 在關卡裡本來就是純天空）。
  // 舊版是重寫 32 整欄 = 832+ byte，一個 VBlank 根本搬不完（timing.budget 會判超支）；
  // 現在 4 行 × 字串長度 = 52 byte，穩穩落在 160 byte 預算內。
  function clearTitle(ppu) {
    for (var i = 0; i < TITLE.length; i++) {
      var t = TITLE[i];
      ppu.fillTiles(0, t.col, t.row, Math.min(t.text.length, 32 - t.col), 1, C.T.SKY);
    }
  }

  // ---- 碰撞查詢（世界像素座標）-------------------------------------------
  function solidAtPx(x, y) {
    if (x < 0) return true;                       // 關卡左牆
    if (x >= W_PX) return true;                   // 關卡右牆
    var c = x >> 3, r = y >> 3;
    if (r < 0) return false;                      // 天空（不擋頭）
    if (r >= ROWS) return true;
    return SOLID[kindAt(c, r)];
  }

  // ---- 敵人配置（12 隻在敵人房同掃描線帶 + 2 隻踩敵測試用）----------------
  // band 0 = 站地面（y=192，掃描線 192–207）／band 1 = 站高台（y=176，掃描線 176–191）
  function enemySpawns() {
    var list = [], i;
    // 踩敵測試用的兩隻（關卡前段，彼此相隔遠）
    var lone = [600, 664];
    for (i = 0; i < lone.length; i++) {
      list.push({ x: lone[i], y: GROUND_Y - 16, band: 0, min: lone[i], max: lone[i] + 10, dir: 1 });
    }
    // 敵人房：兩帶各 6 隻，間距 19 px（> 16 + 巡邏 3）⇒ 彼此永不重疊，方便逐隻驗證
    var bandA = [1796, 1815, 1834, 1853, 1872, 1891];   // 站地面：y=192，掃描線 192–207
    for (i = 0; i < bandA.length; i++) {
      list.push({ x: bandA[i], y: GROUND_Y - 16, band: 0, min: bandA[i], max: bandA[i] + 3, dir: (i & 1) ? 1 : -1 });
    }
    var bandB = [1930, 1949, 1968, 1987, 2006, 2025];   // 站高台：y=176，掃描線 176–191
    for (i = 0; i < bandB.length; i++) {
      list.push({ x: bandB[i], y: LEDGE_ROW * 8 - 16, band: 1, min: bandB[i], max: bandB[i] + 3, dir: (i & 1) ? -1 : 1 });
    }
    return list;
  }

  DEMO.Room = {
    COLS: COLS, ROWS: ROWS, W_PX: W_PX, TOP_ROW: TOP_ROW,
    STATUS_ROWS: STATUS_ROWS, SPLIT_LINE: STATUS_ROWS * 8,
    GROUND_ROW: GROUND_ROW, GROUND_Y: GROUND_Y, LEDGE_ROW: LEDGE_ROW,
    K: K,
    START_X: 32, START_Y: GROUND_Y - 24,
    CAM_MAX: W_PX - 256,
    init: function () {
      TILE_OF = [C.T.SKY, C.T.GROUND_TOP, C.T.GROUND, C.T.BRICK, C.T.QBLOCK, C.T.BLOCK,
        C.T.CLOUD_L, C.T.CLOUD_R, C.T.BUSH];
      build();
    },
    kindAt: kindAt, solidAtPx: solidAtPx,
    writeColumn: writeColumn, writeText: writeText,
    drawHudStatic: drawHudStatic, drawHudValues: drawHudValues,
    drawTitle: drawTitle, clearTitle: clearTitle,
    enemySpawns: enemySpawns
  };
})();

</script>
<script>/* games/demo/main.js */
/*
 * games/demo/main.js — 測試房主程式（window.GAME）
 * ---------------------------------------------------------------------------
 * 擁有者：demo agent ｜ 依賴：games/demo/{chr,song,room}.js、engine/*
 *
 * 目的：在 PPU / APU 的真限制下跑一個「可玩畫面」，證明 R1 引擎可用。
 *   ① 8 畫面寬的水平捲動關卡、名稱表 ×2 垂直鏡像、16×16 屬性配色、split 狀態列
 *   ② 主角 16×24（8×16 精靈模式）三幀走路，物理完全走 `NES.FX` 定點數 + `NES.FX.SMB` 常數
 *      （走 1.5 / 跑 2.5 px/f、加速度表、轉身 ×2、雙重力跳、磁磚 AABB、相機單向鎖）
 *   ③ 12 隻敵人分兩條掃描線帶 → 每線 > 8 精靈 → PPU 丟棄 + 軟體 sprite cycling 閃爍
 *   ④ 開場 `NES.Music.DEMO` 短曲循環；跳躍 jump、踩敵 coin 音效搶聲道
 *
 * 手感常數與**跳躍規則**全部來自 `NES.FX.SMB`（SMBDIS.ASM 反組譯，見 docs/research/03 §②）：
 *   每幀順序 = 讀輸入 → 水平加速 / 摩擦 → 起跳 → 重力 → 移動 X（碰撞）→ 移動 Y（碰撞）
 *              → 敵人 → 踩 / 撞判定 → 相機（單向）→ 補名稱表欄 → HUD → 音樂 tick
 *   跳躍走引擎的共用函式 `SMB.jumpState / jumpStart / jumpGravity / jumpBounce`
 *   （R1 fix1：QA P1-4 / P1-5 定案，起跳首幀半格重力）⇒ 本檔與 tools/test_core.py
 *   的 `SMB.jumpSim()` 是**同一套規則、同一組數字**：長按靜止跳 64.00 px（4 格）、
 *   全速跳 80.00 px（5 格）、點按 1 幀 19.6875 px。
 *
 * VBlank 寫入預算：每幀補一欄名稱表 26 byte + 屬性 13 byte（+ 狀態列更新 12 byte）
 *   ⇒ 單幀最高 51 byte，在 timing.budget 的 160 byte 之內（`__nes.stats().budget` 可查）。
 */
(function () {
  'use strict';
  var NES = window.NES = window.NES || {};
  var DEMO = window.DEMO = window.DEMO || {};

  var FX = NES.FX, SMB = FX.SMB, BTN = NES.Input.BTN;
  var C = DEMO.CHR, Room = DEMO.Room, Audio = DEMO.Audio;

  var HERO_W = 16, HERO_H = 24, ENEMY_W = 16, ENEMY_H = 16;
  var SCREEN_W = 256;
  var CAM_TRIGGER = 102;               // 畫面 40%（0.4 × 256 = 102.4 → 102 px）
  var MAX_FALL = FX.v88(4, 0);         // 下墜速度上限 4 px/幀
  var INV_FRAMES = 60;                 // 撞到敵人側面的無敵幀
  var BOUNCE = -FX.v88(3, 0);          // 踩敵回彈 -3 px/幀
  var STOMP_SCORE = 100;
  var ROT_STEP = 3;                    // 每幀把同一帶的敵人在 OAM 內旋轉 3 隻（軟體 sprite cycling）

  var g = null;

  function newState() {
    return {
      mode: 'title',
      frames: 0,
      px: FX.Vec(Room.START_X), py: FX.Vec(Room.START_Y),
      vx: FX.Acc(0), vy: FX.Acc(0),
      onGround: true, facing: 1,
      // 跳躍狀態一律走 NES.FX.SMB 的共用規則（QA P1-4 / P1-5 定案；vy 是同一個 Acc 物件）
      jumpS: null,
      jumpApexSub: FX.toSub(Room.START_Y),
      anim: 0, animTimer: 0, inv: 0,
      prevFeet: Room.START_Y + HERO_H,
      camX: 0, writtenTo: -1,
      score: 0, time: 400, timeTick: 0, world: '1-1',
      hudDirty: true,
      stomps: 0, hits: 0,
      enemies: [],
      lastSfx: null
    };
  }

  function resetState() {
    g = newState();
    g.jumpS = SMB.jumpState(g.vy);     // 綁在自己的 Acc 上 ⇒ 沒有任何全域餘數
    return g;
  }

  function spawnEnemies() {
    var src = Room.enemySpawns(), out = [], i;
    for (i = 0; i < src.length; i++) {
      var s = src[i];
      out.push({
        id: i, x: FX.Vec(s.x), y: s.y, band: s.band,
        min: s.min, max: s.max, dir: s.dir, alive: true
      });
    }
    return out;
  }

  /* ------------------------------------------------------------ 碰撞工具 */

  function solid(x, y) { return Room.solidAtPx(x, y); }

  // 主角矩形（左上角 x,y、16×24）在水平方向是否卡到磁磚
  function hitsH(x, y) {
    return solid(x, y) || solid(x, y + 11) || solid(x, y + HERO_H - 1);
  }

  /* -------------------------------------------------------------- update */

  function stepPlayer(nes) {
    var input = nes.input || NES.Input;
    var right = input.held(BTN.RIGHT), left = input.held(BTN.LEFT);
    var runBtn = input.held(BTN.B), aHeld = input.held(BTN.A);
    var dir = (right ? 1 : 0) - (left ? 1 : 0);

    // --- 水平加速 / 摩擦（SMB：空中要 |vx| ≥ $19 才沿用跑步參數）---
    var maxSpd, acc;
    if (g.onGround) {
      maxSpd = runBtn ? SMB.maxRun : SMB.maxWalk;
      acc = runBtn ? SMB.accRun : SMB.accWalk;
    } else if (FX.abs(g.vx.v) >= SMB.airRunSpeed) {
      maxSpd = SMB.maxRun; acc = SMB.accRun;
    } else {
      maxSpd = SMB.maxWalk; acc = SMB.accWalk;
    }
    if (dir !== 0) {
      if (g.vx.v !== 0 && FX.sign(g.vx.v) === -dir) acc = acc << SMB.turnShift;  // 轉身 / 煞車 ×2
      FX.aapproach(g.vx, dir * maxSpd, acc);
      g.facing = dir;
    } else if (g.onGround) {
      FX.aapproach(g.vx, 0, SMB.friction);
    }

    // --- 起跳（依水平速度選 5 段之一；規則在 NES.FX.SMB，core 測試用同一份）---
    if (g.onGround && input.pressed(BTN.A)) {
      SMB.jumpStart(g.jumpS, FX.abs(g.vx.v), g.py.sub);
      g.onGround = false;
      g.jumpApexSub = g.py.sub;
      Audio.jump(nes);
      g.lastSfx = 'jump';
    }

    // --- 重力（按住 A = 小重力；放開且已離地 ≥ 1px = 大重力；起跳首幀半格重力）---
    if (!g.onGround) SMB.jumpGravity(g.jumpS, aHeld, g.py.sub, MAX_FALL);

    // --- 移動 X + 磁磚碰撞（位置單位 1/16 px）---
    g.prevFeet = FX.floorPx(g.py.sub) + HERO_H;
    FX.vadd(g.px, g.vx.v);
    var x = FX.floorPx(g.px.sub), y = FX.floorPx(g.py.sub);
    if (g.vx.v > 0) {
      if (hitsH(x + HERO_W - 1, y)) {
        x = (((x + HERO_W - 1) >> 3) << 3) - HERO_W;
        FX.vsetPx(g.px, x); FX.aset(g.vx, 0);
      }
    } else if (g.vx.v < 0) {
      if (hitsH(x, y)) {
        x = ((x >> 3) + 1) << 3;
        FX.vsetPx(g.px, x); FX.aset(g.vx, 0);
      }
    }
    // 相機單向鎖 ⇒ 主角被螢幕左緣擋住（SMB 行為）；右邊是關卡盡頭
    if (x < g.camX) { x = g.camX; FX.vsetPx(g.px, x); if (g.vx.v < 0) FX.aset(g.vx, 0); }
    if (x > Room.W_PX - HERO_W) { x = Room.W_PX - HERO_W; FX.vsetPx(g.px, x); FX.aset(g.vx, 0); }

    // --- 移動 Y + 磁磚碰撞 ---
    FX.vadd(g.py, g.vy.v);
    y = FX.floorPx(g.py.sub);
    if (g.vy.v >= 0) {
      var feet = y + HERO_H;
      if (solid(x, feet) || solid(x + HERO_W - 1, feet)) {
        y = ((feet >> 3) << 3) - HERO_H;
        FX.vsetPx(g.py, y); FX.aset(g.vy, 0);
        g.onGround = true;
      } else {
        g.onGround = false;
      }
    } else {
      g.onGround = false;
      if (solid(x, y) || solid(x + HERO_W - 1, y)) {
        y = ((y >> 3) + 1) << 3;
        FX.vsetPx(g.py, y); FX.aset(g.vy, 0);
      }
    }
    if (g.py.sub < g.jumpApexSub) g.jumpApexSub = g.py.sub;

    // --- 走路動畫（1→2→1→3；速度越快換格越快）---
    if (!g.onGround) {
      g.anim = 2;
    } else if (g.vx.v !== 0) {
      var delay = FX.abs(g.vx.v) >= SMB.maxWalk ? 2 : 4;
      if (++g.animTimer >= delay) { g.animTimer = 0; g.anim = (g.anim + 1) & 3; }
    } else {
      g.anim = 0; g.animTimer = 0;
    }

    if (g.inv > 0) g.inv--;
  }

  function stepEnemies(nes) {
    var camL = g.camX - 96, camR = g.camX + SCREEN_W + 96;
    for (var i = 0; i < g.enemies.length; i++) {
      var e = g.enemies[i];
      if (!e.alive) continue;
      var ex = FX.floorPx(e.x.sub);
      if (ex < camL || ex > camR) continue;              // 畫面外不更新（真機也只跑畫面附近）
      FX.vadd(e.x, e.dir * SMB.enemySlow);
      ex = FX.floorPx(e.x.sub);
      if (ex <= e.min) { FX.vsetPx(e.x, e.min); e.dir = 1; }
      else if (ex >= e.max) { FX.vsetPx(e.x, e.max); e.dir = -1; }
    }
  }

  function stepCollisions(nes) {
    var hx = FX.floorPx(g.px.sub), hy = FX.floorPx(g.py.sub);
    for (var i = 0; i < g.enemies.length; i++) {
      var e = g.enemies[i];
      if (!e.alive) continue;
      var ex = FX.floorPx(e.x.sub);
      if (hx + HERO_W <= ex || ex + ENEMY_W <= hx) continue;
      if (hy + HERO_H <= e.y || e.y + ENEMY_H <= hy) continue;
      if (g.vy.v > 0 && g.prevFeet <= e.y + 8) {
        // 踩到 → 消失 + 計分 + coin 音效（搶 p2 聲道）
        e.alive = false;
        g.stomps++;
        g.score += STOMP_SCORE;
        g.hudDirty = true;
        SMB.jumpBounce(g.jumpS, BOUNCE, g.py.sub);   // 回彈不是新的一次跳躍（不套首幀半重力）
        g.onGround = false;
        Audio.coin(nes);
        g.lastSfx = 'coin';
      } else if (g.inv === 0) {
        g.inv = INV_FRAMES;                              // 側面接觸 → 閃爍無敵 60 幀
        g.hits++;
      }
    }
  }

  function stepCamera(nes) {
    var hx = FX.floorPx(g.px.sub);
    var want = hx - CAM_TRIGGER;
    if (want > g.camX) g.camX = want;                    // 單向鎖：永不往左捲
    if (g.camX > Room.CAM_MAX) g.camX = Room.CAM_MAX;
    if (g.camX < 0) g.camX = 0;
  }

  // 相機往右走時補名稱表欄（每幀最多 1~2 欄，模擬 VBlank 寫入預算）
  function feedColumns(ppu) {
    var target = (g.camX >> 3) + 34;
    if (target > Room.COLS - 1) target = Room.COLS - 1;
    while (g.writtenTo < target) {
      g.writtenTo++;
      Room.writeColumn(ppu, g.writtenTo);
    }
  }

  /* ---------------------------------------------------------------- draw */

  function drawHero(ppu) {
    var hidden = g.inv > 0 && (g.inv & 2) !== 0;         // 無敵閃爍：2 幀顯示 / 2 幀隱藏
    if (hidden) {
      for (var i = 0; i < 4; i++) ppu.sprite(i, null);
      return;
    }
    var sx = FX.floorPx(g.px.sub) - g.camX;
    var sy = FX.floorPx(g.py.sub);
    var f = C.walk[g.anim & 3];
    var tl = C.S.HERO_TOP_L, tr = C.S.HERO_TOP_R;
    var bl = C.S.HERO_LEG_L[f], br = C.S.HERO_LEG_R[f];
    var flip = g.facing < 0;
    ppu.sprite(0, { x: sx, y: sy, tile: flip ? tr : tl, pal: 0, flipH: flip });
    ppu.sprite(1, { x: sx + 8, y: sy, tile: flip ? tl : tr, pal: 0, flipH: flip });
    ppu.sprite(2, { x: sx, y: sy + 16, tile: flip ? br : bl, pal: 0, flipH: flip });
    ppu.sprite(3, { x: sx + 8, y: sy + 16, tile: flip ? bl : br, pal: 0, flipH: flip });
  }

  // 敵人：依掃描線帶分組，組內每幀旋轉 ROT_STEP 隻再寫 OAM。
  // PPU 每線只畫 8 個 ⇒ 同一帶（12 個精靈）每幀只畫得下 3~4 隻，
  // 旋轉讓「連續兩幀的聯集」涵蓋整組 ⇒ 真機式閃爍。
  var bandBuf = [[], []];
  function drawEnemies(ppu) {
    bandBuf[0].length = 0; bandBuf[1].length = 0;
    var i, e, sx;
    for (i = 0; i < g.enemies.length; i++) {
      e = g.enemies[i];
      if (!e.alive) continue;
      sx = FX.floorPx(e.x.sub) - g.camX;
      if (sx <= -ENEMY_W || sx >= SCREEN_W) continue;
      bandBuf[e.band].push(e);
    }
    var slot = 4, rot = g.frames * ROT_STEP;
    for (var b = 0; b < 2; b++) {
      var arr = bandBuf[b], n = arr.length;
      for (var k = 0; k < n && slot <= 62; k++) {
        e = arr[(k + rot) % n];
        sx = FX.floorPx(e.x.sub) - g.camX;
        ppu.sprite(slot++, { x: sx, y: e.y, tile: C.S.ENEMY_L, pal: 1 });
        ppu.sprite(slot++, { x: sx + 8, y: e.y, tile: C.S.ENEMY_R, pal: 1 });
      }
    }
    for (; slot < 64; slot++) ppu.sprite(slot, null);
  }

  /* ---------------------------------------------------------------- GAME */

  var GAME = {
    init: function (nes) {
      var ppu = nes.ppu;
      resetState();
      C.setPatterns();
      C.applyPalettes(ppu);
      ppu.mirroring('v');                 // 水平捲動 ⇒ 左右兩張名稱表不同
      ppu.spriteMode(16);                 // 8×16：主角 16×24、敵人 16×16
      ppu.flicker = 'rotate';
      ppu.flickerStep = 0;                // OAM 輪替改由遊戲自己做（真機驅動的作法，可重現）
      ppu.setPatternTables(0, 1);

      Room.init();
      g.enemies = spawnEnemies();

      Room.drawHudStatic(ppu);
      Room.drawHudValues(ppu, g.score, g.time, g.world);
      g.hudDirty = false;

      g.writtenTo = -1;
      feedColumns(ppu);
      Room.drawTitle(ppu);

      ppu.scroll(0, 0, 0);
      ppu.split(Room.SPLIT_LINE, { x: 0, y: Room.SPLIT_LINE, nt: 0 });

      Audio.init(nes);
      Audio.play(nes);
    },

    update: function (nes) {
      var input = nes.input || NES.Input;
      g.frames++;
      if (g.mode === 'title') {
        if (input.pressed(BTN.START) || input.pressed(BTN.A)) {
          g.mode = 'play';
          Room.clearTitle(nes.ppu);
        }
      } else {
        stepPlayer(nes);
        stepEnemies(nes);
        stepCollisions(nes);
        stepCamera(nes);
        feedColumns(nes.ppu);
        if (++g.timeTick >= SMB.intervalTimer) {          // 21 幀一跳（SMB framerule）
          g.timeTick = 0;
          if (g.time > 0) { g.time--; g.hudDirty = true; }
        }
      }
      Audio.tick(nes);                                    // 契約：music.tick() 由遊戲呼叫
    },

    draw: function (nes) {
      var ppu = nes.ppu;
      if (g.hudDirty) {
        Room.drawHudValues(ppu, g.score, g.time, g.world);
        g.hudDirty = false;
      }
      ppu.scroll(0, 0, 0);                                // 上段（狀態列）固定
      ppu.split(Room.SPLIT_LINE, { x: g.camX % 512, y: Room.SPLIT_LINE, nt: 0 });
      drawHero(ppu);
      drawEnemies(ppu);
    },

    state: function () {
      var alive = 0, list = [], i;
      for (i = 0; i < g.enemies.length; i++) {
        var e = g.enemies[i];
        if (!e.alive) continue;
        alive++;
        var ex = FX.floorPx(e.x.sub);
        list.push({ id: e.id, x: ex, y: e.y, band: e.band, sx: ex - g.camX });
      }
      return {
        mode: g.mode,
        gameFrames: g.frames,
        x: FX.floorPx(g.px.sub), y: FX.floorPx(g.py.sub),
        xSub: g.px.sub, ySub: g.py.sub,
        vx: g.vx.v, vy: g.vy.v,
        vxPx: FX.velToPx(g.vx.v), vyPx: FX.velToPx(g.vy.v),
        onGround: g.onGround, facing: g.facing,
        fastFall: g.jumpS.fastFall, skipFirstGravity: g.jumpS.skipFirst,
        inv: g.inv, anim: g.anim,
        apexSub: g.jumpApexSub, apexPx: FX.toPx(g.jumpApexSub),
        camX: g.camX, screenX: FX.floorPx(g.px.sub) - g.camX,
        enemies: alive, enemyList: list,
        score: g.score, time: g.time, world: g.world,
        stomps: g.stomps, hits: g.hits, lastSfx: g.lastSfx,
        music: Audio.state(nes0)
      };
    }
  };

  // state() 需要 nes 才能問 music driver；boot 時記下來
  var nes0 = null;
  var _init = GAME.init;
  GAME.init = function (nes) { nes0 = nes; _init(nes); };

  DEMO.GAME = GAME;
  window.GAME = GAME;
})();

</script>

<script>
// ---- 啟動：桌機整數放大置中 / 手機小數倍貼齊、鍵盤焦點、F 全螢幕、觸控覆蓋層版面 ----
(function () {
  var W = 256, H = 224;                 // 顯示尺寸（PPU 內部 240 列，裁上下各 8）
  var canvas = document.getElementById('nes');
  var hint = document.getElementById('hint');
  var q = new URLSearchParams(location.search);
  var debug = q.get('debug') === '1';
  var forced = parseInt(q.get('scale') || '0', 10) || 0;   // ?scale=1 供截圖工具用（＝維持桌機整數倍行為）
  // 橫向手機：左右各留 110px 給觸控按鍵；平板（短邊 ≥ 500）各留 170px
  var RESERVE_PHONE = 220, RESERVE_TABLET = 340;

  // ---- safe-area 探針（讀 env(safe-area-inset-*) 的實際 px；不支援就全 0） ----
  var probe = null;
  function safeArea() {
    var z = { t: 0, r: 0, b: 0, l: 0 };
    try {
      if (!probe) {
        if (!document.body) return z;
        probe = document.createElement('div');
        probe.id = 'nes-safe-probe';
        probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;' +
          'padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);' +
          'padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);';
        document.body.appendChild(probe);
      }
      var cs = getComputedStyle(probe);
      z.t = parseFloat(cs.paddingTop) || 0; z.r = parseFloat(cs.paddingRight) || 0;
      z.b = parseFloat(cs.paddingBottom) || 0; z.l = parseFloat(cs.paddingLeft) || 0;
    } catch (e) { }
    return z;
  }
  function isTouch() {
    try { return (navigator.maxTouchPoints | 0) > 0 || ('ontouchstart' in window); } catch (e) { return false; }
  }
  function viewport() {
    var vv = window.visualViewport;
    return { w: (vv && vv.width) || window.innerWidth || 320, h: (vv && vv.height) || window.innerHeight || 480 };
  }

  // fit() → {s 顯示倍率（可小數）, back backing store 倍率（整數）, mobile, portrait, sa, vw, vh}
  function fit() {
    var v = viewport(), sa = safeArea();
    var vw = v.w, vh = v.h;
    var portrait = vh >= vw;
    var mobile = !forced && (isTouch() || Math.min(vw, vh) < 600);
    var full = Math.min(vw / W, vh / H);        // 完整塞進視窗的最大倍率
    var s;
    if (forced) {
      s = forced;                               // ?scale=N：完全照舊（截圖工具可重現）
    } else if (mobile) {
      if (portrait) {
        s = vw / W;                             // 直向：寬度填滿、貼上方（下面整片給按鍵）
        var maxH = Math.max(1, vh - sa.t);
        if (H * s > maxH) s = maxH / H;
      } else {
        // 橫向：高度填滿為主，左右各留出按鍵空間；留不出來（小視窗）就整個塞滿
        var reserve = (Math.min(vw, vh) >= 500 ? RESERVE_TABLET : RESERVE_PHONE) + sa.l + sa.r;
        var side = Math.min(vh / H, (vw - reserve) / W);
        s = (side > 0 && side >= full * 0.6) ? side : full;
      }
    } else {
      s = Math.max(1, Math.floor(full));        // 桌機：維持整數倍
    }
    s = Math.max(0.5, s);
    // backing store 一律整數（nes.setScale 只改 backing store 且只收整數，QA R1 P2-1）；
    // 小數倍時 backing 取 ceil（畫得比顯示大一點），再用 CSS 縮到目標尺寸 + pixelated。
    var back = forced ? forced : Math.max(1, Math.min(4, Math.ceil(s - 0.0001)));
    return { s: s, back: back, mobile: mobile, portrait: portrait, sa: sa, vw: vw, vh: vh };
  }

  function place(f) {
    var cw = W * f.s, ch = H * f.s;
    if (f.mobile) { cw = Math.round(cw * 2) / 2; ch = Math.round(ch * 2) / 2; }
    else { cw = Math.round(cw); ch = Math.round(ch); }
    var x = (f.vw - cw) / 2, y = (f.vh - ch) / 2;
    if (f.mobile && f.portrait) y = f.sa.t;                 // 直向貼上方
    if (f.mobile) { x = Math.round(x * 2) / 2; y = Math.round(y * 2) / 2; }
    else { x = Math.floor(x); y = Math.floor(y); }
    canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
    canvas.style.left = x + 'px'; canvas.style.top = y + 'px';
    // 觸控覆蓋層（engine/touch.js）靠這份版面資訊排版
    window.NES_LAYOUT = {
      x: x, y: y, w: cw, h: ch, scale: f.s, back: f.back,
      portrait: f.portrait, mobile: f.mobile, safe: f.sa, vw: f.vw, vh: f.vh
    };
    try { window.dispatchEvent(new Event('nes-resize')); } catch (e) { }
  }

  if (!window.NES || typeof NES.boot !== 'function') {
    hint.style.display = 'block';
    hint.textContent = 'engine/nes.js 未載入';
    return;
  }

  var f = fit();
  var game = window.GAME || NES.game || null;
  var nes = NES.boot({ canvas: canvas, game: game, scale: f.back });
  place(f);

  function apply() {
    var g = fit();
    if (g.back !== nes.scale) nes.setScale(g.back);
    place(g);
  }
  function applySoon() { apply(); setTimeout(apply, 120); }   // iOS 旋轉 / 工具列收合後尺寸會延遲 ⇒ 二次觸發
  window.addEventListener('resize', apply);
  window.addEventListener('orientationchange', applySoon);
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', applySoon);
  }
  // 切到背景 / 鎖螢幕：一定要把按鍵放掉，不然回來會卡住一個方向
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) return;
    try { if (NES.Touch && NES.Touch.releaseAll) NES.Touch.releaseAll(); } catch (e) { }
    try { if (NES.Input && NES.Input.inject) NES.Input.inject(0, 0); } catch (e) { }
  });

  // 鍵盤焦點：canvas 可聚焦，點畫面或載入完成都聚焦；方向鍵 / 空白鍵不捲頁
  function focus() { try { canvas.focus({ preventScroll: true }); } catch (e) { canvas.focus(); } }
  focus();
  window.addEventListener('pointerdown', focus);
  window.addEventListener('keydown', function (e) {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].indexOf(e.code) >= 0) e.preventDefault();
    // F = 全螢幕切換（不佔用遊戲按鍵；瀏覽器拒絕時安靜失敗）
    if (e.code === 'KeyF' && !e.ctrlKey && !e.altKey && !e.metaKey) {
      e.preventDefault();
      try {
        if (!document.fullscreenElement) {
          var p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
          if (p && p.catch) p.catch(function () { });
        } else {
          var q2 = document.exitFullscreen && document.exitFullscreen();
          if (q2 && q2.catch) q2.catch(function () { });
        }
      } catch (err) { }
    }
  });
  document.addEventListener('fullscreenchange', function () { setTimeout(apply, 60); });

  // ?touch=1 / ?touch=0：強制顯示 / 隱藏觸控按鍵（桌機截圖與測試用）
  try {
    var tq = q.get('touch');
    if (tq === '1' && NES.Touch && NES.Touch.show) NES.Touch.show();
    else if (tq === '0' && NES.Touch && NES.Touch.hide) NES.Touch.hide();
  } catch (e) { }

  // 缺模組 / debug 時在底部列出狀態（正式遊玩畫面不顯示）
  if (debug || (nes.missing && nes.missing.length)) {
    hint.style.display = 'block';
    hint.textContent = 'NES ' + NES.VERSION + ' scale=' + nes.scale
      + (nes.missing && nes.missing.length ? '  缺: ' + nes.missing.join(' ') : '  模組齊全')
      + (game ? '' : '  (無 game，空畫面)')
      + (debug ? '  __nes 可用' : '');
  }
  window.nes = nes;
})();
</script>
