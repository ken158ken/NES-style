  /* ============================== 狀態 ============================== */
  function newState() {
    return {
      mode: 'title', sub: '', scene: 'room', items: [], f: {}, visits: {}, q: [], after: null,
      paused: false, t: 0, cheats: 0, runCheats: 0, goalHit: false, snap: null, ending: null, endT: 0,
      prompting: false, ask: null, hints: 0, lastMsg: '', picInfo: null, sprites: [], menuKind: '', loc: '',
      bot: { wait: 0, i: 0, part: 0, typeT: 0 }, autoKey: '', autoSaves: 0, retries: 0
    };
  }

  /* ============================== 畫面：bank / 場景圖 / 精靈 ============================== */
  function buildBanks(nes) {
    var blank = ['........', '........', '........', '........', '........', '........', '........', '........'];
    var obj = { SP: blank };
    for (var i = 0; i < A.Art.PIC_SLOTS; i++) obj['PIC' + i] = blank;
    CT.Text.reserve(obj, POOL);
    bankBg = NES.CHR.bank('adventure_bg', obj);
    SB = A.Art.sprBank();
    NES.CHR.setPattern(0, 'adventure_bg');
    NES.CHR.setPattern(1, 'adventure_spr');
    ppu0.setPatternTables(0, 1);
    ppu0.spriteMode(8);
    ppu0.flicker = 'none';
    T = CT.Text.create(nes, { bank: bankBg, nt: 0, fg: 3, bg: 0, shadow: 0, frame1: 1, frame2: 2 });
    box = T.box({ x: BOX.x, y: BOX.y, w: BOX.w, h: BOX.h, speed: 2 });
  }
  function drawPic(pic, x0, y0) {
    var base = bankBg.index('PIC0'), i;
    for (i = 0; i < pic.tiles.length; i++) {
      var t = bankBg.tiles[base + i], src = pic.tiles[i];
      for (var k = 0; k < 64; k++) t[k] = src[k];
    }
    for (var cy = 0; cy < pic.h; cy++) for (var cx = 0; cx < pic.w; cx++) ppu0.setTile(0, x0 + cx, y0 + cy, base + pic.map[cy * pic.w + cx]);
    var bw = pic.w >> 1, bh = pic.h >> 1;
    for (var by = 0; by < bh; by++) for (var bx = 0; bx < bw; bx++) ppu0.setAttr(0, (x0 >> 1) + bx, (y0 >> 1) + by, pic.attr[by * bw + bx]);
    ppu0.setBgPalette(0, A.Art.TEXT_PAL);
    for (i = 0; i < 3; i++) ppu0.setBgPalette(i + 1, pic.pals[i]);
  }
  // 整片重畫（關畫面）：清名稱表 / 屬性 → 場景圖 → 位置名
  function repaint(picId, variant, loc, x0) {
    var pic = A.Art.picture(picId, variant);

    CT.blank(nes0, function () {
      ppu0.setBackdrop(0x0F);
      ppu0.fillTiles(0, 0, 0, 32, 30, 0);
      ppu0.fillAttr(0, 0, 0, 16, 15, 0);
      T.reset();
      box.close({ erase: false });
      box.active = true;
      if (menu) { T.remove(menu); menu = null; }
      if (scroll) { T.remove(scroll); scroll = null; }
      drawPic(pic, x0 === undefined ? PIC_X : x0, PIC_Y);
      g.loc = loc || '';
      if (loc) T.print(LOC.x, LOC.y, loc);
      T.flush();
    });
    g.prompting = false;
  }
  function paintScene() { repaint(S().pic, variantOf(g.scene), S().name); setSprites(); }

  // 場景精靈：[{k, x, y, behind}]（x / y = 場景圖內 px）
  function sceneSprites() {
    var f = g.f, L = [], sc = g.scene;
    if (sc === 'room') { if (!f.lampTaken) L.push({ k: 'lamp', x: 100, y: 64 }); if (!f.letterTaken) L.push({ k: 'bag', x: 116, y: 65 }); }
    if (sc === 'plaza') { L.push({ k: 'cat', x: 24, y: 84 }); if (!f.gotGear) L.push({ k: 'glint', x: 92, y: 90, blink: true }); }
    if (sc === 'dock') L.push({ k: 'ou', x: 22, y: 58 });
    if (sc === 'tower') L.push({ k: 'xia', x: 58, y: 74 });
    if (sc === 'top' && !f.lit && !f.relit) { L.push({ k: 'glint', x: 64, y: 62, blink: true }); }
    if (sc === 'clock') { L.push({ k: 'gear', x: 64, y: 57 }); if (!f.fixed) L.push({ k: 'mbox', x: 32, y: 72 }); }
    if (sc === 'obs') L.push({ k: 'lila', x: 116, y: 72 });
    if (sc === 'woods' && f.lit) { L.push({ k: 'glint', x: 70, y: 70, blink: true }); }
    if (sc === 'deep') {
      if (!f.calm && !f.grab) L.push({ k: 'glow', x: 106, y: 62, blink: true });
      else if (f.calm && !f.follow && !f.grab) L.push({ k: 'kid', x: 114, y: 58, anim: true });
    }
    if (sc === 'bridge') L.push({ k: 'kid', x: 58, y: 34, anim: true });
    if (f.follow && sc !== 'bridge') L.push({ k: 'kid', x: 124, y: 84, anim: true });
    if (g.items.indexOf('lamp') >= 0 && f.lit && sc !== 'bridge') L.push({ k: 'lampLit', x: 4, y: 100 });
    return L;
  }
  var UI_SPR = { glint: 1, dot: 1, star: 1, core: 1 };
  function setSprites(list) {
    list = list || sceneSprites();
    var slots = [], out = [];
    list.forEach(function (s) {
      var def = A.Art.SPR[s.k], pal;
      if (UI_SPR[s.k]) pal = 3;
      else {
        var key = def.pal.join(',');
        pal = slots.indexOf(key);
        if (pal < 0) { if (slots.length < 3) { slots.push(key); pal = slots.length - 1; } else pal = 2; }
      }
      out.push({ k: s.k, x: s.x, y: s.y, pal: pal, behind: !!s.behind, blink: !!s.blink, anim: !!s.anim });
    });
    g.sprites = out;
    CT.blank(nes0, function () {
      for (var i = 0; i < 3; i++) {
        ppu0.setSprPalette(i, slots[i] ? slots[i].split(',').map(Number) : SPR_UI_PAL);
      }
      ppu0.setSprPalette(3, SPR_UI_PAL);
    });
  }
  function drawSprites() {
    ppu0.clearSprites();
    if (!g || !SB) return;
    var n = 0, ox = (g.mode === 'title' ? TITLE_X : PIC_X) * 8, oy = PIC_Y * 8;
    for (var i = 0; i < g.sprites.length; i++) {
      var s = g.sprites[i];
      if (s.blink && ((g.t >> 4) & 3) === 3) continue;
      var k = s.k;
      if (s.anim && k === 'kid' && ((g.t >> 4) & 1)) k = 'kid2';
      var parts = SB.parts[k] || [];
      for (var j = 0; j < parts.length && n < 60; j++) {
        var q = parts[j];
        ppu0.sprite(n++, { x: ox + s.x + q.dx, y: oy + s.y + q.dy + ((s.anim && ((g.t >> 5) & 1)) ? -1 : 0), tile: q.tile, pal: s.pal, behind: s.behind });
      }
    }
  }

  /* ============================== 選單 ============================== */
  function closeMenu() {
    if (!menu) return;
    menu.close(); T.remove(menu); menu = null; g.menuKind = '';
  }
  function openMenu(kind, items, onChoose, opt) {
    opt = opt || {};
    closeMenu();
    g.menuKind = kind;
    var m = T.menu({ x: opt.x === undefined ? MENU.x : opt.x, y: opt.y === undefined ? MENU.y : opt.y, w: opt.w || MENU.w, h: opt.h || MENU.h,
      items: items, cancel: opt.cancel !== false, sel: opt.sel | 0,
      onMove: function (k) { sfx('adv_move'); if (opt.onMove) opt.onMove(k); },
      onChoose: function (k) {
        if (k < 0) { sfx('adv_cancel'); closeMenu(); if (opt.onCancel) opt.onCancel(); return; }
        sfx('adv_ok'); closeMenu(); onChoose(k);
      } });
    m.open();
    menu = m;
    return m;
  }

  /* ============================== 劇本直譯器 ============================== */
  function run(steps, after) {
    closeMenu();

  }
  function say(text, name) {

    box.say(text, { name: name || null, onClose: next });
  }

    while (g.q.length) {
      var s = g.q.shift();
      if (typeof s === 'function') { g.q = resolve(s).concat(g.q); continue; }
      if (typeof s === 'string') { say(s, null); return; }
      if (Array.isArray(s)) { say(s[1], s[0]); return; }
      if (!s) continue;
      if (s.give) {
        if (g.items.indexOf(s.give) < 0) g.items.push(s.give);
        sfx('adv_item');
        say(U().gotItem(A.ITEMS[s.give].name), null);
        setSprites();
        return;
      }
      if (s.take) { var k = g.items.indexOf(s.take); if (k >= 0) g.items.splice(k, 1); setSprites(); continue; }
      if (s.set) { g.f[s.set] = true; setSprites(); continue; }
      if (s.clr) { delete g.f[s.clr]; continue; }
      if (s.sfx) { sfx(s.sfx); continue; }
      if (s.bgm) { Au.play(s.bgm); continue; }
      if (s.pic) { paintScene(); continue; }
      if (s.ask) { g.sub = 'askwait'; g.ask = s; say(s.ask, s.name); return; }
      if (s.go) { goScene(s.go); continue; }
      if (s.end) { g.q = []; g.after = null; startEnding(s.end); return; }
      if (s.fn) { var r = s.fn(api()); if (r) g.q = resolve(r).concat(g.q); continue; }
    }
    var a = g.after; g.after = null;
    if (a) a(); else toCmd();
  }
  function goScene(id) {
    g.scene = id;
    var first = !g.visits[id];
    g.visits[id] = (g.visits[id] || 0) + 1;
    paintScene();
    sfx('adv_door');
    if (!(g.ending) && S().bgm && !(g.scene === 'top' && g.f.relit)) Au.play(S().bgm);
    if (first && S().enter) g.q = resolve(S().enter).concat(g.q);
  }
  function openAsk() {
    var s = g.ask;
    g.sub = 'ask';
    openMenu('ask', s.opts, function (k) {
      g.sub = 'script'; g.ask = null;
      g.q = resolve(s.then[k] || []).concat(g.q);

    }, { cancel: false });
  }

  /* ============================== 指令 ============================== */
  function promptBox() {
    box.active = false;
    g.prompting = true;

  }
  function toCmd(sel) {

  }
  function sub(kind, items, fn, cmdIdx) {
    g.sub = 'sub';
    openMenu(kind, items, fn, { onCancel: function () { toCmd(cmdIdx); } });
  }
  function doCmd(k) {

    if (k === 0) {                     // 調查
      var objs = visibleObjs();
      sub('look', [U().around].concat(objs.map(function (o) { return o.n; })), function (i) {
        if (i === 0) run(sc.look); else run(objs[i - 1].look || [U().noUse]);
      }, k);
    } else if (k === 1) {              // 移動
      var ex = sc.exits;
      sub('move', ex.map(function (e) { return A.SCENES[e.to].label; }), function (i) {
        var e = ex[i], block = e.need ? e.need(G) : null;
        if (block) run(block); else run([{ go: e.to }]);
      }, k);
    } else if (k === 2) {              // 交談
      var ppl = visiblePeople();
      if (!ppl.length) { run([U().noTalk]); return; }
      if (ppl.length === 1) { run(ppl[0].talk); return; }
      sub('talk', ppl.map(function (p) { return p.n; }), function (i) { run(ppl[i].talk); }, k);
    } else if (k === 3) {              // 拿取
      var tk = visibleObjs().concat(visiblePeople());
      sub('take', tk.map(function (o) { return o.n; }), function (i) {
        var o = tk[i];
        if (o.take) run(o.take);
        else if (o.talk) run(['不能把人帶走啦。']);
        else run([U().noTake[g.t % U().noTake.length]]);
      }, k);
    } else if (k === 4 || k === 5) {   // 使用 / 物品
      if (!g.items.length) { run([U().noItem]); return; }
      var its = g.items.slice();
      sub(k === 4 ? 'use' : 'item', its.map(function (id) { return A.ITEMS[id].name; }), function (i) {
        var id = its[i], it = A.ITEMS[id];
        if (k === 5) { run([typeof it.desc === 'function' ? it.desc(G) : it.desc]); return; }
        var r = sc.use ? sc.use(G, id) : null;
        if (r) run(r);
        else run([typeof it.nouse === 'function' ? it.nouse(G) : (it.nouse || U().noUse)]);
      }, k);
    } else {                           // 系統
      sub('sys', U().sys, function (i) {
        if (i === 0) showHint();
        else if (i === 1) slotMenu(true);
        else {
          g.sub = 'askwait';
          g.ask = { ask: U().toTitle, opts: U().yesNo, then: [[{ fn: function () { toTitle(); return null; } }], []] };
          g.q = []; g.after = null;
          say(U().toTitle, null);
        }
      }, k);
    }
  }
  function hintText() {
    var G = api();
    for (var i = 0; i < A.HINTS.length; i++) if (!A.HINTS[i].done(G)) return A.HINTS[i].text;

  }
  function showHint() {
    g.hints++;
    sfx('adv_hint');
    run([[A.HINT_HEAD, hintText()]]);
  }
  // 自動存檔（fix-r9-text，qa-r9 P3-2）：回到指令選單時（= 穩定的決策點），只要「地點 / 物品 / 旗標」跟上次自動存的不同
  // （進了新地點、拿到東西、劇情推進）就存到 auto 格；標題「繼續遊戲」→「自動」讀取。結局 / 選擇題中途不存。
  function progressKey(p) { return p.scene + '|' + p.items.join(',') + '|' + Object.keys(p.f).filter(function (k) { return p.f[k]; }).sort().join(','); }
  function autoSave(p) {
    if (g.mode !== 'play' || g.ending) return false;
    var key = progressKey(p);
    if (key === g.autoKey) return false;
    g.autoKey = key; g.autoSaves++;
    CT.save(ID, 'auto', p);
    return true;
  }
  function slotKey(k) { return k === 0 ? 'auto' : 'slot' + k; }     // 讀檔選單：0 = 自動、1~3 = 手動格
  function slotLabel(n) {
    var d = CT.load(ID, 'slot' + n, null);
    return d && A.SCENES[d.scene] ? '第' + n + '格：' + A.SCENES[d.scene].name : '第' + n + '格：' + U().slotEmpty;
  }
  function slotMenu(saving) {
    g.sub = 'sub';
    var items = [], n;
    for (n = 1; n <= SLOTS; n++) items.push('第' + n + '格');
    var info = function (k) {
      box.say(slotLabel(k + 1), { name: null, speed: 1 });
      box.active = false; g.prompting = true;
    };
    openMenu('slot', items, function (k) {
      if (saving) {
        CT.save(ID, 'slot' + (k + 1), g.snap || progress());
        sfx('adv_save');
        run([U().saved(k + 1)]);
      }
    }, { onCancel: function () { toCmd(6); }, onMove: info });
    info(0);
  }

  /* ============================== 結局 ============================== */
  function endingDef(id) { return A.ENDINGS.filter(function (e) { return e.id === id; })[0]; }
  function startEnding(id) {
    var e = endingDef(id);
    closeMenu();
    g.ending = e; g.mode = 'ending'; g.sub = 'script'; g.endT = 0;
    var mask = CT.load(ID, 'endings', 0) | (1 << (e.no - 1));
    CT.save(ID, 'endings', mask);
    repaint(e.pic, e.variant, U().endHead);
    var spr = [];
    if (e.id === 'travel') spr.push({ k: 'kid', x: 74, y: 26, anim: true });
    if (e.id === 'true') spr.push({ k: 'star', x: 100, y: 22, blink: true });
    setSprites(spr);
    Au.stop(); Au.play(e.bgm);
    run(e.steps, function () {
      if (e.id === 'true' && g.runCheats === 0) g.goalHit = true;
      g.mode = 'card'; g.sub = 'card';
      // 壞結局：A = 回到剛才的選擇（不算密技、goal 照算）、B = 回標題；其他結局 A = 片尾 / 標題
      var retry = e.kind === 'bad' && g.snap;
      var tail = retry ? U().retryTail : U().theEnd;
      say(U().endHead + ' ' + e.no + '／' + A.ENDINGS.length + '\n' + e.name + '\n' + tail, U().endHead);
      g.q = []; g.after = function () { if (e.id === 'true') startCredits(); else if (retry) backToChoice(false); else toTitle(); };
    });
  }
  function startCredits() {
    g.mode = 'credits'; g.sub = 'credits'; g.endT = 0;
    box.close({ erase: true });
    scroll = T.scroll({ x: 4, y: 20, w: 24, h: 8, auto: 22, input: false });
    scroll.setText(A.CREDITS);
  }

  /* ============================== 標題 / 說明 / 結局一覽 ============================== */
  function endingsMask() { return CT.load(ID, 'endings', 0) | 0; }
  function endingsCount() { var m = endingsMask(), n = 0; for (var i = 0; i < 8; i++) if (m & (1 << i)) n++; return n; }
  function toTitle() {
    g.mode = 'title'; g.sub = 'title'; g.paused = false; g.ending = null; g.q = []; g.after = null;
    repaint('title', '', '', TITLE_X);
    setSprites([{ k: 'star', x: 96, y: 54 }]);
    T.print(9, 16, U().subtitle);
    T.print(22, 21, U().endHead);
    T.print(22, 23, endingsCount() + '/' + A.ENDINGS.length);
    Au.stop(); Au.play('adv_title');
    titleMenu();
  }
  function titleMenu(sel) {
    openMenu('title', U().titleMenu, function (k) {
      if (k === 0) newGame();
      else if (k === 1) loadMenu();
      else if (k === 2) showEndings();
      else showHelp();
    }, { x: 7, y: 18, w: 13, h: 10, cancel: false, sel: sel | 0 });
  }
  function loadMenu() {
    var items = [U().autoSlot], n;
    for (n = 1; n <= SLOTS; n++) items.push('第' + n + '格');
    var info = function (k) { T.clear(22, 25, 10, 2); var d = CT.load(ID, slotKey(k), null); T.print(22, 25, d && A.SCENES[d.scene] ? A.SCENES[d.scene].label : U().slotEmpty); };
    T.clear(22, 21, 10, 4);
    openMenu('load', items, function (k) {
      var d = CT.load(ID, slotKey(k), null);
      if (!d || !A.SCENES[d.scene]) { sfx('adv_bad'); toTitle(); return; }
      startPlay(d, [k === 0 ? U().autoLoaded : U().loaded]);
    }, { x: 7, y: 18, w: 13, h: 10, onMove: info, onCancel: function () { toTitle(); } });
    info(0);
  }
  function blankPage() {
    CT.blank(nes0, function () {
      ppu0.fillTiles(0, 0, 0, 32, 30, 0); ppu0.fillAttr(0, 0, 0, 16, 15, 0);
      T.reset(); box.close({ erase: false });
      if (menu) { T.remove(menu); menu = null; }
    });
    setSprites([]);
  }
  // 說明頁分 2 頁（字形池 159 磚 ≈ 一頁 36 個不同全形字）：A = 下一頁 / 最後一頁回標題，B = 回標題
  function showHelp(pg) {
    g.mode = 'help'; g.sub = 'help'; g.helpPage = pg | 0;
    blankPage();
    var row = 3;
    U().help[g.helpPage].forEach(function (para) {
      para.forEach(function (line) { T.print(4, row, line); row += 2; });
      row += 1;
    });
  }
  function showEndings() {
    g.mode = 'endings'; g.sub = 'endings';
    blankPage();
    var m = endingsMask();
    T.print(4, 3, U().endingsTitle);
    A.ENDINGS.forEach(function (e, i) { T.print(4, 7 + i * 3, e.no + '  ' + ((m & (1 << i)) ? e.name : U().unknown)); });
    T.print(4, 24, U().back);
  }

  /* ============================== 開始遊玩 ============================== */
  function startPlay(prog, intro) {
    g.mode = 'play'; g.ending = null; g.runCheats = 0; g.hints = 0; g.snap = null;
    restore(prog); g.autoKey = progressKey(prog);
    paintScene();
    Au.stop(); Au.play(S().bgm && !(g.scene === 'top' && g.f.relit) ? S().bgm : 'adv_title');
    run(intro || []);
  }
  function newGame() {
    g.mode = 'play'; g.ending = null; g.runCheats = 0; g.hints = 0; g.snap = null; g.autoKey = '';
    restore({ scene: 'room', items: [], f: {}, visits: { room: 1 } });
    paintScene();
    Au.stop();
    run(A.PROLOGUE);
  }

  /* ============================== 暫停 ============================== */
  function setPause(on) {
    if (g.paused === on) return;
    g.paused = on;
    if (on) Au.pause(); else if (!Au.resume() && Au.current) Au.play(Au.current);
    T.clear(LOC.x, LOC.y, 10, 2);
    T.print(LOC.x, LOC.y, on ? U().paused : g.loc);
    sfx('adv_ok');
  }

  /* ============================== 每幀 ============================== */
  function update() {
    g.t++;
    if ((g.mode === 'play' || g.mode === 'ending' || g.mode === 'card') && pressed(BTN.START) && !NES.Input.held(BTN.SELECT)) setPause(!g.paused);
    if (g.paused) { T.pump(); return; }
    // 壞結局卡片寫完（■）：B = 回標題（A 由對話框收掉 → g.after 回到選擇前）
    if (g.mode === 'card' && g.ending && g.ending.kind === 'bad' && box.phase === 'end' && pressed(BTN.B)) { sfx('adv_cancel'); toTitle(); return; }
    if (g.mode === 'help' && pressed(BTN.A) && g.helpPage + 1 < U().help.length) { sfx('adv_ok'); showHelp(g.helpPage + 1); return; }
    if (g.mode === 'help' || g.mode === 'endings') {
      if (pressed(BTN.B) || pressed(BTN.A)) { sfx('adv_cancel'); toTitle(); return; }
    }
    if (g.mode === 'credits') {
      g.endT++;
      if (scroll && scroll.state().atEnd && T.pending() === 0) { if (++g.creditsWait > 120 || pressed(BTN.A)) { toTitle(); return; } }
      else g.creditsWait = 0;
      if (pressed(BTN.A) && g.endT > 30) { toTitle(); return; }
    }
    // 提示文字 / 選擇題的問句寫完：不出 ■（狀態直接收掉），選擇題接著開選單
    if (g.prompting && box.phase === 'end') { box.phase = 'closed'; g.prompting = false; }
    if (g.sub === 'askwait' && box.phase === 'end') { box.phase = 'closed'; openAsk(); }
    T.update();
  }

  // 回到最後一個決策點（最後一次打開指令選單時的狀態）。壞結局卡片按 A = 正常功能（不算密技）；結局中途按密技也走這裡（算密技）
  function backToChoice(byCheat) {
    var snap = g.snap;
    g.mode = 'play'; g.ending = null; g.q = []; g.after = null;
    restore(snap);
    paintScene();
    Au.stop(); Au.play(S().bgm);
    sfx(byCheat ? 'adv_hint' : 'adv_ok');
    g.retries++;
    toCmd();
  }

  /* ============================== 密技 ============================== */
  function cheat() {
    if (!g) return false;
    if ((g.mode === 'card' || g.mode === 'ending') && g.ending && g.ending.kind === 'bad' && g.snap) {
      g.cheats++; g.runCheats++;
      backToChoice(true);
      return true;
    }
    if (g.mode !== 'play') return false;
    if (g.sub !== 'cmd' && g.sub !== 'sub') return false;
    g.cheats++; g.runCheats++;
    if (g.paused) setPause(false);
    showHint();
    return true;
  }

  /* ============================== 機器人（只看畫面：選單文字 / 游標 / ▼■） ============================== */
  // 最短真結局路線：[指令, 對象]（對象 null = 沒有子選單）
  var ROUTE = [
    ['拿取', '提燈'], ['拿取', '郵差包'], ['移動', '廣場'],
    ['調查', '噴水池'], ['拿取', '閃光'], ['移動', '燈塔'],
    ['使用', '信'], ['使用', '鑰匙'], ['移動', '燈室'], ['使用', '提燈'],
    ['移動', '燈塔'], ['移動', '廣場'], ['移動', '鐘錶店'], ['使用', '小齒輪'],
    ['移動', '廣場'], ['移動', '天文台'], ['交談', null],
    ['移動', '廣場'], ['移動', '森林'], ['移動', '林地'], ['使用', '音樂盒'], ['交談', null],
    ['移動', '森林'], ['移動', '廣場'], ['移動', '燈塔'], ['移動', '燈室'], ['使用', '星核'],
    ['移動', '星橋'], ['交談', null]
  ];
  var BOT_PREF = ['幫忙', '送它走', '起床', '不用', '算了', '否'];
  A.ROUTE = ROUTE;
  function botLag() { var q = parseInt((CT.query && CT.query('lag')) || '', 10); return isFinite(q) && q >= 0 ? q : 14; }
  function botMenuTo(label) {
    var st = menu.state(), idx = st.items.indexOf(label);
    if (idx < 0) return -1;
    if (st.sel !== idx) return idx > st.sel ? BTN.DOWN : BTN.UP;
    return BTN.A;
  }
  function bot() {
    var b = g.bot;
    if (b.wait > 0) { b.wait--; return 0; }
    var m = botDecide();
    if (m) b.wait = Math.max(1, (m === BTN.A) ? botLag() : 8);   // 至少放開 1 幀（按下邊緣）
    return m;
  }
  function botDecide() {
    var b = g.bot;
    if (g.paused) return BTN.START;
    if (g.mode === 'card' || g.mode === 'credits') return 0;
    var mo = menu && menu.state().phase === 'open';
    if (g.mode === 'title') return mo ? botMenuTo(U().titleMenu[0]) : 0;
    if (g.mode === 'help' || g.mode === 'endings') return BTN.B;
    if (mo && g.menuKind === 'ask') {
      var items = menu.state().items, want = null;
      for (var i = 0; i < BOT_PREF.length && !want; i++) if (items.indexOf(BOT_PREF[i]) >= 0) want = BOT_PREF[i];
      return botMenuTo(want || items[items.length - 1]);
    }
    if (mo && g.menuKind === 'cmd') {
      if (b.part === 1) { b.i++; b.part = 0; }        // 上一步沒出子選單（直接交談）
      var step = ROUTE[b.i];
      if (!step) return 0;
      var r = botMenuTo(step[0]);
      if (r === BTN.A) b.part = step[1] ? 1 : 2;
      if (r === BTN.A && !step[1]) { b.i++; b.part = 0; }
      return r < 0 ? 0 : r;
    }
    if (mo && g.menuKind !== 'cmd') {
      var st2 = ROUTE[b.i];
      if (!st2 || !st2[1]) return BTN.B;
      var r2 = botMenuTo(st2[1]);
      if (r2 < 0) return BTN.B;                          // 不在清單（例如尚未出現）⇒ 退回
      if (r2 === BTN.A) { b.i++; b.part = 0; }
      return r2;
    }
    // 對話框：打字中 → 讀一下再按 A 加速；▼ / ■ → 按 A
    var ph = box.phase;
    if (g.prompting) return 0;
    if (ph === 'type' || ph === 'clear') { b.typeT++; if (b.typeT > 20) { b.typeT = 0; return BTN.A; } return 0; }
    b.typeT = 0;
    if (ph === 'wait' || ph === 'end') return BTN.A;
    return 0;
  }

  /* ============================== 註冊 ============================== */
  var GAME = {
    id: ID, order: 1, title: '星塵冒險', legacy: ['text-adventure.html'],
    init: function (nes) {
      nes0 = nes; ppu0 = nes.ppu; Au = A.Audio;
      g = newState();
      buildBanks(nes);
      Au.init(nes);
      toTitle();
    },
    update: function (nes) { update(); Au.tick(); },
    draw: function (nes) { drawSprites(); },
    exit: function (nes) { if (Au) Au.stop(); },
    get backTile() { var sb = A.Art.sprBank(); return { tile: sb.parts.dot[0].tile, pal: 3 }; },
    state: function () {
      if (!g) return null;
      return {
        mode: g.mode, sub: g.sub, scene: g.scene, items: g.items.slice(), flags: Object.keys(g.f).filter(function (k) { return g.f[k]; }),
        paused: g.paused, t: g.t, cheats: g.cheats, runCheats: g.runCheats, hints: g.hints,
        menu: menu ? menu.state() : null, menuKind: g.menuKind, box: box ? box.state() : null, boxPhase: box ? box.phase : null,
        prompting: g.prompting, ending: g.ending ? g.ending.id : null, endings: endingsMask(), goal: GAME.goal(),
        loc: g.loc, pic: g.picInfo, sprites: g.sprites.map(function (s) { return s.k; }), music: Au && Au.current, lastSfx: Au && Au.lastSfx,
        text: T ? T.stats() : null, lastMsg: g.lastMsg, autoSaves: g.autoSaves, retries: g.retries, hasAuto: !!CT.load(ID, 'auto', null), bot: { i: g.bot.i, part: g.bot.part, of: ROUTE.length }
      };
    },
    cheat: cheat,
    bot: function () { return g ? bot() : 0; },
    goal: function () { return !!(g && g.goalHit); },
    // 選單：收集到的結局數（6 字元，例如 `ED 2/5`）
    bestText: function () { return 'ED ' + endingsCount() + '/' + A.ENDINGS.length; }
  };

  A.dev = {
    g: function () { return g; },
    T: function () { return T; },
    box: function () { return box; },
    menu: function () { return menu; },
    newGame: function () { newGame(); },
    toTitle: function () { toTitle(); },
    goto: function (id) { g.mode = 'play'; run([{ go: id }]); },
    give: function (id) { if (g.items.indexOf(id) < 0) g.items.push(id); },
    set: function (k) { g.f[k] = true; },
    hint: hintText,
    toCmd: function () { toCmd(); },
    load: function (p) { startPlay(p, []); },
    progress: progress,
    ending: function (id) { startEnding(id); },
    cheat: cheat,
    ROUTE: ROUTE
  };

  if (CT.register) CT.register(GAME);
  A.GAME = GAME;
})();

</script>
<script>/* games/cart5/escape/text_rooms.js */
/*
 * games/cart5/escape/text_rooms.js — 《星塵密室》三間密室的謎題資料 + 全部房間文字（R9 C9-4 cart5-escape；全部原創）
 * ---------------------------------------------------------------------------
 * 純資料（宣告式）：遊戲執行期（logic.js）、機器人（BFS）、測試（Python 獨立實作的解題器）讀同一份。
 * 文字是字串常值 ⇒ tools/cjk_glyphs.py 會自動收字；改完要重跑 `$PY tools/cjk_glyphs.py`。
 *
 * 房間 room：
 *   name 房名、W 牆色（四組背景調色盤共用的 c1）、pals 四組背景調色盤、limit 時限（幀）、par 標準時間（幀）
 *   items { id: {n 名稱, d 說明} }
 *   hot   [{ id, v 'N'|'E'|'S'|'W', r [col,row,w,h]（房間畫面內的格；畫面 32×16 格）, n 名稱,
 *            show 條件（可省略 = 一直在）, rules [{ i 手上的物品（省略 = 空手）, c 條件, d 動作[], s 訊息 }], l 預設訊息 }]
 *         規則由上往下找第一條「物品相同且條件成立」的；都不成立 ⇒ 空手顯示 l、拿著東西顯示「用不上」。
 *   combos [{ a, b, c 條件, d 動作[], s }]（a、b 不分順序）
 *   puz   { id: { kind 'dial'|'lights'|'rings'|'pipes'|'look', …參數, d 解開後的動作[], s 解開訊息, t 標題, help 操作說明,
 *            know 撥盤鎖「推得出答案」需要的線索旗標（解題器只在看過線索後才走這步；遊戲裡照樣可以亂猜） } }
 *   steps [{ done 條件, h [提示1, 提示2, 提示3]（漸進）, cheat 動作[] }]：提示 / 密技依「第一個還沒完成的環節」
 * 條件：'a&b&!c'（旗標；`got_x` = 曾經拿到物品 x；`has_x` = 現在手上有 x）。空字串 = 永遠成立。
 * 動作：'set:f' / 'clr:f' / 'get:x'（同時 set got_x）/ 'lose:x' / 'open:puz' / 'win'
 */
(function () {
  'use strict';
  var CT = window.CT = window.CT || {};
  var E = CT.Escape = CT.Escape || {};
  var MIN = 60 * 60;   // 1 分鐘（幀）

  E.ROOMS = [
    /* =============================================================== 第一室：觀星書房（簡單） */
    {
      id: 'study', name: '觀星書房', W: 0x07,
      pals: [[0x07, 0x28, 0x30], [0x07, 0x17, 0x27], [0x07, 0x16, 0x28], [0x07, 0x1A, 0x21]],
      limit: 15 * MIN, par: 4 * MIN, start: 'N',
      intro: '第一間：觀星書房。門被鎖上了，找出密碼走出去吧！',
      items: {
        trowel: { n: '小鏟子', d: '園藝用的小鏟子。' },
        key: { n: '銅鑰匙', d: '一把小小的銅鑰匙。' },
        flash: { n: '手電筒', d: '沒有電池的手電筒。' },
        battery: { n: '電池', d: '一顆圓筒形的電池。' },
        flashOn: { n: '亮的手電筒', d: '裝好電池，可以照亮暗處。' }
      },
      hot: [
        { id: 'door', v: 'N', r: [13, 2, 6, 12], n: '大門',
          rules: [{ c: 'unlocked', d: ['win'], s: '推開大門，外面是通往下一間的走廊。' }],
          l: '厚重的木門，右邊裝著數字鍵盤鎖。' },
        { id: 'keypad', v: 'N', r: [20, 6, 2, 3], n: '密碼鎖',
          rules: [{ c: 'unlocked', s: '密碼鎖亮著綠燈，已經打開了。' }, { d: ['open:lock'] }] },
        { id: 'starmap', v: 'N', r: [3, 2, 7, 6], n: '星圖',
          l: '一幅星圖。角落寫著：「觀星的人，要先學會觀察身邊。」' },
        { id: 'mat', v: 'N', r: [12, 14, 8, 2], n: '門墊',
          l: '掀開門墊，底下什麼也沒有。看來沒那麼簡單。' },
        { id: 'shelf', v: 'E', r: [3, 1, 12, 9], n: '書架',
          l: '書架中間那層有四本彩色的書，書背寫著數字：藍 2、紅 7、綠 4、黃 1。' },
        { id: 'toolbox', v: 'E', r: [3, 10, 12, 4], n: '工具箱',

<script>/* games/cart5/escape/logic.js */
/*
 * games/cart5/escape/logic.js — 《星塵密室》謎題規則引擎 + 解題器（R9 C9-4 cart5-escape）
 * ---------------------------------------------------------------------------
 * 純邏輯（不碰 PPU）：讀 text_rooms.js 的宣告式資料。
 *   CT.Escape.Logic = {
 *     newState(room) → {f:{旗標}, inv:[物品…]}, cond(st, c), apply(st, acts) → {opened, won},
 *     click(room, st, hotId, item) → {rule, d, s} | null, combo(room, a, b), visible(room, st, hot),
 *     step(room, st) → 目前卡住的環節索引, actions(room, st) → 抽象動作清單, solve(room, st) → 最短動作路徑,
 *     Dial / Lights / Rings / Pipes：各機關的規則與解法（機器人用；測試另有 Python 獨立實作）
 *   }
 */
(function () {
  'use strict';
  var CT = window.CT = window.CT || {};
  var E = CT.Escape = CT.Escape || {};

  /* ============================================================ 狀態 / 條件 / 動作 */
  function newState() { return { f: {}, inv: [] }; }
  function clone(st) { var f = {}, k; for (k in st.f) if (st.f[k]) f[k] = 1; return { f: f, inv: st.inv.slice() }; }
  function has(st, x) { return st.inv.indexOf(x) >= 0; }
  function flag(st, k) {
    if (k.indexOf('has_') === 0) return has(st, k.substring(4));
    return !!st.f[k];
  }
  function cond(st, c) {
    if (!c) return true;
    var parts = String(c).split('&');
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i].trim(); if (!p) continue;
      var neg = p.charAt(0) === '!';
      var v = flag(st, neg ? p.substring(1) : p);
      if (neg ? v : !v) return false;
    }
    return true;
  }
  // 套用動作；回傳 {opened: 機關 id 或 null, won: bool, got: [新物品]}
  function apply(st, acts) {
    var out = { opened: null, won: false, got: [] };
    (acts || []).forEach(function (a) {
      var i = a.indexOf(':'), op = i < 0 ? a : a.substring(0, i), arg = i < 0 ? '' : a.substring(i + 1);
      if (op === 'set') st.f[arg] = 1;
      else if (op === 'clr') delete st.f[arg];
      else if (op === 'get') { if (!has(st, arg)) { st.inv.push(arg); out.got.push(arg); } st.f['got_' + arg] = 1; }
      else if (op === 'lose') { var k = st.inv.indexOf(arg); if (k >= 0) st.inv.splice(k, 1); }
      else if (op === 'open') out.opened = arg;
      else if (op === 'win') { st.f.won = 1; out.won = true; }
    });
    return out;
  }
  function visible(room, st, h) { return !h.show || cond(st, h.show); }
  function hot(room, id) { for (var i = 0; i < room.hot.length; i++) if (room.hot[i].id === id) return room.hot[i]; return null; }
  // 點一個熱點（item = 手上的物品 id 或 null）→ 第一條符合的規則
  function click(room, st, hotId, item) {
    var h = hot(room, hotId);
    if (!h || !visible(room, st, h)) return null;
    var rs = h.rules || [];
    for (var i = 0; i < rs.length; i++) {
      var r = rs[i];
      if ((r.i || null) !== (item || null)) continue;
      if (!cond(st, r.c)) continue;
      return { rule: r, d: r.d || [], s: r.s || null };
    }
    return { rule: null, d: [], s: item ? null : (h.l || null), none: true };
  }
  function combo(room, a, b) {
    var cs = room.combos || [];
    for (var i = 0; i < cs.length; i++) {
      var c = cs[i];
      if ((c.a === a && c.b === b) || (c.a === b && c.b === a)) return c;
    }
    return null;
  }
  // 目前卡住的環節（第一個 done 不成立的）
  function step(room, st) {
    for (var i = 0; i < room.steps.length; i++) if (!cond(st, room.steps[i].done)) return i;
    return room.steps.length;
  }
  function key(st) {
    var f = Object.keys(st.f).filter(function (k) { return st.f[k]; }).sort().join(',');
    return f + '|' + st.inv.slice().sort().join(',');
  }

  /* ============================================================ 抽象動作 / 解題器（BFS） */
  // 一個動作：{t:'hot', h, i} 或 {t:'combo', a, b}；開機關 = 直接套用機關的解開動作（機關本身可解另外驗證）
  function actions(room, st) {

    room.hot.forEach(function (h) {
      if (!visible(room, st, h)) return;
      [null].concat(st.inv).forEach(function (it) {
        var r = click(room, st, h.id, it);
        if (!r || !r.rule || !r.d.length) return;
        // 撥盤鎖：要先看過線索才「推得出」答案（know）
        var op = r.d.filter(function (a) { return a.indexOf('open:') === 0; })[0];
        if (op) { var pz = room.puz[op.substring(5)]; if (pz && pz.know && !cond(st, pz.know)) return; }
        out.push({ t: 'hot', h: h.id, i: it, v: h.v });

    for (var x = 0; x < st.inv.length; x++) for (var y = x + 1; y < st.inv.length; y++) {

    var s2 = clone(st), r;

    else {

      if (r.opened && room.puz[r.opened] && room.puz[r.opened].kind !== 'look') {

        r.won = r.won || r2.won;
      }

    return s2;

  function solve(room, st) {
    st = st || newState();
    var k0 = key(st), prev = {}, seen = {}, q = [st], qa = [];
    seen[k0] = 1;
    while (q.length) {
      var cur = q.shift(), ck = key(cur);
      if (cur.f.won) {
        var path = [], k = ck;
        while (prev[k]) { path.unshift(prev[k].a); k = prev[k].k; }

      var acts = actions(room, cur);
      for (var i = 0; i < acts.length; i++) {

  // 全狀態空間：{states, winnable 全部可達狀態都能到 won, dead[]}
  function explore(room) {
    var st = newState(), all = {}, edges = {}, q = [st], k0 = key(st);
    all[k0] = st;
    while (q.length) {
      var cur = q.shift(), ck = key(cur);

      actions(room, cur).forEach(function (a) {
        var nx = doAction(room, cur, a), nk = key(nx);

    ks.forEach(function (k) { if (all[k].f.won) good[k] = 1; });
    while (changed) {
      changed = false;
      ks.forEach(function (k) {
        if (good[k]) return;
        if (edges[k].some(function (n) { return good[n]; })) { good[k] = 1; changed = true; }
      });

    return { states: ks.length, dead: dead, winnable: dead.length === 0 };
  }

  /* ============================================================ 機關：撥盤鎖 */
  var Dial = {
    chars: function (p) { return Array.from ? Array.from(p.chars) : p.chars.split(''); },
    check: function (p, vals) { return vals.join('') === p.ans; },
    // 從 cur（字元陣列）走到答案的按鍵序列（↑ = 下一個字、↓ = 上一個字、→ 換位、A 確認）
    plan: function (p, cur, sel) {
      var C = Dial.chars(p), ans = Array.from ? Array.from(p.ans) : p.ans.split(''), out = [], s = sel | 0;
      for (var i = 0; i < p.n; i++) {

  var Lights = {
    press: function (p, s, i) {

  // 九燈：燈泡 16×16（亮 / 暗）；回傳要另外切的變體畫布
  function lampArt(on) {
    var cv = new Canvas(16, 16, K);
    cv.disc(8, 7, 6, on ? Y : K); cv.ring(8, 7, 6, 0x10); cv.rect(5, 13, 6, 3, 0x10);

  function slotArt(kind, c) {           // 太陽系儀軌道格：kind 0 空、1 行星、2 行星在目標格
    var cv = new Canvas(16, 16, K);
    cv.hl(0, 8, 16, Y);

    else { cv.disc(8, 8, 5, c); cv.ring(8, 8, 5, K); cv.px(6, 6, WH); }
    return cv;
  }
  function pipeArt(t, r, lit, theme) {
    var cv = new Canvas(16, 16, K), c = lit ? (theme === 'light' ? Y : BL) : (theme === 'light' ? 0x02 : 0x00);
    var L = E.Logic.Pipes, op = L.open(t, r);
    
    cv.rect(5, 5, 6, 6, c);
    op.forEach(function (d) {
      if (d === 0) cv.rect(5, 0, 6, 6, c); if (d === 2) cv.rect(5, 10, 6, 6, c);
      if (d === 1) cv.rect(10, 5, 6, 6, c); if (d === 3) cv.rect(0, 5, 6, 6, c);
    });
    // 管壁黑線
    op.forEach(function (d) {
      if (d === 0 || d === 2) { cv.vl(5, d === 0 ? 0 : 10, 6, K); cv.vl(10, d === 0 ? 0 : 10, 6, K); }
      else { cv.hl(d === 3 ? 0 : 10, 5, 6, K); cv.hl(d === 3 ? 0 : 10, 10, 6, K); }
    });
    if (lit) cv.px(7, 7, WH);
    return cv;
  }
  // 管線格的左上角（房間畫面 px；必須對齊 16 px 屬性區塊）
  function pipeGeom(p) { return { gx: 128 - p.w * 8, gy: 16 + (4 - p.h) * 16 }; }
  // closeup(room, puz) → {cv 主畫布, extra {名字: 畫布}}：extra 的磁磚也進 bank（燈 / 軌道 / 管線的各種狀態）
  function closeup(room, p, st) {
    var cv = new Canvas(VW, VH, K), extra = {};
    var W = room.W, fr = room.id === 'works' ? 0x10 : (room.id === 'dome' ? Y : 0x27);
    closeBg(cv, W, fr);
    if (p.kind === 'dial') {
      // 面板 + 鑰匙孔裝飾（撥盤窗由 CT.Text 框線磁磚畫）

      cv.disc(128, 106, 5, fr); cv.rect(127, 106, 3, 10, fr); cv.rect(127, 108, 3, 4, K);
    } else if (p.kind === 'lights') {
      cv.panel(72, 12, 112, 108, 0x00); cv.box(74, 14, 108, 104, 0x10);
      extra.on = lampArt(true); extra.off = lampArt(false);
    } else if (p.kind === 'rings') {
      extra.e0 = slotArt(0); extra.p0 = slotArt(1, RD); extra.p1 = slotArt(1, SK); extra.p2 = slotArt(1, GR);
      // 目標箭頭（第 0 格上方）
      cv.art(68, 7, ['#######', '.#####.', '..###..', '...#...'], { '#': WH });
    } else if (p.kind === 'pipes') {
      var L = E.Logic.Pipes;
      ['I', 'L'].forEach(function (t) {
        for (var r = 0; r < L.mod(t); r++) { extra[t + r + 'u'] = pipeArt(t, r, false, p.theme); extra[t + r + 'l'] = pipeArt(t, r, true, p.theme); }
      });
      var G = pipeGeom(p), gx = G.gx, gy = G.gy, inY = gy + p.inRow * 16, outY = gy + p.outRow * 16;
      // 入口（水龍頭 / 星光）與出口（水車 / 星門）
      var lit = p.theme === 'light' ? Y : BL;

    escape_turn: { priority: 2, data: { noi: nz([[9, 2, 6], [7, 3, 4]]) } },
    escape_click: { priority: 2, data: { p2: sq([['A-6', 1, 9, 1], ['E-6', 1, 6]]) } },
    escape_unlock: { priority: 4, data: { noi: nz([[4, 2, 10]]), p2: sq([['D-6', 3, 10, 2], ['A-6', 3, 10], ['D-7', 6, 9]]) } },
    escape_hint: { priority: 3, data: { p2: sq([['B-5', 2, 8, 2], ['E-6', 2, 8], ['B-6', 4, 7]]) } },
    escape_open: { priority: 3, data: { noi: nz([[11, 3, 8], [13, 4, 6]]) } },
    escape_tick: { priority: 1, data: { noi: nz([[2, 1, 5]]) } }
  };
  var SONGS = { escape_title: buildTitle(), escape_room: buildRoom(), escape_dome: buildDome(), escape_clear: buildClear(), escape_over: buildOver() };

  function drv() { return (Audio._nes && Audio._nes.music) || null; }
  var Audio = {
    SONGS: SONGS, SFX: SFX, current: null, lastSfx: null, _nes: null, _paused: null,
    init: function (nes) {
      Audio._nes = nes; Audio.current = null; Audio._paused = null;
      var d = drv();
      if (!d) return false;
      for (var k in SFX) if (Object.prototype.hasOwnProperty.call(SFX, k)) { try { d.define(k, SFX[k]); } catch (e) { } }
      return true;
    },
    play: function (key) {
      var d = drv(), s = SONGS[key];
      if (!d || !s) return false;
      if (Audio.current === key && !(d.isPaused && d.isPaused())) return true;
      try { d.play(s, { loop: s.playLoop }); Audio.current = key; Audio._paused = null; return true; } catch (e) { return false; }
    },
    stop: function () { var d = drv(); if (d) { try { d.stop(); if (d.stopSfx) d.stopSfx(); } catch (e) { } } Audio.current = null; Audio._paused = null; },
    // 暫停：記下曲名再 pause（ENGINE_API §10 標準寫法）
    pause: function () {
      var d = drv(); Audio._paused = Audio.current; Audio.current = null;
      if (d && d.pause) { try { d.pause(); } catch (e) { } } else if (d) { try { d.stop(); } catch (e) { } }
    },
    resume: function () {
      var d = drv(), k = Audio._paused; Audio._paused = null;
      if (d && d.isPaused && d.isPaused()) { try { d.resume(); Audio.current = k; return true; } catch (e) { } }
      if (k) return Audio.play(k);
      return false;
    },
    isPaused: function () { var d = drv(); return !!(d && d.isPaused && d.isPaused()); },
    sfx: function (name) {
      var d = drv();
      Audio.lastSfx = name;
      if (!d || !SFX[name]) return false;
      try { d.sfx(name); return true; } catch (e) { return false; }
    },
    tick: function () { var d = drv(); if (d) { try { d.tick(); } catch (e) { } } }
  };
  E.Audio = Audio;
})();

</script>
<script>/* games/cart5/escape/main.js */
/*
 * games/cart5/escape/main.js — 《星塵密室》點選式密室逃脫（合輯卡帶五 槽 2，id = escape，全域 CT.Escape）
 * ---------------------------------------------------------------------------
 * 擁有者：C9-4 cart5-escape（R9）｜ 依賴：engine/*、registry.js、cart5/text.js（CT.Text）、escape/{text_rooms,text_ui,logic,art,song}.js
 * 舊作概念：legacy escape-room（只取「點選調查 / 拿物品 / 密碼鎖」玩法；房間、謎題、文字、美術、音樂全部原創）。
 *
 * 畫面（32×30 格）：第 2~3 列 HUD（房名 / 朝向 / 剩餘時間）｜第 4~19 列房間畫面 256×128（每面牆一個 bank）｜
 *   第 20~21 列物品欄（7 格 16×16 圖示）｜第 22~28 列訊息框（CT.Text，2 行 × 13 字，打字機）。
 * 操作：十字鍵游標（按住加速：前 8 幀 1 px、之後 3 px；按住 B = 1 px 微調）、A 調查 / 使用 / 拿起物品、
 *   B 放下物品 / 離開特寫、SELECT 三段提示、START 暫停；左右箭頭（或把游標推到邊上 20 幀）轉身。
 * 機關特寫：dial 撥盤鎖 / lights 九燈 / rings 太陽系儀 / pipes 管線（光路）/ look 望遠鏡；十字鍵一格一格（首延遲 12 幀、之後每 4 幀）。
 * §6：密技（C / ★）= 直接解開目前卡住的環節（特寫中 = 解開這個機關）；時間到畫面 = 原地續關；標題 / 說明無效；用過 goal() = false。
 * 網址：`cart5.html?game=escape&debug=1[&bot=1][&room=1..3]`
 */
(function () {
  'use strict';
  var NES = window.NES = window.NES || {};
  var CT = window.CT = window.CT || {};
  var E = CT.Escape = CT.Escape || {};
  var BTN = (NES.Input && NES.Input.BTN) || { A: 1, B: 2, SELECT: 4, START: 8, UP: 16, DOWN: 32, LEFT: 64, RIGHT: 128 };
  var DPAD = BTN.UP | BTN.DOWN | BTN.LEFT | BTN.RIGHT;

  var ID = 'escape';
  var DIRS = ['N', 'E', 'S', 'W'];
  var VROW = 4, BAR_ROW = 20, SLOTS = 7;
  var BOX = { x: 1, y: 22, w: 30, h: 7 };
  var HINT_COST = 30 * 60;                    // 每段提示：評價時間 +30 秒
  var EDGE_F = 20, POOL_MIN = 64;              // 字形池 = 256 − 本畫面已用磁磚（fix-r9 P1-1：不再設上限 120）
  var SPR_PAL = [[0x0F, 0x30, 0x28], [0x28, 0x30, 0x28], [0x0F, 0x28, 0x30], [0x30, 0x30, 0x30]];
  var TEXT_PALS = [[0x02, 0x12, 0x30], [0x02, 0x07, 0x17], [0x02, 0x16, 0x28], [0x02, 0x1A, 0x21]];

  var A = null, L = null, Au = null, TX = null, R = null;
  var nes0 = null, ppu0 = null, T = null, box = null, menu = null, spr = null, bank = null;
  var g = null;

  /* ============================================================ 小工具 */
  function pressed(b) { return NES.Input.pressed(b); }
  function held(b) { return NES.Input.held(b); }
  function sfx(n) { Au.sfx(n); }
  function room() { return R[g.room]; }
  function num(v, n) { var s = String(Math.max(0, Math.floor(v))); while (s.length < n) s = '0' + s; return s; }
  function mmss(f) { var s = Math.max(0, Math.ceil(f / 60)); return num(Math.floor(s / 60), 2) + ':' + num(s % 60, 2); }
  function itemName(id) { var it = room().items[id]; return it ? it.n : id; }
  function rectPx(h) { return { x: h.r[0] * 8, y: (VROW + h.r[1]) * 8, w: h.r[2] * 8, h: h.r[3] * 8 }; }
  function slotPx(k) { return { x: 12 + k * 32, y: BAR_ROW * 8, w: 24, h: 16 }; }
  function inR(x, y, r) { return x >= r.x && y >= r.y && x < r.x + r.w && y < r.y + r.h; }
  function budgetLeft() { var b = ppu0 && ppu0.budget; return b && b.left ? b.left() : 999; }
  function digitsTiles() {
    var G = (CT.GLYPHS && CT.GLYPHS.ascii) || {}, out = {};
    '0123456789:'.split('').forEach(function (ch, i) {
      var h = G[ch] || '0000000000000000', rows = [];
      for (var y = 0; y < 8; y++) {
        var v = parseInt(h.substr(y * 2, 2), 16) | 0, r = '';
        for (var x = 0; x < 8; x++) r += (v >> (7 - x)) & 1 ? '3' : '.';
        rows.push(r);
      }
      out[ch === ':' ? 'DC' : 'D' + ch] = rows;
    });
    return out;
  }

  /* ============================================================ 畫面組裝（CT.blank 裡：bank + 名稱表 + 屬性 + CT.Text） */
  // parts: [{cv, col, row}]；extras {名字: 16×16 畫布}；icons [物品]；回傳 {cells: [[part cells]], ext {名字: {cells, attr}}, ico {id: {cells, attr}}}
  function build(pals, parts, extras, icons) {
    var ts = new A.TileSet(), comp = [], ext = {}, ico = {};
    parts.forEach(function (p) { comp.push(A.compose(p.cv, pals, ts)); });
    Object.keys(extras || {}).forEach(function (k) { ext[k] = A.compose(extras[k], pals, ts); });
    (icons || []).forEach(function (id) { ico[id] = A.compose(A.icon(id), pals, ts); });
    var obj = { Z: ['........', '........', '........', '........', '........', '........', '........', '........'] };
    for (var i = 0; i < ts.list.length; i++) obj['V' + i] = ts.rows(i);
    var dg = digitsTiles(); for (var k in dg) obj[k] = dg[k];
    var used = 1 + ts.list.length + 11 + CT.Text.reserve.frameTiles;
    var pool = 256 - used;                     // 這個畫面剩多少就全給字形池（撥盤特寫約 200 磚）
    if (pool < POOL_MIN) throw new Error('escape: 畫面磁磚太多（' + ts.list.length + '），字形池只剩 ' + pool);
    CT.Text.reserve(obj, pool);
    bank = NES.CHR.bank('escape_bg', obj);
    NES.CHR.setPattern(0, bank);
    NES.CHR.setPattern(1, spr);
    ppu0.setPatternTables(0, 1);
    ppu0.setBackdrop(0x0F);
    for (i = 0; i < 4; i++) { ppu0.setBgPalette(i, pals[i]); ppu0.setSprPalette(i, SPR_PAL[i]); }
    ppu0.fillTiles(0, 0, 0, 32, 30, 0);
    ppu0.fillAttr(0, 0, 0, 16, 15, 0);
    ppu0.clearSprites();
    parts.forEach(function (p, j) { blit(comp[j], p.col, p.row); });
    g.stat = { tiles: ts.list.length, pool: pool, approx: comp.reduce(function (s, c) { return s + c.approx; }, 0) };
    T = CT.Text.create(nes0, { bank: bank, input: false });
    box = null; menu = null;
    return { comp: comp, ext: ext, ico: ico };
  }
  function idxOf(name) { return bank.index(name); }
  function blit(c, col, row) {
    for (var r = 0; r < c.rows; r++) for (var q = 0; q < c.cols; q++) ppu0.setTile(0, col + q, row + r, idxOf(c.cells[r * c.cols + q]));
    for (var by = 0; by < c.bh; by++) for (var bx = 0; bx < c.bw; bx++) ppu0.setAttr(0, (col >> 1) + bx, (row >> 1) + by, c.attr[by * c.bw + bx]);
  }
  // 自己的寫入佇列（T.update 之前消化；每幀 ≤ 32 byte 且預算夠才寫）
  var WQ = [];
  function qCell(c, col, row) {           // 16×16 的 composed 小圖 → 4 格 + 1 屬性
    for (var r = 0; r < 2; r++) for (var q = 0; q < 2; q++) WQ.push({ c: col + q, r: row + r, t: idxOf(c.cells[r * 2 + q]) });
    WQ.push({ a: 1, c: col >> 1, r: row >> 1, p: c.attr[0] });
  }
  function pumpWQ() {
    var n = 0;
    while (WQ.length && n < 32 && budgetLeft() > 48) {
      var w = WQ.shift();
      if (w.a) ppu0.setAttr(0, w.c, w.r, w.p); else ppu0.setTile(0, w.c, w.r, w.t);
      n++;
    }
  }
  function textAttr(col, row, w, h, p) {
    for (var r = row >> 1; r <= (row + h - 1) >> 1; r++) for (var c = col >> 1; c <= (col + w - 1) >> 1; c++) ppu0.setAttr(0, c, r, p);
  }

  /* ============================================================ 各畫面 */
  function artState() {
    var pz = g.pz || {};
    return { f: g.st.f, inv: g.st.inv, lights: pz.lights && pz.lights.s, rings: pz.rings && pz.rings.s };
  }
  function drawHud() {
    textAttr(0, 2, 32, 2, 0);
    T.print(1, 2, g.paused ? TX.pause : room().name);
    T.print(11, 2, g.paused ? TX.resume : (g.puz ? TX.leave : TX.dirFull[g.dir]));
    g.timeShown = '';
    drawTime(true);
  }
  function drawTime(now) {
    var s = mmss(Math.max(0, room().limit - g.time));
    if (s === g.timeShown) return;
    for (var i = 0; i < 5; i++) {
      if (g.timeShown && g.timeShown.charAt(i) === s.charAt(i)) continue;
      var t = idxOf(s.charAt(i) === ':' ? 'DC' : 'D' + s.charAt(i));
      if (now) ppu0.setTile(0, 25 + i, 3, t); else WQ.push({ c: 25 + i, r: 3, t: t });
    }
    g.timeShown = s;
  }
  function drawBar(now) {
    for (var k = 0; k < SLOTS; k++) {
      var id = g.st.inv[k], col = 2 + k * 4, c = id && g.ico[id];
      if (c) {
        if (now) { blit(c, col, BAR_ROW); }
        else qCell(c, col, BAR_ROW);
      }
    }
  }
  function newBox() {
    box = T.box({ x: BOX.x, y: BOX.y, w: BOX.w, h: BOX.h, input: false, pal: 0 });
    T.frame(BOX.x, BOX.y, BOX.w, BOX.h, { pal: 0 });
    box.drawn = true;
    g.idleKey = null;
  }
  function screenRoom() {
    CT.blank(nes0, function () {
      var r = room(), b;
      if (g.puz) {
        var cu = A.closeup(r, g.puz.p, artState());
        b = build(r.pals, [{ cv: cu.cv, col: 0, row: VROW }], cu.extra, g.st.inv);
        g.ext = b.ext;
      } else {
        b = build(r.pals, [{ cv: A.view(r, DIRS[g.dir], artState()), col: 0, row: VROW }], null, g.st.inv);
      }
      g.ico = b.ico;
      drawHud(); drawBar(true);
      newBox();
      if (g.puz) drawPuz(true);
      T.flush();
    });
    WQ.length = 0;
    g.idleKey = null;
  }
  // 純文字畫面（標題 / 說明 / 故事 / 結算 / 時間到 / 選房）
  function screenText(kind) {
    CT.blank(nes0, function () {
      var parts = [];
      if (kind === 'title') parts.push({ cv: A.title(), col: 0, row: 4 });
      if (kind === 'story' || kind === 'end') parts.push({ cv: A.story(kind), col: 0, row: 1 });
      if (kind === 'result' && g.result) parts.push({ cv: A.rankBadge(g.result.rank), col: 8, row: 14 });   // 評價 32×32 大字
      build(TEXT_PALS, parts, null, []);
      g.ico = {};
    });
    WQ.length = 0;
  }

  /* ============================================================ 訊息 */
  // say(text, then, name)：對話框打字機；A 加速 / 翻頁；關閉後呼叫 then
  function say(text, then, name, auto) {
    if (!box) newBox();
    g.talk = true; g.talkT = 0; g.autoClose = !!auto;
    box.say(text, { name: name || null, onClose: function () { g.talk = false; g.idleKey = null; if (then) then(); } });
  }
  function updateTalk() {
    g.talkT++;
    var ph = box.state().phase;
    if (pressed(BTN.A) && g.talkT > 2) { box.next(); if (ph === 'wait' || ph === 'end') sfx('escape_menu'); }
  }
  function idleText(force) {
    if (!box || g.talk) return;
    var L1 = '', L2 = '';
    var hv = g.hover;
    if (hv && hv.t === 'hot') L1 = hv.h.n;
    else if (hv && hv.t === 'turn') L1 = hv.d < 0 ? TX.turnL : TX.turnR;
    else if (hv && hv.t === 'slot') { L1 = itemName(hv.id); L2 = room().items[hv.id].d; }
    if (!L2) L2 = g.sel ? TX.holding + itemName(g.sel) : TX.look;
    if (g.puz) { L1 = g.puz.p.t; L2 = g.puz.p.help; }
    var key = L1 + '|' + L2;
    if (key === g.idleKey && !force) return;
    g.idleKey = key;
    T.clear(BOX.x + 1, BOX.y + 1, BOX.w - 2, BOX.h - 2);
    if (g.puz) { T.print(BOX.x + 2, BOX.y + 1, L2, { w: BOX.w - 4 }); return; }
    if (L1) T.print(BOX.x + 2, BOX.y + 1, L1);
    T.print(BOX.x + 2, BOX.y + 3, L2);
  }

  /* ============================================================ 房間流程 */
  function newRun() { return { f: {}, inv: [] }; }
  function startRoom(i) {
    g.mode = 'room'; g.room = i; g.st = L.newState(); g.dir = 0; g.sel = null; g.time = 0; g.hints = 0; g.hintStage = {};
    g.runCheats = 0; g.puz = null; g.pz = {}; g.cx = 124; g.cy = 100; g.hover = null; g.paused = false; g.talk = false;
    g.edgeF = 0; g.holdF = 0; g.bHold = 0; g.bMoved = false;
    var r = room();
    Object.keys(r.puz).forEach(function (k) {
      var p = r.puz[k];
      if (p.kind === 'dial') g.pz[k] = { vals: Array.from(p.start), sel: 0 };
      else if (p.kind === 'lights') { g.pz[k] = { s: p.start.slice(), sel: 4 }; g.pz.lights = g.pz[k]; }
      else if (p.kind === 'rings') { g.pz[k] = { s: p.start.slice(), sel: 0 }; g.pz.rings = g.pz[k]; }
      else if (p.kind === 'pipes') g.pz[k] = { cells: L.Pipes.parse(p), sel: p.inRow * p.w };
    });
    screenRoom();
    Au.stop(); Au.play(i === 2 ? 'escape_dome' : 'escape_room');
    say(r.intro + (i === 0 ? '\f' + TX.tutRoom : ''));
  }
  function changed(before) { return L.key(g.st) !== before; }
  function afterGain(got, then) {
    if (got && got.length && !g.tutItem) { g.tutItem = true; say(TX.tutItem, then); return; }
    if (then) then();
  }
  function interact(h) {
    var before = L.key(g.st), item = g.sel;
    var r = L.click(room(), g.st, h.id, item);
    if (!r) return;
    if (r.none) {
      sfx(item ? 'escape_bad' : 'escape_click');
      say(item ? itemName(item) + '：' + TX.noUse + '。' : (r.s || TX.look));
      return;
    }
    var res = L.apply(g.st, r.d);
    if (item) g.sel = null;
    var stChanged = changed(before);
    if (res.got.length) sfx('escape_pick'); else if (stChanged) sfx(item ? 'escape_use' : 'escape_click'); else sfx('escape_click');
    if (res.opened) {
      var p = room().puz[res.opened];
      if (r.s) { screenRoom(); say(r.s, function () { openPuz(res.opened); }); }
      else openPuz(res.opened);
      return;
    }
    if (stChanged) screenRoom();
    say(r.s || TX.look, function () { afterGain(res.got, function () { if (res.won) roomClear(); }); });
  }
  function combine(a, b) {
    var c = L.combo(room(), a, b);
    g.sel = null;
    if (!c || !L.cond(g.st, c.c)) { sfx('escape_bad'); say(TX.noCombo); return; }
    var res = L.apply(g.st, c.d);
    sfx('escape_combo');
    screenRoom();
    say(c.s, function () { afterGain(res.got); });
  }
  function turn(d) {
    g.dir = (g.dir + d + 4) % 4; g.edgeF = 0;
    sfx('escape_turn');
    screenRoom();
  }

  /* ============================================================ 提示 / 密技 */
  function hint() {
    var r = room(), k = L.step(r, g.st);
    if (k >= r.steps.length) return;
    var stg = g.hintStage[k] | 0;
    if (stg >= 3) { sfx('escape_bad'); say(TX.hintHead + ' 3/3：' + r.steps[k].h[2] + '\f' + TX.hintNone); return; }
    g.hintStage[k] = stg + 1; g.hints++;
    sfx('escape_hint');
    say(TX.hintHead + ' ' + (stg + 1) + '/3：' + r.steps[k].h[stg] + TX.hintCost);
  }
  function cheat() {
    if (!g) return false;
    if (g.mode === 'timeup') {                      // 原地續關：時間補滿、進度保留
      g.cheats++; g.runCheats++; g.time = 0; g.mode = 'room';
      screenRoom(); Au.stop(); Au.play(g.room === 2 ? 'escape_dome' : 'escape_room');
      sfx('escape_hint'); say(TX.cheatResume);
      return true;
    }
    if (g.mode !== 'room' || g.talk) return false;
    g.cheats++; g.runCheats++;
    if (g.paused) setPause(false);
    if (g.puz) {                                     // 特寫中：直接解開這個機關
      var p = g.puz;
      if (p.kind === 'look') { exitPuz(); return true; }
      solvedPuz(true);
      return true;
    }
    var r = room(), k = L.step(r, g.st);
    if (k >= r.steps.length) return false;
    var stg = g.hintStage[k] | 0;
    var res = L.apply(g.st, r.steps[k].cheat);
    sfx('escape_unlock');
    screenRoom();
    say(TX.cheatSolve + '\f' + r.steps[k].h[2], function () { afterGain(res.got, function () { if (res.won) roomClear(); }); });
    void stg;
    return true;
  }

  /* ============================================================ 機關特寫 */
  function openPuz(id) {
    var p = room().puz[id];
    g.puz = { id: id, p: p, kind: p.kind, t: 0, hold: 0, lastDir: 0, okT: 0 };
    sfx('escape_open');
    screenRoom();
    if (p.kind === 'look') say(p.s, function () { exitPuz(); });
    else say(p.help, function () { g.idleKey = null; }, null, true);
  }
  function exitPuz() {
    g.puz = null;
    screenRoom();
  }
  function solvedPuz(byCheat) {
    var p = g.puz.p, res = L.apply(g.st, p.d);
    sfx('escape_unlock');
    g.puz = null;
    screenRoom();
    say((byCheat ? TX.cheatSolve + '\f' : '') + p.s, function () { afterGain(res.got, function () { if (res.won) roomClear(); }); });
  }
  function dialCh(c) { var i = '0123456789'.indexOf(c); return i >= 0 ? TX.fullDigits.charAt(i) : c; }
  function dialGeom(p) { var x0 = 16 - Math.floor((p.n * 5 - 1) / 2); return { x0: x0, y: 9 }; }
  function lampPos(i) { return { col: 10 + (i % 3) * 4, row: VROW + 2 + ((i / 3) | 0) * 4 }; }
  function slotPos(ring, k) { return { col: 8 + k * 2, row: VROW + 2 + ring * 4 }; }
  function pipePos(p, i) { var G = A.pipeGeom(p); return { col: (G.gx >> 3) + (i % p.w) * 2, row: VROW + (G.gy >> 3) + ((i / p.w) | 0) * 2 }; }
  function drawPuz(now) {
    var P = g.puz, p = P.p, st = g.pz[P.id];
    if (P.kind === 'dial') {
      var G = dialGeom(p);
      textAttr(G.x0, G.y, p.n * 5, 4, 0); textAttr(2, VROW + 1, 28, 2, 0);
      T.print(16 - Math.floor(CT.Text.measure(p.t) / 2), VROW + 1, p.t);
      for (var i = 0; i < p.n; i++) { T.frame(G.x0 + i * 5, G.y, 4, 4, { fill: true }); T.print(G.x0 + i * 5 + 1, G.y + 1, dialCh(st.vals[i])); }
    } else if (P.kind === 'lights') {
      if (now) st.shown = [];
      for (var j = 0; j < 9; j++) {
        var lp = lampPos(j), lk = st.s[j] ? 'on' : 'off';
        if (!now && st.shown[j] === lk) continue;
        st.shown[j] = lk;
        if (now) blit(g.ext[lk], lp.col, lp.row); else qCell(g.ext[lk], lp.col, lp.row);
      }
    } else if (P.kind === 'rings') {
      for (var rg = 0; rg < p.n; rg++) {
        if (now && rg === 0) st.shown = {};
        for (var k = 0; k < p.m; k++) {
          var sp = slotPos(rg, k), rk = st.s[rg] === k ? 'p' + rg : 'e0';
          if (!now && st.shown[rg * 16 + k] === rk) continue;
          st.shown[rg * 16 + k] = rk;
          if (now) blit(g.ext[rk], sp.col, sp.row); else qCell(g.ext[rk], sp.col, sp.row);
        }
        if (now) { textAttr(2, VROW + 2 + rg * 4, 6, 2, 0); T.print(3, VROW + 2 + rg * 4, TX.ringNames[rg]); }
      }
      if (now) { textAttr(0, VROW + 13, 32, 2, 0); for (var b = 0; b < 3; b++) T.print(3 + b * 9, VROW + 13, TX.ringBtns[b]); }
    } else if (P.kind === 'pipes') {
      var fl = L.Pipes.flow(p, st.cells), lit = {};
      fl.lit.forEach(function (q) { lit[q] = 1; });
      st.lit = lit; st.ok = fl.ok;
      for (var n = 0; n < st.cells.length; n++) {
        var cel = st.cells[n], pp = pipePos(p, n), key = cel.t + cel.r + (lit[n] ? 'l' : 'u');
        if (now && n === 0) st.shown = [];
        if (!now && st.shown && st.shown[n] === key) continue;
        (st.shown = st.shown || [])[n] = key;
        if (now) blit(g.ext[key], pp.col, pp.row); else qCell(g.ext[key], pp.col, pp.row);
      }
    }
  }
  function puzDir() {                     // 十字鍵一格一格：首延遲 12 幀、之後每 4 幀
    var P = g.puz, d = 0;
    var dirs = [BTN.UP, BTN.DOWN, BTN.LEFT, BTN.RIGHT];
    for (var i = 0; i < 4; i++) if (pressed(dirs[i])) { P.hold = 0; P.lastDir = dirs[i]; return dirs[i]; }
    if (P.lastDir && held(P.lastDir)) { P.hold++; if (P.hold >= 12 && (P.hold - 12) % 4 === 0) return P.lastDir; }
    else P.hold = 0;
    return d;
  }
  function updatePuz() {
    var P = g.puz, p = P.p, st = g.pz[P.id];
    P.t++;
    if (P.kind === 'look') { if (pressed(BTN.B)) exitPuz(); return; }
    if (P.okT) { if (--P.okT === 0) solvedPuz(false); return; }
    if (pressed(BTN.B)) { sfx('escape_menu'); exitPuz(); return; }
    var d = puzDir();
    if (P.kind === 'dial') {
      var C = Array.from(p.chars), G = dialGeom(p);
      if (d === BTN.LEFT) { st.sel = (st.sel + p.n - 1) % p.n; sfx('escape_move'); }
      else if (d === BTN.RIGHT) { st.sel = (st.sel + 1) % p.n; sfx('escape_move'); }
      else if (d === BTN.UP || d === BTN.DOWN) {
        var ci = C.indexOf(st.vals[st.sel]);
        ci = (ci + (d === BTN.UP ? 1 : C.length - 1)) % C.length;
        st.vals[st.sel] = C[ci];
        T.clear(G.x0 + st.sel * 5 + 1, G.y + 1, 2, 2); T.print(G.x0 + st.sel * 5 + 1, G.y + 1, dialCh(C[ci]));
        sfx('escape_click');
      }
      if (pressed(BTN.A)) {
        if (L.Dial.check(p, st.vals)) { P.okT = 30; sfx('escape_unlock'); }
        else { sfx('escape_bad'); say(TX.wrong); }
      }
    } else if (P.kind === 'lights') {
      var x = st.sel % 3, y = (st.sel / 3) | 0;
      if (d === BTN.LEFT && x > 0) st.sel--; else if (d === BTN.RIGHT && x < 2) st.sel++;
      else if (d === BTN.UP && y > 0) st.sel -= 3; else if (d === BTN.DOWN && y < 2) st.sel += 3;
      if (d) sfx('escape_move');
      if (pressed(BTN.A)) {
        L.Lights.press(p, st.s, st.sel); sfx('escape_click'); drawPuz(false);
        if (L.Lights.done(st.s)) P.okT = 40;
      }
    } else if (P.kind === 'rings') {
      if (d === BTN.LEFT) { st.sel = (st.sel + 2) % 3; sfx('escape_move'); }
      else if (d === BTN.RIGHT) { st.sel = (st.sel + 1) % 3; sfx('escape_move'); }
      if (pressed(BTN.A)) {
        L.Rings.press(p, st.s, st.sel); sfx('escape_click'); drawPuz(false);
        if (L.Rings.done(st.s)) P.okT = 40;
      }
    } else if (P.kind === 'pipes') {
      var px = st.sel % p.w, py = (st.sel / p.w) | 0;
      if (d === BTN.LEFT && px > 0) st.sel--; else if (d === BTN.RIGHT && px < p.w - 1) st.sel++;
      else if (d === BTN.UP && py > 0) st.sel -= p.w; else if (d === BTN.DOWN && py < p.h - 1) st.sel += p.w;
      if (d) sfx('escape_move');
      if (pressed(BTN.A)) {
        var c = st.cells[st.sel];
        c.r = (c.r + 1) % L.Pipes.mod(c.t); sfx('escape_click'); drawPuz(false);
        if (st.ok) P.okT = 50;
      }
    }
  }

  /* ============================================================ 探索（游標） */
  function hoverAt(x, y) {
    if (y >= BAR_ROW * 8 && y < BAR_ROW * 8 + 16) {
      for (var k = 0; k < SLOTS; k++) if (g.st.inv[k] && inR(x, y, slotPx(k))) return { t: 'slot', k: k, id: g.st.inv[k] };
      return null;
    }
    if (y < VROW * 8 || y >= BAR_ROW * 8) return null;
    if (y >= 72 && y < 120) { if (x < 14) return { t: 'turn', d: -1 }; if (x >= 242) return { t: 'turn', d: 1 }; }
    var r = room(), dir = DIRS[g.dir];
    for (var i = r.hot.length - 1; i >= 0; i--) {
      var h = r.hot[i];
      if (h.v !== dir || !L.visible(r, g.st, h)) continue;
      if (inR(x, y, rectPx(h))) return { t: 'hot', h: h };
    }
    return null;
  }
  function moveCursor() {
    var m = 0;
    if (held(BTN.LEFT)) m |= BTN.LEFT; if (held(BTN.RIGHT)) m |= BTN.RIGHT;
    if (held(BTN.UP)) m |= BTN.UP; if (held(BTN.DOWN)) m |= BTN.DOWN;
    if (!m) { g.holdF = 0; g.edgeF = 0; return; }
    g.holdF++;
    var sp = held(BTN.B) ? 1 : (g.holdF > 8 ? 3 : 1);
    if (held(BTN.B)) g.bMoved = true;
    var ox = g.cx;
    if (m & BTN.LEFT) g.cx -= sp; if (m & BTN.RIGHT) g.cx += sp;
    if (m & BTN.UP) g.cy -= sp; if (m & BTN.DOWN) g.cy += sp;
    g.cx = Math.max(0, Math.min(252, g.cx)); g.cy = Math.max(VROW * 8, Math.min(BAR_ROW * 8 + 14, g.cy));
    // 推到左右邊緣持續 20 幀 = 轉身（房間畫面範圍內）
    if (g.cy < BAR_ROW * 8 && ((m & BTN.LEFT && ox === 0 && g.cx === 0) || (m & BTN.RIGHT && ox === 252 && g.cx === 252))) {
      if (++g.edgeF >= EDGE_F) { turn(m & BTN.LEFT ? -1 : 1); g.cx = m & BTN.LEFT ? 236 : 16; }
    } else g.edgeF = 0;
  }
  function updateExplore() {
    moveCursor();
    g.hover = hoverAt(g.cx, g.cy);
    // B：點一下 = 放下物品；按住 + 十字鍵 = 微調
    if (held(BTN.B)) g.bHold++;
    else {
      if (g.bHold > 0 && g.bHold < 20 && !g.bMoved && g.sel) { g.sel = null; sfx('escape_menu'); }
      g.bHold = 0; g.bMoved = false;
    }
    if (pressed(BTN.SELECT)) { hint(); return; }
    if (pressed(BTN.A)) {
      var hv = g.hover;
      if (!hv) { sfx('escape_move'); return; }
      if (hv.t === 'turn') { turn(hv.d); return; }
      if (hv.t === 'slot') {
        if (!g.sel) { g.sel = hv.id; sfx('escape_use'); }
        else if (g.sel === hv.id) { g.sel = null; sfx('escape_menu'); }
        else combine(g.sel, hv.id);
        g.idleKey = null;
        return;
      }
      interact(hv.h);
    }
  }

  /* ============================================================ 結算 */
  function rankOf(eff, par) {
    if (eff <= par) return 'S';
    if (eff <= par * 1.5) return 'A';
    if (eff <= par * 2.5) return 'B';
    return 'C';
  }
  function roomClear() {
    var r = room(), eff = g.time + g.hints * HINT_COST, rk = g.hints === 0 && eff <= r.par ? 'S' : rankOf(eff, r.par);
    if (rk === 'S' && g.hints > 0) rk = 'A';
    g.mode = 'result'; g.puz = null; g.sel = null;
    var best = CT.load(ID, 'best' + g.room, null), nb = false;
    if (!g.runCheats) {
      if (!best || eff < best.t) { CT.save(ID, 'best' + g.room, { t: eff, r: rk }); nb = true; }
      if (CT.load(ID, 'clear', 0) < g.room + 1) CT.save(ID, 'clear', g.room + 1);
      if (g.room === 0) g.goalHit = true;
    }
    g.result = { room: g.room, time: g.time, hints: g.hints, eff: eff, rank: rk, newBest: nb, cheated: g.runCheats > 0 };
    Au.stop(); Au.play('escape_clear');
    screenText('result');
    var R0 = g.result, y = 5;
    T.frame(2, 4, 28, 17, { fill: false });          // 不填底、不改屬性：保留評價徽章（pal 2）
    T.print(4, y, TX.roomNames[R0.room]);
    T.print(4, y + 2, TX.clearTitle);
    T.print(4, y + 5, TX.timeLabel + '  ' + mmss(R0.time));
    T.print(4, y + 7, TX.hintLabel + '  ' + R0.hints + ' ' + TX.times + (R0.hints ? '（+' + mmss(R0.hints * HINT_COST) + '）' : ''));
    T.print(4, y + 10, TX.rankLabel);
    T.print(13, y + 10, TX.rankWords[rk]);
    T.print(4, y + 13, R0.cheated ? TX.cheated : (nb ? TX.newBest : TX.best + '  ' + mmss(best.t) + '  ' + TX.rankBig[best.r]));
    T.print(4, 22, R0.room < 2 ? TX.nextRoom : TX.lastRoom);
    g.t = 0;
  }
  function timeUp() {
    g.mode = 'timeup'; g.puz = null; g.talk = false;
    Au.stop(); Au.play('escape_over');
    screenText('timeup');
    T.frame(4, 8, 24, 12, { pal: 0 });
    T.print(6, 10, TX.roomNames[g.room]);
    T.print(6, 13, TX.timeUp);
    T.print(6, 16, TX.timeUpHelp);
    T.print(6, 22, TX.timeUpCheat);
    g.t = 0;
  }

  /* ============================================================ 標題 / 說明 / 選房 / 故事 */
  function toTitle() {
    g.mode = 'title'; g.paused = false; g.talk = false; g.puz = null;
    screenText('title');
    textAttr(0, 2, 32, 2, 2);
    T.print(12, 2, TX.title);
    menu = T.menu({ x: 9, y: 20, items: TX.menu, cancel: false, pal: 0, input: true, onMove: function () { sfx('escape_move'); }, onChoose: titleChoose });

    Au.stop(); Au.play('escape_title');
    g.t = 0;
  }
  function titleChoose(k) {

  }
  function toHelp() {

  }
  function toSelect() {

    menu = T.menu({ x: 6, y: 8, items: items, pal: 0, input: true, onMove: function () { sfx('escape_move'); }, onChoose: function (k) {
      if (k < 0) { sfx('escape_menu'); toTitle(); return; }
      if (k > n) { sfx('escape_bad'); menu.phase = 'open'; return; }
      sfx('escape_menu'); startRoom(k);
    } });

    T.print(6, 18, TX.back);
    for (var i = 0; i < 3; i++) {
      var b = CT.load(ID, 'best' + i, null);

  // 故事：一段段 [名字, 文字]
  function story(key, then) {
    g.mode = 'story';
    var segs = key === 'intro' ? [[TX.keeper, TX.intro]] : (key === 'end' ? TX.ending : [[TX.keeper, TX.between[key]]]);
    screenText(key === 'end' ? 'end' : 'story');
    textAttr(0, 16, 32, 14, 0);
    box = T.box({ x: 1, y: 20, w: 30, h: 8, input: false, pal: 0 });
    Au.stop(); Au.play('escape_title');
    var i = 0;
    (function next() {
      if (i >= segs.length) { then(); return; }
      var s = segs[i++];
      say(s[1], next, s[0]);
    })();
  }

  /* ============================================================ 暫停 */
  // fix-r9：磁磚多的牆面字形池只有 ~90 磚。沒在對話 ⇒ 清掉訊息框（解除暫停後 idleText 重畫），HUD 換成「暫停中 / START 繼續」、
  //   物品欄位置印「長按 START+SELECT：回選單」；對話中 ⇒ 對話框已依「池 − 框外用字」分好頁，不再新增任何字，只用精靈畫暫停記號。
  function setPause(on) {
    if (g.paused === on) return;
    g.paused = on;
    if (on) Au.pause(); else Au.resume();
    sfx('escape_menu');
    if (on) g.pauseText = !g.talk;
    if (!g.pauseText) return;
    T.clear(1, 2, 20, 2);
    T.print(1, 2, on ? TX.pause : room().name);
    T.print(11, 2, on ? TX.resume : (g.puz ? TX.leave : TX.dirFull[g.dir]));
    T.clear(0, BAR_ROW, 32, 2);
    if (on) {
      T.clear(BOX.x + 1, BOX.y + 1, BOX.w - 2, BOX.h - 2); g.idleKey = null;
      T.print(4, BAR_ROW, TX.pauseHelp[1]);
      T.print(BOX.x + 2, BOX.y + 1, TX.pauseHelp[0]);
    } else T.call(function () { T.release(0, BAR_ROW, 32, 2); drawBar(false); });
  }

  /* ============================================================ 精靈 */
  function drawSprites() {
    var i;
    for (i = 0; i < 16; i++) ppu0.sprite(i, null);
    var S = function (n) { return spr.index(n); };
    if (g.mode !== 'room') return;
    if (g.paused) {                                  // 暫停記號（兩條直槓，在剩餘時間左邊）
      ppu0.sprite(0, { x: 184, y: 24, tile: S('S_PAUSE'), pal: 0 });
      return;
    }
    var blink = (g.frames >> 4) & 1;
    if (g.puz) {
      var P = g.puz, p = P.p, st = g.pz[P.id];
      if (g.talk || P.kind === 'look') return;
      var bx = -1, by = -1, bw = 16, bh = 16;
      if (P.kind === 'dial') {
        var G = dialGeom(p), cx = (G.x0 + st.sel * 5) * 8 + 12;
        ppu0.sprite(0, { x: cx, y: G.y * 8 - 9, tile: S('S_UP'), pal: 2 });
        ppu0.sprite(1, { x: cx, y: (G.y + 4) * 8 + 1, tile: S('S_DOWN'), pal: 2 });
        return;
      }
      if (P.kind === 'lights') { var lp = lampPos(st.sel); bx = lp.col * 8; by = lp.row * 8; }
      else if (P.kind === 'pipes') { var pp = pipePos(p, st.sel); bx = pp.col * 8; by = pp.row * 8; }
      else if (P.kind === 'rings') { ppu0.sprite(0, { x: (3 + st.sel * 9) * 8 - 9, y: (VROW + 13) * 8 + 4, tile: S('S_RIGHT'), pal: 2 }); return; }
      if (bx >= 0 && blink) {
        ppu0.sprite(0, { x: bx - 3, y: by - 3, tile: S('S_TL'), pal: 1 }); ppu0.sprite(1, { x: bx + bw - 5, y: by - 3, tile: S('S_TR'), pal: 1 });
        ppu0.sprite(2, { x: bx - 3, y: by + bh - 5, tile: S('S_BL'), pal: 1 }); ppu0.sprite(3, { x: bx + bw - 5, y: by + bh - 5, tile: S('S_BR'), pal: 1 });
      }
      return;
    }
    // 轉身箭頭
    var hv = g.hover;
    ppu0.sprite(4, { x: 3, y: 92, tile: S('S_LEFT'), pal: (hv && hv.t === 'turn' && hv.d < 0 && blink) ? 0 : 2 });
    ppu0.sprite(5, { x: 245, y: 92, tile: S('S_RIGHT'), pal: (hv && hv.t === 'turn' && hv.d > 0 && blink) ? 0 : 2 });
    // 拿著的物品：物品欄四角
    if (g.sel) {
      var k = g.st.inv.indexOf(g.sel);
      if (k >= 0 && (blink || g.talk)) {
        var sx = 16 + k * 32, sy = BAR_ROW * 8;
        ppu0.sprite(6, { x: sx - 3, y: sy - 2, tile: S('S_TL'), pal: 1 }); ppu0.sprite(7, { x: sx + 11, y: sy - 2, tile: S('S_TR'), pal: 1 });
        ppu0.sprite(8, { x: sx - 3, y: sy + 10, tile: S('S_BL'), pal: 1 }); ppu0.sprite(9, { x: sx + 11, y: sy + 10, tile: S('S_BR'), pal: 1 });
      }
    }
    if (g.talk) return;
    // 游標（放大鏡 = 可調查；手 = 拿著物品）
    var t = g.sel ? 'S_HAND' : (hv && hv.t !== 'turn' ? 'S_LOOK' : 'S_ARROW'), off = t === 'S_ARROW' ? 0 : 3;
    ppu0.sprite(0, { x: g.cx - off, y: g.cy - off, tile: S(t), pal: 0 });
  }

  /* ============================================================ 主迴圈 */
  function update() {
    g.frames++; g.t++;
    pumpWQ();
    if (g.mode === 'title' || g.mode === 'select') { /* menu 由 T.update 讀手把 */ }
    else if (g.mode === 'help' || g.mode === 'story') { if (g.talk) updateTalk(); }
    else if (g.mode === 'result') {
      if (g.t > 30 && pressed(BTN.A)) {
        sfx('escape_menu');
        var nx = g.room + 1;
        if (nx < 3) story(g.room, function () { startRoom(nx); });
        else story('end', function () { toTitle(); });
      } else if (g.t > 30 && pressed(BTN.B)) toTitle();
    } else if (g.mode === 'timeup') {
      if (g.t > 30 && pressed(BTN.A)) startRoom(g.room);
      else if (g.t > 30 && pressed(BTN.B)) toTitle();
    } else if (g.mode === 'room') {
      if (pressed(BTN.START) && !(held(BTN.SELECT))) { setPause(!g.paused); }
      else if (!g.paused) {
        g.time++;
        if (g.time >= room().limit) { timeUp(); T.update(); return; }
        if (g.time % 60 === 0) drawTime(false);
        if (g.talk) updateTalk();
        else if (g.puz) updatePuz();
        else updateExplore();
        if (g.mode === 'room' && !g.talk) idleText(false);
        // 特寫：說明打完就收起 ■（文字留著）
        if (g.puz && g.talk && g.autoClose && box && box.state().phase === 'end') box.next();
      }
    }
    if (T) T.update();
  }

  /* ============================================================ 機器人（照解題路線用游標操作；反應延遲 ≥ 12 幀） */
  function botMove(tx, ty) {
    var dx = tx - g.cx, dy = ty - g.cy, m = 0, fine = Math.abs(dx) <= 6 && Math.abs(dy) <= 6;
    if (dx > 1) m |= BTN.RIGHT; else if (dx < -1) m |= BTN.LEFT;
    if (dy > 1) m |= BTN.DOWN; else if (dy < -1) m |= BTN.UP;
    if (m && fine) m |= BTN.B;                    // 靠近了：按住 B 微調（1 px）
    return m;
  }
  function botPress(mask) { g.bot.seq = [mask, 0]; g.bot.wait = 0; g.bot.after = 13; return 0; }
  // 熱點上「真的會點到它」的點（被後面的熱點蓋住的地方不算），取最靠近中心的
  function center(h) {
