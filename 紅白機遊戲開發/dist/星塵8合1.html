<!-- ===== engine（契約載入順序；缺檔不致命，nes.js 會用 stub 頂替） ===== -->
<script>/* engine/palette.js */
/*!
 * engine/palette.js — NES 系統調色盤（64 色 NTSC RGB 近似表）
 * 專案：紅白機遊戲開發 / R1 核心引擎 ｜ agent: ppu ｜ 版本 1.0.0（2026-09-17）
 *
 * 來源（RGB 值）：
 *   docs/research/01_硬體規格與限制.md §3.4「NES 系統調色盤（常用 RGB 近似值）」
 *   原始出處：ROM Detectives Wiki 的 2C02 調色盤表（即 FCEUX / Nestopia 常見的預設 RGB 近似）。
 *   注意：2C02 輸出的是 NTSC 複合訊號，沒有唯一正解的 RGB；本表僅為工作用近似值。
 *
 * 規格要點（docs/research/01 §3.4、05 §1.1）：
 *   - 索引為 6 bit（$00–$3F），編碼 `VVHHHH`：低 4 bit 色相、高 2 bit 亮度。
 *   - $0F 為標準黑；$0D 是「blacker than black」，官方警告不要用 → FORBIDDEN。
 *   - $0E/$0F/$1D/$1E/$1F/$2E/$2F/$3E/$3F 實質同為黑（去重後約 54 色）。
 *
 * API（docs/TASKS.md「API 契約」）：
 *   NES.PALETTE            → 長度 64 的陣列，每項 [r, g, b]
 *   NES.PALETTE.FORBIDDEN  → [0x0D]
 *   NES.PALETTE.rgb(i)     → [r, g, b]（複本；i 超出 0..63 會 throw）
 *   NES.PALETTE.nearest(r, g, b) → 最接近的調色盤索引（自動跳過 FORBIDDEN）
 *   附加（非契約，便利用）：hex(i)、isForbidden(i)、assert(i)、SIZE、VERSION
 */
(function (global) {
  'use strict';
  var NES = global.NES = global.NES || {};

  // 依 $00..$3F 順序排列的 24-bit RGB。
  var HEX = [
    0x7C7C7C, 0x0000FC, 0x0000BC, 0x4428BC, 0x940084, 0xA80020, 0xA81000, 0x881400,
    0x503000, 0x007800, 0x006800, 0x005800, 0x004058, 0x000000, 0x000000, 0x000000,
    0xBCBCBC, 0x0078F8, 0x0058F8, 0x6844FC, 0xD800CC, 0xE40058, 0xF83800, 0xE45C10,
    0xAC7C00, 0x00B800, 0x00A800, 0x00A844, 0x008888, 0x000000, 0x000000, 0x000000,
    0xF8F8F8, 0x3CBCFC, 0x6888FC, 0x9878F8, 0xF878F8, 0xF85898, 0xF87858, 0xFCA044,
    0xF8B800, 0xB8F818, 0x58D854, 0x58F898, 0x00E8D8, 0x787878, 0x000000, 0x000000,
    0xFCFCFC, 0xA4E4FC, 0xB8B8F8, 0xD8B8F8, 0xF8B8F8, 0xF8A4C0, 0xF0D0B0, 0xFCE0A8,
    0xF8D878, 0xD8F878, 0xB8F8B8, 0xB8F8D8, 0x00FCFC, 0xF8D8F8, 0x000000, 0x000000
  ];

  var PALETTE = [];
  for (var i = 0; i < 64; i++) {
    var h = HEX[i];
    PALETTE.push([(h >> 16) & 0xFF, (h >> 8) & 0xFF, h & 0xFF]);
  }

  PALETTE.VERSION = '1.0.0';
  PALETTE.SIZE = 64;
  PALETTE.SOURCE = 'ROM Detectives Wiki 2C02 palette (via docs/research/01 §3.4)';
  PALETTE.FORBIDDEN = [0x0D]; // $0D = blacker than black，禁用

  PALETTE.isForbidden = function (i) {
    return PALETTE.FORBIDDEN.indexOf(i | 0) >= 0;
  };

  // 驗證色號：非 0..63 整數或禁用色 → throw。ppu.js 設調色盤時會呼叫。
  PALETTE.assert = function (i, where) {
    if (typeof i !== 'number' || (i | 0) !== i || i < 0 || i > 63) {
      throw new Error('NES.PALETTE: 色號必須是 0..63 的整數，收到 ' + i +
        (where ? ' (' + where + ')' : ''));
    }
    if (PALETTE.isForbidden(i)) {
      throw new Error('NES.PALETTE: $' + ('0' + i.toString(16).toUpperCase()).slice(-2) +
        ' 是禁用色（blacker than black）' + (where ? ' (' + where + ')' : ''));
    }
    return i;
  };

  PALETTE.rgb = function (i) {
    if (typeof i !== 'number' || (i | 0) !== i || i < 0 || i > 63) {
      throw new Error('NES.PALETTE.rgb: 索引必須是 0..63 的整數，收到 ' + i);
    }
    var c = PALETTE[i];
    return [c[0], c[1], c[2]];
  };

  PALETTE.hex = function (i) {
    var c = PALETTE.rgb(i);
    return '#' + ('00000' + ((c[0] << 16) | (c[1] << 8) | c[2]).toString(16).toUpperCase()).slice(-6);
  };

  // 最接近色（歐氏距離平方，跳過禁用色）。相同距離取索引小者。
  PALETTE.nearest = function (r, g, b) {
    var best = 0, bestD = Infinity;
    for (var i = 0; i < 64; i++) {
      if (PALETTE.isForbidden(i)) continue;
      var c = PALETTE[i];
      var dr = c[0] - r, dg = c[1] - g, db = c[2] - b;
      var d = dr * dr + dg * dg + db * db;
      if (d < bestD) { bestD = d; best = i; if (d === 0) break; }
    }
    return best;
  };

  NES.PALETTE = PALETTE;
})(typeof window !== 'undefined' ? window : this);

</script>
<script>/* engine/fixed.js */
/* engine/fixed.js — NES.FX：定點數工具（位置 1/16 px、速度 8.8）
 * R1 / agent core。classic script、IIFE、零相依。
 *
 * 單位系統（全部整數；命名與 docs/TASKS.md「API 契約」一致）
 * ┌──────────┬───────────────┬───────────────────────────────────────────┐
 * │ 名稱     │ 1 單位 =      │ 用途                                       │
 * ├──────────┼───────────────┼───────────────────────────────────────────┤
 * │ sub      │ 1/16 px       │ 位置（SUB = 16）                           │
 * │ vel      │ 1/256 px/幀   │ 速度 8.8（v88(hi,lo) = hi 整數 px + lo/256）│
 * │ acc      │ 1/4096 px/幀² │ 加速度（= 1/16 vel，ACC = 16）             │
 * └──────────┴───────────────┴───────────────────────────────────────────┘
 * 兩層換算都是「每 16 個小單位進位 1 個大單位」，所以累加一律用 >>4 / &15，
 * 負數用算術右移自然取 floor，餘數恆為 0..15，不會因正負號漂移。
 *
 * 與 SMB1 反組譯常數的對應（見下方 NES.FX.SMB）：
 *   SMB「速度值」1 單位 = 1/16 px/幀 = 16 vel
 *   SMB「加速度 / 摩擦」1 單位 = 1/256 速度值/幀 = 1/4096 px/幀² = 1 acc  ← 原始位元組可直接用
 *   SMB「重力值」1 單位 = 1/256 px/幀² = 1 vel/幀 = 16 acc
 */
(function (root) {
  'use strict';
  var NES = root.NES = root.NES || {};

  var SUB = 16;    // 位置：1 px = 16 sub
  var VEL = 256;   // 速度：1 px/幀 = 256 vel（8.8 的 .8）
  var ACC = 16;    // 加速度：1 vel/幀 = 16 acc（→ 1 px/幀² = 4096 acc）

  /* ---------- 位置換算 ---------- */
  function toSub(px) { return (px * SUB) | 0; }          // px → sub（截尾取整）
  function toPx(sub) { return (sub | 0) / SUB; }         // sub → px（唯一會回傳非整數的函式，顯示 / 除錯用）
  function floorPx(sub) { return (sub | 0) >> 4; }       // sub → px（向下取整，負數也正確）
  function ceilPx(sub) { return -((-(sub | 0)) >> 4); }
  function roundPx(sub) { return ((sub | 0) + 8) >> 4; }
  function subFrac(sub) { return (sub | 0) & 15; }       // 像素內的 1/16 餘數（0..15）

  /* ---------- 速度換算（8.8） ---------- */
  // v88(2, 128) = 2.5 px/幀 = 640；負速度傳負的 hi：v88(-2, 128) = -640
  function v88(hi, lo) {
    hi = hi | 0; lo = lo | 0;
    if (hi < 0) return -(((-hi) * VEL + (lo < 0 ? -lo : lo)) | 0);
    return (hi * VEL + lo) | 0;
  }
  function velToPx(v) { return (v | 0) / VEL; }                     // vel → px/幀
  function pxToVel(px) { return Math.round(px * VEL) | 0; }         // px/幀 → vel
  function accToPx(a) { return (a | 0) / (VEL * ACC); }             // acc → px/幀²
  function pxToAcc(px) { return Math.round(px * VEL * ACC) | 0; }   // px/幀² → acc
  function smbSpd(b) { return ((b | 0) * 16) | 0; }                 // SMB 速度值($xx) → vel
  function smbGrav(b) { return ((b | 0) * 16) | 0; }                // SMB 重力值($xx) → acc

  /* ---------- Vec：{sub, frac} 小物件，每幀零配置 ---------- */
  function Vec(px, frac) { return { sub: toSub(px || 0), frac: frac | 0 }; }
  function vecSub(sub, frac) { return { sub: sub | 0, frac: frac | 0 }; }
  function vadd(vec, v) {                    // 位置前進一幀，回傳新的 sub
    var f = vec.frac + (v | 0);
    var d = f >> 4;
    vec.frac = f - (d << 4);
    vec.sub = (vec.sub + d) | 0;
    return vec.sub;
  }
  function vsetPx(vec, px) { vec.sub = toSub(px); vec.frac = 0; return vec; }
  function vsetSub(vec, sub) { vec.sub = sub | 0; vec.frac = 0; return vec; }
  function vpx(vec) { return vec.sub >> 4; }
  function vpxf(vec) { return vec.sub / SUB; }

  /* ---------- Acc：{v, frac} 速度小物件（加速度累加用） ---------- */
  function Acc(v) { return { v: v | 0, frac: 0 }; }
  function aadd(av, a) {                     // 速度前進一幀，回傳新的 vel
    var f = av.frac + (a | 0);
    var d = f >> 4;
    av.frac = f - (d << 4);
    av.v = (av.v + d) | 0;
    return av.v;
  }
  function aset(av, v) { av.v = v | 0; av.frac = 0; return av; }
  // 朝 target 以 a（acc 單位）逼近並夾住，不會過衝
  function aapproach(av, target, a) {
    target = target | 0;
    if (av.v < target) { aadd(av, a); if (av.v > target) aset(av, target); }
    else if (av.v > target) { aadd(av, -(a | 0)); if (av.v < target) aset(av, target); }
    return av.v;
  }

  /* ---------- 相容別名（R1 fix1 定案：正式寫法是 Vec / Acc）----------
   * 舊契約 `addVel(posSub, v88) → {pos, frac}` 與舊實作 `addVel(posSub, v, frac) → int`
   * （餘數放在全域 `NES.FX.frac`）**都已作廢**：全域餘數在多實體（主角 + N 個敵人）
   * 之間會互相污染。正式寫法是把餘數放進物件本身：
   *     位置 `Vec{sub, frac}` + `vadd(vec, v)`　／　速度 `Acc{v, frac}` + `aadd(av, a)`
   * `addVel / addAcc` 保留為**明確版本的相容別名**（= vadd / aadd），沒有任何隱藏狀態。
   */
  function addVel(vec, v) {
    if (!vec || typeof vec !== 'object' || typeof vec.sub !== 'number') {
      throw new TypeError('NES.FX.addVel 已改為 addVel(vec, v)（vec = FX.Vec(px)）；' +
        '舊的 addVel(posSub, v, frac) 與全域 NES.FX.frac 已移除，見 docs/ENGINE_API.md §3');
    }
    return vadd(vec, v);
  }
  function addAcc(av, a) {
    if (!av || typeof av !== 'object' || typeof av.v !== 'number') {
      throw new TypeError('NES.FX.addAcc 已改為 addAcc(acc, a)（acc = FX.Acc(vel)）；' +
        '舊的 addAcc(v, a, frac) 已移除，見 docs/ENGINE_API.md §3');
    }
    return aadd(av, a);
  }

  /* ---------- 整數工具 ---------- */
  function clamp(v, lo, hi) { v = v | 0; lo = lo | 0; hi = hi | 0; return v < lo ? lo : (v > hi ? hi : v); }
  function sign(v) { v = v | 0; return v > 0 ? 1 : (v < 0 ? -1 : 0); }
  function abs(v) { v = v | 0; return v < 0 ? -v : v; }
  function absMax(v, m) { v = v | 0; m = m | 0; if (m < 0) m = -m; return v > m ? m : (v < -m ? -m : v); }
  function mulShr(a, b, s) { return ((a | 0) * (b | 0)) >> (s | 0); }  // 定點乘法

  /* ---------- SMB1 常數表 ----------
   * 來源：docs/research/03_經典遊戲深度解析/01_超級瑪利歐兄弟.md ②「速度與加速度」「跳躍」
   *       原始出處 doppelganger《A Comprehensive SMB Disassembly》(SMBDIS.ASM)
   * 每一欄都標原始位元組與換算後的 px 值，方便回頭核對。
   */
  var SMB = {
    src: 'docs/research/03_經典遊戲深度解析/01_超級瑪利歐兄弟.md（SMBDIS.ASM 反組譯）',

    // MaxRightXSpdData / MaxLeftXSpdData（原始為 1/16 px/幀 的速度值）
    maxRun:      smbSpd(0x28),   // $28 = 40 → 2.5  px/幀 = 640 vel
    maxWalk:     smbSpd(0x18),   // $18 = 24 → 1.5  px/幀 = 384 vel
    maxWater:    smbSpd(0x10),   // $10 = 16 → 1.0  px/幀 = 256 vel
    maxCutscene: smbSpd(0x0c),   // $0c = 12 → 0.75 px/幀 = 192 vel

    // FrictionData（原始為 1/256 速度值/幀 = 1 acc，數值可直接用）
    accRun:   0xe4,              // 228 → 0.05566 px/幀²（14.25 vel/幀）
    accWalk:  0x98,              // 152 → 0.03711 px/幀²（ 9.5  vel/幀）
    friction: 0xd0,              // 208 → 0.05078 px/幀²（13.0  vel/幀）
    turnShift: 1,                // 面向 ≠ 移動方向時 `asl` → 加速度 ×2（煞車/轉身快一倍）

    // 空中控制門檻：水平速度 ≥ $19（1.5625 px/幀）才沿用跑步上限與跑步加速度
    airRunSpeed: smbSpd(0x19),   // 400 vel

    /* 跳躍 5 段：依起跳瞬間的水平速度絕對值（vel）選段
     * belowSpeed = 該段的上界（最後一段為 Infinity）
     * vy0 = 起跳初速（vel，負 = 往上）；gHold/gFall = 按住 / 放開 A 的重力（acc）
     * h = 研究文件列的理論最高跳躍高度（px），僅供對照（離散積分會差 1~3 px）
     */
    jump: [
      { belowSpeed: smbSpd(0x09), vy0: -v88(4, 0), gHold: smbGrav(0x20), gFall: smbGrav(0x70), h: 64 },
      { belowSpeed: smbSpd(0x10), vy0: -v88(4, 0), gHold: smbGrav(0x20), gFall: smbGrav(0x70), h: 64 },
      { belowSpeed: smbSpd(0x19), vy0: -v88(4, 0), gHold: smbGrav(0x1e), gFall: smbGrav(0x60), h: 68 },
      { belowSpeed: smbSpd(0x1c), vy0: -v88(5, 0), gHold: smbGrav(0x28), gFall: smbGrav(0x90), h: 80 },
      { belowSpeed: Infinity,     vy0: -v88(5, 0), gHold: smbGrav(0x28), gFall: smbGrav(0x90), h: 80 }
    ],
    swim:      { vy0: -v88(2, 0), gHold: smbGrav(0x0d), gFall: smbGrav(0x0a) },
    whirlpool: { vy0: -v88(1, 0), gHold: smbGrav(0x04), gFall: smbGrav(0x09) },

    // 放開 A 後要離地 ≥ 1 px 才切成大重力（DiffToHaltJump）
    diffToHaltJump: SUB,         // 16 sub = 1 px

    // 敵人：NormalXSpdData（栗寶寶等）
    enemySlow: smbSpd(0x08),     // $f8 → 0.5  px/幀（表中為負方向，這裡存絕對值）
    enemyFast: smbSpd(0x0c),     // $f4 → 0.75 px/幀

    // 計時器節拍（幀）
    intervalTimer: 21,           // IntervalTimerControl：每 21 幀一跳（framerule）
    injuryFrames: 8 * 21,        // 168 幀 ≈ 2.80 秒
    starFrames: 35 * 21,         // 735 幀 ≈ 12.2 秒

    // 依水平速度取跳躍段
    jumpFor: function (absSpeedVel) {
      absSpeedVel = absSpeedVel < 0 ? -absSpeedVel : absSpeedVel;
      for (var i = 0; i < SMB.jump.length; i++) if (absSpeedVel < SMB.jump[i].belowSpeed) return SMB.jump[i];
      return SMB.jump[SMB.jump.length - 1];
    },

    /* ---- 起跳首幀的重力（R1 fix1 總控裁定；QA P1-4 / P1-5）----------------
     * 半隱式 Euler（每幀「先加重力、再位移」）會把跳躍高度系統性地低估半個
     * 重力步：靜止跳 62.00 px（文件 4 格 = 64）、全速跳 77.50 px（文件 5 格 = 80），
     * ⇒「剛好 4 格牆 / 5 格牆」的關卡會跳不過去。
     * 修正：**起跳後的第 1 幀只套用半格重力**（leapfrog / 中點積分），之後照常。
     *   離散積分和 = Σ(v0 − g(k+½)) = v0²/2g ＝ 連續解 ⇒ 靜止跳 64.00 px、全速跳 80.00 px（±0）。
     * skipGravityFirstFrame 三種值：
     *   true / 'half' 首幀半格重力 →  64.00 / 80.00 px（預設，對齊研究文件 03/01）
     *   'full'        首幀完全不加重力 → 66.00 / 82.50 px（超過文件 2 / 2.5 px）
     *   false         舊行為（純半隱式） → 62.00 / 77.50 px（比文件少 2 / 2.5 px）
     */
    skipGravityFirstFrame: true
  };

  /* ---------- 跳躍：core 與 demo 共用的唯一一套規則 ----------
   * 用法（見 games/demo/main.js stepPlayer）：
   *   var js = FX.SMB.jumpState(g.vy);               // 綁定自己的 Acc，零配置
   *   if (onGround && pressedA) FX.SMB.jumpStart(js, FX.abs(vx), py.sub);
   *   if (!onGround) FX.SMB.jumpGravity(js, aHeldNow, py.sub, MAX_FALL);
   *   FX.vadd(py, js.vy.v);                          // 先重力、再位移（半隱式）
   * 規則：① 依起跳瞬間 |vx| 取 5 段之一（jumpFor）
   *       ② 按住 A = gHold；放開 **且已離地 ≥ 1 px**（DiffToHaltJump）才切 gFall
   *       ③ 起跳首幀依 skipGravityFirstFrame 只套半格重力（見上）
   */
  function jumpState(vyAcc) {
    return {
      seg: SMB.jump[0],
      vy: vyAcc || Acc(0),
      fastFall: false,
      startSub: 0,
      first: false,
      skipFirst: SMB.skipGravityFirstFrame
    };
  }
  function jumpStart(js, absVxVel, pySub) {
    js.seg = SMB.jumpFor(absVxVel | 0);
    aset(js.vy, js.seg.vy0);
    js.fastFall = false;
    js.startSub = pySub | 0;
    js.first = true;
    return js;
  }
  // 重新設定垂直速度但不算「新的一次跳躍」（踩敵回彈、被彈飛…）
  function jumpBounce(js, vel, pySub) {
    aset(js.vy, vel | 0);
    js.fastFall = false;
    js.startSub = pySub | 0;
    js.first = false;
    return js;
  }
  function jumpGravity(js, aHeld, pySub, maxFall) {

/* engine/cpu_timing.js — NES.Timing：60.0988 Hz 固定步邏輯迴圈
 * R1 / agent core。classic script、IIFE、零相依。
 *
 * 原則：
 *   - 邏輯步長固定 1/hz，**不做 delta-time 補間**（位置永遠是整數 sub 的累加）。
 *   - rAF 迴圈用累加器；一次 rAF 最多補 3 幀，還有剩就直接丟掉（避免分頁回前景時暴衝）。
 *   - step(n) 同步跑 n 幀（不走 rAF），供 tools/test_*.py 與截圖使用。
 *   - 每幀順序：Input.poll() → update() → draw()（NES.Input 不存在就跳過 poll）。
 *   - budget 模擬 VBlank 的 PPU 寫入頻寬：NTSC VBlank ≈ 2273 cycle ≈ 160~200 bytes。

 *       'ppu'（預設）名稱表 / 屬性表 / 調色盤，limit = 160 byte（NTSC）

    if (res && res.frame) res = res.frame;
    if (!res) return 'lint: (無結果)';
    return 'lint ' + (res.ok ? 'PASS' : 'FAIL') + ' — 色數 ' + res.colors + '/' + res.maxColors +
      '、非法像素 ' + res.badPixels + '、超線 ' + (res.overLine ? res.overLine.length : 0) +
      (res.errors && res.errors.length ? '｜' + res.errors.join('；') : '');
  }

  var Lint = {
    strict: false,
    magenta: false,
    maxColors: 25,
    maxSpritesPerLine: 8,
    MAGENTA: MAGENTA,
    VISIBLE: { y0: 8, y1: 232 },  // 研究 01 §3.1：NTSC 電視只看得到中央 256×224
    frame: frame,
    oam: oam,
    check: check,
    summary: summary
  };
  NES.Lint = Lint;
})();

      BTN: { A: 1, B: 2, SELECT: 4, START: 8, UP: 16, DOWN: 32, LEFT: 64, RIGHT: 128 },
      poll: function () { if (injFrames > 0) injFrames--; else injected = 0; },
      held: function (b) { return !!(injected & b); },
      pressed: function () { return false; },
      released: function () { return false; },
      mask: function () { return injected; },
      inject: function (m, f) { injected = m | 0; injFrames = f | 0; },
      record: function () { }, stopRecord: function () { return []; }, replay: function () { }
    };
  }

  // Timing stub：rAF 固定步；step(n) 同步推進（不走 rAF），語意同契約
  function stubTiming(o) {
    var hz = o.hz || NES.HZ, running = false, last = 0, acc = 0, raf = 0;
    var t = {
      stub: true, frame: 0, hz: hz,
      budget: {
        limit: 160, used: 0, oamLimit: 256, oamUsed: 0, over: false, overFrames: 0,
        serial: 0, mute: false, strict: false,
        set: function () { return this; }, setOam: function () { return this; },
        use: function () { return true; },
        left: function () { return this.limit; }, oamLeft: function () { return this.oamLimit; },
        reset: function () { this.serial = (this.serial + 1) | 0; return this; },
        clear: function () { return this.reset(); },
        report: function () { return { limit: this.limit, used: 0, over: false, stub: true }; }
      },
      setMode: function (m) { t.hz = hz = (m === 'pal') ? 50.0070 : NES.HZ; },
      one: function () { o.update && o.update(); o.draw && o.draw(); t.frame++; },
      step: function (n) { for (var i = 0; i < (n || 1); i++) t.one(); return t.frame; },
      start: function () {

        raf = requestAnimationFrame(function loop(ts) {
          if (!running) return;
          raf = requestAnimationFrame(loop);
          if (!last) last = ts;
          var d = ts - last; last = ts; if (d > 100) d = 100;

    a: 'A', b: 'B', select: 'SELECT', start: 'START',
    up: 'UP', down: 'DOWN', left: 'LEFT', right: 'RIGHT'

  NES.toMask = function (spec) {

    if (spec == null) return 0;
    if (typeof spec === 'number') return spec | 0;
    var list = Array.isArray(spec) ? spec : String(spec).split(/[,\s+|]+/);
    var m = 0;
    for (var i = 0; i < list.length; i++) {
      var k = String(list[i]).trim(); if (!k) continue;
      var key = BTN_ALIAS[k.toLowerCase()] || k.toUpperCase();

  // NES.boot({canvas, game, scale, debug, hz, mute})
  //  canvas : HTMLCanvasElement 或 CSS 選擇器；省略則自動建立並 append 到 body
  //  game   : {init(nes), update(nes), draw(nes), state()}；可為 function(nes) 工廠；可省略（黑畫面）

    try { new URLSearchParams(location.search).forEach(function (v, k) { q[k] = v; }); } catch (e) { }

    var scale = opt.scale || (q.scale ? parseInt(q.scale, 10) : 0) || 1;
    var mute = (opt.mute != null) ? !!opt.mute : (q.mute === '1');

    if (typeof canvas === 'string') canvas = document.querySelector(canvas);
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.id = 'nes';
      document.body.appendChild(canvas);
    }
    canvas.style.imageRendering = 'pixelated';

    NES.missing.length = 0;

    // --- PPU ---
    var ppu;
    if (need('ppu.js', NES.PPU && typeof NES.PPU.create === 'function')) {
      ppu = NES.PPU.create(canvas, { scale: scale });
    } else {
      ppu = stubPPU(canvas, { scale: scale });
    }

    // --- Input ---
    var input = NES.Input;
    if (!need('input.js', input && typeof input.poll === 'function')) input = stubInput();

    // --- APU / Music ---

        // music.js 的建議用法：attach(apu) 之後 NES.Music.play/stop/sfx/tick 直接可用。
        // 用單例（而不是 create 出來的第二個 driver），遊戲照契約呼叫 NES.Music.* 才會生效。
        if (apu) call(NES.Music, 'attach', apu);
        music = NES.Music;
      } else if (has(NES.Music, 'create')) {

    need('palette.js', !!NES.PALETTE);
    need('fixed.js', !!NES.FX);
    need('chr.js', !!NES.CHR);
    need('nes_lint.js', !!NES.Lint);

      missing: NES.missing.slice()

    // --- 主迴圈：update = Input.poll(由 Timing 負責) → game.update(nes) → apu.tick()
    //            draw   = game.draw(nes) → ppu.render() → ppu.endFrame()

    // drawFrame() 一個完整幀的 draw 階段：重畫 + endFrame（推進閃爍輪替）
    function update() {
      call(nes.game, 'update', nes);
      if (apu) call(apu, 'tick');     // music.tick() 依契約由遊戲 update 自行呼叫
    }

      call(nes.game, 'draw', nes);
      call(ppu, 'render');

      draw();
      call(ppu, 'endFrame');

    nes.render = function () {

        budgetBytes: opt.budgetBytes || 0, strictBudget: !!opt.strictBudget

    } else {
      timing = stubTiming({ update: update, draw: drawFrame, hz: opt.hz || NES.HZ });
    }
    nes.timing = timing;
    // VBlank 寫入預算：綁到 PPU，之後 setTile/sprite/... 都會自動計帳（QA P1-6）
    if (ppu && timing.budget) ppu.budget = timing.budget;
    if (opt.strictBudget && timing.budget) timing.budget.strict = true;
    nes.missing = NES.missing.slice();   // Timing 的檢查在建立 nes 之後，重新同步一次
    nes.step = function (n) { return call(timing, 'step', n || 1); };

    nes.stop = function () { call(timing, 'stop'); };

      window.addEventListener('pointerdown', unlock, { once: true });
    }

    // chr.js 在場但沒人 setPattern 時，ppu.render() 會丟「尚未 setPattern」。

        var p1 = has(NES.CHR, 'pattern') ? NES.CHR.pattern(1) : null;

          var blankRows = ['........', '........', '........', '........', '........', '........', '........', '........'];
          var bk = (has(NES.CHR, 'getBank') && NES.CHR.getBank('__nes_blank')) || NES.CHR.bank('__nes_blank', { BLANK: blankRows });
          if (!p0) NES.CHR.setPattern(0, bk.name || '__nes_blank');
          if (!p1) NES.CHR.setPattern(1, bk.name || '__nes_blank');
        }
      } catch (e) { warn('空白 CHR 保底失敗：' + e.message); }
    }

    // --- 啟動 ---
    call(nes.game, 'init', nes);
    // game.init() 等同真機「rendering 關閉時的初始化」：想寫多少 PPU 就寫多少，不算 VBlank 預算
    if (timing.budget) call(timing.budget, 'clear');
    if (debug) {
      drawFrame();                  // debug：不自動跑，先畫一幀，之後由 __nes.step() 推進
    } else {
      nes.start();
    }

    NES.instance = nes;
    NES.canvas = canvas;

    // ------------------------------------------------------------ 除錯 API
    if (debug) {
      window.__nes = {
        // 推進 n 幀（同步，不走 rAF）

        // press(mask | 'a' | ['a','right'], n)：按住 n 幀並推進 n 幀
        press: function (spec, n) {
          n = n || 1;
          var m = NES.toMask(spec);
          call(input, 'inject', m, n);
          nes.step(n);
          return timing.frame;
        },
        // tap(spec, n)：按 n 幀後放開（預設 1 幀）

          call(input, 'inject', m, n);

        },
        release: function () { call(input, 'inject', 0, 0); return true; },
        // 重畫一幀但不推進任何邏輯（截圖前用）；PPU 的閃爍輪替指標也不動 ⇒ 可重現
        render: function () { nes.render(); return true; },
        // state()：遊戲自己的 state() 併上 frame / stats

          var s = {};
          try { var gs = call(nes.game, 'state'); if (gs) s = (typeof gs === 'string') ? JSON.parse(gs) : gs; } catch (e) { }
          s.frame = timing.frame;
          s.hz = timing.hz;
          s.stats = this.stats();
          return s;
        },
        // frame()：base64 PNG（data URL）；canvas 取不到時退回 ppu.frame 摘要
        // ⚠️ 與 state().frame / stats().frame（幀號）同名不同義 ⇒ 另給別名 snapshot()（QA P2-2）
        frame: function () {
          try { return canvas.toDataURL('image/png'); }
          catch (e) {

            if (!f) return null;

            for (var i = 0; i < f.length; i += 4) { if (f[i] | f[i + 1] | f[i + 2]) n++; sum += f[i] + f[i + 1] + f[i + 2]; }
            return { w: NES.W, h: NES.H, nonBlack: n, avg: Math.round(sum / (f.length / 4 * 3)) };
          }

        // snapshot()：frame() 的別名，語意更清楚（回傳 PNG，不是幀號）
        snapshot: function () { return this.frame(); },
        // lint()：交給 nes_lint.js；未載入時回報 skipped
        lint: function () {
          if (NES.Lint && typeof NES.Lint.frame === 'function') {
            var r = NES.Lint.frame(ppu);
            if (r && NES.Lint.oam) { try { r.oam = NES.Lint.oam(ppu); } catch (e) { r.oamError = e.message; } }

            if (r && ppu.stats) {

        },
        stats: function () {
          var st = (ppu && ppu.stats) || {};

            frame: timing.frame, hz: timing.hz,

            budgetOver: !!(bg && bg.over),

            budget: (bg && typeof bg.report === 'function') ? bg.report() : null,
            scale: nes.scale,
            missing: nes.missing.slice(),
            stub: { ppu: !!ppu.stub, input: !!input.stub, timing: !!timing.stub, apu: !apu, music: !music }
          };
        },
        // 額外便利：給 tools/shot.py 與手寫 playwright 腳本用
        nes: function () { return nes; },
        setScale: function (s) { nes.setScale(s); return nes.scale; },
        missing: function () { return nes.missing.slice(); },
        version: NES.VERSION
      };
    }
    return nes;
  };
})();

<!-- ===== 遊戲：games/cart1「星塵 8 合 1」合輯卡帶（R5）=====
     載入順序：registry（CT 註冊表 + window.GAME 分派）→ 各遊戲（CT.register，每款一個子資料夾）
     → shell（開機選單；缺檔時直接跑 ?game=<id> 或第一款）。新遊戲檔一律插在 shell 之前。 -->
<script>/* games/cart1/registry.js */
/*
 * games/cart1/registry.js — 合輯卡帶共用的遊戲註冊表與工具（全域 `CT`；R5《星塵 8 合 1》起，R6 起各卡帶共用，靠 window.CART_ID 區分）
 * ---------------------------------------------------------------------------
 * 擁有者：總控（R5 開工骨架）。**只准 Edit 插入**，契約見 docs/R5_BRIEF.md §2。
 * 載入順序：engine/* → games/cart1/registry.js → 各遊戲檔（CT.register）→ shell.js（選單，可缺）→ boot.js
 *
 * 每款遊戲 = 一個與 window.GAME 同介面的物件，加上合輯要的幾個欄位：
 *   CT.register({
 *     id: 'maze', order: 1, title: '星塵迷宮', legacy: ['pacman.html'],
 *     init(nes, opt), update(nes), draw(nes), state(),   // 同 ENGINE_API §12
 *     exit(nes),          // 可省略：離開前停音樂 / 收拾自己的監聽
 *     cheat(),            // 一鍵密技（C 鍵 / ★ / nes-cheat 事件），回傳 true = 有生效
 *     bot(nes) → mask,    // ?bot=1 自動駕駛：回傳「下一幀」要按的鍵；null = 不按
 *     goal() → bool       // 機器人驗收條件已達成（例如過 3 關 / 分數 ≥ N）
 *   });
 *
 * 沒有 shell.js 時（R5 平行開發期間），boot 直接跑 `?game=<id>`（或第一款）。
 * shell.js 在場時由它接管：設 `CT.Shell = { init, update, draw, state }`，透過 CT.launch / CT.back 切換。
 */
(function () {
  'use strict';
  var NES = window.NES = window.NES || {};
  var CT = window.CT = window.CT || {};

  CT.games = CT.games || [];
  CT.current = null;          // 目前執行中的遊戲物件（選單時 = null）
  // R6 起多卡帶共用本檔：入口頁在載入本檔前設 `window.CART_ID = 'cart2'`（缺省 = 'cart1'，行為與 R5 相同）
  CT.CART = String(window.CART_ID || 'cart1');
  CT.KEY = 'nes.' + CT.CART + '.';      // localStorage 前綴（cart1 = 'nes.cart1.'，舊存檔不變）

  CT.register = function (g) {
    if (!g || !g.id) throw new Error('CT.register: 缺 id');
    for (var i = 0; i < CT.games.length; i++) {
      if (CT.games[i].id === g.id) { CT.games[i] = g; sort(); return g; }
    }
    CT.games.push(g); sort();
    return g;
  };
  function sort() { CT.games.sort(function (a, b) { return (a.order || 99) - (b.order || 99); }); }
  CT.get = function (id) {
    for (var i = 0; i < CT.games.length; i++) if (CT.games[i].id === id) return CT.games[i];
    return null;
  };

  /* ---------------- 換遊戲時的 PPU / APU 歸零（= 關 rendering 重寫，不計 VBlank 預算） ---------------- */
  CT.blank = function (nes, fn) {
    var bud = nes && nes.timing && nes.timing.budget;
    var muted = bud ? bud.mute : false;
    if (bud) bud.mute = true;
    try { fn(); } finally { if (bud) bud.mute = muted; }
  };
  CT.resetHW = function (nes) {
    var ppu = nes.ppu;
    CT.blank(nes, function () {
      try { if (nes.music && nes.music.stop) nes.music.stop(); } catch (e) { }
      try { if (nes.music && nes.music.stopSfx) nes.music.stopSfx(); } catch (e) { }
      // R8 qa P2-7：遊戲可用 NES.Touch.setWays(4) 改成四方向十字鍵；換遊戲時一律回預設 8 方向
      try { if (NES.Touch && NES.Touch.setWays) NES.Touch.setWays(8); } catch (e) { }
      if (!ppu) return;
      if (ppu.split) ppu.split(null);
      if (ppu.scroll) ppu.scroll(0, 0);
      if (ppu.spriteMode) ppu.spriteMode(8);
      ppu.flicker = 'rotate'; ppu.flickerStep = 8;
      if (ppu.clearSprites) ppu.clearSprites();
      // 先切回垂直鏡像再清兩張表：前一款若是水平鏡像，先清後切會露出另一張表的殘影（shell 實測屬性表殘 240 格）
      if (ppu.mirroring) ppu.mirroring('v');
      if (ppu.fillTiles) { ppu.fillTiles(0, 0, 0, 32, 30, 0); ppu.fillTiles(1, 0, 0, 32, 30, 0); }
      if (ppu.fillAttr) { ppu.fillAttr(0, 0, 0, 16, 15, 0); ppu.fillAttr(1, 0, 0, 16, 15, 0); }
      if (ppu.setBackdrop) ppu.setBackdrop(0x0F);
    });
  };

  /* ---------------- 存檔（每款自己的 key；排行 / 最高分 / 解鎖） ---------------- */
  CT.load = function (id, key, dflt) {
    try {
      var s = window.localStorage.getItem(CT.KEY + id + '.' + key);
      return s == null ? dflt : JSON.parse(s);
    } catch (e) { return dflt; }
  };
  CT.save = function (id, key, val) {
    try { window.localStorage.setItem(CT.KEY + id + '.' + key, JSON.stringify(val)); return true; }
    catch (e) { return false; }
  };

  /* ---------------- 切換 ---------------- */
  var nes0 = null;
  CT.nes = function () { return nes0; };
  CT.launch = function (id, opt) {
    var g = CT.get(id);
    if (!g || !nes0) return false;
    if (CT.current && CT.current.exit) { try { CT.current.exit(nes0); } catch (e) { } }
    CT.resetHW(nes0);
    CT.current = g;
    CT.blank(nes0, function () { g.init(nes0, opt || {}); });
    return true;
  };
  // 回選單（shell 不在 = 重新開始同一款）
  CT.back = function () {
    if (!nes0) return;
    var g = CT.current;
    if (g && g.exit) { try { g.exit(nes0); } catch (e) { } }
    CT.current = null;
    CT.resetHW(nes0);
    if (CT.Shell) CT.blank(nes0, function () { CT.Shell.init(nes0, { from: g && g.id }); });
    else if (g) CT.launch(g.id);
  };

  /* ---------------- 共用熱鍵：START+SELECT 一起按住 60 幀 = 回選單（遊戲內不得佔用此組合） ---------------- */
  var BTN = (NES.Input && NES.Input.BTN) || { SELECT: 4, START: 8 };
  var backHold = 0;
  CT.BACK_FRAMES = 60;
  function checkBack() {
    var I = NES.Input;
    if (!I || !I.held || !CT.current) { backHold = 0; return false; }
    if (I.held(BTN.START) && I.held(BTN.SELECT)) {
      if (++backHold >= CT.BACK_FRAMES) { backHold = 0; CT.back(); return true; }
    } else backHold = 0;
    return false;
  }
  CT.backProgress = function () { return backHold / CT.BACK_FRAMES; };

  /* ---------------- 一鍵密技：C 鍵 / 觸控 ★ / nes-cheat 事件 → 目前遊戲的 cheat() ---------------- */
  CT.cheat = function () {
    var g = CT.current;
    return !!(g && g.cheat && g.cheat());
  };
  if (window.addEventListener) {
    window.addEventListener('nes-cheat', function () { CT.cheat(); }, false);
    window.addEventListener('keydown', function (e) {
      if (!e || e.repeat || e.ctrlKey || e.altKey || e.metaKey) return;
      if ((e.code || '') !== 'KeyC') return;
      var ev = null;
      try { ev = new window.CustomEvent('nes-cheat', { detail: { source: 'key' } }); } catch (e2) { ev = null; }
      if (ev) window.dispatchEvent(ev); else CT.cheat();
    }, false);
  }

  /* ---------------- 自動駕駛 ?bot=1（tools/playthrough_cart.py 用） ---------------- */
  var q = null;
  try { q = new URLSearchParams(location.search); } catch (e) { q = null; }
  CT.query = function (k) { return q ? q.get(k) : null; };
  CT.botOn = CT.query('bot') === '1';
  function botTick() {
    var g = CT.current;
    if (!CT.botOn || !g || !g.bot || !NES.Input || !NES.Input.inject) return;
    var m = g.bot(nes0);
    if (m) NES.Input.inject(m & 255, 1);
  }

  /* ---------------- 給入口頁的 window.GAME：分派給 shell 或目前遊戲 ---------------- */
  window.GAME = {
    init: function (nes) {
      nes0 = nes;
      var want = CT.query('game');
      if (want && CT.get(want)) { CT.launch(want); return; }
      if (CT.Shell) { CT.current = null; CT.blank(nes, function () { CT.Shell.init(nes, {}); }); return; }
      if (CT.games.length) CT.launch(CT.games[0].id);
    },
    update: function (nes) {
      if (checkBack()) return;
      if (CT.current) { CT.current.update(nes); botTick(); }
      else if (CT.Shell) CT.Shell.update(nes);
    },
    draw: function (nes) {
      if (CT.current) CT.current.draw(nes);
      else if (CT.Shell) CT.Shell.draw(nes);
    },
    state: function () {
      var g = CT.current, s = null;
      if (g && g.state) s = g.state();
      else if (!g && CT.Shell && CT.Shell.state) s = CT.Shell.state();
      return {
        cart: CT.CART, game: g ? g.id : null, goal: !!(g && g.goal && g.goal()),
        games: CT.games.map(function (x) { return x.id; }), bot: CT.botOn, s: s
      };
    }
  };
})();

<script>/* games/cart1/maze/maps.js */
/*
 * games/cart1/maze/maps.js — 《星塵迷宮》四張原創迷宮（27×23 格，一格 = 8×8 背景磚）
 * ---------------------------------------------------------------------------

 *

 *   中央 7×5 的「星巢」（追兵出生處）與巢外一圈環道、第 11 列左右穿越的隧道是四張共用的骨架。
 *
 * fix-r5（P1-1 原創性）：wall = [岩身, 受光緣 / 晶粒, 星屑色]——四張都是實心星岩、沒有藍色；能量星改到內側第 3 欄（不放四角）

 * ---------------------------------------------------------------------------
 * 擁有者：C5-1 cart1-grid（R5）。只依賴 engine/music.js 的 song / sfx 格式。
 * 曲名 / 音效名一律 `maze_` 前綴（合輯共用一個 driver，避免撞名）。
 *
 * | key          | 用途           | speed | 小節 | 說明 |
 * |--------------|----------------|-------|------|------|
 * | maze_title   | 標題           | 7     | 4    | D 多利安、4 度跳進動機（fix-r5 改寫開頭）+ 長音旋律 |
 * | maze_start   | 開局 READY     | 6     | 2    | 上行號角（不 loop） |
 * | maze_stage   | 遊玩 BGM       | 6     | 8    | Dm–B♭–C–A 進行，p1 跳進旋律 / p2 和弦點 / tri 行走低音 / noi 拍 |
 * | maze_fright  | 能量星期間     | 4     | 2    | 半音搖擺 + 三角波踏板（loop） |
 * | maze_clear   | 過關           | 6     | 2    | 收束（不 loop） |
 * | maze_over    | GAME OVER      | 8     | 2    | 下行終止（不 loop） |
 * 音效（只搶 p2 / noi）：maze_dot 1 < maze_bonus 5 < maze_star 6 < maze_eat 7 < maze_1up 8 < maze_die 9、maze_pause 4

(function () {

  var CT = window.CT = window.CT || {};
  var Z = CT.Maze = CT.Maze || {};

  // 旋律字串 → row 陣列：'-' = 沿用、'=' = 切音，其餘為音名
  function mel(str, inst, vol, extra) {
    var t = tok(str), out = [], i, k;
    for (i = 0; i < t.length; i++) {
      if (t[i] === '-') { out.push(null); continue; }
      if (t[i] === '=') { out.push({ note: '===' }); continue; }

    k: { note: 13, inst: 'kick', vol: 14 }, s: { note: 6, inst: 'snare', vol: 12 },

    maze_die: { priority: 9, data: { p2: sq([['A-5', 4, 12, 1], ['F-5', 4, 12], ['D-5', 4, 11], ['A#4', 4, 10], ['G-4', 4, 9], ['D-4', 8, 8], ['D-3', 6, 5]]),
                                     noi: nz([[9, 6, 8], [11, 6, 6], [13, 8, 4]]) } },
    maze_pause: { priority: 4, data: { p2: sq([['A-5', 3, 10, 2], ['E-5', 3, 10], ['A-5', 4, 8]]) } }
  };

  Z.SONGS = { maze_title: buildTitle(), maze_start: buildStart(), maze_stage: buildStage(),
              maze_fright: buildFright(), maze_clear: buildClear(), maze_over: buildOver() };
  Z.SFX = SFX;

  /* 包一層：driver 不在（單元測試）就安靜失敗 */
  var drv = function (nes) { return (nes && nes.music) || ((window.NES && NES.Music && NES.Music._default) ? NES.Music : null); };
  // nes.music 是 NES.Music 門面（playing / orderIndex 在 _default driver 上）
  var core = function (nes) { var d = drv(nes); return d && d._default ? d._default : d; };

    play: function (nes, key) {

      if (Z.Audio.current === key && d.playing) return true;
      try { d.play(s, { loop: s.playLoop }); Z.Audio.current = key; return true; } catch (e) { return false; }
    },
    stop: function (nes) {
      var d = drv(nes); Z.Audio.current = null;
      if (!d) return false;
      try { d.stop(); if (d.stopSfx) d.stopSfx(); } catch (e) { }
      return true;
    },
    sfx: function (nes, name) {
      var d = drv(nes); if (!d || !SFX[name]) return false;
      try { d.sfx(name); Z.Audio.last = name; return true; } catch (e) {
        try { d.define(name, SFX[name]); d.sfx(name); return true; } catch (e2) { return false; }
      }
    },
    // fix-r5 §6-2：暫停 = 停 BGM（音效照常），記住目前小節；解除時同一首從該小節接續
    paused: null,
    pause: function (nes) {
      var d = core(nes); if (!d || !Z.Audio.current) return false;
      Z.Audio.paused = { key: Z.Audio.current, from: d.playing ? (d.orderIndex || 0) : 0, was: !!d.playing };
      try { d.stop(); } catch (e) { }
      return true;
    },
    resume: function (nes) {
      var p = Z.Audio.paused, d = core(nes); Z.Audio.paused = null;
      if (!p || !d || !p.was) return false;
      var s = Z.SONGS[p.key]; if (!s) return false;

    },

  };
})();

<script>/* games/cart1/maze/main.js */
/*
 * games/cart1/maze/main.js — 《星塵迷宮》（合輯槽 1，id = maze；舊作 pacman.html 只取「迷宮吃點 + 追兵」玩法概念）
 * ---------------------------------------------------------------------------
 * 擁有者：C5-1 cart1-grid（R5）。依賴 engine/*、games/cart1/registry.js、maze/{chr,maps,song}.js。
 * 契約：docs/R5_BRIEF.md §2（CT.register）、docs/ENGINE_API.md §7 / §10 / §12。
 *
 * 玩法：操縱小彗 Pip 吃光迷宮裡的星屑過關；四顆能量星讓追兵受驚可吃；四張原創迷宮循環、
 *   每關加速（maps.js Z.LEVELS）、左右隧道（追兵在隧道減速）、每關兩次獎勵道具、10000 分加命。
 * 追兵個性（全部自訂；fix-r5 重新命名 / 配色：紫 = 追擊、萊姆綠 = 包抄、金 = 巡邏、白 = 亂走）：
 *   刺棘 VEX    — 追擊：沿迷宮最短路（BFS 距離圖）直撲主角
 *   苔莢 MOSS   — 包抄：預判主角「沿目前方向走到的下一個路口」，搶先到那裡堵
 *   環星 ORBIT  — 巡邏：繞自己的象限巡航（每關換象限），主角進入 8 格內才轉為追擊
 *   碎晶 SHARD  — 亂走：每個路口一半機率朝主角、一半亂選
 *   另有「散開 / 追擊」波次（每關表格不同），切換時追兵掉頭。
 * fix-r5（docs/QA_REPORT.md # R5 qa-r5 / R5_BRIEF §6）：
 *   P1-1 視覺身分重做（星岩牆 / 十字星屑 / 力場星巢 / 火箭主角 / 開局 LIFT OFF! 在上方橫幅 / 過關彩虹掃牆 /
 *        標題追兵一排 + 輪播說明）；§6-1 GAME OVER 按密技 = 原地續關（命數回 3、保留分數與已吃星屑）；
 *   §6-2 暫停 = BGM 停、解除從同一小節接續；§6-3 exit 存最高分；§6-4 backTile；§6-5 暫停畫面寫 HOLD START+SELECT: MENU。
 *
 * 硬限制的作法
 *   - 每線 ≤ 8 精靈：所有角色都是單顆 8×8 精靈，OAM 固定配置 0 主角 / 1..4 追兵 / 5 獎勵 / 6..7 分數牌，
 *     全畫面最多 8 顆 ⇒ 任何掃描線都 ≤ 8（不是靠輪替；ppu.flicker = 'none'）。
 *   - VBlank ≤ 160 byte：背景寫入一律走 put()（影子名稱表比對，沒變就不寫）；整片重畫只在
 *     init / 換關 / 回標題時，包在 CT.blank（= 關 rendering）。
 *   - 位置 / 速度：整數像素 + 8.8 定點累加器（speed 單位 1/256 px/幀）。
 */
(function () {
  'use strict';
  var NES = window.NES = window.NES || {};
  var CT = window.CT;
  if (!CT || !CT.register) throw new Error('maze/main.js 需要 games/cart1/registry.js');
  var Z = CT.Maze = CT.Maze || {};
  var BTN = (NES.Input && NES.Input.BTN) || { A: 1, B: 2, SELECT: 4, START: 8, UP: 16, DOWN: 32, LEFT: 64, RIGHT: 128 };

  var W = Z.MAP_W, H = Z.MAP_H;
  var OX = 2, OY = 3;                    // 迷宮在名稱表的左上角（格）
  var DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
  var DIRBTN = [BTN.UP, BTN.RIGHT, BTN.DOWN, BTN.LEFT];
  var NAMES = ['VEX', 'MOSS', 'ORBIT', 'SHARD'];
  var CH_PAL = [1, 1, 2, 2];
  var HOME = [[25, -2], [1, -2], [25, 24], [1, 24]];   // 散開時的目標角落（刻意在迷宮外，讓追兵繞角）
  var START_LIVES = 3;
  var READY_FIRST = 150, READY_AGAIN = 100, DIE_FRAMES = 110, CLEAR_FRAMES = 140, OVER_FRAMES = 200;
  var EAT_FREEZE = 36, POP_FRAMES = 60, EXTRA_AT = 10000;
  var SPR_HERO = 0, SPR_CH = 1, SPR_BONUS = 5, SPR_POP = 6;

  var nes0 = null, ppu = null, bgB = null, spB = null, T = null, S = null;
  var g = null;
  var shadow = null;                     // 影子名稱表（只寫有變的格）

  /* ============================== 小工具 ============================== */
  function rnd() { g.seed = (g.seed * 1103515245 + 12345) & 0x7fffffff; return g.seed >> 8; }
  function rev(d) { return (d + 2) & 3; }
  function wrapX(tx) { return ((tx % W) + W) % W; }
  function cell(tx, ty) {
    if (ty < 0 || ty >= H) return '#';
    return g.grid[ty][wrapX(tx)];
  }
  function heroOpen(tx, ty) { var c = cell(tx, ty); return c !== '#' && c !== '-' && c !== 'G'; }
  function aligned(a) { return (((a.x % 8) + 8) % 8) === 0 && (a.y % 8) === 0; }
  function tileOf(a) { return [wrapX(Math.floor((a.x + 4) / 8)), Math.floor((a.y + 4) / 8)]; }
  function key(tx, ty) { return ty * W + wrapX(tx); }

  function put(col, row, tile) {
    var i = row * 32 + col;
    if (shadow[i] === tile) return;
    shadow[i] = tile;
    ppu.setTile(0, col, row, tile);
  }
  function text(col, row, str) {
    for (var i = 0; i < str.length; i++) put(col + i, row, bgB.index(Z.fontName(str.charAt(i))));
  }
  function num(n, w) { var s = String(Math.max(0, n | 0)); while (s.length < w) s = '0' + s; return s.slice(-w); }

  /* ============================== 調色盤 ============================== */
  // pal 0 主角火箭（紅窗 / 橘焰 / 白身）、pal 1 VEX 紫 + MOSS 萊姆綠、pal 2 ORBIT 暗金 + SHARD 白（刻面 / 環 = 淡黃）、pal 3 受驚灰
  var SPR_PALS = [[0x16, 0x27, 0x30], [0x13, 0x2A, 0x30], [0x18, 0x30, 0x38], [0x00, 0x10, 0x30]];
  var SCARE_BLINK = [0x30, 0x10, 0x13];
  // 過關演出：牆色依序掃過一圈星色（不閃白），每 10 幀換一格
  var CLEAR_SWEEP = [[0x14, 0x24], [0x16, 0x26], [0x17, 0x28], [0x18, 0x38], [0x1A, 0x2A], [0x1B, 0x2B], [0x15, 0x25]];
  function mapPal(sweep) {
    var m = Z.MAPS[g.mapIndex];
    if (sweep >= 0) { var c = CLEAR_SWEEP[sweep % CLEAR_SWEEP.length]; return [c[0], c[1], m.wall[2]]; }
    return [m.wall[0], m.wall[1], m.wall[2]];
  }
  function setPals(title) {
    ppu.setBackdrop(0x0F);
    if (title) {
      ppu.setBgPalette(0, [0x04, 0x24, 0x30]);
      ppu.setBgPalette(1, [0x14, 0x04, 0x34]);
      ppu.setBgPalette(2, [0x12, 0x02, 0x3C]);
      ppu.setBgPalette(3, [0x28, 0x18, 0x38]);
    } else {
      ppu.setBgPalette(0, mapPal(-1));
      ppu.setBgPalette(1, [0x16, 0x06, 0x37]);
      ppu.setBgPalette(2, [0x12, 0x02, 0x3C]);
      ppu.setBgPalette(3, [0x28, 0x18, 0x38]);
    }
    for (var i = 0; i < 4; i++) ppu.setSprPalette(i, SPR_PALS[i]);
  }

  /* ============================== CHR ============================== */
  function buildChr() {
    bgB = NES.CHR.bank('maze_bg', Z.BG_TILES);
    spB = NES.CHR.bank('maze_spr', Z.SPR_TILES);
    NES.CHR.setPattern(0, bgB);
    NES.CHR.setPattern(1, spB);
    ppu.setPatternTables(0, 1);
    ppu.spriteMode(8);
    ppu.flicker = 'none';                // 從設計上 ≤ 8 顆，不需要輪替
    T = {};
    var n = spB.names, i;
    for (i = 0; i < n.length; i++) T[n[i]] = spB.index(n[i]);
  }

  /* ============================== 整片重畫 ============================== */
  function clearAll() {
    shadow = new Int16Array(32 * 30);
    for (var i = 0; i < shadow.length; i++) shadow[i] = -1;
    ppu.fillTiles(0, 0, 0, 32, 30, 0);
    for (i = 0; i < shadow.length; i++) shadow[i] = 0;
    ppu.fillAttr(0, 0, 0, 16, 15, 0);
    ppu.clearSprites();
  }
  function wallMask(tx, ty) {
    var m = 0, i;
    for (i = 0; i < 4; i++) {
      var nx = tx + DX[i], ny = ty + DY[i];
      if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
      var c = g.grid[ny][nx];
      if (c === '#' || c === '-') m |= (1 << i);
    }
    return m;
  }
  // 星巢範圍（四張共用骨架：x 10..16、y 10..14）：巢牆畫成虛線力場、巢內鋪星砂
  function inNest(tx, ty) { return tx >= 10 && tx <= 16 && ty >= 10 && ty <= 14; }
  function nestMask(tx, ty) {
    var m = 0;
    for (var i = 0; i < 4; i++) {
      var nx = tx + DX[i], ny = ty + DY[i];
      if (!inNest(nx, ny)) continue;
      var c = g.grid[ny][nx];
      if (c === '#' || c === '-') m |= (1 << i);
    }
    return m;
  }
  function cellTile(tx, ty) {
    var c = g.grid[ty][tx];
    if (c === '#' && inNest(tx, ty)) return bgB.index('NW' + nestMask(tx, ty));
    if (c === '#') return bgB.index('W' + wallMask(tx, ty));
    if (c === 'G') return bgB.index('NEST');
    if (c === '-') return bgB.index('DOOR');
    if (c === '.') return bgB.index('DOT');
    if (c === 'o') return bgB.index('STAR');
    return 0;
  }
  function drawMazeFull() {
    clearAll();
    setPals(false);
    var x, y;
    for (y = 0; y < H; y++) for (x = 0; x < W; x++) put(OX + x, OY + y, cellTile(x, y));
    drawHudStatic();
    g.hudCache = {};
    drawHud();
  }
  function drawHudStatic() {
    text(2, 1, 'SCORE');
    text(22, 1, 'BEST');
  }
  function drawHud() {
    var c = g.hudCache;
    if (c.score !== g.score) { c.score = g.score; text(2, 2, num(g.score, 6)); }
    if (c.best !== g.best) { c.best = g.best; text(22, 2, num(g.best, 6)); }
    if (c.name !== g.mapIndex) { c.name = g.mapIndex; var nm = Z.MAPS[g.mapIndex].name; while (nm.length < 11) nm = (nm.length & 1) ? nm + ' ' : ' ' + nm; text(10, 2, nm); }
    if (c.lives !== g.lives) {
      c.lives = g.lives;
      for (var i = 0; i < 6; i++) put(2 + i, 26, i < g.lives ? bgB.index('LIFE') : 0);
    }
    if (c.level !== g.level) { c.level = g.level; text(22, 26, 'LV ' + num(g.level, 2)); }
  }
  function msg(str) {          // 上方橫幅訊息（LIFT OFF! / PAUSE / GAME OVER；SCORE 與 BEST 中間）
    var s = str;
    while (s.length < 12) s = (s.length & 1) ? s + ' ' : ' ' + s;
    text(10, 1, s);
  }
  var MENU_HINT = 'HOLD START+SELECT: MENU';
  function hint(on) {          // 底列：暫停時提示回選單的方法（§6-5）
    var s = on ? MENU_HINT : '';
    while (s.length < 26) s += ' ';
    text(3, 27, s);
  }

  /* ============================== 標題 ============================== */
  var BIG = 'MAZE';
  var ROSTER_X = [6, 12, 18, 24];                 // 標題：四隻追兵一排（格），名字寫在正下方
  var ROSTER_INFO = ['VEX   HUNTS YOU DOWN', 'MOSS  CUTS YOU OFF', 'ORBIT GUARDS A CORNER', 'SHARD ROAMS AT RANDOM'];
  function drawTitle() {
    clearAll();
    setPals(true);
    var x, y, i, blk = bgB.index('BLK');
    text(10, 3, '- STARDUST -');
    for (i = 0; i < BIG.length; i++) {
      var rows = Z.GLYPH[BIG.charAt(i)].split(',');
      for (y = 0; y < 7; y++) for (x = 0; x < 5; x++) if (rows[y].charAt(x) === '1') put(4 + i * 6 + x, 5 + y, blk);
    }
    ppu.fillAttr(0, 2, 2, 12, 4, 1);    // 大字 = 紫色立體磚（屬性 1）
    text(8, 14, 'EAT ALL STARDUST');
    for (i = 0; i < 4; i++) { var nm = NAMES[i]; text(ROSTER_X[i] - ((nm.length - 1) >> 1), 18, nm); }
    text(4, 25, 'BEST ' + num(g.best, 6));
    text(3, 27, 'STAR = POWER   C/★ = CHEAT');
    g.titleBlink = 0; g.rosterShown = -1;
  }
  function titleSprites() {
    var f = (g.frames >> 4) & 1;
    for (var i = 0; i < 4; i++) ppu.sprite(SPR_CH + i, { x: ROSTER_X[i] * 8, y: 16 * 8, tile: T[NAMES[i] + f], pal: CH_PAL[i] });
    ppu.sprite(SPR_HERO, { x: 40 + ((g.frames >> 1) % 176), y: 12 * 8 + 4, tile: T['PR' + f], pal: 0 });
    // 輪播說明：每 96 幀換一隻，箭頭精靈指著正在介紹的那隻
    var k = ((g.frames / 96) | 0) & 3;
    ppu.sprite(5, { x: ROSTER_X[k] * 8, y: 17 * 8 + 1 + ((g.frames >> 3) & 1), tile: T.BACK, pal: 0 });
    for (i = 6; i < 8; i++) ppu.sprite(i, null);
    if (g.rosterShown !== k) {
      g.rosterShown = k;
      var s = ROSTER_INFO[k];
      while (s.length < 22) s = (s.length & 1) ? s + ' ' : ' ' + s;
      text(5, 20, s);
    }
  }

  /* ============================== 關卡 ============================== */
  function newRun() {
    g.score = 0; g.lives = START_LIVES; g.level = 1; g.clears = 0; g.extraGiven = false;
    loadLevel(1);
  }
  function loadLevel(n) {
    g.level = n;
    g.mapIndex = (n - 1) % Z.MAPS.length;
    g.lv = Z.level(n);
    g.grid = Z.MAPS[g.mapIndex].rows.map(function (r) { return r.split(''); });
    g.dots = 0;
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) if (g.grid[y][x] === '.' || g.grid[y][x] === 'o') g.dots++;
    g.dotsTotal = g.dots;
    g.eaten = 0;
    g.bonusShown = 0;
    CT.blank(nes0, drawMazeFull);
    resetActors();
    enter('ready', g.level === 1 && g.clears === 0 ? READY_FIRST : READY_AGAIN);
    Z.Audio.play(nes0, 'maze_start');
  }
  function resetActors() {
    var s = Z.START;
    g.hero = { x: s[0] * 8, y: s[1] * 8, dir: 3, want: 3, acc: 0, moving: false, anim: 0 };
    g.chasers = [];
    for (var i = 0; i < 4; i++) {
      var sl = Z.PEN.slots[i];
      g.chasers.push({
        id: i, name: NAMES[i], x: sl[0] * 8, y: sl[1] * 8, dir: i === 0 ? 3 : 0, acc: 0,
        state: i === 0 ? 'out' : 'pen', fright: false, release: g.lv.release[i], anim: 0, wp: 0
      });
    }
    g.frightT = 0; g.combo = 0; g.freeze = 0;
    g.phase = 0; g.phaseT = g.lv.scatter[0];
    g.bonus = null; g.pop = null;
    g.bfs = null; g.bfsKey = -1;
  }
  function enter(mode, frames) { g.mode = mode; g.modeT = frames || 0; g.readyShown = false; }

  /* ============================== 主角 ============================== */
  function heroSpeed() { return g.lv.hero; }
  function inputDir() {
    var I = NES.Input, i;
    // 最後按下的方向優先；其次按住中的
    for (i = 0; i < 4; i++) if (I.pressed(DIRBTN[i])) { g.lastPress = i; }
    if (g.lastPress >= 0 && I.held(DIRBTN[g.lastPress])) return g.lastPress;
    for (i = 0; i < 4; i++) if (I.held(DIRBTN[i])) return i;
    return -1;
  }
  function heroStep(h) {
    if (aligned(h)) {
      var t = tileOf(h);
      eatAt(t[0], t[1]);
      if (h.want >= 0 && heroOpen(t[0] + DX[h.want], t[1] + DY[h.want])) h.dir = h.want;
      if (!heroOpen(t[0] + DX[h.dir], t[1] + DY[h.dir])) { h.moving = false; return false; }
    } else if (h.want === rev(h.dir)) {
      h.dir = h.want;
    }
    h.x += DX[h.dir]; h.y += DY[h.dir];
    if (h.x <= -8) h.x += W * 8;
    if (h.x >= W * 8) h.x -= W * 8;
    h.moving = true;
    return true;
  }
  function moveHero() {
    var h = g.hero;
    var d = inputDir();
    if (d >= 0) h.want = d;
    h.acc += heroSpeed();
    var n = h.acc >> 8; h.acc &= 255;
    for (var i = 0; i < n; i++) if (!heroStep(h)) { h.acc = 0; break; }
    if (h.moving) h.anim++;
  }
  function eatAt(tx, ty) {
    var c = cell(tx, ty);
    if (c !== '.' && c !== 'o') return;
    g.grid[ty][tx] = ' ';
    put(OX + tx, OY + ty, 0);
    g.dots--; g.eaten++; g.botEatF = g.playFrames;
    if (c === '.') { addScore(10); Z.Audio.sfx(nes0, (g.eaten & 1) ? 'maze_dot' : 'maze_dot2'); }
    else { addScore(50); startFright(); Z.Audio.sfx(nes0, 'maze_star'); }
    if (g.bonusShown < Z.BONUS_AT.length && g.eaten >= Z.BONUS_AT[g.bonusShown]) {
      g.bonusShown++;
      var b = Z.BONUS[Math.min(Z.BONUS.length - 1, g.level - 1)];
      g.bonus = { tile: b.tile, score: b.score, t: Z.BONUS_FRAMES };
    }
  }
  function addScore(n) {
    g.score += n;

  /* ============================== 追兵 ============================== */
  function chaserOpen(tx, ty) { var c = cell(tx, ty); return c !== '#' && c !== '-' && c !== 'G'; }

    var k0 = key(tx, ty);
    if (g.bfsKey === k0 && g.bfs) return g.bfs;
    var d = new Int16Array(W * H), q = new Int16Array(W * H), qh = 0, qt = 0, i;
    for (i = 0; i < d.length; i++) d[i] = 9999;

    if (c.id === 1) {

  /* ============================== 一鍵密技 ============================== */
  function doCheat() {

      g.paused = false;
      msg(''); hint(false);

      enter('ready', READY_AGAIN);
      Z.Audio.play(nes0, 'maze_start');

    }

  }

  }

    var I = NES.Input;
    if (g.mode === 'title') {
      if (I.pressed(BTN.START) && !I.held(BTN.SELECT)) { Z.Audio.stop(nes0); newRun(); }
      return;
    }
    if (g.mode === 'play' && I.pressed(BTN.START) && !I.held(BTN.SELECT)) {
      g.paused = !g.paused;
      msg(g.paused ? 'PAUSE' : '');
      hint(g.paused);
      if (g.paused) Z.Audio.pause(nes0); else Z.Audio.resume(nes0);
      Z.Audio.sfx(nes0, 'maze_pause');
      return;
    }
    if (g.paused) return;
    if (g.modeT > 0) g.modeT--;
    switch (g.mode) {
      case 'ready':
        if (!g.readyShown) { g.readyShown = true; msg('LIFT OFF!'); }
        if (g.modeT <= 0) { msg(''); enter('play'); Z.Audio.play(nes0, 'maze_stage'); }
        break;
      case 'play':
        g.playFrames++;
        if (g.freeze > 0) { g.freeze--; break; }
        moveHero();
        moveChasers();
        tickPhase();
        tickFright();
        collide();
        if (g.mode !== 'play') break;
        if (g.bonus && --g.bonus.t <= 0) g.bonus = null;
        if (g.dots <= 0) {

          g.clears++;
          g.pop = null; g.bonus = null;
          Z.Audio.play(nes0, 'maze_clear');
        }
        break;
      case 'dying':
        if (g.modeT <= 0) {
          g.lives--;
          if (g.lives < 0) {

            saveBest();
            Z.Audio.play(nes0, 'maze_over');
          } else {

            enter('ready', READY_AGAIN);
            Z.Audio.play(nes0, 'maze_start');
          }
        }
        break;
      case 'clear':
        // 牆色彩虹掃過（每 10 幀換一次調色盤 = 3 byte；最後 20 幀回原色）
        if (g.modeT % 10 === 0) ppu.setBgPalette(0, mapPal(g.modeT > 20 ? ((CLEAR_FRAMES - g.modeT) / 10) | 0 : -1));
        if (g.modeT === CLEAR_FRAMES - 30) msg('SECTOR CLEAR');

  }
  function toTitle() {

  }

  /* ============================== draw ============================== */
  function sprAt(i, x, y, tile, pal, fh, fv) {

  }
  function draw() {

      return;
    }
    drawHud();
    // 能量星閃爍（每 12 幀；每顆 1 byte）
    var starOn = ((g.frames / 12) | 0) & 1, x, y;
    if (g.frames % 12 === 0 && g.mode !== 'title') {
      for (y = 0; y < H; y++) for (x = 0; x < W; x++) if (g.grid[y][x] === 'o') put(OX + x, OY + y, bgB.index(starOn || g.mode !== 'play' ? 'STAR' : 'STAR2'));
    }
    var h = g.hero, f = (h.anim >> 3) & 1;
    // 主角
    if (g.mode === 'dying') {
      var k = DIE_FRAMES - g.modeT, df = Math.min(3, (k / 20) | 0);
      if (k < 20) sprAt(SPR_HERO, h.x, h.y, T['PR' + f], 0, h.dir === 3, false);
      else if (k < 100) sprAt(SPR_HERO, h.x, h.y, T['PX' + df], 0);
      else ppu.sprite(SPR_HERO, null);
    } else if (g.pop && g.pop.hideHero && g.freeze > 0) {
      ppu.sprite(SPR_HERO, null);
    } else {
      var vert = h.dir === 0 || h.dir === 2;
      sprAt(SPR_HERO, h.x, h.y, T[(vert ? 'PD' : 'PR') + f], 0, h.dir === 3, h.dir === 0);
    }
    // 追兵
    var hideCh = g.mode === 'dying' && (DIE_FRAMES - g.modeT) >= 20 || g.mode === 'clear';
    var blink = g.frightT > 0 && g.frightT < 120 && ((g.frightT >> 3) & 1);
    ppu.setSprPalette(3, blink ? SCARE_BLINK : SPR_PALS[3]);
    for (var i = 0; i < 4; i++) {
      var c = g.chasers[i], cf = (c.anim >> 3) & 1;
      if (hideCh) { ppu.sprite(SPR_CH + i, null); continue; }
      if (c.state === 'eyes' || c.state === 'enter') sprAt(SPR_CH + i, c.x, c.y, T.CORE, 3);
      else if (c.fright) sprAt(SPR_CH + i, c.x, c.y, T['SCARE' + cf], 3);
      else sprAt(SPR_CH + i, c.x, c.y, T[NAMES[i] + cf], CH_PAL[i], c.dir === 3);
    }
    // 獎勵
    if (g.bonus && g.mode === 'play') sprAt(SPR_BONUS, Z.BONUS_TILE[0] * 8, Z.BONUS_TILE[1] * 8, T[g.bonus.tile], 0);

      var nm = 'N' + g.pop.score;
      sprAt(SPR_POP, g.pop.x, g.pop.y, T[nm + 'L'], 0);
      sprAt(SPR_POP + 1, g.pop.x + 8, g.pop.y, T[nm + 'R'], 0);
    } else { ppu.sprite(SPR_POP, null); ppu.sprite(SPR_POP + 1, null); }
  }

  /* ============================== 機器人（?bot=1） ============================== */
  // 每個決策點：多源 BFS 算「追兵最快幾步到」→ 只走「我比追兵早 ≥ 2 步到」的安全格，找最近的
  // 獵物（受驚追兵）/ 能量星（被逼近時）/ 星屑；找不到就往追兵最遠的方向逃。
  function threatMap() {

  }
  function botSearch(sx, sy, cd, prey, margin) {
    var dist = new Int16Array(W * H), first = new Int8Array(W * H), q = new Int16Array(W * H), qh = 0, qt = 0, i;
    for (i = 0; i < dist.length; i++) dist[i] = -1;
    var k0 = key(sx, sy);
    dist[k0] = 0; first[k0] = -1; q[qt++] = k0;
    var r = { dot: -1, star: -1, prey: -1, safe: -1, safeV: -1e9, dist: dist, first: first };
    var framesPerTile = Math.ceil(8 * 256 / heroSpeed());
    var ratio = heroSpeed() / (g.lv.chase + (g.dots <= 20 ? 24 : 0));
    while (qh < qt) {
      var k = q[qh++], x = k % W, y = (k / W) | 0, cc = g.grid[y][x];
      if (k !== k0) {
        if (prey[k] && r.prey < 0 && dist[k] * framesPerTile < g.frightT - 30) r.prey = k;
        if (cc === 'o' && r.star < 0) r.star = k;
        if ((cc === '.' || cc === 'o') && r.dot < 0) r.dot = k;

        var nk = ny * W + nx;
        if (dist[nk] >= 0) continue;
        var nd = dist[k] + 1;
        if (cd[nk] * ratio - nd < margin && !prey[nk]) continue;     // 追兵會先到 / 同時到 ⇒ 不走（換算成主角的格數）
        dist[nk] = nd; first[nk] = (k === k0) ? i : first[k];

      }
    }
    return r;
  }
  function botPlan() {
    var h = g.hero, t = tileOf(h), sx = t[0], sy = t[1], i;
    var cd = threatMap();
    if (!aligned(h) && h.moving) {
      // 半路上：預設從「前方那格」規劃；前方那格太危險就從「身後那格」規劃（= 立刻掉頭）
      var ax = wrapX(Math.floor(h.x / 8) + (DX[h.dir] > 0 ? 1 : 0)), ay = Math.floor(h.y / 8) + (DY[h.dir] > 0 ? 1 : 0);
      var bx = wrapX(ax - DX[h.dir]), by = ay - DY[h.dir];
      if (cd[key(ax, ay)] <= 1 && cd[key(bx, by)] > cd[key(ax, ay)]) { sx = bx; sy = by; }
      else { sx = ax; sy = ay; }
    }
    var near = cd[key(t[0], t[1])];
    var prey = {};
    for (i = 0; i < 4; i++) {
      var c = g.chasers[i];
      if (c.state === 'out' && c.fright && g.frightT > 60) { var ct = tileOf(c); prey[key(ct[0], ct[1])] = 1; }
    }
    var stale = g.playFrames - (g.botEatF || 0) > 900;
    var want = near <= 7 && g.frightT === 0;
    var r = null, goal = -1, m;
    var margins = stale ? [2, 1] : [3, 2];
    for (m = 0; m < margins.length && goal < 0; m++) {
      r = botSearch(sx, sy, cd, prey, margins[m]);
      goal = r.prey >= 0 ? r.prey : (want && r.star >= 0) ? r.star : r.dot;
      if (goal >= 0 && r.first[goal] < 0) goal = -1;
    }
    if (goal < 0) {

      if (!g || (g.mode !== 'play' && g.mode !== 'ready' && g.mode !== 'dying' && g.mode !== 'over')) return false;

    },

    get backTile() { return { tile: spB ? spB.index('BACK') : Object.keys(Z.SPR_TILES).indexOf('BACK'), pal: 0 }; },
    bot: bot,
    goal: function () { return !!g && g.clears >= 3 && g.cheats === 0; },

  };

    },

<script>/* games/cart1/snake/song.js */

 *

 * |--------------|---------------|-------|------|------|

 * | snake_play   | 經典 / 關卡   | 6     | 8    | G–Em–C–D 進行、p1 切分旋律（蟲在爬的「一伸一縮」節奏） |
 * | snake_vs     | 對戰電腦蟲    | 5     | 4    | E 小調、較急、雙方波對答 |
 * | snake_clear  | 過關          | 6     | 2    | 上行琶音（不 loop） |
 * | snake_over   | GAME OVER     | 8     | 2    | 下行（不 loop） |

(function () {
  'use strict';
  var CT = window.CT = window.CT || {};

  function tok(s) { return String(s).split(/\s+/).filter(function (t) { return t.length > 0; }); }

    lead: { vol: [13, 14, 13, 12, 11, 10, 10, 9, 9, 8], volLoop: 9, duty: [1, 2], dutyLoop: 1 },
    soft: { vol: [10, 10, 9, 9, 8, 8, 7], volLoop: 6, duty: [2] },
    stab: { vol: [11, 9, 7, 5, 3, 2, 1, 0], duty: [0] },
    bass: {},

      var key = tr + JSON.stringify(arr);

    'G-5 -   B-5 G-5 -   D-5 -   E-5 G-5 -   A-5 -   B-5 -   -   -  ',
    'E-5 -   G-5 E-5 -   B-4 -   D-5 E-5 -   G-5 -   F#5 -   -   -  ',
    'C-5 -   E-5 C-5 -   G-4 -   A-4 C-5 -   E-5 -   D-5 -   C-5 -  ',
    'D-5 -   F#5 -   A-5 -   F#5 -   D-5 -   E-5 -   F#5 -   -   -  ',
    'B-5 -   D-6 B-5 -   G-5 -   A-5 B-5 -   D-6 -   E-6 -   D-6 -  ',
    'G-5 -   B-5 G-5 -   E-5 -   F#5 G-5 -   B-5 -   A-5 -   -   -  ',
    'E-5 -   G-5 E-5 -   C-5 -   D-5 E-5 -   A-5 -   G-5 -   E-5 -  ',
    'F#5 -   -   A-5 -   -   D-5 -   E-5 -   F#5 -   G-5 -   -   -  '

  var PLAY_CH = [['G-3', MAJ], ['E-3', MIN], ['C-3', MAJ], ['D-3', MAJ], ['G-3', MAJ], ['E-3', MIN], ['C-3', MAJ], ['D-3', MAJ]];
  var PLAY_BASS = ['G-2', 'E-2', 'C-2', 'D-2', 'G-2', 'E-2', 'C-2', 'D-2'];

    var n = { 'G-2': ['G-2', 'D-3', 'G-3', 'D-3'], 'E-2': ['E-2', 'B-2', 'E-3', 'B-2'], 'C-2': ['C-2', 'G-2', 'C-3', 'G-2'],
              'D-2': ['D-2', 'A-2', 'D-3', 'A-2'], 'A-2': ['A-1', 'E-2', 'A-2', 'E-2'], 'B-2': ['B-1', 'F#2', 'B-2', 'F#2'] }[root];

    var M = ['E-5 -   D-5 E-5 G-5 -   -   -   E-5 -   C-5 -   D-5 -   -   -  ',

             'B-4 -   -   D-5 -   -   G-5 -   A-5 -   B-5 -   C-6 -   -   -  ',

             'C-6 -   B-5 -   A-5 -   G-5 -   F#5 -   G-5 -   A-5 -   B-5 -  ',
             'E-5 -   G-5 -   B-5 -   E-6 -   F#6 -   E-6 -   D-6 -   B-5 -  ',
             'C-6 -   -   B-5 -   -   A-5 -   B-5 -   -   -   E-5 -   -   -  '];

             '-   -   -   -   -   -   -   -   D-5 -   E-5 -   F#5 -   G-5 -  ',
             '-   -   -   -   -   -   -   -   B-4 -   D-5 -   E-5 -   F#5 -  ',
             'A-4 -   -   G-4 -   -   F#4 -   G-4 -   -   -   B-4 -   -   -  '];
    var B = ['E-2', 'C-2', 'E-2', 'B-2'], bars = [];

  function buildClear() {

      { p1: mel('G-5 -   B-5 -   D-6 -   G-6 -   F#6 -   D-6 -   E-6 -   F#6 -  ', 'lead', 13), tri: walk('G-2') },

  }

      { p1: mel('B-4 -   -   -   A#4 -   -   -   A-4 -   -   -   G#4 -   -   -  ', 'soft', 11),
        tri: mel('E-2 -   -   -   D#2 -   -   -   D-2 -   -   -   C#2 -   -   -  ', 'bass', 15) },

<script>/* games/cart1/snake/main.js */
/*
 * games/cart1/snake/main.js — 《星塵貪食蟲》（合輯槽 5，id = snake；舊作 snake.html / snake-game.html 只取「格子移動 + 長度成長」概念）
 * ---------------------------------------------------------------------------
 * 擁有者：C5-1 cart1-grid（R5）。依賴 engine/*、games/cart1/registry.js、snake/{chr,stages,song}.js。
 *
 * 三模式
 *   ENDLESS 經典無盡：空場地，每吃 5 顆加速一級（8 → 3 幀 / 格），撞到就結束，比最高分
 *   STAGES  關卡制：8 關（障礙 / 傳送門 / 每關換底色），吃滿目標數過關，3 條命
 *   VS CPU  對戰電腦蟲：競技場搶星，先吃滿 10 顆或對手撞毀者贏一局，三戰兩勝；電腦蟲逐局變聰明
 * 共通：星屑 +1 節、每 5 顆冒出限時星鑽（+3 節、+50 分）、傳送門（頭走進 A 從 A' 同方向出來，出口被擋就自動轉彎）、
 *   START 暫停、十字鍵 / 觸控搖桿轉向（可預先排 2 個轉向）、一鍵密技 = +1 命 + 慢動作 10 秒。
 *
 * 硬限制：蟲 / 星 / 牆全是背景磚（影子名稱表比對才寫），每步 ≤ 8 byte；精靈只有選單游標 1 顆。
 */
(function () {
  'use strict';
  var NES = window.NES = window.NES || {};
  var CT = window.CT;
  if (!CT || !CT.register) throw new Error('snake/main.js 需要 games/cart1/registry.js');
  var S = CT.Snake = CT.Snake || {};
  var BTN = (NES.Input && NES.Input.BTN) || { A: 1, B: 2, SELECT: 4, START: 8, UP: 16, DOWN: 32, LEFT: 64, RIGHT: 128 };

  var FW = S.FW, FH = S.FH, FX0 = 1, FY0 = 5;      // 內格 (0,0) 在名稱表 (1,5)
  var DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
  var DIRBTN = [BTN.UP, BTN.RIGHT, BTN.DOWN, BTN.LEFT];
  var EMPTY = 0, WALL = 1, PORTAL = 2, FOOD = 3, GEM = 4, PL = 5, CPU = 6;
  var MODES = ['ENDLESS', 'STAGES', 'VS CPU'];
  var START_LIVES = 3;
  var READY_F = 70, CRASH_F = 80, CLEAR_F = 130, OVER_F = 200, ROUND_F = 140;
  var GEM_EVERY = 5, GEM_F = 420, SLOW_F = 600, VS_TARGET = 10;

  var nes0 = null, ppu = null, bgB = null, spB = null, g = null, shadow = null;

  /* ============================== 工具 ============================== */
  function rnd() { g.seed = (g.seed * 1103515245 + 12345) & 0x7fffffff; return g.seed >> 8; }
  function rev(d) { return (d + 2) & 3; }
  function idx(x, y) { return y * FW + x; }
  function inF(x, y) { return x >= 0 && y >= 0 && x < FW && y < FH; }
  function put(col, row, tile) {
    var i = row * 32 + col;
    if (shadow[i] === tile) return;
    shadow[i] = tile;
    ppu.setTile(0, col, row, tile);
  }
  function T(n) { return bgB.index(n); }
  function text(col, row, str) { for (var i = 0; i < str.length; i++) put(col + i, row, T(S.fontName(str.charAt(i)))); }
  function num(n, w) { var s = String(Math.max(0, n | 0)); while (s.length < w) s = '0' + s; return s.slice(-w); }
  function pad(s, w) { while (s.length < w) s += ' '; return s.slice(0, w); }

  /* ============================== 調色盤 / CHR ============================== */

    ppu.setBgPalette(0, FIELD);
    ppu.setBgPalette(1, [0x21, 0x27, 0x30]);   // HUD
    ppu.setBgPalette(2, [0x1A, 0x0A, 0x3A]);   // 標題大字（綠色立體磚）
    ppu.setBgPalette(3, [0x16, 0x26, 0x30]);
    ppu.setSprPalette(0, FIELD);
    ppu.setSprPalette(1, [0x16, 0x27, 0x30]);
    ppu.setSprPalette(2, [0x12, 0x22, 0x30]);
    ppu.setSprPalette(3, [0x00, 0x10, 0x30]);

  function clearAll(back) {

  /* ============================== 場地 ============================== */
  function loadField(def) {
    g.def = def;
    g.occ = new Int8Array(FW * FH);
