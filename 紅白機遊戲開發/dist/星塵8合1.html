    for (i = 0; i < def.walls.length; i++) {
      var w = def.walls[i];
      for (y = w[1]; y < w[1] + w[3]; y++) for (x = w[0]; x < w[0] + w[2]; x++) if (inF(x, y)) g.occ[idx(x, y)] = WALL;
    }
    for (i = 0; i < def.portals.length; i++) {
      var p = def.portals[i];
      g.occ[idx(p.a[0], p.a[1])] = PORTAL; g.occ[idx(p.b[0], p.b[1])] = PORTAL;
      g.portal[idx(p.a[0], p.a[1])] = { to: p.b, k: p.k };
      g.portal[idx(p.b[0], p.b[1])] = { to: p.a, k: p.k };
    }
    g.food = null; g.gem = null;
  }
  function newSnake(who, st) {
    var s = { who: who, code: who === 'P' ? PL : CPU, cells: [], dir: st[2], queue: [], grow: 0, alive: true, eaten: 0, warps: 0 };
    for (var i = 0; i < S.START_LEN; i++) s.cells.push([st[0] - DX[st[2]] * i, st[1] - DY[st[2]] * i]);
    for (i = 0; i < s.cells.length; i++) g.occ[idx(s.cells[i][0], s.cells[i][1])] = s.code;
    return s;
  }
  function cellTile(x, y) {
    var o = g.occ[idx(x, y)];
    if (o === WALL) return T('WALL');
    if (o === FOOD) return T(((g.frames >> 4) & 1) ? 'FOOD2' : 'FOOD');
    if (o === GEM) return (g.gem && g.gem.t < 120 && ((g.gem.t >> 3) & 1)) ? 0 : T('GEM');
    if (o === PORTAL) { var p = g.portal[idx(x, y)]; return T('P' + p.k + ((g.frames >> 4) & 1)); }
    if (o === PL || o === CPU) return snakeTile(o === PL ? g.pl : g.cpu, x, y);
    return 0;
  }
  function snakeTile(s, x, y) {
    if (!s) return 0;
    var c = s.cells, n = c.length, i, w = s.who;
    if (c[0][0] === x && c[0][1] === y) return T(w + '_H' + s.dir);
    if (c[n - 1][0] === x && c[n - 1][1] === y) return T(w + '_T' + tailDir(s));
    return T(w + (((x + y) & 1) ? '_BA' : '_BB'));
  }
  function tailDir(s) {
    var c = s.cells, n = c.length, t = c[n - 1], p = c[n - 2], i;
    for (i = 0; i < 4; i++) if (t[0] + DX[i] === p[0] && t[1] + DY[i] === p[1]) return i;
    return s.dir;                        // 傳送門兩端不相鄰
  }
  function drawCell(x, y) { put(FX0 + x, FY0 + y, cellTile(x, y)); }
  function drawFieldFull() {
    clearAll(g.def.back);
    var x, y;
    for (x = 0; x < 32; x++) { put(x, 4, T('WALL')); put(x, 27, T('WALL')); }
    for (y = 4; y < 28; y++) { put(0, y, T('WALL')); put(31, y, T('WALL')); }
    for (y = 0; y < FH; y++) for (x = 0; x < FW; x++) drawCell(x, y);
    ppu.fillAttr(0, 0, 0, 16, 2, 1);    // HUD 列 0..3 = 屬性 1
    g.hud = {};
    drawHud();
  }

  /* ============================== HUD ============================== */
  function drawHud() {
    var h = g.hud;
    if (h.static !== g.mode2) {
      h.static = g.mode2;
      text(1, 1, 'SCORE'); text(20, 1, 'BEST');
    }
    if (h.score !== g.score) { h.score = g.score; text(7, 1, num(g.score, 6)); }
    if (h.best !== g.best) { h.best = g.best; text(25, 1, num(g.best, 6)); }
    var l2, l3;
    if (g.mode2 === 0) {
      l2 = pad('ENDLESS  SPEED ' + (speedLevel() + 1), 30);
      l3 = pad('LENGTH ' + num(g.pl ? g.pl.cells.length : 0, 3) + (g.slowT > 0 ? '  SLOW' : ''), 30);
    } else if (g.mode2 === 1) {
      l2 = pad('STAGE ' + (g.stage + 1) + ' ' + g.def.name, 30);
      l3 = pad('STAR ' + num(g.pl ? g.pl.eaten : 0, 2) + '/' + num(g.def.target, 2) + '  LIFE ' + g.lives + (g.slowT > 0 ? ' SLOW' : ''), 30);
    } else {
      l2 = pad('ROUND ' + g.round + '   WINS ' + g.winsP + ' - ' + g.winsC, 30);
      l3 = pad('YOU ' + num(g.pl ? g.pl.eaten : 0, 2) + '  CPU ' + num(g.cpu ? g.cpu.eaten : 0, 2) + '  TO ' + VS_TARGET + (g.slowT > 0 ? ' SLOW' : ''), 30);
    }
    if (h.l2 !== l2) { h.l2 = l2; text(1, 2, l2); }
    if (h.l3 !== l3) { h.l3 = l3; text(1, 3, l3); }
  }
  // 場地中央訊息（覆蓋 1 列；清除時照格子重畫）
  function fieldMsg(str, row) {
    row = row === undefined ? 10 : row;
    var x, key = 'msgOn' + row;
    if (g[key]) for (x = 0; x < FW; x++) drawCell(x, row);
    g[key] = !!str;
    if (!str) return;
    var col = Math.floor((FW - str.length) / 2);
    for (x = 0; x < str.length; x++) put(FX0 + col + x, FY0 + row, str.charAt(x) === ' ' ? 0 : T(S.fontName(str.charAt(x))));
  }

  /* ============================== 標題 ============================== */
  function drawTitle() {
    clearAll(0x0F);
    var B = 'WORM', i, x, y;
    text(10, 3, '- STARDUST -');
    for (i = 0; i < 4; i++) {
      var rows = S.GLYPH[B.charAt(i)].split(',');
      for (y = 0; y < 7; y++) for (x = 0; x < 5; x++) if (rows[y].charAt(x) === '1') put(4 + i * 6 + x, 5 + y, T('BLK'));
    }
    ppu.fillAttr(0, 2, 2, 12, 4, 2);
    for (i = 0; i < 3; i++) text(10, 15 + i * 2, MODES[i]);
    text(19, 15, num(CT.load('snake', 'endless', 0), 6));
    text(19, 17, 'ST ' + CT.load('snake', 'stage', 0) + '/8');
    text(19, 19, 'WIN ' + num(CT.load('snake', 'vs', 0), 2));
    // fix-r5 P3-5：段落間空一列；P3-6：C/★
    text(4, 22, 'UP DOWN  CHOOSE MODE');
    text(4, 24, 'START    GO   C/★ CHEAT');
    text(4, 26, 'BEST ' + num(g.best, 6));
  }

  /* ============================== 流程 ============================== */
  function enter(m, f) { g.mode = m; g.modeT = f || 0; }
  function startMode(m) {
    g.mode2 = m; g.score = 0; g.lives = START_LIVES; g.stage = 0; g.clearsRun = 0; g.round = 1; g.winsP = 0; g.winsC = 0;
    g.slowT = 0;
    startField();
  }
  function startField() {
    var def = g.mode2 === 0 ? S.ENDLESS : g.mode2 === 1 ? S.STAGES[g.stage] : S.ARENA;
    loadField(def);
    g.pl = newSnake('P', def.start);
    g.cpu = g.mode2 === 2 ? newSnake('C', def.cpu) : null;
    g.foods = 0; g.moveT = 0; g.cpuT = 0;
    spawnFood();
    CT.blank(nes0, drawFieldFull);
    enter('ready', READY_F);
    fieldMsg(g.mode2 === 1 ? 'STAGE ' + (g.stage + 1) : g.mode2 === 2 ? 'ROUND ' + g.round : 'READY');
    S.Audio.play(nes0, g.mode2 === 2 ? 'snake_vs' : 'snake_play');
  }
  function spawnFood() {
    var tries, x, y;
    for (tries = 0; tries < 400; tries++) {
      x = rnd() % FW; y = rnd() % FH;
      if (g.occ[idx(x, y)] !== EMPTY) continue;
      if (nearHead(x, y, 2)) continue;
      g.occ[idx(x, y)] = FOOD; g.food = [x, y];
      return true;
    }
    for (y = 0; y < FH; y++) for (x = 0; x < FW; x++) if (g.occ[idx(x, y)] === EMPTY) { g.occ[idx(x, y)] = FOOD; g.food = [x, y]; return true; }
    g.food = null;
    return false;
  }
  function spawnGem() {
    for (var tries = 0; tries < 200; tries++) {
      var x = rnd() % FW, y = rnd() % FH;
      if (g.occ[idx(x, y)] !== EMPTY || nearHead(x, y, 3)) continue;
      g.occ[idx(x, y)] = GEM; g.gem = { x: x, y: y, t: GEM_F };
      drawCell(x, y);
      return;
    }
  }
  function nearHead(x, y, r) {
    var a = [g.pl, g.cpu], i;
    for (i = 0; i < 2; i++) if (a[i]) { var h = a[i].cells[0]; if (Math.abs(h[0] - x) + Math.abs(h[1] - y) <= r) return true; }
    return false;
  }
  function speedLevel() { return g.mode2 === 0 ? Math.min(5, Math.floor(g.foods / 5)) : 0; }
  function interval() {
    var base = g.def.speed - speedLevel();
    if (g.mode2 === 2) base = S.ARENA.speed - (g.round - 1);
    return Math.max(3, base) + (g.slowT > 0 ? 3 : 0);
  }

  /* ---------- 移動（含傳送門） ---------- */
  // 從 (x,y) 往 d 走一步 → {x, y, d, warp} ；出界回 null（= 撞牆）
  function stepCell(x, y, d) {
    var nx = x + DX[d], ny = y + DY[d];
    if (!inF(nx, ny)) return null;
    var p = g.portal[idx(nx, ny)];
    if (!p) return { x: nx, y: ny, d: d, warp: false };
    var tries = [d, (d + 1) & 3, (d + 3) & 3], i;
    for (i = 0; i < 3; i++) {
      var qx = p.to[0] + DX[tries[i]], qy = p.to[1] + DY[tries[i]];
      if (inF(qx, qy) && g.occ[idx(qx, qy)] !== WALL && g.occ[idx(qx, qy)] !== PORTAL) return { x: qx, y: qy, d: tries[i], warp: true };
    }
    return null;
  }
  function blockedFor(s, x, y) {
    var o = g.occ[idx(x, y)];
    if (o === WALL || o === PORTAL) return true;
    if (o === PL || o === CPU) {
      var t = s.cells[s.cells.length - 1];
      if (o === s.code && t[0] === x && t[1] === y && s.grow === 0) return false;   // 自己的尾巴會讓開
      return true;
    }
    return false;
  }
  function wantDir(s) {
    while (s.queue.length) {
      var d = s.queue.shift();
      if (d !== s.dir && d !== rev(s.dir)) return d;
    }
    if (s.held >= 0 && s.held !== rev(s.dir)) return s.held;
    return s.dir;
  }
  // 兩條蟲同時決定下一格 → 判定 → 再一起移動
  function tickSnakes() {
    var list = [g.pl], i;
    if (g.cpu) list.push(g.cpu);
    var plans = [];
    for (i = 0; i < list.length; i++) {
      var s = list[i];
      var d = s === g.cpu ? (g.cpuForce >= 0 ? g.cpuForce : aiDir(g.cpu, g.pl, g.round)) : wantDir(s);
      var nx = stepCell(s.cells[0][0], s.cells[0][1], d);
      plans.push({ s: s, n: nx, crash: !nx || blockedFor(s, nx.x, nx.y) });
    }
    if (plans.length === 2 && plans[0].n && plans[1].n && plans[0].n.x === plans[1].n.x && plans[0].n.y === plans[1].n.y) {
      plans[0].crash = plans[1].crash = true;    // 正面對撞
    }
    for (i = 0; i < plans.length; i++) if (plans[i].crash) { plans[i].s.alive = false; plans[i].s.crashAt = plans[i].n ? [plans[i].n.x, plans[i].n.y] : null; }
    for (i = 0; i < plans.length; i++) if (!plans[i].crash) advance(plans[i].s, plans[i].n);
    var dead = plans.filter(function (p) { return p.crash; });
    if (dead.length) onCrash(dead.map(function (p) { return p.s; }));
  }
  function advance(s, n) {
    var oldHead = s.cells[0], o = g.occ[idx(n.x, n.y)];
    s.dir = n.d;
    if (n.warp) { s.warps++; S.Audio.sfx(nes0, 'snake_warp'); }
    var ateFood = o === FOOD, ateGem = o === GEM;
    // 尾巴先走（沒在長的話）
    if (s.grow > 0) s.grow--;
    else {
      var t = s.cells.pop();
      if (!(t[0] === n.x && t[1] === n.y)) { g.occ[idx(t[0], t[1])] = EMPTY; drawCell(t[0], t[1]); }
    }
    s.cells.unshift([n.x, n.y]);
    g.occ[idx(n.x, n.y)] = s.code;
    drawCell(n.x, n.y);
    drawCell(oldHead[0], oldHead[1]);
    var tl = s.cells[s.cells.length - 1];
    drawCell(tl[0], tl[1]);
    if (ateFood) {
      s.grow += 1; s.eaten++; g.foods++;
      if (s === g.pl) { addScore(10 * (1 + speedLevel()) + (g.mode2 === 1 ? 5 * g.stage : 0)); S.Audio.sfx(nes0, 'snake_eat'); }
      else S.Audio.sfx(nes0, 'snake_cpu');
      spawnFood(); drawCell(g.food[0], g.food[1]);
      if (g.foods % GEM_EVERY === 0 && !g.gem) spawnGem();
    }
    if (ateGem) {
      s.grow += 3; g.gem = null;
      if (s === g.pl) { addScore(50); S.Audio.sfx(nes0, 'snake_gem'); if (g.mode2 === 1) s.eaten++; }
    }
  }
  function addScore(n) { g.score += n; if (g.score > g.best) { g.best = g.score; } }

  function onCrash(dead) {
    var i;
    for (i = 0; i < dead.length; i++) {
      var c = dead[i].crashAt || dead[i].cells[0];
      if (inF(c[0], c[1])) put(FX0 + c[0], FY0 + c[1], T('CRASH'));
    }
    S.Audio.stop(nes0);
    S.Audio.sfx(nes0, 'snake_crash');
    g.deaths += (dead.indexOf(g.pl) >= 0) ? 1 : 0;
    g.lastDead = dead.map(function (s) { return s.who; }).join('');
    enter('crash', CRASH_F);
  }
  function saveBests() {
    CT.save('snake', 'best', Math.max(CT.load('snake', 'best', 0), g.best));
    if (g.mode2 === 0) CT.save('snake', 'endless', Math.max(CT.load('snake', 'endless', 0), g.score));
  }

  /* ============================== 電腦蟲 AI / 機器人共用的規劃 ============================== */
  // BFS（含傳送門）找最近的星 / 星鑽；吃到後若還能走到自己的尾巴（或可走面積 ≥ 身長）才採用，否則求生（選可走面積最大的方向）
  function bfs(s, x0, y0, d0) {
    var N = FW * FH, dist = new Int16Array(N), first = new Int8Array(N), prev = new Int32Array(N), q = new Int32Array(N), qh = 0, qt = 0, i;
    for (i = 0; i < N; i++) { dist[i] = -1; prev[i] = -1; }
    var k0 = idx(x0, y0);
    dist[k0] = 0; first[k0] = -1; q[qt++] = k0;
    var hdir = new Int8Array(N); hdir[k0] = d0;
    while (qh < qt) {
      var k = q[qh++], x = k % FW, y = (k / FW) | 0;
      for (i = 0; i < 4; i++) {
        if (k === k0 && i === rev(d0)) continue;
        var n = stepCell(x, y, i);
        if (!n) continue;
        var nk = idx(n.x, n.y);
        if (dist[nk] >= 0 || blockedFor(s, n.x, n.y)) continue;
        dist[nk] = dist[k] + 1; first[nk] = k === k0 ? i : first[k]; prev[nk] = k; hdir[nk] = n.d;
        q[qt++] = nk;
      }
    }
    return { dist: dist, first: first, prev: prev };
  }
  function floodArea(block, x0, y0, limit) {
    var N = FW * FH, seen = new Uint8Array(N), q = new Int32Array(N), qh = 0, qt = 0, c = 0, i;
    var k0 = idx(x0, y0);
    seen[k0] = 1; q[qt++] = k0;
    while (qh < qt && c < limit) {
      var k = q[qh++], x = k % FW, y = (k / FW) | 0; c++;
      for (i = 0; i < 4; i++) {
        var n = stepCell(x, y, i);
        if (!n) continue;
        var nk = idx(n.x, n.y);
        if (seen[nk] || block[nk]) continue;
        seen[nk] = 1; q[qt++] = nk;
      }
    }
    return c;
  }
  function baseBlock(except) {
    var N = FW * FH, b = new Uint8Array(N), i;
    for (i = 0; i < N; i++) { var o = g.occ[i]; if (o === WALL || o === PORTAL || o === PL || o === CPU) b[i] = 1; }
    if (except) b[idx(except[0], except[1])] = 0;
    return b;
  }
  // 沿路徑吃到目標後的虛擬蟲身 → 從新頭能不能走到新尾巴 / 面積夠不夠
  function safeAfter(s, r, goal) {
    var path = [], k = goal;
    while (k >= 0 && r.prev[k] >= 0) { path.push(k); k = r.prev[k]; }
    var len = s.cells.length + s.grow + 1;
    var body = path.slice(0);            // path[0] = 目標（新頭）
    for (var i = 0; i < s.cells.length && body.length < len; i++) body.push(idx(s.cells[i][0], s.cells[i][1]));
    var b = baseBlock(null), j;
    for (j = 0; j < s.cells.length; j++) b[idx(s.cells[j][0], s.cells[j][1])] = 0;
    for (j = 0; j < body.length; j++) b[body[j]] = 1;
    var tail = body[body.length - 1];
    b[tail] = 0;
    var hx = goal % FW, hy = (goal / FW) | 0;
    b[goal] = 0;
    var area = floodArea(b, hx, hy, len + 8);
    if (area >= len + 2) return true;
    // 走得到尾巴也算安全
    var seen = new Uint8Array(FW * FH), q = [goal]; seen[goal] = 1;
    while (q.length) {
      var kk = q.shift(), x = kk % FW, y = (kk / FW) | 0;
      if (kk === tail) return true;
      for (var d = 0; d < 4; d++) {
        var n = stepCell(x, y, d); if (!n) continue;
        var nk = idx(n.x, n.y);
        if (seen[nk] || (b[nk] && nk !== tail)) continue;
        seen[nk] = 1; q.push(nk);
      }
    }
    return false;
  }
  function planDir(s, other, sloppy) {
    var h = s.cells[0], r = bfs(s, h[0], h[1], s.dir), i;
    var goals = [];
    if (g.gem) goals.push(idx(g.gem.x, g.gem.y));
    if (g.food) goals.push(idx(g.food[0], g.food[1]));
    goals.sort(function (a, b) { return (r.dist[a] < 0 ? 9999 : r.dist[a]) - (r.dist[b] < 0 ? 9999 : r.dist[b]); });
    for (i = 0; i < goals.length; i++) {
      var gk = goals[i];
      if (r.dist[gk] < 0) continue;
      // 對手比我先到就不搶（避免正面對撞）
      if (other && other.alive) {
        var oh = other.cells[0], od = Math.abs(oh[0] - gk % FW) + Math.abs(oh[1] - ((gk / FW) | 0));
        if (od <= 1 && r.dist[gk] <= 2) continue;
      }
      if (sloppy || safeAfter(s, r, gk)) return r.first[gk];
    }
    // 求生：每個可走方向的面積，取最大（同分偏好直走）
    var best = -1, bv = -1;
    for (i = 0; i < 4; i++) {
      if (i === rev(s.dir)) continue;
      var n = stepCell(h[0], h[1], i);
      if (!n || blockedFor(s, n.x, n.y)) continue;
      var b = baseBlock(s.cells[s.cells.length - 1]);
      b[idx(h[0], h[1])] = 1;
      var a = floodArea(b, n.x, n.y, 400) * 4 + (i === s.dir ? 1 : 0);
      if (other && other.alive) { var oh2 = other.cells[0]; if (Math.abs(oh2[0] - n.x) + Math.abs(oh2[1] - n.y) <= 1) a -= 200; }
      if (a > bv) { bv = a; best = i; }
    }
    return best >= 0 ? best : s.dir;
  }
  function aiDir(s, other, round) {
    // 電腦蟲：第 1 局 18% 機率偷懶（只看最短路、不檢查安全）、第 2 局 8%、第 3 局 2%
    var lazy = [18, 8, 2][Math.min(2, round - 1)];
    return planDir(s, other, (rnd() % 100) < lazy);
  }

  /* ============================== update ============================== */
  function readInput() {
    var I = NES.Input, s = g.pl, i;
    if (!s) return;
    for (i = 0; i < 4; i++) if (I.pressed(DIRBTN[i])) {
      var last = s.queue.length ? s.queue[s.queue.length - 1] : s.dir;
      if (i !== last && i !== rev(last) && s.queue.length < 2) s.queue.push(i);
    }
    s.held = -1;
    for (i = 0; i < 4; i++) if (I.held(DIRBTN[i])) { s.held = i; if (i !== s.dir) break; }
  }
  function update(nes) {
    S.Audio.tick(nes);
    g.frames++;
    if (g.cheatReq) { g.cheatReq = false; doCheat(); }
    var I = NES.Input;
    if (g.mode === 'title') { titleUpdate(I); return; }
    if ((g.mode === 'play') && I.pressed(BTN.START) && !I.held(BTN.SELECT)) {
      g.paused = !g.paused;
      fieldMsg(g.paused ? 'PAUSE' : '');
      fieldMsg(g.paused ? 'HOLD START+SELECT: MENU' : '', 12);     // §6-5
      if (g.paused) S.Audio.pause(nes0); else S.Audio.resume(nes0);  // §6-2
      S.Audio.sfx(nes0, 'snake_pause');
      return;
    }
    if (g.paused) return;
    if (g.modeT > 0) g.modeT--;
    // 星 / 傳送門動畫（每 16 幀換一次 = 星 1 byte + 門 ≤ 4 byte）
    if ((g.frames & 15) === 0) animate();
    switch (g.mode) {
      case 'ready':
        readInput();
        if (g.modeT <= 0) { fieldMsg(''); enter('play'); }
        break;
      case 'play':
        g.playFrames++;
        if (g.slowT > 0) g.slowT--;
        readInput();
        if (g.gem && --g.gem.t <= 0) { g.occ[idx(g.gem.x, g.gem.y)] = EMPTY; drawCell(g.gem.x, g.gem.y); g.gem = null; }
        else if (g.gem && g.gem.t < 120 && (g.gem.t & 7) === 0) drawCell(g.gem.x, g.gem.y);
        if (++g.moveT >= interval()) { g.moveT = 0; tickSnakes(); }
        if (g.mode !== 'play') break;
        if (g.mode2 === 1 && g.pl.eaten >= g.def.target) {
          g.clearsRun++; g.stageClears++;
          CT.save('snake', 'stage', Math.max(CT.load('snake', 'stage', 0), g.stage + 1));
          enter('clear', CLEAR_F);
          fieldMsg(g.stage + 1 >= S.STAGES.length ? 'ALL CLEAR!' : 'STAGE CLEAR!');
          S.Audio.play(nes0, 'snake_clear');
        } else if (g.mode2 === 2 && (g.pl.eaten >= VS_TARGET || g.cpu.eaten >= VS_TARGET)) {
          roundEnd(g.pl.eaten >= VS_TARGET ? 'P' : 'C');
        }
        break;
      case 'crash':
        if (g.modeT <= 0) afterCrash();
        break;
      case 'clear':
        if (g.modeT <= 0) {
          saveBests();
          if (g.stage + 1 >= S.STAGES.length) { toTitle(); break; }
          g.stage++;
          startField();
        }
        break;
      case 'round':
        if (g.modeT <= 0) {
          if (g.winsP >= 2 || g.winsC >= 2) {
            if (g.winsP >= 2) CT.save('snake', 'vs', CT.load('snake', 'vs', 0) + 1);
            saveBests();
            enter('over', OVER_F);
            fieldMsg(g.winsP >= 2 ? 'YOU WIN THE MATCH' : 'CPU WINS THE MATCH');
            S.Audio.play(nes0, g.winsP >= 2 ? 'snake_clear' : 'snake_over');
          } else { g.round++; startField(); }
        }
        break;
      case 'over':
        if (g.modeT <= 0) toTitle();
        break;
    }
    drawHud();
  }
  function afterCrash() {
    if (g.mode2 === 0) {
      saveBests();
      enter('over', OVER_F); fieldMsg('GAME OVER'); S.Audio.play(nes0, 'snake_over');
    } else if (g.mode2 === 1) {
      g.lives--;
      if (g.lives <= 0) { saveBests(); enter('over', OVER_F); fieldMsg('GAME OVER'); S.Audio.play(nes0, 'snake_over'); }
      else startField();
    } else {
      var d = g.lastDead;
      if (d === 'PC' || d === 'CP') { fieldMsg('DRAW'); enter('round', ROUND_F); }   // 雙雙撞毀 = 重打這局
      else roundEnd(d === 'P' ? 'C' : 'P');
    }
  }
  function roundEnd(winner) {
    if (winner === 'P') { g.winsP++; addScore(200); } else g.winsC++;
    enter('round', ROUND_F);
    fieldMsg(winner === 'P' ? 'YOU WIN ROUND ' + g.round : 'CPU WINS ROUND ' + g.round);
    S.Audio.play(nes0, winner === 'P' ? 'snake_clear' : 'snake_over');
  }
  function animate() {
    if (!g.occ) return;
    if (g.food) drawCell(g.food[0], g.food[1]);
    var k;
    for (k in g.portal) if (Object.prototype.hasOwnProperty.call(g.portal, k)) drawCell(k % FW, (k / FW) | 0);
  }
  function titleUpdate(I) {
    var n = MODES.length;
    if (I.pressed(BTN.DOWN) || I.pressed(BTN.SELECT) && !I.held(BTN.START)) { g.sel = (g.sel + 1) % n; S.Audio.sfx(nes0, 'snake_menu'); }
    if (I.pressed(BTN.UP)) { g.sel = (g.sel + n - 1) % n; S.Audio.sfx(nes0, 'snake_menu'); }
    if ((I.pressed(BTN.START) && !I.held(BTN.SELECT)) || I.pressed(BTN.A)) { S.Audio.sfx(nes0, 'snake_ok'); startMode(g.sel); }
  }
  function toTitle() {
    enter('title'); g.paused = false; g.pl = null; g.cpu = null; g.occ = null;
    CT.blank(nes0, drawTitle);
    S.Audio.play(nes0, 'snake_title');
  }

  /* ============================== 密技 ============================== */
  function doCheat() {
    if (!g || g.mode === 'title') return false;
    if (g.mode === 'over') {
      // §6-1 原地續關：回到剛才那一關 / 那一局，保留分數與進度；命數回開局值
      if (g.mode2 === 2 && g.winsP >= 2) return false;          // 已經贏下整場：不是失敗畫面
      g.cheats++;
      g.lives = START_LIVES;
      if (g.mode2 === 2) g.winsC = Math.min(g.winsC, 1);         // 撤銷剛才輸掉的那一局，同一局重打
      g.paused = false;
      startField();
      return true;
    }
    g.cheats++;
    g.lives = Math.min(9, g.lives + 1);
    g.slowT = SLOW_F;
    return true;
  }

  /* ============================== draw ============================== */
  function draw() {
    if (g.mode === 'title') {

      ppu.sprite(1, { x: 7 * 8 - (f ? 1 : 0) - 2, y: y, tile: spB.index('CURSOR2'), pal: 0 });
      return;
    }
    ppu.sprite(0, null); ppu.sprite(1, null);
  }

  /* ============================== 機器人 ============================== */
  function bot() {
    if (!g) return null;
    if (g.mode === 'title') {
      if (g.sel !== 1) return (g.frames & 7) === 0 ? BTN.DOWN : null;
      return (g.frames & 7) === 4 ? BTN.START : null;
    }
    if ((g.mode !== 'play' && g.mode !== 'ready') || g.paused || !g.pl) return null;
    var d = planDir(g.pl, g.cpu, false);
    return DIRBTN[d];
  }

  /* ============================== 註冊 ============================== */
  function newState() {
    return {
      mode: 'title', modeT: 0, frames: 0, playFrames: 0, sel: 0, mode2: 1, seed: 5150713, paused: false,
      score: 0, best: CT.load('snake', 'best', 0), lives: 3, stage: 0, clearsRun: 0, stageClears: 0,
      round: 1, winsP: 0, winsC: 0, deaths: 0, cheats: 0, slowT: 0, cheatReq: false,
      cpuForce: -1, def: S.ENDLESS, occ: null, pl: null, cpu: null, food: null, gem: null, hud: {}, foods: 0
    };
  }
  var game = {
    id: 'snake', order: 5, title: '星塵貪食蟲', legacy: ['snake.html', 'snake-game.html'],
    init: function (nes) {
      nes0 = nes; ppu = nes.ppu;
      g = newState();
      buildChr();
      S.Audio.init(nes);
      drawTitle();
      enter('title');
      var m = CT.query('mode'), st = parseInt(CT.query('stage') || '0', 10);
      if (m === 'endless' || m === 'stages' || m === 'vs' || st > 0) {
        startMode(m === 'endless' ? 0 : m === 'vs' ? 2 : 1);
        if (st > 0 && g.mode2 === 1) { g.stage = Math.min(S.STAGES.length, st) - 1; startField(); }
      } else S.Audio.play(nes0, 'snake_title');
    },
    update: update,
    draw: function () { draw(); },
    exit: function () { if (g && g.mode !== 'title') saveBests(); S.Audio.stop(nes0); },   // §6-3
    state: function () {
      if (!g) return null;
      return {
        mode: g.mode, sMode: MODES[g.mode2], paused: g.paused, sel: g.sel, stage: g.stage + 1, stageName: g.def.name,
        score: g.score, best: g.best, lives: g.lives, clears: g.clearsRun, stageClears: g.stageClears, deaths: g.deaths, cheats: g.cheats,
        length: g.pl ? g.pl.cells.length : 0, eaten: g.pl ? g.pl.eaten : 0, target: g.def.target, interval: g.occ ? interval() : 0,
        dir: g.pl ? g.pl.dir : -1, head: g.pl ? g.pl.cells[0] : null, food: g.food, gem: g.gem ? [g.gem.x, g.gem.y] : null,
        cpu: g.cpu ? { length: g.cpu.cells.length, eaten: g.cpu.eaten, head: g.cpu.cells[0], alive: g.cpu.alive } : null,
        round: g.round, winsP: g.winsP, winsC: g.winsC, slowT: g.slowT, frames: g.frames, playFrames: g.playFrames,
        warps: g.pl ? g.pl.warps : 0, song: S.Audio.current
      };
    },
    cheat: function () {
      // §6-1：遊玩中 = 補命 + 慢動作；GAME OVER（輸掉）= 原地續關；標題無效（P3-7）
      if (!g || g.mode === 'title') return false;
      if (g.mode === 'over' && g.mode2 === 2 && g.winsP >= 2) return false;
      g.cheatReq = true;
      return true;
    },
    get backTile() { return { tile: spB ? spB.index('BACK') : Object.keys(S.SPR_TILES).indexOf('BACK'), pal: 0 }; },   // §6-4
    bot: bot,
    goal: function () { return !!g && g.mode2 === 1 && g.clearsRun >= 3 && g.cheats === 0; },
    bestText: function () { return num(Math.min(999999, CT.load('snake', 'best', 0)), 6); }   // R6 §1-6：右對齊 6 字元（超過封頂）
  };
  CT.register(game);

  /* 測試鉤子（test_snake.py 用） */
  S.dev = {
    g: function () { return g; },
    occ: function (x, y) { return g.occ ? g.occ[idx(x, y)] : -1; },
    placeFood: function (x, y) {
      if (g.food) { g.occ[idx(g.food[0], g.food[1])] = EMPTY; drawCell(g.food[0], g.food[1]); }
      g.occ[idx(x, y)] = FOOD; g.food = [x, y]; drawCell(x, y); return g.food;
    },

    cpuDir: function (d) { g.cpuForce = d; return d; },
    setEaten: function (n) { g.pl.eaten = n; return n; },
    stage: function (n) { g.stage = n - 1; startField(); return g.def.name; },
    shadowAt: function (c, r) { return shadow[r * 32 + c]; },

      }

    },
    spr: function () { return spB; },
    bg: function () { return bgB; },
    MODES: MODES, VS_TARGET: VS_TARGET
  };
})();

</script>

 *
 * 曲目（每拍 4 row；BPM = 3600 / (speed × 4)）
 * | key           | 曲名         | speed | BPM   | 調 / 情緒 |
 * |---------------|--------------|-------|-------|-----------|
 * | blocks_a      | 星屑瀑布     | 6     | 150   | F 大調、切分上行，明快（遊戲 A） |
 * | blocks_b      | 月面散步     | 8     | 112.5 | D 多利安、慢搖擺（遊戲 B / 標題） |
 * | blocks_fast   | 星屑瀑布·急  | 5     | 180   | 同 A、場面堆高（≥ 15 列）時切換＝音樂即 UI（研究 13 ⑩） |
 * | blocks_over   | 落幕         | 9     | 100   | 下行收束（不 loop） |
 * | blocks_clear  | 完走         | 6     | 150   | 上行號角（不 loop） |
 *
 * 音效（只搶 p2 / noi，主旋律 p1 與三角波低音不被打斷）：
 *   blocks_over 9 > blocks_quad 8 > blocks_lvl 7 > blocks_line 6 > blocks_rise 5 > blocks_hold 4 >
 *   blocks_drop 4 > blocks_lock 3 > blocks_ok 3 > blocks_rot 2 > blocks_move 1 > blocks_menu 1

  'use strict';
  var CT = global.CT = global.CT || {};

  function tokens(s) { return String(s).split(/\s+/).filter(function (t) { return t.length > 0; }); }
  function mel(str, inst, vol, duty) {
    var t = tokens(str), out = [], i;
    for (i = 0; i < t.length; i++) {
      if (t[i] === '-') out.push(null);

    k: { note: 13, inst: 'kick', vol: 14, duty: 0 }, s: { note: 6, inst: 'snare', vol: 12, duty: 0 },

  var INST = {
    lead: { vol: [14, 15, 14, 13, 12, 12, 11, 11, 10, 10, 9, 9, 8], volLoop: 12, duty: [2, 2, 1] },
    soft: { vol: [10, 12, 12, 11, 11, 10, 10, 9, 9, 8, 8, 7], volLoop: 11, duty: [1], },

    pad: { vol: [7, 8, 8, 8, 7, 7, 7, 6], volLoop: 7, duty: [2] },

    hat: { vol: [8, 4, 1, 0] },

  var A_MEL = [
    'C-5 -   F-5 -   A-5 -   -   G-5 -   F-5 -   -   D-5 -   C-5 -  ',
    'D-5 -   F-5 -   A#5 -   -   A-5 -   G-5 -   -   -   -   -   -  ',

  }

  var B_MEL = [
    'D-5 -   -   E-5 F-5 -   A-5 -   -   -   G-5 -   F-5 -   E-5 -  ',
    'D-5 -   -   -   C-5 -   A-4 -   -   -   -   -   -   -   -   -  ',
    'F-5 -   -   G-5 A-5 -   C-6 -   -   -   B-5 -   A-5 -   G-5 -  ',

    var before = g.level;
    g.lines += rows.length;

  function updateLevel() {

  }
  function riseGarbage() {
    var f = g.field, x, y;

    for (y = 0; y < ROWS - 1; y++) for (x = 0; x < W; x++) f[y * W + x] = f[(y + 1) * W + x];

    for (x = 0; x < W; x++) f[(ROWS - 1) * W + x] = (x === g.riseHole) ? 0 : 4;
    if (g.cur && !fits(g.cur.t, g.cur.rot, g.cur.x, g.cur.y)) {

    var key = g.gameMode === 'marathon' ? 'best' : 'bestc';
    if (g.score > CT.load('blocks', key, 0)) CT.save('blocks', key, g.score);

  }

  /* ============================== 遊戲流程 ============================== */
  function startGame() {
    g.gameMode = g.menuMode === 1 ? 'challenge' : 'marathon';
    g.startLevel = g.gameMode === 'marathon' ? g.menuLevel : 1;
    g.field = new Uint8Array(ROWS * W);
    g.bag = []; g.next = []; g.hold = null; g.holdUsed = false;
    g.score = 0; g.lines = 0; g.combo = -1; g.result = null; g.paused = false; g.pieces = 0;
    g.goal = false; g.cheats = 0; g.popT = 0; g.flashT = 0; g.danger = false; g.palLevel = -1;
    g.stats = { singles: 0, doubles: 0, triples: 0, novas: 0, rises: 0 };
    var seedQ = parseInt(CT.query && CT.query('seed') || '', 10);
    rs = (isFinite(seedQ) && seedQ > 0) ? (seedQ & 0xFFFF) : ((g.frames * 2654435761) & 0xFFFF) || 0x5EED;
    updateLevel();

    g.riseT = 0;
    g.mode = 'play';

  }
  function playMusic() {
    var m = g.menuMusic;
    if (m === 2) { B.Audio.stop(nes0); return; }
    var key = m === 1 ? 'blocks_b' : (g.danger ? 'blocks_fast' : 'blocks_a');
    B.Audio.play(nes0, key);
  }
  function toTitle() {
    g.mode = 'title'; g.result = null; g.cur = null; g.paused = false;
    CT.blank(nes0, function () { drawTitleScreen(); });
    B.Audio.stop(nes0);
    B.Audio.play(nes0, 'blocks_b');
  }

  function held(b) { return NES.Input.held(b); }
  function pressed(b) { return NES.Input.pressed(b); }

  function updateTitle() {
    var up = pressed(BTN.UP), dn = pressed(BTN.DOWN), lf = pressed(BTN.LEFT), rt = pressed(BTN.RIGHT);
    if (up) { g.sel = (g.sel + 2) % 3; sfx('blocks_menu'); }
    if (dn) { g.sel = (g.sel + 1) % 3; sfx('blocks_menu'); }
    if (lf || rt) {
      var d = rt ? 1 : -1;
      if (g.sel === 0) g.menuMode = (g.menuMode + 1) & 1;
      else if (g.sel === 1) g.menuLevel = ((g.menuLevel - 1 + d + 10) % 10) + 1;
      else g.menuMusic = (g.menuMusic + d + 3) % 3;
      sfx('blocks_menu');
    }
    if ((pressed(BTN.START) && !held(BTN.SELECT)) || pressed(BTN.A)) { sfx('blocks_ok'); startGame(); }
  }

  function updatePlay() {
    // START 暫停（SELECT 同時按著 = registry 的回選單組合，不處理）
    if (pressed(BTN.START) && !held(BTN.SELECT) && g.sub !== 'over' && g.sub !== 'done') {
      g.paused = !g.paused;
      if (g.paused) B.Audio.pause(nes0); else if (!B.Audio.resume(nes0)) playMusic();   // R6：從同一 row 接續
      sfx('blocks_ok');
    }
    if (g.paused) return;
    if (g.popT > 0) g.popT--;
    if (g.flashT > 0) g.flashT--;

    if (g.sub === 'over' || g.sub === 'done') {
      g.subT++;
      if (g.subT > 90 && (pressed(BTN.START) || pressed(BTN.A)) && !held(BTN.SELECT)) toTitle();
      return;
    }

    // 挑戰：垃圾行上升計時（消行演出期間暫停）
    if (g.gameMode === 'challenge' && g.sub !== 'clear') {
      g.riseT++;
      if (g.riseT >= RISE[g.level - 1]) { g.riseT = 0; riseGarbage(); if (g.result) return; }
    }

    // 危險區音樂（堆到前 6 列）＝音樂即 UI
    var top = stackTop(), danger = g.danger ? top < HID + 8 : top < HID + 6;
    if (danger !== g.danger) { g.danger = danger; if (g.menuMusic === 0) { B.Audio.current = null; playMusic(); } }

    if (g.sub === 'clear') {
      if (++g.subT >= CLEAR_FRAMES) collapse();
      return;
    }
    if (g.sub === 'are') {

      dasCharge();
      if (++g.subT >= ARE) spawn(takeNext());
      return;
    }

    var p = g.cur;

    if (pressed(BTN.SELECT) && !held(BTN.START) && !g.holdUsed) { doHold(); return; }
    if (pressed(BTN.A)) { if (tryRotate(1)) sfx('blocks_rot'); }
    if (pressed(BTN.B)) { if (tryRotate(-1)) sfx('blocks_rot'); }

    // 左右 + DAS

    // 不能因此誤砸；engine/touch.js 不改，在本遊戲輸入層擋）
    if (pressed(BTN.UP) && !held(BTN.LEFT) && !held(BTN.RIGHT)) {

    if (++g.grav >= gf) { g.grav = 0; if (!tryMove(0, 1)) fall = true; }

  }

  function doHold() {

  }

  /* ============================== 畫面 ============================== */
  function box(c0, r0, c1, r1) {
    var c, r;
    put(c0, r0, B.T('FR_TL')); put(c1, r0, B.T('FR_TR')); put(c0, r1, B.T('FR_BL')); put(c1, r1, B.T('FR_BR'));
    for (c = c0 + 1; c < c1; c++) { put(c, r0, B.T('FR_T')); put(c, r1, B.T('FR_B')); }

      var c = (s >> 10) & 31, r = 1 + ((s >> 16) % 28);

  function setPalettes(lvPal) {

  function drawTitleScreen() {

  function drawTitleValues() {
    text(12, TITLE_ROW, g.menuMode ? 'CHALLENGE' : 'MARATHON ');
    text(12, TITLE_ROW + 2, g.menuMode ? '--' : num(g.menuLevel, 2));

  }
  function drawPlayScreen() {
    ntReset();
    ppu0.fillTiles(0, 0, 0, 32, 30, 0);
    ppu0.fillAttr(0, 0, 0, 16, 15, 0);
    setPalettes(LV_PAL[(g.level - 1) % LV_PAL.length]);

    stars(3, 40, function (c, r) { return r >= 4 && r <= 27; });
    text(8, 2, 'STARDUST  BLOCKS');
    box(FX - 1, FY - 1, FX + W, FY + H);
    box(1, FY - 1, 10, FY + H);
    box(23, FY - 1, 30, FY + H);
    // 屬性：盤面 / 暫存 / 下一塊 = 第 1 組；標籤 = 第 2 組；提示 = 第 3 組
    ppu0.fillAttr(0, FX >> 1, FY >> 1, W >> 1, H >> 1, 1);
    ppu0.fillAttr(0, 2, 4, 2, 1, 1);
    ppu0.fillAttr(0, 12, 4, 2, 1, 1); ppu0.fillAttr(0, 12, 6, 2, 1, 1); ppu0.fillAttr(0, 12, 8, 2, 1, 1);

  }

  function cellTile(y, x) {
    var v = g.field[y * W + x];
    if (g.sub === 'clear') {
      for (var k = 0; k < g.clearRows.length; k++) if (g.clearRows[k] === y) {
        var t = g.subT;
        if (t < 12) return B.T(((t / 3) | 0) & 1 ? 'BK_D' : 'BK_F');
        var step = ((t - 12) >> 1);                      // 0..5：由中間往兩側抹掉
        if (x >= 4 - step && x <= 5 + step) return B.T('SP');
        return B.T('BK_D');
      }
    }
    return B.T(STYLE_TILE[v] || 'SP');
  }
  function preview(c0, r0, t) {
    var x, y, i;
    for (y = 0; y < 2; y++) for (x = 0; x < 4; x++) put(c0 + x, r0 + y, 0);
    if (!t) return;
    var cs = ROT[t][0], st = B.T(STYLE_TILE[SHAPE[t].st]);
    var oy = t === 'I' ? -1 : 0, ox = (t === 'O') ? 1 : 0;
    for (i = 0; i < 4; i++) put(c0 + ox + cs[i][0], r0 + oy + cs[i][1], st);
  }
  function renderPlay() {
    var x, y;
    var over = g.sub === 'over' || g.sub === 'done';
    var curtain = over ? Math.min(H, (g.subT >> 1)) : 0;
    for (y = 0; y < H; y++) {
      for (x = 0; x < W; x++) {
        var t;
        if (g.paused) t = 0;
        else if (over && y >= H - curtain) t = B.T(g.result === 'clear' ? 'BK_C' : 'BK_G');
        else t = cellTile(y + HID, x);
        put(FX + x, FY + y, t);
      }
    }
    if (g.paused) text(FX + 2, FY + 9, 'PAUSE');
    if (over && curtain >= H) {
      text(FX, FY + 7, '          ');
      text(FX + 1, FY + 8, g.result === 'clear' ? 'COMPLETE' : 'GAME OVER');
      text(FX, FY + 9, '          ');
      text(FX, FY + 11, '          ');
      text(FX, FY + 12, 'PUSH START');
      text(FX, FY + 13, '          ');
    }
    preview(4, 8, g.paused ? null : g.hold);
    for (var i = 0; i < 3; i++) preview(24, 8 + i * 4, g.paused ? null : g.next[i]);
    text(2, 12, num(g.score, 7));
    text(2, 16, num(g.level, 2));
    text(2, 20, num(g.lines, 3));
    if (g.gameMode === 'marathon') text(2, 24, g.lines >= GOAL_LINES ? 'CLEAR!' : num(GOAL_LINES - g.lines, 3) + '   ');
    else {
      var n = Math.floor((RISE[g.level - 1] - g.riseT) * 6 / RISE[g.level - 1]);
      for (x = 0; x < 6; x++) put(2 + x, 24, B.T(x < n ? 'BAR1' : 'BAR0'));
    }
    text(24, 22, num(Math.max(g.best, g.score), 6));
    var pop = g.popT > 0 ? g.popText : '';
    text(24, 24, (pop + '      ').substring(0, 6));
    text(24, 25, (g.popT > 0 && g.combo > 0) ? ('COMBO' + Math.min(9, g.combo)) : '      ');
  }

  function drawSprites() {
    var i, slot = 0;
    if (g.mode === 'title') {
      ppu0.sprite(8, { x: 3 * 8, y: (TITLE_ROW + g.sel * 2) * 8, tile: B.S('CURSOR'), pal: 2 });
      for (i = 0; i < 8; i++) ppu0.sprite(i, null);
      return;
    }
    ppu0.sprite(8, null);
    var p = g.cur;
    if (!p || g.paused) { for (i = 0; i < 8; i++) ppu0.sprite(i, null); return; }
    var cs = ROT[p.t][p.rot], tile = B.S(STYLE_TILE[SHAPE[p.t].st]);
    var gy = dropY(p.t, p.rot, p.x, p.y);
    g.ghostY = gy;
    var occ = {};
    for (i = 0; i < 4; i++) {
      var y = p.y + cs[i][1], x = p.x + cs[i][0];
      occ[x + ',' + y] = 1;
      if (y < HID) { ppu0.sprite(slot++, null); continue; }
      ppu0.sprite(slot++, { x: (FX + x) * 8, y: (FY + y - HID) * 8, tile: tile, pal: 0 });
    }
    for (i = 0; i < 4; i++) {
      var yy = gy + cs[i][1], xx = p.x + cs[i][0];
      if (gy === p.y || yy < HID || occ[xx + ',' + yy]) { ppu0.sprite(slot++, null); continue; }
      ppu0.sprite(slot++, { x: (FX + xx) * 8, y: (FY + yy - HID) * 8, tile: B.S('GHOST'), pal: 1 });
    }
  }

  /* ============================== 機器人（?bot=1） ============================== */
  // 每塊生成時窮舉「旋轉 × 落點」，用經典四特徵評分（總高度 / 洞 / 起伏 / 消行）選一個，
  // 然後一幀一個邊緣（按、放）把方塊轉好、移好、↑ 硬降。不開密技、不看未來塊。
  function evalField(f) {
    var x, y, agg = 0, holes = 0, bump = 0, hs = [], lines = 0;
    for (y = 0; y < ROWS; y++) { var full = true; for (x = 0; x < W; x++) if (!f[y * W + x]) { full = false; break; } if (full) lines++; }
    for (x = 0; x < W; x++) {
      var h = 0, seen = false;
      for (y = 0; y < ROWS; y++) {
        if (f[y * W + x]) { if (!seen) { h = ROWS - y; seen = true; } }
        else if (seen) holes++;
      }
      hs.push(h); agg += h;
    }
    for (x = 0; x < W - 1; x++) bump += Math.abs(hs[x] - hs[x + 1]);
    return -0.51 * agg + 0.76 * lines - 0.36 * holes * 2 - 0.18 * bump;
  }
  function botPlan(p) {
    var best = -1e9, plan = { rot: 0, x: p.x }, r, x;
    for (r = 0; r < 4; r++) {
      for (x = -2; x < W; x++) {
        if (!fits(p.t, r, x, 0) && !fits(p.t, r, x, 1)) continue;
        var y0 = fits(p.t, r, x, 1) ? 1 : 0;
        var y = dropY(p.t, r, x, y0);
        var f = new Uint8Array(g.field), c = ROT[p.t][r], i, bad = false;
        for (i = 0; i < 4; i++) { var yy = y + c[i][1]; if (yy < HID) bad = true; if (yy >= 0) f[yy * W + x + c[i][0]] = 1; }
        var s = evalField(f) - (bad ? 1000 : 0);
        if (s > best) { best = s; plan = { rot: r, x: x }; }
      }
    }
    return plan;
  }
  function bot() {
    var b = g.bot;
    b.t++;
    if (g.mode === 'title') return (b.t & 15) === 0 ? BTN.START : 0;
    if (g.sub === 'over' || g.sub === 'done') return (g.subT > 100 && !g.goal && (b.t & 15) === 0) ? BTN.START : 0;
    if (g.paused) return (b.t & 15) === 0 ? BTN.START : 0;
    var p = g.cur;
    if (!p || g.sub !== 'fall') return 0;
    if (b.id !== p.id) { var pl = botPlan(p); b.id = p.id; b.rot = pl.rot; b.x = pl.x; b.tries = 0; }
    if (b.t & 1) return 0;                       // 放開一幀，製造下一個「按下」邊緣
    if (++b.tries > 40) return BTN.UP;
    if (p.rot !== b.rot) return ((b.rot - p.rot + 4) & 3) === 3 ? BTN.B : BTN.A;
    if (p.x < b.x) return BTN.RIGHT;
    if (p.x > b.x) return BTN.LEFT;
    return BTN.UP;

  /* ============================== 密技 ============================== */

  /* ============================== 狀態 ============================== */

  /* ============================== 回合載入 ============================== */

  function walls() {
    var r, c;

    for (c = 2; c < 30; c++) put(c, 3, K.T('WT'));
    for (r = 4; r < 29; r++) { put(1, r, K.T('WL')); put(30, r, K.T('WR')); }
  }
  function bossTiles() {
    var bx = 10, by = 6, c, r, b = g.boss;
    if (!b) return;
    if (b.dead) { for (r = 0; r < 8; r++) for (c = 0; c < 12; c++) put(bx + c, by + r, 0); return; }
    for (r = 0; r < 8; r++) {
      for (c = 0; c < 12; c++) {
        var n;

        else if (r === 7) n = c === 0 ? 'K_BL' : (c === 11 ? 'K_BR' : 'K_B');
        else if (c === 0) n = r === 1 ? 'K_TL' : (r === 6 ? 'K_BL' : 'K_L');
        else if (c === 11) n = r === 1 ? 'K_TR' : (r === 6 ? 'K_BR' : 'K_R');
        else n = ((c + r) % 4 === 0) ? 'K_F2' : 'K_F';
        if (r === 0 && (c === 0 || c === 11)) n = 'SP';
        if (r === 7 && (c === 0 || c === 11)) n = 'SP';

    }

    var e = b.inv > 0 ? 'X' : b.eye, q;

  function drawRoundScreen() {

  function titleValues() {

  /* ============================== 遊戲流程 ============================== */
  function startGame(round) {
    g.score = 0; g.lives = START_LIVES; g.extraIdx = 0; g.cleared = 0; g.goal = false; g.paused = false;
    g.continues = 0; g.cheats = 0;
    rs = 0xACE1 ^ (round * 77);
    loadRound(round);
  }
  function toTitle() {
    g.mode = 'title'; g.paused = false; g.msg = '';
    CT.blank(nes0, function () { drawTitleScreen(); });
    K.Audio.stop(nes0);
    K.Audio.play(nes0, 'brick_end');
  }
  function addScore(v) {
    g.score = Math.min(999999, g.score + v);
    if (g.extraIdx < EXTRA_AT.length && g.score >= EXTRA_AT[g.extraIdx]) { g.extraIdx++; g.lives = Math.min(9, g.lives + 1); sfx('brick_1up'); }
  }
  function setPower(p) {
    g.power = p;
    g.pw = p === 'WING' ? 48 : 32;
    if (g.px + g.pw > RIGHT) g.px = RIGHT - g.pw;
    if (p !== 'GRAB' && g.stuck && g.mode === 'play') release();
  }
  function release() {
    if (!g.stuck) return;
    var b = g.stuck.ball;
    var zone = Math.max(0, Math.min(7, ((g.stuck.off + 2) * 8 / g.pw) | 0));
    b.a = ZONES[zone]; setVel(b);
    g.stuck = null;
    sfx('brick_hit');
  }
  function brickHit(c, r, laser) {
    if (c < 0 || c >= GW || r < 0 || r >= GH) return false;
    var i = cellIdx(c, r), hp = g.grid[i];
    if (!hp) return false;
    var k = g.kind[i];
    if (k === 'X') { sfx('brick_hard'); return true; }
    hp--; g.grid[i] = hp;
    if (hp > 0) { sfx('brick_hard'); putBrick(c, r); return true; }
    g.left--; g.stat.bricks++; g.lastBrickT = g.frames;
    addScore(k === 'H' ? SCORE_OF.H * g.round : SCORE_OF[k]);
    putBrick(c, r);
    sfx('brick_brk');
    maybeDrop(GX + c * CW + 4, GY + r * CH);
    if (g.left <= 0 && !g.boss) roundClear();
    void laser;
    return true;
  }
  function maybeDrop(x, y) {
    if (g.cap.on || g.balls.length > 1 || g.mode !== 'play') return;
    if ((rnd() % 100) >= DROP_PCT) return;
    var pool = [], k, tot = 0;
    for (k in CAP_W) {
      if (!Object.prototype.hasOwnProperty.call(CAP_W, k)) continue;
      if (k === g.power) continue;
      if (g.boss && (k === 'WING' || k === 'TRIO')) continue;
      if (k === 'WALL' && g.guard) continue;
      pool.push(k); tot += CAP_W[k];
    }
    var v = rnd() % tot;
    for (k = 0; k < pool.length; k++) { v -= CAP_W[pool[k]]; if (v < 0) break; }
    g.cap.on = true; g.cap.x = x; g.cap.y = y; g.cap.t = pool[Math.min(k, pool.length - 1)];
  }
  function takeCap(t) {
    g.stat.caps++;
    addScore(1000);
    sfx('brick_cap');
    if (t === 'WING' || t === 'BEAM' || t === 'GRAB') setPower(t);
    else if (t === 'TRIO') {
      setPower('');
      var src = g.balls[0];
      if (src && g.balls.length < MAX_BALLS) {
        var spd = src.s, ax = src.x >> 8, ay = src.y >> 8, aa = src.a;
        g.balls = [src, newBall(ax, ay, aa + 20, spd), newBall(ax, ay, aa - 20, spd)];
        for (var i = 1; i < 3; i++) { var b = g.balls[i]; if (b.vy >= 0) { b.a = (256 - b.a) & 255; setVel(b); } }
      }
    } else if (t === 'TIME') {
      g.speed = SPEED_MIN; g.hits = 0;
      for (var j = 0; j < g.balls.length; j++) { g.balls[j].s = SPEED_MIN; setVel(g.balls[j]); }

  function roundClear() {

    g.msg = 'SECTOR ' + num(g.round, 2) + '|BREACHED';
    K.Audio.stop(nes0); K.Audio.play(nes0, 'brick_clear');
  }
  function loseLife() {
    g.mode = 'dead'; g.t = 0; g.stat.lost++;
    g.balls = []; g.beams = []; g.fire = []; g.cap.on = false; g.stuck = null; g.power = ''; g.pw = 32;
    K.Audio.stop(nes0); sfx('brick_lose');
  }
  function saveBest() { if (g.score > g.best) { g.best = g.score; CT.save('brick', 'best', g.score); } }

  /* ============================== 球物理 ============================== */
  function solidAt(x, y) {
    // 回傳 0 = 空、1 = 磚（已處理傷害）、2 = 牆 / 魔王
    if (g.boss && !g.boss.dead && x >= 80 && x < 176 && y >= 48 && y < 112) return 3;
    if (x < GX || x >= GX + GW * CW || y < GY || y >= GY + GH * CH) return 0;
    var c = (x - GX) >> 4, r = (y - GY) >> 3;
    return g.grid[cellIdx(c, r)] ? 1 : 0;
  }
  function hitAt(x, y) {
    var s = solidAt(x, y);
    if (s === 1) { brickHit((x - GX) >> 4, (y - GY) >> 3); return true; }
    if (s === 3) { bossHit(1); return true; }
    return false;
  }
  function bossHit(dmg) {
    var b = g.boss;
    if (b.dieT) return;
    if (b.inv > 0) { sfx('brick_hard'); return; }
    b.hp -= dmg; b.inv = 24; b.hits++;
    addScore(100);
    sfx('brick_bosshit');
    g.flash = 6;
    if (b.hp <= 0) { b.hp = 0; b.dieT = 1; g.balls = []; g.fire = []; g.beams = []; g.stuck = null; addScore(10000); sfx('brick_bossdie'); K.Audio.stop(nes0); }
  }
  function speedUp() {
    g.hits++;
    if (g.hits % 6 === 0 && g.speed < SPEED_MAX) {
      g.speed = Math.min(SPEED_MAX, g.speed + 8);
      for (var i = 0; i < g.balls.length; i++) { g.balls[i].s = g.speed; setVel(g.balls[i]); }
    }
  }
  function moveBall(b) {
    var steps = 1 + (Math.max(Math.abs(b.vx), Math.abs(b.vy)) >> 9), i;
    for (i = 0; i < steps; i++) {
      var dx = ((b.vx * (i + 1) / steps) | 0) - ((b.vx * i / steps) | 0);
      var dy = ((b.vy * (i + 1) / steps) | 0) - ((b.vy * i / steps) | 0);
      // ---- x ----
      var nx = b.x + dx, px = nx >> 8, py = b.y >> 8;
      if (px < LEFT) { b.x = LEFT << 8; reflectX(b, 1); sfx('brick_wall'); }
      else if (px + 4 > RIGHT) { b.x = (RIGHT - 4) << 8; reflectX(b, -1); sfx('brick_wall'); }
      else {
        var ex = dx > 0 ? px + 3 : px;
        if (dx !== 0 && (hitAt(ex, py) || hitAt(ex, py + 3))) reflectX(b, dx > 0 ? -1 : 1);
        else b.x = nx;
      }
      if (g.mode !== 'play' || !g.balls.length || (g.boss && g.boss.dieT)) return;
      // ---- y ----
      var ny = b.y + dy;
      px = b.x >> 8; py = ny >> 8;
      if (py < TOP) { b.y = TOP << 8; reflectY(b, 1); sfx('brick_wall'); continue; }
      var ey = dy > 0 ? py + 3 : py;
      if (dy !== 0 && (hitAt(px, ey) || hitAt(px + 3, ey))) { reflectY(b, dy > 0 ? -1 : 1); }
      else {
        var oldBottom = (b.y >> 8) + 4;
        b.y = ny;
        if (dy > 0 && oldBottom <= PY && py + 4 > PY && px + 4 > g.px && px < g.px + g.pw) { paddleBounce(b); return; }
        if (dy > 0 && g.guard && oldBottom <= GUARD_Y && py + 4 > GUARD_Y) {
          b.y = (GUARD_Y - 4) << 8; reflectY(b, -1); g.guard = false; sfx('brick_hard');
        }
      }
      if (g.mode !== 'play') return;
    }
  }
  function reflectX(b, wantSign) {
    // wantSign：反射後 vx 的方向（+1 右 / -1 左）
    if ((wantSign > 0 && b.vx < 0) || (wantSign < 0 && b.vx > 0)) { b.a = (128 - b.a) & 255; setVel(b); }
  }
  function reflectY(b, wantSign) {
    if ((wantSign > 0 && b.vy < 0) || (wantSign < 0 && b.vy > 0)) { b.a = (256 - b.a) & 255; setVel(b); }
  }
  function paddleBounce(b) {
    var bx = (b.x >> 8) + 2;
    var zone = Math.max(0, Math.min(7, ((bx - g.px) * 8 / g.pw) | 0));
    b.y = (PY - 4) << 8;
    b.a = ZONES[zone]; setVel(b);
    speedUp();
    sfx('brick_hit');
    if (g.power === 'GRAB' && !g.stuck) { g.stuck = { ball: b, off: Math.max(0, Math.min(g.pw - 4, (b.x >> 8) - g.px)) }; g.catchT = 0; }
  }

  /* ============================== 更新 ============================== */
  function held(b) { return NES.Input.held(b); }
  function pressed(b) { return NES.Input.pressed(b); }

  function movePaddle() {
    var v = held(BTN.B) ? PADDLE_SLOW : PADDLE_V;
    if (held(BTN.LEFT)) g.px -= v;
    if (held(BTN.RIGHT)) g.px += v;
    if (g.px < LEFT) g.px = LEFT;
    if (g.px + g.pw > RIGHT) g.px = RIGHT - g.pw;
    if (g.stuck) { var b = g.stuck.ball; b.x = (g.px + g.stuck.off) << 8; b.y = (PY - 4) << 8; }
  }
  function updatePlay() {
    var i;
    movePaddle();
    if (g.stuck) {
      if (pressed(BTN.A) || (g.mode === 'play' && ++g.catchT > CATCH_HOLD)) { release(); g.laserCool = LASER_COOL; }
    } else if (g.power === 'BEAM' && pressed(BTN.A) && g.laserCool <= 0 && g.beams.length <= MAX_BEAMS - 2) {
      g.beams.push({ x: g.px + 2, y: PY - 8 }, { x: g.px + g.pw - 10, y: PY - 8 });
      g.laserCool = LASER_COOL; sfx('brick_laser');
    }
    if (g.laserCool > 0) g.laserCool--;
    // 球
    for (i = 0; i < g.balls.length; i++) {
      var b = g.balls[i];
      if (g.stuck && g.stuck.ball === b) continue;
      moveBall(b);
      if (g.mode !== 'play') return;
    }
    for (i = g.balls.length - 1; i >= 0; i--) if ((g.balls[i].y >> 8) >= LOST_Y) g.balls.splice(i, 1);
    if (g.stat.maxBalls < g.balls.length) g.stat.maxBalls = g.balls.length;
    if (!g.balls.length && !(g.boss && g.boss.dieT)) { loseLife(); return; }
    // 雷射
    for (i = g.beams.length - 1; i >= 0; i--) {
      var bm = g.beams[i];
      bm.y -= 6;
      var hit = bm.y < TOP || hitAt(bm.x + 3, bm.y) || hitAt(bm.x + 4, bm.y);
      if (hit) g.beams.splice(i, 1);
      if (g.mode !== 'play') return;
    }
    if (g.stat.maxBeams < g.beams.length) g.stat.maxBeams = g.beams.length;
    // 膠囊
    if (g.cap.on) {
      g.cap.y += 1;
      if (g.cap.y + 6 >= PY && g.cap.y <= PY + 6 && g.cap.x + 8 > g.px && g.cap.x < g.px + g.pw) { g.cap.on = false; takeCap(g.cap.t); }
      else if (g.cap.y >= LOST_Y) g.cap.on = false;
    }
    // 魔王
    if (g.boss) updateBoss();
  }
  function updateBoss() {
    var b = g.boss, i;
    if (b.dieT) {
      b.dieT++;
      if (b.dieT === 60) b.dead = true;
      if (b.dieT >= 150) { g.mode = 'ending'; g.t = 0; g.cleared++; if (g.cleared >= GOAL_ROUNDS) g.goal = true; saveBest(); g.msg = 'ECLIPSE BROKEN|DAWN RETURNS'; K.Audio.play(nes0, 'brick_end'); }
      return;
    }
    if (b.inv > 0) b.inv--;
    var pc = g.px + (g.pw >> 1);
    b.eye = pc < 112 ? 'L' : (pc > 144 ? 'R' : 'C');
    if (b.mouth > 0) b.mouth--;
    if (--b.fireT <= 0) {
      var phase2 = b.hp <= BOSS_HP / 2;
      b.fireT = phase2 ? 80 : 110;
      var shots = phase2 ? 2 : 1;
      for (i = 0; i < shots && g.fire.length < MAX_FIRE; i++) {
        var v = SH.aim(124, 104, pc - 4 + (shots > 1 ? (i ? 24 : -24) : 0), PY, 0x170);
        g.fire.push({ x: 124 << 8, y: 104 << 8, vx: v.vx, vy: v.vy });
      }
      b.mouth = 20; sfx('brick_fire');
    }
    for (i = g.fire.length - 1; i >= 0; i--) {
      var f = g.fire[i];
      f.x += f.vx; f.y += f.vy;
      var fx = f.x >> 8, fy = f.y >> 8;
      if (fy + 6 >= PY && fy <= PY + 5 && fx + 6 > g.px && fx + 2 < g.px + g.pw) { loseLife(); return; }
      if (fy >= LOST_Y || fx < LEFT - 8 || fx > RIGHT) g.fire.splice(i, 1);
    }
  }

  function update() {
    var st = pressed(BTN.START) && !held(BTN.SELECT);
    if (g.mode === 'title') {
      if (pressed(BTN.LEFT)) { g.startRound = g.startRound > 1 ? g.startRound - 1 : g.maxRound; sfx('brick_wall'); }
      if (pressed(BTN.RIGHT)) { g.startRound = g.startRound < g.maxRound ? g.startRound + 1 : 1; sfx('brick_wall'); }
      if (st || pressed(BTN.A)) { sfx('brick_cap'); startGame(g.startRound); }
      return;
    }
    if (st && (g.mode === 'play' || g.mode === 'ready')) {
      g.paused = !g.paused;
      if (g.paused) K.Audio.pause(nes0); else if (!K.Audio.resume(nes0)) K.Audio.play(nes0, g.boss ? 'brick_boss' : 'brick_main');   // R6：同一 row 接續
      return;
    }
    if (g.paused) return;
    g.t++;
    if (g.flash > 0) g.flash--;
    if (g.mode === 'ready') {
      g.msg = 'SECTOR ' + num(g.round, 2) + '|' + (g.boss ? K.ROUNDS[g.round - 1].name : 'ENGAGE');
      movePaddle();
      if (g.t >= 60 && (pressed(BTN.A) || g.t >= READY_AUTO)) {
        g.mode = 'play'; g.msg = ''; release();
        K.Audio.play(nes0, g.boss ? 'brick_boss' : 'brick_main');
      }
      return;
    }
    if (g.mode === 'play') { updatePlay(); return; }
    if (g.mode === 'dead') {
      if (g.t >= 90) {
        g.lives--;
        if (g.lives <= 0) { g.mode = 'over'; g.t = 0; saveBest(); g.msg = 'GAME OVER|A RETRY  B END'; K.Audio.play(nes0, 'brick_over'); }
        else { resetServe(); g.mode = 'ready'; g.t = 30; }
      }
      return;
    }
    if (g.mode === 'clear') {
      if (g.t >= 150) {
        if (g.round < K.ROUNDS.length) loadRound(g.round + 1);
        else { g.mode = 'ending'; g.t = 0; }
      }
      return;
    }
    if (g.mode === 'over') {
      if (g.t > 60 && (pressed(BTN.A) || st)) {
        g.continues++; g.score = 0; g.lives = START_LIVES; g.extraIdx = 0; g.msg = '';
        loadRound(g.round);
      } else if (g.t > 60 && pressed(BTN.B)) toTitle();
      return;
    }
    if (g.mode === 'ending') {
      if (g.t > 120 && (st || pressed(BTN.A))) toTitle();
    }
  }

  /* ============================== 精靈 ============================== */
  var lineCnt = new Uint8Array(240);
  var oamN = 0;
  function spr(x, y, tile, pal) {
    // 逐線計數保險：這顆會讓任一掃描線超過 8 個就不畫（規則上不會發生；記在 stat.dropLine）
    var yy, y0 = Math.max(0, y), y1 = Math.min(239, y + 7);
    if (oamN >= 64 || y >= 240 || y < -8) return;
    for (yy = y0; yy <= y1; yy++) if (lineCnt[yy] >= 8) { g.stat.dropLine++; return; }
    for (yy = y0; yy <= y1; yy++) lineCnt[yy]++;
    ppu0.sprite(oamN++, { x: x, y: y, tile: tile, pal: pal });
  }
  function drawSprites() {
    lineCnt.fill(0); oamN = 0;
    var i;
    if (g.mode === 'title') {
      var caps = ['WING', 'TRIO', 'BEAM', 'TIME', 'GRAB', 'LIFE', 'WALL'];
      for (i = 0; i < caps.length; i++) {
        var col = i % 3, row = (i / 3) | 0;
        spr(44 + col * 64, (21 + row * 2) * 8, K.S('CAP_' + caps[i]), 2);
      }
    } else if (!g.paused) {
      var showPaddle = g.mode === 'play' || g.mode === 'ready' || g.mode === 'clear' || (g.mode === 'dead' && (g.t & 4) && g.t < 60);
      if (showPaddle) {
        var n = g.pw >> 3, laser = g.power === 'BEAM';
        for (i = 0; i < n; i++) {
          var nm = i === 0 ? (laser ? 'P_LG' : 'P_L') : (i === n - 1 ? (laser ? 'P_RG' : 'P_R') : ((i === (n >> 1) || i === (n >> 1) - 1) ? 'P_C' : 'P_M'));
          spr(g.px + i * 8, PY, K.S(nm), 0);
        }
      }
      for (i = 0; i < g.balls.length; i++) spr(g.balls[i].x >> 8, g.balls[i].y >> 8, K.S('BALL'), 1);
      if (g.cap.on) spr(g.cap.x, g.cap.y, K.S('CAP_' + g.cap.t), 2);
      for (i = 0; i < g.beams.length; i++) spr(g.beams[i].x, g.beams[i].y, K.S('BEAM'), 3);
      for (i = 0; i < g.fire.length; i++) spr(g.fire[i].x >> 8, g.fire[i].y >> 8, K.S('FIRE'), 3);
    }
    for (i = oamN; i < 20; i++) ppu0.sprite(i, null);
  }

  /* ============================== 機器人 ============================== */
  var AIMS = [0, -6, 6, -11, 11, -3, 3, -14, 14];
  function predictX(b) {
    var x = (b.x >> 8), y = (b.y >> 8), vx = b.vx, vy = b.vy;
    if (vy <= 0) return x;
    var t = ((PY - 4 - y) << 8) / vy, lx = (x << 8) + vx * t, lo = LEFT << 8, hi = (RIGHT - 4) << 8, span = hi - lo;
    var u = (lx - lo) % (2 * span); if (u < 0) u += 2 * span;
    lx = u > span ? 2 * span - u : u;
    return (lx + lo) >> 8;
  }
  function fold(x) {
    var lo = LEFT, span = RIGHT - 4 - LEFT, u = (x - lo) % (2 * span);
    if (u < 0) u += 2 * span;
    return lo + (u > span ? 2 * span - u : u);
  }
  // 選一個目標磚（最低的一排，同排取離落點最近；久沒打到磚就輪流換目標），
  // 再從 8 區角度表挑「打過去最接近目標」的那一區 ⇒ 回傳拍子中心相對落點的偏移
  function aimFor(landX, stale) {
    var best = -1, bestKey = 1e9, i, n = 0, list = [];
    for (i = 0; i < GW * GH; i++) if (g.grid[i] && g.kind[i] !== 'X') list.push(i);
    if (g.boss && !g.boss.dead) list.push(-1);
    if (!list.length) return 0;
    if (stale) best = list[(g.bot.pick++) % list.length];
    else {
      for (i = 0; i < list.length; i++) {
        var id = list[i];
        if (id < 0) continue;
        var cx = GX + (id % GW) * CW + 8, row = (id / GW) | 0;
        var key = (GH - row) * 1000 + Math.abs(cx - landX);
        if (key < bestKey) { bestKey = key; best = id; }
        n++;
      }
      if (best < 0) best = -1;
    }
    var tx = best < 0 ? 128 : GX + (best % GW) * CW + 8, ty = best < 0 ? 112 : GY + ((best / GW) | 0) * CH + 4;
    var bz = 4, be = 1e9, z;
    for (z = 0; z < 8; z++) {
      var vx = SH.cos(ZONES[z]), vy = SH.sin(ZONES[z]);
      var t = (ty - (PY - 4)) / vy, x = fold(landX + vx * t);
      var e = Math.abs(x - tx);
      if (e < be) { be = e; bz = z; }
    }
    return Math.round((bz + 0.5) * g.pw / 8 - g.pw / 2);
  }
  function bot() {
    var bb = g.bot; bb.t++;
    if (g.mode === 'title') return (bb.t & 15) === 0 ? BTN.START : 0;
    if (g.mode === 'over') return (bb.t & 15) === 0 ? BTN.A : 0;
    if (g.mode === 'ending') return 0;
    if (g.paused) return (bb.t & 15) === 0 ? BTN.START : 0;
    if (g.mode !== 'play' && g.mode !== 'ready') return 0;
    // 每次拍到球換一個瞄準偏移，避免永遠同一條路線；太久沒打到磚就加大偏移
    var stale = g.frames - g.lastBrickT > 600;
    if (bb.hits !== g.hits) { bb.hits = g.hits; bb.aimIdx = (bb.aimIdx + 1) % AIMS.length; bb.aimSet = false; }
    var lim = (g.pw >> 1) - 3, aim = bb.aim;
    var target = -1, best = null, i;
    for (i = 0; i < g.balls.length; i++) {
      var b = g.balls[i];
      if (g.stuck && g.stuck.ball === b) continue;
      if (b.vy > 0 && (!best || b.y > best.y)) best = b;
    }
    if (best) {
      var tFrames = ((PY - 4 - (best.y >> 8)) << 8) / best.vy;
      var land = predictX(best) + 2;
      if (!bb.aimSet && tFrames < 40) {
        bb.aim = aimFor(land, stale);
        // 卡在固定軌道時（久沒打到磚）加一點亂數偏移，跳出週期路線
        if (stale) { bb.seed = (Math.imul(bb.seed || 7, 1103515245) + 12345) & 0x7FFFFFFF; bb.aim += ((bb.seed >> 16) % (2 * lim + 1)) - lim; }
        bb.aimSet = true;
      }
      aim = bb.aimSet ? bb.aim : 0;
      if (aim > lim) aim = lim; else if (aim < -lim) aim = -lim;
      target = land - aim;
      if (g.cap.on && g.cap.y > 140 && tFrames > 60) target = g.cap.x + 4;
    } else if (g.cap.on && g.cap.y > 100) target = g.cap.x + 4;
    else if (g.balls.length) target = (g.balls[0].x >> 8) + 2 - aim;
    var mask = 0, center = g.px + (g.pw >> 1);
    // 魔王火球：預測落點壓到拍子、而且比球先到 ⇒ 先閃
    var ballT = best ? ((PY - 4 - (best.y >> 8)) << 8) / best.vy : 1e9;
    for (i = 0; i < g.fire.length; i++) {
      var f = g.fire[i];
      if (f.vy <= 0) continue;
      var ft = ((PY - (f.y >> 8)) << 8) / f.vy, fx = ((f.x + f.vx * ft) >> 8) + 4;
      if (ft < 70 && ft + 12 < ballT && Math.abs(fx - center) < (g.pw >> 1) + 10) {
        target = fx < 128 ? fx + (g.pw >> 1) + 16 : fx - (g.pw >> 1) - 16;
      }
    }
    if (target >= 0) {
      var d = target - center;
      if (d > 2) mask |= BTN.RIGHT; else if (d < -2) mask |= BTN.LEFT;
    }
    if ((g.stuck || g.power === 'BEAM') && (bb.t & 1) === 0) {
      if (!g.stuck || g.mode === 'ready' || Math.abs(target - center) <= 2 || bb.t % 40 === 0) mask |= BTN.A;
    }
    return mask;
  }

  /* ============================== 密技 ============================== */
  // 「補給艦」：命 +1（上限 9）+ 底部防護欄；挑魔王時順便讓魔王 3 秒不開火。不限次數。
  // GAME OVER 時按密技 = **原地續關**（fix-r5 §6-1）：同一回合、磚陣 / 魔王血量 / 分數全保留，
  // 命數補回開局值 + 防護欄，直接回到 READY（不算 continues、不扣分）。標題 / 結尾無效。
  function cheat() {
    if (!g || g.mode === 'title' || g.mode === 'ending') return false;
    if (g.mode === 'over') {
      g.lives = START_LIVES; g.guard = true; g.cheats++; g.msg = ''; g.paused = false;
      if (g.boss) g.boss.fireT = Math.max(g.boss.fireT, 180);
      resetServe(); g.mode = 'ready'; g.t = 30;
      K.Audio.stop(nes0); K.Audio.play(nes0, 'brick_start');
      sfx('brick_1up');
      return true;
    }
    g.lives = Math.min(9, g.lives + 1); g.guard = true; g.cheats++;
    if (g.boss) g.boss.fireT = Math.max(g.boss.fireT, 180);
    sfx('brick_1up');
    return true;
  }

  var GAME = {
    id: 'brick', order: 3, title: '星塵打磚塊', legacy: ['breakout.html'],
    init: function (nes) {
      nes0 = nes; ppu0 = nes.ppu;
      K.buildChr();
      NES.CHR.setPattern(0, K.bgBank);
      NES.CHR.setPattern(1, K.sprBank);
      ppu0.setPatternTables(0, 1);
      ppu0.spriteMode(8);
      ppu0.flicker = 'none';
      g = newState();
      K.Audio.init(nes);
      var rq = parseInt((CT.query && CT.query('round')) || '', 10);
      drawTitleScreen();
      K.Audio.play(nes, 'brick_end');
      if (rq >= 1 && rq <= K.ROUNDS.length) { g.startRound = rq; startGame(rq); }
    },
    update: function (nes) {
      g.frames++;
      update();
      K.Audio.tick(nes);
    },
    draw: function () {
      if (g.mode === 'title') titleValues();
      else {
        hud();
        if (g.boss) {
          bossTiles();
          var fl = g.flash > 0 && (g.flash & 2);
          if (fl !== g.flashOn) { ppu0.setBgPalette(3, fl ? [0x30, 0x30, 0x30] : g.rd.pal[2]); g.flashOn = fl; }
        }
      }
      flush(false);
      drawSprites();
    },
    exit: function (nes) { if (g && g.mode !== 'title') saveBest(); K.Audio.stop(nes); },   // 中途回選單也存最高分（fix-r5 P3-2）
    // 回選單收攏提示用的精靈（fix-r5 §6-4）：精靈表裡的小星、第 1 組（白）調色盤
    get backTile() { K.buildChr(); return { tile: K.S('BACK'), pal: 1 }; },
    state: function () {
      if (!g) return null;
      return {
        mode: g.mode, round: g.round, score: g.score, lives: g.lives, left: g.left, power: g.power, pw: g.pw, px: g.px,
        balls: g.balls.map(function (b) { return { x: b.x >> 8, y: b.y >> 8, a: b.a, s: b.s, vx: b.vx, vy: b.vy }; }),
        stuck: !!g.stuck, beams: g.beams.length, fire: g.fire.length, cap: g.cap.on ? { t: g.cap.t, x: g.cap.x, y: g.cap.y } : null,
        guard: g.guard, speed: g.speed, hits: g.hits, cleared: g.cleared, continues: g.continues, goal: g.goal,
        boss: g.boss ? { hp: g.boss.hp, dead: !!g.boss.dead, inv: g.boss.inv } : null, paused: g.paused, msg: g.msg,
        cheats: g.cheats, stat: g.stat, music: K.Audio.current, lastSfx: K.Audio.lastSfx, queue: queue.length - qi,
        ntWrites: ntWrites, frames: g.frames, startRound: g.startRound, maxRound: g.maxRound
      };
    },
    cheat: cheat,
    bot: function () { return g ? bot() : 0; },
    goal: function () { return !!(g && g.goal && g.cheats === 0); },
    bestText: function () { return num(Math.min(999999, CT.load('brick', 'best', 0)), 6); }   // R6 §1-6：右對齊 6 字元（超過封頂）
  };

  K.dev = {
    takeCap: function (t) { takeCap(t); },
    clearAll: function () { for (var i = 0; i < GW * GH; i++) if (g.grid[i] && g.kind[i] !== 'X') { g.grid[i] = 1; brickHit(i % GW, (i / GW) | 0); } },
    leaveOne: function () {
      var keep = -1, i;
      for (i = GW * GH - 1; i >= 0; i--) if (g.grid[i] && g.kind[i] !== 'X') { if (keep < 0) { keep = i; continue; } g.grid[i] = 0; g.left--; putBrick(i % GW, (i / GW) | 0); }
      return keep;
    },
    hitBrick: function (c, r) { return brickHit(c, r); },
    setBall: function (x, y, a, s) { g.stuck = null; g.balls = [newBall(x, y, a, s || g.speed)]; },
    setPaddle: function (x) { g.px = x; },
    launch: function () { if (g.mode === 'ready') { g.mode = 'play'; g.msg = ''; } release(); },
    bossHit: function (n) { for (var i = 0; i < n; i++) { if (g.boss) { g.boss.inv = 0; bossHit(1); } } },
    grid: function () { var out = [], r, c; for (r = 0; r < GH; r++) { var s = ''; for (c = 0; c < GW; c++) s += g.grid[cellIdx(c, r)] ? g.kind[cellIdx(c, r)] : '.'; out.push(s); } return out; },
    palOf: function (c, r) { return g.pal[cellIdx(c, r)]; },
    consts: { GW: GW, GH: GH, GX: GX, GY: GY, PY: PY, LEFT: LEFT, RIGHT: RIGHT, TOP: TOP, ZONES: ZONES, SPEED_MIN: SPEED_MIN, SPEED_MAX: SPEED_MAX, BOSS_HP: BOSS_HP, NT_LIMIT: NT_LIMIT },
    lose: function () { g.balls = []; },
    spawnCap: function (t, x, y) { g.cap.on = true; g.cap.t = t; g.cap.x = x; g.cap.y = y; },
    fireNow: function () { if (g.boss) g.boss.fireT = 1; }
  };

  if (CT.register) CT.register(GAME);
  K.GAME = GAME;
})();

</script>
<script>/* games/cart1/pinball/phys.js */
/*
 * games/cart1/pinball/phys.js — 《星塵彈珠台》桌面幾何 + 定點數物理（全域只掛 CT.Pinball.Phys）
 * ---------------------------------------------------------------------------
 * 擁有者：C5-3 cart1-arcade（R5）｜ 零相依（不碰 PPU / APU）⇒ 測試可單獨載入本檔。
 *
 * 單位：位置 / 速度一律 **Q8**（1 px = 256，速度 = 1/256 px/幀），全部整數；
 *       角度 = 1/1024 圈（0 = +x、256 = +y 向下），三角函數查表（Q8，只在載入時建表）。
 *
 * 防穿模（測試 test_pinball.py 有專項證明）：
 *   1. 每幀固定 SUB = 8 個子步；球速上限 MAXV = 9 px/幀 ⇒ 每子步位移 ≤ 1.13 px，
 *      遠小於「球半徑 + 牆半徑」(3.5 + 1 = 4.5 px) ⇒ 球心不可能一步越過任何線段。
 *   2. 擋板角度也在子步內推進（每子步 ≤ 5 單位 ≈ 1.76°），擋板尖端每子步位移 ≤ 0.6 px
 *      ⇒ 擋板掃過的距離同樣 < 接觸厚度（3.5 + 3 = 6.5 px），推出方向永遠取對的那一側。
 *   3. 推出方向 = 球心減去線段最近點（不是線段法線）⇒ 端點 / 尖端也是圓角，不會卡進縫。
 *
 * 桌面（直向 256 × 448 px，世界座標；> 一個畫面高 ⇒ 遊戲用垂直捲動 + split 狀態列）：
 *   上方拱頂 + 4 條 S T A R 滾道、3 顆保險桿（pop bumper）、左側 3 顆落下靶、
 *   中央 3 顆立靶、右側星洞（saucer）、兩組彈弓（slingshot）、引導軌、左右擋板、右側發射道。
 */
(function () {
  'use strict';
  var CT = window.CT = window.CT || {};
  var PB = CT.Pinball = CT.Pinball || {};

  var Q = 256;                       // 1 px
  var SUB = 8;                       // 每幀子步數
  var MAXV = 9 * Q;                  // 速度上限（px/幀）
  var GRAV = 20;                     // 每幀重力（Q8 px/幀²）≈ 0.078
  var BALL_R = 896;                  // 3.5 px

  /* ---------------- 三角函數表（Q8，1024 分度；只在載入時呼叫 Math.sin 建表） ---------------- */
  var SIN = new Int16Array(1024);
  (function () { for (var i = 0; i < 1024; i++) SIN[i] = Math.round(Math.sin(i * 2 * Math.PI / 1024) * 256); })();
  function sin(a) { return SIN[a & 1023]; }
  function cos(a) { return SIN[(a + 256) & 1023]; }

  // 整數平方根（floor）：Math.sqrt 只當初值，再整數修正 ⇒ 結果保證是 floor(√n)
  function isqrt(n) {
    if (n <= 0) return 0;
    var r = Math.floor(Math.sqrt(n));
    while (r * r > n) r--;
    while ((r + 1) * (r + 1) <= n) r++;
    return r;
  }
  function fdiv(a, b) { return Math.floor(a / b); }   // 整數除法（向下取整）

  /* ---------------- 擋板常數 ---------------- */
  var FL = {
    L: 18 * Q,          // 支點到尖端
    R: 3 * Q,           // 擋板半徑（膠囊）
    REST: 85,           // 靜止：往下 30°
    UP: -85,            // 舉起：往上 30°
    W_UP: 64,           // 舉起角速度（單位 / 幀）= 每子步 8（尖端每子步 0.9 px）
    W_DOWN: 16,         // 放下角速度 = 每子步 2
    E: 72               // 恢復係數 0.28（擋板吸球、好接）
  };

  /* ---------------- 桌面幾何（px；畫圖 art.js 與物理共用同一份資料） ---------------- */
  // seg: [x1,y1,x2,y2, r(px), kind]；kind: wall / sling / post / guide
  var WALLS = [
    // 外框（順時針）：左牆 → 左上斜角 → 頂 → 右上斜角 → 右牆
    [12, 448, 12, 64, 1, 'wall'],
    [12, 64, 28, 32, 1, 'wall'], [28, 32, 60, 16, 1, 'wall'],
    [60, 16, 180, 16, 1, 'wall'],
    [180, 16, 212, 32, 1, 'wall'], [212, 32, 244, 64, 1, 'wall'],
    [244, 64, 244, 448, 1, 'wall'],
    // 發射道內牆
    [228, 448, 228, 120, 1, 'wall'],
    // 下方引導軌（斜率 1:2）
    [12, 356, 92, 396, 1, 'guide'],
    [228, 356, 148, 396, 1, 'guide'],
    // 滾道分隔柱
    [60, 28, 60, 44, 2, 'post'], [92, 28, 92, 44, 2, 'post'], [124, 28, 124, 44, 2, 'post'],
    [156, 28, 156, 44, 2, 'post'], [188, 28, 188, 44, 2, 'post'],
    // 左彈弓（直邊 / 下邊 / 踢擊斜邊）
    [40, 312, 40, 348, 1, 'wall'], [40, 348, 64, 360, 1, 'wall'], [40, 312, 64, 360, 1, 'sling'],
    // 右彈弓（鏡像）
    [200, 312, 200, 348, 1, 'wall'], [200, 348, 176, 360, 1, 'wall'], [200, 312, 176, 360, 1, 'sling']
  ];
  // 保險桿（pop bumper）
  var BUMPERS = [[96, 88, 10], [144, 88, 10], [120, 128, 10]];
  // 落下靶（左側直立三片）
  var DROPS = [[20, 185, 20, 197], [20, 201, 20, 213], [20, 217, 20, 229]];
  // 立靶（中央橫向三片）
  var STANDUPS = [[92, 248, 104, 248], [114, 248, 126, 248], [136, 248, 148, 248]];
  // 星洞（saucer）
  var SAUCER = { x: 204, y: 192, r: 5 };
  // 滾道感應區（S T A R），中心 x
  var LANES = [76, 108, 140, 172];
  var LANE_Y0 = 28, LANE_Y1 = 46;
  // 擋板支點
  var FLIPPERS = [{ x: 96, y: 400, side: 1 }, { x: 144, y: 400, side: -1 }];
  // 發射道
  var PLUNGER = { x: 236, y: 436, laneX: 228, minV: 1408, maxV: 2304, maxPull: 48 };
  var DRAIN_Y = 452;

  function mkSeg(a, kind) {
    var s = { x1: a[0] * Q, y1: a[1] * Q, x2: a[2] * Q, y2: a[3] * Q, r: a[4] * Q, kind: kind || a[5] || 'wall',
              on: true, id: 0, e: 112, kick: 0 };
    s.dx = s.x2 - s.x1; s.dy = s.y2 - s.y1; s.len2 = s.dx * s.dx + s.dy * s.dy;
    if (s.kind === 'sling') { s.e = 160; s.kick = 640; }
    if (s.kind === 'post') s.e = 128;
    if (s.kind === 'drop' || s.kind === 'standup') s.e = 96;
    return s;
  }

  function buildShapes() {
    var segs = [], i, s;
    for (i = 0; i < WALLS.length; i++) { s = mkSeg(WALLS[i]); s.id = i; segs.push(s); }
    for (i = 0; i < DROPS.length; i++) { s = mkSeg(DROPS[i].concat([2]), 'drop'); s.id = i; segs.push(s); }
    for (i = 0; i < STANDUPS.length; i++) { s = mkSeg(STANDUPS[i].concat([2]), 'standup'); s.id = i; segs.push(s); }
    var circs = [];
    for (i = 0; i < BUMPERS.length; i++) {
      circs.push({ x: BUMPERS[i][0] * Q, y: BUMPERS[i][1] * Q, r: BUMPERS[i][2] * Q, kind: 'bumper', id: i, on: true });
    }
    return { segs: segs, circs: circs };
  }

  /* ---------------- 擋板 ---------------- */
  function newFlipper(def) {
    return { px: def.x * Q, py: def.y * Q, side: def.side, a: FL.REST, w: 0, held: false };
  }
  // 尖端座標（Q8）
  function flipTip(f, out) {
    out = out || {};
    out.x = f.px + f.side * fdiv(FL.L * cos(f.a), 256);
    out.y = f.py + fdiv(FL.L * sin(f.a), 256);
    return out;
  }

  /* ---------------- 世界 ---------------- */
  function World() {
    var sh = buildShapes();
    this.segs = sh.segs;
    this.circs = sh.circs;
    this.flips = [newFlipper(FLIPPERS[0]), newFlipper(FLIPPERS[1])];
    this.ball = { x: PLUNGER.x * Q, y: PLUNGER.y * Q, vx: 0, vy: 0, r: BALL_R, parked: true, live: true, held: 0 };
    this.events = [];             // 本幀碰撞事件 {type, id}
    this.hitCool = {};            // 同一物件連續觸發冷卻（幀）
    this.frame = 0;
    this.maxPen = 0;              // 解算後殘留穿透量（測試用）
    this._tip = {};
  }

  World.prototype.ev = function (type, id) {
    var key = type + id;
    if (this.hitCool[key] > 0) return;
    this.hitCool[key] = 6;
    this.events.push({ type: type, id: id });
  };

  World.prototype.park = function () {
    var b = this.ball;
    b.x = PLUNGER.x * Q; b.y = PLUNGER.y * Q; b.vx = 0; b.vy = 0; b.parked = true; b.live = true; b.held = 0;
  };
  World.prototype.launch = function (pull) {
    var b = this.ball;
    if (!b.parked) return false;
    var p = Math.max(0, Math.min(PLUNGER.maxPull, pull | 0));
    b.parked = false;
    b.vx = 0;
    b.vy = -(PLUNGER.minV + fdiv((PLUNGER.maxV - PLUNGER.minV) * p, PLUNGER.maxPull));
    return true;
  };
  World.prototype.setFlip = function (i, held) { this.flips[i].held = !!held; };

  // 擋板角速度（本幀）
  function flipW(f) {
    if (f.held) return f.a > FL.UP ? -FL.W_UP : 0;
    return f.a < FL.REST ? FL.W_DOWN : 0;
  }

  // 球對線段（含半徑）碰撞；vsx/vsy = 接觸點表面速度（擋板用，其他 0）
  World.prototype.resolveSeg = function (b, x1, y1, dx, dy, len2, rad, e, kick, vsx, vsy) {
    var px = b.x - x1, py = b.y - y1;
    var t = px * dx + py * dy;
    var cx, cy;
    if (t <= 0 || len2 === 0) { cx = x1; cy = y1; }
    else if (t >= len2) { cx = x1 + dx; cy = y1 + dy; }
    else { cx = x1 + fdiv(dx * t, len2); cy = y1 + fdiv(dy * t, len2); }
    var ox = b.x - cx, oy = b.y - cy;
    var R = b.r + rad;
    var d2 = ox * ox + oy * oy;
    if (d2 >= R * R) return false;
    var d = isqrt(d2), nx, ny;
    if (d === 0) {                     // 正好壓在線上：取線段法線（往上那側）
      var L = isqrt(len2) || 1;
      nx = fdiv(-dy * 256, L); ny = fdiv(dx * 256, L);
      if (ny > 0) { nx = -nx; ny = -ny; }
    } else { nx = fdiv(ox * 256, d); ny = fdiv(oy * 256, d); }
    var pen = R - d;
    b.x += fdiv(nx * pen + 128, 256) + (nx > 0 ? 1 : (nx < 0 ? -1 : 0));
    b.y += fdiv(ny * pen + 128, 256) + (ny > 0 ? 1 : (ny < 0 ? -1 : 0));
    var rvx = b.vx - vsx, rvy = b.vy - vsy;
    var vn = fdiv(rvx * nx + rvy * ny, 256);
    if (vn < 0) {
      var j = fdiv(-(256 + e) * vn, 256);
      b.vx += fdiv(j * nx, 256);
      b.vy += fdiv(j * ny, 256);
      if (kick && vn < -96) { b.vx += fdiv(kick * nx, 256); b.vy += fdiv(kick * ny, 256); }
      // 切向小摩擦
      b.vx -= fdiv(b.vx, 1024); b.vy -= fdiv(b.vy, 1024);
    }
    return vn < -48 ? 2 : 1;           // 2 = 有力撞擊（觸發得分 / 音效）
  };

  World.prototype.resolveCirc = function (b, c) {
    var ox = b.x - c.x, oy = b.y - c.y, R = b.r + c.r;
    var d2 = ox * ox + oy * oy;
    if (d2 >= R * R) return false;
    var d = isqrt(d2) || 1;
    var nx = fdiv(ox * 256, d), ny = fdiv(oy * 256, d);
    var pen = R - d;
    b.x += fdiv(nx * pen, 256) + (nx > 0 ? 1 : -1);
    b.y += fdiv(ny * pen, 256) + (ny > 0 ? 1 : -1);
    var vn = fdiv(b.vx * nx + b.vy * ny, 256);
    if (vn < 0) {
      // pop bumper：法向分量直接換成固定踢出速度
      var kickV = 1152;
      b.vx += fdiv((kickV - vn) * nx, 256);
      b.vy += fdiv((kickV - vn) * ny, 256);
    }
    return true;
  };

  World.prototype.resolveFlip = function (b, f, w) {
    var t = flipTip(f, this._tip);
    var dx = t.x - f.px, dy = t.y - f.py;
    var len2 = dx * dx + dy * dy;
    // 先粗判（省事）
    var mx = b.x - f.px, my = b.y - f.py, lim = FL.L + FL.R + b.r + 512;
    if (mx > lim || mx < -lim || my > lim || my < -lim) return false;
    // 接觸點表面速度：v = ω × r（ω：單位/幀 → 弧度 = ω·2π/1024 ≈ ω·1608/2^18）
    var px = b.x - f.px, py = b.y - f.py;
    var tt = px * dx + py * dy, rx, ry;
    if (tt <= 0) { rx = 0; ry = 0; } else if (tt >= len2) { rx = dx; ry = dy; }
    else { rx = fdiv(dx * tt, len2); ry = fdiv(dy * tt, len2); }
    var k = w * 1608 * f.side;
    var vsx = fdiv(-ry * k, 262144), vsy = fdiv(rx * k, 262144);
    return this.resolveSeg(b, f.px, f.py, dx, dy, len2, FL.R, FL.E, 0, vsx, vsy);
  };

  // 一幀：輸入已用 setFlip 設好
  World.prototype.step = function () {
    var b = this.ball, i, k, s, r;
    this.events.length = 0;
    this.frame++;
    for (k in this.hitCool) if (this.hitCool[k] > 0) this.hitCool[k]--;
    var w0 = flipW(this.flips[0]), w1 = flipW(this.flips[1]);
    if (b.held > 0) {                  // 星洞吸住
      b.held--;
      b.vx = 0; b.vy = 0;
      if (b.held === 0) { b.vx = -640; b.vy = 384; b.y += 3 * Q; b.x -= 3 * Q; this.events.push({ type: 'eject', id: 0 }); }
      this.stepFlippers(w0, w1, true);
      return;
    }
    if (b.parked || !b.live) { this.stepFlippers(w0, w1, true); return; }
    b.vy += GRAV;
    // 速度上限
    var sp2 = b.vx * b.vx + b.vy * b.vy;
    if (sp2 > MAXV * MAXV) {
      var sp = isqrt(sp2);
      b.vx = fdiv(b.vx * MAXV, sp); b.vy = fdiv(b.vy * MAXV, sp);
    }
    var ax = 0, ay = 0, ex, ey;
    for (var n = 1; n <= SUB; n++) {
      // 擋板先轉（子步）
      this.stepFlippers(w0, w1, false);
      ex = fdiv(b.vx * n, SUB); ey = fdiv(b.vy * n, SUB);
      b.x += ex - ax; b.y += ey - ay; ax = ex; ay = ey;
      for (i = 0; i < this.segs.length; i++) {
        s = this.segs[i];
        if (!s.on) continue;
        r = this.resolveSeg(b, s.x1, s.y1, s.dx, s.dy, s.len2, s.r, s.e, s.kick, 0, 0);
        if (r) {
          if (s.kind === 'sling' && r === 2) this.ev('sling', s.id);
          else if (s.kind === 'drop') this.ev('drop', s.id);
          else if (s.kind === 'standup' && r === 2) this.ev('standup', s.id);
          else if (r === 2 && s.kind === 'wall') this.ev('wall', s.id);
          // 速度被改了 ⇒ 重算剩下子步的分配
          ax = fdiv(b.vx * n, SUB); ay = fdiv(b.vy * n, SUB);
        }
      }
      for (i = 0; i < this.circs.length; i++) {
        if (this.resolveCirc(b, this.circs[i])) {
          this.ev('bumper', i);
          ax = fdiv(b.vx * n, SUB); ay = fdiv(b.vy * n, SUB);
        }
      }
      for (i = 0; i < 2; i++) {
        if (this.resolveFlip(b, this.flips[i], i === 0 ? w0 : w1)) {
          ax = fdiv(b.vx * n, SUB); ay = fdiv(b.vy * n, SUB);
        }
      }
    }
    this.maxPen = Math.max(this.maxPen, this.penetration());
    // 感應區
    var bx = b.x >> 8, by = b.y >> 8;
    if (by >= LANE_Y0 && by <= LANE_Y1) {
      for (i = 0; i < LANES.length; i++) if (bx >= LANES[i] - 9 && bx <= LANES[i] + 9) this.ev('lane', i);
    }
    var sx = b.x - SAUCER.x * Q, sy = b.y - SAUCER.y * Q;
    if (sx * sx + sy * sy < (SAUCER.r * Q) * (SAUCER.r * Q) && !this.hitCool.saucer0) {
      b.held = 50; b.x = SAUCER.x * Q; b.y = SAUCER.y * Q; b.vx = 0; b.vy = 0;
      this.ev('saucer', 0);
      this.hitCool.saucer0 = 90;
    }
    // 發射道底部：球回到發射桿上 ⇒ 重新停靠
    if (b.x > PLUNGER.laneX * Q && b.y >= PLUNGER.y * Q && b.vy >= 0) { this.park(); this.events.push({ type: 'repark', id: 0 }); }
    if (by > DRAIN_Y) { b.live = false; this.events.push({ type: 'drain', id: 0 }); }
  };

  World.prototype.stepFlippers = function (w0, w1, whole) {
    var div = whole ? 1 : SUB;
    var f0 = this.flips[0], f1 = this.flips[1];
    f0.w = w0; f1.w = w1;
    f0.a = clampA(f0.a + fdiv(w0, div));
    f1.a = clampA(f1.a + fdiv(w1, div));
  };
  function clampA(a) { return a < FL.UP ? FL.UP : (a > FL.REST ? FL.REST : a); }

  // 殘留穿透量（Q8）：球與所有實體的最大重疊（解算後應 ≈ 0）
  World.prototype.penetration = function () {
    var b = this.ball, worst = 0, i, s, pen;
    for (i = 0; i < this.segs.length; i++) {
      s = this.segs[i];
      if (!s.on) continue;
      pen = segPen(b, s.x1, s.y1, s.dx, s.dy, s.len2, s.r);
      if (pen > worst) worst = pen;
    }
    for (i = 0; i < 2; i++) {
      var f = this.flips[i], t = flipTip(f, {});
      var dx = t.x - f.px, dy = t.y - f.py;
      pen = segPen(b, f.px, f.py, dx, dy, dx * dx + dy * dy, FL.R);
      if (pen > worst) worst = pen;
    }
    return worst;
  };
  function segPen(b, x1, y1, dx, dy, len2, rad) {
    var px = b.x - x1, py = b.y - y1, t = px * dx + py * dy, cx, cy;
    if (t <= 0) { cx = x1; cy = y1; } else if (t >= len2) { cx = x1 + dx; cy = y1 + dy; }
    else { cx = x1 + fdiv(dx * t, len2); cy = y1 + fdiv(dy * t, len2); }
    var ox = b.x - cx, oy = b.y - cy, d = isqrt(ox * ox + oy * oy), R = b.r + rad;
    return R - d;
  }

  // 球心在擋板線的哪一側（>0 = 上方 / 正常側）；測試防穿模用
  World.prototype.flipSide = function (i) {
    var f = this.flips[i], b = this.ball, t = flipTip(f, {});
    var dx = t.x - f.px, dy = t.y - f.py;
    var cr = dx * (b.y - f.py) - dy * (b.x - f.px);   // 叉積
    return -cr * f.side;
  };

  PB.Phys = {
    Q: Q, SUB: SUB, MAXV: MAXV, GRAV: GRAV, BALL_R: BALL_R, FL: FL,
    WALLS: WALLS, BUMPERS: BUMPERS, DROPS: DROPS, STANDUPS: STANDUPS, SAUCER: SAUCER,
    LANES: LANES, LANE_Y0: LANE_Y0, LANE_Y1: LANE_Y1, FLIPPERS: FLIPPERS, PLUNGER: PLUNGER, DRAIN_Y: DRAIN_Y,
    sin: sin, cos: cos, isqrt: isqrt, flipTip: flipTip,
    World: World,
    create: function () { return new World(); }
  };
})();

</script>
<script>/* games/cart1/pinball/art.js */
/*
 * games/cart1/pinball/art.js — 《星塵彈珠台》CHR 與桌面名稱表（全部原創、程式化繪製）
 * ---------------------------------------------------------------------------
 * 擁有者：C5-3 cart1-arcade（R5）｜ 依賴：engine/chr.js（NES.CHR）、pinball/phys.js（桌面幾何）
 *
 * 作法：用 phys.js 的同一份幾何資料，把整張桌面（256 × 448）「畫」進 2bpp 像素緩衝，
 *       再切成 8×8 磚並去重 ⇒ 背景圖樣表（pinball_bg，≤ 256 磚）+ 名稱表 / 屬性表。
 *       物理線段與畫面線條同源 ⇒ 看到的牆就是撞到的牆。
 *   燈號（S T A R 滾道 / 倍率 / SAVE / 落下靶 / 立靶 / 星洞）各自佔用不共用的磚格：
 *       桌面畫兩次（全滅 / 全亮），每顆燈記下自己的磚格與「亮 / 滅」兩組磚 ⇒ 開關燈只寫幾個 byte。
 *   擋板 8 個角度影格（3×3 磚）、球、發射桿、標題大字 → 精靈 / 背景磚。
 *
 * 2bpp 色義（背景）：1 = 暗部 / 填色，2 = 主色，3 = 亮部。精靈同。
 * 背景調色盤組：0 桌框（藍）、1 保險桿 / 彈弓（紅）、2 燈號（灰→黃）、3 狀態列（白）。
 */
(function () {
  'use strict';
  var NES = window.NES = window.NES || {};
  var CT = window.CT = window.CT || {};
  var PB = CT.Pinball = CT.Pinball || {};
  var CHR = NES.CHR, P = PB.Phys;

  var W = 256, H = 480, ROWS = 60, COLS = 32;
  var TABLE_ROWS = 56;               // 0..55 = 桌面；56..59 = 狀態列（下方名稱表 row 26..29）

  /* ---------------- 字型（沿用 engine/chr.js 原創 DEMO.FONT 的字身） ---------------- */
  var FONT = (CHR && CHR.DEMO && CHR.DEMO.FONT) || {};
  var CHARMAP = { ' ': 'SP', '.': 'DOT', ',': 'COMMA', ':': 'COLON', '-': 'DASH', '!': 'EXCL', '?': 'QUEST',

  (function () {
    var i;
    for (i = 0; i <= 9; i++) CHARMAP[String(i)] = 'N' + i;

    var n = CHARMAP[ch];

  function Canvas(w, h) { this.w = w; this.h = h; this.px = new Uint8Array(w * h); this.attr = new Int8Array((w >> 4) * (h >> 4)).fill(-1); }

  function dist2Seg(x, y, x1, y1, x2, y2) {

  // 點在多邊形內（偶奇規則；像素中心）

      var X = x * 2 + 1, Y = y * 2 + 1;

    }

  }
  function fillPoly(cv, pts, fn, pal) {
    var minx = 999, maxx = -1, miny = 999, maxy = -1, i;
    for (i = 0; i < pts.length; i++) {
      minx = Math.min(minx, pts[i][0]); maxx = Math.max(maxx, pts[i][0]);
      miny = Math.min(miny, pts[i][1]); maxy = Math.max(maxy, pts[i][1]);

  var DOTS = function (x, y) { return ((x & 3) === 0 && (y & 3) === 0) ? 1 : 0; };

  /* ---------------- 燈號定義（每顆燈一個矩形磚格範圍） ---------------- */
  // {id, kind, cells:[[col,row],...], draw(cv, on)}
  var LIGHTS = [];
  function light(id, draw, x0, y0, x1, y1) {
    var cells = [], c, r;
    for (r = y0 >> 3; r <= y1 >> 3; r++) for (c = x0 >> 3; c <= x1 >> 3; c++) cells.push([c, r]);
