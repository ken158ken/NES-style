    var Wd = ST.World;
    if (!Wd || !Wd.bound) return null;
    function quad(p) {
      return [
        [Wd.oam16(p + '_C0T'), Wd.oam16(p + '_C1T'), Wd.oam16(p + '_C2T'), Wd.oam16(p + '_C3T')],
        [Wd.oam16(p + '_C0B'), Wd.oam16(p + '_C1B'), Wd.oam16(p + '_C2B'), Wd.oam16(p + '_C3B')]
      ];
    }
    tiles = {
      stand: quad('W2_COL_ST'), jump: quad('W2_COL_JP'),
      wave: [Wd.oam16('W2_WAVE0'), Wd.oam16('W2_WAVE1')],
      fire: [Wd.oam16('W2_FIRE0'), Wd.oam16('W2_FIRE1')]
    };
    return tiles;
  }

  function kindAt(x, y) { return level ? level.kindAt(x, y) : 'none'; }
  function solid(x, y) { return kindAt(x, y) === 'solid'; }
  function aabb(a, b) {
    return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
  }
  function phaseOf() {
    if (Boss.hp <= 1) return 3;
    if (Boss.hp <= 3) return 2;
    return 1;
  }

  var Boss = {
    active: false, dead: false, alive: false, stompable: true, kind: 'boss',
    hp: MAX_HP, x: 0, y: 0, w: W, h: H,
    phase: 'idle', stage: 1,
    facing: -1, inv: 0, t: 0, shots: 0, frame: 0,
    hammers: shots,                       // 名字沿用 ST.Boss 的契約（main / enemies 列舉投射物用）
    MAX_HP: MAX_HP, spawnX: -1, spawnY: 0,

    init: function (lv) {
      level = lv || null;
      Boss.reset();
      if (!level || !level.boss) { Boss.spawnX = -1; return Boss; }
      Boss.spawnX = level.boss.x;
      Boss.spawnY = level.boss.y;
      return Boss;
    },

    reset: function () {
      shots.freeAll();
      Boss.active = false; Boss.dead = false; Boss.alive = false;
      Boss.hp = MAX_HP; Boss.phase = 'idle'; Boss.stage = 1; Boss.facing = -1;
      Boss.inv = 0; Boss.t = 0; Boss.shots = 0; Boss.frame = 0;
      FX.aset(vx, 0); FX.aset(vy, 0);
      return Boss;
    },

    box: function () { return Boss.active && Boss.alive ? { x: Boss.x, y: Boss.y, w: W, h: H } : null; },
    hit: function () { return Boss.stomp(); },

    spawn: function (x, y) {
      FX.vsetPx(px, x); FX.vsetPx(py, y);
      Boss.x = x | 0; Boss.y = y | 0;
      Boss.active = true; Boss.alive = true; Boss.dead = false;
      Boss.hp = MAX_HP; Boss.phase = 'walk'; Boss.stage = 1;
      Boss.t = 0; Boss.shots = 0; Boss.inv = 0;
      FX.aset(vx, 0); FX.aset(vy, 0);
      return Boss;
    },

    stomp: function () {
      if (!Boss.active || Boss.dead || Boss.inv > 0 || Boss.phase === 'falling') return false;
      Boss.hp--;
      Boss.inv = INV_FRAMES;
      FX.vsetPx(px, Boss.x + Boss.facing * -KNOCKBACK);
      Boss.x = FX.vpx(px);
      if (Boss.hp <= 0) { Boss.die(); return true; }
      Boss.stage = phaseOf();
      Boss.phase = 'rest'; Boss.t = 0;
      shots.freeAll();                    // 被踩 ⇒ 場面清乾淨（弱點窗口要看得清楚）
      return true;
    },

    die: function () {
      if (Boss.dead || Boss.phase === 'falling') return false;
      Boss.hp = 0;
      Boss.phase = 'falling';
      Boss.t = 0;
      Boss.inv = 0;
      shots.freeAll();
      FX.aset(vy, -FX.v88(2, 0));
      FX.aset(vx, 0);
      Boss.alive = false;
      return true;
    },

    shoot: function (targetX, kind) {
      var s = shots.alloc();
      if (!s) return null;
      var sx, sy;
      if (kind === 'wave') {
        sx = Boss.x + (Boss.facing < 0 ? -6 : Boss.w + 2);
        sy = Boss.y + Boss.h - 10;
        s.wave = true;
        FX.aset(s.vx, (kind === 'wave' ? 1 : 1) * 0);
      } else {
        sx = Boss.x + (Boss.facing < 0 ? -4 : Boss.w - 4);
        sy = Boss.y + 4;
        s.wave = false;
      }
      FX.vsetPx(s.px, sx); FX.vsetPx(s.py, sy);
      s.x = sx; s.y = sy; s.t = 0;
      if (s.wave) {
        s.w = 8; s.h = 10;
        FX.aset(s.vy, 0);
      } else {
        s.w = 8; s.h = 8;
        var dir = (targetX === undefined) ? Boss.facing : (targetX < Boss.x ? -1 : 1);
        FX.aset(s.vx, dir * FX.v88(1, 128));
        FX.aset(s.vy, SHOT_VY);
      }
      return s;
    },

    slamWaves: function () {
      var P = PHASE[Boss.stage], i, dirs = [-1, 1], s;
      for (i = 0; i < 2; i++) {
        s = shots.alloc();
        if (!s) continue;
        var sx = Boss.x + (dirs[i] < 0 ? -8 : Boss.w);
        var sy = Boss.y + Boss.h - 10;
        FX.vsetPx(s.px, sx); FX.vsetPx(s.py, sy);
        s.x = sx; s.y = sy; s.t = 0; s.wave = true; s.w = 8; s.h = 10;
        FX.aset(s.vx, dirs[i] * P.waveVx);
        FX.aset(s.vy, 0);
      }
      return true;
    },

    update: function (g) {
      g = g || {};
      Boss.frame++;
      var camX = (g.camX === undefined) ? camXCache : g.camX;
      camXCache = camX;
      if (g.level && g.level !== level) level = g.level;
      var hero = g.hero || null;

      if (!Boss.active && !Boss.dead && Boss.phase === 'idle' && Boss.spawnX >= 0
          && camX + 256 + ACTIVATE_AHEAD >= Boss.spawnX) {
        Boss.spawn(Boss.spawnX, Boss.spawnY);
      }
      if (!Boss.active) return Boss.phase;

      if (Boss.inv > 0) Boss.inv--;
      Boss.t++;
      var P = PHASE[Boss.stage] || PHASE[1];

      if (Boss.phase === 'falling') {
        FX.aadd(vy, GRAV);
        FX.vadd(py, vy.v);
        Boss.y = FX.vpx(py);
        if (Boss.y > WORLD_BOTTOM) {
          Boss.active = false; Boss.alive = false; Boss.dead = true; Boss.phase = 'dead';
          if (g.onDie) g.onDie('fall');
        }
        stepShots(g);
        return Boss.phase;
      }

      if (hero) Boss.facing = (hero.x < Boss.x) ? -1 : 1;

      switch (Boss.phase) {
        case 'walk':
          FX.aset(vx, Boss.facing * P.walk);
          FX.vadd(px, vx.v);
          Boss.x = FX.vpx(px);
          if (solid(Boss.facing < 0 ? Boss.x - 1 : Boss.x + Boss.w, Boss.y + 8)) {
            FX.vsetPx(px, Boss.x - Boss.facing);
            Boss.x = FX.vpx(px);
          }
          landed();
          if (Boss.t >= P.walkFrames) { Boss.phase = 'jump'; Boss.t = 0; FX.aset(vy, JUMP_VY); }
          break;
        case 'jump':
          FX.aset(vx, Boss.facing * (P.walk >> 1));
          FX.vadd(px, vx.v);
          Boss.x = FX.vpx(px);
          if (landed()) {
            Boss.phase = 'slam'; Boss.t = 0;
            Boss.slamWaves();
            if (g.onSlam) g.onSlam();
            if (g.sfx) g.sfx('bump');
          }
          break;
        case 'slam':
          FX.aset(vx, 0);
          landed();
          if (Boss.t >= P.slam) {
            if (P.spit > 0) { Boss.phase = 'spit'; Boss.t = 0; Boss.shots = 0; }
            else { Boss.phase = 'rest'; Boss.t = 0; }
          }
          break;
        case 'spit':
          FX.aset(vx, 0);
          landed();
          if (Boss.shots < P.spit && (Boss.t - 1) % SPIT_GAP === 0) {
            Boss.shoot(hero ? hero.x : undefined, 'fire');
            Boss.shots++;
          }
          if (Boss.shots >= P.spit && Boss.t >= P.spit * SPIT_GAP) { Boss.phase = 'rest'; Boss.t = 0; }
          break;
        case 'rest':
          FX.aset(vx, 0);
          landed();
          if (Boss.t >= P.rest) { Boss.phase = 'walk'; Boss.t = 0; }
          break;
        default:
          break;
      }

      stepShots(g);

      if (hero && (g.onStomp || g.onHurt)) {
        var hb = { x: hero.x, y: hero.y, w: hero.w || 12, h: hero.h || 22 };
        if (aabb(hb, Boss)) {
          var falling = (hero.vy === undefined) ? true : (hero.vy > 0);
          var footIn = (hb.y + hb.h) - Boss.y <= 12;
          if (falling && footIn) {
            if (Boss.inv <= 0) { Boss.stomp(); if (g.onStomp) g.onStomp(Boss); }
          } else if (!(hero.inv > 0)) {
            if (hero.star) { /* 無敵星撞不死魔王，只是不受傷 */ }
            else if (g.onHurt) g.onHurt(Boss);
          }
        }
        shots.each(function (s) {
          if (!aabb(hb, s)) return;
          if (hero.star) { s.alive = false; return; }
          s.alive = false;
          if (!(hero.inv > 0) && g.onHurt) g.onHurt(s);
        });
      }
      return Boss.phase;
    },

    draw: function (oam) {
      if (!oam || !oam.add) return 0;
      var T = ensureTiles();
      if (!T) return 0;
      var n = 0, cam = camXCache, i;
      if (Boss.active) {
        if (!(Boss.inv > 0 && (Boss.frame & 4))) {
          var art = (Boss.phase === 'jump' || Boss.phase === 'falling' || Boss.phase === 'slam') ? T.jump : T.stand;
          var bx = Boss.x - 2 - cam, by = Boss.y - 2;
          var flip = Boss.facing > 0;
          for (i = 0; i < 4; i++) {
            var col = flip ? (3 - i) : i;
            oam.add({ x: bx + i * 8, y: by, tile: art[0][col], pal: 2, prio: 3, flipH: flip });
            oam.add({ x: bx + i * 8, y: by + 16, tile: art[1][col], pal: 2, prio: 3, flipH: flip });
            n += 2;
          }
        }
      }
      shots.each(function (s) {
        var t = s.wave ? T.wave[(s.t >> 2) & 1] : T.fire[(s.t >> 2) & 1];
        oam.add({ x: s.x - cam, y: s.y, tile: t, pal: 2, prio: 2 });
        n++;
      });
      return n;
    },

    state: function () {
      var list = [];
      shots.each(function (s) { list.push({ x: s.x, y: s.y, wave: s.wave, vx: s.vx.v, vy: s.vy.v }); });
      return {
        active: Boss.active, dead: Boss.dead, hp: Boss.hp, phase: Boss.phase, stage: Boss.stage,
        x: Boss.x, y: Boss.y, inv: Boss.inv, t: Boss.t, facing: Boss.facing, shots: list
      };
    },

    CONST: {
      W: W, H: H, MAX_HP: MAX_HP, INV_FRAMES: INV_FRAMES, KNOCKBACK: KNOCKBACK,
      JUMP_VY: JUMP_VY, PHASE: PHASE, SPIT_GAP: SPIT_GAP, SHOT_N: SHOT_N
    }
  };

  function landed() {
    FX.aadd(vy, GRAV);
    if (vy.v > MAXFALL) FX.aset(vy, MAXFALL);
    var prevBottom = Boss.y + Boss.h;
    FX.vadd(py, vy.v);
    var ny = FX.vpx(py), foot = ny + Boss.h, on = false;
    if (vy.v >= 0) {
      var k1 = kindAt(Boss.x + 4, foot), k2 = kindAt(Boss.x + Boss.w - 4, foot);
      var hit1 = k1 === 'solid' || (k1 === 'oneway' && prevBottom <= ((foot >> 3) << 3));
      var hit2 = k2 === 'solid' || (k2 === 'oneway' && prevBottom <= ((foot >> 3) << 3));
      if (hit1 || hit2) {
        ny = ((foot >> 3) << 3) - Boss.h;
        FX.vsetPx(py, ny); FX.aset(vy, 0); on = true;
      }
    }
    Boss.y = ny;
    if (!on && Boss.y > 30 * 8 - Boss.h - 8 && Boss.phase !== 'falling') Boss.die();
    return on;
  }

  function stepShots(g) {
    shots.each(function (s) {
      s.t++;
      if (s.wave) {
        FX.vadd(s.px, s.vx.v);
        s.x = FX.vpx(s.px);
        // 衝擊波貼著地面走：腳下沒地板 / 前方有牆就消失
        var below = kindAt(s.x + 4, s.y + s.h + 2);
        if (below !== 'solid' && below !== 'oneway') s.alive = false;
        else if (solid(s.vx.v < 0 ? s.x - 1 : s.x + s.w, s.y + 4)) s.alive = false;
      } else {
        FX.aadd(s.vy, SHOT_G);
        FX.vadd(s.px, s.vx.v);
        FX.vadd(s.py, s.vy.v);
        s.x = FX.vpx(s.px); s.y = FX.vpx(s.py);
        if (solid(s.x + 4, s.y + s.h)) s.alive = false;
      }
      if (s.y > WORLD_BOTTOM || s.x < camXCache - 40 || s.x > camXCache + 296) s.alive = false;
    });
  }

  ST.BossW2 = Boss;
})();

</script>
<script>/* games/star/objects_w2.js */
/*
 * games/star/objects_w2.js — 《星塵勇者》世界 2 的「關卡機關」（ST.Objects）
 * ---------------------------------------------------------------------------
 * 擁有者：star-w2 agent ｜ 依賴：engine/fixed.js（NES.FX）、chr_w2.js、levels_w1.js（ST.TILE）
 * 契約：docs/TASKS.md「R3 star W2」
 *
 * 四種機關**全部寫在關卡資料裡**（`ST.LEVELS['2-x'].movers / geysers / items` 與磚語意
 * `TILE.CRUMBLE` / `TILE.SPRING`），本檔只負責推進與碰撞，沒有任何一關的座標被硬編碼。
 *
 *   ① mover   礦車升降板  `{c, r, w, axis:'x'|'y', range, period, phase}`
 *              位置是**時間的純函式**（三角波）⇒ 可預測、可重現，通關機器人能往前推演。
 *              單向平台語意：只從上方擋，下方可穿過；站上去會被水平帶著走。
 *   ② crumble 崩塌礦石磚  磚語意 `TILE.CRUMBLE`：踩住 HOLD 幀後碎掉，BACK 幀後復原。
 *   ③ spring  蒸氣彈簧    磚語意 `TILE.SPRING`：站上去立刻彈飛（按住 A 彈更高）。
 *   ④ geyser  熔岩間歇泉  `{c, r, h, period, on, phase}`：週期性噴火柱，也是時間的純函式。
 *   ⑤ item    星塵（無敵星）`{c, r, kind:'star'}`：吃到 → `hero.star` 旗標（熔岩 / 尖刺 / 坑
 *              都不再致命，撞到敵人直接打倒），順便收掉 R2c fix5「一鍵無敵擋不住熔岩」。
 *
 * ── main.js 的用法 ────────────────────────────────────────────────────────
 *   ST.Objects.init(level, { setTile: fn });    // 換關
 *   ST.Objects.seek(camX);                      // 檢查點復活
 *   ST.Objects.update(g);                       // 每幀（Hero.update 之後）
 *   ST.Objects.draw(oam, g);
 *
 * ── 給通關機器人的純函式（tools/playthrough_star.py）────────────────────
 *   ST.Objects.now()            目前絕對幀
 *   ST.Objects.moverTops(t)     第 t 幀所有升降板的 {x0, x1, top}
 *   ST.Objects.hazardHit(x, y, w, h, t)   第 t 幀 (x,y,w,h) 是否碰到火柱
 */
(function () {
  'use strict';
  var ST = window.ST = window.ST || {};
  var NES = window.NES = window.NES || {};
  var FX = NES.FX;
  if (!FX) throw new Error('games/star/objects_w2.js 需要 engine/fixed.js');
  var SMB = FX.SMB;

  var CRUMBLE_HOLD = 36;       // 踩住 36 幀（0.6 s）才碎 —— 跑過去（2.5 px/幀）完全來得及
  var CRUMBLE_SHAKE = 12;      // 最後 12 幀開始抖（視覺預警，研究 04 §2 的「預警幀」）
  var CRUMBLE_BACK = 240;      // 碎掉 4 秒後復原
  // 彈簧初速 −5 px/幀 ＋ Hero.LAUNCH_SEG 的 0.125 px/幀² ⇒ 彈高 100 px（12.5 格），
  // 比全速跑跳（80 px）高一截，一眼看得出「這是機關不是跳躍」。
  var SPRING_VY = -FX.v88(5, 0);
  var STAR_FRAMES = 480;       // 無敵星 8 秒（與 song.js 的 invincible 約 8 s 對齊）
  var ITEM_BOB = 32;           // 道具上下浮動週期
  var GEYSER_WARN = 24;        // 噴發前 24 幀的預警（只畫，不傷人）

  var level = null, setTileFn = null;
  var movers = [], geysers = [], items = [];
  var crumbles = {};           // key = col*32+row → {c, r, t, broken, back}
  var broken = [];             // 待復原清單
  var tiles = null, camXCache = 0;

  function T() { return ST.TILE; }

  /* ------------------------------------------------ 三角波（時間 → 位移，純函式） */
  function tri(t, period) {
    var half = period >> 1;
    var u = ((t % period) + period) % period;
    return u < half ? u : (period - u);
  }
  function moverPos(m, t) {
    var half = m.period >> 1;
    var d = ((tri(t + m.phase, m.period) * m.range) / half) | 0;
    if (m.axis === 'y') return { x: m.x0, y: m.y0 + d };
    return { x: m.x0 + d, y: m.y0 };
  }
  function moverBox(m, t) {
    var p = moverPos(m, t);
    return { x: p.x, y: p.y, w: m.w * 8, h: 8 };
  }
  function geyserOn(gy, t) {
    var u = (((t + gy.phase) % gy.period) + gy.period) % gy.period;
    return u < gy.on;
  }
  function geyserWarm(gy, t) {
    var u = (((t + gy.phase) % gy.period) + gy.period) % gy.period;
    return u >= gy.period - GEYSER_WARN;
  }
  function geyserBox(gy) {
    return { x: gy.c * 8, y: (gy.r - gy.h + 1) * 8, w: 8, h: gy.h * 8 };
  }

  function aabb(a, b) {
    return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
  }

  /* ------------------------------------------------------------------ CHR */
  function ensureTiles() {
    if (tiles) return tiles;
    var W = ST.World;
    if (!W || !W.bound) return null;
    tiles = {
      lift: W.oam16('W2_LIFT_M'),
      flame: [W.oam16('W2_FLAME0'), W.oam16('W2_FLAME1')],
      star: [[W.oam16('W_STAR0_L'), W.oam16('W_STAR0_R')], [W.oam16('W_STAR1_L'), W.oam16('W_STAR1_R')]]
    };
    return tiles;
  }

  /* ------------------------------------------------------------------ init */
  function init(lv, opts) {
    opts = opts || {};
    level = lv || null;
    setTileFn = opts.setTile || null;
    tiles = null;
    Objects.frame = 0;
    movers = []; geysers = []; items = [];
    crumbles = {}; broken = [];
    if (!level) return Objects;
    var i, m, src;
    src = level.movers || [];
    for (i = 0; i < src.length; i++) {
      m = src[i];
      movers.push({
        x0: (m.x === undefined ? m.c * 8 : m.x) | 0,
        y0: (m.y === undefined ? m.r * 8 : m.y) | 0,
        w: m.w || 4, axis: m.axis === 'y' ? 'y' : 'x',
        range: m.range | 0, period: (m.period | 0) || 128, phase: m.phase | 0,
        c: m.c, r: m.r
      });
    }
    src = level.geysers || [];
    for (i = 0; i < src.length; i++) {
      m = src[i];
      geysers.push({
        c: m.c | 0, r: m.r | 0, h: (m.h | 0) || 3,
        period: (m.period | 0) || 150, on: (m.on | 0) || 60, phase: m.phase | 0
      });
    }
    src = level.items || [];
    for (i = 0; i < src.length; i++) {
      m = src[i];
      items.push({ c: m.c | 0, r: m.r | 0, kind: m.kind || 'star', taken: false, x: m.c * 8, y: m.r * 8 });
    }
    return Objects;
  }

  function reset() {
    var i;
    restoreAll();
    crumbles = {}; broken = [];
    for (i = 0; i < items.length; i++) items[i].taken = false;
    Objects.frame = 0;
    return Objects;
  }
  function seek(camX) {
    restoreAll();
    crumbles = {}; broken = [];
    var i;
    for (i = 0; i < items.length; i++) if (items[i].x >= camX) items[i].taken = false;
    return Objects;
  }
  function restoreAll() {
    var i, b;
    for (i = 0; i < broken.length; i++) {
      b = broken[i];
      if (setTileFn) setTileFn(b.c, b.r, T().CRUMBLE);
    }
    broken.length = 0;
  }

  /* ---------------------------------------------------------------- update */
  function update(g) {
    g = g || {};
    Objects.frame++;
    var t = Objects.frame;
    var h = g.hero || null;
    if (g.camX !== undefined) camXCache = g.camX;
    if (g.level && g.level !== level) level = g.level;

    stepBroken(t);
    if (!h || h.state === 'dead') return Objects;

    var hh = (h.h === undefined) ? 22 : h.h;
    var hb = { x: h.x, y: h.y, w: h.w || 12, h: hh };

    ride(h, hb, hh, t, g);
    stepCrumble(h, hh, t, g);
    stepSpring(h, hh, g);
    stepGeyser(h, hb, t, g);
    stepItems(h, hb, t, g);
    return Objects;
  }

  // ---- ① 升降板：只從上方擋，站上去被帶著走 -----------------------------
  function ride(h, hb, hh, t, g) {
    var i, m, now, prev, feet = h.y + hh, top, ptop;
    h.onMover = null;
    for (i = 0; i < movers.length; i++) {
      m = movers[i];
      now = moverBox(m, t);
      prev = moverBox(m, t - 1);
      top = now.y; ptop = prev.y;
      if (h.x + hb.w <= now.x || h.x >= now.x + now.w) continue;      // 水平沒重疊
      if (h.vy < 0) continue;                                          // 上升中一律穿過
      if (h.prevFeet > ptop + 3) continue;                             // 上一幀腳已經在板子下面
      if (feet < top - 1 || feet > top + 10) continue;                 // 不在落腳範圍
      FX.vsetPx(h.py, top - hh);
      FX.aset(h.vyA, 0);
      h.onGround = true;
      h.onMover = m;
      // 水平帶動（垂直板 dx = 0）
      var dx = now.x - prev.x;
      if (dx) {
        FX.vadd(h.px, dx * 256);
        h.x = FX.floorPx(h.px.sub);
        if (h.x < 0) { h.x = 0; FX.vsetPx(h.px, 0); }
      }
      h.y = FX.floorPx(h.py.sub);
      h.prevFeet = h.y + hh;
      if (g && g.onRide) g.onRide(m);
      return true;
    }
    return false;
  }

  // ---- ② 崩塌礦石磚 -----------------------------------------------------
  function stepCrumble(h, hh, t, g) {
    var frow = (h.y + hh) >> 3, c, key, st;
    var c0 = h.x >> 3, c1 = (h.x + (h.w || 12) - 1) >> 3;
    var touched = {};
    if (h.onGround && !h.onMover) {
      for (c = c0; c <= c1; c++) {
        if (!level || level.tileAt(c, frow) !== T().CRUMBLE) continue;
        key = c * 32 + frow;
        touched[key] = 1;
        st = crumbles[key];
        if (!st) st = crumbles[key] = { c: c, r: frow, t: 0 };
        st.t++;
        if (st.t >= CRUMBLE_HOLD) {
          if (setTileFn) setTileFn(c, frow, T().EMPTY);
          broken.push({ c: c, r: frow, at: t + CRUMBLE_BACK });
          delete crumbles[key];
          if (g && g.sfx) g.sfx('bump');
        }
      }
    }
    for (key in crumbles) {                      // 離開的磚慢慢回復（不是瞬間歸零）
      if (touched[key]) continue;
      st = crumbles[key];
      st.t -= 2;
      if (st.t <= 0) delete crumbles[key];
    }
  }
  function stepBroken(t) {
    var i, b;
    for (i = broken.length - 1; i >= 0; i--) {
      b = broken[i];
      if (t < b.at) continue;
      if (setTileFn) setTileFn(b.c, b.r, T().CRUMBLE);
      broken.splice(i, 1);
    }
  }

  // ---- ③ 蒸氣彈簧 -------------------------------------------------------
  function stepSpring(h, hh, g) {
    if (!h.onGround || h.onMover || !level) return false;
    var frow = (h.y + hh) >> 3;
    var c0 = h.x >> 3, c1 = (h.x + (h.w || 12) - 1) >> 3, c;
    for (c = c0; c <= c1; c++) {
      if (level.tileAt(c, frow) !== T().SPRING) continue;
      if (ST.Hero && ST.Hero.launch) ST.Hero.launch(h, SPRING_VY);
      else { SMB.jumpStart(h.jumpS, FX.abs(h.vxA.v), h.py.sub); FX.aset(h.vyA, SPRING_VY); }
      h.onGround = false;
      Objects.springs++;
      if (g && g.sfx) g.sfx('jump');
      return true;
    }
    return false;
  }

  // ---- ④ 熔岩間歇泉 -----------------------------------------------------
  function stepGeyser(h, hb, t, g) {
    var i, gy, box;
    for (i = 0; i < geysers.length; i++) {
      gy = geysers[i];
      if (!geyserOn(gy, t)) continue;
      box = geyserBox(gy);
      if (!aabb(hb, box)) continue;
      if (h.star > 0) return false;                 // 無敵星：火柱無效
      if (ST.Hero && ST.Hero.hurt) ST.Hero.hurt(h, g, box.x);
      return true;
    }
    return false;
  }

  // ---- ⑤ 道具（星塵） ---------------------------------------------------
  function stepItems(h, hb, t, g) {
    var i, it, box;
    for (i = 0; i < items.length; i++) {
      it = items[i];
      if (it.taken) continue;
      box = { x: it.x, y: it.y + bob(t), w: 16, h: 16 };
      if (!aabb(hb, box)) continue;
      it.taken = true;
      Objects.picked++;
      if (g && g.onItem) g.onItem(it);
      return true;
    }
    return false;
  }
  function bob(t) { return ((tri(t, ITEM_BOB) * 4) / (ITEM_BOB >> 1)) | 0; }

  /* ------------------------------------------------------------------ draw */
  function draw(oam, g) {
    if (!oam || !oam.add) return 0;
    var A = ensureTiles();
    if (!A) return 0;
    var t = Objects.frame, cam = (g && g.camX !== undefined) ? g.camX : camXCache;
    var n = 0, i, j, m, box, gy, it;
    for (i = 0; i < movers.length; i++) {
      m = movers[i];
      box = moverBox(m, t);
      if (box.x + box.w < cam - 16 || box.x > cam + 272) continue;
      for (j = 0; j < m.w; j++) {
        oam.add({ x: box.x + j * 8 - cam, y: box.y, tile: A.lift, pal: 3, prio: 2 });
        n++;
      }
    }
    for (i = 0; i < geysers.length; i++) {
      gy = geysers[i];
      var on = geyserOn(gy, t), warm = geyserWarm(gy, t);
      if (!on && !warm) continue;
      var x = gy.c * 8;
      if (x + 8 < cam - 16 || x > cam + 272) continue;
      var rows = on ? gy.h : 1;                       // 預警只冒一小節
      var art = A.flame[(t >> 2) & 1];
      for (j = 0; j < rows; j += 2) {
        oam.add({ x: x - cam, y: (gy.r - j) * 8 - 8, tile: art, pal: 2, prio: 2 });
        n++;
      }
    }
    for (i = 0; i < items.length; i++) {
      it = items[i];
      if (it.taken) continue;
      if (it.x + 16 < cam - 16 || it.x > cam + 272) continue;
      var pair = A.star[(t >> 3) & 1], y = it.y + bob(t);
      oam.add({ x: it.x - cam, y: y, tile: pair[0], pal: 1, prio: 2 });
      oam.add({ x: it.x + 8 - cam, y: y, tile: pair[1], pal: 1, prio: 2 });
      n += 2;
    }
    return n;
  }

  /* ------------------------------------------- 給機器人 / 測試的純函式 API */
  function moverTops(t) {
    var out = [], i, b;
    for (i = 0; i < movers.length; i++) {
      b = moverBox(movers[i], t);
      out.push({ x0: b.x, x1: b.x + b.w, top: b.y, axis: movers[i].axis });
    }
    return out;
  }
  function hazardHit(x, y, w, h, t) {
    var i, gy, box, a = { x: x, y: y, w: w, h: h };
    for (i = 0; i < geysers.length; i++) {
      gy = geysers[i];
      if (!geyserOn(gy, t)) continue;
      box = geyserBox(gy);
      if (aabb(a, box)) return true;
    }
    return false;
  }

  var Objects = {
    frame: 0, springs: 0, picked: 0,
    CRUMBLE_HOLD: CRUMBLE_HOLD, CRUMBLE_SHAKE: CRUMBLE_SHAKE, CRUMBLE_BACK: CRUMBLE_BACK,
    SPRING_VY: SPRING_VY, STAR_FRAMES: STAR_FRAMES, GEYSER_WARN: GEYSER_WARN,
    init: init, reset: reset, seek: seek, update: update, draw: draw,
    now: function () { return Objects.frame; },
    moverTops: moverTops, hazardHit: hazardHit,
    moverBox: moverBox, geyserOn: geyserOn, geyserBox: geyserBox,
    count: function () { return { movers: movers.length, geysers: geysers.length, items: items.length }; },
    state: function () {
      var t = Objects.frame, i, out = { frame: t, movers: [], geysers: [], items: [], broken: broken.length, crumbling: 0 };
      for (i = 0; i < movers.length; i++) out.movers.push(moverBox(movers[i], t));
      for (i = 0; i < geysers.length; i++) out.geysers.push({ c: geysers[i].c, on: geyserOn(geysers[i], t) });
      for (i = 0; i < items.length; i++) out.items.push({ c: items[i].c, r: items[i].r, kind: items[i].kind, taken: items[i].taken });
      for (i in crumbles) out.crumbling++;
      return out;
    },
    // 崩塌磚的視覺抖動（main.js 的 draw 不需要，留給測試 / 之後的粒子）
    crumbleTimer: function (c, r) { var s = crumbles[c * 32 + r]; return s ? s.t : 0; }
  };

  ST.Objects = Objects;
})();

</script>
<script>/* games/star/levels_w1.js */
/*
 * games/star/levels_w1.js — 《星塵勇者》世界 1 的四關地圖 + 磚語意
 * ---------------------------------------------------------------------------
 * 擁有者：star-world agent ｜ 依賴：engine/chr.js（間接，透過 ST.World）、engine/shmup.js（選用）
 * 契約：docs/TASKS.md「R2b §契約 關卡」
 *
 *   ST.TILE            磚語意碼（**不是** CHR 索引；同一個語意在四個主題長得不一樣）
 *   ST.solidKind(t)    → 'solid' | 'oneway' | 'hurt' | 'none' | 'slopeL' | 'slopeR'（O(1) 查表）
 *   ST.LEVELS['1-1'..'1-4']
 *       { id, cols, rows, theme, music, groundRow, safeCols,
 *         tileAt(col,row) → 語意碼（O(1)）,
 *         chrAt(col,row)  → PPU 磚索引（給 NES.SH.Scroller；需先 ST.World.bind），
 *         attrAt(c16,r16) → 調色盤組 0..3,
 *         solidAt(x,y) / kindAt(x,y)   世界像素座標的碰撞查詢,
 *         setTile(col,row,code)        執行期改地形（? 磚頂出、橋斷）,
 *         start:{x,y}, goal:{col,row}, checkpoints:[col], spawns:[{col,kind,x,y,...}],
 *         boss:{col,x,y} | null, axe:{col,row,x,y} | null, coins, enemies }
 *
 * ── 地圖資料格式 ──────────────────────────────────────────────────────────
 *   `floor` / `ceil`：**RLE 字串**（`<次數><字元>`，空白忽略），一個字元 = 一欄。
 *   `objs`：**物件表**，依序疊加（後面的蓋前面的）。兩者都是純資料，沒有亂數，可重現。
 *
 * ── 版面（列 = 8 px，共 30 列）─────────────────────────────────────────────
 *   列 0–3    HUD（`ppu.split(32)` 之前的固定區，star-hero 負責）
 *   列 4–23   遊戲空間（天空 / 洞頂 / 浮台）
 *   列 24–29  基準地面（groundRow = 24 ⇒ 地面上緣 y = 192）
 *
 * ── 設計依據 ──────────────────────────────────────────────────────────────
 *   研究 03/01 ⑦「1-1 四步教學」：安全展示 → 誘導（? 磚）→ 變奏（第一個坑是安全的）→ 結論（管子遞增）

    }

    set([TILE.CLOUD_L, TILE.CLOUD_R, TILE.BUSH, TILE.HILL_L, TILE.HILL_M, TILE.HILL_R,

  function rle(s, cols, what) {

    for (j = 0; j < s.length; j++) {
      ch = s.charAt(j);

      if (ch >= '0' && ch <= '9') { n = n * 10 + (ch.charCodeAt(0) - 48); continue; }
      k = n || 1; n = 0;
      while (k-- > 0) { if (i < cols) out[i] = ch.charCodeAt(0); i++; }
    }

      return true;

  }
  function levelSong(lv) { return songKey(lv && (lv.music || themeOf(lv)), 'ground'); }
  function bossSong(lv) { return songKey(worldOf(lv) === 2 ? 'boss2' : 'boss', 'boss'); }

  function applyPalettes(ppu, lv) {
    var th = THEMES[themeOf(lv)] || THEMES.ground;
    var backdrop = (lv && lv.backdrop !== undefined) ? lv.backdrop : th.backdrop;
    var bg = (lv && lv.bgPal) || th.bg;
    var spr = (lv && lv.sprPal) || SPR_PAL;
    var i;
    if (ST.World && typeof ST.World.applyPalettes === 'function' && !(lv && lv.bgPal)) {
      // star-world 負責 bg/spr 的第 1..3 組與底色；第 0 組（HUD / 主角）永遠由本檔決定
      try { ST.World.applyPalettes(ppu, themeOf(lv)); } catch (e) { ppu.setBackdrop(backdrop); }
      ppu.setBgPalette(0, bg[0] || th.bg[0]);
      ppu.setSprPalette(0, spr[0] || SPR_PAL[0]);
      return;
    }
    ppu.setBackdrop(backdrop);
    for (i = 0; i < 4; i++) {
      ppu.setBgPalette(i, bg[i] || th.bg[i]);
      ppu.setSprPalette(i, spr[i] || SPR_PAL[i]);
    }
  }

  function makeScroller() {
    g.scr = SH.Scroller(ppu0, {
      nt: 2, cols: g.cols, row0: TOP_ROW, rows: ROWS - TOP_ROW, ahead: SCROLL_AHEAD,
      tileAt: scrTileAt, attrAt: attrAt
    });
  }

  // 整片重畫（init / 換關 / 檢查點復活）：2400 byte，等同真機「關 rendering 時重寫名稱表」，
  // 所以暫時把 VBlank 預算計帳靜音（budget.mute，見 ENGINE_API §5）。
  function rebuildScreen() {
    var bud = nes0 && nes0.timing && nes0.timing.budget;
    var muted = bud ? bud.mute : false;
    if (bud) bud.mute = true;
    g.scr.reset(g.camX);
    g.scrLeft = g.camX >> 3;
    hudStatic(ppu0);
    hudWrite(ppu0, true);
    if (bud) bud.mute = muted;
  }

  function clampCam(x) {
    var max = g.cols * 8 - SCREEN_W;
    if (max < 0) max = 0;
    if (x > max) x = max;
    if (x < 0) x = 0;
    return x;
  }

  /* ------------------------------- HUD ------------------------------- */
  // 上方 32 線（列 0..3）；只寫「有變的格」⇒ 全部欄位同時變也只有 15 byte。
  var HUD_STATIC = [
    { row: 1, col: 1, text: 'SCORE' },
    { row: 1, col: 10, text: 'COIN' },
    { row: 1, col: 16, text: 'TIME' },
    { row: 1, col: 22, text: 'WORLD' },
    { row: 1, col: 28, text: '^x' },
    { row: 2, col: 10, text: '@x' }
  ];
  var HUD_FIELDS = [
    { key: 'score', row: 2, col: 1, len: 6 },
    { key: 'coins', row: 2, col: 12, len: 2 },
    { key: 'time', row: 2, col: 16, len: 3 },
    { key: 'world', row: 2, col: 22, len: 3 },
    { key: 'lives', row: 1, col: 30, len: 1 }
  ];

  function pad(n, w) {
    var s = String(n);
    if (s.length > w) s = s.slice(-w);
    while (s.length < w) s = '0' + s;
    return s;
  }

  function writeText(ppu, nt, col, row, str) {
    var t = ST.textTiles(bgBank, str), i;
    for (i = 0; i < t.length && col + i < 32; i++) ppu.setTile(nt, col + i, row, t[i]);
  }

  function hudStatic(ppu) {
    var r, i;
    for (r = 0; r < TOP_ROW; r++) ppu.fillTiles(0, 0, r, 32, 1, bgIndex('SP'));
    ppu.fillAttr(0, 0, 0, 16, 2, 0);          // 列 0..3 = 屬性 row16 0..1 → 調色盤 0（HUD）
    for (i = 0; i < HUD_STATIC.length; i++) {
      writeText(ppu, 0, HUD_STATIC[i].col, HUD_STATIC[i].row, HUD_STATIC[i].text);
    }
  }

  function hudReset() { g.hud = {}; }

  function hudValue(key) {
    var h = g.hero;
    switch (key) {
      case 'score': return pad(h.score, 6);
      case 'coins': return pad(h.coins, 2);
      case 'time': return pad(g.time, 3);
      case 'world': return String(g.levelId).slice(0, 3);
      case 'lives': return pad(h.lives < 0 ? 0 : (h.lives > 9 ? 9 : h.lives), 1);
    }
    return '';
  }

  // force = true 時整批重寫（換關 / init）；平常只寫與上一幀不同的字
  function hudWrite(ppu, force) {
    var i, j, f, val, old, n = 0;
    for (i = 0; i < HUD_FIELDS.length; i++) {
      f = HUD_FIELDS[i];
      val = hudValue(f.key);
      old = g.hud[f.key];
      if (!force && old === val) continue;
      var t = ST.textTiles(bgBank, val);
      for (j = 0; j < t.length && j < f.len; j++) {
        if (force || !old || old.charAt(j) !== val.charAt(j)) { ppu.setTile(0, f.col + j, f.row, t[j]); n++; }
      }
      g.hud[f.key] = val;
    }
    return n;
  }

  /* -------------------- 全屏文字（標題 / GAME OVER / 破關）-------------------- */
  // 這些字是「疊在關卡畫面上」的，所以座標一律用**螢幕欄 0..31**，寫入時才換算成
  // 名稱表座標：下段的捲動是 `ppu.split(32, {x: camX % 512, nt: 0})`，世界第 c 欄固定
  // 落在 `c & 63` ⇒ nt `(c>>5)&1` 的第 `c&31` 欄。camX 任意值（含 camX % 512 ≥ 256、
  // 文字跨兩張名稱表）都會被自動分段寫到「目前看得見的那一張」。
  // （qa2-star P1-1：舊版只寫 nt 0 的固定欄，camX 一大就看不到字。）

  // R3 star-w2：標題有了「世界選擇」（SELECT 切 WORLD 1 / 2 ＝ PLAN §4 的世界地圖簡版）
  function titleLines(world) {
    return [
      { row: 9, col: 9, text: 'STARDUST HERO' },
      { row: 11, col: 11, text: 'WORLD ' + (world || 1) },
      { row: 12, col: 7, text: '$ SELECT = WORLD' },
      { row: 14, col: 10, text: 'PRESS START' },
      { row: 17, col: 8, text: '$ 2026 ORIGINAL' },
      { row: 19, col: 5, text: 'SECRET: C KEY OR $ BTN' }      // fix5：標題也寫出一鍵密技
    ];
  }
  var TITLE = titleLines(1);
  var GAMEOVER_LINES = [
    { row: 12, col: 12, text: 'GAME OVER' },
    { row: 16, col: 10, text: 'PRESS START' },
    { row: 18, col: 7, text: 'C OR $ = CONTINUE' }        // fix5：真·一鍵續關
  ];
  // fix4：START 暫停（畫兩行）＋ 暫停中按 SELECT 的一鍵密技
  var PAUSE_LINES = [
    { row: 12, col: 13, text: 'PAUSE' },
    { row: 15, col: 8, text: 'C OR $ = SECRET' }
  ];
  var PAUSE_SECRET_LINES = [
    { row: 12, col: 13, text: 'PAUSE' },
    { row: 15, col: 8, text: 'C OR $ = SECRET' },
    { row: 18, col: 12, text: 'SECRET!' }
  ];
  // fix5：不暫停也能發動 ⇒ 遊戲進行中只疊「SECRET!」這一行（列 18，與暫停版同一列）
  var SECRET_ONLY_LINES = [
    { row: 18, col: 12, text: 'SECRET!' }
  ];
  // 破完 1-4：多一行分數（進入畫面時才算得出來，所以用函式產生）
  function winLines() {
    return [
      { row: 10, col: 9, text: 'WORLD ' + worldOf(g.lv) + ' CLEAR' },
      { row: 13, col: 11, text: 'THANK YOU' },
      { row: 16, col: 10, text: 'SCORE ' + pad(g.hero.score, 6) },
      { row: 19, col: 10, text: 'PRESS START' }
    ];
  }

  // 螢幕欄 sc（0..31）→ {nt, col}；世界欄 = (camX >> 3) + sc
  var NTP = { nt: 0, col: 0 };
  function ntOfScreenCol(sc) {
    var wc = ((g.camX >> 3) + sc) & (NT_WINDOW - 1);
    NTP.nt = (wc >> 5) & 1;
    NTP.col = wc & 31;
    return NTP;
  }

  // 文字所在的 16×16 屬性區塊：paint = true 時塗成調色盤 0（白字），否則還原成關卡的值
  function bannerAttr(ppu, lines, paint) {
    var i, j, t, sc, wc, p, r16;
    for (i = 0; i < lines.length; i++) {
      t = lines[i];
      r16 = t.row >> 1;
      for (j = 0; j < t.text.length; j++) {
        sc = t.col + j;
        if (sc < 0 || sc > 31) continue;
        wc = (g.camX >> 3) + sc;
        p = ntOfScreenCol(sc);
        ppu.setAttr(p.nt, p.col >> 1, r16, paint ? 0 : attrAt(wc >> 1, r16));
      }
    }
  }

  // 畫一組字（疊在關卡上）。整片重畫是模式切換的一次性動作 ⇒ 比照 rebuildScreen 靜音預算計帳。
  function drawBanner(ppu, lines) {
    var bud = nes0 && nes0.timing && nes0.timing.budget;
    var muted = bud ? bud.mute : false;
    if (bud) bud.mute = true;
    var i, j, t, tiles, sc, p;
    bannerAttr(ppu, lines, true);
    for (i = 0; i < lines.length; i++) {
      t = lines[i];
      tiles = ST.textTiles(bgBank, t.text);
      for (j = 0; j < tiles.length; j++) {
        sc = t.col + j;
        if (sc < 0 || sc > 31) continue;
        p = ntOfScreenCol(sc);
        ppu.setTile(p.nt, p.col, t.row, tiles[j]);
      }
    }
    if (bud) bud.mute = muted;
  }

  // 擦掉（把那幾格換回關卡原本的磚 / 屬性）
  function clearBanner(ppu, lines) {
    var bud = nes0 && nes0.timing && nes0.timing.budget;
    var muted = bud ? bud.mute : false;
    if (bud) bud.mute = true;
    var i, j, t, sc, wc, p;
    for (i = 0; i < lines.length; i++) {
      t = lines[i];
      for (j = 0; j < t.text.length; j++) {
        sc = t.col + j;
        if (sc < 0 || sc > 31) continue;
        wc = (g.camX >> 3) + sc;
        p = ntOfScreenCol(sc);
        ppu.setTile(p.nt, p.col, t.row, scrTileAt(wc, t.row));
      }
    }
    bannerAttr(ppu, lines, false);
    if (bud) bud.mute = muted;
  }

  function drawTitle(ppu) { TITLE = titleLines(g.titleWorld); drawBanner(ppu, TITLE); }
  function clearTitle(ppu) { clearBanner(ppu, TITLE); }
  // SELECT：切換世界（只重畫「WORLD n」那一行）
  function toggleTitleWorld(ppu) {
    var list = levelList(), i, worlds = [];
    for (i = 0; i < list.length; i++) {
      var w = parseInt(String(list[i]).charAt(0), 10) || 1;
      if (worlds.indexOf(w) < 0) worlds.push(w);
    }
    if (worlds.length < 2) return false;
    var at = worlds.indexOf(g.titleWorld);
    g.titleWorld = worlds[(at + 1) % worlds.length];
    clearBanner(ppu, TITLE);
    TITLE = titleLines(g.titleWorld);
    drawBanner(ppu, TITLE);
    sfx('coin');
    return true;
  }

  /* ------------------ fix4：暫停 / 一鍵密技 / 一鍵續關 ------------------
   * 使用者回饋：「多個一鍵密技好了，當然也保留舊密技，不然死到一半就玩不下去了。」
   *   暫停中 SELECT → 命補到 9 + 無敵 20 秒（不限次數，每次暫停只吃一次，避免連按重複觸發）
   *   GAME OVER 中 SELECT → 3 條命回**當前關卡的檢查點**續關（分數保留，不限次數）
   */
  // 換一組疊字（先把上一組還原成關卡原本的磚 / 屬性，再畫新的）
  function setBanner(lines) {
    if (g.banner) clearBanner(ppu0, g.banner);
    g.banner = lines || null;
    if (lines) drawBanner(ppu0, lines);
  }

  /* fix5：遊戲進行中（沒暫停）也要能疊字。
   * drawBanner / clearBanner 都吃「當下的 g.camX」，所以畫的時候把 camX 記下來，
   * 收回時用同一個 camX 還原 —— 名稱表是 64 欄的環，1 秒內鏡頭走不到 512px，
   * 那幾格仍然對應同一個世界欄 ⇒ scrTileAt / attrAt 還原 100% 正確。 */
  function withCam(cam, fn) {
    var keep = g.camX;
    g.camX = cam | 0;
    try { fn(); } finally { g.camX = keep; }
  }
  function showFloat(lines) {
    endFloat(true);
    g.floatBanner = lines;
    g.floatCam = g.camX;
    drawBanner(ppu0, lines);
  }
  /** restore = true 還原被蓋掉的磚 / 屬性；false = 只把記錄丟掉（畫面已經整片重畫過了） */
  function endFloat(restore) {
    var lines = g.floatBanner;
    if (!lines) return false;
    g.floatBanner = null;
    if (restore) withCam(g.floatCam, function () { clearBanner(ppu0, lines); });
    return true;
  }

  function pauseGame() {
    endFloat(true);                       // 進暫停前先把進行中的 SECRET! 收掉
    g.paused = true;
    g.secretMsg = 0;
    g.selectUsed = false;                 // 每次暫停重新給一次 SELECT 機會
    setBanner(PAUSE_LINES);
  }
  function unpauseGame() {
    setBanner(null);                      // 還原被文字蓋掉的地形磚 + 屬性
    g.paused = false;
    g.secretMsg = 0;
    g.hudDirty = true;
  }
  // 三個入口（暫停 SELECT / 鍵盤 C / 觸控 ★密技）共用的效果函式
  function applySecret() {
    g.secrets++;
    var h = g.hero;
    h.lives = SECRET_LIVES;
    h.inv = SECRET_INV;                   // 走現有的受傷無敵（閃爍 + hurt() 直接 return false）
    // R3 star-w2：一鍵密技也帶「無敵星」旗標 ⇒ 熔岩 / 尖刺 / 火柱 / 掉坑都擋得住
    // （收掉 R2c fix5「留給後續」第 3 條）
    h.star = SECRET_INV;
    g.starMusic = true;
    g.cheatInv = true;
    g.hudDirty = true;
    if (g.paused) setBanner(PAUSE_SECRET_LINES);   // 暫停版：PAUSE 兩行 + SECRET!
    else showFloat(SECRET_ONLY_LINES);             // 進行中：只疊 SECRET! 一行
    g.secretMsg = SECRET_MSG;
    sfx('powerup');
    audio('play', 'invincible');          // song.js 第 6 首（無敵曲），無敵結束後換回關卡曲
    return true;
  }
  function trySelectSecret() {
    if (g.selectUsed) return false;
    g.selectUsed = true;
    return applySecret();
  }
  /* ============================================ fix5：真·一鍵密技（不必暫停）
   * 使用者回饋（2026-09-20）：「電腦版也要有一鍵密技…手機跟電腦都要，盡量一鍵，比較直觀。」
   *   ① 觸控 ★密技 鍵（engine/touch.js 派發 window 的 `nes-cheat`）
   *   ② 鍵盤 C（本檔監聽 window keydown KeyC → 派發同一個事件；KeyC 不在 NES.Input 映射表）
   *   ③ 程式 / 測試（dispatchEvent(new CustomEvent('nes-cheat')) 或 NES.Touch.cheat()）
   * 事件只立旗標，真正處理在 update() 開頭 ⇒ 一定落在幀邊界上（可重現、可測試）。
   */
  function doCheat() {
    if (g.cheatCool > 0) return false;                 // 防連按（30 幀）
    if (g.mode === 'play') {                           // 含暫停中：立刻套用，不限次數
      g.cheatCool = CHEAT_COOL;
      g.cheats++; g.lastCheat = 'secret';
      applySecret();
      return true;
    }
    if (g.mode === 'gameover' && !g.won) {             // 立即 3 條命續關回檢查點（分數保留）
      g.cheatCool = CHEAT_COOL;
      g.cheats++; g.cheatContinues++; g.lastCheat = 'continue';
      continueGame();
      return true;
    }
    g.lastCheat = 'none';                              // title / dead / clear：無作用
    return false;
  }
  function requestCheat() { g.cheatReq = true; return true; }
  ST.cheat = requestCheat;                             // 測試 / 機器人可直接呼叫

  (function bindCheat() {
    if (typeof window === 'undefined' || !window.addEventListener) return;
    window.addEventListener('nes-cheat', function () { requestCheat(); }, false);
    window.addEventListener('keydown', function (e) {
      if (!e || e.repeat || e.ctrlKey || e.altKey || e.metaKey) return;
      var code = e.code || '';
      var isC = (code === 'KeyC') || (!code && (e.keyCode === 67 || String(e.key || '').toLowerCase() === 'c'));
      if (!isC) return;
      var ev = null;
      try { ev = new window.CustomEvent('nes-cheat', { detail: { source: 'key' } }); }
      catch (e2) {
        try { ev = document.createEvent('CustomEvent'); ev.initCustomEvent('nes-cheat', false, false, { source: 'key' }); }
        catch (e3) { ev = null; }
      }
      if (ev) window.dispatchEvent(ev); else requestCheat();
    }, false);
  })();

  // GAME OVER → 3 條命 + 回當前關卡的檢查點（**分數 / 金幣不清**）
  function continueGame() {
    setBanner(null);
    g.won = false;
    g.hero.lives = CONTINUE_LIVES;
    g.continues++;
    respawn();                            // 內含 rebuildScreen ⇒ 殘字被整片蓋掉
    g.cheatCool = 0;
    g.hudDirty = true;
  }

  /* ------------------------------- 音訊 ------------------------------- */
  function audio(fn, a) {
    if (ST.Audio && typeof ST.Audio[fn] === 'function') {
      try { return ST.Audio[fn](a === undefined ? nes0 : a, nes0); } catch (e) { }
    }
    return null;
  }
  function sfx(name) {
    g.lastSfx = name;
    if (ST.Audio && typeof ST.Audio.sfx === 'function') { try { ST.Audio.sfx(name, nes0); } catch (e) { } }
  }
  function musicTick() {
    if (ST.Audio && typeof ST.Audio.tick === 'function') { try { ST.Audio.tick(nes0); return; } catch (e) { } }
    if (nes0 && nes0.music && typeof nes0.music.tick === 'function') nes0.music.tick();
  }

  /* ------------------------------- 跨模組呼叫 ------------------------------- */

  // 走訪目前活著的敵人（star-world 的列舉方式尚未定案 ⇒ 支援 each / list / pool 三種）
  function eachEnemy(fn) {
    var E = ST.Enemies;
    if (!E) return 0;
    var n = 0;
    function visit(e) { if (e && e.alive !== false) { fn(e); n++; } }
    if (typeof E.each === 'function') { E.each(g, visit); return n; }
    var arr = null;
    if (typeof E.list === 'function') arr = E.list(g);
    else if (E.items) arr = E.items;
    else if (E.pool && E.pool.items) arr = E.pool.items;
    else if (g.enemies && g.enemies.items) arr = g.enemies.items;
    if (arr) { for (var i = 0; i < arr.length; i++) visit(arr[i]); }
    return n;
  }

  /* ------------------------------- 互動磚 ------------------------------- */
  function onTouch(col, row, t) {
    var T = ST.TILE, h = g.hero;
    if (t === T.COIN) {
      if (typeof g.lv.take === 'function') { try { g.lv.take(col, row); } catch (e) { } }
      if (tileAt(col, row) === T.COIN) setTileCode(col, row, T.EMPTY); else writeOneTile(col, row);
      Hero.addCoin(h, ctx, 1);
      h.score += SCORE_COIN;
      g.hudDirty = true;
      sfx('coin');
    } else if (t === T.GOAL && g.mode === 'play') {
      startPole(col);                      // R3：旗桿下滑演出（W1 留下的待辦）
    }
  }

  function onBump(col, row) {
    var T = ST.TILE, h = g.hero, t = tileAt(col, row);
    if (t === T.QBLOCK) {
      if (g.lv && typeof g.lv.hit === 'function') {
        try { g.lv.hit(col, row); } catch (e) { }
        if (tileAt(col, row) === T.QBLOCK) setTileCode(col, row, T.USED);
        else writeOneTile(col, row);
      } else {
        setTileCode(col, row, T.USED);
      }
      Hero.addCoin(h, ctx, 1);
      h.score += SCORE_COIN;
      g.pops.push({ x: col * 8, y: row * 8, t: 0 });
      g.hudDirty = true;
      sfx('coin');
    } else if (t === T.BRICK) {
      g.bump = { col: col, row: row, t: 8 };     // 頂撞震動（畫面上把該格往上挪 2 px 的粒子）
      sfx('bump');
    } else {
      sfx('bump');
    }
  }

  /* --------------------- R3 star-w2：旗桿下滑演出 ---------------------
   * W1（R2b）碰到旗桿是「瞬間 clear」，這裡補上 SMB 式的三拍：
   *   ① 抓住桿子往下滑 3 px/幀（姿勢 'pole'）② 落地 ③ 往右走 24 幀進城 → 開始結算。
   * 演出期間 `mode` 已經是 'clear'（機器人與既有測試看到的仍是 clear），
   * 只是結算（時間換分）延到演出結束才跑。
   */
  function startPole(col) {
    var h = g.hero;
    var px2 = col * 8 - 6;
    if (px2 < 0) px2 = 0;
    g.pole = { col: col, phase: 'slide', t: 0, frames: 0, endY: groundYAt(col) };
    if (h.crouch) Hero.setCrouch(h, ctx, false);
    FX.aset(h.vxA, 0); FX.aset(h.vyA, 0);
    FX.vsetPx(h.px, px2);
    h.x = px2;
    h.inv = 0; h.star = 0; h.onMover = null;
    if (h.y > g.pole.endY) { FX.vsetPx(h.py, g.pole.endY); h.y = g.pole.endY; }
    enterClear();
  }

  function stepPole() {
    var p = g.pole, h = g.hero, y, x;
    if (!p) return false;
    p.frames++;
    h.inv = 0;
    if (p.phase === 'slide') {
      h.state = 'pole';
      h.facing = 1;
      y = FX.floorPx(h.py.sub) + POLE_VY;
      if (y >= p.endY) { y = p.endY; p.phase = 'walk'; p.t = 0; sfx('bump'); }
      FX.vsetPx(h.py, y);
      h.y = y;
    } else {
      h.state = 'walk';
      h.facing = 1;
      if (++h.animTimer >= 4) { h.animTimer = 0; h.anim = (h.anim + 1) & 3; }
      x = FX.floorPx(h.px.sub) + 1;
      FX.vsetPx(h.px, x);
      h.x = x;
      if (++p.t >= POLE_WALK) { g.pole = null; h.state = 'idle'; }
    }
    stepCamera();
    streamColumns();
    return true;
  }

  /* ------------------------------- 鏡頭 ------------------------------- */
  function stepCamera() {
    var h = g.hero, want = g.camX;
    var sx = h.x - g.camX;
    if (sx > CAM_R) want = h.x - CAM_R;            // 往右推進 40% 觸發
    else if (sx < CAM_L) want = h.x - CAM_L;       // 往左回捲 25% 觸發
    want = clampCam(want);
    // 名稱表只保留最近 64 欄 ⇒ 回捲不可超過「已寫過的最左欄」
    var minCol = g.scr.next - NT_WINDOW;
    if (minCol < 0) minCol = 0;
    var minX = minCol * 8;
    if (want < minX) want = minX;
    g.camX = want;
    g.camMin = minX;
    // 主角不能被推出畫面左緣（SMB 行為）
    if (h.x < g.camX) { h.x = g.camX; FX.vsetPx(h.px, g.camX); if (h.vxA.v < 0) FX.aset(h.vxA, 0); }
  }

  // 雙向欄串流：右邊交給 NES.SH.Scroller.update()，左邊自己用 Scroller.writeColumn() 補
  function streamColumns() {
    var scr = g.scr, wrote = 0;
    wrote += scr.update(g.camX) > 0 ? 1 : 0;
    if (scr.next - NT_WINDOW > g.scrLeft) g.scrLeft = scr.next - NT_WINDOW;   // 被右邊蓋掉的舊欄
    var want = (g.camX >> 3) - 1;
    if (want < 0) want = 0;
    if (want < g.scrLeft) {
      var c = g.scrLeft - 1;
      scr.writeColumn(c);
      g.scrLeft = c;
      // 寫 c 會蓋掉 c + 64 那一欄 ⇒ 讓 Scroller 之後重寫它
      if (scr.next > c + NT_WINDOW) scr.next = c + NT_WINDOW;
      wrote++;
    }
    g.colWrites += wrote;
    return wrote;
  }

  /* ------------------------------- 模式 ------------------------------- */
  function enterClear() {
    endFloat(true);                          // fix5：收回進行中的 SECRET!
    g.secretMsg = 0;
    g.mode = 'clear';
    g.modeFrames = 0;
    g.clearTally = 0;
    g.cleared = true;
    g.hero.score += SCORE_GOAL;
    g.hudDirty = true;
    sfx('goal');
    if (g.bossMusic !== 2) audio('play', 'clear');     // 打倒魔王時已經切過 clear，別重頭再播一次
  }

  // 輸光命（won = false）與破完 W1（won = true）共用 gameover 模式，但畫**不同的字**
  function enterGameOver(won) {
    endFloat(true);                          // fix5：先還原 SECRET!（camX 還沒對齊前）
    g.secretMsg = 0;
    g.won = !!won;
    g.mode = 'gameover';
    g.modeFrames = 0;
    // 鏡頭對齊 8 px：下段 split 的 fine scroll 不為 0 時文字磚會被切半格
    g.camX = clampCam(g.camX & ~7);
    g.banner = won ? winLines() : GAMEOVER_LINES;
    drawBanner(ppu0, g.banner);
    audio('play', won ? 'clear' : 'gameover');
  }

  function enterDead() {
    g.mode = 'dead';
    g.modeFrames = 0;
    audio('play', 'death');
  }

  function respawn() {
    var h = g.hero, lv = g.lv, x, y;
    var col = g.checkpoint | 0;
    if (typeof lv.respawn === 'function') {
      var rp = lv.respawn(col >= 0 ? col : -1);
      x = rp.x | 0; y = rp.y | 0;
    } else if (col > 0) {
      x = col * 8; y = groundYAt(col);
    } else {
      x = (lv.start && lv.start.x) | 0;
      y = (lv.start && lv.start.y !== undefined) ? lv.start.y : groundYAt(x >> 3);
    }
    Hero.reset(h, x, y, 1);
    g.time = (lv.time | 0) || TIME_START;
    g.timeTick = 0;
    g.pops.length = 0;
    g.bump = null;
    g.camX = clampCam(x - CAM_R);
    hudReset();
    rebuildScreen();
    // 檢查點復活：相機左邊的敵人視為已出過，右邊的重新排隊（契約 ENGINE_API §15.8-5）
    if (ST.Enemies && typeof ST.Enemies.seek === 'function') { try { ST.Enemies.seek(g.camX); } catch (e) { } }
    else if (ST.Enemies && typeof ST.Enemies.reset === 'function') { try { ST.Enemies.reset(); } catch (e) { } }
    var BM = bossMod();
    if (BM && typeof BM.reset === 'function') { try { BM.reset(); } catch (e) { } }
    if (ST.Objects && typeof ST.Objects.seek === 'function') { try { ST.Objects.seek(g.camX); } catch (e) { } }
    g.pole = null;
    g.starMusic = false;
    g.bossMusic = 0;                          // 魔王房復活：重新進房時再切一次 boss 曲
    g.cheatInv = false;
    g.paused = false;
    g.floatBanner = null; g.secretMsg = 0;   // fix5：rebuildScreen 已整片重畫 ⇒ 記錄作廢
    g.mode = 'play';
    g.modeFrames = 0;
    g.hudDirty = true;
    audio('play', levelSong(lv));
  }

  function nextLevel() {
    var list = levelList();
    var i = list.indexOf(g.levelId);
    if (i >= 0 && i + 1 < list.length) {
      loadLevel(list[i + 1], true);
      g.mode = 'play';
      g.modeFrames = 0;
      return true;
    }
    enterGameOver(true);
    return false;
  }

  function updateCheckpoint() {
    var lv = g.lv, col = g.hero.x >> 3, i, cps;
    if (typeof lv.checkpointFor === 'function') {
      var cp = lv.checkpointFor(col);
      if (cp > g.checkpoint) g.checkpoint = cp | 0;
      return;
    }
    cps = lv.checkpoints;
    if (!cps || !cps.length) return;
    for (i = 0; i < cps.length; i++) if ((cps[i] | 0) <= col && (cps[i] | 0) > g.checkpoint) g.checkpoint = cps[i] | 0;
  }

  /* ------------------------------- 碰撞：敵人 / 魔王 ------------------------------- */
  // star-world 的 `ST.Enemies.update(g)` / `ST.Boss.update(g)` **自己做主角碰撞**
  // （條件是 g 帶了 hero 與這幾個 callback），所以本檔只負責「撞到之後怎麼辦」。
  // ST.Enemies 缺席時才退回本檔自己掃一遍（內建測試關沒有敵人，等於 no-op）。
  function onStomp(e) {
    var h = g.hero;
    Hero.stomp(h);
    h.score += (e && e.score) ? (e.score | 0) : SCORE_STOMP;
    g.hudDirty = true;
    sfx('stomp');
  }
  function onHurt(e) {
    Hero.hurt(g.hero, ctx, e ? e.x : undefined);
  }
  function onStar(e) {
    g.hero.score += SCORE_STOMP;
    g.hudDirty = true;
  }
  // R3 star-w2：撿到無敵星
  function onItem(it) {
    var h = g.hero;
    if (!it || it.kind !== 'star') return false;
    h.star = (ST.Objects && ST.Objects.STAR_FRAMES) || 480;
    h.stars++;
    h.score += STAR_SCORE;
    g.hudDirty = true;
    g.starMusic = true;
    sfx('powerup');
    audio('play', songKey('invincible', levelSong(g.lv)));
    return true;
  }
  // 無敵（星塵 / 一鍵密技）時掉出畫面：拉回最近的檢查點，**不扣命**
  function onPitSave(h) {
    var lv = g.lv, rp = null;
    if (typeof lv.respawn === 'function') { try { rp = lv.respawn(g.checkpoint >= 0 ? g.checkpoint : -1); } catch (e) { rp = null; } }
    if (!rp) {
      var col = (g.checkpoint > 0) ? g.checkpoint : ((lv.start && lv.start.x) | 0) >> 3;
      rp = { x: col * 8, y: groundYAt(col) };
    }
    FX.vsetPx(h.px, rp.x | 0);
    FX.vsetPx(h.py, rp.y | 0);
    FX.aset(h.vxA, 0); FX.aset(h.vyA, 0);
    h.onGround = false; h.onMover = null;
    g.camX = clampCam((rp.x | 0) - CAM_R);
    rebuildScreen();
    sfx('powerup');
    return true;
  }
  // 無敵星結束 → 換回關卡曲（魔王房則回魔王曲）
  function onStarEnd() {
    if (!g.starMusic) return;
    g.starMusic = false;
    if (g.bossMusic === 2) return;
    audio('play', g.bossMusic === 1 ? bossSong(g.lv) : levelSong(g.lv));
  }

  function onBossDie(how) {
    g.hero.score += 2000;
    g.hudDirty = true;
    sfx('goal');
  }

  var heroBox = { x: 0, y: 0, w: 0, h: 0 };
  function stepEnemyCollisionsFallback() {
    var h = g.hero;
    if (h.state === 'dead') return;
    heroBox.x = h.x; heroBox.y = h.y; heroBox.w = Hero.W; heroBox.h = Hero.boxH(h);
    eachEnemy(function (e) {
      if (h.state === 'dead') return;
      if (!SH.aabb(heroBox, e)) return;
      var stompable = (e.stompable === undefined) ? true : !!e.stompable;
      if (stompable && h.vyA.v > 0 && h.prevFeet <= e.y + 8) {
        if (typeof e.stomp === 'function') e.stomp(g);
        else if (typeof e.hit === 'function') e.hit(1, g);
        else e.alive = false;
        onStomp(e);
      } else {
        onHurt(e);
      }
    });
  }

  /* ------------------------------- 粒子 ------------------------------- */
  function stepPops() {
    var i, p;
    for (i = g.pops.length - 1; i >= 0; i--) {
      p = g.pops[i];
      p.t++;
      p.y -= (p.t < 8) ? 3 : -3;
      if (p.t >= 16) g.pops.splice(i, 1);
    }
    if (g.bump) { g.bump.t--; if (g.bump.t <= 0) g.bump = null; }
  }

  /* ============================== 傳給 hero 的 ctx ============================== */
  var ctx = {
    input: null, cols: 0,
    tileAt: tileAt, kindAt: kindAt, isLava: isLava,
    onTouch: onTouch, onBump: onBump, sfx: sfx,
    // R3 star-w2
    onPitSave: onPitSave, onStarEnd: onStarEnd
  };

  /* ============================== GAME ============================== */
  var GAME = {
    init: function (nes) {
      nes0 = nes;
      ppu0 = nes.ppu;
      ensureTiles();
      ST.LEVELS = ST.LEVELS || {};
      if (!ST.LEVELS.test) ST.LEVELS.test = buildTestLevel();

      g = newState();
      g.hero = Hero.create();
      g.input = nes.input || NES.Input;
      ctx.input = g.input;
      // star-world 的碰撞 callback（ST.Enemies / ST.Boss 讀 g.hero + 這幾個）
      g.onStomp = onStomp;
      g.onHurt = onHurt;
      g.onStar = onStar;
      g.onDie = onBossDie;
      g.onAxe = function () { sfx('bump'); };
      // R3 star-w2：機關 / 魔王 / 敵人要用的共用 callback
      g.onItem = onItem;
      g.sfx = sfx;

      // ---- CHR：精靈表 1 = 主角(0..127) + 世界(128..255)；背景表 0 = HUD(0..63) + 地形 ----
      var sprObj = {}, bgObj = {}, k;
      for (k in ST.SPR_HERO) if (Object.prototype.hasOwnProperty.call(ST.SPR_HERO, k)) sprObj[k] = ST.SPR_HERO[k];
      if (ST.SPR_WORLD) for (k in ST.SPR_WORLD) if (Object.prototype.hasOwnProperty.call(ST.SPR_WORLD, k)) sprObj[k] = ST.SPR_WORLD[k];
      for (k in ST.BG_HUD) if (Object.prototype.hasOwnProperty.call(ST.BG_HUD, k)) bgObj[k] = ST.BG_HUD[k];
      // 後備地形磚永遠合併（11 磚）：內建測試關與「關卡沒給磚名」時的保底，
      // 有 ST.BG_WORLD 時它們只是沒被用到而已。
      for (k in ST.BG_FALLBACK) if (Object.prototype.hasOwnProperty.call(ST.BG_FALLBACK, k)) bgObj[k] = ST.BG_FALLBACK[k];
      if (ST.BG_WORLD) {
        for (k in ST.BG_WORLD) if (Object.prototype.hasOwnProperty.call(ST.BG_WORLD, k)) bgObj[k] = ST.BG_WORLD[k];
      }
      // R3 star-w2：世界 2 的追加磚（背景 20 磚 / 精靈 70 磚），合併後 bank 仍 ≤ 256
      if (ST.BG_W2) {
        for (k in ST.BG_W2) if (Object.prototype.hasOwnProperty.call(ST.BG_W2, k)) bgObj[k] = ST.BG_W2[k];
      }
      if (ST.SPR_W2) {
        for (k in ST.SPR_W2) if (Object.prototype.hasOwnProperty.call(ST.SPR_W2, k)) sprObj[k] = ST.SPR_W2[k];
      }
      sprBank = NES.CHR.bank('st_spr', sprObj);
      bgBank = NES.CHR.bank('st_bg', bgObj);
      NES.CHR.setPattern(0, bgBank);
      NES.CHR.setPattern(1, sprBank);
      tileOf = {};
      heroTiles = {};
      var names = Hero.tileNames(), i;
      for (i = 0; i < names.length; i++) {
        if (sprBank.has(names[i])) heroTiles[names[i]] = ST.oam16(sprBank, names[i]);
      }
      ST.sprBank = sprBank; ST.bgBank = bgBank; ST.heroTiles = heroTiles;
      // star-world 的 chr_world.js 要拿到 bank 才能解磚名（契約：main 合併後呼叫 bind）
      if (ST.World && typeof ST.World.bind === 'function') { try { ST.World.bind(bgBank, sprBank); } catch (e) { } }

      ppu0.setPatternTables(0, 1);
      ppu0.spriteMode(16);                 // 8×16：主角 16×24
      ppu0.mirroring('v');                 // 水平捲動 ⇒ 左右兩張名稱表不同
      ppu0.flicker = 'rotate';
      ppu0.flickerStep = 0;                // 輪替交給 NES.SH.OAM（ENGINE_API §15.8）
      g.oam = SH.OAM(ppu0, { reserve: 0 });

      // ---- 網址參數 ?level=1-2 / ?level=test ----
      var q = null;
      try { q = new URLSearchParams(window.location.search); } catch (e) { q = null; }
      var want = q && q.get('level');
      var list = levelList();
      var first = want && (ST.LEVELS[want] ? want : null);
      if (!first) first = list.length ? list[0] : 'test';
      g.startLevel = first;
      g.skipTitle = !!want;
      g.titleWorld = parseInt(String(first).charAt(0), 10) || 1;

      audio('init', nes);
      loadLevel(first, false);

      if (g.skipTitle) {
        g.mode = 'play';
      } else {
        g.mode = 'title';
        drawTitle(ppu0);
        audio('play', 'title');
      }
      ppu0.scroll(0, 0, 0);
      ppu0.split(SPLIT_LINE, { x: g.camX % 512, y: SPLIT_LINE, nt: 0 });
    },

    update: function (nes) {
      var input = nes.input || NES.Input;
      g.input = input; ctx.input = input; ctx.cols = g.cols;
      g.frames++;
      g.modeFrames++;
      var h = g.hero;

      // fix5：一鍵密技在幀邊界處理（觸控 / 鍵盤 / 事件三條路共用）
      if (g.cheatCool > 0) g.cheatCool--;
      if (g.cheatReq) { g.cheatReq = false; doCheat(); }
      // 不在暫停畫面時的「SECRET!」倒數（暫停版由 paused 分支自己收回 PAUSE 兩行）
      if (!g.paused && g.secretMsg > 0 && --g.secretMsg === 0) endFloat(true);

      if (g.mode === 'title') {
        // R3 star-w2：SELECT 切世界（WORLD 1 / 2），START 從該世界的第一關開始
        if (input.pressed(BTN.SELECT)) {
          toggleTitleWorld(nes.ppu);
        } else if (input.pressed(BTN.START) || input.pressed(BTN.A)) {
          var want = WORLD_FIRST[g.titleWorld] || g.startLevel;
          clearTitle(nes.ppu);
          if (ST.LEVELS[want] && want !== g.levelId) loadLevel(want, false);
          g.mode = 'play';
          g.modeFrames = 0;
          audio('play', levelSong(g.lv));
        }
      } else if (g.mode === 'play' && g.paused) {
        // fix4：暫停中遊戲完全凍結，只收 SELECT（一鍵密技）與 START（解除）
        if (input.pressed(BTN.SELECT)) trySelectSecret();
        if (g.secretMsg > 0 && --g.secretMsg === 0) setBanner(PAUSE_LINES);   // SECRET! 收回、PAUSE 留著
        if (input.pressed(BTN.START)) unpauseGame();
      } else if (g.mode === 'play' && input.pressed(BTN.START)) {
        pauseGame();
      } else if (g.mode === 'play') {
        Hero.update(h, ctx);
        // R3 star-w2：機關（升降板 / 崩塌磚 / 彈簧 / 間歇泉 / 道具）在主角移動之後結算
        if (ST.Objects && typeof ST.Objects.update === 'function') { try { ST.Objects.update(g); } catch (e) { } }
        var worldDidCollide = false;
        var BM = bossMod();
        if (ST.Enemies && typeof ST.Enemies.update === 'function') { try { ST.Enemies.update(g); worldDidCollide = true; } catch (e) { } }
        if (BM && typeof BM.update === 'function') { try { BM.update(g); worldDidCollide = true; } catch (e) { } }
        if (!worldDidCollide) stepEnemyCollisionsFallback();
        stepPops();
        if (ST.World && typeof ST.World.setAnim === 'function') ST.World.setAnim(g.frames >> 4);
        updateCheckpoint();
        stepCamera();
        streamColumns();
        if (++g.timeTick >= SMB.intervalTimer) {          // 21 幀一跳（SMB framerule）
          g.timeTick = 0;
          if (g.time > 0) { g.time--; g.hudDirty = true; }
          else if (h.state !== 'dead') Hero.kill(h, ctx);
        }
        // fix4：一鍵密技的 20 秒無敵結束 → 換回關卡曲（魔王房則回魔王曲）
        if (g.cheatInv && h.inv <= 0) {
          g.cheatInv = false;
          g.starMusic = false;
          if (g.bossMusic !== 2) audio('play', g.bossMusic === 1 ? bossSong(g.lv) : levelSong(g.lv));
        }
        // 魔王曲（qa2-star P2-1）：進魔王房 → boss、擊破 → clear、離開魔王房 → 回關卡曲
        if (g.lv.boss && BM) {
          if (g.bossMusic === 1 && BM.dead) { g.bossMusic = 2; audio('play', 'clear'); }
          else if (g.bossMusic === 0 && BM.active && !BM.dead) { g.bossMusic = 1; audio('play', bossSong(g.lv)); }
          else if (g.bossMusic === 1 && !BM.active) { g.bossMusic = 0; audio('play', levelSong(g.lv)); }
        }
        // 魔王關（1-4 / 2-4）：打倒魔王 = 過關（旗桿是第二條路）
        if (g.mode === 'play' && g.lv.boss && BM && BM.dead && !g.cleared) {
          if (++g.bossClear >= 60) enterClear();
        }
        if (h.state === 'dead') enterDead();
      } else if (g.mode === 'dead') {
        Hero.update(h, ctx);
        stepCamera();
        if (h.deadDone) {
          h.lives--;
          g.hudDirty = true;
          if (h.lives < 0) enterGameOver(false);
          else respawn();
        }
      } else if (g.mode === 'clear') {
        // R3：旗桿演出（下滑 → 落地 → 走進城）跑完才開始結算
        if (g.pole) { stepPole(); }
        else if (g.time > 0) {
          var d = g.time > 10 ? 10 : g.time;
          g.time -= d;
          h.score += d * SCORE_PER_TIME;
          g.hudDirty = true;
          g.clearTally += d;
        } else if (g.modeFrames > CLEAR_HOLD) {
          nextLevel();
        }
      } else if (g.mode === 'gameover') {
        // fix4：SELECT = 一鍵續關（3 條命回檢查點、分數保留、不限次數）；破關畫面沒有這條路
        if (!g.won && input.pressed(BTN.SELECT)) {
          continueGame();
        // qa2-star P2-5：START 回**標題**（不是直接重開）；標題再按 START 才開始新的一輪
        } else if (input.pressed(BTN.START)) {
          g.banner = null;
          g.hero.lives = 3; g.hero.score = 0; g.hero.coins = 0;
          g.won = false;
          loadLevel(g.startLevel, false);        // 內含 rebuildScreen ⇒ 字會被整片蓋掉
          g.mode = 'title';
          g.modeFrames = 0;
          drawTitle(nes.ppu);
          audio('play', 'title');
        }
      }
      musicTick();
    },

    draw: function (nes) {
      var ppu = nes.ppu, h = g.hero, i;
      if (g.hudDirty) { hudWrite(ppu, false); g.hudDirty = false; }
      ppu.scroll(0, 0, 0);                                     // 上段（HUD）固定
      ppu.split(SPLIT_LINE, { x: g.camX % 512, y: SPLIT_LINE, nt: 0 });

      var oam = g.oam;
      oam.begin();
      if (g.mode !== 'gameover' && g.mode !== 'title') {
        Hero.draw(h, g, oam, heroTiles, g.camX);
      } else if (g.mode === 'title') {
        Hero.draw(h, g, oam, heroTiles, g.camX);
      }
      // ? 磚頂出的金幣粒子（prio 1）；總控：GAME OVER 畫面也不畫（會疊在 SELECT = CONTINUE 上）
      for (i = 0; g.mode !== 'gameover' && i < g.pops.length; i++) {
        var p = g.pops[i];
        if (heroTiles.H_COIN === undefined) break;
        oam.add({ x: p.x - g.camX, y: p.y, tile: heroTiles.H_COIN, pal: 1, prio: 1 });
      }
      // fix4：GAME OVER 畫面不畫敵人（主角本來就不畫）—— 三行字才不會被路過的敵人精靈蓋掉
      if (g.mode !== 'gameover') {
        if (ST.Objects && typeof ST.Objects.draw === 'function') { try { ST.Objects.draw(oam, g); } catch (e) { } }
        if (ST.Enemies && typeof ST.Enemies.draw === 'function') { try { ST.Enemies.draw(oam, g); } catch (e) { } }
        var BD = bossMod();
        if (BD && typeof BD.draw === 'function') { try { BD.draw(oam, g); } catch (e) { } }
      }
      oam.end();
    },

    state: function () {
      var h = g.hero, n = 0;
      eachEnemy(function () { n++; });
      return {
        mode: g.mode, level: g.levelId,
        x: h.x, y: h.y, vx: h.vxA.v, vy: h.vyA.v,
        state: h.state, onGround: h.onGround,
        camX: g.camX, lives: h.lives, coins: h.coins, score: h.score,
        time: g.time, enemies: n,
        // --- 以下是測試 / 機器人用的額外欄位（契約的超集）---
        gameFrames: g.frames, modeFrames: g.modeFrames,
        xSub: h.px.sub, ySub: h.py.sub,
        vxPx: FX.velToPx(h.vxA.v), vyPx: FX.velToPx(h.vyA.v),
        facing: h.facing, crouch: h.crouch, inv: h.inv, anim: h.anim,
        hurtTimer: h.hurtTimer, deadTimer: h.deadTimer, dropThru: h.dropThru,
        apexSub: h.jumpApexSub, apexPx: FX.toPx(h.jumpApexSub),
        screenX: h.x - g.camX, camMin: g.camMin,
        cols: g.cols, checkpoint: g.checkpoint, cleared: g.cleared, won: g.won,
        stomps: h.stomps, hits: h.hits, bumps: h.bumps, deaths: h.deaths, oneUps: h.oneUps,
        scrNext: g.scr ? g.scr.next : 0, scrLeft: g.scrLeft, scrBytes: g.scr ? g.scr.bytes : 0,
        lastSfx: g.lastSfx, pops: g.pops.length,
        banner: g.banner ? g.banner.map(function (t) { return t.text; }) : null,
        bossMusic: g.bossMusic,
        // fix4：暫停 / 一鍵密技 / 續關
        paused: !!g.paused, secrets: g.secrets | 0, secretMsg: g.secretMsg | 0,
        selectUsed: !!g.selectUsed, cheatInv: !!g.cheatInv, continues: g.continues | 0,
        // fix5：一鍵密技
        cheats: g.cheats | 0, cheatContinues: g.cheatContinues | 0,
        cheatCool: g.cheatCool | 0, lastCheat: g.lastCheat || '',
        // R3 star-w2
        world: worldOf(g.lv), theme: themeOf(g.lv),
        star: h.star | 0, stars: h.stars | 0, pitSaves: h.pitSaves | 0,
        onMover: !!h.onMover, pole: g.pole ? g.pole.phase : null,
        titleWorld: g.titleWorld | 0,
        springs: (ST.Objects && ST.Objects.springs) | 0,
        picked: (ST.Objects && ST.Objects.picked) | 0,
        floatBanner: g.floatBanner ? g.floatBanner.map(function (t) { return t.text; }) : null
      };
    },

    /* ---- 除錯 / 測試專用（不參與正式遊玩）---- */
    dev: {
      g: function () { return g; },
      hero: function () { return g.hero; },
      warp: function (x, y) {
        Hero.reset(g.hero, x | 0, (y === undefined || y === null) ? groundYAt(x >> 3) : (y | 0), 1);
        g.camX = clampCam((x | 0) - CAM_R);
        rebuildScreen();
        return GAME.state();
      },
      level: function (id) { loadLevel(id, true); g.mode = 'play'; g.modeFrames = 0; return GAME.state(); },
      setTime: function (n) { g.time = n | 0; g.hudDirty = true; },
      setCoins: function (n) { g.hero.coins = n | 0; g.hudDirty = true; },
      setLives: function (n) { g.hero.lives = n | 0; g.hudDirty = true; },
      setScore: function (n) { g.hero.score = n | 0; g.hudDirty = true; },
      kill: function () { Hero.kill(g.hero, ctx); },
      hurt: function (fromX) { return Hero.hurt(g.hero, ctx, fromX); },
      tileAt: tileAt, kindAt: kindAt, groundYAt: groundYAt,
      layout: function () { return (g.lv && g.lv.layout) || null; },
      bgIndexAt: function (col, row) { return scrTileAt(col, row); },
      ntTileAt: function (col, row) {
        var ntc = col & (NT_WINDOW - 1);
        return ppu0.getTile((ntc >> 5) & 1, ntc & 31, row);
      },
      // 讀回「目前畫面上」第 row 列、螢幕第 sc 欄起算 len 格的文字
      // （測試用：驗證 GAME OVER / WORLD 1 CLEAR 真的寫在**可見**的名稱表上）
      screenText: function (row, sc, len) {
        var s2 = '', i, p;
        for (i = 0; i < (len | 0); i++) {
          p = ntOfScreenCol((sc | 0) + i);
          s2 += tileChar(ppu0.getTile(p.nt, p.col, row | 0));
        }
        return s2;
      },
      banner: function () { return g.banner; },
      hudRow: function (row) {
        var s = '', c;
        for (c = 0; c < 32; c++) s += String(ppu0.getTile(0, c, row)) + ',';
        return s;
      },
      // 通關機器人 / 測試用：目前活著的敵人（含魔王）矩形
      enemyList: function () {
        var out = [];
        eachEnemy(function (e) {
          out.push({
            x: e.x | 0, y: e.y | 0, w: e.w | 0, h: e.h | 0, kind: e.kind || '',
            stompable: (e.stompable === undefined) ? true : !!e.stompable,
            ground: !!e.onGround            // R3 star-w2：地面巡邏（armor）vs 飛行（flyer）
          });
        });
        var BB = bossMod();
        if (!(ST.Enemies && ST.Enemies.includeBoss) && BB && BB.box) {
          try { var bb = BB.box(g); if (bb) out.push({ x: bb.x | 0, y: bb.y | 0, w: bb.w | 0, h: bb.h | 0, kind: 'boss' }); } catch (e2) { }
        }
        return out;
      },
      boss: function () {
        var B2 = bossMod();
        if (!B2) return null;
        return { x: B2.x | 0, y: B2.y | 0, w: 32, h: 32, alive: !!B2.alive, active: !!B2.active, dead: !!B2.dead, hp: B2.hp | 0, phase: B2.phase, stage: B2.stage | 0 };
      },
      // R3 star-w2：機關（給通關機器人與測試）
      objects: function () { return (ST.Objects && ST.Objects.state) ? ST.Objects.state() : null; },
      moverTops: function (t) { return (ST.Objects && ST.Objects.moverTops) ? ST.Objects.moverTops(t) : []; },
      objNow: function () { return (ST.Objects && ST.Objects.now) ? ST.Objects.now() : 0; },
      hazardAt: function (x, y, w, h2, t) { return !!(ST.Objects && ST.Objects.hazardHit && ST.Objects.hazardHit(x, y, w, h2, t)); },
      tiles: function () { return heroTiles; },
      scroller: function () { return g.scr; }
    }
  };

  ST.GAME = GAME;
  window.GAME = GAME;
})();

</script>

<script>
// ---- 啟動：桌機整數放大置中 / 手機小數倍貼齊、鍵盤焦點、F 全螢幕、觸控覆蓋層版面 ----
(function () {
  var W = 256, H = 224;                 // 顯示尺寸（PPU 內部 240 列，裁上下各 8）
  var canvas = document.getElementById('nes');
  var hint = document.getElementById('hint');
  var q = new URLSearchParams(location.search);
  var debug = q.get('debug') === '1';
  var forced = parseInt(q.get('scale') || '0', 10) || 0;   // ?scale=1 供截圖工具用（＝維持桌機整數倍行為）
  // 橫向手機：左右各留 110px 給觸控按鍵；平板（短邊 ≥ 500）各留 170px
  var RESERVE_PHONE = 220, RESERVE_TABLET = 340;

  // ---- safe-area 探針（讀 env(safe-area-inset-*) 的實際 px；不支援就全 0） ----
  var probe = null;
  function safeArea() {
    var z = { t: 0, r: 0, b: 0, l: 0 };
    try {
      if (!probe) {
        if (!document.body) return z;
        probe = document.createElement('div');
        probe.id = 'nes-safe-probe';
        probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;' +
          'padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);' +
          'padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);';
        document.body.appendChild(probe);
      }
      var cs = getComputedStyle(probe);
      z.t = parseFloat(cs.paddingTop) || 0; z.r = parseFloat(cs.paddingRight) || 0;
      z.b = parseFloat(cs.paddingBottom) || 0; z.l = parseFloat(cs.paddingLeft) || 0;
    } catch (e) { }
    return z;
  }
  function isTouch() {
    try { return (navigator.maxTouchPoints | 0) > 0 || ('ontouchstart' in window); } catch (e) { return false; }
  }
  function viewport() {
    var vv = window.visualViewport;
    return { w: (vv && vv.width) || window.innerWidth || 320, h: (vv && vv.height) || window.innerHeight || 480 };
  }

  // fit() → {s 顯示倍率（可小數）, back backing store 倍率（整數）, mobile, portrait, sa, vw, vh}
  function fit() {
    var v = viewport(), sa = safeArea();
    var vw = v.w, vh = v.h;
    var portrait = vh >= vw;
    var mobile = !forced && (isTouch() || Math.min(vw, vh) < 600);
    var full = Math.min(vw / W, vh / H);        // 完整塞進視窗的最大倍率
    var s;
    if (forced) {
      s = forced;                               // ?scale=N：完全照舊（截圖工具可重現）
    } else if (mobile) {
      if (portrait) {
        s = vw / W;                             // 直向：寬度填滿、貼上方（下面整片給按鍵）
        var maxH = Math.max(1, vh - sa.t);
        if (H * s > maxH) s = maxH / H;
      } else {
        // 橫向：高度填滿為主，左右各留出按鍵空間；留不出來（小視窗）就整個塞滿
        var reserve = (Math.min(vw, vh) >= 500 ? RESERVE_TABLET : RESERVE_PHONE) + sa.l + sa.r;
        var side = Math.min(vh / H, (vw - reserve) / W);
        s = (side > 0 && side >= full * 0.6) ? side : full;
      }
    } else {
      s = Math.max(1, Math.floor(full));        // 桌機：維持整數倍
    }
    s = Math.max(0.5, s);
    // backing store 一律整數（nes.setScale 只改 backing store 且只收整數，QA R1 P2-1）；
    // 小數倍時 backing 取 ceil（畫得比顯示大一點），再用 CSS 縮到目標尺寸 + pixelated。
    var back = forced ? forced : Math.max(1, Math.min(4, Math.ceil(s - 0.0001)));
    return { s: s, back: back, mobile: mobile, portrait: portrait, sa: sa, vw: vw, vh: vh };
  }

  function place(f) {
    var cw = W * f.s, ch = H * f.s;
    if (f.mobile) { cw = Math.round(cw * 2) / 2; ch = Math.round(ch * 2) / 2; }
    else { cw = Math.round(cw); ch = Math.round(ch); }
    var x = (f.vw - cw) / 2, y = (f.vh - ch) / 2;
    if (f.mobile && f.portrait) y = f.sa.t;                 // 直向貼上方
    if (f.mobile) { x = Math.round(x * 2) / 2; y = Math.round(y * 2) / 2; }
    else { x = Math.floor(x); y = Math.floor(y); }
    canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
    canvas.style.left = x + 'px'; canvas.style.top = y + 'px';
    // 觸控覆蓋層（engine/touch.js）靠這份版面資訊排版
    window.NES_LAYOUT = {
      x: x, y: y, w: cw, h: ch, scale: f.s, back: f.back,
      portrait: f.portrait, mobile: f.mobile, safe: f.sa, vw: f.vw, vh: f.vh
    };
    try { window.dispatchEvent(new Event('nes-resize')); } catch (e) { }
  }

  if (!window.NES || typeof NES.boot !== 'function') {
    hint.style.display = 'block';
    hint.textContent = 'engine/nes.js 未載入';
    return;
  }

  var f = fit();
  var game = window.GAME || NES.game || null;
  var nes = NES.boot({ canvas: canvas, game: game, scale: f.back });
  place(f);

  function apply() {
    var g = fit();
    if (g.back !== nes.scale) nes.setScale(g.back);
    place(g);
  }
  function applySoon() { apply(); setTimeout(apply, 120); }   // iOS 旋轉 / 工具列收合後尺寸會延遲 ⇒ 二次觸發
  window.addEventListener('resize', apply);
  window.addEventListener('orientationchange', applySoon);
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', applySoon);
  }
  // 切到背景 / 鎖螢幕：一定要把按鍵放掉，不然回來會卡住一個方向
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) return;
    try { if (NES.Touch && NES.Touch.releaseAll) NES.Touch.releaseAll(); } catch (e) { }
    try { if (NES.Input && NES.Input.inject) NES.Input.inject(0, 0); } catch (e) { }
  });

  // 鍵盤焦點：canvas 可聚焦，點畫面或載入完成都聚焦；方向鍵 / 空白鍵不捲頁
  function focus() { try { canvas.focus({ preventScroll: true }); } catch (e) { canvas.focus(); } }
  focus();
  window.addEventListener('pointerdown', focus);
  window.addEventListener('keydown', function (e) {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].indexOf(e.code) >= 0) e.preventDefault();
    // F = 全螢幕切換（不佔用遊戲按鍵；瀏覽器拒絕時安靜失敗）
    if (e.code === 'KeyF' && !e.ctrlKey && !e.altKey && !e.metaKey) {
      e.preventDefault();
      try {
        if (!document.fullscreenElement) {
          var p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
          if (p && p.catch) p.catch(function () { });
        } else {
          var q2 = document.exitFullscreen && document.exitFullscreen();
          if (q2 && q2.catch) q2.catch(function () { });
        }
      } catch (err) { }
    }
  });
  document.addEventListener('fullscreenchange', function () { setTimeout(apply, 60); });

  // ?touch=1 / ?touch=0：強制顯示 / 隱藏觸控按鍵（桌機截圖與測試用）
  try {
    var tq = q.get('touch');
    if (tq === '1' && NES.Touch && NES.Touch.show) NES.Touch.show();
    else if (tq === '0' && NES.Touch && NES.Touch.hide) NES.Touch.hide();
  } catch (e) { }

  // 缺模組 / debug 時在底部列出狀態（正式遊玩畫面不顯示）
  if (debug || (nes.missing && nes.missing.length)) {
    hint.style.display = 'block';
    hint.textContent = 'NES ' + NES.VERSION + ' scale=' + nes.scale
      + (nes.missing && nes.missing.length ? '  缺: ' + nes.missing.join(' ') : '  模組齊全')
      + (game ? '' : '  (無 game，空畫面)')
      + (debug ? '  __nes 可用' : '');
  }
  window.nes = nes;
})();
</script>
