      state: 'idle', facing: 1, onGround: true,
      inv: 0, coins: 0, lives: 3, score: 0, power: 0,
      // R3 star-w2：無敵星（熔岩 / 尖刺 / 火柱 / 坑都不致命，撞到敵人直接打倒）
      star: 0, stars: 0, onMover: null, pitSaves: 0,
      // --- 內部（定點數）---
      px: FX.Vec(0), py: FX.Vec(0), vxA: FX.Acc(0), vyA: FX.Acc(0),
      jumpS: null,
      crouch: false, sliding: false, turning: false,
      anim: 0, animTimer: 0,
      prevFeet: 0, jumpApexSub: 0, jumpStartSub: 0,
      hurtTimer: 0, deadTimer: 0, deadDone: false, dropThru: 0,
      stomps: 0, hits: 0, bumps: 0, deaths: 0, oneUps: 0,
      frames: 0, lastJumpFrame: -1
    };
    h.jumpS = SMB.jumpState(h.vyA);
    return h;
  }

  function reset(h, x, y, facing) {
    FX.vsetPx(h.px, x | 0); FX.vsetPx(h.py, y | 0);
    FX.aset(h.vxA, 0); FX.aset(h.vyA, 0);
    h.jumpS = SMB.jumpState(h.vyA);
    h.state = 'idle'; h.facing = facing || 1; h.onGround = false;
    h.crouch = false; h.sliding = false; h.turning = false;
    h.anim = 0; h.animTimer = 0;
    h.inv = 0; h.hurtTimer = 0; h.deadTimer = 0; h.deadDone = false; h.dropThru = 0;
    h.star = 0; h.onMover = null;
    h.prevFeet = (y | 0) + H;
    h.jumpApexSub = h.py.sub; h.jumpStartSub = h.py.sub;
    sync(h);
    return h;
  }

  function boxH(h) { return h.crouch ? CROUCH_H : H; }

  function sync(h) {
    h.x = FX.floorPx(h.px.sub);
    h.y = FX.floorPx(h.py.sub);
    h.h = boxH(h);
    h.vx = h.vxA.v;
    h.vy = h.vyA.v;
  }

  /* ------------------------------------------------------------ 磚查詢 */

  // 關卡外的語意：左右牆 = solid（擋住）；上方 = none（不擋頭）；下方 = none（掉出畫面 → 死）
  function kindAt(g, col, row) {
    if (col < 0 || col >= g.cols) return 'solid';
    if (row < TOP_ROW || row >= ROWS) return 'none';
    var k = g.kindAt(col, row);
    if (k === 'slopeL' || k === 'slopeR') return 'solid';   // 本版斜坡當整塊（見檔頭）
    return k || 'none';
  }

  function blocksH(g, x, y, hh) {
    var col0 = x >> 3, col1 = (x + 0) >> 3;
    var r, rows = [y, y + ((hh / 2) | 0), y + hh - 1];
    for (r = 0; r < rows.length; r++) {
      if (kindAt(g, x >> 3, rows[r] >> 3) === 'solid') return true;
    }
    return false;
  }

  /* -------------------------------------------------------------- 動作 */

  function setCrouch(h, g, on) {
    if (on === h.crouch) return;
    if (on) {
      FX.vsetSub(h.py, h.py.sub + DH * FX.SUB);
      h.crouch = true;
    } else {
      // 站起來要有空間（頭上 8 px 內不能有 solid）
      var x = FX.floorPx(h.px.sub), ny = FX.floorPx(h.py.sub) - DH;
      if (kindAt(g, x >> 3, ny >> 3) === 'solid' || kindAt(g, (x + W - 1) >> 3, ny >> 3) === 'solid') return;
      FX.vsetSub(h.py, h.py.sub - DH * FX.SUB);
      h.crouch = false;
    }
  }

  function stomp(h) {
    SMB.jumpBounce(h.jumpS, BOUNCE, h.py.sub);
    h.onGround = false;
    h.stomps++;
    return true;
  }

  /* R3 star-w2：被機關彈飛（蒸氣彈簧）。
   * 先用 `jumpStart` 依當下水平速度選好 SMB 的那一段重力（不然會沿用上一次跳躍的段，
   * 高度會隨「上一次怎麼跳的」而變 ⇒ 不可重現），再把初速覆寫成機關給的值。
   * 按住 A ⇒ gHold（彈更高）、放開 ⇒ gFall，手感與一般跳躍一致。 */
  // 機關彈飛專用的跳躍段：上升 / 下降都用 SMB 的「按住 A」小重力（0.125 px/幀²）
  //   ⇒ 高度 = v²/2g，只跟機關給的初速有關（−5 px/幀 = 100 px ≈ 12 格），
  //     不會因為玩家有沒有按住 A 而變，機器人也推得準。
  var LAUNCH_SEG = { belowSpeed: Infinity, vy0: 0, gHold: SMB.jump[0].gHold, gFall: SMB.jump[0].gHold, h: 0 };
  function launch(h, vel) {
    h.jumpS.seg = LAUNCH_SEG;
    FX.aset(h.vyA, vel | 0);
    h.jumpS.fastFall = false;
    h.jumpS.first = true;
    h.jumpS.startSub = h.py.sub;
    h.onGround = false;
    h.crouch = false;
    h.jumpStartSub = h.py.sub;
    h.jumpApexSub = h.py.sub;
    return h;
  }

  function hurt(h, g, fromX) {
    if (h.inv > 0 || h.star > 0 || h.state === 'dead') return false;
    h.inv = INV_FRAMES;
    h.hurtTimer = HURT_FRAMES;
    h.hits++;
    var dir = (fromX === undefined || fromX === null) ? -h.facing : (h.x < fromX ? -1 : 1);
    if (h.onGround) {
      // 站在地上被打：往後擊退 + 彈起（看得出來被打到）
      FX.aset(h.vxA, dir * HURT_VX);
      SMB.jumpBounce(h.jumpS, HURT_VY, h.py.sub);
      h.onGround = false;
    }
    // **空中被打完全不動水平動量**（不反推、也不減速）：空中無法再加速（SMB 規則），
    // 在坑 / 熔岩 / 天空關的空中被反推就是必死，會把關卡變成運氣遊戲。
    // 代價只有「無敵 120 幀 + 閃爍」，跟站在地上被打一樣。
    h.state = 'hurt';
    if (g && g.sfx) g.sfx('hurt');
    return true;
  }

  function kill(h, g) {
    if (h.state === 'dead') return false;
    if (h.crouch) setCrouch(h, g, false);
    h.state = 'dead';
    h.deadTimer = 0;
    h.deadDone = false;
    h.deaths++;
    h.inv = 0; h.hurtTimer = 0;
    FX.aset(h.vxA, 0);
    SMB.jumpBounce(h.jumpS, -FX.v88(4, 0), h.py.sub);
    h.onGround = false;
    if (g && g.sfx) g.sfx('death');    // ST.Audio 的音效名是 death（舊版寫 die ⇒ 靜默失敗，qa2-star P2-2 的 warn 抓到）
    return true;
  }

  function addCoin(h, g, n) {
    h.coins += (n === undefined ? 1 : n);
    while (h.coins >= COIN_1UP) { h.coins -= COIN_1UP; h.lives++; h.oneUps++; if (g && g.sfx) g.sfx('powerup'); }
  }

  /* -------------------------------------------------------------- 每幀 */

  function deathStep(h, g) {
    h.deadTimer++;
    SMB.jumpGravity(h.jumpS, false, h.py.sub, MAX_FALL);
    FX.vadd(h.py, h.vyA.v);
    if (h.deadTimer >= DEATH_FRAMES) h.deadDone = true;
    sync(h);
  }

  function update(h, g) {
    h.frames++;
    if (h.state === 'dead') { deathStep(h, g); return h; }

    var input = g.input || NES.Input;
    var hurting = h.hurtTimer > 0;
    if (hurting) h.hurtTimer--;

    var right = !hurting && input.held(BTN.RIGHT);
    var left = !hurting && input.held(BTN.LEFT);
    var down = !hurting && input.held(BTN.DOWN);
    var runBtn = !hurting && input.held(BTN.B);
    var aHeld = !hurting && input.held(BTN.A);
    var aPress = !hurting && input.pressed(BTN.A);
    var dir = (right ? 1 : 0) - (left ? 1 : 0);

    if (h.dropThru > 0) h.dropThru--;

    // ---- ① 蹲 / 站（只在地面切換）----
    if (h.onGround) setCrouch(h, g, down);
    else if (h.crouch) setCrouch(h, g, false);

    // ---- ② 水平加速 / 摩擦（SMB：空中要 |vx| ≥ $19 才沿用跑步參數）----
    var maxSpd, acc;
    if (h.onGround) {
      maxSpd = runBtn ? SMB.maxRun : SMB.maxWalk;
      acc = runBtn ? SMB.accRun : SMB.accWalk;
    } else if (FX.abs(h.vxA.v) >= SMB.airRunSpeed) {
      maxSpd = SMB.maxRun; acc = SMB.accRun;
    } else {
      maxSpd = SMB.maxWalk; acc = SMB.accWalk;
    }
    h.turning = false;
    if (dir !== 0 && !h.crouch) {
      if (h.vxA.v !== 0 && FX.sign(h.vxA.v) === -dir) { acc = acc << SMB.turnShift; h.turning = true; }
      FX.aapproach(h.vxA, dir * maxSpd, acc);
      h.facing = dir;
    } else if (h.onGround) {
      FX.aapproach(h.vxA, 0, SMB.friction);
    }

    // ---- ③ 起跳（蹲著按 A 且腳下是單向平台 ⇒ 穿下去）----
    if (h.onGround && aPress) {
      if (h.crouch && onewayBelow(h, g)) {
        h.dropThru = DROP_FRAMES;
        h.onGround = false;
        FX.vsetSub(h.py, h.py.sub + FX.SUB);          // 先沉 1 px 脫離平台面
      } else {
        SMB.jumpStart(h.jumpS, FX.abs(h.vxA.v), h.py.sub);
        h.onGround = false;
        h.jumpStartSub = h.py.sub;
        h.jumpApexSub = h.py.sub;
        h.lastJumpFrame = h.frames;
        if (g.sfx) g.sfx('jump');
      }
    }

    // ---- ④ 重力（按住 A = 小重力；放開且離地 ≥ 1px = 大重力；起跳首幀半格）----
    if (!h.onGround) SMB.jumpGravity(h.jumpS, aHeld, h.py.sub, MAX_FALL);

    // ---- ⑤ 移動 X + 磚碰撞 ----
    var hh = boxH(h);
    h.prevFeet = FX.floorPx(h.py.sub) + hh;
    FX.vadd(h.px, h.vxA.v);
    var x = FX.floorPx(h.px.sub), y = FX.floorPx(h.py.sub);
    if (h.vxA.v > 0) {
      if (blocksH(g, x + W - 1, y, hh)) {
        x = ((((x + W - 1) >> 3) << 3) - W);
        FX.vsetPx(h.px, x); FX.aset(h.vxA, 0);
      }
    } else if (h.vxA.v < 0) {
      if (blocksH(g, x, y, hh)) {
        x = (((x >> 3) + 1) << 3);
        FX.vsetPx(h.px, x); FX.aset(h.vxA, 0);
      }
    }
    if (x < 0) { x = 0; FX.vsetPx(h.px, 0); if (h.vxA.v < 0) FX.aset(h.vxA, 0); }
    var maxX = g.cols * 8 - W;
    if (x > maxX) { x = maxX; FX.vsetPx(h.px, x); FX.aset(h.vxA, 0); }

    // ---- ⑥ 移動 Y + 磚碰撞 ----
    FX.vadd(h.py, h.vyA.v);
    y = FX.floorPx(h.py.sub);
    if (h.vyA.v >= 0) {
      var feet = y + hh, frow = feet >> 3, hitFloor = false;
      if (solidFoot(g, x, frow, h) || solidFoot(g, x + W - 1, frow, h)) hitFloor = true;
      if (hitFloor) {
        y = (frow << 3) - hh;
        FX.vsetPx(h.py, y); FX.aset(h.vyA, 0);
        h.onGround = true;
      } else {
        h.onGround = false;
      }
    } else {
      h.onGround = false;
      var hrow = y >> 3;
      var c0 = x >> 3, c1 = (x + W - 1) >> 3;
      var hitL = kindAt(g, c0, hrow) === 'solid', hitR = kindAt(g, c1, hrow) === 'solid';
      if (hitL || hitR) {
        y = ((hrow + 1) << 3);
        FX.vsetPx(h.py, y); FX.aset(h.vyA, 0);
        // 頂磚：以主角中心所在的那一欄優先（SMB 的判定方式）
        var cc = (x + (W >> 1)) >> 3;
        if (kindAt(g, cc, hrow) !== 'solid') cc = hitL ? c0 : c1;
        h.bumps++;
        if (g.onBump) g.onBump(cc, hrow);
      }
    }
    if (h.py.sub < h.jumpApexSub) h.jumpApexSub = h.py.sub;

    // ---- ⑦ 危險 / 互動磚 ----
    sync(h);
    scanTiles(h, g);
    if (h.state === 'dead') return h;
    if (h.y > 240) {                               // 掉出畫面（坑）
      // R3 star-w2：無敵星（含一鍵密技的無敵）時交給 main 的 onPitSave 拉回來，不扣命。
      // 收掉 R2c fix5「留給後續」的「一鍵無敵擋不住熔岩 / 掉坑」。
      if (h.star > 0 && g.onPitSave && g.onPitSave(h)) { h.pitSaves++; sync(h); return h; }
      kill(h, g); return h;
    }

    // ---- ⑧ 狀態機 ----
    if (h.inv > 0) h.inv--;
    if (h.star > 0 && --h.star === 0 && g.onStarEnd) g.onStarEnd(h);
    var absv = FX.abs(h.vxA.v);
    if (h.hurtTimer > 0) {
      h.state = 'hurt';
    } else if (!h.onGround) {
      h.state = h.vyA.v < 0 ? 'jump' : 'fall';
    } else if (h.crouch) {
      h.state = (absv >= SMB.maxWalk) ? 'slide' : 'crouch';
    } else if (absv === 0) {
      h.state = 'idle';
    } else {
      h.state = (absv > SMB.maxWalk) ? 'run' : 'walk';
    }
    h.sliding = (h.state === 'slide');

    // ---- ⑨ 動畫 ----
    if (h.state === 'walk' || h.state === 'run') {
      var delay = absv >= SMB.maxWalk ? 2 : 4;
      if (++h.animTimer >= delay) { h.animTimer = 0; h.anim = (h.anim + 1) & 3; }
    } else if (h.state === 'idle' || h.state === 'crouch') {
      h.anim = 0; h.animTimer = 0;
    }

    sync(h);
    return h;
  }

  // 腳下這一欄能不能站（solid 永遠可；單向平台只在「前一幀腳在平台面之上」且沒在穿越時可）
  function solidFoot(g, px, frow, h) {
    var col = px >> 3, k = kindAt(g, col, frow);
    if (k === 'solid') return true;
    if (k === 'oneway') {
      if (h.dropThru > 0) return false;
      if (h.vyA.v < 0) return false;            // 上升中一律穿過
      return h.prevFeet <= (frow << 3);         // 站著不動（vy = 0）也要撐住
    }
    return false;
  }

  function onewayBelow(h, g) {
    var x = FX.floorPx(h.px.sub), frow = (FX.floorPx(h.py.sub) + boxH(h)) >> 3;
    return kindAt(g, x >> 3, frow) === 'oneway' || kindAt(g, (x + W - 1) >> 3, frow) === 'oneway';
  }

  // 掃描碰撞框覆蓋到的每一格：危險磚（尖刺 = 受傷、熔岩 = 死亡）與互動磚（交給 main）
  function scanTiles(h, g) {
    var hh = boxH(h);
    var c0 = h.x >> 3, c1 = (h.x + W - 1) >> 3;
    var r0 = h.y >> 3, r1 = (h.y + hh - 1) >> 3;
    var col, row, k, t, lava = false, spike = false;
    for (col = c0; col <= c1; col++) {
      if (col < 0 || col >= g.cols) continue;
      for (row = r0; row <= r1; row++) {
        if (row < TOP_ROW || row >= ROWS) continue;
        t = g.tileAt(col, row);
        k = g.kindAt(col, row);
        if (k === 'hurt') { if (g.isLava && g.isLava(t)) lava = true; else spike = true; }
        if (g.onTouch) g.onTouch(col, row, t);
      }
    }
    if (h.star > 0) return;                    // R3 star-w2：無敵星無視熔岩 / 尖刺
    if (lava) { kill(h, g); return; }
    if (spike) hurt(h, g, null);
  }

  /* -------------------------------------------------------------- 繪製 */

  // 依狀態挑「上半身 + 腳」的磚名；蹲 / 滑只有一組 16×16
  function frameNames(h) {
    var A = ST.HERO_ART || null;
    var walk = A ? A.walk : [0, 1, 0, 2];
    // 走路 3 幀**上半身也換**（手臂前後擺動 ±1 px，qa2-star P2-4 ④）
    var bodies = (A && A.bodies) || ['H_BODY', 'H_BW1', 'H_BW2'];
    switch (h.state) {
      case 'dead': return { body: 'H_BDEAD', leg: 'H_LD' };
      case 'pole': return { body: 'H_BJUMP', leg: 'H_LJ' };   // R3：抓旗桿下滑
      case 'hurt': return { body: 'H_BHURT', leg: 'H_LH' };
      case 'crouch': return { single: 'H_CR' };
      case 'slide': return { single: 'H_SL' };
      case 'jump': return { body: 'H_BJUMP', leg: 'H_LJ' };
      case 'fall': return { body: 'H_BJUMP', leg: 'H_LF' };
      case 'idle': return { body: 'H_BODY', leg: 'H_L0' };
      default:
        if (h.turning) return { body: 'H_BODY', leg: 'H_LT' };
        var f = walk[h.anim & 3];
        return { body: bodies[f] || bodies[0], leg: 'H_L' + f };
    }
  }

  // oam：main.js 的 OAM 配置器（begin/add/end，同 NES.SH.OAM 契約）
  // tiles：{ 磚名 → OAM tile 值 }（main.js 在 init 時用 bank.index(name)|1 算好）
  function draw(h, g, oam, tiles, camX) {
    if (h.state === 'dead' && h.deadDone) return 0;
    if (h.inv > 0 && (h.inv & 2) !== 0) return 0;          // 無敵閃爍：2 幀顯示 / 2 幀隱藏
    var f = frameNames(h);
    var flip = h.facing < 0;
    var sx = h.x + OFF_X - camX;
    var sy = h.y + OFF_Y;
    var n = 0;
    // R3 star-w2：無敵星期間調色盤輪替（SMB 的閃色做法；不增加同屏色數）
    var pal = (h.star > 0) ? ((h.frames >> 2) & 3) : 0;
    function put(name, dx, dy) {
      var t = tiles[name];
      if (t === undefined) return;
      oam.add({ x: sx + dx, y: sy + dy, tile: t, pal: pal, flipH: flip, prio: 0 });
      n++;
    }
    if (f.single) {
      // 蹲 / 滑：16×16，腳對齊碰撞框底部
      var dy = boxH(h) + 2 - 16;
      put(f.single + (flip ? '_TR' : '_TL'), 0, dy);
      put(f.single + (flip ? '_TL' : '_TR'), 8, dy);
    } else {
      put(f.body + (flip ? '_TR' : '_TL'), 0, 0);
      put(f.body + (flip ? '_TL' : '_TR'), 8, 0);
      put(f.leg + (flip ? '_R' : '_L'), 0, 16);
      put(f.leg + (flip ? '_L' : '_R'), 8, 16);
    }
    return n;
  }

  // 本模組會用到的所有磚名（main.js 據此把名稱 → OAM tile 值算好）
  function tileNames() {
    var out = [], bodies = ['H_BODY', 'H_BW1', 'H_BW2', 'H_BJUMP', 'H_BHURT', 'H_BDEAD', 'H_CR', 'H_SL'];
    var legs = ['H_L0', 'H_L1', 'H_L2', 'H_LJ', 'H_LF', 'H_LT', 'H_LH', 'H_LD'];
    var i;
    for (i = 0; i < bodies.length; i++) { out.push(bodies[i] + '_TL'); out.push(bodies[i] + '_TR'); }
    for (i = 0; i < legs.length; i++) { out.push(legs[i] + '_L'); out.push(legs[i] + '_R'); }
    out.push('H_COIN');
    return out;
  }

  ST.Hero = {
    W: W, H: H, CROUCH_H: CROUCH_H, SPR_W: SPR_W, SPR_H: SPR_H,
    OFF_X: OFF_X, OFF_Y: OFF_Y, LAUNCH_SEG: LAUNCH_SEG,
    MAX_FALL: MAX_FALL, BOUNCE: BOUNCE,
    INV_FRAMES: INV_FRAMES, HURT_FRAMES: HURT_FRAMES, DEATH_FRAMES: DEATH_FRAMES,
    DROP_FRAMES: DROP_FRAMES, COIN_1UP: COIN_1UP,
    ROWS: ROWS, TOP_ROW: TOP_ROW,
    create: create, reset: reset, update: update, draw: draw,
    stomp: stomp, hurt: hurt, kill: kill, addCoin: addCoin, launch: launch,
    setCrouch: setCrouch, boxH: boxH, sync: sync,
    frameNames: frameNames, tileNames: tileNames
  };
})();

</script>
<script>/* games/star/enemies.js */
/*
 * games/star/enemies.js — 《星塵勇者》W1 的三種原創敵人
 * ---------------------------------------------------------------------------
 * 擁有者：star-world agent ｜ 依賴：engine/fixed.js（NES.FX）、engine/shmup.js（NES.SH，選用）
 *                                  games/star/chr_world.js（ST.World.oam16）、levels_w1.js（ST.solidKind）
 * 契約：docs/TASKS.md「R2b §契約 敵人」
 *
 *   ① roller  岩球     0.5 px/幀 走路、撞牆轉向、可選「坑邊不掉」、**可踩**（壓扁 30 幀後消失）
 *   ② bouncer 彈跳球   原地每 60 幀彈一次（vy = −4 px/幀、SMB 重力）、**可踩**（停 60 幀再彈）
 *   ③ flyer   飛行體   正弦 y ±24 px、x 0.75 px/幀 向左、**不可踩**（踩到 = 受傷）
 *
 * 共通：出「畫面右緣 +16 px」時啟動；被無敵星塵撞到 → 死亡飛出；掉出畫面 / 落後相機 → 回收。
 * 速度全部走 NES.FX 定點數（8.8），位置 1/16 px，零浮點累加。
 *
 * ── main.js 的用法 ────────────────────────────────────────────────────────
 *   ST.Enemies.init(level);                       // 換關 / 重開
 *   ST.Enemies.seek(camX);                        // 檢查點復活（前方的敵人重新排隊）
 *   ST.Enemies.update({ hero, camX, level,        // 每幀
 *                       onStomp: e => hero.bounce(),   // ← 有給 callback 才會自動判定主角碰撞
 *                       onHurt:  e => hero.hurt() });
 *   ST.Enemies.draw(oam);                         // NES.SH.OAM：prio 3（壓扁 / 死亡 prio 4）
 *
 * 跨模組防禦：ST.World 還沒 bind（CHR 未合併）時 draw 會靜默跳過；level 沒給就用 g.solidAt。
 */
(function () {
  'use strict';
  var ST = window.ST = window.ST || {};
  var NES = window.NES = window.NES || {};
  var FX = NES.FX;
  if (!FX) throw new Error('games/star/enemies.js 需要 engine/fixed.js');

  var SMB = FX.SMB;
  var POOL_SIZE = 12;                       // 同時最多 12 隻（NES 風：沒槽就不生成）
  var SPAWN_MARGIN = 16;                    // 「出畫面右 16 px」啟動
  var DESPAWN_LEFT = 48;                    // 落後相機 48 px 回收
  var WORLD_BOTTOM = 30 * 8 + 48;

  var SPD_ROLL = SMB.enemySlow;             // 0.5  px/幀（$f8）
  var SPD_FLY = SMB.enemyFast;              // 0.75 px/幀（$f4）
  var GRAV = SMB.jump[0].gFall;             // 落下：SMB 的大重力（放開 A）
  var GRAV_UP = SMB.jump[0].gHold;          // 上升：SMB 的小重力（按住 A）⇒ vy −4 剛好 4 格 = 64 px
  var MAXFALL = FX.v88(4, 0);
  var JUMP_VY = -FX.v88(4, 0);              // 彈跳球 vy = −4 px/幀
  var BOUNCE_PERIOD = 60;                   // 每 60 幀跳一次
  var STUN_FRAMES = 60;                     // 踩了停 60 幀
  var SQUASH_FRAMES = 30;                   // 壓扁 30 幀
  var FLY_AMP = 24;                         // 正弦振幅 ±24 px
  var FLY_STEP = 2;                         // 相位速度（256 = 一圈 ⇒ 週期 128 幀）

  // 沒有 engine/shmup.js 時的正弦表退路（8.8 定點、一圈 256）
  var SIN = (NES.SH && NES.SH.SIN) || (function () {
    var t = new Int16Array(256), i;
    for (i = 0; i < 256; i++) t[i] = Math.round(Math.sin(i * Math.PI / 128) * 256);
    return t;
  })();
  function sin8(a) { return SIN[a & 255]; }

  // 沒有 NES.SH.Pool 時的退路（同樣是預先配置、零 GC）
  function makePool(n, factory) {
    if (NES.SH && NES.SH.Pool) return NES.SH.Pool(n, factory);
    var items = [], i;
    for (i = 0; i < n; i++) { items.push(factory(i)); items[i].alive = false; }
    return {
      items: items, size: n, count: 0,
      alloc: function () {
        for (var j = 0; j < n; j++) if (!items[j].alive) { items[j].alive = true; this.count++; return items[j]; }
        return null;
      },
      free: function (o) { if (o && o.alive) { o.alive = false; this.count--; return true; } return false; },
      each: function (fn) {
        for (var j = 0; j < n; j++) if (items[j].alive) { fn(items[j], j); if (!items[j].alive) this.count--; }
      },
      freeAll: function () { for (var j = 0; j < n; j++) items[j].alive = false; this.count = 0; }
    };
  }

  function newEnemy() {
    return {
      kind: 'roller', alive: false,
      x: 0, y: 0, w: 14, h: 14,
      px: FX.Vec(0), py: FX.Vec(0), vx: FX.Acc(0), vy: FX.Acc(0),
      dir: -1, onGround: false, edge: false,
      stompable: true, squash: 0, stun: 0, dying: false,
      t: 0, phase: 0, baseY: 0, amp: FLY_AMP,
      score: 100, hp: 1, src: null,
      // 契約：敵人物件自帶 hit()；main.js 的通用碰撞路徑是
      //   `if (e.stomp) e.stomp(g); else if (e.hit) e.hit(1, g); else e.alive = false;`
      // 沒有這兩個方法的話 main 會直接 `alive = false`，壓扁 / 暈眩就整個消失了。
      stomp: function () { return stomp(this); },
      hit: function () { return kill(this); }
    };
  }

  var pool = makePool(POOL_SIZE, newEnemy);
  var level = null, sorted = [], ptr = 0, tiles = null, camXCache = 0;

  /* R3 star-w2：敵人種類登記表。
   * W1 的三種（roller / bouncer / flyer）維持原本的硬寫分支不動；新世界的敵人用
   *   ST.Enemies.register('bat', { w, h, stompable, score, setup, step, art|draw })
   * 掛進來（見 games/star/enemies_w2.js），本檔不必再長。 */
  var EXT = {};

  // ---- 磚索引快取（ST.World.bind 之後才有值）------------------------------
  function ensureTiles() {
    if (tiles) return tiles;
    var W = ST.World;
    if (!W || !W.bound) return null;
    tiles = {
      roller: [[W.oam16('W_ROLL0_L'), W.oam16('W_ROLL0_R')], [W.oam16('W_ROLL1_L'), W.oam16('W_ROLL1_R')]],
      bouncer: [[W.oam16('W_BOUNCE0_L'), W.oam16('W_BOUNCE0_R')], [W.oam16('W_BOUNCE1_L'), W.oam16('W_BOUNCE1_R')]],
      flyer: [[W.oam16('W_FLY0_L'), W.oam16('W_FLY0_R')], [W.oam16('W_FLY1_L'), W.oam16('W_FLY1_R')]],
      squash: [W.oam16('W_SQUASH_L'), W.oam16('W_SQUASH_R')]
    };
    return tiles;
  }

  // ---- 地形查詢（優先用 g.solidAt，其次 level）----------------------------
  var solidFn = null;
  function kindAtPx(x, y) {
    if (!level) return 'none';
    return level.kindAt(x, y);
  }
  function blocked(x, y) {
    if (solidFn) return !!solidFn(x, y);
    return kindAtPx(x, y) === 'solid';
  }
  // 由上往下才擋的單向平台
  function floorAt(x, y, prevBottom) {
    var k = kindAtPx(x, y);
    if (k === 'solid') return true;
    if (k === 'oneway') return prevBottom <= ((y >> 3) << 3);
    return false;
  }

  // ============================================================ 生成
  function configure(e, kind, x, y, opt) {
    opt = opt || {};
    e.kind = kind;
    e.fragile = false;
    FX.vsetPx(e.px, x); FX.vsetPx(e.py, y);
    e.x = x | 0; e.y = y | 0;
    FX.aset(e.vx, 0); FX.aset(e.vy, 0);
    e.dir = opt.dir === undefined ? -1 : (opt.dir < 0 ? -1 : 1);
    e.edge = !!opt.edge;
    e.onGround = false; e.squash = 0; e.stun = 0; e.dying = false;
    e.t = 0; e.hp = opt.hp || 1;
    e.src = opt.src || null;
    e.amp = opt.amp === undefined ? FLY_AMP : opt.amp;
    e.phase = opt.phase || 0;
    e.baseY = y | 0;
    var ex = EXT[kind];
    if (ex) {
      e.w = ex.w || 14; e.h = ex.h || 14;
      e.stompable = ex.stompable !== false;
      e.score = ex.score || 100;
      e.fragile = !!ex.fragile;
      e.awake = false; e.t2 = 0; e.targetY = 0;
      if (ex.setup) ex.setup(e, opt, API);
      return e;
    }
    if (kind === 'roller') {
      e.w = 14; e.h = 14; e.stompable = true; e.score = 100;
      FX.aset(e.vx, e.dir * SPD_ROLL);
    } else if (kind === 'bouncer') {
      e.w = 14; e.h = 14; e.stompable = true; e.score = 200;
      e.t = opt.phase || 0;
    } else {                                    // flyer
      e.w = 14; e.h = 12; e.stompable = false; e.score = 200;
      FX.aset(e.vx, -SPD_FLY);
    }
    return e;
  }

  function spawn(kind, x, y, opt) {
    var e = pool.alloc();
    if (!e) return null;                        // 沒槽就不生成（真機做法）
    return configure(e, kind, x, y, opt);
  }

  // ============================================================ 各型態 update
  function stepRoller(e) {
    var lead, foot;
    FX.aset(e.vx, e.dir * SPD_ROLL);
    // 水平：先試著走，撞牆就轉向
    FX.vadd(e.px, e.vx.v);
    e.x = FX.vpx(e.px);
    lead = (e.dir > 0) ? (e.x + e.w) : (e.x - 1);
    if (blocked(lead, e.y + 2) || blocked(lead, e.y + e.h - 2)) {
      e.dir = -e.dir;
      FX.vsetPx(e.px, e.x - e.dir * 1);        // 退出牆面（−dir 是原本的前進方向）
      e.x = FX.vpx(e.px);
      FX.aset(e.vx, e.dir * SPD_ROLL);
    } else if (e.edge && e.onGround) {
      // 坑邊不掉：前腳下方沒有地板就轉向
      foot = (e.dir > 0) ? (e.x + e.w) : (e.x - 1);
      if (!floorAt(foot, e.y + e.h + 1, e.y + e.h)) {
        e.dir = -e.dir;
        FX.aset(e.vx, e.dir * SPD_ROLL);
      }
    }
    fall(e);
  }

  function stepBouncer(e) {
    if (e.stun > 0) { e.stun--; fall(e); return; }
    e.t++;
    if (e.onGround && (e.t % BOUNCE_PERIOD) === 0) {
      FX.aset(e.vy, JUMP_VY);
      e.onGround = false;
    }
    fall(e);
  }

  function stepFlyer(e) {
    e.t++;
    e.phase = (e.phase + FLY_STEP) & 255;
    FX.vadd(e.px, -SPD_FLY);
    e.x = FX.vpx(e.px);
    e.y = e.baseY + ((sin8(e.phase) * e.amp) >> 8);
    FX.vsetPx(e.py, e.y);
  }

  // 共用重力 + 落地（單向平台只從上方擋）
  function fall(e) {
    var prevBottom = e.y + e.h, ny, foot;
    // 彈跳球的上升段用 gHold（與主角長按 A 的跳躍同一條弧線 ⇒ 4 格 = 64 px）
    FX.aadd(e.vy, (e.kind === 'bouncer' && e.vy.v < 0) ? GRAV_UP : GRAV);
    if (e.vy.v > MAXFALL) FX.aset(e.vy, MAXFALL);
    FX.vadd(e.py, e.vy.v);
    ny = FX.vpx(e.py);
    e.onGround = false;
    if (e.vy.v >= 0) {
      foot = ny + e.h;
      if (floorAt(e.x + 2, foot, prevBottom) || floorAt(e.x + e.w - 2, foot, prevBottom)) {
        ny = ((foot >> 3) << 3) - e.h;
        FX.vsetPx(e.py, ny);
        FX.aset(e.vy, 0);
        e.onGround = true;
      }
    } else if (blocked(e.x + 2, ny) || blocked(e.x + e.w - 2, ny)) {
      ny = (((ny >> 3) + 1) << 3);
      FX.vsetPx(e.py, ny);
      FX.aset(e.vy, 0);
    }
    e.y = ny;
  }

  function stepDying(e) {
    FX.aadd(e.vy, GRAV);
    FX.vadd(e.py, e.vy.v);
    FX.vadd(e.px, e.vx.v);
    e.x = FX.vpx(e.px); e.y = FX.vpx(e.py);
  }

  // ============================================================ 受擊
  function stomp(e) {
    if (!e || !e.alive || e.dying) return false;
    if (!e.stompable) return false;
    if (e.kind === 'bouncer') {                 // 踩了停 60 幀，不會死
      e.stun = STUN_FRAMES;
      e.t = 0;
      FX.aset(e.vy, 0);
      return true;
    }
    e.squash = SQUASH_FRAMES;                   // 岩球：壓扁 30 幀後消失
    FX.aset(e.vx, 0);
    e.stompable = false;
    return true;
  }
  function kill(e, dir) {                       // 死亡飛出（無敵星 / 魔王碎片 / 頂磚）
    if (!e || !e.alive || e.dying) return false;
    e.dying = true;
    e.stompable = false;
    FX.aset(e.vy, -FX.v88(3, 0));
    FX.aset(e.vx, (dir === undefined ? (e.dir || 1) : dir) * FX.v88(1, 0));
    return true;
  }
  function hit(e) { return kill(e); }

  function aabb(a, b) {
    return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
  }
  function overlap(box) {
    var found = null;
    pool.each(function (e) {
      if (found || e.squash > 0 || e.dying) return;
      if (aabb(box, e)) found = e;
    });
    return found;
  }

  // ============================================================ 對外
  // 登記的敵人可以用的共用工具（不必自己重寫重力 / 地形查詢）
  var API = {
    FX: FX, SMB: SMB, sin8: sin8,
    fall: fall, blocked: blocked, kindAtPx: kindAtPx, floorAt: floorAt,
    spawn: function (kind, x, y, opt) { return spawn(kind, x, y, opt); },
    level: function () { return level; },
    camX: function () { return camXCache; },
    GRAV: GRAV, MAXFALL: MAXFALL, SPD_ROLL: SPD_ROLL, SPD_FLY: SPD_FLY
  };

  var Enemies = {
    KINDS: ['roller', 'bouncer', 'flyer'],
    EXT: EXT,
    API: API,
    register: function (kind, def) {
      EXT[kind] = def;
      if (Enemies.KINDS.indexOf(kind) < 0) Enemies.KINDS.push(kind);
      return def;
    },
    pool: pool,
    level: null,
    frame: 0,

    init: function (lv, opts) {
      opts = opts || {};
      level = lv || null;
      Enemies.level = level;
      solidFn = opts.solidAt || null;
      pool.freeAll();
      sorted = [];
      ptr = 0;
      Enemies.frame = 0;
      if (level && level.spawns) {
        sorted = level.spawns.slice().sort(function (a, b) { return a.x - b.x; });
      }
      return Enemies;
    },
    reset: function () { pool.freeAll(); ptr = 0; Enemies.frame = 0; return Enemies; },

    // 檢查點復活：相機左邊的視為已出過，右邊的重新排隊
    seek: function (camX) {
      pool.freeAll();
      ptr = 0;
      while (ptr < sorted.length && sorted[ptr].x < camX) ptr++;
      return ptr;
    },

    spawn: function (kind, x, y, opt) { return spawn(kind, x, y, opt); },
    // 測試用別名（與 R2 stage agent 的 spawnTest 同名慣例）
    spawnTest: function (kind, x, y, opt) { return spawn(kind, x, y, opt); },

    stomp: stomp,
    kill: kill,
    hit: hit,
    starKill: function (e) { return kill(e); },
    overlap: overlap,
    aabb: aabb,
    get count() { return pool.count; },
    // main.js 呼叫的是 `E.each(g, visit)`，本模組內部用 `each(fn)` ⇒ 兩種都吃。
    // 魔王與錘子也一起列舉（main 的碰撞迴圈只走 ST.Enemies），
    // star-hero 若改成自己處理魔王，設 `ST.Enemies.includeBoss = false` 即可關掉。
    includeBoss: true,
    each: function (a, b) {
      var fn = (typeof a === 'function') ? a : b;
      if (typeof fn !== 'function') return 0;
      var n = 0;
      pool.each(function (e) { fn(e); n++; });
      var B = ST.ActiveBoss || ST.Boss;
      if (Enemies.includeBoss && B && B.active && B.alive) { fn(B); n++; }
      if (Enemies.includeBoss && B && B.hammers) B.hammers.each(function (h) { fn(h); n++; });
      return n;
    },
    pending: function () { return sorted.length - ptr; },

    update: function (g) {
      g = g || {};
      Enemies.frame++;
      var camX = (g.camX === undefined) ? camXCache : g.camX;
      camXCache = camX;
      if (g.level && g.level !== level) { level = g.level; Enemies.level = level; }
      if (g.solidAt) solidFn = g.solidAt;

      // ① 出畫面右 16 px 就啟動
      var edge = camX + 256 + SPAWN_MARGIN, s;
      while (ptr < sorted.length && sorted[ptr].x <= edge) {
        s = sorted[ptr++];
        spawn(s.kind, s.x, s.y, s);
      }

      // ② 逐隻推進
      pool.each(function (e) {
        if (e.dying) {
          stepDying(e);
          if (e.y > WORLD_BOTTOM) e.alive = false;
          return;
        }
        if (e.squash > 0) {
          e.squash--;
          if (e.squash === 0) { e.alive = false; return; }
          fall(e);
          return;
        }
        var ex2 = EXT[e.kind];
        if (ex2) ex2.step(e, g, API);
        else if (e.kind === 'roller') stepRoller(e);
        else if (e.kind === 'bouncer') stepBouncer(e);
        else stepFlyer(e);

        if (e.y > WORLD_BOTTOM || e.x + e.w < camX - DESPAWN_LEFT) { e.alive = false; return; }
      });

      // ③ 主角碰撞（給了 callback 才做；star-hero 想自己算就別傳）
      if (g.hero && (g.onStomp || g.onHurt || g.onStar)) collideHero(g);
      return pool.count;
    },

    draw: function (oam) {
      if (!oam || !oam.add) return 0;
      var T = ensureTiles();
      if (!T) return 0;
      var n = 0, cam = camXCache;
      pool.each(function (e) {
        var prio = (e.squash > 0 || e.dying) ? 4 : 3;
        var ex = EXT[e.kind];
        if (ex && e.squash <= 0) {                     // R3 star-w2 的敵人自己畫
          if (typeof ex.draw === 'function') { n += ex.draw(e, oam, cam, prio); return; }
          var p2 = ex.art(e);
          var pal2 = (ex.pal === undefined) ? 3 : ex.pal;
          // 16×16 水平翻轉 = 兩塊**各自翻 + 左右對調**（只翻不調會把左右半邊接反）
          var fl = !!p2[2];
          oam.add({ x: e.x - 1 - cam, y: e.y - 2, tile: fl ? p2[1] : p2[0], pal: pal2, prio: prio, flipH: fl });
          oam.add({ x: e.x + 7 - cam, y: e.y - 2, tile: fl ? p2[0] : p2[1], pal: pal2, prio: prio, flipH: fl });
          n += 2;
          return;
        }
        var pal = (e.kind === 'flyer') ? 3 : 2;
        var sx = e.x - 1 - cam, sy = e.y - 2, pair;
        if (e.squash > 0) pair = T.squash;
        else pair = (T[e.kind] || T.roller)[(e.t >> 3) & 1];
        oam.add({ x: sx, y: sy, tile: pair[0], pal: pal, prio: prio });
        oam.add({ x: sx + 8, y: sy, tile: pair[1], pal: pal, prio: prio });
        n += 2;
      });
      return n;
    },

    // 除錯 / 測試快照
    state: function () {
      var out = [];
      pool.each(function (e) {
        out.push({
          kind: e.kind, x: e.x, y: e.y, dir: e.dir, onGround: e.onGround,
          stompable: e.stompable, squash: e.squash, stun: e.stun, dying: e.dying,
          vx: e.vx.v, vy: e.vy.v, phase: e.phase, baseY: e.baseY
        });
      });
      return { count: pool.count, pending: sorted.length - ptr, frame: Enemies.frame, list: out };
    },

    CONST: {
      SPD_ROLL: SPD_ROLL, SPD_FLY: SPD_FLY, GRAV: GRAV, JUMP_VY: JUMP_VY,
      GRAV_UP: GRAV_UP, BOUNCE_PERIOD: BOUNCE_PERIOD, STUN_FRAMES: STUN_FRAMES, SQUASH_FRAMES: SQUASH_FRAMES,
      FLY_AMP: FLY_AMP, FLY_STEP: FLY_STEP, POOL_SIZE: POOL_SIZE, SPAWN_MARGIN: SPAWN_MARGIN
    }
  };

  function collideHero(g) {
    var h = g.hero;
    var box = { x: h.x, y: h.y, w: h.w || 12, h: h.h || 22 };
    pool.each(function (e) {
      if (e.dying || e.squash > 0 || e.stun > 0 && false) return;
      if (!aabb(box, e)) return;
      if (h.star || h.invincible) { kill(e); if (g.onStar) g.onStar(e); return; }
      // 由上往下、且腳落在敵人上緣 8 px 內 ⇒ 踩
      var falling = (h.vy === undefined) ? true : (h.vy > 0);
      var footIn = (box.y + box.h) - e.y <= 10;
      if (falling && footIn && e.stompable) {
        stomp(e);
        if (g.onStomp) g.onStomp(e);
      } else if (!(h.inv > 0) && !(h.star > 0)) {
        if (g.onHurt) g.onHurt(e);
        if (e.fragile) e.alive = false;
      }
    });
  }

  ST.Enemies = Enemies;
})();

</script>
<script>/* games/star/enemies_w2.js */
/*
 * games/star/enemies_w2.js — 《星塵勇者》世界 2「熔岩礦坑」的三種新敵 + 火球
 * ---------------------------------------------------------------------------
 * 擁有者：star-w2 agent ｜ 依賴：games/star/enemies.js（ST.Enemies.register / API）、chr_w2.js
 * 契約：docs/TASKS.md「R3 star W2」
 *
 *   ④ bat     礦坑蝙蝠   倒掛天花板，主角進入 72 px 內才醒 → 俯衝到主角高度後平飛。**可踩**
 *              （研究 03/04 惡魔城「蝙蝠」：靜止 → 觸發 → 一次性軌跡，可讀、可預判）
 *   ⑤ armor   護甲礦兵   走路 0.5 px/幀、坑邊會轉向；頭上整排尖刺 ⇒ **不可踩**
 *              （研究 04 §2「必須用別的手段處理的敵人」：逼玩家繞路或吃無敵星）
 *   ⑥ spitter 岩漿噴吐者 固定不動，每 100 幀朝主角吐一顆拋物線火球。**可踩**
 *   ⑦ fire    火球       一次性投射物（碰到就消失），重力 0.25 px/幀²
 *
 * 全部走 `ST.Enemies.register()`，W1 的三種敵人一行都沒動。
 */
(function () {
  'use strict';
  var ST = window.ST = window.ST || {};
  var NES = window.NES = window.NES || {};
  var E = ST.Enemies;
  if (!E || !E.register) throw new Error('games/star/enemies_w2.js 需要 games/star/enemies.js（R3 版，有 register）');
  var FX = NES.FX, SMB = FX.SMB;

  var BAT_WAKE = 72;                       // 主角進入 72 px 才醒（預警距離）
  var BAT_VX = SMB.enemyFast;              // 0.75 px/幀
  var BAT_VY = FX.v88(0, 192);             // 0.75 px/幀 俯衝
  var BAT_FLUT = 6;                        // 平飛後上下拍翅 ±6 px
  var ARM_VX = SMB.enemySlow;              // 0.5 px/幀
  var SPIT_PERIOD = 100;                   // 每 100 幀吐一顆
  var SPIT_RANGE = 152;                    // 主角在 152 px 內才吐
  var FIRE_VX = FX.v88(1, 64);             // 1.25 px/幀
  var FIRE_VY = -FX.v88(3, 0);             // 起飛 −3 px/幀
  // 重力是 **acc 單位**（1/16 vel/幀；SMB 的 gHold = 0x20 * 16 = 512 = 0.125 px/幀²）——
  // 不是 v88。用 v88(0,64) 會變成 0.0156 px/幀²（幾乎不落地）。
  var FIRE_G = FX.SMB.jump[0].gHold;       // 0.125 px/幀² ⇒ 拋物線約 48 幀 / 60 px

  var tiles = null;
  function T() {
    if (tiles) return tiles;
    var W = ST.World;
    if (!W || !W.bound) return null;
    tiles = {
      bat: [[W.oam16('W2_BAT0_L'), W.oam16('W2_BAT0_R')], [W.oam16('W2_BAT1_L'), W.oam16('W2_BAT1_R')]],
      arm: [[W.oam16('W2_ARM0_L'), W.oam16('W2_ARM0_R')], [W.oam16('W2_ARM1_L'), W.oam16('W2_ARM1_R')]],
      spit: [[W.oam16('W2_SPIT0_L'), W.oam16('W2_SPIT0_R')], [W.oam16('W2_SPIT1_L'), W.oam16('W2_SPIT1_R')]],
      fire: [W.oam16('W2_FIRE0'), W.oam16('W2_FIRE1')]
    };
    return tiles;
  }

  /* ------------------------------------------------------------------ bat */
  E.register('bat', {
    w: 14, h: 12, stompable: true, score: 200, pal: 3,
    setup: function (e, opt) {
      e.baseY = e.y;
      e.awake = false;
      e.dir = opt.dir === undefined ? -1 : (opt.dir < 0 ? -1 : 1);
      e.phase = opt.phase || 0;
      FX.aset(e.vx, 0); FX.aset(e.vy, 0);
    },
    step: function (e, g, api) {
      e.t++;
      var h = g && g.hero;
      if (!e.awake) {
        if (h && Math.abs((h.x + 6) - (e.x + 7)) <= BAT_WAKE) {
          e.awake = true;
          e.dir = (h.x < e.x) ? -1 : 1;
          e.targetY = h.y + 2;
          FX.aset(e.vx, e.dir * BAT_VX);
          FX.aset(e.vy, BAT_VY);
        }
        return;
      }
      FX.vadd(e.px, e.vx.v);
      e.x = FX.vpx(e.px);
      if (e.y < e.targetY) {
        FX.vadd(e.py, e.vy.v);
        e.y = FX.vpx(e.py);
      } else {
        e.phase = (e.phase + 4) & 255;
        e.y = e.targetY + ((api.sin8(e.phase) * BAT_FLUT) >> 8);
        FX.vsetPx(e.py, e.y);
      }
    },
    art: function (e) {
      var A = T(); if (!A) return [0, 0];
      var f = e.awake ? ((e.t >> 2) & 1) : 0;
      return [A.bat[f][0], A.bat[f][1], e.dir > 0];
    }
  });

  /* ---------------------------------------------------------------- armor */
  E.register('armor', {
    w: 14, h: 15, stompable: false, score: 300, pal: 3,
    setup: function (e, opt) {
      e.dir = opt.dir === undefined ? -1 : (opt.dir < 0 ? -1 : 1);
      e.edge = opt.edge === undefined ? true : !!opt.edge;   // 預設坑邊不掉（不會自己走進熔岩）
      FX.aset(e.vx, e.dir * ARM_VX);
    },
    step: function (e, g, api) {
      e.t++;
      FX.aset(e.vx, e.dir * ARM_VX);
      FX.vadd(e.px, e.vx.v);
      e.x = FX.vpx(e.px);
      var lead = (e.dir > 0) ? (e.x + e.w) : (e.x - 1);
      if (api.blocked(lead, e.y + 2) || api.blocked(lead, e.y + e.h - 2)) {
        e.dir = -e.dir;
        FX.vsetPx(e.px, e.x - e.dir);
        e.x = FX.vpx(e.px);
      } else if (e.edge && e.onGround) {
        var foot = (e.dir > 0) ? (e.x + e.w) : (e.x - 1);
        if (!api.floorAt(foot, e.y + e.h + 1, e.y + e.h)) e.dir = -e.dir;
      }
      api.fall(e);
    },
    art: function (e) {
      var A = T(); if (!A) return [0, 0];
      var f = (e.t >> 3) & 1;
      return [A.arm[f][0], A.arm[f][1], e.dir > 0];
    }
  });

  /* -------------------------------------------------------------- spitter */
  E.register('spitter', {
    w: 14, h: 14, stompable: true, score: 200, pal: 2,
    setup: function (e, opt) {
      e.dir = opt.dir === undefined ? -1 : (opt.dir < 0 ? -1 : 1);
      e.t2 = opt.phase | 0;
      FX.aset(e.vx, 0);
    },
    step: function (e, g, api) {
      e.t++; e.t2++;
      api.fall(e);
      var h = g && g.hero;
      if (!h) return;
      var dx = (h.x + 6) - (e.x + 7);
      e.dir = dx < 0 ? -1 : 1;
      if ((e.t2 % SPIT_PERIOD) !== 0) return;
      if (Math.abs(dx) > SPIT_RANGE) return;
      var f = api.spawn('fire', e.x + 3, e.y - 6, { dir: e.dir });
      if (f && g && g.sfx) g.sfx('bump');
    },
    art: function (e) {
      var A = T(); if (!A) return [0, 0];
      var f = ((e.t2 % SPIT_PERIOD) > SPIT_PERIOD - 20) ? 1 : 0;   // 吐之前 20 幀張口（預警）
      return [A.spit[f][0], A.spit[f][1], e.dir > 0];
    }
  });

  /* ----------------------------------------------------------------- fire */
  E.register('fire', {
    w: 8, h: 8, stompable: false, score: 0, fragile: true, pal: 2,
    setup: function (e, opt) {
      e.dir = opt.dir === undefined ? -1 : (opt.dir < 0 ? -1 : 1);
      FX.aset(e.vx, e.dir * FIRE_VX);
      FX.aset(e.vy, FIRE_VY);
    },
    step: function (e, g, api) {
      e.t++;
      FX.aadd(e.vy, FIRE_G);
      FX.vadd(e.px, e.vx.v);
      FX.vadd(e.py, e.vy.v);
      e.x = FX.vpx(e.px); e.y = FX.vpx(e.py);
      if (api.blocked(e.x + 4, e.y + 7) || api.blocked(e.x + 4, e.y)) e.alive = false;
    },
    draw: function (e, oam, cam, prio) {
      var A = T(); if (!A) return 0;
      oam.add({ x: e.x - cam, y: e.y - 4, tile: A.fire[(e.t >> 2) & 1], pal: 2, prio: prio });
      return 1;
    }
  });

  ST.EnemiesW2 = {
    KINDS: ['bat', 'armor', 'spitter', 'fire'],
    CONST: {
      BAT_WAKE: BAT_WAKE, BAT_VX: BAT_VX, BAT_VY: BAT_VY, BAT_FLUT: BAT_FLUT,
      ARM_VX: ARM_VX, SPIT_PERIOD: SPIT_PERIOD, SPIT_RANGE: SPIT_RANGE,
      FIRE_VX: FIRE_VX, FIRE_VY: FIRE_VY, FIRE_G: FIRE_G
    }
  };
})();

</script>
<script>/* games/star/boss.js */
/*
 * games/star/boss.js — 《星塵勇者》W1 魔王「鐵鎚王」（1-4 城堡盡頭的橋上）
 * ---------------------------------------------------------------------------
 * 擁有者：star-world agent ｜ 依賴：engine/fixed.js（NES.FX）、chr_world.js、levels_w1.js
 * 契約：docs/TASKS.md「R2b §契約 魔王」＋ 研究 04 §3（模式循環 / 預警幀 / 弱點窗口 / 競技場）
 *
 *   32×32、站在橋上。行為循環（研究 04 §3.1 Pattern Loop）：
 *       walk（走近主角，最多 90 幀）→ jump（vy = −5 px/幀）→ throw（3 顆錘子、間隔 20 幀）
 *       → rest（40 幀，**弱點窗口**）→ 回到 walk
 *   打倒方式二選一：
 *       ① 踩頭 3 次（每次擊退 + 無敵 60 幀，研究 04 §3.3）
 *       ② 主角碰到橋尾的斧頭 → 橋斷、魔王掉進熔岩（研究 03/01 ⑤ 的兩種解法）
 *   死亡 → `ST.Boss.dead = true`（main 進 clear）。
 *
 * ── main.js 的用法 ────────────────────────────────────────────────────────
 *   ST.Boss.init(level);                       // 進 1-4 時
 *   ST.Boss.update({ hero, camX, level, onStomp, onHurt, onAxe, onDie });
 *   ST.Boss.draw(oam);                         // 魔王 prio 3、錘子 prio 2
 *   if (ST.Boss.dead) → STAGE CLEAR
 */
(function () {
  'use strict';
  var ST = window.ST = window.ST || {};
  var NES = window.NES = window.NES || {};
  var FX = NES.FX;
  if (!FX) throw new Error('games/star/boss.js 需要 engine/fixed.js');
  var SMB = FX.SMB;

  var W = 28, H = 30;                      // 碰撞框（精靈 32×32，四周各留一點）
  var SPD_WALK = SMB.enemySlow;            // 0.5 px/幀
  var JUMP_VY = -FX.v88(5, 0);             // 跳 vy = −5 px/幀
  var GRAV = SMB.jump[0].gFall;
  var MAXFALL = FX.v88(4, 0);
  var MAX_HP = 3;
  var INV_FRAMES = 60;                     // 踩到後無敵 60 幀
  var KNOCKBACK = 16;                      // 擊退 16 px
  var WALK_FRAMES = 90;
  var THROW_GAP = 20;                      // 3 顆錘子間隔 20 幀
  var THROW_N = 3;
  var REST_FRAMES = 40;
  var HAMMER_N = 6;
  var HAM_VX = FX.v88(1, 128);             // 1.5 px/幀（朝主角）
  var HAM_VY = -FX.v88(4, 0);
  var HAM_GRAV = FX.v88(0, 64);            // 0.25 px/幀²
  var WORLD_BOTTOM = 30 * 8 + 64;
  var ACTIVATE_AHEAD = 48;                 // 相機右緣再往右 48 px 就啟動

  function newHammer() {
    var h = {
      alive: false, kind: 'hammer', stompable: false,
      x: 0, y: 0, w: 8, h: 12, px: FX.Vec(0), py: FX.Vec(0), vx: FX.Acc(0), vy: FX.Acc(0), t: 0
    };
    h.hit = function () { h.alive = false; return true; };
    return h;
  }
  function makePool(n, f) {
    if (NES.SH && NES.SH.Pool) return NES.SH.Pool(n, f);
    var items = [], i;
    for (i = 0; i < n; i++) { items.push(f(i)); items[i].alive = false; }
    return {
      items: items, size: n, count: 0,
      alloc: function () { for (var j = 0; j < n; j++) if (!items[j].alive) { items[j].alive = true; this.count++; return items[j]; } return null; },
      free: function (o) { if (o && o.alive) { o.alive = false; this.count--; return true; } return false; },
      each: function (fn) { for (var j = 0; j < n; j++) if (items[j].alive) { fn(items[j], j); if (!items[j].alive) this.count--; } },
      freeAll: function () { for (var j = 0; j < n; j++) items[j].alive = false; this.count = 0; }
    };
  }

  var hammers = makePool(HAMMER_N, newHammer);
  var level = null, tiles = null, camXCache = 0, bridgeCols = null, lastHero = null;

  // 主角腳下的欄（拆橋時要留著，否則碰到斧頭就等於踩空掉熔岩）
  function keepColOf(hero) {
    if (!hero) return null;
    return ((hero.x + ((hero.w || 12) >> 1)) >> 3);
  }

  var px = FX.Vec(0), py = FX.Vec(0), vx = FX.Acc(0), vy = FX.Acc(0);

  function ensureTiles() {
    if (tiles) return tiles;
    var Wd = ST.World;
    if (!Wd || !Wd.bound) return null;
    function quad(p) {
      return [
        [Wd.oam16(p + '_C0T'), Wd.oam16(p + '_C1T'), Wd.oam16(p + '_C2T'), Wd.oam16(p + '_C3T')],
        [Wd.oam16(p + '_C0B'), Wd.oam16(p + '_C1B'), Wd.oam16(p + '_C2B'), Wd.oam16(p + '_C3B')]
      ];
    }
    tiles = {
      stand: quad('W_BOSS_ST'), jump: quad('W_BOSS_JP'),
      throw0: quad('W_BOSS_T0'), throw1: quad('W_BOSS_T1'),
      ham: [Wd.oam16('W_HAM0'), Wd.oam16('W_HAM1')]
    };
    return tiles;
  }

  function kindAt(x, y) { return level ? level.kindAt(x, y) : 'none'; }
  function solid(x, y) { return kindAt(x, y) === 'solid'; }

  function aabb(a, b) {
    return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
  }

  var Boss = {
    // 契約欄位
    active: false, dead: false, alive: false, stompable: true, kind: 'boss',
    hp: MAX_HP, x: 0, y: 0, w: W, h: H,
    phase: 'idle',                          // idle | walk | jump | throw | rest | falling | dead
    facing: -1, inv: 0, t: 0, throws: 0, frame: 0,
    axe: null, bridgeBroken: false, keptCol: -99,
    hammers: hammers,
    MAX_HP: MAX_HP,

    init: function (lv, opts) {
      opts = opts || {};
      level = lv || null;
      Boss.reset();
      if (!level || !level.boss) { Boss.spawnX = -1; return Boss; }
      Boss.spawnX = level.boss.x;
      Boss.spawnY = level.boss.y;
      // 橋的欄位（斧頭機關要整排拆掉）
      bridgeCols = [];
      var c, r, T = ST.TILE;
      for (c = 0; c < level.cols; c++) {
        for (r = 0; r < level.rows; r++) {
          if (level.tileAt(c, r) === T.BRIDGE) { bridgeCols.push(c * level.rows + r); break; }
        }
      }
      if (level.axe) {
        Boss.axe = { x: level.axe.col * 8, y: level.axe.row * 8, w: 8, h: 8, taken: false, col: level.axe.col, row: level.axe.row };
      }
      return Boss;
    },

    reset: function () {
      hammers.freeAll();
      Boss.active = false; Boss.dead = false; Boss.alive = false;
      Boss.hp = MAX_HP; Boss.phase = 'idle'; Boss.facing = -1;
      Boss.inv = 0; Boss.t = 0; Boss.throws = 0; Boss.frame = 0;
      Boss.bridgeBroken = false;
      if (Boss.axe) Boss.axe.taken = false;
      FX.aset(vx, 0); FX.aset(vy, 0);
      return Boss;
    },

    // 給 main.js 的通用碰撞 / 除錯用
    box: function () { return Boss.active && Boss.alive ? { x: Boss.x, y: Boss.y, w: W, h: H } : null; },
    hit: function () { return Boss.stomp(); },

    // 手動放置（測試 / 其他關重用）
    spawn: function (x, y) {
      FX.vsetPx(px, x); FX.vsetPx(py, y);
      Boss.x = x | 0; Boss.y = y | 0;
      Boss.active = true; Boss.alive = true; Boss.dead = false;
      Boss.hp = MAX_HP; Boss.phase = 'walk'; Boss.t = 0; Boss.throws = 0; Boss.inv = 0;
      FX.aset(vx, 0); FX.aset(vy, 0);
      return Boss;
    },

    // 踩頭：擊退 + 無敵 60 幀；第 3 次 → 死
    stomp: function () {
      if (!Boss.active || Boss.dead || Boss.inv > 0 || Boss.phase === 'falling') return false;
      Boss.hp--;
      Boss.inv = INV_FRAMES;
      FX.vsetPx(px, Boss.x + Boss.facing * -KNOCKBACK);   // 往「背對主角」的方向退
      Boss.x = FX.vpx(px);
      if (Boss.hp <= 0) { Boss.die(); return true; }
      Boss.phase = 'rest'; Boss.t = 0;
      return true;
    },

    // 斧頭：橋斷 → 魔王掉落
    // hitAxe(hero)：拆橋時**保留主角腳下那幾欄**（hero 省略時看 update() 記下的最後位置）。
    // 斧頭本身已經移到橋外的實地（1-4 col 246），這裡是第二道保險：
    // 萬一以後有人把斧頭放回橋上，也不會「碰到斧頭 = 掉熔岩」。
    hitAxe: function (hero) {
      if (!Boss.axe || Boss.axe.taken) return false;
      Boss.axe.taken = true;
      Boss.breakBridge(keepColOf(hero || lastHero));
      Boss.die();
      return true;
    },

    breakBridge: function (keepCol) {
      if (Boss.bridgeBroken || !level || !bridgeCols) return false;
      var i, id, c, r, keep = (keepCol === undefined || keepCol === null) ? -99 : (keepCol | 0);
      for (i = 0; i < bridgeCols.length; i++) {
        id = bridgeCols[i]; c = (id / level.rows) | 0; r = id % level.rows;
        if (c >= keep - 1 && c <= keep + 1) continue;      // 主角站的那一欄與左右各一欄留著
        level.setTile(c, r, ST.TILE.EMPTY);
      }
      if (Boss.axe && !(Boss.axe.col >= keep - 1 && Boss.axe.col <= keep + 1)) {
        level.setTile(Boss.axe.col, Boss.axe.row, ST.TILE.EMPTY);
      }
      Boss.bridgeBroken = true;
      Boss.keptCol = keep;
      return true;
    },

    die: function () {
      if (Boss.dead || Boss.phase === 'falling') return false;
      if (!Boss.active) {            // 還沒現身就被斧頭解決 ⇒ 直接就位再墜落
        FX.vsetPx(px, Boss.spawnX); FX.vsetPx(py, Boss.spawnY);
        Boss.x = Boss.spawnX | 0; Boss.y = Boss.spawnY | 0;
        Boss.active = true; Boss.alive = true;
      }
      Boss.hp = 0;
      Boss.phase = 'falling';
      Boss.t = 0;
      Boss.inv = 0;
      hammers.freeAll();
      FX.aset(vy, -FX.v88(2, 0));
      FX.aset(vx, 0);
      Boss.alive = false;               // 墜落中不再吃碰撞（仍然會畫）
      return true;
    },

    throwHammer: function (targetX) {
      var h = hammers.alloc();
      if (!h) return null;
      var sx = Boss.x + (Boss.facing < 0 ? -4 : Boss.w - 4), sy = Boss.y - 6;
      FX.vsetPx(h.px, sx); FX.vsetPx(h.py, sy);
      h.x = sx; h.y = sy; h.t = 0;
      var dir = (targetX === undefined) ? Boss.facing : (targetX < Boss.x ? -1 : 1);
      FX.aset(h.vx, dir * HAM_VX);
      FX.aset(h.vy, HAM_VY);
      return h;
    },

    update: function (g) {
      g = g || {};
      Boss.frame++;
      var camX = (g.camX === undefined) ? camXCache : g.camX;
      camXCache = camX;
      if (g.level && g.level !== level) level = g.level;
      var hero = g.hero || null;
      if (hero) lastHero = hero;

      // ---- 斧頭（就算魔王還沒啟動也能碰）--------------------------------
      if (Boss.axe && !Boss.axe.taken && hero && aabb({ x: hero.x, y: hero.y, w: hero.w || 12, h: hero.h || 22 }, Boss.axe)) {
        Boss.hitAxe(hero);
        if (g.onAxe) g.onAxe();
        if (g.onDie) g.onDie('axe');
      }

      // ---- 啟動 -----------------------------------------------------------
      if (!Boss.active && !Boss.dead && Boss.phase === 'idle' && Boss.spawnX >= 0
          && camX + 256 + ACTIVATE_AHEAD >= Boss.spawnX) {
        Boss.spawn(Boss.spawnX, Boss.spawnY);
      }
      if (!Boss.active) return Boss.phase;

      if (Boss.inv > 0) Boss.inv--;
      Boss.t++;

      // ---- 狀態機 ---------------------------------------------------------
      if (Boss.phase === 'falling') {
        FX.aadd(vy, GRAV);
        FX.vadd(py, vy.v);
        Boss.y = FX.vpx(py);
        if (Boss.y > WORLD_BOTTOM) {
          Boss.active = false; Boss.alive = false; Boss.dead = true; Boss.phase = 'dead';
          if (g.onDie) g.onDie('fall');
        }
        stepHammers(g);
        return Boss.phase;
      }

      if (hero) Boss.facing = (hero.x < Boss.x) ? -1 : 1;

      switch (Boss.phase) {
        case 'walk':
          FX.aset(vx, Boss.facing * SPD_WALK);
          FX.vadd(px, vx.v);
          Boss.x = FX.vpx(px);
          if (solid(Boss.facing < 0 ? Boss.x - 1 : Boss.x + Boss.w, Boss.y + 8)) {
            FX.vsetPx(px, Boss.x - Boss.facing);
            Boss.x = FX.vpx(px);
          }
          if (Boss.t >= WALK_FRAMES) { Boss.phase = 'jump'; Boss.t = 0; FX.aset(vy, JUMP_VY); }
          break;
        case 'jump':
          FX.aset(vx, Boss.facing * (SPD_WALK >> 1));
          FX.vadd(px, vx.v);
          Boss.x = FX.vpx(px);
          if (landed()) { Boss.phase = 'throw'; Boss.t = 0; Boss.throws = 0; }
          break;
        case 'throw':
          FX.aset(vx, 0);
          if (Boss.throws < THROW_N && (Boss.t - 1) % THROW_GAP === 0) {
            Boss.throwHammer(hero ? hero.x : undefined);
            Boss.throws++;
          }
          if (Boss.throws >= THROW_N && Boss.t >= (THROW_N - 1) * THROW_GAP + THROW_GAP) {
            Boss.phase = 'rest'; Boss.t = 0;
          }
          landed();
          break;
        case 'rest':
          FX.aset(vx, 0);
          landed();
          if (Boss.t >= REST_FRAMES) { Boss.phase = 'walk'; Boss.t = 0; }
          break;
        default:
          break;
      }

      stepHammers(g);

      // ---- 主角碰撞（有 callback 才做）------------------------------------
      if (hero && (g.onStomp || g.onHurt)) {
        var hb = { x: hero.x, y: hero.y, w: hero.w || 12, h: hero.h || 22 };
        if (aabb(hb, Boss)) {
          var falling = (hero.vy === undefined) ? true : (hero.vy > 0);
          var footIn = (hb.y + hb.h) - Boss.y <= 12;
          if (falling && footIn) {
            if (Boss.inv <= 0) { Boss.stomp(); if (g.onStomp) g.onStomp(Boss); }
          } else if (!(hero.inv > 0)) {
            if (hero.star || hero.invincible) { /* 無敵星塵撞不死魔王，只是不受傷 */ }
            else if (g.onHurt) g.onHurt(Boss);
          }
        }
        hammers.each(function (h) {
          if (!aabb(hb, h)) return;
          h.alive = false;
          if (!(hero.inv > 0) && !(hero.star || hero.invincible) && g.onHurt) g.onHurt(h);
        });
      }
      if (Boss.dead && g.onDie && Boss.phase === 'dead') { /* 已回報 */ }
      return Boss.phase;
    },

    draw: function (oam) {
      if (!oam || !oam.add) return 0;
      var T = ensureTiles();
      if (!T) return 0;
      var n = 0, cam = camXCache, i;
      if (Boss.active) {
        // 無敵閃爍：每 4 幀跳一幀不畫（研究 04 §3.3 弱點窗口的可讀性）
        if (!(Boss.inv > 0 && (Boss.frame & 4))) {
          var art = T.stand;
          if (Boss.phase === 'jump' || Boss.phase === 'falling') art = T.jump;
          else if (Boss.phase === 'throw') art = (Boss.t % (THROW_GAP * 2) < THROW_GAP) ? T.throw1 : T.throw0;
          var bx = Boss.x - 2 - cam, by = Boss.y - 2;
          var flip = Boss.facing > 0;
          for (i = 0; i < 4; i++) {
            var col = flip ? (3 - i) : i;
            oam.add({ x: bx + i * 8, y: by, tile: art[0][col], pal: 3, prio: 3, flipH: flip });
            oam.add({ x: bx + i * 8, y: by + 16, tile: art[1][col], pal: 3, prio: 3, flipH: flip });
            n += 2;
          }
        }
      }
      hammers.each(function (h) {
        oam.add({ x: h.x - cam, y: h.y, tile: T.ham[(h.t >> 2) & 1], pal: 3, prio: 2 });
        n++;
      });
      return n;
    },

    state: function () {
      var hs = [];
      hammers.each(function (h) { hs.push({ x: h.x, y: h.y, vx: h.vx.v, vy: h.vy.v }); });
      return {
        active: Boss.active, dead: Boss.dead, hp: Boss.hp, phase: Boss.phase,
        x: Boss.x, y: Boss.y, inv: Boss.inv, t: Boss.t, throws: Boss.throws,
        facing: Boss.facing, bridgeBroken: Boss.bridgeBroken,
        axe: Boss.axe ? { x: Boss.axe.x, y: Boss.axe.y, taken: Boss.axe.taken } : null,
        hammers: hs
      };
    },

    CONST: {
      W: W, H: H, MAX_HP: MAX_HP, INV_FRAMES: INV_FRAMES, KNOCKBACK: KNOCKBACK,
      WALK_FRAMES: WALK_FRAMES, THROW_GAP: THROW_GAP, THROW_N: THROW_N,
      REST_FRAMES: REST_FRAMES, JUMP_VY: JUMP_VY, SPD_WALK: SPD_WALK, HAMMER_N: HAMMER_N
    }
  };

  function landed() {
    FX.aadd(vy, GRAV);
    if (vy.v > MAXFALL) FX.aset(vy, MAXFALL);
    var prevBottom = Boss.y + Boss.h;
    FX.vadd(py, vy.v);
    var ny = FX.vpx(py), foot = ny + Boss.h, on = false;
    if (vy.v >= 0) {
      var k1 = kindAt(Boss.x + 4, foot), k2 = kindAt(Boss.x + Boss.w - 4, foot);
      var hit1 = k1 === 'solid' || (k1 === 'oneway' && prevBottom <= ((foot >> 3) << 3));
      var hit2 = k2 === 'solid' || (k2 === 'oneway' && prevBottom <= ((foot >> 3) << 3));
      if (hit1 || hit2) {
        ny = ((foot >> 3) << 3) - Boss.h;
        FX.vsetPx(py, ny); FX.aset(vy, 0); on = true;
      }
    }
    Boss.y = ny;
    // 橋斷了（或掉出橋外）→ 魔王跟著掉
    if (!on && Boss.y > 30 * 8 - Boss.h - 8 && Boss.phase !== 'falling') Boss.die();
    return on;
  }

  function stepHammers(g) {
    hammers.each(function (h) {
      h.t++;
      FX.aadd(h.vy, HAM_GRAV);
      FX.vadd(h.px, h.vx.v);
      FX.vadd(h.py, h.vy.v);
      h.x = FX.vpx(h.px); h.y = FX.vpx(h.py);
      if (h.y > WORLD_BOTTOM || h.x < camXCache - 32 || h.x > camXCache + 288) h.alive = false;
    });
  }

  ST.Boss = Boss;
})();

<script>/* games/star/boss_w2.js */
/*
 * games/star/boss_w2.js — 《星塵勇者》世界 2 魔王「熔心巨像」（2-4 熔爐要塞盡頭）
 * ---------------------------------------------------------------------------
 * 擁有者：star-w2 agent ｜ 依賴：engine/fixed.js、chr_w2.js、levels_w1.js（ST.TILE / Level）
 * 契約：docs/TASKS.md「R3 star W2」＋ 研究 04 §3（模式循環 / 預警幀 / 弱點窗口 / 階段升級）
 *
 * 32×32、五格血、**三階段**（研究 04 §3.2「階段式魔王：同一套招，節奏與招數逐段加碼」）：
 *   phase 1（HP 5–4）：walk → jump → slam（落地兩道衝擊波）→ rest(60，弱點窗口)
 *   phase 2（HP 3–2）：walk 變快 → jump → slam → **spit**（3 顆火球）→ rest(42)
 *   phase 3（HP 1）  ：walk 最快 → jump → slam（衝擊波 ×2 速度）→ spit(4 顆) → rest(30)
 * 打法：踩頭 5 次（每次擊退 + 無敵 50 幀 + 階段重新開始）。
 * 死亡 → `ST.BossW2.dead = true`（main 進 clear）。
 *
 * ── main.js 的用法（與 ST.Boss 同介面）────────────────────────────────────
 *   ST.BossW2.init(level); ST.BossW2.update(g); ST.BossW2.draw(oam); ST.BossW2.dead
 */
(function () {
  'use strict';
  var ST = window.ST = window.ST || {};
  var NES = window.NES = window.NES || {};
  var FX = NES.FX;
  if (!FX) throw new Error('games/star/boss_w2.js 需要 engine/fixed.js');
  var SMB = FX.SMB;

  var W = 28, H = 30;
  var MAX_HP = 5;
  var INV_FRAMES = 50;
  var KNOCKBACK = 14;
  var JUMP_VY = -FX.v88(5, 0);
  var GRAV = SMB.jump[0].gFall;
  var MAXFALL = FX.v88(4, 0);
  var WORLD_BOTTOM = 30 * 8 + 64;
  var ACTIVATE_AHEAD = 48;

  // 依階段（1..3）的參數表 —— 研究 04 §3.2：同一套招、節奏加碼
  var PHASE = [
    null,
    { walk: SMB.enemySlow, walkFrames: 84, rest: 60, spit: 0, waveVx: FX.v88(1, 128), slam: 30 },
    { walk: SMB.enemyFast, walkFrames: 70, rest: 42, spit: 3, waveVx: FX.v88(2, 0), slam: 26 },
    { walk: FX.v88(1, 0), walkFrames: 56, rest: 30, spit: 4, waveVx: FX.v88(2, 128), slam: 22 }
  ];
  var SPIT_GAP = 20;
  var SHOT_N = 8;
  var SHOT_VY = -FX.v88(3, 0);
  var SHOT_G = SMB.jump[0].gHold;          // acc 單位（0.125 px/幀²），不是 v88

  function newShot() {
    var s = {
      alive: false, kind: 'fire', stompable: false, wave: false,
      x: 0, y: 0, w: 8, h: 10,
      px: FX.Vec(0), py: FX.Vec(0), vx: FX.Acc(0), vy: FX.Acc(0), t: 0
    };
    s.hit = function () { s.alive = false; return true; };
    return s;
  }
  function makePool(n, f) {
    if (NES.SH && NES.SH.Pool) return NES.SH.Pool(n, f);
    var items = [], i;
    for (i = 0; i < n; i++) { items.push(f(i)); items[i].alive = false; }
    return {
      items: items, size: n, count: 0,
      alloc: function () { for (var j = 0; j < n; j++) if (!items[j].alive) { items[j].alive = true; this.count++; return items[j]; } return null; },
      free: function (o) { if (o && o.alive) { o.alive = false; this.count--; return true; } return false; },
      each: function (fn) { for (var j = 0; j < n; j++) if (items[j].alive) { fn(items[j], j); if (!items[j].alive) this.count--; } },
      freeAll: function () { for (var j = 0; j < n; j++) items[j].alive = false; this.count = 0; }
    };
  }

  var level = null, tiles = null, camXCache = 0;
  var px = FX.Vec(0), py = FX.Vec(0), vx = FX.Acc(0), vy = FX.Acc(0);

  function ensureTiles() {
