<!-- ===== engine（契約載入順序；缺檔不致命，nes.js 會用 stub 頂替） ===== -->
<script>/* engine/palette.js */
/*!
 * engine/palette.js — NES 系統調色盤（64 色 NTSC RGB 近似表）
 * 專案：紅白機遊戲開發 / R1 核心引擎 ｜ agent: ppu ｜ 版本 1.0.0（2026-09-17）
 *
 * 來源（RGB 值）：
 *   docs/research/01_硬體規格與限制.md §3.4「NES 系統調色盤（常用 RGB 近似值）」
 *   原始出處：ROM Detectives Wiki 的 2C02 調色盤表（即 FCEUX / Nestopia 常見的預設 RGB 近似）。
 *   注意：2C02 輸出的是 NTSC 複合訊號，沒有唯一正解的 RGB；本表僅為工作用近似值。
 *
 * 規格要點（docs/research/01 §3.4、05 §1.1）：
 *   - 索引為 6 bit（$00–$3F），編碼 `VVHHHH`：低 4 bit 色相、高 2 bit 亮度。
 *   - $0F 為標準黑；$0D 是「blacker than black」，官方警告不要用 → FORBIDDEN。
 *   - $0E/$0F/$1D/$1E/$1F/$2E/$2F/$3E/$3F 實質同為黑（去重後約 54 色）。
 *
 * API（docs/TASKS.md「API 契約」）：
 *   NES.PALETTE            → 長度 64 的陣列，每項 [r, g, b]
 *   NES.PALETTE.FORBIDDEN  → [0x0D]
 *   NES.PALETTE.rgb(i)     → [r, g, b]（複本；i 超出 0..63 會 throw）
 *   NES.PALETTE.nearest(r, g, b) → 最接近的調色盤索引（自動跳過 FORBIDDEN）
 *   附加（非契約，便利用）：hex(i)、isForbidden(i)、assert(i)、SIZE、VERSION
 */
(function (global) {
  'use strict';
  var NES = global.NES = global.NES || {};

  // 依 $00..$3F 順序排列的 24-bit RGB。
  var HEX = [
    0x7C7C7C, 0x0000FC, 0x0000BC, 0x4428BC, 0x940084, 0xA80020, 0xA81000, 0x881400,
    0x503000, 0x007800, 0x006800, 0x005800, 0x004058, 0x000000, 0x000000, 0x000000,
    0xBCBCBC, 0x0078F8, 0x0058F8, 0x6844FC, 0xD800CC, 0xE40058, 0xF83800, 0xE45C10,
    0xAC7C00, 0x00B800, 0x00A800, 0x00A844, 0x008888, 0x000000, 0x000000, 0x000000,
    0xF8F8F8, 0x3CBCFC, 0x6888FC, 0x9878F8, 0xF878F8, 0xF85898, 0xF87858, 0xFCA044,
    0xF8B800, 0xB8F818, 0x58D854, 0x58F898, 0x00E8D8, 0x787878, 0x000000, 0x000000,
    0xFCFCFC, 0xA4E4FC, 0xB8B8F8, 0xD8B8F8, 0xF8B8F8, 0xF8A4C0, 0xF0D0B0, 0xFCE0A8,
    0xF8D878, 0xD8F878, 0xB8F8B8, 0xB8F8D8, 0x00FCFC, 0xF8D8F8, 0x000000, 0x000000
  ];

  var PALETTE = [];
  for (var i = 0; i < 64; i++) {
    var h = HEX[i];
    PALETTE.push([(h >> 16) & 0xFF, (h >> 8) & 0xFF, h & 0xFF]);
  }

  PALETTE.VERSION = '1.0.0';
  PALETTE.SIZE = 64;
  PALETTE.SOURCE = 'ROM Detectives Wiki 2C02 palette (via docs/research/01 §3.4)';
  PALETTE.FORBIDDEN = [0x0D]; // $0D = blacker than black，禁用

  PALETTE.isForbidden = function (i) {
    return PALETTE.FORBIDDEN.indexOf(i | 0) >= 0;
  };

  // 驗證色號：非 0..63 整數或禁用色 → throw。ppu.js 設調色盤時會呼叫。
  PALETTE.assert = function (i, where) {
    if (typeof i !== 'number' || (i | 0) !== i || i < 0 || i > 63) {
      throw new Error('NES.PALETTE: 色號必須是 0..63 的整數，收到 ' + i +
        (where ? ' (' + where + ')' : ''));
    }
    if (PALETTE.isForbidden(i)) {
      throw new Error('NES.PALETTE: $' + ('0' + i.toString(16).toUpperCase()).slice(-2) +
        ' 是禁用色（blacker than black）' + (where ? ' (' + where + ')' : ''));
    }
    return i;
  };

  PALETTE.rgb = function (i) {
    if (typeof i !== 'number' || (i | 0) !== i || i < 0 || i > 63) {
      throw new Error('NES.PALETTE.rgb: 索引必須是 0..63 的整數，收到 ' + i);
    }
    var c = PALETTE[i];
    return [c[0], c[1], c[2]];
  };

  PALETTE.hex = function (i) {
    var c = PALETTE.rgb(i);
    return '#' + ('00000' + ((c[0] << 16) | (c[1] << 8) | c[2]).toString(16).toUpperCase()).slice(-6);
  };

  // 最接近色（歐氏距離平方，跳過禁用色）。相同距離取索引小者。
  PALETTE.nearest = function (r, g, b) {
    var best = 0, bestD = Infinity;
    for (var i = 0; i < 64; i++) {
      if (PALETTE.isForbidden(i)) continue;
      var c = PALETTE[i];
      var dr = c[0] - r, dg = c[1] - g, db = c[2] - b;
      var d = dr * dr + dg * dg + db * db;
      if (d < bestD) { bestD = d; best = i; if (d === 0) break; }
    }
    return best;
  };

  NES.PALETTE = PALETTE;
})(typeof window !== 'undefined' ? window : this);

</script>
<script>/* engine/fixed.js */
/* engine/fixed.js — NES.FX：定點數工具（位置 1/16 px、速度 8.8）
 * R1 / agent core。classic script、IIFE、零相依。
 *
 * 單位系統（全部整數；命名與 docs/TASKS.md「API 契約」一致）
 * ┌──────────┬───────────────┬───────────────────────────────────────────┐
 * │ 名稱     │ 1 單位 =      │ 用途                                       │
 * ├──────────┼───────────────┼───────────────────────────────────────────┤
 * │ sub      │ 1/16 px       │ 位置（SUB = 16）                           │
 * │ vel      │ 1/256 px/幀   │ 速度 8.8（v88(hi,lo) = hi 整數 px + lo/256）│
 * │ acc      │ 1/4096 px/幀² │ 加速度（= 1/16 vel，ACC = 16）             │
 * └──────────┴───────────────┴───────────────────────────────────────────┘
 * 兩層換算都是「每 16 個小單位進位 1 個大單位」，所以累加一律用 >>4 / &15，
 * 負數用算術右移自然取 floor，餘數恆為 0..15，不會因正負號漂移。
 *
 * 與 SMB1 反組譯常數的對應（見下方 NES.FX.SMB）：
 *   SMB「速度值」1 單位 = 1/16 px/幀 = 16 vel
 *   SMB「加速度 / 摩擦」1 單位 = 1/256 速度值/幀 = 1/4096 px/幀² = 1 acc  ← 原始位元組可直接用
 *   SMB「重力值」1 單位 = 1/256 px/幀² = 1 vel/幀 = 16 acc
 */
(function (root) {
  'use strict';
  var NES = root.NES = root.NES || {};

  var SUB = 16;    // 位置：1 px = 16 sub
  var VEL = 256;   // 速度：1 px/幀 = 256 vel（8.8 的 .8）
  var ACC = 16;    // 加速度：1 vel/幀 = 16 acc（→ 1 px/幀² = 4096 acc）

  /* ---------- 位置換算 ---------- */
  function toSub(px) { return (px * SUB) | 0; }          // px → sub（截尾取整）
  function toPx(sub) { return (sub | 0) / SUB; }         // sub → px（唯一會回傳非整數的函式，顯示 / 除錯用）
  function floorPx(sub) { return (sub | 0) >> 4; }       // sub → px（向下取整，負數也正確）
  function ceilPx(sub) { return -((-(sub | 0)) >> 4); }
  function roundPx(sub) { return ((sub | 0) + 8) >> 4; }
  function subFrac(sub) { return (sub | 0) & 15; }       // 像素內的 1/16 餘數（0..15）

  /* ---------- 速度換算（8.8） ---------- */
  // v88(2, 128) = 2.5 px/幀 = 640；負速度傳負的 hi：v88(-2, 128) = -640
  function v88(hi, lo) {
    hi = hi | 0; lo = lo | 0;
    if (hi < 0) return -(((-hi) * VEL + (lo < 0 ? -lo : lo)) | 0);
    return (hi * VEL + lo) | 0;
  }
  function velToPx(v) { return (v | 0) / VEL; }                     // vel → px/幀
  function pxToVel(px) { return Math.round(px * VEL) | 0; }         // px/幀 → vel
  function accToPx(a) { return (a | 0) / (VEL * ACC); }             // acc → px/幀²
  function pxToAcc(px) { return Math.round(px * VEL * ACC) | 0; }   // px/幀² → acc
  function smbSpd(b) { return ((b | 0) * 16) | 0; }                 // SMB 速度值($xx) → vel
  function smbGrav(b) { return ((b | 0) * 16) | 0; }                // SMB 重力值($xx) → acc

  /* ---------- Vec：{sub, frac} 小物件，每幀零配置 ---------- */
  function Vec(px, frac) { return { sub: toSub(px || 0), frac: frac | 0 }; }
  function vecSub(sub, frac) { return { sub: sub | 0, frac: frac | 0 }; }
  function vadd(vec, v) {                    // 位置前進一幀，回傳新的 sub
    var f = vec.frac + (v | 0);
    var d = f >> 4;
    vec.frac = f - (d << 4);
    vec.sub = (vec.sub + d) | 0;
    return vec.sub;
  }
  function vsetPx(vec, px) { vec.sub = toSub(px); vec.frac = 0; return vec; }
  function vsetSub(vec, sub) { vec.sub = sub | 0; vec.frac = 0; return vec; }
  function vpx(vec) { return vec.sub >> 4; }
  function vpxf(vec) { return vec.sub / SUB; }

  /* ---------- Acc：{v, frac} 速度小物件（加速度累加用） ---------- */
  function Acc(v) { return { v: v | 0, frac: 0 }; }
  function aadd(av, a) {                     // 速度前進一幀，回傳新的 vel
    var f = av.frac + (a | 0);
    var d = f >> 4;
    av.frac = f - (d << 4);
    av.v = (av.v + d) | 0;
    return av.v;
  }
  function aset(av, v) { av.v = v | 0; av.frac = 0; return av; }
  // 朝 target 以 a（acc 單位）逼近並夾住，不會過衝
  function aapproach(av, target, a) {
    target = target | 0;
    if (av.v < target) { aadd(av, a); if (av.v > target) aset(av, target); }
    else if (av.v > target) { aadd(av, -(a | 0)); if (av.v < target) aset(av, target); }
    return av.v;
  }

  /* ---------- 相容別名（R1 fix1 定案：正式寫法是 Vec / Acc）----------
   * 舊契約 `addVel(posSub, v88) → {pos, frac}` 與舊實作 `addVel(posSub, v, frac) → int`
   * （餘數放在全域 `NES.FX.frac`）**都已作廢**：全域餘數在多實體（主角 + N 個敵人）
   * 之間會互相污染。正式寫法是把餘數放進物件本身：
   *     位置 `Vec{sub, frac}` + `vadd(vec, v)`　／　速度 `Acc{v, frac}` + `aadd(av, a)`
   * `addVel / addAcc` 保留為**明確版本的相容別名**（= vadd / aadd），沒有任何隱藏狀態。
   */
  function addVel(vec, v) {
    if (!vec || typeof vec !== 'object' || typeof vec.sub !== 'number') {
      throw new TypeError('NES.FX.addVel 已改為 addVel(vec, v)（vec = FX.Vec(px)）；' +
        '舊的 addVel(posSub, v, frac) 與全域 NES.FX.frac 已移除，見 docs/ENGINE_API.md §3');
    }
    return vadd(vec, v);
  }
  function addAcc(av, a) {
    if (!av || typeof av !== 'object' || typeof av.v !== 'number') {
      throw new TypeError('NES.FX.addAcc 已改為 addAcc(acc, a)（acc = FX.Acc(vel)）；' +
        '舊的 addAcc(v, a, frac) 已移除，見 docs/ENGINE_API.md §3');
    }
    return aadd(av, a);
  }

  /* ---------- 整數工具 ---------- */
  function clamp(v, lo, hi) { v = v | 0; lo = lo | 0; hi = hi | 0; return v < lo ? lo : (v > hi ? hi : v); }
  function sign(v) { v = v | 0; return v > 0 ? 1 : (v < 0 ? -1 : 0); }
  function abs(v) { v = v | 0; return v < 0 ? -v : v; }
  function absMax(v, m) { v = v | 0; m = m | 0; if (m < 0) m = -m; return v > m ? m : (v < -m ? -m : v); }
  function mulShr(a, b, s) { return ((a | 0) * (b | 0)) >> (s | 0); }  // 定點乘法

  /* ---------- SMB1 常數表 ----------
   * 來源：docs/research/03_經典遊戲深度解析/01_超級瑪利歐兄弟.md ②「速度與加速度」「跳躍」
   *       原始出處 doppelganger《A Comprehensive SMB Disassembly》(SMBDIS.ASM)
   * 每一欄都標原始位元組與換算後的 px 值，方便回頭核對。
   */
  var SMB = {
    src: 'docs/research/03_經典遊戲深度解析/01_超級瑪利歐兄弟.md（SMBDIS.ASM 反組譯）',

    // MaxRightXSpdData / MaxLeftXSpdData（原始為 1/16 px/幀 的速度值）
    maxRun:      smbSpd(0x28),   // $28 = 40 → 2.5  px/幀 = 640 vel
    maxWalk:     smbSpd(0x18),   // $18 = 24 → 1.5  px/幀 = 384 vel
    maxWater:    smbSpd(0x10),   // $10 = 16 → 1.0  px/幀 = 256 vel
    maxCutscene: smbSpd(0x0c),   // $0c = 12 → 0.75 px/幀 = 192 vel

    // FrictionData（原始為 1/256 速度值/幀 = 1 acc，數值可直接用）
    accRun:   0xe4,              // 228 → 0.05566 px/幀²（14.25 vel/幀）
    accWalk:  0x98,              // 152 → 0.03711 px/幀²（ 9.5  vel/幀）
    friction: 0xd0,              // 208 → 0.05078 px/幀²（13.0  vel/幀）
    turnShift: 1,                // 面向 ≠ 移動方向時 `asl` → 加速度 ×2（煞車/轉身快一倍）

    // 空中控制門檻：水平速度 ≥ $19（1.5625 px/幀）才沿用跑步上限與跑步加速度
    airRunSpeed: smbSpd(0x19),   // 400 vel

    /* 跳躍 5 段：依起跳瞬間的水平速度絕對值（vel）選段
     * belowSpeed = 該段的上界（最後一段為 Infinity）
     * vy0 = 起跳初速（vel，負 = 往上）；gHold/gFall = 按住 / 放開 A 的重力（acc）
     * h = 研究文件列的理論最高跳躍高度（px），僅供對照（離散積分會差 1~3 px）
     */
    jump: [
      { belowSpeed: smbSpd(0x09), vy0: -v88(4, 0), gHold: smbGrav(0x20), gFall: smbGrav(0x70), h: 64 },
      { belowSpeed: smbSpd(0x10), vy0: -v88(4, 0), gHold: smbGrav(0x20), gFall: smbGrav(0x70), h: 64 },
      { belowSpeed: smbSpd(0x19), vy0: -v88(4, 0), gHold: smbGrav(0x1e), gFall: smbGrav(0x60), h: 68 },
      { belowSpeed: smbSpd(0x1c), vy0: -v88(5, 0), gHold: smbGrav(0x28), gFall: smbGrav(0x90), h: 80 },
      { belowSpeed: Infinity,     vy0: -v88(5, 0), gHold: smbGrav(0x28), gFall: smbGrav(0x90), h: 80 }
    ],
    swim:      { vy0: -v88(2, 0), gHold: smbGrav(0x0d), gFall: smbGrav(0x0a) },
    whirlpool: { vy0: -v88(1, 0), gHold: smbGrav(0x04), gFall: smbGrav(0x09) },

    // 放開 A 後要離地 ≥ 1 px 才切成大重力（DiffToHaltJump）
    diffToHaltJump: SUB,         // 16 sub = 1 px

    // 敵人：NormalXSpdData（栗寶寶等）
    enemySlow: smbSpd(0x08),     // $f8 → 0.5  px/幀（表中為負方向，這裡存絕對值）
    enemyFast: smbSpd(0x0c),     // $f4 → 0.75 px/幀

    // 計時器節拍（幀）
    intervalTimer: 21,           // IntervalTimerControl：每 21 幀一跳（framerule）
    injuryFrames: 8 * 21,        // 168 幀 ≈ 2.80 秒
    starFrames: 35 * 21,         // 735 幀 ≈ 12.2 秒

    // 依水平速度取跳躍段
    jumpFor: function (absSpeedVel) {
      absSpeedVel = absSpeedVel < 0 ? -absSpeedVel : absSpeedVel;
      for (var i = 0; i < SMB.jump.length; i++) if (absSpeedVel < SMB.jump[i].belowSpeed) return SMB.jump[i];
      return SMB.jump[SMB.jump.length - 1];
    },

    /* ---- 起跳首幀的重力（R1 fix1 總控裁定；QA P1-4 / P1-5）----------------
     * 半隱式 Euler（每幀「先加重力、再位移」）會把跳躍高度系統性地低估半個
     * 重力步：靜止跳 62.00 px（文件 4 格 = 64）、全速跳 77.50 px（文件 5 格 = 80），
     * ⇒「剛好 4 格牆 / 5 格牆」的關卡會跳不過去。
     * 修正：**起跳後的第 1 幀只套用半格重力**（leapfrog / 中點積分），之後照常。
     *   離散積分和 = Σ(v0 − g(k+½)) = v0²/2g ＝ 連續解 ⇒ 靜止跳 64.00 px、全速跳 80.00 px（±0）。
     * skipGravityFirstFrame 三種值：
     *   true / 'half' 首幀半格重力 →  64.00 / 80.00 px（預設，對齊研究文件 03/01）
     *   'full'        首幀完全不加重力 → 66.00 / 82.50 px（超過文件 2 / 2.5 px）
     *   false         舊行為（純半隱式） → 62.00 / 77.50 px（比文件少 2 / 2.5 px）
     */
    skipGravityFirstFrame: true
  };

  /* ---------- 跳躍：core 與 demo 共用的唯一一套規則 ----------
   * 用法（見 games/demo/main.js stepPlayer）：
   *   var js = FX.SMB.jumpState(g.vy);               // 綁定自己的 Acc，零配置
   *   if (onGround && pressedA) FX.SMB.jumpStart(js, FX.abs(vx), py.sub);
   *   if (!onGround) FX.SMB.jumpGravity(js, aHeldNow, py.sub, MAX_FALL);
   *   FX.vadd(py, js.vy.v);                          // 先重力、再位移（半隱式）
   * 規則：① 依起跳瞬間 |vx| 取 5 段之一（jumpFor）
   *       ② 按住 A = gHold；放開 **且已離地 ≥ 1 px**（DiffToHaltJump）才切 gFall
   *       ③ 起跳首幀依 skipGravityFirstFrame 只套半格重力（見上）
   */
  function jumpState(vyAcc) {
    return {
      seg: SMB.jump[0],
      vy: vyAcc || Acc(0),
      fastFall: false,
      startSub: 0,
      first: false,
      skipFirst: SMB.skipGravityFirstFrame
    };
  }
  function jumpStart(js, absVxVel, pySub) {
    js.seg = SMB.jumpFor(absVxVel | 0);
    aset(js.vy, js.seg.vy0);
    js.fastFall = false;
    js.startSub = pySub | 0;
    js.first = true;
    return js;
  }
  // 重新設定垂直速度但不算「新的一次跳躍」（踩敵回彈、被彈飛…）
  function jumpBounce(js, vel, pySub) {
    aset(js.vy, vel | 0);
    js.fastFall = false;
    js.startSub = pySub | 0;
    js.first = false;
    return js;
  }
  function jumpGravity(js, aHeld, pySub, maxFall) {

/* engine/cpu_timing.js — NES.Timing：60.0988 Hz 固定步邏輯迴圈
 * R1 / agent core。classic script、IIFE、零相依。
 *
 * 原則：
 *   - 邏輯步長固定 1/hz，**不做 delta-time 補間**（位置永遠是整數 sub 的累加）。
 *   - rAF 迴圈用累加器；一次 rAF 最多補 3 幀，還有剩就直接丟掉（避免分頁回前景時暴衝）。
 *   - step(n) 同步跑 n 幀（不走 rAF），供 tools/test_*.py 與截圖使用。
 *   - 每幀順序：Input.poll() → update() → draw()（NES.Input 不存在就跳過 poll）。
 *   - budget 模擬 VBlank 的 PPU 寫入頻寬：NTSC VBlank ≈ 2273 cycle ≈ 160~200 bytes。

 *       'ppu'（預設）名稱表 / 屬性表 / 調色盤，limit = 160 byte（NTSC）

    if (res && res.frame) res = res.frame;
    if (!res) return 'lint: (無結果)';
    return 'lint ' + (res.ok ? 'PASS' : 'FAIL') + ' — 色數 ' + res.colors + '/' + res.maxColors +
      '、非法像素 ' + res.badPixels + '、超線 ' + (res.overLine ? res.overLine.length : 0) +
      (res.errors && res.errors.length ? '｜' + res.errors.join('；') : '');
  }

  var Lint = {
    strict: false,
    magenta: false,
    maxColors: 25,
    maxSpritesPerLine: 8,
    MAGENTA: MAGENTA,
    VISIBLE: { y0: 8, y1: 232 },  // 研究 01 §3.1：NTSC 電視只看得到中央 256×224
    frame: frame,
    oam: oam,
    check: check,
    summary: summary
  };
  NES.Lint = Lint;
})();

 *     關卡開始 play(level.music)（'ground' | 'cave' | 'sky' | 'castle'）、魔王 play('boss')、
 *     吃到無敵星 play('invincible')（8 秒 loop，結束後自己 play 回原曲）。

 *   title       speed 6 → 150.0 BPM，16 row/小節，8 小節 loop（fix2-star 補，qa2-star P2-2）
 *   ground      speed 5 + groove [5,6] → 每 row 平均 5.5 幀 = 163.6 BPM，16 row/小節，32 小節 loop
 *   cave        speed 9 → 100.0 BPM，16 row/小節，16 小節 loop
 *   sky         speed 4，24 row/小節（每拍 6 row = 三連音格）→ 150.0 BPM，16 小節 loop
 *   castle      speed 10 → 90.0 BPM，16 row/小節，16 小節 loop
 *   boss        speed 4 → 225.0 BPM，16 row/小節，16 小節 loop

 *   gameover    speed 9 × 20 row = 180 幀 ≈ 3.00 s（不 loop）

    var A = ['C', 'G', 'Am', 'F', 'C', 'G', 'F', 'C'];

    for (i = 0; i < 8; i++) b.bar(m[i], CH[A[i]].p2, CH[A[i]].tri, i === 7 ? dF : dB);          // A2

  /* ============================================================ 7. title */
  /* 《星塵序曲》C 大調、150 BPM（speed 6 × 16 row/小節）、**8 小節 loop** = 768 幀 ≈ 12.77 s。
     標題畫面專用的短曲：和聲進行 C – Am – F – G – C – Em – F – G7，
     前 4 小節是「四分音長音號角」（讓玩家讀完標題），後 4 小節轉成 8 分音的下行答句，
     最後一小節用 G7 的掛留把耳朵帶回開頭（研究 06 §2.8 order table 重用：8 小節只用 22 個 pattern）。
     p1 lead 號角 / p2 8 分琶音 stab / tri 八度跳躍低音 / noi 基本鼓 + 段末過門。 */

  function buildTitle() {
    var b = new Builder('星塵序曲（title）', 6, 16, null);

    var MELODY = [
      'E-5 -   -   -   G-5 -   -   -   C-6 -   -   -   G-5 -   -   -  ',   // 0  C
      'A-5 -   -   -   E-5 -   -   -   C-5 -   -   -   E-5 -   -   -  ',   // 1  Am
      'F-5 -   -   -   A-5 -   -   -   C-6 -   -   -   A-5 -   -   -  ',   // 2  F
      'G-5 -   -   -   B-5 -   -   -   D-6 -   -   -   B-5 -   -   -  ',   // 3  G
      'C-6 -   B-5 -   G-5 -   E-5 -   G-5 -   -   -   -   -   -   -  ',   // 4  C
      'E-5 -   G-5 -   B-5 -   G-5 -   E-5 -   -   -   -   -   -   -  ',   // 5  Em
      'F-5 -   A-5 -   C-6 -   A-5 -   F-5 -   -   -   -   -   -   -  ',   // 6  F
      'D-6 -   -   -   B-5 -   G-5 -   D-5 -   -   -   =   -   -   -  '    // 7  G7（掛留 → 回開頭）
    ];
    var ROOT = ['C-4', 'A-3', 'F-3', 'G-3', 'C-4', 'E-3', 'F-3', 'G-3'];
    var ARP = [MAJ, MIN, MAJ, MAJ, MAJ, MIN, MAJ, DOM7];
    var BASS = ['C-2', 'A-1', 'F-1', 'G-1', 'C-2', 'E-1', 'F-1', 'G-1'];
    var BASH = ['C-3', 'A-2', 'F-2', 'G-2', 'C-3', 'E-2', 'F-2', 'G-2'];

    // 三角波八度跳躍低音（研究 06 §2.6）：低 → 高 → 低 → 高，一小節 4 次
    function oct(lo, hi) {
      var s = '', i;
      for (i = 0; i < 4; i++) s += lo + ' -   ' + hi + ' -   ';
      return s;
    }

    var dA = b.add('noi', 'A', drm('k -   h -   s -   h -   k -   h -   s -   h -  '));
    var dB = b.add('noi', 'B', drm('k -   h -   s -   h -   k -   s -   s s   s h  '));

    var i;
    for (i = 0; i < 8; i++) {
      b.bar(
        b.add('p1', 'm' + i, mel(MELODY[i], 'lead', 14, 2)),
        b.add('p2', 'a' + i, stab(ROOT[i], ARP[i], 16, 2, 'stab', 10, 1)),
        b.add('tri', 'b' + i, mel(oct(BASS[i], BASH[i]), 'bass', 15, 0)),
        (i === 3 || i === 7) ? dB : dA
      );
    }
    return b.done(INST, 0, true);
  }

  /* ========================================== 7~9. clear / death / gameover */

  function buildClear() {                       // 180 幀 ≈ 3.00 s，不 loop
    var b = new Builder('過關（clear）', 6, 30, null);
    b.bar(
      b.add('p1', 'a', mel('C-5 -   E-5 -   G-5 -   C-6 -   -   -   G-5 -   C-6 -   -   -   E-6 -   -   -   D-6 -   C-6 -   -   -   -   -   -   -  ', 'bell', 15, 1)),

      b.add('tri', 'a', mel('C-3 -   -   -   -   -   C-3 -   -   -   G-2 -   C-3 -   -   -   C-3 -   -   -   G-2 -   C-3 -   -   -   -   -   -   -  ', 'bass', 15, 0)),
      b.add('noi', 'a', drm('c:12 -   -   -   -   -   -   -   -   -   -   -   -   -   -   -   s:10 -   s:12 -   s:14 -   -   -   -   -   -   -   -   -  '))
    );
    return b.done(INST, 0, false);
  }

  function buildDeath() {                       // 90 幀 ≈ 1.50 s，不 loop
    var b = new Builder('死亡（death）', 5, 18, null);
    b.bar(
      b.add('p1', 'a', mel('G-5 -   F#5 -   F-5 -   E-5 -   D#5 -   D-5 -   C#5 -   C-5 -   -   -  ', 'lead', 14, 2)),
      b.add('p2', 'a', mel('C-5 -   B-4 -   A#4 -   A-4 -   G#4 -   G-4 -   F#4 -   F-4 -   -   -  ', 'echo', 12, 0)),
      b.add('tri', 'a', mel('C-3 -   -   -   -   -   A-2 -   -   -   -   -   F-2 -   -   -   -   -  ', 'bass', 15, 0)),
      b.add('noi', 'a', drm('m:12 -   -   -   -   -   -   -   -   -   -   -   -   -   -   -   -   -  '))
    );
    return b.done(INST, 0, false);
  }

  function buildGameOver() {                    // 180 幀 ≈ 3.00 s，不 loop
    var b = new Builder('遊戲結束（gameover）', 9, 20, null);
    b.bar(
      b.add('p1', 'a', mel('A-4 -   -   -   G-4 -   -   -   F-4 -   -   -   E-4 -   -   -   -   -   -   -  ', 'organ', 14, 2, { vib: { rate: 4, depth: 4, delay: 16 } })),
      b.add('p2', 'a', mel('C-4 -   -   -   B-3 -   -   -   A-3 -   -   -   G#3 -   -   -   -   -   -   -  ', 'organ', 9, 0)),
      b.add('tri', 'a', mel('A-2 -   -   -   -   -   -   -   F-2 -   -   -   -   -   -   -   E-2 -   -   -  ', 'bass', 15, 0)),
      b.add('noi', 'a', drm('m:10 -   -   -   -   -   -   -   -   -   -   -   -   -   -   -   m:8 -   -   -  '))
    );

  /* =================================================================== 音效 */
  /* 全部原創。只搶 p2（方波 2）與 noi（雜訊）：p1 主旋律與三角波低音永遠不被打斷
     （研究 06 §1.6：三角波一斷整首會空掉）。上行 = 正面、下行 = 負面（§4.3）。 */

  // [音名, 幀數, 音量, 占空比] → 音效幀陣列；retrig = 每個音重觸發（打點感）
  function sq(list, retrig) {
    var out = [], i, j;
    for (i = 0; i < list.length; i++) {
      var e = list[i], f = { note: e[0] };
      if (e[2] !== undefined && e[2] !== null) f.vol = e[2];
      if (e[3] !== undefined && e[3] !== null) f.duty = e[3];
      if (retrig) f.retrigger = true;
      out.push(f);
      for (j = 1; j < (e[1] || 1); j++) out.push(null);
    }
    return out;
  }
  // [雜訊週期索引, 幀數, 音量, LFSR 模式]
  function nq(list) {
    var out = [], i, j;
    for (i = 0; i < list.length; i++) {
      var e = list[i], f = { note: e[0] };
      if (e[2] !== undefined && e[2] !== null) f.vol = e[2];
      if (e[3] !== undefined && e[3] !== null) f.duty = e[3];
      out.push(f);
      for (j = 1; j < (e[1] || 1); j++) out.push(null);
    }
    return out;
  }
  function fade(v0, n) {                    // 線性衰減尾巴 + 結束
    var out = [], i;
    for (i = 1; i <= n; i++) out.push({ vol: Math.max(0, Math.round(v0 * (1 - i / n))) });
    out.push({ off: true });
    return out;
  }
  function cat(a, b2) { return a.concat(b2); }

  var PRIORITY = {
    death: 9, goal: 8, oneup: 7, powerup: 6, hurt: 5, coin: 4, stomp: 3, jump: 2, bump: 1
  };

  var SFX = {
    // jump：方波 25% → 12.5% 的兩個八度上滑，12 幀（研究 06 §4.2「跳躍」）
    jump: {
      priority: PRIORITY.jump,
      data: {
        p2: cat(sq([['D-5', 1, 13, 1], ['G-5', 1], ['A#5', 1], ['D-6', 1], ['F-6', 1, 12, 0], ['G-6', 1, 11]]),

      data: {
        noi: cat(nq([[8, 1, 13, 0], [10, 1, 11], [12, 1, 8], [13, 1, 5], [14, 1, 2]]), [{ off: true }]),
        p2: cat(sq([['A-4', 1, 11, 2], ['F-4', 1], ['D-4', 1], ['A-3', 1, 8]]), fade(8, 4))

    },
    // coin：兩音上跳（E-6 → B-6，上行五度），第二音長衰減
    coin: {
      priority: PRIORITY.coin,
      data: {
        p2: cat(sq([['E-6', 3, 12, 1], ['B-6', 7, 13, 1]], true), fade(13, 11))
      }
    },
    // powerup：大三和弦上行琶音（兩個八度），每音 2 幀
    powerup: {
      priority: PRIORITY.powerup,
      data: {
        p2: cat(sq([['C-5', 2, 12, 1], ['E-5', 2], ['G-5', 2], ['C-6', 2],
                    ['E-6', 2], ['G-6', 2], ['C-6', 2], ['E-6', 2], ['G-6', 2, 11]], true), fade(11, 8))
      }
    },
    // hurt：方波 50% 半音下滑 13 音 + 一記雜訊（下行 = 負面）
    hurt: {
      priority: PRIORITY.hurt,
      data: {
        p2: cat(sq([['G-5', 1, 13, 2], ['F#5', 1], ['F-5', 1], ['E-5', 1], ['D#5', 1], ['D-5', 1],
                    ['C#5', 1], ['C-5', 1], ['B-4', 1, 11], ['A#4', 1], ['A-4', 1], ['G#4', 1, 9], ['G-4', 2]]),
                fade(9, 6)),
        noi: cat(nq([[6, 1, 8, 0], [8, 1, 5], [10, 1, 2]]), [{ off: true }])
      }
    },
    // bump：撞頭的悶響——雜訊最低的兩段週期、4 幀就收（不搶三角波，見檔頭）
    bump: {
      priority: PRIORITY.bump,
      data: {
        noi: cat(nq([[14, 1, 9, 0], [15, 1, 6], [15, 1, 3], [15, 1, 1]]), [{ off: true }])
      }
    },
    // goal：旗桿滑下——C 大調音階從 G-6 一路下行 15 音（每音 2 幀），最後收在 G-4
    goal: {
      priority: PRIORITY.goal,
      data: {
        p2: cat(sq([['G-6', 2, 13, 1], ['F-6', 2], ['E-6', 2], ['D-6', 2], ['C-6', 2], ['B-5', 2], ['A-5', 2],
                    ['G-5', 2], ['F-5', 2], ['E-5', 2], ['D-5', 2], ['C-5', 2], ['B-4', 2], ['A-4', 2], ['G-4', 4, 12]]),
                fade(12, 6))
      }
    },
    // oneup：上行三音（+ 一個收尾的八度），每音 5 幀
    oneup: {
      priority: PRIORITY.oneup,
      data: {
        p2: cat(sq([['G-5', 5, 12, 1], ['C-6', 5, 12], ['E-6', 5, 13], ['G-6', 6, 13]], true), fade(13, 8))
      }
    },
    // death：死亡的短音效版（完整的 1.5 秒 jingle 請用 play('death')）
    death: {
      priority: PRIORITY.death,
      data: {
        p2: cat(sq([['A-5', 2, 13, 1], ['E-5', 2], ['C-5', 2], ['A-4', 2], ['E-4', 2], ['C-4', 4, 12]], true),
                fade(12, 8)),
        noi: cat(nq([[4, 2, 10, 1], [8, 2, 8], [12, 2, 5], [14, 2, 2]]), [{ off: true }])
      }
    }
  };

  /* ================================================================ 曲目表 */

  var SONGS = {
    title: buildTitle(),
    ground: buildGround(),
    cave: buildCave(),
    sky: buildSky(),
    castle: buildCastle(),
    boss: buildBoss(),
    invincible: buildInvincible(),
    clear: buildClear(),
    death: buildDeath(),
    gameover: buildGameOver()
  };

  // 給 PROGRESS / 測試 / 離線渲染用的曲目資訊（BPM 由 speed 反算，groove 取平均）
  var INFO = {
    title:      { bpm: 150.0, rowsPerBeat: 4, bars: 8, mood: '明亮號角、期待', ch: 'p1 號角旋律 / p2 8 分琶音 / tri 八度低音 / noi 鼓 + 過門' },
    ground:     { bpm: 163.6, rowsPerBeat: 4, bars: 32, mood: '明亮跳躍', ch: 'p1 旋律 / p2 琶音 / tri 八度低音 / noi 鼓' },
    cave:       { bpm: 100.0, rowsPerBeat: 4, bars: 16, mood: '低沉稀疏、回音', ch: 'p1 稀疏旋律 / p2 延遲回音 / tri 半音符低音 / noi 悶響水滴' },
    sky:        { bpm: 150.0, rowsPerBeat: 6, bars: 16, mood: '輕快高音三連音', ch: 'p1 三連音琶音 / p2 長音和弦 / tri 四分低音 / noi 輕鼓' },
    castle:     { bpm: 90.0,  rowsPerBeat: 4, bars: 16, mood: '緊張半音、慢', ch: 'p1 半音風琴 / p2 減和弦長音 / tri 半音下行低音 / noi 低鳴' },
    boss:       { bpm: 225.0, rowsPerBeat: 4, bars: 16, mood: '快速下行動機', ch: 'p1 16 分下行 / p2 延遲回音 / tri 8 分踏板 / noi 疾走 16 分' },
    invincible: { bpm: 300.0, rowsPerBeat: 4, bars: 10, mood: '急促上行、無敵', ch: 'p1 半音推進琶音 / p2 和弦 / tri 8 分低音 / noi 16 分' },
    clear:      { bpm: 150.0, rowsPerBeat: 4, bars: 1.875, mood: '勝利號角', ch: 'p1 鐘聲 / p2 和聲 / tri 低音 / noi 鈸 + 滾奏' },
    death:      { bpm: 180.0, rowsPerBeat: 4, bars: 1.125, mood: '半音墜落', ch: 'p1 半音下行 / p2 低八度 / tri 下行低音 / noi 悶響' },
    gameover:   { bpm: 100.0, rowsPerBeat: 4, bars: 1.25, mood: '低沉終止', ch: 'p1 風琴 / p2 內聲部 / tri 低音 / noi 低鳴' }
  };
  (function () {                          // 補上實際長度（幀 / 秒），避免手寫算錯
    var HZ = 60.0988, k;
    for (k in SONGS) {
      if (!Object.prototype.hasOwnProperty.call(SONGS, k)) continue;
      var s = SONGS[k], rows = 0, i;
      for (i = 0; i < s.order.length; i++) rows += s.rows;
      var sp = s.groove ? (s.groove.reduce(function (a, v) { return a + v; }, 0) / s.groove.length) : s.speed;
      INFO[k] = INFO[k] || {};
      INFO[k].speed = s.speed;
      INFO[k].groove = s.groove;
      INFO[k].rows = s.rows;
      INFO[k].order = s.order.length;
      INFO[k].patterns = s.patterns.length;
      INFO[k].frames = Math.round(rows * sp);
      INFO[k].seconds = Math.round(rows * sp / HZ * 100) / 100;
      INFO[k].loop = s.playLoop;
    }
  })();

  /* ================================================================ 驗證用 */
  /* 不在載入時跑（遊戲不能因為音樂資料出錯而黑畫面）；tools / 測試腳本呼叫 ST.Audio.validate()。 */

  function validate() {
    var bad = [], k, i, t, TR = ['p1', 'p2', 'tri', 'noi', 'dmc'];
    var toMidi = (NES.Music && NES.Music.noteToMidi) ? NES.Music.noteToMidi : null;
    for (k in SONGS) {
      if (!Object.prototype.hasOwnProperty.call(SONGS, k)) continue;
      var s = SONGS[k];
      for (i = 0; i < s.patterns.length; i++) {
        for (t = 0; t < TR.length; t++) {
          var arr = s.patterns[i][TR[t]];
          if (!arr) continue;
          if (arr.length !== s.rows) bad.push(k + ' pattern#' + i + ' ' + TR[t] + ' 長度 ' + arr.length + ' ≠ rows ' + s.rows);
          for (var r = 0; r < arr.length; r++) {
            var row = arr[r];
            if (!row || row.note === undefined || row.note === null) continue;
            if (TR[t] === 'noi') {
              if (row.note !== '===' && (typeof row.note !== 'number' || row.note < 0 || row.note > 15))
                bad.push(k + ' pattern#' + i + ' noi row' + r + ' 週期索引不合法：' + row.note);
            } else if (typeof row.note === 'string' && row.note !== '===' && row.note !== '---' && toMidi) {
              var mv = toMidi(row.note);
              if (mv === null) bad.push(k + ' pattern#' + i + ' ' + TR[t] + ' row' + r + ' 音名無法解析：' + row.note);
              else if (mv < 21 || mv > 108) bad.push(k + ' pattern#' + i + ' ' + TR[t] + ' row' + r + ' 音高超出鋼琴範圍：' + row.note);
            }
          }
        }
      }
      for (i = 0; i < s.order.length; i++) {
        var e = s.order[i];
        for (t = 0; t < TR.length; t++) {
          var pi = e[TR[t]];
          if (pi === undefined || pi === null) continue;
          if (!s.patterns[pi]) bad.push(k + ' order#' + i + ' ' + TR[t] + ' 指向不存在的 pattern ' + pi);
          else if (!s.patterns[pi][TR[t]]) bad.push(k + ' order#' + i + ' ' + TR[t] + ' 指到的 pattern 沒有該軌');
        }
      }
    }
    for (k in SFX) {
      if (!Object.prototype.hasOwnProperty.call(SFX, k)) continue;
      if (PRIORITY[k] === undefined) bad.push('音效 ' + k + ' 不在優先權表');
      var d = SFX[k].data, n;
      for (n in d) {
        if (!Object.prototype.hasOwnProperty.call(d, n)) continue;
        if (n !== 'p2' && n !== 'noi') bad.push('音效 ' + k + ' 佔用了 ' + n + '（只允許 p2 / noi）');
        if (d[n].length > 60) bad.push('音效 ' + k + ' 的 ' + n + ' 長度 ' + d[n].length + ' 幀 > 60');
        if (!d[n][d[n].length - 1] || !d[n][d[n].length - 1].off) bad.push('音效 ' + k + ' 的 ' + n + ' 沒有以 {off:true} 收尾');
      }
    }
    return bad;
  }

  /* ================================================================== API */

  function driverOf(nes) {
    var n = nes || Audio._nes;
    if (n && n.music) return n.music;
    if (NES.Music && NES.Music._default) return NES.Music;
    return null;
  }

  // 未知 key / 未知音效只 warn 一次（每個名字一次），不要每幀洗版
  var WARNED = {};
  function warnOnce(msg) {
    if (WARNED[msg]) return false;
    WARNED[msg] = true;
    if (typeof console !== 'undefined' && console && typeof console.warn === 'function') console.warn(msg);
    return true;
  }

  var Audio = {
    ready: !!(NES.Music),
    SONGS: SONGS,
    SFX: SFX,
    INFO: INFO,
    PRIORITY: PRIORITY,
    KEYS: ['title', 'ground', 'cave', 'sky', 'castle', 'boss', 'invincible', 'clear', 'death', 'gameover'],
    NAMES: ['jump', 'stomp', 'coin', 'powerup', 'hurt', 'bump', 'goal', 'oneup', 'death'],
    current: null,
    playing: false,
    validate: validate,

    _nes: null,
    _groove: null,
    _gi: 0,

    // 註冊全部音效（冪等）；nes 會被記住，之後 play / sfx 可以不傳
    init: function (nes) {
      if (nes) Audio._nes = nes;
      var d = driverOf(nes);
      if (!d) return false;
      var ok = true, k;
      for (k in SFX) {
        if (!Object.prototype.hasOwnProperty.call(SFX, k)) continue;
        try { d.define(k, SFX[k]); } catch (e) { ok = false; }
      }
      return ok;
    },

    // play('ground' | 'cave' | ... )；jingle（clear / death / gameover）自動不 loop
    play: function (key, nes) {
      var d = driverOf(nes), s = SONGS[key];
      // 未知曲名以前是「靜默失敗」（qa2-star P2-2 就是這樣漏掉 title 的）⇒ 一律 warn 一次
      if (!s) { warnOnce('ST.Audio.play(): 沒有這首曲子 "' + key + '"（可用：' + Audio.KEYS.join(' / ') + '）'); return false; }
      if (!d) return false;
      try {
        d.play(s, { loop: !!s.playLoop });
        Audio.current = key;
        Audio.playing = true;
        Audio._groove = s.groove || null;
        Audio._gi = 0;
        return true;
      } catch (e) { return false; }
    },

    stop: function (nes) {
      var d = driverOf(nes);
      if (!d) return false;
      try {
        d.stop();
        if (d.stopSfx) d.stopSfx();
        Audio.playing = false;
        Audio.current = null;
        Audio._groove = null;
        return true;
      } catch (e) { return false; }
    },

    // sfx('jump' | 'coin' | ...)：優先權寫在 SFX 定義裡，搶 p2 / noi
    sfx: function (name, nes) {
      var d = driverOf(nes);
      if (!SFX[name]) { warnOnce('ST.Audio.sfx(): 沒有這個音效 "' + name + '"（可用：' + Audio.NAMES.join(' / ') + '）'); return false; }
      if (!d) return false;
      try { d.sfx(name); return true; } catch (e) {
        try { d.define(name, SFX[name]); d.sfx(name); return true; } catch (e2) { return false; }
      }
    },

    // 每幀一次，由 star-hero 的 update() 末尾呼叫
    tick: function (nes) {
      var d = driverOf(nes);
      if (!d) return false;
      try {
        var g = Audio._groove;
        // groove：每個 row 開頭換一次 speed（5 / 6 交替 → 平均 5.5 幀 = 163.6 BPM）
        if (g && d.playing && d.rowFrame === 0) {
          d.speed = g[Audio._gi % g.length];
          Audio._gi++;
        }
        d.tick();
        if (Audio.playing && d.playing === false) { Audio.playing = false; }   // jingle 播完
        return true;
      } catch (e) { return false; }
    },

    // 測試 / 除錯用：哪一軌被誰佔著

          song: Audio.current, playing: s.playing, row: s.row, orderIndex: s.orderIndex, speed: s.speed,
          sfx: s.sfx.map(function (x) { return x.name; }), owners: owners,
          p1: s.channels[0], p2: s.channels[1], tri: s.channels[2], noi: s.channels[3]
        };
      } catch (e) { return null; }
    }
  };

  /* ============================================ R3 star-w2：曲目可外掛
   * `games/star/song_w2.js` 用同一套工具寫世界 2 的曲，再 register 進來。
   * play(key) 的行為不變（未知 key 仍然 warn + 回 false）；main.js 會在切曲前先
   * 用 `ST.Audio.has(key)` 判斷，缺鍵就退回既有曲目（契約同 cruiser）。 */
  Audio.BUILD = {
    Builder: Builder, mel: mel, drm: drm, echoOf: echoOf, stab: stab, hold: hold,
    INST: INST, MIN: MIN, MAJ: MAJ, DOM7: DOM7, DIM: DIM

  Audio.has = function (key) { return !!SONGS[key]; };
  Audio.register = function (key, song, info) {
    var HZ = 60.0988, rows = 0, i;
    SONGS[key] = song;
    if (Audio.KEYS.indexOf(key) < 0) Audio.KEYS.push(key);
    for (i = 0; i < song.order.length; i++) rows += song.rows;
    var sp = song.groove ? (song.groove.reduce(function (a, v) { return a + v; }, 0) / song.groove.length) : song.speed;
    INFO[key] = info || {};
    INFO[key].speed = song.speed;
    INFO[key].groove = song.groove;
    INFO[key].rows = song.rows;
    INFO[key].order = song.order.length;

/*
 * games/star/hero.js — 《星塵勇者》主角：狀態機 + 物理 + 碰撞 + 動畫
 * ---------------------------------------------------------------------------
 * 擁有者：star-hero agent ｜ 依賴：engine/fixed.js（NES.FX / NES.FX.SMB）、engine/input.js
 * 契約：docs/TASKS.md「R2b §契約 / 主角」、docs/ENGINE_API.md §3（FX 與 SMB 跳躍規則）、§4（Input）
 *
 * 物理**全部**走 `NES.FX.SMB`（SMBDIS.ASM 反組譯常數 + R1 fix1 定案的唯一一套跳躍規則）：
 *   長按靜止跳 64.00 px（4 格）、全速跑跳 80.00 px（5 格）、點按 1 幀 19.6875 px
 *   （起跳首幀半格重力 `skipGravityFirstFrame`；games/demo 與 tools/test_core.py 量到同一組數字）
 *
 * 每幀順序（與 games/demo/main.js 相同，手感才會一致）：
 *   ① 讀輸入 → ② 水平加速 / 摩擦（B 跑、轉身 ×2）→ ③ 起跳 `SMB.jumpStart`
 *   → ④ 重力 `SMB.jumpGravity`（首幀半格）→ ⑤ 移動 X + 磚碰撞 → ⑥ 移動 Y + 磚碰撞

 *   → ⑦ 危險磚（尖刺受傷 / 熔岩死亡）與互動磚（金幣 / GOAL）掃描 → ⑧ 狀態機 → ⑨ 動畫
 *
 * 斜坡：`ST.solidKind` 若回報 'slopeL' / 'slopeR'，本版**一律當成整塊 solid**處理
 *   （不做逐像素爬坡）。理由與追蹤見 docs/PROGRESS.md「star-hero（R2b）§已知問題」。
 *
 * 與 main.js 的介面：`update(h, g)` 的 `g` 必須提供
 *   input, cols, tileAt(col,row), kindAt(col,row), isLava(tile),
 *   onTouch(col,row,tile)（金幣 / GOAL 等互動，由 main 處理），
